syntax = "proto3";

package github.common.v1;

// HTML that has already been sanitized server-side and is safe to render
// without further escaping on the client. Mirrors Rails' SafeHtml concept.
//
// Use this in place of `string` whenever a field's value will be inserted
// into the DOM as HTML. Distinct from `google.protobuf.StringValue` so the
// type system signals the safety contract; the wire encoding is the same
// shape (`{"value": "..."}` in proto3 JSON).
message SafeHtml {
  string value = 1;
}
