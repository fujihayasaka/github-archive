syntax = "proto3";

package github.repos.tree.v1;

import "common/v1/safe_html.proto";

// Payload describing per-entry commit information for a directory listing,
// as returned alongside the tree view's React payload.
//
// Defined by Repos::TreePayloadHelper#commit_info_payload_proto.
//
// `short_message_html_link` is a message (not a scalar) so its absence —
// when the underlying commit has an empty message — stays distinguishable
// on the wire from an empty string.
message CommitInfoPayload {
  // Keyed by directory entry name (the content's display name). Order is not
  // significant on the wire; clients reconstruct ordering from the directory
  // listing.
  map<string, CommitInfo> entries = 1;
}

message CommitInfo {
  string oid = 1;
  string url = 2;
  string date = 3;
  github.common.v1.SafeHtml short_message_html_link = 4;
}
