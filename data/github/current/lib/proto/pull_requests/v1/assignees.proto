syntax = "proto3";

package github.pull_requests.v1;

// Response payload for
// GET /:owner/:repo/pull/:number/page_data/assignees
//
// Defined by PullRequests::PageData::SharedController#assignees.
message AssigneesResponse {
  repeated Assignee assignees = 1;
}

message Assignee {
  int64 id = 1;
  string display_login = 2;
  string avatar_url = 3;
}
