syntax = "proto3";

package github.pull_requests.v1;

import "google/protobuf/wrappers.proto";

// Response payload for
// GET /:owner/:repo/pull/:number/page_data/diffstat
//
// Defined by PullRequests::PageData::SharedController#diffstat.
//
// Wrapper types are used because the controller rescues GitRPC::Error and
// renders the response with nil values, which must be representable as JSON
// `null` distinctly from `0`.
message DiffstatResponse {
  Diffstat diffstat = 1;
}

message Diffstat {
  google.protobuf.Int32Value lines_added = 1;
  google.protobuf.Int32Value lines_deleted = 2;
  google.protobuf.Int32Value lines_changed = 3;
}
