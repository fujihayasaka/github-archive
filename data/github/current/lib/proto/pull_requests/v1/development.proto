syntax = "proto3";

package github.pull_requests.v1;

// Response payload for
// GET /:owner/:repo/pull/:number/page_data/development
//
// Defined by PullRequests::PageData::SharedController#development.
message DevelopmentResponse {
  repeated LinkedIssue linked_issues = 1;
}

// Open/closed state of a linked issue. The legacy JSON encodes this as the
// upper-cased state string ("OPEN"/"CLOSED").
enum IssueState {
  ISSUE_STATE_UNSPECIFIED = 0;
  ISSUE_STATE_OPEN = 1;
  ISSUE_STATE_CLOSED = 2;
}

// Why a linked issue is in its current state. UNSPECIFIED represents the
// legacy JSON null (no reason recorded).
enum IssueStateReason {
  ISSUE_STATE_REASON_UNSPECIFIED = 0;
  ISSUE_STATE_REASON_COMPLETED = 1;
  ISSUE_STATE_REASON_DUPLICATE = 2;
  ISSUE_STATE_REASON_NOT_PLANNED = 3;
  ISSUE_STATE_REASON_REOPENED = 4;
}

message Repository {
  string owner = 1;
  string name = 2;
}

message LinkedIssue {
  int64 id = 1;
  int32 number = 2;
  string title = 3;
  string url = 4;
  IssueState state = 5;
  IssueStateReason state_reason = 6;
  Repository repository = 7;
}
