syntax = "proto3";

package github.pull_requests.v1;

// Response payload for
// GET /:owner/:repo/pull/:number/page_data/labels
//
// Defined by PullRequests::PageData::SharedController#labels.
message LabelsResponse {
  repeated PullRequestLabel labels = 1;
}

// Named `PullRequestLabel` rather than `Label` to avoid colliding with the
// minimal `Label` (name + color only) already defined in timeline.proto;
// message names share the `github.pull_requests.v1` package namespace.
message PullRequestLabel {
  int64 id = 1;
  string name = 2;
  string color = 3;
  // Label description; absent when the legacy JSON value is null or empty.
  string description = 4;
}
