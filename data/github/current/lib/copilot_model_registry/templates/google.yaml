  family: PLACEHOLDER
  tokenizer: google
  supports:
    dimensions: false
    parallelToolCalls: true
    streaming: true
    structuredOutputs: false
    toolCalls: true
    vision: true
    minThinkingBudget: 256
    maxThinkingBudget: 32000
