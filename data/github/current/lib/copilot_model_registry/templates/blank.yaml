# yamllint disable rule:comments rule:comments-indentation rule:line-length
---
# ------------------------------------------------------------------------------
# Model Registry Definition
# This file describes a model that can be registered and surfaced via the
# Copilot API /models endpoint and internal selection logic.
# Replace every CHANGEME and verify any enumerated values.
# ------------------------------------------------------------------------------
id: PLACEHOLDER                # Unique and should be generated by the script.
referenceID: PLACEHOLDER   # Serves as the Model ID in CAPI (i.e. the model identifier that gets sent up with inference requests).
policyID: PLACEHOLDER      # Policy governing access (e.g. obmb, gpt41, o3, etc.). It is the access control key for user permissions in the monolith.
version: PLACEHOLDER       # Versioned identifier (often same as id for versioned models).
modelAvailability: partial-ga   # Required: 'ga', 'partial-ga', 'experimental', or 'model-lab'. Pick based on rollout stage.
name: CHANGEME                  # Human-readable display name (shown in /models). Avoid version/date unless version-specific entry.
isPreview: true                 # true if covered by preview terms; set false for GA/non-preview models.
vendor: CHANGEME                # Vendor string. Common values: "Azure OpenAI", "OpenAI", "Anthropic", "Google", "xAI", "Cerebras", "Fireworks", etc.
isModelPickerEnabled: true      # Whether this model appears in model picker UX. false hides it (still callable if allowed).
modelPickerCategory: versatile  # One of: lightweight | versatile | powerful. Drives UI grouping. Leave empty for no category.
documentationLink: "https://github.com"     # Optional external or internal docs URL.
documentationLinkText: "Learn more."        # Display text for the documentation link.

inlineApproval:                 # Inline approval metadata; set enabled true and fill terms if policy requires inline acceptance.
  enabled: false                # true if the model’s policy requires explicit acceptance.
  terms: ""                     # Markdown or text of terms (if enabled is true). Leave empty if not used.

tokensPerMinute:        # Mandatory section on token allocation through integrator categories.
  overall: 5000000      # 5000000 is typical for evals. Rollback to 1000000 for production models.
  # percentage: The share of `overall` tokens allocated to this category (0–100).
  #   Setting percentage to 999 grants unlimited TPM for that category (i.e. no rate limit is enforced).
  integratorCategories:
    - name: "prelaunch-evals"
      percentage: 100
    - name: "vscode"
      percentage: 999 # Unlimited
    - name: "ccr"
      percentage: 10
    - name: "cca"
      percentage: 10
    - name: "tier1"
      percentage: 50
    - name: "tier2"
      percentage: 25
    - name: "tier3"
      percentage: 10

supportedEndpoints:             # Enumerate API endpoint capabilities. Only include those actually supported.
  - "/chat/completions"         # Chat-style interface (OpenAI-compatible).
  - "/responses"                # Structured responses endpoint (if the model supports function calling / JSON outputs).
  # - "/embeddings"             # Uncomment if model supports embeddings (and capabilities.type should reflect embeddings).
  # - "/v1/messages"             # Uncomment if model supports /v1/messages endpoint.

capabilities:
  type: chat                    # Model type: chat | completion | embeddings. Must align with internal schema.ModelType.
  family: PLACEHOLDER      # Internal family identifier (e.g. gpt-5, gpt-4o-mini, claude-sonnet-4). Drives policy & feature logic.
  tokenizer: o200k_base         # Tokenizer identifier (e.g. cl100k_base, o200k_base, api_anthropic, google). Match real tokenizer.
  supports:                     # Feature toggles describing runtime capabilities.
    dimensions: true            # true only for embeddings models that allow custom dimensions. Usually false for chat models.
    parallelToolCalls: true     # true if multiple tool/function calls may be returned concurrently.
    streaming: true             # true to support incremental token streaming.
    structuredOutputs: true     # true if model can natively produce constrained / JSON outputs.
    toolCalls: true             # true if function/tool invocation is supported.
    # vision: true              # Add if vision is supported AND vision limits below are meaningful.
    # adaptiveThinking: true    # Optional. true if model supports adaptive thinking mode.
    # minThinkingBudget: 0      # Optional (for "thinking" models). Provide int32 if model supports reasoning budgets.
    # maxThinkingBudget: 0
  limits:                       # HARD runtime limits (actual enforced ceiling). These should NOT exceed provider capability.
    maxInputs: 8192             # For embeddings only: maximum number of input strings in one request. Set 0 for non-embeddings.
    maxPromptTokens: 8192       # Maximum input tokens (prompt portion). Must be <= maxContextWindowTokens.
    maxContextWindowTokens: 8192  # Total (prompt + output). Ensure >= (maxPromptTokens + maxOutputTokens).
    maxOutputTokens: 8192       # Maximum tokens the model may generate for output.
    # maxNonStreamingOutputTokens: 8192  # Maximum tokens for non-streaming requests (optional). When not set or 0, consuming services should default to maxOutputTokens. Anthropic specific key.
    vision:                     # Vision limits (include only if supports vision).
      maxPromptImages: 1        # Max number of images per request (token-based constraints may still apply).
      maxPromptImageSize: 3145728  # Max bytes per image (3 * 1024 * 1024 typical).
      supportedMediaTypes:      # Allowed MIME types; remove ones not supported by provider.
        - image/jpeg
        - image/png
        - image/webp
        - image/bmp
        - image/gif
        # Remove formats not supported (e.g. bmp often not supported by some vendors).
    overrides: []               # Optional list of conditional limit overrides (first matching applies). Leave empty if unused.
  advertisedLimits:             # SOFT / public-facing limits (what clients see). Often lower than hard limits for safety.
    maxInputs: 8192
    maxPromptTokens: 8192
    maxContextWindowTokens: 8192
    maxOutputTokens: 8192
    # maxNonStreamingOutputTokens: 8192  # Maximum tokens for non-streaming requests (optional). Anthropic specific key.
    vision:
      maxPromptImages: 1
      maxPromptImageSize: 3145728
      supportedMediaTypes:
        - image/jpeg
        - image/png
        - image/webp
        - image/bmp
        - image/gif
    overrides: []               # Typically keep empty unless marketing a subset capability.

billing:
  integrationSkuOverride: []    # List of integration IDs that bypass RestrictedTo plan checks. Use sparingly.
  restrictedTo:                 # Copilot plans allowed. Common keys: free | pro | pro_plus | business | enterprise | max
    - "pro"
    - "pro_plus"
    - "edu" # edu plan should be included wherever we include the pro plan for now. See https://github.com/github/copilot-api/issues/26440
    - "business"
    - "enterprise"
  multiplier: 1.0               # Billing multiplier (relative cost weight). 0 for free, fractional (<1) for discounted, >1 for premium.
  tokensPerCostUnit: 0          # Number of tokens per cost unit for billing. 0 means not set.
  inputTokenPricePerCostUnit: 0.0         # Price per cost unit for input tokens.
  cacheReadTokenPricePerCostUnit: 0.0     # Price per cost unit for cache read tokens.
  cacheCreationTokenPricePerCostUnit: 0.0 # Price per cost unit for cache creation tokens.
  outputTokenPricePerCostUnit: 0.0        # Price per cost unit for output tokens.

# ------------------------------------------------------------------------------
# Feature Flags
# ------------------------------------------------------------------------------
featureFlag: model_registry_dotcom_PLACEHOLDER  # Primary flag for dotcom and required for entity to view this model. https://devportal.githubapp.com/feature-flags/model_registry_dotcom_PLACEHOLDER/overview
skipPolicyFeatureFlag: model_registry_skip_policy_PLACEHOLDER  # Feature flag to skip policy checks, if applicable. https://devportal.githubapp.com/feature-flags/model_registry_skip_policy_PLACEHOLDER/overview
warningMessageFeatureFlags:
  featureFlagWarningMessageHighUsage: copilot_api_model_warning_message_high_usage_PLACEHOLDER # https://devportal.githubapp.com/feature-flags/copilot_api_model_warning_message_high_usage_PLACEHOLDER/overview
  featureFlagWarningMessageDegradedPerformance: copilot_api_model_warning_message_degraded_performance_PLACEHOLDER # https://devportal.githubapp.com/feature-flags/copilot_api_model_warning_message_degraded_performance_PLACEHOLDER/overview
  featureFlagWarningMessageDegradedPerformanceProvider: copilot_api_model_warning_message_degraded_performance_provider_PLACEHOLDER # https://devportal.githubapp.com/feature-flags/copilot_api_model_warning_message_degraded_performance_provider_PLACEHOLDER/overview
visibleFeatureFlagChecks:       # Alternative visibility gating (ignored if featureFlag or user FF map present in code path).
  # WARNING: this feature flag has NO conditions, so be careful enabling it globally, per integration, or per users.
  - flagName: model_registry_PLACEHOLDER_rollout  # Full rollout
    conditions:
      requiresValidHmac: false  # true to require HMAC-authenticated integration; false for general rollout.
      integrationsAllowList: []   # Leave empty to allow all integrations.
      integrationCategoriesAllowList:
        ##  HMAC exempt integrations should NEVER be a part of this category
        # - prelaunch-evals # CategoryPreLaunchEvals is a category for pre-launch integrators.
        # - vscode # CategoryVSCode is a category for VSCode.
        # - cca # CategoryCCA is a category for Copilot Chat Assistants.
        # - ccr # CategoryCCR is a category for Copilot Code Review.
        # - tier1 # CategoryTier1 is a category for all tier 1 integrators excluding VS Code.
        # - tier2 # CategoryTier2 is a category for tier 2 integrators.
        # - tier3 # CategoryTier3 is a category for tier 3 integrators.
        # - third-party # CategoryThirdParty is a category for third party integrators.
        # - third-party-mcp # CategoryThirdPartyMCP is a category for third party MCP integrators.
        ##  CategoryUncategorized is a category for integrators that do not fit into any of the above categories.
        ##  It has an empty string value to serve as the default zero value.
        # - ""
  - flagName: model_registry_PLACEHOLDER_prelaunch # Pre launch https://devportal.githubapp.com/feature-flags/model_registry_PLACEHOLDER_prelaunch/overview
    conditions:
      requiresValidHmac: false  # true to require HMAC-authenticated integration; false for general rollout.
      # integrationsAllowList: []   # Leave empty to allow all integrations.
      integrationCategoriesAllowList:
        ##  HMAC exempt integrations should NEVER be a part of this category
        - prelaunch-evals # CategoryPreLaunchEvals is a category for pre-launch integrators.
  - flagName: model_registry_PLACEHOLDER_vscode # VS Code https://devportal.githubapp.com/feature-flags/model_registry_PLACEHOLDER_vscode/overview
    conditions:
      requiresValidHmac: false  # true to require HMAC-authenticated integration; false for general rollout.
      integrationsAllowList:
        - vscode-chat
  - flagName: model_registry_PLACEHOLDER_tier_1 # Tier 1 https://devportal.githubapp.com/feature-flags/model_registry_PLACEHOLDER_tier_1/overview
    conditions:
      requiresValidHmac: false  # true to require HMAC-authenticated integration; false for general rollout.
      # integrationsAllowList: []   # Leave empty to allow all integrations.
      integrationCategoriesAllowList:
        - tier1 # CategoryTier1 is a category for all tier 1 integrators excluding VS Code.
  - flagName: model_registry_PLACEHOLDER_tier_2 # Tier 2 https://devportal.githubapp.com/feature-flags/model_registry_PLACEHOLDER_tier_2/overview
    conditions:
      requiresValidHmac: false  # true to require HMAC-authenticated integration; false for general rollout.
      # integrationsAllowList: []   # Leave empty to allow all integrations.
      integrationCategoriesAllowList:
        - tier2 # CategoryTier2 is a category for tier 2 integrators.
  - flagName: model_registry_PLACEHOLDER_tier_3 # Tier 3 https://devportal.githubapp.com/feature-flags/model_registry_PLACEHOLDER_tier_3/overview
    conditions:
      requiresValidHmac: false  # true to require HMAC-authenticated integration; false for general rollout.
      # integrationsAllowList: []   # Leave empty to allow all integrations.
      integrationCategoriesAllowList:
        - tier3 # CategoryTier3 is a category for tier 3 integrators.

endpoints:                      # One or more concrete deployment backends with routing weights.
  - name: CHANGEME-eastus2-whirlpool   # Unique deployment name; include region for clarity.
    provider: azure_openai             # Provider key (azure_openai | openai | anthropic | google | xai | registry_custom).
    featureFlag: model_registry_enable_model_PLACEHOLDER_CHANGEME_eastus2  # Specific endpoint rollout flag.
    supportedAPIs:
      - ChatCompletions
      # - Messages
      # - Responses
      # - Embeddings
    routingWeight: 100                 # Relative weighting (0–100). If multiple endpoints exist, weights are normalized.
    secretName: AZURE_ENDPOINT_SECRET_EASTUS2_WHIRLPOOL  # Secret key containing credentials / endpoint keys.
    capacity:
      type: hybrid                  # Capacity type: paygo | provisioned | hybrid.
    url: https://copilot-chat2-eastus2.openai.azure.com/openai/deployments/capi-eus2-ptuc-h200-blastoise  # Full endpoint URL.
    gpu: unknown
    region:
      fullName: eastus2                # Human-readable region identifier.
      shortName: eus2                  # Short region code used in logs or metrics.
      provider: azure_openai           # Provider again (can differ if multi-cloud abstraction exists).
