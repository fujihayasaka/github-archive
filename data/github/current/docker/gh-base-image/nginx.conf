worker_processes 1;
pid /run/nginx.pid;

# GHES previously ran this in via systemd. Since we're in a container now, don't daemonize so the container stays up
daemon off;

worker_rlimit_nofile 10000;

events {
  worker_connections 16384;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $cookie_dotcom_user [$time_local] '
                  '"$request" $status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  '$request_time $upstream_response_time $pipe';

  access_log /var/log/nginx/access_log main;
  error_log /var/log/nginx/error_log error;

  sendfile on;
  tcp_nopush on;

  gzip              on;
  gzip_http_version 1.0;
  gzip_comp_level   2;
  gzip_proxied      any;
  gzip_buffers      16 8k;
  gzip_types        text/plain text/css application/x-javascript text/xml application/json application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

  # .com is mucking with this for pages
  server_names_hash_bucket_size 128;
  server_names_hash_max_size 20000;
  proxy_headers_hash_bucket_size 128;
  proxy_headers_hash_max_size 20000;

  proxy_buffers 10 8k;
  proxy_buffer_size 16k;

  # Ensure that nginx won't timeout before haproxy's `timeout client` does
  send_timeout 130s;

  large_client_header_buffers 4 32k;

  underscores_in_headers on;

  server_tokens off;

  upstream github_upstream {
    server localhost:4327 fail_timeout=0;
  }


  server {

    listen 0.0.0.0:9100 default_server;
    listen [::1]:9100 default_server ipv6only=on;

    listen 0.0.0.0:1336 default_server; # enterprise local access port
    listen [::]:1336 default_server ipv6only=on;

    # server_name <%= "#{github_hostname}" %>;
    # server_name <%= "#{assets_hostname} #{uploads_hostname}" %>;

    client_max_body_size 1g;

    # Setup path for private mode authentication.
    #
    # WARNING: This include needs to be above other includes and location blocks
    # so the auth request locations aren't hijacked by another location.
    
    # include /etc/nginx/private_mode_server_include.conf; # FIXME mounting this from host to start

    # # FIXME going to mount these to start
    # include /etc/nginx/common/maint_page.conf; # FIXME mounting this from host to start
    # include /etc/nginx/common/error_pages.conf; # FIXME mounting this from host to start

    root /github/public;
    try_files $uri /index.html @github;

    location ~ ^/(static/|favicon-enterprise.ico$) {
      add_header Access-Control-Allow-Origin *;
    }

    location ^~ /assets/ {
      expires max;
      add_header Cache-Control public;
      # FIXME unknown variable
      # add_header Access-Control-Allow-Origin "$assets_origin_value";
      add_header Vary Origin;
      add_header Access-Control-Allow-Credentials true;

      root /github/public;
    }

    location ^~ /static/javascripts/ {
      # FIXME unknown variable
      # add_header Access-Control-Allow-Origin "$assets_origin_value";
      add_header Access-Control-Allow-Credentials true;
      add_header Vary Origin;
    }

    # FIXME need to figure out what to do about these. we wouldn't have access to the upstreams (necessarily???)
    # apps and service routes go in here.
    # include /etc/nginx/sites-enabled/github_includes/*.conf;

    location @github {
      proxy_set_header Host $http_host;
      proxy_pass http://github_upstream;
    }
  }
}
