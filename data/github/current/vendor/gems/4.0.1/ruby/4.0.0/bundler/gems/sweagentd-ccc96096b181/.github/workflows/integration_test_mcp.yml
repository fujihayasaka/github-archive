name: "Test Copilot Coding Agent with MCP Capability"

on:
  workflow_call:
    secrets:
      token:
        required: true
      datadog_api_key:
        required: true
    inputs:
      repo_name:
        required: true
        type: string
      reporting_id:
        required: true
        type: string
      issue_number:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create Job that Requires MCP
        id: create-job
        run: |
          response=$(curl --fail-with-body https://api.githubcopilot.com/agents/swe/v1/jobs/github/${{ inputs.repo_name }} -X POST -H "Authorization: Bearer $GH_TOKEN" -d '{"problem_statement": "Read issue #${{ inputs.issue_number }} in this repository and create a file called mcp-test.txt containing ONLY the exact text from the issue body, nothing else."}')
          session_id=$(echo "$response" | jq -r '.session_id')
          echo "Created coding agent session $session_id"
          echo "session_id=$session_id" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.token }}

      - name: Wait for agent to complete
        id: wait_for_cca
        timeout-minutes: 15
        uses: ./.github/actions/wait_for_cca
        with:
          token: ${{ secrets.token }}
          session_id: $session_id

      - name: Validate session billing (premium_requests)
        id: validate_session
        uses: ./.github/actions/validate_session
        with:
          token: ${{ secrets.token }}
          session_id: $session_id

      - name: Validate PR contains expected MCP content
        id: validate_pr_content
        run: |
          echo "Validating PR content for session: $session_id"

          # Get PR ID from session
          if ! response=$(curl -s --fail-with-body https://api.githubcopilot.com/agents/sessions/$session_id \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Copilot-Integration-Id: playground-dev"); then
            echo "❌ Failed to fetch session"
            exit 1
          fi

          pull_request_id=$(echo "$response" | jq -r '.resource_id')

          # Validate pull_request_id is not null or empty
          if [ -z "$pull_request_id" ] || [ "$pull_request_id" = "null" ]; then
            echo "❌ Error: Session resource_id is null or empty. The agent may not have created a PR."
            echo "Session response: $response"
            exit 1
          fi

          echo "Found pull request ID: $pull_request_id"

          # Get recent open PRs (limited to 10, sorted by creation date desc) to find the matching one
          # This is more targeted than fetching all PRs since our test PR was just created
          if ! recent_prs=$(curl -s --fail-with-body -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/github/${{ inputs.repo_name }}/pulls?state=open&per_page=10&sort=created&direction=desc"); then
            echo "❌ Failed to fetch PRs list"
            exit 1
          fi

          # Find PR number and head SHA by matching the ID
          pr_data=$(echo "$recent_prs" | jq -r --arg id "$pull_request_id" '.[] | select(.id == ($id | tonumber))')

          if [ -z "$pr_data" ]; then
            echo "❌ Error: Could not find PR with ID $pull_request_id in recent PRs"
            exit 1
          fi

          pull_request_number=$(echo "$pr_data" | jq -r '.number')
          head_sha=$(echo "$pr_data" | jq -r '.head.sha')

          echo "Found PR #$pull_request_number with head SHA: $head_sha"

          # Get file content from PR branch
          file_response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/github/${{ inputs.repo_name }}/contents/mcp-test.txt?ref=$head_sha")

          http_code=$(echo "$file_response" | tail -n1)
          file_content=$(echo "$file_response" | sed '$d')

          if [ "$http_code" != "200" ]; then
            echo "❌ Failed to fetch file mcp-test.txt (HTTP $http_code)"
            echo "Response: $file_content"
            exit 1
          fi

          echo "File content retrieved:"
          echo "$file_content"

          # Check if expected content is present using fixed string matching (grep -F)
          if echo "$file_content" | grep -qF "SECRET_CODE_MCP_TEST_ABC123"; then
            echo "✅ PR content validation passed"
            echo "Found expected content in mcp-test.txt"
          else
            echo "❌ PR content validation failed"
            echo "Expected to find: SECRET_CODE_MCP_TEST_ABC123"
            echo "Actual content: $file_content"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.token }}

      - id: cleanup_pr
        uses: ./.github/actions/cleanup_pr
        if: steps.create-job.outcome == 'success'
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          repo_name: ${{ inputs.repo_name }}

      - id: notify_datadog
        if: ${{ github.event_name == 'schedule' && always() }}
        uses: ./.github/actions/notify_datadog
        with:
          datadog_api_key: ${{ secrets.datadog_api_key }}
          job_status: ${{ job.status }}
          test_type: ${{ inputs.reporting_id }}
          test_name: "MCP Integration Test"
