bases:
  - ../../_base/

resources:
  - servicemeshconfigs/config.yaml
  - resource-quota.yaml

components:
  - ../../components/logging

patchesStrategicMerge:
  - config_maps/environment.yaml
  - services/api.yaml

patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "1Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "2Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "500m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "4000m"
      - op: add
        path: /metadata/annotations/moda.github.net~1canary-v2
        value: "true"
      - op: add
        path: /metadata/annotations/moda.github.net~1canary-label
        value: "canary"
  - target:
      kind: Deployment
      name: aqueduct-worker
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "512Mi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "1Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "250m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "2000m"
      - op: replace
        path: /spec/replicas
        value: 5
  - target:
      kind: Deployment
      name: push-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Deployment
      name: actions-compute-usage-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
