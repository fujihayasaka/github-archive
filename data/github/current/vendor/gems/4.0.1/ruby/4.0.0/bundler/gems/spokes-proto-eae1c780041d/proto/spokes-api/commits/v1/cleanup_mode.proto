syntax = "proto3";

package github.spokes.commits.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/commits";
option ruby_package = "GitHub::Spokes::Proto::Commits::V1";

// CleanupMode defines how to clean up the commit message.
enum CleanupMode {
    // CLEANUP_MODE_INVALID is the default enum value and should not be
    // used.
    CLEANUP_MODE_INVALID = 0;

    // CLEANUP_MODE_WHITESPACE strips leading and trailing empty lines,
    // trailing whitespace, and collapses consecutive empty lines. 
    CLEANUP_MODE_WHITESPACE = 1;

    // CLEANUP_MODE_VERBATIM does not modify the commit message.
    CLEANUP_MODE_VERBATIM = 2;
}
