syntax = "proto3";

package hydro.schemas.blackbird.v0.entities;

option java_package = "com.github.hydro.schemas.blackbird.v0.entities";
option csharp_namespace = "GitHub.Hydro.Schemas.Blackbird.V0.Entities";

// The mode corresponding to a given epoch.
enum EpochMode {
  EPOCH_MODE_UNKNOWN = 0;
  LEXICAL = 1; // Lexical code search only.
  EMBEDDINGS_GRAPH = 3; // Embeddings only (graph indices).
  HYBRID_GRAPH = 5; // Hybrid graph mode: embeddings (graph indices) and lexical/code, sharded by content/path. Used in Proxima and local dev.
  VOYAGE_3_EMBEDDINGS = 6; // Voyage-3 embeddings only (graph indices).
  VOYAGE_3_HYBRID = 7; // Hybrid mode with voyage-3 embeddings and lexical indices. Graph indices, sharded by content/path. Used in Proxima.
  METIS_EMBEDDINGS = 8; // Metis embeddings only (graph indices).
  METIS_HYBRID = 9; // Hybrid mode with metis embeddings and lexical indices. Graph indices, sharded by content/path. Used in Proxima.
  EXTERNAL_METIS_EMBEDDINGS = 10; // External (non-GitHub) content, Metis embeddings only.

  reserved 2; // [Deprecated] Embeddings only. Use EMBEDDINGS_GRAPH instead.
  reserved 4; // [Deprecated] Hybrid mode: embeddings and lexical/code, sharded by content/path. Use HYBRID_GRAPH instead.
}
