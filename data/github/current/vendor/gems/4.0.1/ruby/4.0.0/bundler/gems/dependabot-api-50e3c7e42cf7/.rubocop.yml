inherit_from:
  - .rubocop_strict.yml   # Add any new configuration to this file
  - .rubocop_todo.yml     # Regenerate using `script/lint --regenerate-todo`

AllCops:
  NewCops: pending

Naming/BlockForwarding:
  Exclude:
    - 'app/jobs/application_job.rb'
    - 'app/models/directories.rb'
    - 'lib/dependabot/logger.rb'
    - 'lib/throttler.rb'
    - 'lib/timer_daemon.rb'

Style/ArgumentsForwarding:
  Exclude:
    - 'app/jobs/application_job.rb'
    - 'app/models/directories.rb'
    - 'lib/dependabot/logger.rb'
    - 'lib/throttler.rb'
    - 'lib/timer_daemon.rb'
    - 'app/actions/dispatch_updater.rb'
    - 'app/actions/run_updater.rb'
    - 'lib/stafftools/cli.rb'
    - 'lib/dog_metrics.rb'
    - 'lib/enterprise_metrics.rb'
