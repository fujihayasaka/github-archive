apiVersion: apps/v1
kind: Deployment
metadata:
  name: sweagentd
spec:
  replicas: 6
  selector:
    matchLabels:
      app: sweagentd
  template:
    metadata:
      labels:
        app: sweagentd
      annotations:
        fluentbit.io/parser: logfmt
        observability.github.com/splunk_index: sweagentd
        moda.github.net/opt-out-resource-quotas: "true"
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: sweagentd
          image: sweagentd
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi
          envFrom:
            - configMapRef:
                name: application-config
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          env:
            # Moda metadata
            - name: KUBE_CONTAINER_NAME
              value: "sweagentd"
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_SHA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['heaven.githubapp.com/sha']
            - name: APP_REF
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['heaven.githubapp.com/ref']
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: sweagentd
                  resource: limits.cpu
            - name: STATS_ADDR
              value: "$(KUBE_NODE_HOSTNAME):28125"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            exec:
              command:
                - cat
                - /tmp/consumer_healthy
            initialDelaySeconds: 5
            periodSeconds: 5
