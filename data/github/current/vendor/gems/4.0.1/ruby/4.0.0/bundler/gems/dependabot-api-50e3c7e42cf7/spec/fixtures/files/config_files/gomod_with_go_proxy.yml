version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - jfrog-goproxy

registries:
  jfrog-goproxy:
    type: goproxy-server
    url: https://company.jfrog.io/artifactory/api/go/go-virtual
    username: ${{secrets.JFROG_USERNAME}}
    password: ${{secrets.JFROG_PASSWORD}}