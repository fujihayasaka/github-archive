version: 2
registries:
  github-acme:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.MY_GITHUB_PERSONAL_TOKEN}}
updates:
  - package-ecosystem: "mix"
    directory: "/"
    registries:
      - github-acme
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
