syntax = "proto3";

package github.secretscanning.discussions.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/discussions";
option ruby_package = "GitHub::Proto::SecretScanning::Discussions::V1";

import "discussions/v1/discussion.proto";

// DiscussionAPI defines the service to retrieve and handle discussions for
// the Secret Scanning Service.
service DiscussionAPI {
  // ListDiscussions retrieves a list of the discussions in a repository
  rpc ListDiscussions(ListDiscussionsRequest) returns (ListDiscussionsResponse);

  // StreamDiscussionContent streams all content associated with a discussion
  rpc StreamDiscussionContent(StreamDiscussionContentRequest) returns (stream StreamDiscussionContentResponse);
}

enum DiscussionContentType{
  UNKNOWN = 0;
  BODY = 1;
  TITLE = 2;
  COMMENT = 3;
 }

message DiscussionContent {
  // the content to be scanned
  bytes content = 1;

  // the type of content we're scanning
  DiscussionContentType type = 2;

  // the identifier for the content
  int64 id = 3;

  // the revision of the content
  int64 revision = 4;
}

message StreamDiscussionContentRequest {
  // repo_id is the ID of the repository to look up (required)
  int64 repo_id = 1;

  // discussion_number is the repo-scoped number of the discussion to look up. (required)
  int64 discussion_number = 2;

  // cursor represents an opaque object to be used to identify where to continue on a stream of discussion content
  StreamDiscussionContentResponseCursor cursor = 3;
}

message StreamDiscussionContentResponse {
  // the streamed content
  repeated DiscussionContent contents = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of discussion content.
  StreamDiscussionContentResponseCursor next_cursor = 2;
}

message StreamDiscussionContentResponseCursor {
  DiscussionContentType content_type = 1;
  repeated StreamDiscussionCursorValue cursors = 2;
}

message StreamDiscussionCursorValue {
  int64 last_id = 1;
  int64 revision = 2;
}

message ListDiscussionsRequest {
    // repo_id is the ID of the repository to look up. (required) */
    int64 repo_id = 1;

    // cursor represents an opaque object to be used to identify where to continue on a stream of discussion numbers.
    bytes cursor = 2;
}

message ListDiscussionsResponse {
    // the identifiers for a list of discussions in this repo
    repeated DiscussionIdentifier identifiers = 1;

    // next_cursor represents an opaque object to be used to identify where to continue on a stream of discussion numbers.
    bytes next_cursor = 2;
}
