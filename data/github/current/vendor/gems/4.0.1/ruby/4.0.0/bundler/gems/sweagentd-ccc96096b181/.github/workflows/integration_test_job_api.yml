name: "Test Copilot Coding Agent Job API"

on:
  workflow_call:
    secrets:
      token:
        required: true
      datadog_api_key:
        required: true
    inputs:
      repo_name:
        required: true
        type: string
      reporting_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create Job
        id: create-job
        run: |
          response=$(curl --fail-with-body https://api.githubcopilot.com/agents/swe/v1/jobs/github/${{ inputs.repo_name }} -X POST -H "Authorization: Bearer $GH_TOKEN" -d '{"problem_statement": "create a file titled \"Test Job API: Run ${{ github.run_id }}\", and in it write \"run successful\""}')
          session_id=$(echo "$response" | jq -r '.session_id')
          echo "Created coding agent session $session_id"
          echo "session_id=$session_id" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.token }}
      - id: wait_for_cca
        timeout-minutes: 15
        uses: ./.github/actions/wait_for_cca
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
      - id: validate_session
        uses: ./.github/actions/validate_session
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
      - id: cleanup_pr
        uses: ./.github/actions/cleanup_pr
        if: steps.create-job.outcome == 'success'
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          repo_name: ${{ inputs.repo_name }}
      - id: notify_datadog
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: ./.github/actions/notify_datadog
        with:
          datadog_api_key: ${{ secrets.datadog_api_key }}
          job_status: ${{ job.status }}
          test_type: ${{ inputs.reporting_id }}
          test_name: "Job API Integration Test"
