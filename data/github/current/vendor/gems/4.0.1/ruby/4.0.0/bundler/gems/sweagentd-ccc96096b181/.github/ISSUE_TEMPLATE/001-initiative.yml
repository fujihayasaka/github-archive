name: ⛰️ Initiative Template
description: Initiatives are 1-3 quarter, multi-release investments that deliver measurable customer and business outcomes.
title: "[Initiative] "
type: "Initiative"
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        📌 **Tip:** Use the [Bloom Space](https://github.com/copilot/spaces/github/244) to get feedback, convert existing content into the template, and generate downstream materials. 
  - type: textarea
    id: overview
    attributes:
      label: 📰 Overview
      description: |
        Provide a 2-3 sentence summary of what this initiative is and why it matters to GitHub's strategy.
    validations:
      required: true

  - type: textarea
    id: value_proposition
    attributes:
      label: 💡 Value proposition
      description: |
        What user problem are we solving? How does solving this problem create value? Why is GitHub uniquely positioned to solve this problem?
      placeholder: |
        - What are users doing today that's broken, inefficient, or missing?
        - What can users do that they couldn't before?
        - What makes our solution different from alternatives or competitors?
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 📊 Understand the problem space

  - type: textarea
    id: key_insights
    attributes:
      label: Key Insights
      description: |
        What qualitative, quantitative, and landscape data informed this opportunity? What patterns or trends did we discover?
      placeholder: |
        - What do we know? (Include data analysis, user research findings, competitive intelligence, market trends.)
        - What does this tell us? (What patterns or opportunities emerged?)
    validations:
      required: false

  - type: textarea
    id: target_customers
    attributes:
      label: Target Customers
      description: Clarify the primary personas, segments, and JTBD this initiative enables. Indicate if the target customers and the jobs to be done are validated or hypotheses that require further exploration.
      placeholder: |
        - Primary personas/segments: Who are we building this for?
        - Jobs-to-be-Done: What are the 3-5 most critical jobs users are trying to accomplish? 
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 🎯 Identify the levers to achieve your goal

  - type: textarea
    id: strategic_opportunity
    attributes:
      label: Strategic Opportunity
      description: |
        Based on the insights above, what specific solution are you building and what outcome will it drive? Why is it important now?
      placeholder: |
        We believe [WHAT WE'RE BUILDING/CHANGING] will result in [SPECIFIC MEASURABLE OUTCOME] because [KEY INSIGHT FROM UNDERSTAND PHASE]. This is important now because [REASON].
    validations:
      required: true

  - type: dropdown
    id: core_kpis
    attributes:
      label: Core KPI Impact
      description: Select which Core GitHub KPI this Initiative aims to impact.
      options:
        - "SELECT AN OPTION"
        - "Weekly Active Users (WAU)"
        - "Annual Recurring Revenue (ARR)"
        - "Cloud gross margin"
        - "Availability"
        - "Craft and Performance"
        - "Weekly Merging Users"
        - "Weekly Code Review Users"
        - "Weekly Agentic Users"
        - "VS Code Copilot 10d28"
        - "Active Repos % with Security | Quality enabled"
        - "Developer Sentiment & Share of Voice"
        - "[Internal] AI leverage"
        - "Other"
    validations:
      required: true
      
  - type: textarea
    id: impact_and_outcomes
    attributes:
      label: Supporting Metrics
      description: |
        Leading indicators and health checks. Link dashboards if available. 
      placeholder: |
        - Metric 1: Baseline → Target
        - Metric 2: Baseline → Target
        - Quality/guardrail metric: Threshold to maintain
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## ✅ Execute on those levers perfectly

  - type: textarea
    id: key_milestones
    attributes:
      label: Key Releases & Milestones
      description: |
        List the key release phases and milestones (with linked releases or epics.)
      placeholder: |
        - [Release Phase or Milestone](link): Target Timing
          - High level feature set or link
    validations:
      required: false

  - type: textarea
    id: out_of_scope
    attributes:
      label: 🚫 Out of Scope
      description: |
        What features, scenarios, or use cases are explicitly excluded from this initiative?
      placeholder: |
        - Out of Scope #1
        - Out of Scope #2
    validations:
      required: false

  - type: textarea
    id: risks_and_dependencies
    attributes:
      label: Risks and Dependencies
      description: |
        What could prevent success? List risks with their impact level and mitigation strategies. Include dependencies on other teams or initiatives. 
      placeholder: |
        Include links where available (eg risk project boards.)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 👀 Canonical Info

  - type: textarea
    id: canonical_people
    attributes:
      label: 🧑‍🤝‍🧑 Canonical People
      description: |
        Specify the DRI and other people involved in this initiative.
      placeholder: |
        DRI: @username
    validations:
      required: true

  - type: textarea
    id: canonical_communications
    attributes:
      label: 🔗 Canonical Links & Communications
      description: |
        List Slack channels, reporting cadence/location, decision templates, and reference docs.
      placeholder: |
        - Slack Channels:
        - Reporting cadence and location:
        - Decision template and location:
        - Related initiatives or workstreams:
        - Reference documents: (Design documents, ADR/EDR, customer conversations, Decisions)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        📌 **Tip:** Explore these resources early to build compliance into your product from the start and avoid last-minute blockers before launch.
        - [Safety by Design Policy](https://thehub.github.com/security/policy-desk/policies/safety-by-design-policy/)
        - [Secure Coding Standard](https://thehub.github.com/security/policy-desk/standards/secure-coding-standard/)
        - [Accessibility Repo](https://github.com/github/accessibility)
        - [RAI Repo](https://github.com/github/rai)
        - [Privacy and Legal Product Design Principles](https://github.com/github/product-and-privacy-legal/wiki/GitHub-Product-Design-Principles)
        - [GitHub Privacy Code](https://github.com/github/product-and-privacy-legal/wiki/The-GitHub-Privacy-Code-(GPC))
