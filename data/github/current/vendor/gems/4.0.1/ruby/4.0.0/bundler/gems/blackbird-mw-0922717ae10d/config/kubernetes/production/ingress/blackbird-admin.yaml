# This is used for access via Tailscale.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    tailscale.com/http-endpoint: enabled
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/tags: tag:blackbird-admin
  # This is used as the first part of the FQDN, e.g. blackbird.octoca.ts.net
  name: blackbird
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - backend:
              service:
                name: blackbird-admin-tailscale
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - blackbird
