# blackbird-cache config for integration (end2end) tests.
[metrics.exporter]
type = "noop"

[kafka.blackbird-1]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka:29092"
group_suffix = "002"
replication_factor = 1

[kafka.blackbird-2]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka-2:29092"
group_suffix = "002"
replication_factor = 1

[kafka.potomac]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka-potomac:29092"
group_suffix = "002"
replication_factor = 1

[kafka.shared]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka-potomac:29092"
group_suffix = "ignored"
replication_factor = 1

[redis.embeddings]
mode = "standalone"
url = "redis://default@redis:6379"
password_env_var = "EMBEDDINGS_REDIS_PASSWORD"

[embeddings_client.text-3]
model = "text-embedding-3-small"
dimensions = 512
batch_size = 12
token_limit = 8000
max_retries = 10

[[embeddings_client.text-3.backends]]
backend = "aip"
url = "https://blackbird-canadacentral.openai.azure.com/openai/deployments/blackbird-cnc-ptuc-a100-text-embedding-3-small/embeddings?api-version=2024-10-21"
secret_env_var = "AZURE_BLACKBIRD_EMBEDDING_CANADACENTRAL_KEY"
max_concurrent_requests = 100

[embeddings_client.metis]
model = "metis"
dimensions = 1024
doc_quantization = "Binary"
query_quantization = "I16"
batch_size = 12
token_limit = 8000
max_retries = 10

[[embeddings_client.metis.backends]]
backend = "metis"
url = "https://metis-vllm.canadacentral.inference.ml.azure.com/v1/embeddings"
secret_env_var = "METIS_VLLM_CANADACENTRAL_KEY"
max_concurrent_requests = 100

[cluster.cache-001]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-1"

[cluster.cache-001.policy]
type = "rendezvous"

[cluster.cache-002]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-2"

[cluster.cache-002.policy]
type = "rendezvous"

[cluster.zeta]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.zeta.storage]
type = "emulator"
address = "azurite"
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.eta]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-2"

[cluster.eta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.theta]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.theta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init
