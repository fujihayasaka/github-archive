apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./deployments/dependabot-badges.yaml
  - ./deployments/dependabot-actions.yaml
  - ./namespaces/dependabot-api-production.yaml
  - ./poddisruptionbudgets/dependabot-badges.yaml
  - ./services/dependabot-badges.yaml
  - ./services/dependabot-actions.yaml
  - ./servicemeshconfigs/config.yaml
  - ../../base/
patches:
  - path: ./deployments/aqueduct-resqued-worker.yaml
  - path: ./deployments/canary.yaml
  - path: ./services/api.yaml
  - path: ./services/dependabot-internal.yaml
  - path: ./configmaps/environment.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirst
  - target:
      group: batch
      version: v1
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirst
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: github-action-compute-usage-consumer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 1000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: repository-push-config-file-consumer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 270m
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: update-graph-event
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 700m
            memory: 4Gi
          requests:
            cpu: 400m
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: vulnerability-alert-create
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 700m
            memory: 4Gi
          requests:
            cpu: 400m
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: repository-commit-status-created-consumer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: 700m
            memory: 4Gi
          requests:
            cpu: 400m
            memory: 1Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: repository-push-consumer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
              cpu: 2000m
              memory: 4Gi
          requests:
              cpu: 250m
              memory: 1Gi
