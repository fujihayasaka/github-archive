syntax = "proto3";

import "google/protobuf/timestamp.proto";

package github.dependency_snapshots_api.jobs;

option go_package = "./jobs";

message UpdateGraphComputeUsageJob {
  enum Conclusion {
    CONCLUSION_UNKNOWN = 0;
    CONCLUSION_SUCCESS = 1;
    CONCLUSION_FAILURE = 2;
    CONCLUSION_SKIPPED = 3;
    CONCLUSION_CANCELLED = 4;
  }

  Conclusion conclusion = 1;

  // User who executed the workflow, can be empty
  uint64 invoking_user_id = 2;

  // The event which triggered the queuing of the job
  string invoking_event_type = 3;

  // Job identifier derived from user-defined job ID
  string job_user_identifier = 4;

  // The repository database ID
  uint64 repository_id = 5;

  // Owner of the repo
  uint64 repository_owner_id = 6;

  // Actions-internal Job identifier
  string workflow_job_id = 7;

  // Run id of workflow with which job is associated
  uint64 workflow_run_id = 8;

  // workflow run attempt
  uint64 workflow_run_attempt = 9;

  // The timestamp when workflow run was queued
  google.protobuf.Timestamp queued_at = 10;

  // The timestamp when workflow run was started (first job started running)
  google.protobuf.Timestamp started_at = 11;

  // The timestamp when workflow run was completed
  google.protobuf.Timestamp completed_at = 12;

  // runner_runtime is the runtime of the runner that executed the job.
  string runner_runtime = 13;

  // runner_type is the type of the runner that executed the job.
  string runner_type = 14;

  // job_name is taken from the workflow job
  string job_name = 15;
}
