# blackbird-indexer config for integration (end2end) tests.
[metrics.exporter]
type = "noop"

[indexer]
max_flush_seconds = 2 # 2 seconds
max_memory_index_size = 12_884_901_888 # 12GiB

[kafka.blackbird-1]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka:29092"
group_suffix = "002"

[kafka.blackbird-2]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka-2:29092"
group_suffix = "002"

[cluster.zeta]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-1"

[cluster.zeta.storage]
type = "emulator"
address = "azurite"
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.eta]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-2"

[cluster.eta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.theta]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-1"

[cluster.theta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init
