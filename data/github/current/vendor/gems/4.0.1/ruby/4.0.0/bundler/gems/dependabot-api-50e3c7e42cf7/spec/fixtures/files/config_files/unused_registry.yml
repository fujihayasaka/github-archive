version: 2
registries:
  npm-acme-cache:
    type: npm-registry
    url: artifactory.acme.com/artifactory/api/npm/npm-stable-and-cache
    token: ${{secrets.MY_ARTIFACTORY_TOKEN}}
  npm-acme:
    type: npm-registry
    url: artifactory.acme.com/artifactory/api/npm/npm-stable
    token: ${{secrets.MY_ARTIFACTORY_TOKEN}}
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-acme
    schedule:
      interval: "daily"
