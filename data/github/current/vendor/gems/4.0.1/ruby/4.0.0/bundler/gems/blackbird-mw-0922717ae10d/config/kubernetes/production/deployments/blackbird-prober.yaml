apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbird-prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbird-prober
  template:
    metadata:
      labels:
        app: blackbird-prober
      annotations:
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: blackbird
        fluentbit.io/parser: logfmt_sloppy
        pyroscope.io/scrape: 'true'
        pyroscope.io/service_name: 'blackbird-prober'
        pyroscope.io/profile-cpu-enabled: 'true'
        pyroscope.io/profile-mem-enabled: 'true'
        pyroscope.io/profile-goroutines-enabled: 'true'
        pyroscope.io/profile-mutex-enabled: 'true'
        pyroscope.io/profile-block-enabled: 'true'
        pyroscope.io/port: '2000'
        traffic.sidecar.istio.io/excludeInboundPorts: '2000'
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: blackbird-prober
          image: blackbird-mw
          command: [ "/blackbird-prober" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            httpGet:
              path: /ready
              port: 8080
          lifecycle:
            preStop:
              exec:
                command: [ "sleep", "5" ]
          envFrom:
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          env:
            - name: BLACKBIRD_MW_ENV
              value: "production"
            - name: BLACKBIRD_MW_STATS_ADDR
              value: "$(KUBE_NODE_HOSTNAME):28125"
            - name: BLACKBIRD_MW_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BLACKBIRD_MW_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SHARED_KAFKA_BROKERS
              value: "hydro-kafka-potomac-boot-1.service.iad.github.net:9093,hydro-kafka-potomac-boot-2.service.iad.github.net:9093,hydro-kafka-potomac-boot-3.service.iad.github.net:9093"
            - name: BLACKBIRD_MW_PAGINATION_REDIS_ADDR
              value: "blackbird-envoy-pagination.blackbird-envoy-production.svc.cluster.local:10000"
            - name: BLACKBIRD_MW_PAGINATION_REDIS_USERNAME
              value: "blackbird"
            - name: BLACKBIRD_MW_PAGINATION_REDIS_PASSWORD_ENV_VAR
              value: "ENVOY_PAGINATION_PASSWORD" # The envoy proxy password for pagination redis in IAD
            - name: BLACKBIRD_MW_SPOKESD_URL
              value: "https://spokesd-http-production.service.iad.github.net"
            - name: BLACKBIRD_MW_GITHUB_INTERNAL_API_URL
              value: "https://internal-api.service.iad.github.net/"
            - name: GOMAXPROCS
              value: "3" # limits.cpu - 1
            - name: BLACKBIRD_ENV
              value: dsa_client
            - name: RUST_LOG
              value: warn
          # http://kubernetes.io/docs/user-guide/compute-resources/
          resources:
            requests:
              cpu: 1.0
              memory: "1.5G"
            limits:
              cpu: 4.0
              memory: "2.5G"
