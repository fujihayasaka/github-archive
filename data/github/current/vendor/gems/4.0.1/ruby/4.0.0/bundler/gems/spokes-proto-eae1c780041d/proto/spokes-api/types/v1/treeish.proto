syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/reference.proto";
import "spokes-api/types/v1/revision.proto";

// Treeish represents the supported treeish representations of Spokes API.
message Treeish {
    oneof treeish {
        // oid is an object identifier.
        github.spokes.types.v1.ObjectID oid = 2;
        // reference is a Git reference.
        github.spokes.types.v1.Reference reference = 3;
        // revision is the Git revision
        github.spokes.types.v1.Revision revision = 4;
    }
}
