version: 2
registries:
  nuget-azp-acme:
    type: nuget-feed
    url: 'https://pkgs.dev.azure.com/microsoftLearnModule/aa398e8e-b4d1-11ea-b3de-0242ac130004/_packaging/My_Feed/nuget/v3/index.json'
    token: ${{secrets.MY_AZURE_DEVOPS_TOKEN}}
  public:
    type: nuget-feed
    url: 'https://api.nuget.org/v3/index.json'
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - nuget-azp-acme
      - public
    schedule:
      interval: "daily"
