syntax = "proto3";

package controlaccess;

import "authorizer.proto";

option go_package = "github.com/github/authzd/pkg/controlaccess";
option ruby_package = "Authzd::ControlAccess";

message Request {
  repeated authorizer.Attribute attributes = 1;
}

message Response {
  // An array providing the evaluation outcome for each policy that was evaluated
  Result result = 1;
}

message Result {
  // the result of evaluating the requested authorization check
  authorizer.Result outcome = 1;

  // reveal existence of resources (forbid/403) or deny existence (not_found/404)
  // indicates that the actor has some level of permission on the resource
  bool disclose_subject_existence = 2;
  // bool subject_visibility = 2; // would be an enum
  // bool subject_visible_to_actor = 2;

  // internal reason (log safe)
  string reason = 3;

  // user-facing message (enforcement)
  string message = 4;

  // chunk details
  // permissions actor has on resource
  // decision tree/tracing metadata
  repeated authorizer.Attribute attributes = 5;
}

service ControlAccess {
  rpc Check(Request) returns (Response);
}
