syntax = "proto3";

package github.spokes.references.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/references";
option ruby_package = "GitHub::Spokes::Proto::References::V1";

import "spokes-api/references/v1/update_ref_request.proto";

// Transaction represents a transaction to update or verify one or more refs.
message Transaction {
    reserved 1, 2;

    // committer_name is the name of the committer.  By convention, this is a
    // personal name.
    bytes committer_name = 6;

    // committer_email is the email of the committer.
    bytes committer_email = 7;

    // committer_time is the time of the commit.  It may be any string suitable
    // for Git.
    string committer_time = 3;

    // reflog_msg is the message for the reflog.
    string reflog_msg = 4;

    // ref_update indicates the ref updates to perform.
    repeated UpdateRefRequest ref_update = 5;
}
