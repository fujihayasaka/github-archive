syntax = "proto3";

package github.dependency_snapshots_api.entities;

import "buf/validate/validate.proto";

option go_package = "github.com/github/dependency-snapshots-api/pkg/proto/entities;entities";

// Fields are inspired by
// https://github.com/github/github/blob/master/app/api/description/components/schemas/dependency.yaml

message Dependency {
  // Package-url (PURL) of dependency. See https://github.com/package-url/purl-spec for more details.
  string package_url = 1 [(buf.validate.field).string = {pattern: "^pkg"}];

  // Whether a dependency is requested directly by this manifest or is a dependency of another dependency.
  enum Relationship {
    RELATIONSHIP_UNKNOWN = 0;
    RELATIONSHIP_DIRECT = 1;
    RELATIONSHIP_INDIRECT = 2;
  }
  Relationship relationship = 2;

  // Whether the dependency is required for the primary build artifact (runtime) or is only used for development.
  enum Scope {
    SCOPE_UNKNOWN = 0;
    SCOPE_RUNTIME = 1;
    SCOPE_DEVELOPMENT = 2;
  }
  Scope scope = 3;

  // Array of package-url (PURLs) of direct child dependencies.
  repeated string dependencies = 4;

  // User-defined metadata to store domain-specific information.
  map<string, string> metadata = 5 [(buf.validate.field).map = {max_pairs: 8}];
}
