secrets:
  CHATOPS_BOT_PUBLIC_KEY:
    key: CHATOPS_BOT_PUBLIC_KEY
    type: public_key
    owner: "@GitHub/runtime-platform"
    externally_usable: false
    kind: latest_at_deployment_start
  DEPENDENCY_SNAPSHOTS_API_HMAC_KEY:
    key: DEPENDENCY_SNAPSHOTS_API_HMAC_KEY
    type: HMAC
    owner: "@GitHub/dependency-graph"
    playbook: https://github.com/github/trust-metadata-api/blob/main/docs/playbooks/rotate-hmac-keys.md
    externally_usable: false
    kind: latest_at_deployment_start
  DEPENDENCY_SNAPSHOTS_DB_PASSWORD:
    key: DEPENDENCY_SNAPSHOTS_DB_PASSWORD
    type: mysql
    owner: "@GitHub/database-infrastructure"
    externally_usable: false
    kind: latest_at_deployment_start
  DEPENDENCY_SNAPSHOTS_DB_USERNAME:
    key: DEPENDENCY_SNAPSHOTS_DB_USERNAME
    type: credentials
    owner: "@GitHub/database-infrastructure"
    externally_usable: false
    kind: latest_at_deployment_start
  FAILBOT_HAYSTACK_URL:
    key: FAILBOT_HAYSTACK_URL
    type: failbot
    owner: github/observability
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/failbot/
    externally_usable: false
    kind: latest_at_deployment_start
  OTEL_EXPORTER_OTLP_TRACES_HEADERS:
    key: OTEL_EXPORTER_OTLP_TRACES_HEADERS
    type: otel
    owner: "@GitHub/observability"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/otel-collector/
    externally_usable: false
    kind: latest_at_deployment_start
  kittens:
    key: kittens
    type: azure_spn
    owner: "@GitHub/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn/
    externally_usable: false
    kind: latest_at_deployment_start
  spn_dependency_snapshots_api_prod_jpw_01:
    key: spn_dependency_snapshots_api_prod_jpw_01
    type: azure_spn
    owner: "@GitHub/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn
    externally_usable: true
    kind: latest_at_deployment_start
  spn_dependency_snapshots_api_prod_jpw_01_client_id:
    key: spn_dependency_snapshots_api_prod_jpw_01_client_id
    type: credentials
    owner: "@GitHub/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn
    externally_usable: true
    kind: latest_at_deployment_start
  spn_dependency_snapshots_api_prod_jpw_01_tenant_id:
    key: spn_dependency_snapshots_api_prod_jpw_01_tenant_id
    type: config
    owner: "@GitHub/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn
    externally_usable: true
    kind: latest_at_deployment_start
  AQUEDUCT_API_KEY:
    key: AQUEDUCT_API_KEY
    type: aqueduct
    owner: "@github/data-pipelines"
    playbook: https://github.com/github/ops/blob/master/docs/playbooks/webhooks/secret-rotation/how-to-rotate-aqueduct-secrets.md
    externally_usable: false
    kind: latest_at_deployment_start
  AQUEDUCT_API_KEY_VERSION:
    key: AQUEDUCT_API_KEY_VERSION
    type: aqueduct
    owner: "@github/data-pipelines"
    playbook: https://github.com/github/ops/blob/master/docs/playbooks/webhooks/secret-rotation/how-to-rotate-aqueduct-secrets.md
    externally_usable: false
    kind: latest_at_deployment_start
