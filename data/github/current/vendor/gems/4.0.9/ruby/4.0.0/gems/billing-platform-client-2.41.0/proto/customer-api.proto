syntax = "proto3";

package billing_platform.api.v1;

option go_package = "lib/twirp/proto";
option ruby_package = "BillingPlatform::Api::V1";

import "proto/base.proto";

service CustomerApi {
    rpc UpsertCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
    rpc PatchCustomer(PatchCustomerRequest) returns (PatchCustomerResponse);
    rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
    rpc GetCustomers(GetCustomersRequest) returns (GetCustomersResponse);
    rpc UpsertBudget(UpsertBudgetRequest) returns (UpsertBudgetResponse);
    rpc GetBudget(GetBudgetRequest) returns (GetBudgetResponse);
    rpc GetBudgetByUuid(GetBudgetByUuidRequest) returns (GetBudgetByUuidResponse);
    rpc DeleteBudget(DeleteBudgetRequest) returns (DeleteBudgetResponse);
    rpc GetAllBudgets(GetAllBudgetsRequest) returns (GetAllBudgetsResponse);
    rpc GetBudgetState(GetBudgetStateRequest) returns (GetBudgetStateResponse);
    rpc CanProceedWithUsage(CanProceedWithUsageRequest) returns (CanProceedWithUsageResponse);
    rpc GetDiscount(GetDiscountRequest) returns (GetDiscountResponse);
    rpc GetAllDiscounts(GetAllDiscountsRequest) returns (GetAllDiscountsResponse);
    rpc CreateDiscount(CreateDiscountRequest) returns (CreateDiscountResponse);
    rpc UpdateDiscount(UpdateDiscountRequest) returns (UpdateDiscountResponse);
    rpc DeleteDiscount(DeleteDiscountRequest) returns (DeleteDiscountResponse);
    rpc GetDiscountState(GetDiscountStateRequest) returns (GetDiscountStateResponse);
    rpc GetAllDiscountStates(GetAllDiscountStatesRequest) returns (GetAllDiscountStatesResponse);
    rpc GetAllIncludedUsageDiscountStates(GetAllIncludedUsageDiscountStatesRequest) returns (GetAllIncludedUsageDiscountStatesResponse);
    rpc GetPlanDiscounts(GetPlanDiscountsRequest) returns (GetPlanDiscountsResponse);
    rpc GetAlertableBudgetStateInfo(GetAllBudgetsRequest) returns (GetAllBudgetsResponse);
    rpc SoftDeleteCustomer(SoftDeleteCustomerRequest) returns (SoftDeleteCustomerResponse);
    rpc GetOveragePolicy(GetOveragePolicyRequest) returns (GetOveragePolicyResponse);
    rpc GetKeyValue(GetKeyValueRequest) returns (GetKeyValueResponse);
    rpc AddKeyValue(AddKeyValueRequest) returns (AddKeyValueResponse);
    rpc GetMultiUserBudgetStates(GetMultiUserBudgetStatesRequest) returns (GetMultiUserBudgetStatesResponse);
    rpc GetUserLevelBudgetStatesForActor(GetUserLevelBudgetStatesForActorRequest) returns (GetUserLevelBudgetStatesForActorResponse);
    rpc GetSkuFromIntegrationId(GetSkuFromIntegrationIdRequest) returns (GetSkuFromIntegrationIdResponse);
}

message CreateCustomerRequest {
    Customer customer = 1;
}

message CreateCustomerResponse {
}

message PatchCustomerRequest {
    Customer customer = 1;
    string previousCustomerId = 2;
    OveragePolicy newOrUpdatedOveragePolicy = 3;
}

message PatchCustomerResponse {
}

message GetCustomerRequest {
    string customerId = 1;
}

message GetCustomerResponse {
    Customer customer = 1;
}

message GetCustomersRequest {
    repeated string customerIds = 1;
}


message GetCustomersResponse {
    repeated Customer customers = 1;
}


message UpsertBudgetRequest {
    Budget budget = 1;
}

message UpsertBudgetResponse {
    Budget budget = 1;
}

message DeleteBudgetRequest {
    string customerId = 1;
    string uuid = 2;
}

message DeleteBudgetResponse {
    string pricingTargetId = 1;
}

message GetBudgetRequest {
    BudgetKey key = 1;
}

message GetBudgetResponse {
    Budget budget = 1;
}

message GetBudgetByUuidRequest {
    string customerId = 1;
    string uuid = 2;
    optional int64 page = 3;
}

message GetBudgetByUuidResponse {
    Budget budget = 1;
    BudgetState budgetState = 2;
    bool hasNextPage = 3;
}

message GetAllBudgetsRequest {
    string customerId = 1;
    optional int64 page = 2;
    optional int64 page_size = 3;
    optional base.ResourceType scope = 4;
    optional base.ResourceType exclude_scope = 5;
    repeated string filtered_orgs = 6;
    repeated string filtered_repos = 7;
    optional bool skip_total_count = 8;
    optional string budget_target = 9;
    optional string user_id = 10;
}

message GetAllBudgetsResponse {
    repeated BudgetInfo budgets = 1;
    reserved 2, 3;
    reserved "total_count", "has_more";
    optional bool hasNextPage = 4;
    optional int64 totalCount = 5;
    optional BudgetInfo effectiveBudget = 6;
}

message BudgetInfo {
    Budget budget = 1;
    BudgetState budgetState = 2;
}

message GetBudgetStateRequest {
    BudgetKey key = 1;
    int64 year = 2;
    int64 month = 3;
}

message GetBudgetStateResponse {
    BudgetState budgetState = 1;
}

message GetUserLevelBudgetStatesForActorRequest {
    string customerId = 1;
    string actorId = 2;
}

message GetUserLevelBudgetStatesForActorResponse {
    BudgetInfo effectiveBudget = 1;
}

message CanProceedWithUsageRequest {
    UsageKey usageKey = 1;
    TrustTier trustTier = 2;
}

message CanProceedWithUsageResponse {
    bool canProceed = 1;
    repeated CanProceedWithUsageInfo applicableBudgets = 2;
    repeated CanProceedWithUsagePlanDiscount planDiscounts = 3;
    CanProceedWithUsageStatus status = 4;
    string planName = 5;
}

message GetAllDiscountsRequest {
    string customerId = 1;
}

message GetAllDiscountStatesRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
}

message GetAllDiscountsResponse {
    repeated Discount discounts = 1;
}

message GetAllDiscountStatesResponse {
    repeated DiscountState discounts = 1;
}

message GetDiscountRequest {
    DiscountKey key = 1;
}

message GetDiscountResponse {
    Discount discount = 1;
}

message CreateDiscountRequest {
    Discount discount = 1;
}

message CreateDiscountResponse {
    string uuid = 1;
}

message UpdateDiscountRequest {
    string customerId = 1;
    string uuid = 2;
    FundingSource fundingSource = 3;
    double targetAmount = 4;
    int64 endDate = 5;
    double percentage = 6;
}

message UpdateDiscountResponse {
    Discount discount = 1;
}

message DeleteDiscountRequest {
    DiscountKey key = 1;
}

message DeleteDiscountResponse {
    DiscountKey key = 1;
}

message GetDiscountStateRequest {
    DiscountKey key = 1;
    int64 year = 3;
    int64 month = 4;
}

message GetDiscountStateResponse {
    DiscountState discountState = 1;
}

message GetAllIncludedUsageDiscountStatesRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
}

message GetAllIncludedUsageDiscountStatesResponse {
    repeated DiscountState discounts = 1;
}

message GetPlanDiscountsRequest {
    string customerId = 1;
}

message GetPlanDiscountsResponse {
    repeated PlanDiscount planDiscounts = 1;
}

message PlanDiscount {
    string uuid = 1;
    double targetAmount = 2;
    repeated string targets = 3;
    int64 startDate = 4;
    int64 endDate = 5;
    string type = 6;
    DiscountType discountType = 7;
    FundingSource fundingSource = 8;
}

message SoftDeleteCustomerRequest {
    string customerId = 1;
}

message SoftDeleteCustomerResponse {
}

message GetOveragePolicyRequest {
    string customerId = 1;
    string overagePolicyType = 2;
    string name = 3;
    bool isForBusiness = 4;
}

message GetOveragePolicyResponse {
    OveragePolicy overagePolicy = 1;
}

message GetKeyValueRequest {
    string customerId = 1;
    string key = 2;
}

message GetKeyValueResponse {
    string value = 1;
}

message AddKeyValueRequest {
    string customerId = 1;
    string key = 2;
    string value = 3;
}

message AddKeyValueResponse {
}

message Customer {
    string customerId = 1;
    string CostCenterUUID = 2;
    bool IsCostCenterProxy = 3;
    BillingTarget billingTarget = 4;
    string azureAccountId = 5;
    string zuoraAccountId = 6;
    string enterpriseCustomerId = 7;
    bool enableUsageEmission = 8;
    string zuoraAccountNumber = 9;
    string discountPlanName = 10;
    bool billForPublicRepoUsage = 11;
    int64 effectiveAt = 12;

    reserved "enabledProducts";
    reserved 13;

    bool hasPaymentMethod = 14;
    bool hasZuoraSubscription = 15;
    bool isBillingLocked = 16;
    TradeScreening tradeScreening = 17;
    base.CostCenterState costCenterState = 18;
    bool isStaffOwned = 19;
    OveragePoliciesMap OveragePolicies = 20;
}

message SavedOveragePolicy {
    bool enabled = 1;
}

message OveragePoliciesMap {
    map<string, SavedOveragePolicy> Products = 1;
    map<string, SavedOveragePolicy> SKUs = 2;
}

message OveragePolicy {
    string type = 1;
    string name = 2;
    bool enabled = 3;
}

message TradeScreening {
    bool hasAnyTradeRestrictions = 1;
    bool hasFullTradeRestrictions = 2;
    repeated string featuresWithCommercialInteractionRestrictions = 3;
}

message Budget {
    BudgetKey key = 1;
    double targetAmount = 2;
    BudgetLimitType budgetLimitType = 3;
    BudgetAlerting budgetAlerting = 4;
    string uuid = 5;
    uint64 licenseCount = 6;
    bool excludeCostCenterUsage = 7;
    int64 orgId = 8;
    int64 orgIdUpdatedAt = 9;
}

message BudgetKey {
    string customerId = 1;
    base.ResourceType targetType = 2;
    string targetId = 3;
    PricingTargetType pricingTargetType = 4;
    string pricingTargetId = 5;
}

enum PricingTargetType {
    NoPricingTarget = 0;
    ProductPricing = 1;
    SkuPricing = 2;
    BundlePricing = 3;
}

enum BudgetLimitType {
    IgnoreLimit = 0;
    AlertingOnly = 1;
    PreventFurtherUsage = 2;
    StopActiveUsage = 3;
}

enum TrustTier {
    TRUST_TIER_UNKNOWN = 0;
    TRUSTED = 1;
    NEUTRAL = 2;
    UNTRUSTED = 3;
}

message BudgetState {
    bool isFullyFunded = 1;
    double currentAmount = 2;
    double targetAmount = 3;
    double quantity = 4;
    BudgetThreshold thresholdMet = 5;
    uint64 licenseCount = 6;
    map<int32, Ids> budgetThresholds = 7;
    map<int32, int32> budgetThresholdsSummary = 8;
}

message BudgetAlerting {
    bool willAlert = 1;
    repeated string recipientUserIds = 2;
}

message BudgetThreshold {
    string name = 1;
    double minimumUsagePercentage = 2;
    bool alertable = 3;
}

message Ids {
    repeated int64 ids = 1;
}

message CanProceedWithUsageInfo {
    BudgetKey budgetKey = 1;
    BudgetState budgetState = 2;
    BudgetLimitType budgetLimitType = 3;
}

message CanProceedWithUsagePlanDiscount {
    bool isFullyApplied = 1;
    double currentAmount = 2;
    double targetAmount = 3;
    string uuid = 5;
}

enum CanProceedWithUsageStatus {
    UsageAllowed = 0;
    BillingLocked = 1;
    FullTradeRestrictionsApplied = 2;
    AnyTradeRestrictionsApplied = 3;
    CommercialInteractionRestrictionApplied = 4;
    NotBillable = 5;
    BudgetLimitReached = 6;
    OnTrial = 7;
    ProductNotEnabled = 8;
    TrustTierUsageLimitReached = 9;
    OveragesDisabled = 10;
}

message UsageKey {
    string sku = 1;
    string product = 2;
    double quantity = 3;
    int64 usageAt = 4;
    base.EntityDetail entityDetail = 5;
    base.RepositoryVisibility repositoryVisibility = 6;
}

enum BillingTarget {
    NoBillingTarget = 0;
    Zuora = 1;
    Azure = 2;
}

message Discount {
    string customerId = 1;
    repeated DiscountTarget targets = 2;
    double percentage = 3;
    double targetAmount = 4;
    string uuid = 5;
    int64 startDate = 6;
    int64 endDate = 7;
    DiscountType discountType = 8;
    FundingSource fundingSource = 9;
    int64 deletedAt = 10;
}

message DiscountKey {
    string customerId = 1;
    string uuid = 2;
}

enum DiscountTargetType {
    NoDiscountTarget = 0;
    SkuDiscount = 1;
    ProductDiscount = 2;
    RepoDiscount = 3;
    OrgDiscount = 4;
    EnterpriseDiscount = 5;
}

message DiscountTarget {
    string id = 1;
    DiscountTargetType type = 2;
}

message DiscountState {
    bool isFullyApplied = 1;
    double currentAmount = 2;
    double targetAmount = 3;
    double percentage = 4;
    string uuid = 5;
    repeated DiscountTarget targets = 6; // TODO (ostrower): Reserve field number 6 once fully migrated
    Discount discount = 7;
}

enum DiscountType {
    NoDiscountType = 0;
    FixedAmount = 1;
    Percentage = 2;
    RecurringFixedAmount = 3; // New type for recurring fixed amount discounts
}

enum FundingSource {
    NoFundingSource = 0;
    BillingCorrection = 1;
    GitHubForStartups = 2;
    SocialImpact = 3;
    OpenSource = 4;
    Education = 5;
    Plan = 6;
    PublicRepository = 7;
    SalesOffer = 8;
}

enum SortOrder {
    DESCENDING = 0;
    ASCENDING = 1;
}

message GetMultiUserBudgetStatesRequest {
    string customerId = 1;
    string budgetUuid = 2;
    optional int64 page = 3;
    optional int64 pageSize = 4;
    optional SortOrder sortOrder = 5;
    optional string userId = 6;
    optional int64 thresholdLowerBound = 7;
    optional int64 thresholdUpperBound = 8;
    repeated string filteredOrgs = 9;
}

message MultiUserBudgetUserState {
    string userId = 1;
    double currentAmount = 2;
    int64 quantity = 3;
    double targetAmount = 4;
    optional string overrideBudgetId = 5;
}

message GetMultiUserBudgetStatesResponse {
    repeated MultiUserBudgetUserState userStates = 1;
    bool hasNextPage = 2;
    int64 totalCount = 3;
    Budget budget = 4;
}

message GetSkuFromIntegrationIdRequest {
    string integrationId = 1;
    string customerId = 2;
}

message GetSkuFromIntegrationIdResponse {
    string sku = 1;
    bool useCache = 2;
}
