apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/default

patches:
  - path: patches/configmaps/observability-config.yaml
    target:
      kind: ConfigMap
      name: observability-config
  - path: patches/services/service.yaml
    target:
      kind: Service
      name: configsd
