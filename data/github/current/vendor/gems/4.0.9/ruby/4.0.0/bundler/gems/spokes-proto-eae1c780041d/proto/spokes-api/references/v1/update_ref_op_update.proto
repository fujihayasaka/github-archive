syntax = "proto3";

package github.spokes.references.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/references";
option ruby_package = "GitHub::Spokes::Proto::References::V1";

import "spokes-api/types/v1/object_id.proto";

// UpdateRefOpUpdate represents an update to a single ref
message UpdateRefOpUpdate {
    // oid is the value to set the ref to
    github.spokes.types.v1.ObjectID oid = 1;
}
