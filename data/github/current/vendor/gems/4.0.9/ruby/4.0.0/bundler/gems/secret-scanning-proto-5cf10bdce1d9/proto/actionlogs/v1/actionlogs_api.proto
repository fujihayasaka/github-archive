syntax = "proto3";

package github.secretscanning.actionlogs.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/actionlogs";
option ruby_package = "GitHub::Proto::SecretScanning::Actionlogs::V1";

// ActionlogsAPI defines the service for resolving Actions workflow run metadata
// needed by the Secret Scanning Service when scanning Actions logs.
service ActionlogsAPI {
  // GetWorkflowRunByCheckSuite resolves a check suite to its underlying
  // workflow run. Called by TSS only when a secret is detected in an Actions
  // log, so the call rate is proportional to findings rather than total
  // workflow-run volume.
  rpc GetWorkflowRunByCheckSuite(GetWorkflowRunByCheckSuiteRequest) returns (GetWorkflowRunByCheckSuiteResponse);
}

message GetWorkflowRunByCheckSuiteRequest {
  // The check_suite_id from the actions-results event. This corresponds to
  // the check_suite_id column on the monolith's workflow_runs table.
  int64 check_suite_id = 1;
}

message GetWorkflowRunByCheckSuiteResponse {
  // The workflow_runs.id from the monolith. Stored on the location row as
  // content_id and used to build the run/job URL.
  int64 workflow_run_id = 1;

  // The workflow_runs.workflow_file_path (e.g. ".github/workflows/ci.yml").
  // Stored on the location row as `path` and used as the dedup key.
  bytes workflow_file_path = 2;

  // The repository_id from workflow_runs, for cross-checking against the
  // event's repository_id.
  int64 repository_id = 3;
}
