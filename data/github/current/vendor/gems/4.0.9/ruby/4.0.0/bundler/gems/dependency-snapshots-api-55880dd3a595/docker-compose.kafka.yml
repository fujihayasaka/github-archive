version: '3.4'
services:
  kafka:
    image: ghcr.io/github/kafka-lite/kafka-lite:d23e793482f134100f6d106c69a6f4d0ee91b796
    restart: always
    ports:
      - "29092:9092"
      - "29093:9093"
    expose:
      - 9092
      - 9093
    environment:
      - KAFKA_LITE_REDIS_ADDRESS=redis:6379
    entrypoint: ["/kafka-lite"]
    depends_on:
      - redis

  redis:
    image: redis:latest
    restart: always
    expose:
      - 6379
