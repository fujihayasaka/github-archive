name: ⛰️ Initiative Template
description: Initiatives are 1–2 quarter, multi-release investments that deliver measurable customer and business outcomes.
type: "Initiative"
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        📌 **Tip:** Use the [Bloom Space](https://github.com/copilot/spaces/github/244) to get feedback, convert existing content into the template, and generate downstream materials. 
  - type: textarea
    id: overview
    attributes:
      label: 📰 Overview
      description: |
        Provide a 2–3 sentence summary of what this initiative is and why it matters to GitHub's strategy.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 📊 Understand the problem space

  - type: textarea
    id: key_insights
    attributes:
      label: The Problem & Opportunity
      description: |
        Define the business problem and the user problem you are solving for. What is the opportunity related to solving this problem? Provide any data/research as evidence.
      value: |
        **Problem Statement:**
          - Key pain point or gap

        **Why now:**
          - Market shift or urgency driver

        **Evidence:**
          - Data source or research link

    validations:
      required: false

  - type: textarea
    id: target_customers
    attributes:
      label: Who Is This For & What Do They Need?
      description: Define the primary target market and jobs to be done. Indicate if they are validated or hypotheses that require further exploration.
      value: |
        **Personas:**
          - e.g. Enterprise DevOps lead

        **Jobs-to-be-Done:**
          - When ..., I want to ..., so I can ...

    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 🎯 Identify the levers to achieve your goal

  - type: textarea
    id: strategic_opportunity
    attributes:
      label: Strategic Opportunity & Success Metrics
      description: |
        Based on the insights above, what specific solution are you building and what outcomes will it drive? The primary metric should clearly ladder to your Area or Workstream's Scorecard. 
      value: |
        **Strategic Approach:**
        We believe [WHAT] will [OUTCOME] because [INSIGHT].
        
        **Success Metrics:**

        | Metric | Current | Target | Why | Type |
        |--------|---------|--------|-----|-----|
        | Metric | X | Y | Rationale | Primary |
        | Metric | X | Y | Rationale | Supporting |
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## ✅ Execute on those levers perfectly

  - type: textarea
    id: key_milestones
    attributes:
      label: Key Milestones
      description: |
        Link your release tracking issues as sub-issues and a release rollup table will be automatically generated and kept up to date. Optionally, add important internal milestones, staff ships, or other non-release checkpoints:
      value: |
        🤖 **Releases:** Add releases as sub-issues & an agent will create a rollup
        ✅ **Milestones:** 
          - Staff Ships or internal milestones | Target Date

        ❌ **Not building:**
          - Out-of-scope item or deferral

    validations:
      required: false

  - type: textarea
    id: risks_and_dependencies
    attributes:
      label: Risks & Dependencies
      description: |
        What could prevent success? List risks with their impact level and mitigation strategies. Include dependencies on other teams or initiatives. 
      value: |
        **Risks:**
          - Risk description → Mitigation strategy

        **Dependencies:**
          - Team or initiative dependency
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## 👀 Canonical Info

  - type: textarea
    id: canonical_communications
    attributes:
      label: 🔗 Canonical People, Links & Communications
      description: |
        List Slack channels, reporting cadence/location, decision templates, and reference docs.
      value: |
        - DRI: @username
        - Slack Channel:
        - Related initiatives or workstreams:
        - Reference documents: (metrics dashboards, design documents, ADR/EDR, customer conversations, decisions, etc)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        📌 **Tip:** Explore these resources early to build compliance into your product from the start and avoid last-minute blockers before launch.
        - [Safety by Design Policy](https://thehub.github.com/security/policy-desk/policies/safety-by-design-policy/)
        - [Secure Coding Standard](https://thehub.github.com/security/policy-desk/standards/secure-coding-standard/)
        - [Accessibility Repo](https://github.com/github/accessibility)
        - [RAI Repo](https://github.com/github/rai)
        - [Privacy and Legal Product Design Principles](https://github.com/github/product-and-privacy-legal/wiki/GitHub-Product-Design-Principles)
        - [GitHub Privacy Code](https://github.com/github/product-and-privacy-legal/wiki/The-GitHub-Privacy-Code-(GPC))
