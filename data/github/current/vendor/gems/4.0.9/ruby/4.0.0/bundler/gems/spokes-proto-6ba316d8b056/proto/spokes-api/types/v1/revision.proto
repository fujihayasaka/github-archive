syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// Revision represents a Git revision that can be resolved to an object ID.
message Revision {
    // name is the name of the revision. (required)
    bytes name = 1;
}
