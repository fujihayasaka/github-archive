run-name: Dependency Submission
on: push
jobs:
  submit-golang:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: setup-ecosystem
        uses: actions/setup-go@v6
        with:
          go-version-file: './go.mod'

      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: submit-dependency-snapshot
        uses: actions/go-dependency-submission@913bb852d4ca8de8437b38ef20714b685c31a5d9 
        with:
          go-mod-path: "./go.mod"

