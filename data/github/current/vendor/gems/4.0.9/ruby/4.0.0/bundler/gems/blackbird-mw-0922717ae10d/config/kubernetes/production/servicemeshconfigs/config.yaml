apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
    name: config
spec:
    authorization:
        create: true
        strictTLS: true
        inboundNamespaces:
            - aleph-production
            - copilot-api-production
            - github-production
            - feature-flag-hub-production
            - feature-flag-hub-staging-production
            - github-mcp-server-remote-production
    loadBalancing:
        retryOnReset: true
        useLocalityLoadBalancing: true
