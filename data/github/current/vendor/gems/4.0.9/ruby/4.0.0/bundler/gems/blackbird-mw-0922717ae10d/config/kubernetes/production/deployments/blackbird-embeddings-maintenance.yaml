apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbird-embeddings-maintenance
  annotations:
    # This deployment runs as a single process.
    moda.github.net/cluster-preferences: |
      {
        "general-2-va3-iad":  {
          "spec": {
            "replicas": 1
          }
        }
      }
spec:
  replicas: 0 # This process should not be replicated.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackbird-embeddings-maintenance
  template:
    metadata:
      labels:
        app: blackbird-embeddings-maintenance
      annotations:
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: blackbird
        fluentbit.io/parser: logfmt_sloppy
        pyroscope.io/scrape: 'true'
        pyroscope.io/service_name: 'blackbird-embeddings-maintenance'
        pyroscope.io/profile-cpu-enabled: 'true'
        pyroscope.io/profile-mem-enabled: 'true'
        pyroscope.io/profile-goroutines-enabled: 'true'
        pyroscope.io/profile-mutex-enabled: 'true'
        pyroscope.io/profile-block-enabled: 'true'
        pyroscope.io/port: '2000'
        traffic.sidecar.istio.io/excludeInboundPorts: '2000'
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: blackbird-embeddings-maintenance
          image: blackbird-mw
          command: [ "/blackbird-embeddings-maintenance" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            httpGet:
              path: /ready
              port: 8080
          envFrom:
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          env:
            - name: BLACKBIRD_MW_ENV
              value: "production"
            - name: BLACKBIRD_MW_STATS_ADDR
              value: "$(KUBE_NODE_HOSTNAME):28125"
            - name: BLACKBIRD_MW_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BLACKBIRD_MW_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BLACKBIRD_MW_GITHUB_INTERNAL_API_URL
              value: "https://internal-api.service.iad.github.net/"
            - name: SHARED_KAFKA_BROKERS
              value: "hydro-kafka-potomac-boot-1.service.iad.github.net:9093,hydro-kafka-potomac-boot-2.service.iad.github.net:9093,hydro-kafka-potomac-boot-3.service.iad.github.net:9093"
            - name: BLACKBIRD_ENV
              value: dsa_client
            - name: RUST_LOG
              value: warn
            - name: GOMAXPROCS
              value: "1" # limits.cpu - 1
          # http://kubernetes.io/docs/user-guide/compute-resources/
          resources:
            requests:
              cpu: 1.0
              memory: "1G"
            limits:
              cpu: 2.0
              memory: "2G"
