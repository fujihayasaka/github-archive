version: v2
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
  enum_zero_value_suffix: _UNKNOWN
  ignore_only:
    SERVICE_SUFFIX:
      - alerting/v1/alerting_api.proto
      - graphql/v1/graph_ql_resolver.proto
      - repo-insights/v1/repo_insights_api.proto
      - sbom/v1/sbom_api.proto
      - v1/experimental/dependencies.proto
    PACKAGE_VERSION_SUFFIX:
      # we want to allow this on experimental
      - v1/experimental

breaking:
  use:
    - PACKAGE
  ignore:
    # Ignore experimental from breaking change as not proper version
    - v1/experimental
