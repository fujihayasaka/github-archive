syntax = "proto3";

package github.dependency_snapshots_api.entities;

import "buf/validate/validate.proto";
import "entities/dependency.proto";

option go_package = "github.com/github/dependency-snapshots-api/pkg/proto/entities;entities";

// Fields are inspired by
// https://github.com/github/github/blob/master/app/api/description/components/schemas/manifest.yaml

message Manifest {
  // The name of the manifest.
  string name = 1 [(buf.validate.field).required = true];

  message File {
    // The path of the manifest file relative to the root of the Git repository.
    string source_location = 1;
  }
  File file = 2;

  // A collection of resolved package dependencies.
  // Key is a user-defined string to represent a dependency.
  map<string, Dependency> resolved = 3;

  // User-defined metadata to store domain-specific information.
  map<string, string> metadata = 4 [(buf.validate.field).map = {max_pairs: 8}];
}
