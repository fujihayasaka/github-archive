syntax = "proto3";

package licensing.customers.v1;

option go_package = "internal/monolith/customers/v1";
option ruby_package = "MonolithTwirp::Licensing::Customers::V1";

// UsersAPI is the monolith (github/github) Twirp service for querying licensing
// customer/user data. Only the RPCs billing-platform consumes are mirrored from
// github/licensify (monolith-twirp-proto/customers/v1/users_api.proto). The
// package and service names must match upstream so the Twirp route resolves.
// Keep this in sync with the upstream proto.
service UsersAPI {
  // GetBusinessTeamMembers returns the members of a business team.
  rpc GetBusinessTeamMembers(GetBusinessTeamMembersRequest) returns (GetBusinessTeamMembersResponse);
}

message GetBusinessTeamMembersRequest {
  // The database ID of the business team to get members for.
  uint64 business_team_id = 1;
}

message GetBusinessTeamMembersResponse {
  // The user ids of the business team members.
  repeated int64 user_ids = 1;
}
