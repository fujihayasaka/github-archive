# This file configures Herb for your project and team.
# Settings here take precedence over individual editor preferences.
#
# Herb is a suite of tools for HTML+ERB templates including:
# - Linter: Validates templates and enforces best practices
# - Formatter: Auto-formats templates with intelligent indentation
# - Language Server: Provides IDE support (VS Code, Zed, Neovim, etc.)
#
# Website: https://herb-tools.dev
# Configuration: https://herb-tools.dev/configuration
# GitHub Repo: https://github.com/marcoroth/herb
#

version: 0.9.2

files:
  include:
    - '**/*.erb' # We sometimes forget the .html part of the .html.erb extension, so include all .erb files to be safe

  exclude:
    - '**/*.html'   # Do not lint HTML files as they are not compiled by Herb

engine:
  validators:
    security: false
    nesting: false

linter:
  enabled: true

  # # Exit with error code when diagnostics of this severity or higher are present
  # # Valid values: error (default), warning, info, hint
  # failLevel: warning

  # # Additional patterns beyond the defaults for linting
  # include:
  #   - '**/*.xml.erb'
  #
  # # Patterns to exclude from linting
  # exclude:
  #   - 'app/views/admin/**/*'

  rules:
    erb-no-unsafe-script-interpolation:
      enabled: false

    html-allowed-script-type:
      enabled: false

    html-details-has-summary:
      enabled: false

    erb-no-empty-control-flow:
      enabled: false

    erb-no-output-in-attribute-position:
      enabled: false

    erb-require-trailing-newline:
      enabled: false

    erb-require-whitespace-inside-tags:
      enabled: false

    html-aria-role-must-be-valid:
      enabled: false

    html-attribute-values-require-quotes:
      enabled: false

    html-no-underscores-in-attribute-names:
      enabled: false

    erb-no-extra-whitespace-inside-tags:
      enabled: false

    html-input-require-autocomplete:
      enabled: false

    parser-no-errors:
      enabled: true

    erb-no-duplicate-branch-elements:
      enabled: false

    erb-no-output-in-attribute-name:
      enabled: false

    erb-no-then-in-control-flow:
      enabled: false

    erb-no-instance-variables-in-partials:
      enabled: false

    actionview-no-silent-render:
      enabled: false

    erb-no-unsafe-raw:
      enabled: false

    erb-no-interpolated-class-names:
      enabled: false

    actionview-no-silent-helper:
      enabled: false

    erb-prefer-image-tag-helper:
      enabled: false

    html-attribute-double-quotes:
      enabled: false

    html-no-empty-attributes:
      enabled: false

    html-attribute-equals-spacing:
      enabled: false

    html-no-self-closing:
      enabled: false

    html-anchor-require-href:
      enabled: false

    erb-strict-locals-comment-syntax:
      enabled: false

    html-boolean-attributes-no-value:
      enabled: false

    html-no-duplicate-attributes:
      enabled: false

    erb-right-trim:
      enabled: false

    erb-no-case-node-children:
      enabled: false

    erb-no-extra-newline:
      enabled: false

    html-no-duplicate-ids:
      enabled: false

    html-iframe-has-title:
      enabled: false

    erb-no-empty-tags:
      enabled: false

    html-tag-name-lowercase:
      enabled: false

    svg-tag-name-capitalization:
      enabled: false

    html-no-empty-headings:
      enabled: false

    html-aria-label-is-well-formatted:
      enabled: false

    erb-comment-syntax:
      enabled: false

  #
  #   # Rules can have 'include', 'only', and 'exclude' patterns
  #   some-rule:
  #     # Additional patterns to check (additive, ignored when 'only' is present)
  #     include:
  #       - 'app/components/**/*'
  #     # Don't apply this rule to files matching these patterns
  #     exclude:
  #       - 'app/views/admin/**/*'
  #
  #   another-rule:
  #     # Only apply this rule to files matching these patterns (overrides all 'include')
  #     only:
  #       - 'app/views/**/*'
  #     # Exclude still applies even with 'only'
  #     exclude:
  #       - 'app/views/admin/**/*'

formatter:
  enabled: false
  indentWidth: 2
  maxLineLength: 80

  # # Additional patterns beyond the defaults for formatting
  # include:
  #   - '**/*.xml.erb'
  #
  # # Patterns to exclude from formatting
  # exclude:
  #   - 'app/views/admin/**/*'

  # # Rewriters modify templates during formatting
  # rewriter:
  #   # Pre-format rewriters (modify AST before formatting)
  #   pre:
  #     - tailwind-class-sorter
  #   # Post-format rewriters (modify formatted output string)
  #   post: []
