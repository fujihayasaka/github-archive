apiVersion: apps/v1
kind: Deployment
metadata:
    name: aqueduct-throttled-resqued-worker
spec:
    template:
        spec:
            containers:
                - name: aqueduct-throttled-resqued-worker
                  resources:
                    limits:
                        # Set to (`AQUEDUCT_WORKER_PROCESS_COUNT` + 1 (for GC process)) * 1000m
                        cpu: 7000m
                        memory: 4Gi
                    requests:
                        cpu: 500m
                        memory: 2Gi
