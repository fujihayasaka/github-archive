syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/selectors/v1/repo_object_id_selector.proto";
import "spokes-api/types/selectors/v1/root_selector.proto";
import "spokes-api/types/selectors/v1/none_selector.proto";


// ResolvedBaseSelector is a selector that triggers internal resolution of a merge base.
// This will cause the system to internally call ResolveBaseOID to compute the merge base
// for the given OIDs before proceeding with the operation.
message ResolvedBaseSelector {
    // oid1 is the first head to operate on.  If it is a RootSelector, the empty
    // tree (from the root of the repository) will be used.
    oneof oid1 {
      github.spokes.types.v1.ObjectID object_id1 = 1;

      github.spokes.types.selectors.v1.RepoObjectIDSelector repo_object_id1 = 2;

      github.spokes.types.selectors.v1.RootSelector root_selector1 = 3;
    }

    // oid2 is the second head to operate on.  Diff information will be between
    // the computed merge base and this commit.
    oneof oid2 {
      github.spokes.types.v1.ObjectID object_id2 = 4;

      github.spokes.types.selectors.v1.RepoObjectIDSelector repo_object_id2 = 5;
    }

    // base_oid is the merge base to use; if it is not provided, one will
    // be computed.
    oneof base_oid {
      github.spokes.types.v1.ObjectID base_object_id = 6;

      github.spokes.types.selectors.v1.RepoObjectIDSelector repo_base_object_id = 7;

      github.spokes.types.selectors.v1.NoneSelector none_base = 8;
    }
}
