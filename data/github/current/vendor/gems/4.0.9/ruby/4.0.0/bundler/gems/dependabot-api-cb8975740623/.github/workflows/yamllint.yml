name: Lint YAML
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # yamllint is pre-installed on GitHub Actions runners:
      # https://github.com/adrienverge/yamllint/pull/588
      - run: yamllint .
