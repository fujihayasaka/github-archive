[package]
name = "spokes-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.14"
prost-wkt-types = "0.7"
serde = { version = "1.0", features = ["derive"] }
twirp = "0.11.0"

[build-dependencies]
glob = "0.3.1"
prost-build = "0.14"
twirp-build = "0.10.0"

[package.metadata.cargo-machete]
ignored = ["prost", "prost-wkt-types", "serde", "twirp"]
