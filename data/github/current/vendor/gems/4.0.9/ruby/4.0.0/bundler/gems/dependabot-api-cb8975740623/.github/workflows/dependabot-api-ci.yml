name: dependabot-api CI - Actions

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  merge_group:

jobs:
  #############
  # Default jobs
  #############
  default-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [
          {'job': 'dependabot-api', 'cibuild_script': 'cibuild'},
          {'job': 'dependabot-api-lint', 'cibuild_script': 'cibuild-dependabot-api-lint'},
          {'job': 'activejob-scheduled-jobs', 'cibuild_script': 'cibuild-activejob-scheduled-jobs'},
          {'job': 'dependabot-api-enterprise', 'cibuild_script': 'cibuild-enterprise'},
          {'job': 'dependabot-api-proxima', 'cibuild_script': 'cibuild-proxima'},
          {'job': 'dependabot-api-all-features', 'cibuild_script': 'cibuild-all-features'}
        ]
    uses: github/internal-actions/.github/workflows/default_simple.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      cibuild-script: 'script/${{ matrix.ci_job.cibuild_script }}'
      vault-keys: ${{ vars.VAULT_KEYS }}
      timeout: 30 # minutes
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Golden Image
  #############
  dependabot-api-golden-image:
    uses: github/internal-actions/.github/workflows/golden_image.yml@main
    with:
      ci-formatted-job-name: dependabot-api-golden-image
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Moda jobs
  #############
  moda-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependabot-api-moda-config-bundle'}]
    uses: github/internal-actions/.github/workflows/moda.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Docker Image jobs
  #############
  run-docker-image:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependabot-api-docker-image'}]
    uses: github/internal-actions/.github/workflows/kube.yml@main
    with:
      attest: true
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
      timeout: 30 # minutes
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Docker Security jobs
  #############
  run-docker-security:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependabot-api-docker-security'}]
    uses: github/internal-actions/.github/workflows/docker_security.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
      timeout: 30 # minutes
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  id-token: write
  attestations: write
