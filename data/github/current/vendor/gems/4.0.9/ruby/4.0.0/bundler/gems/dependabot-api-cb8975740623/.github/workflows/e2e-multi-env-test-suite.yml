name: E2E Multi Proxima Environment Test Suite

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  schedule:
    - cron: 0 1-23/3 * * *

jobs:
  run-for-environments:
    name: Run e2e tests for ${{ matrix.environment }}
    secrets:
      DEPENDABOT_TESTING_BOT_PASSWORD: ${{ secrets.DEPENDABOT_TESTING_BOT_PASSWORD }}
      DEPENDABOT_TESTING_BOT_PROXIMA_TOTP: ${{ secrets.DEPENDABOT_TESTING_BOT_PROXIMA_TOTP }}
      DEPENDABOT_TESTING_BOT_PAT: ${{ secrets.DEPENDABOT_TESTING_BOT_PAT }}
      SLACK_FIRST_RESPONDER_BOT_API_TOKEN: ${{ secrets.SLACK_FIRST_RESPONDER_BOT_API_TOKEN }}
      DATADOG_KEY: ${{ secrets.DATADOG_API_KEY }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: ['test-prodsdc01', 'staffship-01', 'test-prodweu01', 'test-prodae01']
    uses: './.github/workflows/e2e-tests-proxima.yml'
    with:
      environment: ${{ matrix.environment }}

permissions:
  contents: read
