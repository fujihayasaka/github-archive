inherit_from: ../../.rubocop.yml

AllCops:
  Exclude:
    - "bin/**/*"

Sorbet/BlockMethodDefinition:
  Exclude:
    - "test/octo_core/memoizer_test.rb"
    - "test/octo_core/decorator_test.rb"

# Sometimes it's helpful to use constant scoping to communicate intention to the readers.
Lint/UselessConstantScoping:
  Enabled: false
