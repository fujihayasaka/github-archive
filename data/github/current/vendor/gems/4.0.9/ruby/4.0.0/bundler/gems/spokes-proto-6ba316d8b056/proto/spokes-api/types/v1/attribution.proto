syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/timestamp.proto";

// Attribution represents an individual and instant.
message Attribution {
    // name is the name of the individual.
    string name = 1;

    // email is the email address of the individual.
    string email = 2;

    // date is the instant when the attribution (e.g. commit authorship) occurred.
    github.spokes.types.v1.Timestamp date = 3;
}
