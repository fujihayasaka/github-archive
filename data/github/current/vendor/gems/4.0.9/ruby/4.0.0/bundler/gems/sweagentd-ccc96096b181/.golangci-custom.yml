version: "2"

run:
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: false
  relative-path-mode: gitroot

output:
  path-prefix: ""
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  default: none
  enable:
    - goerrorslint

  exclusions:
    rules:
      - linters:
          - goerrorslint
        path: '_test\.go'

  settings:
    custom:
      goerrorslint:
        type: module
        description: Checks for uses of go error utilities that won't have our stacktracing built-in
