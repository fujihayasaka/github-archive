name: "Test Copilot Coding Agent with MCP Capability"

on:
  workflow_call:
    secrets:
      token:
        required: true
      datadog_api_key:
        required: true
    inputs:
      repo_nwo:
        required: true
        type: string
      reporting_id:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      capi_base_url:
        description: "Copilot API base URL"
        type: string
        default: "https://api.githubcopilot.com"
      integration_id:
        description: "Copilot-Integration-Id header value"
        type: string
        default: "playground-dev"
      github_api_url:
        description: "GitHub API base URL (for proxima tenants)"
        type: string
        default: "https://api.github.com"
      github_server_url:
        description: "GitHub Server URL"
        type: string
        default: "https://github.com"
      stamp:
        description: "Stamp name for reporting"
        type: string
        default: "dotcom"
      stagger_delay_seconds:
        description: "Seconds to wait before launching the generated Copilot SWE workflow"
        type: number
        default: 0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stagger generated workflow launch
        if: ${{ inputs.stagger_delay_seconds > 0 }}
        run: |
          echo "Waiting ${{ inputs.stagger_delay_seconds }} seconds before launching ${{ inputs.reporting_id }}"
          sleep "${{ inputs.stagger_delay_seconds }}"

      - name: Create Job that Requires MCP
        id: create-job
        run: |
          response=$(curl --fail-with-body ${{ inputs.capi_base_url }}/agents/swe/v1/jobs/${{ inputs.repo_nwo }} -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Copilot-Integration-Id: ${{ inputs.integration_id }}" -d '{"problem_statement": "Read issue #${{ inputs.issue_number }} in this repository and create a file called mcp-test.txt containing ONLY the exact text from the issue body, nothing else."}')
          session_id=$(echo "$response" | jq -r '.session_id')
          echo "Created coding agent session $session_id"
          echo "session_id=$session_id" >> $GITHUB_ENV
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.token }}

      - name: Wait for agent to complete
        id: wait_for_cca
        timeout-minutes: 35
        uses: ./.github/actions/wait_for_cca
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
          no_progress_timeout_minutes: 10

      - name: Validate PR contains expected MCP content
        id: validate_pr_content
        run: |
          echo "Validating PR content for session: $session_id"

          # Get PR ID from session
          if ! response=$(curl -s --fail-with-body ${{ inputs.capi_base_url }}/agents/sessions/$session_id \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Copilot-Integration-Id: ${{ inputs.integration_id }}"); then
            echo "❌ Failed to fetch session"
            exit 1
          fi

          pull_request_id=$(echo "$response" | jq -r '.resource_id')

          # Validate pull_request_id is not null or empty
          if [ -z "$pull_request_id" ] || [ "$pull_request_id" = "null" ]; then
            echo "❌ Error: Session resource_id is null or empty. The agent may not have created a PR."
            echo "Session response: $response"
            exit 1
          fi

          echo "Found pull request ID: $pull_request_id"

          # Get recent open PRs (limited to 10, sorted by creation date desc) to find the matching one
          # This is more targeted than fetching all PRs since our test PR was just created
          if ! recent_prs=$(curl -s --fail-with-body -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ inputs.github_api_url }}/repos/${{ inputs.repo_nwo }}/pulls?state=open&per_page=10&sort=created&direction=desc"); then
            echo "❌ Failed to fetch PRs list"
            exit 1
          fi

          # Find PR number and head SHA by matching the ID
          pr_data=$(echo "$recent_prs" | jq -r --arg id "$pull_request_id" '.[] | select(.id == ($id | tonumber))')

          if [ -z "$pr_data" ]; then
            echo "❌ Error: Could not find PR with ID $pull_request_id in recent PRs"
            exit 1
          fi

          pull_request_number=$(echo "$pr_data" | jq -r '.number')
          head_sha=$(echo "$pr_data" | jq -r '.head.sha')

          echo "Found PR #$pull_request_number with head SHA: $head_sha"

          # Get file content from PR branch
          file_response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            "${{ inputs.github_api_url }}/repos/${{ inputs.repo_nwo }}/contents/mcp-test.txt?ref=$head_sha")

          http_code=$(echo "$file_response" | tail -n1)
          file_content=$(echo "$file_response" | sed '$d')

          if [ "$http_code" != "200" ]; then
            echo "❌ Failed to fetch file mcp-test.txt (HTTP $http_code)"
            echo "Response: $file_content"
            exit 1
          fi

          echo "File content retrieved:"
          echo "$file_content"

          # Check if expected content is present using fixed string matching (grep -F)
          if echo "$file_content" | grep -qF "SECRET_CODE_MCP_TEST_ABC123"; then
            echo "✅ PR content validation passed"
            echo "Found expected content in mcp-test.txt"
          else
            echo "❌ PR content validation failed"
            echo "Expected to find: SECRET_CODE_MCP_TEST_ABC123"
            echo "Actual content: $file_content"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.token }}

      - id: cleanup_pr
        uses: ./.github/actions/cleanup_pr
        if: steps.create-job.outcome == 'success'
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          repo_nwo: ${{ inputs.repo_nwo }}
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
          github_api_url: ${{ inputs.github_api_url }}
          github_server_url: ${{ inputs.github_server_url }}

      - name: Validate session billing (premium_requests)
        id: validate_session
        uses: ./.github/actions/validate_session
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}

      - name: Write job summary
        id: write_summary
        if: ${{ always() }}
        uses: ./.github/actions/write_integration_summary
        with:
          test_name: "MCP Integration Test"
          reporting_id: ${{ inputs.reporting_id }}
          job_status: ${{ job.status }}
          repo_nwo: ${{ inputs.repo_nwo }}
          github_server_url: ${{ inputs.github_server_url }}
          capi_base_url: ${{ inputs.capi_base_url }}
          session_id: ${{ steps.create-job.outputs.session_id }}
          session_workflow_run_id: ${{ steps.wait_for_cca.outputs.workflow_run_id }}
          pull_request_number: ${{ steps.cleanup_pr.outputs.pull_request_number }}
          pull_request_url: ${{ steps.cleanup_pr.outputs.pull_request_url }}
      - id: notify_datadog
        if: ${{ github.event_name == 'schedule' && always() }}
        uses: ./.github/actions/notify_datadog
        with:
          datadog_api_key: ${{ secrets.datadog_api_key }}
          job_status: ${{ job.status }}
          test_type: ${{ inputs.reporting_id }}
          test_name: "MCP Integration Test"
          stamp: ${{ inputs.stamp }}
