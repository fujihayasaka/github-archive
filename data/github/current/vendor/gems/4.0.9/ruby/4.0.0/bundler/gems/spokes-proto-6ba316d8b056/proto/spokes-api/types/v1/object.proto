syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/object_id.proto";

// Object represents a Git object id and type.
message Object {
    // values correspond with those found in git/object.c.
    enum Type {
        TYPE_INVALID = 0;
        TYPE_COMMIT = 1;
        TYPE_TREE = 2;
        TYPE_BLOB = 3;
        TYPE_TAG = 4;
    }

    // type indicates the object type.
    Type type = 1;

    // oid represents the object id.
    ObjectID oid = 2;

    // size represents the full size of the object.
    uint64 size = 3;

    // mode represents the file mode of the object. Only applicable to objects
    // that are resolved as tree entries.
    uint32 mode = 4;
}
