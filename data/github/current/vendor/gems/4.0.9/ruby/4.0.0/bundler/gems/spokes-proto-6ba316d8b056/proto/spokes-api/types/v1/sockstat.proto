syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/sockstat_kv.proto";

// Sockstat represents sockstat data.
message Sockstat {
    // data indicates the sockstat data.
    repeated SockstatKV data = 1;
}
