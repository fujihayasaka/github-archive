apiVersion: apps/v1
kind: Deployment
metadata:
    name: aqueduct-resqued-worker
spec:
    replicas: 4
    template:
        spec:
            containers:
                - name: aqueduct-resqued-worker
                  resources:
                    limits:
                        # Set to (`AQUEDUCT_WORKER_PROCESS_COUNT` + 1 (for GC process)) * 1000m
                        cpu: 9000m
                        memory: 4Gi
                    requests:
                        cpu: 3000m
                        memory: 2Gi
                  env:
                    - name: AQUEDUCT_WORKER_PROCESS_COUNT
                      value: "8" # if this changes, update cpu resource limit
