syntax = "proto3";

package dependabot.settings.v1;

option go_package = "settings/v1";
option ruby_package = "MonolithTwirp::Dependabot::Settings::V1";

// Defines the service for Dependabot-specific Repository configuration
service RepositoryAPI {
  // Retrieves the current Dependabot settings for the Repository
  rpc GetRepositorySettings(GetRepositorySettingsRequest)
    returns (GetRepositorySettingsResponse);
  rpc SetPausedFlagOnRepository(SetPausedFlagOnRepositoryRequest)
    returns (SetPausedFlagOnRepositoryResponse);
  rpc RemovePausedFlagOnRepository(RemovePausedFlagOnRepositoryRequest)
    returns (RemovePausedFlagOnRepositoryResponse);
  rpc SetSelfHostedFlagOnRepository(SetSelfHostedFlagOnRepositoryRequest)
    returns (SetSelfHostedFlagOnRepositoryResponse);
}

// Request a single Repository by id
message GetRepositorySettingsRequest {
  // The GitHub Repository ID to retrieve
  int64 id = 1;
}

// Configuration for Dependabot runner labels and group settings
message DependabotRunnerSettings {
  // Labels to use for Dependabot Actions runners (e.g. ["ubuntu-latest", "self-hosted"])
  repeated string runner_labels = 1;
  // Optional runner group name (e.g. "org-default")
  string runner_group = 2;
}

// The current state of any Dependabot settings Dependabot API needs to check
message GetRepositorySettingsResponse {
  // The GitHub Repository ID
  int64 id = 1;
  // Indicates whether a Dependabot Install is present on the Repository
  bool dependabot_installed = 2;
  // Indicates whether the Repository expects Dependabot API to process
  // '.github/dependabot.yml' file if it present on the default branch
  bool dependabot_config_file_enabled = 3;
  // Indicates whether automated security updates are enabled on the Repository
  bool automated_security_updates_enabled = 4;
  // Indicates whether actions runners should be used for the Repository
  bool dependabot_on_actions_enabled = 5;
  // Indicates whether self-hosted actions runners should be used for the Repository
  bool dependabot_self_hosted_enabled = 6;
  // Indicates whether security updates should be grouped for the Repository
  bool security_updates_grouping_enabled = 7;
  // Indicates whether Actions tenant creation has been performed for the Repository
  bool actions_fully_enabled = 8;
  // Configuration for Dependabot self-hosted runner settings
  DependabotRunnerSettings dependabot_runner_settings = 9;
}

message SetPausedFlagOnRepositoryRequest {
  // The GitHub Repository ID to set the paused flag on
  int64 id = 1;
}

message SetPausedFlagOnRepositoryResponse {
  int64 id = 1;
  // Determines whether or not dotcom has approved the pause for the given
  // Repository ID. This allows the monolith to block pausing projects
  // arbitarily so Dependabot doesn't need to learn about billing, etc.
  bool success = 2;
}

message RemovePausedFlagOnRepositoryRequest {
  // The GitHub Repository ID to remove the paused flag on
  int64 id = 1;
}

message RemovePausedFlagOnRepositoryResponse {
  int64 id = 1;
}

message SetSelfHostedFlagOnRepositoryRequest {
  // The GitHub Repository ID to set the dependabot_self_hosted flag on
  int64 id = 1;
}

message SetSelfHostedFlagOnRepositoryResponse {
  int64 id = 1;
  bool success = 2;
}
