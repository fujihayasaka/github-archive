version: 2
registries:
  python-azp-acme:
    type: python-index
    url: https://pkgs.dev.azure.com/acme/_packaging/my-awesome-feed/pypi/simple
    aws-region: test-region
    account-id: '123456789'
    role-name: test-role
    domain: test-domain
    domain-owner: '987654321'
    replaces-base: true
updates:
  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - python-azp-acme
    schedule:
      interval: "daily"
