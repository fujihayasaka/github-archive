syntax = "proto3";

package billingcore.customers.v1;

option go_package = "internal/billingcore/customers/proto";
option ruby_package = "BillingCore::Customers::V1";

service CustomersAPI {
  rpc GetCustomersByBillableEntity(GetCustomersByBillableEntityRequest) returns (GetCustomersByBillableEntityResponse);
}

enum Purpose {
  PURPOSE_GENERAL = 0;  // any and all billing
  PURPOSE_SPONSORS = 1; // sponsorships only
}

message BillableEntity {
  string billable_entity_type = 1;
  uint64 billable_entity_id = 2;
  Purpose purpose = 3;
}

message GetCustomersByBillableEntityRequest {
  repeated BillableEntity billable_entities = 1;
}

message CustomerAccount {
  string billable_entity_type = 1;
  uint64 billable_entity_id = 2;
  Purpose purpose = 3;
  uint64 customer_id = 4;
}

message GetCustomersByBillableEntityResponse {
  repeated CustomerAccount customer_accounts = 1;
}
