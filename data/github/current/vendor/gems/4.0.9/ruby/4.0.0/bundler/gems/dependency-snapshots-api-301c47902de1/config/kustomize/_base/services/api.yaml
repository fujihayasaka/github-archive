apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    service: dependency-snapshots-api
  annotations:
    moda.github.net/domain-name: "dependency-snapshots-api-%enviroment%.service.%region%.github.net"
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 9597
  selector:
    app: dependency-snapshots-api
    role: api
  type: LoadBalancer
