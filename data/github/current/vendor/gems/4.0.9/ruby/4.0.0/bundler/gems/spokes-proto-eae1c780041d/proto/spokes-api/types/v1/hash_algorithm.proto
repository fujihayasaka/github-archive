syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// HashAlgorithm encapsulates the possible hash algorithms for a repository.
enum HashAlgorithm {
    // HASH_ALGORITHM_INVALID indicates an invalid hash algorithm.
    HASH_ALGORITHM_INVALID = 0;

    // HASH_ALGORITHM_SHA1 indicates the SHA-1 hash algorithm.
    HASH_ALGORITHM_SHA1 = 1;

    // HASH_ALGORITHM_SHA256 indicates the SHA-256 hash algorithm.
    HASH_ALGORITHM_SHA256 = 2;
}
