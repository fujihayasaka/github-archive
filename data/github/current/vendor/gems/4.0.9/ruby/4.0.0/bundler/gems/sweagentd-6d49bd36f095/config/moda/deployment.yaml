auto_start_pipeline: production_rollout
auto_retry_count: 3
partition_failure_tolerance: 2

notifications:
  slack_channels:
    - "#sweagentd-ops"
proxima:
  environment_pattern:
    service_mesh:
      enabled: true
    timeout: 1500 # 25 minutes
  rollout_pattern:
    - kind: deployment
      config:
        timeout: 1260
pipelines:
  production_rollout:
    thread_notifications: true
    auto_start_wait: false
    notify_users_via_dm: true
    stages:
      - name: staff-wus2-01
        kind: deployment
        config:
          environment: staff-wus2-01
          timeout: 1500 # 25 minutes
      # Canary not enabled for now while we're in PoC stage
      # Enable this at a later date once we're serving production traffic.
      # - name: production/canary
      #   kind: canary_deployment
      #   config:
      #     environment: production
      #     hosts: canary
      #   gates:
      #     - kind: timer
      #       duration: 300
      - name: production
        kind: deployment
        start_message: |-
          Deploying sweagentd to production now.
          If you are deploying something risky, make sure the current First Responder knows!
          If you are deploying outside of North America business hours, consider temporarily taking the pager for 30 min with `.pager me coding-agent-core-primary 30`.
        config:
          environment: production
          timeout: 1500 # 25 minutes
        gates:
          - kind: timer
            duration: 300 # 5 minutes
          - kind: datadog
            monitor_id: "178001263" # monitor URL: https://app.datadoghq.com/monitors/178001263
            execution_mode: continuous
            display_name: Production Availability Gate
            evaluation_period: 300
            auto_rollback:
              enabled: false
      - name: proxima
        kind: concurrent_group
        config:
          timeout: 1500
        stages:
          - name: test-cnc-01
            kind: deployment
            ignore_errors: true
            config:
              environment: test-cnc-01
              timeout: 1500 # 25 minutes
          - name: prod-ae-01
            kind: deployment
            config:
              environment: prod-ae-01
              timeout: 1500 # 25 minutes
          - name: prod-sdc-01
            kind: deployment
            config:
              environment: prod-sdc-01
              timeout: 1500 # 25 minutes
          - name: prod-cus-01
            kind: deployment
            config:
              environment: prod-cus-01
              timeout: 1500 # 25 minutes
          - name: prod-weu-01
            kind: deployment
            config:
              environment: prod-weu-01
              timeout: 1500 # 25 minutes
          - name: prod-jpw-01
            kind: deployment
            config:
              environment: prod-jpw-01
              timeout: 1500 # 25 minutes
          - name: prod-wus3-01
            kind: deployment
            config:
              environment: prod-wus3-01
              timeout: 1500 # 25 minutes
        gates:
          - kind: timer
            duration: 300
