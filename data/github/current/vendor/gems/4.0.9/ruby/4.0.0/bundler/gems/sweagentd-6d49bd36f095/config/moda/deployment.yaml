required_builds:
  - sweagentd-moda-config-bundle / sweagentd-moda-config-bundle
  - sweagentd-docker-image / sweagentd-docker-image
  - sweagentd-docker-security / sweagentd-docker-security

environments:
  - name: production
    require_pipeline: true
    auto_deploy: true
    timeout: 1500 # 25 minutes
    extra_start_message: >
      [Sentry Dashboard](https://sentry.io/organizations/github/releases/{{RELEASE_SHA}}/?environment=production&project=4508892525559808&statsPeriod=1h)
      [sweagentd Reliability Dashboard](https://app.datadoghq.com/dashboard/asx-99z-w6j/sweagentd-reliability?live=true)
      [sweagentd Performance Dashboard](https://app.datadoghq.com/dashboard/n7n-qmn-kiu/sweagentd-performance?live=true)
    cluster_selector:
      profile: general
      region: iad
    required_builds:
      - build-and-push-runtime
      - build-and-release
  - name: staging
    skip_auto_merge: true
    secret_environment: production
    auto_deploy: true
    timeout: 1500 # 25 minutes
    required_last_merge_hours: 24
    cluster_selector:
      profile: general
      region: iad
    notify_still_locked: true
    required_builds:
      - sweagentd-moda-config-bundle / sweagentd-moda-config-bundle
      - sweagentd-docker-image / sweagentd-docker-image
      - sweagentd-docker-security / sweagentd-docker-security
