version: 2
registries:
  maven-acme:
    type: maven-repository
    url: 'https://artifactory.acme.com'
    username: acme
    password: ${{secrets.MY_ARTIFACTORY_PASSWORD}}
    replaces-base: true
updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - maven-acme
    schedule:
      interval: "daily"
