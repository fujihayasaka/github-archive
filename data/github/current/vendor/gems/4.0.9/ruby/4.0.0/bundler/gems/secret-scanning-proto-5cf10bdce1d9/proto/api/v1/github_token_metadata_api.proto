syntax = "proto3";

package github.secretscanning.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

// GithubTokenMetadataAPI contains APIs used by secret scanning (TSS --> Dotcom) to get
// metadata about GitHub token types.
service GithubTokenMetadataAPI {
  rpc GetGithubTokenMetadata(GetGithubTokenMetadataRequest) returns (GetGithubTokenMetadataResponse);
}

message GetGithubTokenMetadataRequest {
  string token_type = 1;
  uint64 repository_id = 2;
  bool is_base64_encoded = 3;
  bytes encrypted_token = 4;
  uint64 number = 5;
}

message GithubTokenMetadata {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp last_accessed_at = 3;
  enum OrgAccess {
    ORG_ACCESS_INVALID = 0;
    ORG_ACCESS_NO_ACCESS = 1;
    ORG_ACCESS_ORG_ACCESS = 2;
    ORG_ACCESS_SSO_ACCESS = 3;
    ORG_ACCESS_PUBLIC_ACCESS = 4;
  }
  OrgAccess org_access = 4;
  uint64 access_id = 5;
  uint64 owner_id = 6;
  string name = 7;
}

message GetGithubTokenMetadataResponse {
  GithubTokenMetadata metadata = 1;
}
