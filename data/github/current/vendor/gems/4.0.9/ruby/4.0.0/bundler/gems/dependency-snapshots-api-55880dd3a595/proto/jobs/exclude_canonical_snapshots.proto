syntax = "proto3";

package github.dependency_snapshots_api.jobs;

option go_package = "./jobs";

// Currently, the minimum required param for the job is the repo ID
message ExcludeCanonicalSnapshotsJob {
  // Origin of the event that triggered this job
  enum TriggeredBy {
    TRIGGERED_BY_UNKNOWN = 0;
    TRIGGERED_BY_CLEAR_ACTION = 1;
  }

  // If populated, the GitHub request ID associated with the originating reset/clear event.
  string request_id = 1;
  // GitHub Repository model ID to delete all DGP-tracked manifest/dependency content for
  string event_id = 2;
  // If populated, the ID of the source event that represents the originating repo deletion
  uint32 repository_id = 3;
  // The origin of the event that triggered this job
  TriggeredBy triggered_by = 4;
}
