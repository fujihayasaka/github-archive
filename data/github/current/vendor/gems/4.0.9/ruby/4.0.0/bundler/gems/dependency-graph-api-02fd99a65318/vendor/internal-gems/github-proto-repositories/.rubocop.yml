Metrics/BlockLength:
  Enabled: false

Metrics/LineLength:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Layout/DotPosition:
  Enabled: false

Style/Documentation:
  Enabled: false

# We've chosen to use Rubocop only for style, and not for complexity or quality checks.
Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

# It will be obvious which code is complex, Rubocop should only lint simple
# rules for us.
Metrics/PerceivedComplexity:
  Enabled: false

Naming/UncommunicativeMethodParamName:
  Enabled: false

Style/RaiseArgs:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

# Disabled for code generated by protoc.
Style/HashSyntax:
  Exclude:
    - 'lib/v1/**/*'

Style/FrozenStringLiteralComment:
  Exclude:
    - 'lib/v1/**/*'

# Disabled for gem name matching.
Naming/FileName:
  Exclude:
    - 'lib/github-proto-*.rb'
