name: Automatically close stale issues

on:
  schedule:
    - cron: '0 0 * * *' # runs daily at 12:00 AM UTC
  workflow_dispatch: # Allow manual triggering

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-support-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          only-labels: support-escalation,support-issue:needs-more-info
          days-before-stale: 7
          days-before-close: 7
          stale-issue-message: 'This issue will be closed in 7 days due to inactivity. Please comment if you still need assistance.'
          close-issue-message: 'This issue was closed because it has been inactive for 7 days. If you believe this is done in error, please feel free to reopen the issue.'
          days-before-pr-stale: -1
          days-before-pr-close: -1

      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          exempt-issue-labels: support-escalation,support-issue:needs-more-info
          days-before-stale: 90
          days-before-close: 7
          stale-issue-message: 'This issue will be closed in 7 days due to inactivity. Please comment if you still need assistance.'
          close-issue-message: 'This issue was closed because it has been inactive for 7 days. If you believe this is done in error, please feel free to reopen the issue.'
          stale-pr-message: 'This PR will be closed in 7 days due to inactivity. Please comment if you still need assistance.'
          close-pr-message: 'This PR was closed because it has been inactive for 7 days. If you believe this is done in error, please feel free to reopen the PR.'

