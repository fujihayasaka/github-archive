syntax = "proto3";

package dataaccess;

option go_package = "github.com/github/authzd/pkg/dataaccess";
option ruby_package = "Authzd::DataAccess";

// Membership service provides data access APIs for membership information.
service Membership {
  rpc FindOrganizationIDsForUserByID(FindOrganizationIDsForUserByIDRequest)
      returns (FindOrganizationIDsForUserByIDResponse);
  rpc FindTeamIDsForUserByID(FindTeamIDsForUserByIDRequest)
      returns (FindTeamIDsForUserByIDResponse);
  rpc UserIsEmployee(UserIsEmployeeRequest) returns (UserIsEmployeeResponse);
}

message FindOrganizationIDsForUserByIDRequest {
  uint64 user_id = 1;
  PaginationOptions pagination = 2;
}

message FindOrganizationIDsForUserByIDResponse {
  repeated uint64 organization_ids = 1;
  // Cursor for the next page. Empty string indicates no more results.
  string next_cursor = 2;
}

message PaginationOptions {
  // Maximum number of results to return per page. Defaults to 1000, max 10000.
  uint32 limit = 1;
  // Cursor from previous response to continue pagination. Empty for first request.
  string cursor = 2;
}

message FindTeamIDsForUserByIDRequest {
  uint64 user_id = 1;
  PaginationOptions pagination = 2;
  // When true, includes BusinessTeam memberships in addition to Team memberships.
  bool include_business_teams = 3;
}

// TeamType represents the type of team.
enum TeamType {
  TEAM_TYPE_UNSPECIFIED = 0;
  TEAM_TYPE_ORGANIZATION = 1;
  TEAM_TYPE_BUSINESS = 2;
}

// TeamRef represents a reference to a team with its type.
message TeamRef {
  uint64 id = 1;
  TeamType type = 2;
}

message FindTeamIDsForUserByIDResponse {
  repeated TeamRef teams = 1;
  // Cursor for the next page. Empty string indicates no more results.
  string next_cursor = 2;
}

message UserIsEmployeeRequest {
  uint64 user_id = 1;
}

message UserIsEmployeeResponse {
  bool is_employee = 1;
}
