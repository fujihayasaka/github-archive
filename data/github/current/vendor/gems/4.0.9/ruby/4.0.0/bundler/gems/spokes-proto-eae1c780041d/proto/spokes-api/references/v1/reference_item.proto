syntax = "proto3";

package github.spokes.references.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/references";
option ruby_package = "GitHub::Spokes::Proto::References::V1";

import "spokes-api/types/v1/object.proto";
import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/reference.proto";

// ReferenceItem is a reference's name and object details.
message ReferenceItem {
    // reference is the name of the reference.
    github.spokes.types.v1.Reference reference = 1;

    // object represents the object being referred to.
    github.spokes.types.v1.Object object = 2;
}

// This message is used to add filtering options to endpoints that list references.
message RefListOptions {
    // Points at is the object ID that the references should point at.
    repeated github.spokes.types.v1.ObjectID points_at = 1;

    // Contains is the object ID that the references should contain.
    repeated github.spokes.types.v1.ObjectID contains = 2;
}
