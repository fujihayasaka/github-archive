version: "2"
linters:
  enable:
    - exhaustruct
  settings:
    exhaustruct:
      include:
        - .+/query/v1\.GitDocumentMatch
        - .+/crates/client/pkg/blackbird/gen/search/v1\.GitDocumentMatch
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/github/blackbird-mw
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
