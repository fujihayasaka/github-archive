syntax = "proto3";

package github.secretscanning.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

// buf:lint:ignore ENUM_VALUE_PREFIX Legacy enum values are already in use.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum RevokeResult {
  UNKNOWN_RESULT = 0;
  NO_URL = 1;
  NO_OAUTH_ACCESS = 2;
  REVOKED = 3;
  NO_PUBLIC_KEY = 4;
  ALREADY_UNVERIFIED = 5;
  UNVERIFIED = 6;
  FALSE_POSITIVE = 7;
}

// buf:lint:ignore ENUM_VALUE_PREFIX Legacy enum values are already in use.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum RepositoryType {
  UNKNOWN_TYPE = 0;
  REPOSITORY = 1;
  GIST = 2;
  WIKI = 3;
}

// buf:lint:ignore ENUM_VALUE_PREFIX Legacy enum values are already in use.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum TokenSource {
  UNKNOWN_SOURCE = 0;
  CONTENT = 1;
  COMMIT = 2;
  PULL_REQUEST_DESCRIPTION = 3;
  PULL_REQUEST_COMMENT = 4;
  ISSUE_DESCRIPTION = 5;
  ISSUE_COMMENT = 6;
  DISCUSSION_BODY = 7;
  DISCUSSION_COMMENT = 8;
  COMMIT_COMMENT = 9;
  GIST_CONTENT = 10;
  GIST_COMMENT = 11;
  ISSUE_TITLE = 12;
  PULL_REQUEST_TITLE = 13;
  DISCUSSION_TITLE = 14;
  NPM = 15;
  WIKI_CONTENT = 16;
  WIKI_COMMIT = 17;
  // Token was submitted directly for analysis (not discovered through repository scanning)
  MANUAL_SUBMISSION = 18;
}

// buf:lint:ignore ENUM_VALUE_PREFIX Legacy enum values are already in use.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum OwnerScope {
  UNKNOWN_SCOPE = 0;
  REPOSITORY_SCOPE = 1;
  ORGANIZATION_SCOPE = 2;
  BUSINESS_SCOPE = 3;
}

// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum OwnerType {
  // Unspecified owner type. Used as a zero value and should not be used in practice.
  OWNER_TYPE_UNSPECIFIED = 0;

  // Organization owned
  OWNER_TYPE_ORGANIZATION = 1;

  // User owned
  OWNER_TYPE_USER = 2;
}

// buf:lint:ignore ENUM_VALUE_PREFIX Legacy enum values are already in use.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum RepositoryOwnerFilterType {
  // Filter by all owner types
  ALL = 0;
  // Filter by organization owners only
  ORGANIZATION = 1;
  // Filter by EMU users only
  USER = 2;
}

message RepositoryOwners {
  // Filter to repositories owned by the specified type
  RepositoryOwnerFilterType filter_type = 1;
  // Filter organization-owned repositories to the ones owned by the specified organization IDs
  repeated uint64 org_ids = 2;
  // Filter organization-owned repositories to exclude the ones owned by the specified organization IDs
  repeated uint64 exclude_org_ids = 3;
  // Filter EMU-owned repositories to the ones owned by the specified user IDs
  repeated uint64 user_ids = 4;
  // Filter EMU-owned repositories to exclude the ones owned by the specified user IDs
  repeated uint64 exclude_user_ids = 5;
}

// buf:lint:ignore ENUM_VALUE_PREFIX Legacy enum values are already in use.
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum RepositoryArchivedState {
  // Includes either archived or not archived repositories
  ANY = 0;
  // Includes archived repositories only
  ARCHIVED = 1;
  // Includes non-archived repositories only
  NOT_ARCHIVED = 2;
}

// The reason why a user wants to open an exemption request
// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum ExemptionReason {
  EXEMPTION_REASON_UNKNOWN = 0;
  EXEMPTION_REASON_REVOKED = 1;
  EXEMPTION_REASON_FALSE_POSITIVE = 2;
  EXEMPTION_REASON_WONT_FIX = 3;
  EXEMPTION_REASON_USED_IN_TESTS = 4;
}
