version: 0.0.1
rules:
  - kind: http-rule
    url: { scheme: ["https"], domain: pub.dev }
  - kind: http-rule
    url: { scheme: ["https"], domain: pub.dartlang.org }
  - kind: http-rule
    url:
      scheme: ["https"]
      domain: storage.googleapis.com
      path: "/pub-packages/"
  - kind: http-rule
    url:
      scheme: ["https"]
      domain: storage.googleapis.com
      path: "/dart-archive/"
