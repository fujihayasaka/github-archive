name: Incident Issue
description: (FOR USE BY TEAM) Track an incident and corresponding repair items.
title: "Incident: $BRIEF_DESCRIPTION_OF_INCIDENT on $UTC_DATE"
labels: [incident]
body:
  - type: textarea
    id: summary
    attributes:
      label: Executive Summary
      value: |
        _<sup>Summary for people unfamiliar with our service.</sup>_

        <!-- EXECUTIVE SUMMARY below here -->

  - type: markdown
    attributes:
      value: "## Incident Timeline"
  - type: textarea
    id: timeline
    attributes:
      label: "Timeline"
      description: "Provide a timeline of key events during the incident."
      value: |
        _<sup>What were the key events during the incident? When did we first notice something was wrong? When did we declare an incident? When was it resolved?</sup>_

        <!-- TIMELINE in bullet-point format below here-->

        * YYYY-MM-DD HH:MM First signs
        * YYYY-MM-DD HH:MM Monitor fires
        * ...

  - type: markdown
    attributes:
      value: "## Incident Impact"
  - type: markdown
    attributes:
      value: "This section is used to determine which parts of GitHub were impacted and how much they were impacted. If the impact remains uncertain at the time of creating the issue, it's fine to leave blank and supply later."
  - type: checkboxes
    id: impact_visibility
    attributes:
      label: Visibility
      description: Was this incident internal or external?
      options:
        - label: "The incident was visible to GitHub users (`impact:external`)"
        - label: "The incident was ONLY visible internally (`impact:internal`)"
  - type: textarea
    id: impact_description
    attributes:
      label: External impact 
      description: If the incident was external, please describe what the visible impact to users was.
      value: |
        _<sup>Hard numbers on what the visible impact was. How many users/repos were affected? Other metrics quantifying the impact.</sup>_

        <!-- EXTERNAL IMPACT below here -->

  - type: markdown
    attributes:
      value: "## SLOs"
  - type: checkboxes
    id: slo
    attributes:
      label: SLO breaches 
      options:
        - label: "A 28d SLO was breached. (A breach means that the 28 day error budget for the SLO went below 0.) (`impact:slo`)"
        - label: "No 28d SLO was breached."
  - type: textarea
    id: slosbreached
    attributes:
      label: SLO impact detail
      value: |
       _<sup>Was any 28d SLO breached during this incident? If not, should one have been?</sup>_
       <!-- Go to each affected service in the [Service Catalog](https://catalog.githubapp.com/) and list any breached SLOs." -->

       <!-- AFFECTED SLO INFORMATION below here -->

  - type: markdown
    attributes:
      value: "## Detailed Analysis"
  - type: textarea
    id: detailed_analysis
    attributes:
      label: Detailed analysis
      description: This may be skipped during issue creation, and filled in based on the incident post-mortem.
      value: |
        _<sup>What happened? How did we find out something was wrong? How did we respond? What was the root cause? What factors contributed towards the incident?</sup>_

        <!-- DETAILED ANALYSIS below here -->

  - type: textarea
    id: repair_items
    attributes:
      label: Repair Items
      description: This may be skipped during issue creation, and filled in based on the incident post-mortem.
      value: |
        _<sup>List of action items to prevent this incident from happening again.</sup>_

        <!-- REPAIR ITEMS below here -->
