version: 0.0.1
rules:
  - kind: http-rule
    url: { scheme: ["https"], domain: haskell.org }
  - kind: http-rule
    url: { domain: hackage.haskell.org, allow-any-subdomain: true }
  - kind: http-rule
    url: { scheme: ["https"], domain: get-ghcup.haskell.org }
  - kind: http-rule
    url: { scheme: ["https"], domain: downloads.haskell.org }
