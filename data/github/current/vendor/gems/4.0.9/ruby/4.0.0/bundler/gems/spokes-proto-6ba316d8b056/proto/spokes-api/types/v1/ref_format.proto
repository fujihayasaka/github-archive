syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// RefFormat encapsulates the possible ref formats for a repository.
enum RefFormat {
    // REF_FORMAT_INVALID indicates an invalid ref format.
    REF_FORMAT_INVALID = 0;

    // REF_FORMAT_FILES indicates the files ref format.
    REF_FORMAT_FILES = 1;

    // REF_FORMAT_REFTABLE indicates the reftable ref format.
    REF_FORMAT_REFTABLE = 2;
}
