version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.33.0
    out: ../pkg/proto
    opt: paths=source_relative
  - local: protoc-gen-twirp # remote registry does not yet have a protoc-gen-twirp plugin
    out: ../pkg/proto
    opt: paths=source_relative
    # Note: The monolith requires us to use an old version of the ruby plugin which does not
    #       support protovalidate
  - remote: buf.build/protocolbuffers/ruby:v3.14.0
    out: ../gen/ruby/lib
  - local: protoc-gen-twirp_ruby # remote registry does not yet have a protoc-gen-twirp_ruby plugin
    out: ../gen/ruby/lib
    opt: paths=source_relative
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/github/dependency-snapshots-api/pkg/proto
  # Don't modify any file option or field option for protovalidate. Without
  # this, generated Go will fail to compile.
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
