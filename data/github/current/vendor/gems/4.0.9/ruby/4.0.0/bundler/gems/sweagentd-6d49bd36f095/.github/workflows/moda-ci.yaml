name: sweagentd Moda CI

# More info on CI actions setup can be found here:
# https://github.com/github/ops/blob/master/docs/playbooks/build-systems/moving-moda-apps-from-bp-to-actions.md
env:
  HUSKY: 0

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  merge_group:
    types: [checks_requested]

jobs:
  moda-config-bundle:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{ "job": "sweagentd-moda-config-bundle" }]
    uses: github/internal-actions/.github/workflows/moda.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
      timeout: 30
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  # Build and publish the Windows variant of the runtime napi addon so the
  # Dockerfile (which builds on Linux via internal-actions/kube.yml) can fetch
  # it into the action.tar.gz it bakes for staging/Proxima. Production downloads
  # its own tarball from github/copilot-developer-action and is unaffected.
  publish-runtime-windows-addon:
    name: publish-runtime-windows-addon
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
          token: ${{ secrets.COPILOT_AGENT_RUNTIME_PAT }}

      - name: Compute release tag from runtime submodule SHA
        id: tag
        shell: bash
        run: |
          set -eu
          RUNTIME_SHA="$(git -C runtime rev-parse HEAD)"
          echo "runtime_sha=${RUNTIME_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=runtime-windows-addon-${RUNTIME_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.check.outputs.exists == 'false'
        with:
          node-version-file: ./runtime/.nvmrc

      - name: Install runtime dependencies
        if: steps.check.outputs.exists == 'false'
        working-directory: ./runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build Rust runtime for Windows
        if: steps.check.outputs.exists == 'false'
        working-directory: ./runtime
        run: npm run build:runtime -- --release

      - name: Verify runtime artifact
        id: runtime-artifact
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          set -eu
          for path in \
            runtime/src/runtime/runtime.win32-x64-msvc.node \
            runtime/src/runtime/runtime/runtime.win32-x64-msvc.node
          do
            if [ -f "$path" ]; then
              echo "path=$path" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "runtime.win32-x64-msvc.node was not produced in the flattened or legacy runtime layout" >&2
          exit 1

      - name: Publish release with Windows runtime addon
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          RUNTIME_SHA: ${{ steps.tag.outputs.runtime_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release create "$RELEASE_TAG" \
            --repo "$REPO" \
            --title "Runtime Windows addon ${RUNTIME_SHA}" \
            --notes "Pre-built runtime.win32-x64-msvc.node for runtime submodule SHA ${RUNTIME_SHA}. Consumed by the sweagentd Dockerfile so action.tar.gz baked for staging/Proxima includes the Windows runtime addon." \
            --prerelease \
            "${{ steps.runtime-artifact.outputs.path }}"

  docker-image:
    needs: publish-runtime-windows-addon
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{ "job": "sweagentd-docker-image" }]
    uses: github/internal-actions/.github/workflows/kube.yml@main
    with:
      attest: true
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
      docker-build-env-secrets: "EBPF_DOWNLOAD_GITHUB_TOKEN,BLACKBIRD_DOWNLOAD_GITHUB_TOKEN,AUTOFIND_DOWNLOAD_GITHUB_TOKEN,GPGSIGN_DOWNLOAD_GITHUB_TOKEN,GITHUB_TOKEN"
      git-submodules: true
      timeout: 30
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  docker-security:
    needs: publish-runtime-windows-addon
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{ "job": "sweagentd-docker-security" }]
    uses: github/internal-actions/.github/workflows/docker_security.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
      docker-build-env-secrets: "EBPF_DOWNLOAD_GITHUB_TOKEN,BLACKBIRD_DOWNLOAD_GITHUB_TOKEN,AUTOFIND_DOWNLOAD_GITHUB_TOKEN,GPGSIGN_DOWNLOAD_GITHUB_TOKEN,GITHUB_TOKEN"
      git-submodules: true
      timeout: 30
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  id-token: write
  attestations: write
  packages: read
