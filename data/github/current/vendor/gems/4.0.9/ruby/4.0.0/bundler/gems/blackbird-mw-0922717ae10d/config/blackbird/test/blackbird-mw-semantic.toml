# blackbird-mw-semantic config for integration (end2end) tests.
[metrics.exporter]
type = "noop"

[runtime]
tokio_async_threads = 1
tokio_max_sync_threads = 2

[embeddings_client.text-3]
model = "text-embedding-3-small"
qos = "online"
dimensions = 512
batch_size = 12
token_limit = 8000
max_retries = 10

[[embeddings_client.text-3.backends]]
backend = "aip"
url = "https://blackbird-canadacentral.openai.azure.com/openai/deployments/blackbird-cnc-ptuc-a100-text-embedding-3-small/embeddings?api-version=2024-10-21"
secret_env_var = "AZURE_BLACKBIRD_EMBEDDING_CANADACENTRAL_KEY"
max_concurrent_requests = 100

[embeddings_client.metis]
model = "metis"
qos = "online"
dimensions = 1024
doc_quantization = "Binary"
query_quantization = "I16"
batch_size = 12
token_limit = 8000
max_retries = 10

[[embeddings_client.metis.backends]]
backend = "metis"
url = "https://metis-vllm.canadacentral.inference.ml.azure.com/v1/embeddings"
secret_env_var = "METIS_VLLM_CANADACENTRAL_KEY"
max_concurrent_requests = 100

# NOTE: These clusters are not typically used for semantic search, but we might
# decide to load a semantic index onto them. Therefore, they are in the
# configuration so the cluster selection code has access to them.
[cluster.zeta]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.eta]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-2"

[cluster.theta]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

# NOTE: These are the typical semantic clusters.
[cluster.iota]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.kappa]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.lambda]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.mu]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.nu]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[cluster.xi]
index_dir = "unused but required"
kafka_cluster_name = "blackbird-1"

[github]
internal_api_url = "http://fake-github:11223/"
secret_env_var = "GITHUB_INTERNAL_API_HMAC_KEY"

[redis.accessible_resources]
url = "redis://default@redis:6379"
password_env_var = "ACCESSIBLE_RESOURCES_REDIS_PASSWORD"

[redis.quota]
url = "redis://default@redis:6379"
password_env_var = "QUOTA_REDIS_PASSWORD"

[redis.repo_activity]
url = "redis://default@redis:6379"
password_env_var = "REPO_ACTIVITY_REDIS_PASSWORD"

[spokes]
url = "http://spokesd:8080"

[kafka.blackbird-1]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka:29092"
group_suffix = "001"

[kafka.blackbird-2]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka-2:29092"
group_suffix = "001"
