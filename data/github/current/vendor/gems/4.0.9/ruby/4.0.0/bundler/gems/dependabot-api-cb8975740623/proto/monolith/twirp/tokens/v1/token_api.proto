// proto/monolith/twirp/tokens/v1/token_api.proto
syntax = "proto3";
 
package dependabot.tokens.v1;
 
option go_package = "tokens/v1";
option ruby_package = "MonolithTwirp::Dependabot::Tokens::V1";
 
service TokenAPI {
  rpc CreateJitAccess(CreateJitAccessRequest) returns (CreateJitAccessResponse);
}

message CreateJitAccessRequest {
  string account_name = 1;
  string repo_name = 2;
  map<string, string> permissions = 3;
  string source_account_name = 4;
}

message CreateJitAccessResponse {
  string token = 1;
  uint64 repository_id = 2;
}
