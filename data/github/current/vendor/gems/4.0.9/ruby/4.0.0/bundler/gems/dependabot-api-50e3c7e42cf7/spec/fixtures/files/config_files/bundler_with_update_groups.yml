version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      my-update-group:
        patterns:
          - "rails"
          - "hanami"
      yet-another-group:
        patterns:
          - "rspec"
          - "rubocop*"
        exclude-patterns:
          - "rubocop-ast"
