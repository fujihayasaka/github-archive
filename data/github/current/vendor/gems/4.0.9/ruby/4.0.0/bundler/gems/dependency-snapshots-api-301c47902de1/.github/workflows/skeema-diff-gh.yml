name: skeema-diff-gh

on:
  pull_request:
    branches:
    - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write # To request the OIDC token to reach the repo via Actions Network Gateway (ANG)

jobs:
  skeema-diff:
    uses: github/skeefree/.github/workflows/skeema-diff.yml@master
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
      main-branch: main
      is-rails: false
    secrets: inherit
