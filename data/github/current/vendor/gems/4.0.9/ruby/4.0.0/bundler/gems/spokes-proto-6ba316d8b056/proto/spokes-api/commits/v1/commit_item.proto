syntax = "proto3";

package github.spokes.commits.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/commits";
option ruby_package = "GitHub::Spokes::Proto::Commits::V1";

import "spokes-api/types/v1/commit.proto";
import "spokes-api/types/v1/object_id.proto";

// CommitItem is a commit's OID and content.
message CommitItem {
    // oid represents the commit's object id.
    github.spokes.types.v1.ObjectID oid = 1;

    reserved 2;
    reserved "commit";

    // content of the commit, or an error if the commit content cannot be parsed 
    oneof commit_item_content{
        // commit is the data contained in the commit.
        github.spokes.types.v1.Commit commit_content = 3;

        // the error when we are unable to parse the commit
        string error = 4;
    }
}
