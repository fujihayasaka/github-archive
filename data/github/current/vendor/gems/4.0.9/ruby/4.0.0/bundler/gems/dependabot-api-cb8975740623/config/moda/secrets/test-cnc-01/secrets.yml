---
secrets:
  AQUEDUCT_API_KEY:
    key: AQUEDUCT_API_KEY
    type: aqueduct
    owner: "@github/data-pipelines"
    playbook: https://github.com/github/ops/blob/master/docs/playbooks/webhooks/secret-rotation/how-to-rotate-aqueduct-secrets.md
    externally_usable: false
    kind: latest_at_deployment_start
  AZURE_STORAGE_ACCESS_KEY:
    key: AZURE_STORAGE_ACCESS_KEY
    type: azure_storage
    owner: "@github/dependabot-updates"
    externally_usable: false
    kind: latest_at_deployment_start
  CHATOPS_AUTH_PUBLIC_KEY:
    key: CHATOPS_AUTH_PUBLIC_KEY
    type: public_key
    owner: "@github/runtime-platform"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/hubot/
    externally_usable: false
    kind: latest_at_deployment_start
  DEPENDABOT_API_HMAC_KEYS:
    key: DEPENDABOT_API_HMAC_KEYS
    type: HMAC
    owner: "@github/dependabot-updates"
    playbook: https://github.com/github/trust-metadata-api/blob/main/docs/playbooks/rotate-hmac-keys.md
    externally_usable: false
    kind: latest_at_deployment_start
  DEPENDABOT_INTERNAL_URL:
    key: DEPENDABOT_INTERNAL_URL
    type: config
    owner: "@github/dependabot-updates"
    externally_usable: false
    kind: latest_at_deployment_start
  DEPENDABOT_SERVICE_TOKEN:
    key: DEPENDABOT_SERVICE_TOKEN
    type: config
    owner: "@github/dependabot-updates"
    externally_usable: false
    kind: latest_at_deployment_start
  EARTHSMOKE_DEPENDABOT_SECRETS_KEY:
    key: EARTHSMOKE_DEPENDABOT_SECRETS_KEY
    type: earthsmoke
    owner: "@github/actions-sudo"
    playbook: https://github.com/github/kredz/blob/main/docs/key-redaction-and-re-encryption.md
    externally_usable: false
    kind: latest_at_deployment_start
  GITHUB_INTEGRATION_PRIVATE_KEY:
    key: GITHUB_INTEGRATION_PRIVATE_KEY
    type: github_app
    owner: "@github/dependabot-updates"
    playbook: "https://thehub.github.com/security/security-operations/secrets/secrets-rotation/github-app/"
    externally_usable: true
    kind: latest_at_deployment_start
  GITHUB_INTEGRATION_WEBHOOK_SECRET:
    key: GITHUB_INTEGRATION_WEBHOOK_SECRET
    type: github_webhook_token
    owner: "@github/dependabot-updates"
    externally_usable: true
    kind: latest_at_deployment_start
  GITHUB_INTERNAL_TWIRP_HMAC_KEY:
    key: GITHUB_INTERNAL_TWIRP_HMAC_KEY
    type: HMAC
    owner: "@github/dependabot-updates"
    playbook: https://github.com/github/trust-metadata-api/blob/main/docs/playbooks/rotate-hmac-keys.md
    externally_usable: false
    kind: latest_at_deployment_start
  KREDZ_HMAC_KEY:
    key: KREDZ_HMAC_KEY
    type: HMAC
    owner: "@github/dependabot-updates"
    playbook: https://github.com/github/trust-metadata-api/blob/main/docs/playbooks/rotate-hmac-keys.md
    externally_usable: false
    kind: latest_at_deployment_start
  MYSQL_PASS:
    key: MYSQL_PASS
    type: mysql
    owner: "@github/database-infrastructure"
    playbook: https://github.com/github/databases/blob/main/docs/mysql/playbooks/mysql-create-user.md#rotate-user-credentials
    externally_usable: false
    kind: latest_at_deployment_start
  MYSQL_READING_PASS:
    key: MYSQL_READING_PASS
    type: mysql
    owner: "@github/database-infrastructure"
    playbook: https://github.com/github/databases/blob/main/docs/mysql/playbooks/mysql-create-user.md#rotate-user-credentials
    externally_usable: false
    kind: latest_at_deployment_start
  PROXIMA_SERVICE_IDENTITY_SECRET_KEY:
    key: PROXIMA_SERVICE_IDENTITY_SECRET_KEY
    type: HMAC
    owner: "@github/authentication"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/hmac/
    externally_usable: false
    kind: latest_at_deployment_start
  REDIS_ENCRYPTION_KEY:
    key: REDIS_ENCRYPTION_KEY
    type: encryption_key
    owner: "@github/data-architecture"
    externally_usable: false
    kind: latest_at_deployment_start
  REDIS_PASSWORD:
    key: REDIS_PASSWORD
    type: redis
    owner: "@github/data-architecture"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/redis/
    externally_usable: false
    kind: latest_at_deployment_start
  SECRET_KEY_BASE:
    key: SECRET_KEY_BASE
    type: encryption_key
    owner: "@github/graphql-platform"
    externally_usable: false
    kind: latest_at_deployment_start
  TEMPORARY_FILE_ENCRYPTION_KEY:
    key: TEMPORARY_FILE_ENCRYPTION_KEY
    type: encryption_key
    owner: "@github/dependabot-updates"
    externally_usable: false
    kind: latest_at_deployment_start
  kittens:
    key: kittens
    type: kittens
    owner: "@github/sae-iam"
    externally_usable: false
    kind: latest_at_deployment_start
