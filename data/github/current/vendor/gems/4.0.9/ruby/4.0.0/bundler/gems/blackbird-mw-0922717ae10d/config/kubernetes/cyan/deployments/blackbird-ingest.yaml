apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbird-ingest-cyan
spec:
  replicas: 1 # times 6 k8s clusters; backfill topic has 32 partitions and incremental topic has 16 partitions
  strategy:
    type: Recreate # shut down all Kafka consumers before bringing up new ones
  selector:
    matchLabels:
      app: blackbird-ingest-cyan
      profiler: pyroscope # deprecated, but these labels are immutable so this stays
  template:
    metadata:
      labels:
        app: blackbird-ingest-cyan
        profiler: pyroscope # deprecated, but these labels are immutable so this stays
      annotations:
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: blackbird
        fluentbit.io/parser: logfmt_sloppy
        pyroscope.io/scrape: 'true'
        pyroscope.io/service_name: 'blackbird-ingest'
        pyroscope.io/profile-cpu-enabled: 'true'
        pyroscope.io/profile-mem-enabled: 'true'
        pyroscope.io/profile-goroutines-enabled: 'true'
        pyroscope.io/profile-mutex-enabled: 'true'
        pyroscope.io/profile-block-enabled: 'true'
        pyroscope.io/port: '2000'
        traffic.sidecar.istio.io/excludeInboundPorts: '2000'
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app"
                      operator: In
                      values:
                        - blackbird-ingest-cyan
                topologyKey: "kubernetes.io/hostname"
      dnsPolicy: ClusterFirst
      containers:
        - name: blackbird-ingest-cyan
          image: blackbird-mw
          command: [ "/blackbird-ingest" ]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            httpGet:
              path: /ready
              port: 8080
          envFrom:
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          env:
            - name: BLACKBIRD_MW_ENV
              value: "production"
            - name: BLACKBIRD_MW_OUTPUT_CORPUS
              value: "cyan"
            - name: SHARED_KAFKA_BROKERS
              value: "hydro-kafka-potomac-boot-1.service.iad.github.net:9093,hydro-kafka-potomac-boot-2.service.iad.github.net:9093,hydro-kafka-potomac-boot-3.service.iad.github.net:9093"
            - name: BLACKBIRD_KAFKA_BROKERS
              value: "hydro-kafka-blackbird-boot-1.service.azure-eastus.github.net:9093,hydro-kafka-blackbird-boot-2.service.azure-eastus.github.net:9093,hydro-kafka-blackbird-boot-3.service.azure-eastus.github.net:9093"
            - name: BLACKBIRD_GC_CUS_02_KAFKA_BROKERS
              value: "hydro-kafka-blackbird-gc-cus-02.service.gc-cus-02.consul:9093"
            - name: BLACKBIRD_MW_NUM_INGESTION_WORKERS
              value: "32"
            - name: BLACKBIRD_MW_STATS_ADDR
              value: "$(KUBE_NODE_HOSTNAME):28125"
            - name: BLACKBIRD_MW_POD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BLACKBIRD_MW_KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BLACKBIRD_MW_SPOKESD_URL
              value: "https://spokesd-http-production.service.iad.github.net"
            - name: BLACKBIRD_MW_GITHUB_INTERNAL_API_URL
              value: "https://internal-api.service.iad.github.net/"
            - name: BLACKBIRD_ENV
              value: dsa_client
            - name: RUST_LOG
              value: info
            - name: FRENO_HOST
              value: "freno.service.github.net:8111"
            - name: GOMAXPROCS
              value: "15" # less than limits.cpu to avoid throttling
          # http://kubernetes.io/docs/user-guide/compute-resources/
          resources:
            requests:
              cpu: 5.0
              memory: "3G"
            limits:
              cpu: 20.0
              memory: "16G"
