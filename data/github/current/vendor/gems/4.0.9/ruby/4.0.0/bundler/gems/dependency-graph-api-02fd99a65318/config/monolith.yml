default: &default
  base_uri: <%= ENV["MONOLITH_API_URL"] %>
  client_key: <%= ENV["MONOLITH_TWIRP_HMAC_KEY"] %>
  connection_open_timeout: 5
  connection_read_timeout: 10
development: &development
  <<: *default
  base_uri: <%= ENV.fetch("MONOLITH_API_URL", "http://api.github.localhost/internal") %>
  client_key: "launchhmac"
test:
  <<: *development
  base_uri: "http://api.github.localhost/internal"
production:
  <<: *default
