apiVersion: batch/v1
kind: Job
metadata:
  name: transition-template-job
spec:
  # This deadline is not used when instantiating this template to run
  # transitions. It only applies here in the "no-op" case.
  activeDeadlineSeconds: 100
  backoffLimit: 0
  template:
    metadata:
      annotations:
        fluentbit.io/parser: logfmt_sloppy
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: dependabot
      labels:
        app: dependabot-api
        role: transition-job
    spec:
      containers:
        - command:
            - /app/script/istio-job-wrapper
            - /app/script/run-transition
          env:
            - name: ISTIO_JOB_WRAPPER_DEBUG
              value: "1"
            - name: DOGSTATSD_HOST
              valueFrom:
                fieldRef:
                    fieldPath: spec.nodeName
          envFrom:
            - configMapRef:
                name: environment
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          image: dependabot-api
          name: transition
          volumeMounts:
            - mountPath: /etc/github/metadata.json
              name: github-metadata
              readOnly: true
      dnsPolicy: Default
      restartPolicy: Never
      volumes:
        - hostPath:
            path: /etc/github/metadata.json
          name: github-metadata
