version: 2
registries:
  maven-acme:
    type: maven-repository
    url: 'https://artifactory.acme.com'
    aws-region: test-region
    account-id: '123456789'
    role-name: test-role
    domain: test-domain
    domain-owner: '987654321'
    replaces-base: true
updates:
  - package-ecosystem: "maven"
    directory: "/"
    registries:
      - maven-acme
    schedule:
      interval: "daily"
