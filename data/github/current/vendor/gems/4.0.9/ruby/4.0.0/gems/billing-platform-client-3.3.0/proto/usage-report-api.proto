syntax = "proto3";

package billing_platform.api.v1;

option go_package = "lib/twirp/proto";
option ruby_package = "BillingPlatform::Api::V1";

import "proto/base.proto";

service UsageReportApi {
  rpc GetUsageReport(GetUsageReportRequest) returns (GetUsageReportResponse);
  rpc QueueUsageReportExport(QueueUsageReportExportRequest) returns (QueueUsageReportExportResponse);
  rpc RequestUsageReportExport(RequestUsageReportExportRequest) returns (RequestUsageReportExportResponse);
  rpc GetUsageReportExport(GetUsageReportExportRequest) returns (GetUsageReportExportResponse);
  rpc GetUsageReportExports(GetUsageReportExportsRequest) returns (GetUsageReportExportsResponse);
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
}

enum BillableOwnerType {
    Unspecified = 0;
    User = 1;
    Business = 2;
}

enum ReportType {
    Detailed = 0;
    Summarized = 1;
    Legacy = 2;
    PremiumRequest = 3;
    Token = 4;
}

message GetUsageReportRequest {
    string usageEntityId = 1;
    int64 year = 2;
    int64 month = 3;
    int64 day = 4;

    reserved 5;
    reserved "hour";

    base.BillingPeriod billingPeriod = 6;

    reserved 7;
    reserved "includeCostCenterUsage";

    int64 orgId = 8;
}

message GetUsageReportResponse {
    repeated ReportItem reportItems = 1;
}

message QueueUsageReportExportRequest {
    string customerId = 1;
    int64 startDate = 2;
    int64 endDate = 3;
    int64 actorId = 4;
    repeated int64 organizationIds = 5;

    reserved 6;
    reserved "legacyReport";

    BillableOwnerType billableOwnerType = 7;
    int64 billableOwnerId = 8;
    ReportType reportType = 9;
}

message QueueUsageReportExportResponse {
}

message RequestUsageReportExportRequest {
    string customerId = 1;
    int64 startDate = 2;
    int64 endDate = 3;
    int64 actorId = 4;
    repeated int64 organizationIds = 5;
    ReportType reportType = 6;
    // If true, send email notification when report is ready. Default is false (no email).
    bool sendEmail = 7;
}

message RequestUsageReportExportResponse {
    string exportOperationUuid = 1;
}

message GetUsageReportExportRequest {
    string customerId = 1;
    string exportOperationUuid = 2;
}

message GetUsageReportExportResponse {
    string exportOperationUuid = 1;
    string state = 2;  // "active", "completed", or "failed"
    int64 startDate = 3;
    int64 endDate = 4;
    ReportType reportType = 5;
    repeated string downloadUrls = 6;
    int64 createdAt = 7;
    int64 actorId = 8;
}

message ReportItem {
    int64 usageDate = 1;
    string product = 2;
    string sku = 3;
    double quantity = 4;

    reserved 5;
    reserved "unitType";

    double pricePerUnit = 6;
    double grossAmount = 7;
    double discountAmount = 8;
    double netAmount = 9;
    int64 orgID = 10;
    int64 repoID = 11;

    string costCenterName = 12;

    reserved 13;
    reserved "selfReference";

    string unitTypeString = 14;
}

message GetUsageSummaryRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
    int64 day = 4;
    base.BillingPeriod billingPeriod = 5;
    int64 orgId = 6;
    int64 repoId = 7;
    string sku = 8;
    string product = 9;
    string costCenterId = 10;
}

message GetUsageSummaryResponse {
    repeated UsageSummaryItem summaryItems = 1;
}

message UsageSummaryItem {
    string product = 1;
    string sku = 2;
    double grossQuantity = 3;
    double discountQuantity = 4;
    double netQuantity = 5;
    double grossAmount = 6;
    double discountAmount = 7;
    double netAmount = 8;
    double pricePerUnit = 9;

    reserved 10;
    reserved "unitTypeString";

    string unitType = 11;
}

message GetUsageReportExportsRequest {
    string customerId = 1;
}

message GetUsageReportExportsResponse {
    repeated UsageReportExportItem exports = 1;
}

message UsageReportExportItem {
    string exportOperationUuid = 1;
    string state = 2;  // "active", "completed", or "failed"
    int64 startDate = 3;
    int64 endDate = 4;
    ReportType reportType = 5;
    repeated string downloadUrls = 6;
    int64 createdAt = 7;
    int64 actorId = 8;
}
