syntax = "proto3";

package github.dependency_snapshots_api.jobs;

option go_package = "./jobs";

// DenormalizeSnapshotDependenciesJob triggers async denormalization of
// the canonical dependency information for a single repository.
message DenormalizeSnapshotDependenciesJob {
  // GitHub repository ID to denormalize dependencies for.
  uint64 repository_id = 1;
}
