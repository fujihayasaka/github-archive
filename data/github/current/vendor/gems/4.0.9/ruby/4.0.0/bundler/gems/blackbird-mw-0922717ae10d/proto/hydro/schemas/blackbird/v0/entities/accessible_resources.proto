syntax = "proto3";

package hydro.schemas.blackbird.v0.entities;

option java_package = "com.github.hydro.schemas.blackbird.v0.entities";
option csharp_namespace = "GitHub.Hydro.Schemas.Blackbird.V0.entities";

// Private resources accessible to a code search actor used to help with query rewriting and post processing
// of matched documents.
message AccessibleResources {
    // Set of private repository ids to which the actor has read access.
    repeated uint64 accessible_private_repo_ids = 1;

    // Set of owner ids to which the actor is a member (can access repos). Note this includes the actor's id and any
    // owner_ids from outside collaborator access.
    repeated uint64 accessible_owner_ids = 2;

    // Organization ids to which the actor is a member and currently meets CAP (e.g. SSO).
    repeated uint64 authorized_organization_ids = 3;

    // Organization ids to which the actor is a member but currently does not meet CAP (e.g. must re-SSO).
    repeated uint64 protected_organization_ids = 4;
}

