syntax = "proto3";

package github.spokes.references.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/references";
option ruby_package = "GitHub::Spokes::Proto::References::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/reference.proto";
import "spokes-api/types/v1/timestamp.proto";

// RefWithCommitTime contains the name of a reference plus OID information with a
// timestamp
message RefWithCommitTime {
    // reference is the Git reference.
    github.spokes.types.v1.Reference reference = 1;

    // target_id is the reference OID.
    github.spokes.types.v1.ObjectID target_id = 2;

    // peeled_id is the peeled OID. For tags this is the tag OID for annotated tags or the OID of the commit the tag points to for lightweight tags.
    github.spokes.types.v1.ObjectID peeled_id = 3;

    // commit_time is the timestamp of the tag or commit target of the reference.
    github.spokes.types.v1.Timestamp commit_time = 4;
}
