syntax = "proto3";

import "google/protobuf/timestamp.proto";

package github.dependency_snapshots_api.jobs;

option go_package = "./jobs";

message DependabotSnapshotInitJob {
  // The GitHub request ID associated with the originating action, if present
  string request_id = 1;

  // ID of the source event associated with the originating action, if present
  string event_id = 2;

  // A repository on GitHub.
  // A subset of fields from https://github.com/github/hydro-schemas/blob/main/proto/hydro/schemas/github/v1/entities/repository.proto
  message Repository {
    // The repository database id.
    uint32 id = 1;

    // The repository global relay id.
    string global_relay_id = 2;

    // The repository name.
    string name = 3;

    // The repository visibility.
    enum Visibility {
      VISIBILITY_UNKNOWN = 0;
      VISIBILITY_PUBLIC = 1;
      VISIBILITY_PRIVATE = 2;
      VISIBILITY_INTERNAL = 3;
    }
    Visibility visibility = 4;

    // The parent repository id if this is a fork.
    uint32 parent_id = 5;

    // The repository's current default branch name, e.g. 'master'
    string default_branch = 6;

    // The primary language used in the repository, e.g. 'Ruby'
    string primary_language_name = 7;
  }

  // Repository that received this push
  Repository repository = 3;

  // A user on GitHub owning a repository.
  // A subset of fields from https://github.com/github/hydro-schemas/blob/main/proto/hydro/schemas/github/v1/entities/user.proto
  message User {
    // The id of the user.
    uint32 id = 1;

    // The user global relay id for the GitHub Platform.
    string global_relay_id = 2;

    // The login of the user.
    string login = 3;

    enum Type {
      TYPE_UNKNOWN = 0;
      TYPE_USER = 1;
      TYPE_ORGANIZATION = 2;
      TYPE_BOT = 3;
      TYPE_PROGRAMMATIC_ACCESS_BOT = 4;
    }
    // The type of the user account.
    Type type = 4;
  }

  // Owner of the repository that received this push
  User owner = 4;

  // Fully-qualified Git ref name that was pushed
  string ref = 5;

  // Whether the ref maps to the default branch of the repo
  bool is_default_branch = 6;

  // Timestamp of the push
  google.protobuf.Timestamp pushed_at = 7;

  // Timestamp when we ingested the event from Hydro
  google.protobuf.Timestamp ingested_at = 8;

  enum TriggeredBy {
    TRIGGERED_BY_UNKNOWN = 0;
    TRIGGERED_BY_PUSH = 1;
    TRIGGERED_BY_RESET = 2;
    TRIGGERED_BY_ENROLLMENT = 3;
  }

  // The origin of the event that triggered this job
  TriggeredBy triggered_by = 9;
}
