permissions:
  contents: read
  packages: read
name: Protobuf Checks
on:
  push:
    branches:
      - main
    paths:
      - proto/**
      - config/tools/buf/**
      - script/buf
  pull_request:
    branches:
      - main
    paths:
      - proto/**
      - config/tools/buf/**
      - script/buf
  merge_group:
    types: [checks_requested]
jobs:
  protobuf_check:
    name: Protobuf Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Check proto formatting
        run: script/buf format --diff --exit-code proto
      - name: Lint proto files
        run: script/buf lint proto
      - name: Fetch base branch for breaking change detection
        run: git fetch --depth=1 origin main
      - name: Check proto breaking changes
        run: script/buf breaking proto
