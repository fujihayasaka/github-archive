name: Buf CI
on:
  # Apply to all pull requests
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - proto/**

permissions:
  id-token: write
  contents: write
  packages: read
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Need full history to compare branches

      - name: Check version bump
        run: |
          echo "Proto files changed, checking version bump..."
          
          # Get version from main branch
          MAIN_VERSION_RAW=$(git show origin/main:proto/oss_license_compliance/v0/VERSION 2>/dev/null || echo "VERSION = '0.0.0'")
          MAIN_VERSION=$(echo "$MAIN_VERSION_RAW" | sed -n "s/.*VERSION.*=.*['\"]\\([^'\"]*\\)['\"].*/\\1/p")

          # Get version from PR branch (must exist)
          if [ ! -f "proto/oss_license_compliance/v0/VERSION" ]; then
            echo "::error::VERSION file is missing in PR!"
            echo "::error::Please ensure proto/oss_license_compliance/v0/VERSION exists"
            exit 1
          fi
          
          # Extract version from Ruby-style VERSION file (VERSION = '0.5.0')
          PR_VERSION=$(sed -n "s/.*VERSION.*=.*['\"]\\([^'\"]*\\)['\"].*/\\1/p" proto/oss_license_compliance/v0/VERSION)
          
          echo "::notice::Main branch version: $MAIN_VERSION"
          echo "::notice::PR branch version: $PR_VERSION"
          
          # Debug: show what we extracted
          if [ -z "$MAIN_VERSION" ]; then
            echo "::error::Could not extract version from main branch"
            exit 1
          fi
          if [ -z "$PR_VERSION" ]; then
            echo "::error::Could not extract version from PR branch VERSION file"
            exit 1
          fi
          
          # Function to compare semantic versions
          # Returns: 1 if version1 > version2, 0 if equal, -1 if version1 < version2
          compare_versions() {
            # Remove 'v' prefix if present and split into major.minor.patch
            local ver1=$(echo "$1" | sed 's/^v//')
            local ver2=$(echo "$2" | sed 's/^v//')
            
            # Split versions into arrays
            IFS='.' read -ra V1 <<< "$ver1"
            IFS='.' read -ra V2 <<< "$ver2"
            
            # Pad arrays to ensure they have at least 3 elements (major.minor.patch)
            while [ ${#V1[@]} -lt 3 ]; do V1+=(0); done
            while [ ${#V2[@]} -lt 3 ]; do V2+=(0); done
            
            # Compare major, minor, patch
            for i in 0 1 2; do
              if [ ${V1[i]} -gt ${V2[i]} ]; then
                echo 1
                return
              elif [ ${V1[i]} -lt ${V2[i]} ]; then
                echo -1
                return
              fi
            done
            
            echo 0
          }
          
          # Compare versions
          VERSION_COMPARISON=$(compare_versions "$PR_VERSION" "$MAIN_VERSION")
          
          if [ "$VERSION_COMPARISON" -eq 0 ]; then
            echo "::error::Proto files changed but version not updated!"
            echo "::error::Please update the version in proto/oss_license_compliance/v0/VERSION"
            echo "::error::Current version: $MAIN_VERSION, PR version: $PR_VERSION"
            exit 1
          elif [ "$VERSION_COMPARISON" -eq -1 ]; then
            echo "::error::PR version ($PR_VERSION) is lower than main version ($MAIN_VERSION)!"
            echo "::error::Please ensure the version is incremented properly"
            exit 1
          else
            echo "::notice::✅ Version properly bumped from $MAIN_VERSION to $PR_VERSION"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check-version
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: osslicensecompliance
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate with goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: Generate proto buf code
        run: "./script/protobuf-gen"

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Proto generated files are not up to date."
            echo "::error::Please run 'make protoc' locally and commit the generated files."
            echo ""
            echo "Files with changes:"
            git diff --name-only
            exit 1
          fi
          echo "::notice::✅ No uncommitted changes after protobuf generation"

      # Only run validation steps if generated code is up-to-date
      - name: Buf CI
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff
        with:
          input: proto
          push: false
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          lint: true
          format: false
          breaking_against: 'https://github.com/github/osslicensecompliance.git#branch=main,subdir=proto'
