syntax = "proto3";
package github.authentication.v0;

option go_package = "client/proto/authentication/v0";
option ruby_package = "Authnd::Proto";

import "google/protobuf/timestamp.proto";

// ExtendStatelessAppTokenExpirationRequest captures the parameters needed to extend the expiration of a stateless app token.
message ExtendStatelessAppTokenExpirationRequest {
	// The token to extend.
	string token = 1;

	// The new expiration time for the token. If not provided, defaults to 1 hour from now.
	google.protobuf.Timestamp expires_at = 2;
}

// ExtendStatelessAppTokenExpirationResponse holds the result of extending the token expiration.
message ExtendStatelessAppTokenExpirationResponse {
	// Result is a high level result of the extend attempt.
	enum Result {
		// RESULT_UNKNOWN should never be used (zero value).
		RESULT_UNKNOWN = 0;
		// The token expiration was extended successfully.
		RESULT_SUCCESS = 1;
		// The request contained invalid arguments.
		RESULT_INVALID_ARGUMENTS = 2;
		// The token was not found.
		RESULT_NOT_FOUND = 3;
		// The token has expired and cannot be extended.
		RESULT_TOKEN_END_OF_LIFE = 4;
		// The requested expiration is too long.
		RESULT_EXPIRATION_TOO_LONG = 5;
		// Expiration at is in the past.
		RESULT_EXPIRATION_IN_PAST = 6;
		// RESULT_FAILED_GENERIC indicates the extension failed.
		RESULT_FAILED_GENERIC = -1;
	}

	// Result is the overall result of extending the token expiration.
	Result result = 1;

	string error = 2;

	// The new expiration time for the token, if the extension was successful.
	google.protobuf.Timestamp extended_expiration_to = 3;
}
