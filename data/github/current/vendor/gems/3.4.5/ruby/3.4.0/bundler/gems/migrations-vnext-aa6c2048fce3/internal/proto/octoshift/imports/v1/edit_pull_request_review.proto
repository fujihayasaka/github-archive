syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/pull_request_review.proto";
import "imports/v1/live_migration_action.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// EditPullRequestReviewAPI handles pull request review edit operations.
service EditPullRequestReviewAPI {
  // EditPullRequestReview edits pull request review data during live migrations.
  rpc EditPullRequestReview(EditPullRequestReviewRequest) returns (EditPullRequestReviewResponse);
}

message EditPullRequestReviewRequest {
  // id is the ID of the pull request review to edit. (required)
  int64 id = 1;
  // updated_at indicates the date and time when the pull request review was last updated. (required)
  google.protobuf.Timestamp updated_at = 2;
  // user_login indicates the login for the user performing the action. (required)
  string user_login = 3;
  // body is the body of the pull request review.
  google.protobuf.StringValue body = 4;
}

message EditPullRequestReviewResponse {
  // id is the database ID of the pull request review. (required)
  int64 id = 1;
}
