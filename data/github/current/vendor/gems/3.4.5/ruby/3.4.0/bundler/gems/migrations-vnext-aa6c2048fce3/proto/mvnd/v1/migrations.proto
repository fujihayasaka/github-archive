syntax = "proto3";

package mvnd.migrations.api.v1;

option go_package = "github.com/github/migrations-vnext/proto/mnvd/api/v1";

import "mvnd/v1/events.proto";
import "mvnd/v1/resources.proto";

message CreateResourceRequest {
  int64 migration_id = 1;
  Resource resource = 2;
}

message CreateResourceResponse {}

enum StatusType {
  STATUS_TYPE_INVALID = 0;
  STATUS_TYPE_IN_PROGRESS = 1;
  STATUS_TYPE_COMPLETE = 2;
  STATUS_TYPE_FAILED = 3;
}

enum ResourceType {
  RESOURCE_TYPE_INVALID = 0;
  RESOURCE_TYPE_ISSUE = 1;
  RESOURCE_TYPE_ISSUE_COMMENT = 2;
  RESOURCE_TYPE_REACTIONS = 3;
}

message MigrationStatusRequest {
  int64 migration_id = 1;
}

message MigrationStatusResponse {
  StatusType status = 1;
  int64 pending_resources = 2;
  int64 completed_resources = 3;
  int64 failed_resources = 4;
}

message AbortMigrationRequest {
  int64 migration_id = 1;
}

message AbortMigrationResponse {}

message PauseMigrationsRequest {}
message PauseMigrationsResponse {}
message ResumeMigrationsRequest {}
message ResumeMigrationsResponse {}

enum AssetKind {
  ASSET_KIND_RELEASE_INVALID = 0;
  ASSET_KIND_RELEASE_ASSET = 1;
  ASSET_KIND_USER_ASSET = 2;
}
message GenerateSignedUploadURLRequest {
  string file_name = 1;
  string content_type = 2;
  int64 file_size_bytes = 3;
  AssetKind asset_kind = 4;
}

message GenerateSignedUploadURLResponse{
  string signed_url = 1;
}

service Migration {
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse);
  rpc MigrationStatus(MigrationStatusRequest) returns (MigrationStatusResponse);

  rpc AbortMigration(AbortMigrationRequest) returns (AbortMigrationResponse);
  rpc PauseMigrations(PauseMigrationsRequest) returns (PauseMigrationsResponse);
  rpc ResumeMigrations(ResumeMigrationsRequest) returns (ResumeMigrationsResponse);

  rpc StoreEvent(StoreEventRequest) returns (StoreEventResponse);

  rpc GenerateSignedUploadURL(GenerateSignedUploadURLRequest) returns (GenerateSignedUploadURLResponse);
}