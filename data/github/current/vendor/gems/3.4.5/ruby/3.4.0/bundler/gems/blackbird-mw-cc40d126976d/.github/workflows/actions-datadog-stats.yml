name: Actions Datadog Stats
# Collects metrics from all jobs and steps mentioned in the workflows listed below.

on:
  workflow_run:
    workflows:
      - '**'
    types:
      - completed
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: github/datadog-actions-metrics@v1
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
          collect-job-metrics: true
          collect-step-metrics: true

permissions:
  actions: read
  checks: read
  contents: read
