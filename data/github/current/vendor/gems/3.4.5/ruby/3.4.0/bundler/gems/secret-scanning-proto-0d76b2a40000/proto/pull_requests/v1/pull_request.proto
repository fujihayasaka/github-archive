syntax = "proto3";

package github.secretscanning.pull_requests.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/pull_requests";
option ruby_package = "GitHub::Proto::SecretScanning::PullRequests::V1";

message PullRequestIdentifier {
  // the database ID of the pull request
  uint64 pull_request_id = 1;

  // the repo scoped number of the pull request
  uint32 pull_request_number = 2;
}