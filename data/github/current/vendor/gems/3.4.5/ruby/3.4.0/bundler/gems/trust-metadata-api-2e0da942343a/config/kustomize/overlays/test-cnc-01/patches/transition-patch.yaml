kind: Job
metadata:
  name: transition-template-job
spec:
  template:
    spec:
      containers:
        - name: transition
          # When the transition ends, it forces the service mesh to
          # fail.
          # See https://thehub.github.com/epd/engineering/products-and-services/internal/moda/service-mesh/onboarding/#cronjobs-and-jobs
          # for reference
          command:
            - /usr/bin/tools/istio-job-wrapper
            - /bin/transition
