syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/import.proto";

// CreateImportAPI handles create import operation.
service CreateImportAPI {
  // CreateImport initiates an import.
  rpc CreateImport(CreateImportRequest) returns (CreateImportResponse);
}

message CreateImportRequest {
  // user_id is the ID of the user that wants to create an import. (required)
  int64 user_id = 1;
}

message CreateImportResponse {
  // import is the created import object. (required)
  Import import = 1;
}
