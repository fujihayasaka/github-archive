syntax = "proto3";

package notifyd.api.test;
option go_package = "proto/services/test";
option ruby_package = "Notifyd::Proto::Test";

// The Test service is meant to be used as a way to test notifyd's application
// and framework related code that isn't domain specific like twirp hooks,
// logging, etc.
//
// It defines a test Echo endpoint whose only purpose is to echo a string
// message it receives on the request.
//
// NOTE: This isn't meant to be implemented by the application in any way that is
// relevant to our integrators or our users.
service Test {
  // echoes a message received on the request.
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Timeout(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  // the message to be echoed.
  string msg = 1;
}

message EchoResponse {
  // the echoed message.
  string msg = 1;
}
