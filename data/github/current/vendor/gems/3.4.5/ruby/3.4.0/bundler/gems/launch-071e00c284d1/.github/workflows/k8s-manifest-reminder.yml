name: k8s-manifest-reminder
on:
  pull_request:
    types: [opened]
    branches:
      - master
      - main
    paths:
      - 'config/kustomize/overlays/**'

jobs:
  flag:
    runs-on: ubuntu-latest
    steps:
      - name: Remind about k8s changes
        uses: actions/github-script@v6.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 @" + context.actor + `, this is a friendly reminder since this pull request contains k8s manifest changes to please check the [corresponding manifest files in the other \`config/kustomize/\` directories](https://github.com/github/launch/tree/` + github.ref + `/config/kustomize) and copy your changes there as needed.

              See [here](https://github.com/github/launch/blob/master/docs/kustomize-and-kubernetes-configs.md) for details.

              ✨ `
            })
