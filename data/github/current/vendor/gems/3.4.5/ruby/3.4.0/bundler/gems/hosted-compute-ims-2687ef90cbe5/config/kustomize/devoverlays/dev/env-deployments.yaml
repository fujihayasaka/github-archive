- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: ENVIRONMENT
      value: "development"
    - name: SERVICE_NAME
      value: "hosted-compute-ims"
    - name: GITHUB_TELEMETRY_LOGS_LEVEL
      value: "info"
    - name: HMAC_AUTH_ENABLED
      value: "false"
    - name: VSSF_AUTH_ENABLED
      value: "false"
    - name: AQUEDUCT_URL
      value: "http://ims-aqueduct:28141"
    - name: AQUEDUCT_APP
      valueFrom:
        configMapKeyRef:
          name: ims-env-dynamic
          key: AQUEDUCT_APP
    - name: MYSQL_HOST
      value: "ims-mysql"
    - name: MYSQL_PORT
      value: "28142"
    - name: MYSQL_DATABASE_NAME
      value: "hosted_compute_ims_development"
    - name: DOTCOM_INTERNAL_TWIRP_URL
      value: "http://api.github.localhost/internal"
    - name: FEATURE_FLAGS_SUPPORTED_STAMPS
      value: dotcom
    - name: DOTCOM_INTERNAL_TWIRP_HMAC_KEY
      value: "launchhmac"
    - name: FEATURE_FLAGS_ALLOW_FALLBACK_TO_LOCAL
      value: "true"
    - name: GITHUB_USER
      valueFrom:
        configMapKeyRef:
          name: ims-env-dynamic
          key: GITHUB_USER
    - name: GITHUB_TELEMETRY_LOGS_INCLUDE_RESOURCE_ATTRIBUTES
      value: ""
    - name: GITHUB_TELEMETRY_LOGS_CONSOLE_ENCODING
      value: "console"
    - name: GITHUB_TELEMETRY_LOGS_PRECISION
      value: "second"
    - name: VEXI_FF_LITE_URL
      value: http://192.168.49.1:8090