syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

package notifyd.api.devicetokens_v2;
option go_package = "proto/services/devicetokens/v2";
option ruby_package = "Notifyd::Proto::DeviceTokensV2";

service DeviceTokensV2 {
	rpc Set(SetRequest) returns (google.protobuf.BoolValue);
	rpc Delete(DeleteRequest) returns (google.protobuf.Empty);
	rpc DeleteAll(DeleteAllRequest) returns (google.protobuf.Empty);
}

message SetRequest {
	int64 user_id = 1;
	int64 oauth_access_id = 2;
	string token = 3;
	string encryption_key = 4; // base64 encoded
	string hmac_key = 5; // base64 encoded
}

message DeleteRequest {
	int64 user_id = 1;
	string token = 2;
}

message DeleteAllRequest {
	int64 user_id = 1;
}

