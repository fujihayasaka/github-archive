syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/reference.proto";

// ReferenceUpdate represents a push or other change to a single ref.
message ReferenceUpdate {
    // reference is the ref involved in the update. (required)
    github.spokes.types.v1.Reference reference = 1;

    // before is the oid that was the tip of the ref before the update. In case
    // of a new ref being added, this field should be left empty.
    github.spokes.types.v1.ObjectID before = 2;

    // after is the oid that is the tip of the ref after the update. In case of
    // a ref being deleted, this field should be left empty.
    github.spokes.types.v1.ObjectID after = 3;
}
