# This is an overlay for docker-compose.yaml

services:
  create-repo:
    image: golang:1.15
    working_dir: "/work/utils/create-repo"
    entrypoint:
      - "go"
      - "run"
      - "."
    depends_on:
      - mysql
    volumes:
      - ".:/work"

  create-cert:
    image: ${SPOKESD_IMAGE:-ghcr.io/github/spokesd/spokesd:ab175a8c7fb900094e3306217638cc8f295c9746}
    working_dir: "/work"
    entrypoint:
      - "script/spokesd-cert-env"
      - "/spokesctl"
      - "certificates"
      - "generate-client-certificate"
    volumes:
      # Output will be written here.
      - ".:/work"
      # Root certs will be read from here in script/spokesd-cert-env.
      - "./certs:/etc/spokesd/certs"
