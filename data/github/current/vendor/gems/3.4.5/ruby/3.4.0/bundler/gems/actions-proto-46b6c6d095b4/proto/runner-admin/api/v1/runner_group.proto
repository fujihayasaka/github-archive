syntax = "proto3";

package github.actions.runner_admin.api.v1;

import "runner-admin/api/v1/runner.proto";
import "runner-admin/entities/v1/identity.proto";

option ruby_package = "GitHub::ActionsRunnerAdmin::Api::V1";

enum Visibility {
    VISIBILITY_UNKNOWN = 0;
    VISIBILITY_ALL = 1;
    VISIBILITY_SELECTED = 2;
}

enum UpdateVisibility {
    UPDATE_VISIBILITY_UNKNOWN = 0;
    UPDATE_VISIBILITY_ALL = 1;
    UPDATE_VISIBILITY_SELECTED = 2;
}

enum UpdateAllowPublic {
    UPDATE_ALLOW_PUBLIC_UNKNOWN = 0;
    UPDATE_ALLOW_PUBLIC_ALLOW = 1;
    UPDATE_ALLOW_PUBLIC_DENY = 2;
}

enum UpdateRestrictedToWorkflows {
    UPDATE_RESTRICTED_TO_WORKFLOWS_UNKNOWN = 0;
    UPDATE_RESTRICTED_TO_WORKFLOWS_RESTRICTED = 1;
    UPDATE_RESTRICTED_TO_WORKFLOWS_UNRESTRICTED = 2;
}

message RunnerGroup {
    int64 id = 1;
    string name = 2;
    bool is_default = 3;
    Visibility visibility = 4; // (default selected)
    repeated entities.v1.Identity selected_targets = 5; // selected repos/orgs
    bool allow_public = 6;
    bool restricted_to_workflows = 7;
    repeated string selected_workflow_refs = 8;
    bool workflow_restrictions_read_only = 9;
    entities.v1.Identity owner_id = 10;
    bool inherited_allow_public = 11;
    repeated Runner runners = 12;
}