syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

// ImportCommitCommentAPI handles the commit comments import operation.
service ImportCommitCommentAPI {
  // ImportCommitComment imports commit comments to a migrated repository.
  rpc ImportCommitComment(ImportCommitCommentRequest) returns (ImportCommitCommentResponse);
}

message ImportCommitCommentRequest {
  // repository_id is the id of the repository that owns the commit comments. (required)
  int64 repository_id = 1;
  // commit_id is the commit ID to add a commit comment to. (required)
  string commit_id = 2;
  // body is the commit comment body. (required)
  string body = 3;
  // path is the path the commit comment should be placed on.
  google.protobuf.StringValue path = 4;
  // position is the line position the commit comment should be placed on.
  google.protobuf.Int64Value position = 5;
  // author_login is the user login that the commit comment should be created with. (required)
  string author_login = 6;
  // created_at is the time that the commit comment should be created with. (required)
  google.protobuf.Timestamp created_at = 7;
}

message ImportCommitCommentResponse {
  // id is the database ID for the imported commit comment. (required)
  int64 id = 1;
}
