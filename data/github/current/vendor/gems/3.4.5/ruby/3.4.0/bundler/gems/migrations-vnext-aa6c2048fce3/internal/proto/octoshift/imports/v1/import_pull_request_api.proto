syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/pull_request.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// ImportPullRequestAPI handles pull request import operation.
service ImportPullRequestAPI {
  // ImportPullRequest imports pull request data to a migrated repository.
  rpc ImportPullRequest(ImportPullRequestRequest) returns (ImportPullRequestResponse);
}

message ImportPullRequestRequest {
  // author_login is the source login for the author of the imported pull request. (required)
  string author_login = 1;
  // import_id is id of the import. (optional)
  int64 import_id = 2;
  // repository_id is the associated repository id. (required)
  int64 repository_id = 3;
  // base_ref_name is the name of the branch you want your changes pulled into.
  // This should be an existing branch on the current repository.
  // You cannot update the base branch on a pull request to point to another repository. (required)
  string base_ref_name = 4;
  // head_ref_name is the name of the branch where your changes are implemented.
  // For cross-repository pull requests in the same network,
  // namespace `head_ref_name` with a user like this: `username:branch`. (required)
  string head_ref_name = 5;
  // title is the title of the pull request. (required)
  string title = 6;
  // body is the text contents of the pull request description.
  string body = 7;
  // number identifies the pull request number.
  int64 number = 8;
  // is_draft indicates whether this pull request should be a draft.
  bool is_draft = 9;
  // merged_at indicates the date and time when the pull request was merged.
  google.protobuf.Timestamp merged_at = 10;
  // created_at Indicates the date and time when the pull request was created.
  google.protobuf.Timestamp created_at = 11;
  // closed_at indicates the date and time when the pull request was closed.
  google.protobuf.Timestamp closed_at = 12;
  // base_ref_commit_sha is the latest commit sha at the time of the pull request being merged/closed for the base branch.
  string base_ref_commit_sha = 13;
  // head_ref_commit_sha is the latest commit sha at the time of the pull request being merged/closed for the head branch.
  string head_ref_commit_sha = 14;
  // reviewers is list of users that were/are to be requested for review.
  repeated string reviewers = 15;
  // labels is list of labels that are associated with this pull request. (deprecated)
  repeated string labels = 16;
  // milestone_id is the imported milestone linked with this pull request. (deprecated)
  google.protobuf.Int64Value milestone_id = 17;
  // assignees is a list of assignee logins
  repeated string assignees = 18;
  // merge_commit_sha is the sha of the pull request's merge commit, if it has one.
  string merge_commit_sha = 19;
  // originates_from_fork indicates if pull request originates from a fork repository.
  bool originates_from_fork = 20;
}

message ImportPullRequestResponse {
  // pull_request is the new pull request. (required)
  PullRequest pull_request = 1;
}
