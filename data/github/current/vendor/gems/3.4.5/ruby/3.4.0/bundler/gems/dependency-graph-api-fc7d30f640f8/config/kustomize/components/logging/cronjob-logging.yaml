apiVersion: batch/v1
kind: CronJob
metadata:
    name: dummy
spec:
    jobTemplate:
        spec:
            template:
                metadata:
                    annotations:
                        fluentbit.io/parser: logfmt_sloppy
                        observability.github.com/logger: fluent-bit
                        observability.github.com/splunk_index: dependency-graph-api
                spec:
                    restartPolicy: Never
    concurrencyPolicy: Forbid
