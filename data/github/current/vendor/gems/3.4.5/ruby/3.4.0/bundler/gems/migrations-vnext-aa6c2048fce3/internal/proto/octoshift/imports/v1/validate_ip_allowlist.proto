syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// ValidateIpAllowlistAPI validates ip allowlist of th organization for a migration
service ValidateIpAllowlistAPI {
  // ValidateIpAllowlist validates ip allowlist of th organization for a migration
  rpc ValidateIpAllowlist(ValidateIpAllowlistRequest) returns (ValidateIpAllowlistResponse);
}

message ValidateIpAllowlistRequest {
  // owner_id is the ID of the owner for the new repository. (required)
  int64 owner_id = 1;
}

message ValidateIpAllowlistResponse {
  // allows_ip is whether the octoshift ip is allowed or not. (required)
  bool allows_ip = 1;
}
