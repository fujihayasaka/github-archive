syntax = "proto3";

package octoshift.imports.v2;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v2";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V2";

message ImportError {
  // resource_identifier is corresponding resource identifier of the transformed resource that encountered an error (required)
  string resource_identifier = 1;
  // message is the error message (required)
  string message = 2;
  // twirp_error_code is the Twirp error code. e.g invalid_argument, invalid_argument, etc. (required)
  string twirp_error_code = 3;
  // octoshift_error_code is the Octoshift error code. e.g ALREADY_EXISTS, RATE_LIMIT_EXCEPTION, etc. (required)
  string octoshift_error_code = 4;
}
