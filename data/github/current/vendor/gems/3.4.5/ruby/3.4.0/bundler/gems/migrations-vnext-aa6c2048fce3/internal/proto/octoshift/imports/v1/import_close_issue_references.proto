syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/batch_validation_error.proto";

// ImportCloseIssueReferencesAPI handles importing close issue references.
service ImportCloseIssueReferencesAPI {
  // ImportCloseIssueReferences imports close issue references for pull requests and issues.
  rpc ImportCloseIssueReferences(ImportCloseIssueReferencesRequest) returns (ImportCloseIssueReferencesResponse);
}

message ImportCloseIssueReferencesRequest {
  // close_issue_references is a list of close issue references to be imported. (required)
  repeated CloseIssueReference close_issue_references = 1;
}

message CloseIssueReference {
  // pull_request_id is the database id of the imported pull request. (required)
  int64 pull_request_id = 1;
  // issue_id is the database id of the imported issue that the pull request may close. (required)
  int64 issue_id = 2;
}

message ImportCloseIssueReferencesResponse {
  // batch_validation_errors is a list of validation errors for models that failed to import. (optional)
  repeated BatchValidationError batch_validation_errors = 1;
}
