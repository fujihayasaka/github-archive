syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/timestamp.proto";

// ImportMilestonesAPI handles the import milestones operation.
service ImportMilestonesAPI {
  // ImportMilestones imports milestones to a migrated repository.
  rpc ImportMilestones(ImportMilestonesRequest) returns (ImportMilestonesResponse);
}

message ImportMilestonesRequest {
  // repository_id is the id of the repository that owns the milestones. (required)
  int64 repository_id = 1;
  // milestones is a list of milestones that will be imported into the repository.
  repeated Milestone milestones = 2;
}

message Milestone {
  // source_id is the database ID of the milestone extracted from the migration source. (required)
  int64 source_id = 1;
  // title is the title of the milestone. (required)
  string title = 2;
  // created_by_user_login is the user login of the milestone creator. (required)
  string created_by_user_login = 3;
  // description is the milestone description.
  string description = 4;
  // state is the state the milestone is in.
  MilestoneState state = 5;
  // due_on is the date and time the milestone is due.
  google.protobuf.Timestamp due_on = 6;
  // created_at is the date and time the milestone was created.
  google.protobuf.Timestamp created_at = 7;
  // updated_at is the date and time the milestone was last updated.
  google.protobuf.Timestamp updated_at = 8;
  // closed_at is the date and time the milestone was closed, if applicable.
  google.protobuf.Timestamp closed_at = 9;
  //issue_ids is a list of ids for the issues included in the milestone.
  repeated int64 issue_ids = 10;
}

message ImportMilestonesResponse {
  // milestone_mappings is a list of imported milestone mappings. (required)
  repeated MilestoneMapping milestone_mappings = 1;

  // milestone_errors is a list of milestones and its issues that failed association. (optional)
  repeated MilestoneError milestone_errors = 2;
}

message MilestoneMapping {
  // id is the database ID of the imported milestone. (required)
  int64 id = 1;
  // source_id is the database ID of the milestone extracted from the migration source. (required)
  int64 source_id = 2;
}

message MilestoneError {
  // milestone is the transformed milestone that failed issue saving
  Milestone milestone = 1;
  // error_list is the list of issue ids that failed to be attributed to the milestone
  repeated int64 error_list = 2;
}

enum MilestoneState {
  MILESTONE_STATE_INVALID = 0;
  MILESTONE_STATE_OPEN = 1;
  MILESTONE_STATE_CLOSED = 2;
}
