syntax = "proto3";
package github.authentication.v0;

option go_package = "client/proto/authentication/v0";
option ruby_package = "Authnd::Proto";

import "google/protobuf/timestamp.proto";

enum SocialIdentityProvider {
    UNKNOWN = 0;
    GOOGLE = 1;
}

message RegisterSocialIdentityRequest {
    // The user ID of the github account.
    uint64 user_id = 1;

    // The user_email_id associated with the user_email used for social login.
    uint64 user_email_id = 2;
    
    // The social identity provider object
    SocialIdentityProvider provider = 3;
    
    // The subject_id relates to the social identity provider user id (unique).
    string subject_id = 4;
}

message RegisterSocialIdentityResponse {
    enum Result {
        // RESULT_UNKNOWN Should never be used because it is the zero value for this field and will be invisible when encoded into JSON.
        RESULT_UNKNOWN = 0;
        // RESULT_SUCCESS indicates the request was successful.
        RESULT_SUCCESS = 1;
        // RESULT_FAILED_USER_NOT_FOUND indicates the user_id is not valid.
        RESULT_FAILED_USER_NOT_FOUND = 4;
        // RESULT_FAILED_CONFLICTING_IDENTITY indicates that the provider + subject_id combination is already registered, to a different user or email than the one requested.
        RESULT_FAILED_CONFLICTING_IDENTITY = 5;
        // RESULT_FAILED_GENERIC indicates the issue request failed. If possible a more descriptive result code should be used.
        RESULT_FAILED_GENERIC = -1;
    }
    
    // The overall result of processing the RegisterSocialIdentityResponse.
    Result result = 1;
}

message SocialIdentityRegistration{
    // The user ID
    uint64 user_id = 1;
    
    // The user_email_id associated with the user_email used for social login.
    uint64 user_email_id = 2;

    // The social identity provider enum
    SocialIdentityProvider provider = 3;

    // The subject_id relates to the social identity provider user id (unique).
    string subject_id = 4;

    // The social identity was registered at this time.
    google.protobuf.Timestamp created_at_utc = 5;

    // The social identity was last used at this time.
    google.protobuf.Timestamp last_used_at_utc = 6;
}

message FindSocialIdentityRequest {
    // The user_email_id associated with the user_email used for social login.
    uint64 user_email_id = 1;

    // The social identity provider object
    SocialIdentityProvider provider = 2;
    
    // The subject_id relates to the social identity provider user id (unique).
    string subject_id = 3;
}

message FindSocialIdentityResponse {
    enum Result {
        // RESULT_UNKNOWN Should never be used because it is the zero value for this field and will be invisible when encoded into JSON.
        RESULT_UNKNOWN = 0;
        // RESULT_SUCCESS indicates the request was successful.
        RESULT_SUCCESS = 1;
        // RESULT_FAILED_NOT_FOUND indicates that the social identity was not found.
        RESULT_FAILED_NOT_FOUND = 2;
        // RESULT_FAILED_CONFLICTING_IDENTITY indicates that the subject ID is registered to a different email, or that the email is registered to a different subject ID.
        RESULT_FAILED_CONFLICTING_IDENTITY = 3;
        // RESULT_FAILED_GENERIC indicates the issue request failed. If possible a more descriptive result code should be used.
        RESULT_FAILED_GENERIC = -1;
    }

    // The overall result of processing the FindSocialIdentityResponse.
    Result result = 1;

    // The social identity registration associated with the user and provider.
    SocialIdentityRegistration social_identity_registration = 2;
 }

 message FindSocialIdentitiesRequest {
    // The user ID of the github account.
    uint64 user_id = 1;
 }

 message FindSocialIdentitiesResponse {
    enum Result {
        // RESULT_UNKNOWN Should never be used because it is the zero value for this field and will be invisible when encoded into JSON.
        RESULT_UNKNOWN = 0;
        // RESULT_SUCCESS indicates the request was successful.
        RESULT_SUCCESS = 1;
        // RESULT_FAILED_USER_NOT_FOUND indicates the user_id is not valid.
        RESULT_FAILED_USER_NOT_FOUND = 3;
        // RESULT_FAILED_NOT_FOUND indicates that there are no social identities associated with the user.
        RESULT_FAILED_NOT_FOUND = 4;
        // RESULT_FAILED_GENERIC indicates the issue request failed. If possible a more descriptive result code should be used.
        RESULT_FAILED_GENERIC = -1;
    }

    // The overall result of processing the FindSocialIdentitiesResponse.
    Result result = 1;

    // The social identity registration associated with the user.
    repeated SocialIdentityRegistration social_identity_registrations = 2;
 }

message DeleteSocialIdentityRequest {
    // The user_email_id associated with the user_email used for social login.
    uint64 user_email_id = 1;
}

message DeleteSocialIdentityResponse {
    enum Result {
        // RESULT_UNKNOWN Should never be used because it is the zero value for this field and will be invisible when encoded into JSON.
        RESULT_UNKNOWN = 0;
        // RESULT_SUCCESS indicates the request was successful.
        RESULT_SUCCESS = 1;
        // RESULT_FAILED_NOT_FOUND indicates the social identity registration was not found.
        RESULT_FAILED_NOT_FOUND = 2;
        // RESULT_FAILED_GENERIC indicates the issue request failed. If possible a more descriptive result code should be used.
        RESULT_FAILED_GENERIC = -1;
    }
    
    // The overall result of processing the DeleteSocialIdentityResponse.
    Result result = 1;
}

message DeleteSocialIdentitiesRequest {
    // The user ID of the github account.
    uint64 user_id = 1;
}

message DeleteSocialIdentitiesResponse {
    enum Result {
        // RESULT_UNKNOWN Should never be used because it is the zero value for this field and will be invisible when encoded into JSON.
        RESULT_UNKNOWN = 0;
        // RESULT_SUCCESS indicates the request was successful.
        RESULT_SUCCESS = 1;
        // RESULT_FAILED_NOT_FOUND indicates no social identity registrations were found.
        RESULT_FAILED_NOT_FOUND = 2;
        // RESULT_FAILED_GENERIC indicates the issue request failed. If possible a more descriptive result code should be used.
        RESULT_FAILED_GENERIC = -1;
    }

    // The overall result of processing the DeleteSocialIdentitiesResponse.
    Result result = 1;
}
