---
name: "Check sqlc Generated Code"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sqlc-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Install sqlc
        run: |
          sudo snap install sqlc
      - name: Run sqlc
        run: |
          make dev-sqlc
      - name: Verify no file changes
        run: |
          git diff --exit-code --quiet
      - name: Report error
        if: failure()
        run: |
          echo "::error title=Error::Files were changed. Did you forget to run 'make dev-sqlc'?"
