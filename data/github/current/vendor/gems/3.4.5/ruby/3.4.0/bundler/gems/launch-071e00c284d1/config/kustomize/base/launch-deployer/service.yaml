# http://kubernetes.io/docs/user-guide/services
apiVersion: v1
kind: Service

metadata:
  name: launch-deployer
  labels:
    service: launch-deployer
  annotations:
    moda.github.net/domain-name: "launch-deployer-%environment%.service.%site%.github.net,launch-deployer-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"

spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 6824
  type: LoadBalancer
  selector:
    service: launch-deployer
