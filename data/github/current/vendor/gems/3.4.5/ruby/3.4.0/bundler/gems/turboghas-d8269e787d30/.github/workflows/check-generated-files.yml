name: Check Generated Files

on:
  pull_request:
    branches:
      - main
  merge_group:
    reuse-previous-outcome: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      GOPROXY: https://goproxy.githubapp.com/mod,https://proxy.golang.org,direct
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: github.com/github/*

    steps:
      - name: Login to Docker Registry
        run: |
          echo "${{ secrets.CONTAINER_BUILDER_TOKEN }}" | docker login containers.pkg.github.com --username gh-containers-bot --password-stdin

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check generated files.
        run: |
          set -exuo pipefail
          cleanup() {
           docker compose down
          }
          trap cleanup EXIT
          docker compose up --wait --quiet-pull
          script/migrate
          ./script/generate
          changed_files="$(git ls-files --exclude-standard --others --deleted --modified)"
          if [ ! -z "$changed_files" ]; then
            >&2 echo -e "Please ensure these generated files are up-to-date by running script/generate and committing the changes:\n$changed_files"
            exit 1
          fi
