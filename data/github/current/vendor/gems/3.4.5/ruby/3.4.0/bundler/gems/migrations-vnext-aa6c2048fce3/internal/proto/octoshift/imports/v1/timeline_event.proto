syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/timestamp.proto";
import "imports/v1/import_pull_request_review_api.proto";

message TimelineEvent {
  // user_login is the login of the user that initiated the timeline event. (required; but not required if actor is sent)
  string user_login = 1;
  // issue_number is the imported pull request issue number associated with the event. (required)
  int64 issue_number = 2;
  // repository_id is the associated repository id. (required)
  int64 repository_id = 3;
  // event is the event type. (required)
  string event = 4;
  // created_at indicates the date and time when the timeline event was created. (required)
  google.protobuf.Timestamp created_at = 5;
  // label_name is the label that will be associated with an event (labeled, unlabeled) when added to an issue or pull request.
  string label_name = 6;
  // title_is is the changed title of the issue or pull request associated with event (renamed).
  string title_is = 7;
  // title_was is the before title of the issue or pull request associated with event (renamed).
  string title_was = 8;
  // assignee_login is the login of the user assigned to the issue or pull request associated with event (assigned, unassigned) (not required if actor is sent).
  string assignee_login = 9;
  // commit_id is the ID of the commit associated with the issue or pull request event.
  // Always available on merge and referenced event types.
  // Sometimes available on close events if the issue was closed from a commit message.
  // For reference events, the commit can originate from a fork of the repository that owns the issue.
  string commit_id = 10;
  // review_requester_login is the user requesting or (un)requesting review to the issue or pull request associated with event (review_requested, review_request_removed) (not required if actor is sent).
  string review_requester_login = 11;
  // requested_reviewer_login is the user requested or (un)requested to review the issue or pull request associated with event (review_requested) (not required if actor is sent).
  string requested_reviewer_login = 12;
  // commit_repository_id is the associated repository id of the 'referenced' event.
  int64 commit_repository_id = 13;
  // referencing_issue_number is the number of the issue or pull request that made the reference for a referenced event.
  int64 referencing_issue_number = 14;
  // performed_by_integration_id is the associated integration id for a deployment event.
  int64 performed_by_integration_id = 15;
  // milestone_title is the milestone title associated with the milestone event.
  string milestone_title = 16;
  // subject_number is the associated issue or pull request number of the object referenced by event (not required if actor is sent).
  int64 subject_number = 17;
  // deployment_id is the associated deployment id.
  int64 deployment_id = 18;
  // ref is the fully qualified ref name for a force_pushed event.
  string ref = 19;
  // before_commit_oid is the ID of the before commit SHA for a force_pushed event.
  string before_commit_oid = 20;
  // after_commit_oid is the ID of the after commit SHA for a force_pushed event.
  string after_commit_oid = 21;
  // pull_request_review_state_was is the previous state of the pull request review.
  PullRequestReviewState pull_request_review_state_was = 22;
  // pull_request_review_id is the associated pull request review id.
  int64 pull_request_review_id = 23;
  // review_request_id is the associated review request id.
  int64 review_request_id = 24;
  // column_name is the column name the issue or pull request was moved to.
  string column_name = 25;
  // previous_column_name is the column name the issue or pull request was moved from.
  string previous_column_name = 26;
  // card_id is the associated project card id.
  int64 card_id = 27;
  // performed_by_project_workflow_action_id is the associated actions workflow id.
  int64 performed_by_project_workflow_action_id = 28;
  // lock_reason is the reason why an item was locked.
  string lock_reason = 29;
  // block_duration_days is the number of days that the user is blocked for.
  int64 block_duration_days = 30;
  // message is a string with context for a timeline event.
  string message = 31;
  // deployment_status_id is the associated id of the deployment status referenced by event.
  int64 deployment_status_id = 32;
  // actor is the actor of the issue event, this can be a user login or an issue number.
  // Sending this new dynamic attribute replaces the need for the following attrbutes: user_login,
  // assignee_login, review_requester_login, and requested_reviewer_login.
  string actor = 33;
  // subject is the subject of the issue event, this can be a user login or an issue number.
  // Sending this new dynamic attribute replaces the need for the subject_number attribute.
  string subject = 34;
  // milestone_id is the id of the associated milestone.
  int64 milestone_id = 35;
}
