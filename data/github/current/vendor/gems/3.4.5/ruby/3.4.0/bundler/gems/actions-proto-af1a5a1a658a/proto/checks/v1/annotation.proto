syntax = "proto3";

import "google/protobuf/wrappers.proto";

package github.actions.checks.v1;

// Levels of an annotation https://github.com/github/github/blob/e5f2da9c0d7513027562e4685bbe847cbeb37378/packages/checks/app/models/check_annotation.rb#L95-L105
enum AnnotationLevel {
  ANNOTATION_LEVEL_UNKNOWN = 0;
  ANNOTATION_LEVEL_NOTICE = 1;
  ANNOTATION_LEVEL_WARNING = 2;
  ANNOTATION_LEVEL_FAILURE = 3;
}

// Annotation is an annotation on a checks entity (suite or run)
message Annotation {
  AnnotationLevel level = 1;
  // Description of the issue (ex. the type of an exception)
  string message = 2;
  // Issue details (ex. stack trace for an exception)
  google.protobuf.StringValue raw_details = 3; // optional
  // Path of the file to annotate
  google.protobuf.StringValue path = 4; // optional
  // Start line of the annotation (1-indexed)
  google.protobuf.Int64Value start_line = 5; // optional
  // End line of the annotation
  google.protobuf.Int64Value end_line = 6; // optional
  // Start column of the annotation. (1-indexed) Annotations only support start_column and end_column on the same line. Omit this parameter if start_line and end_line have different values.
  google.protobuf.Int64Value start_column = 7; // optional
  // End column of the annotation. Annotations only support start_column and end_column on the same line. Omit this parameter if start_line and end_line have different values.
  google.protobuf.Int64Value end_column = 8; // optional
  // The title that represents the annotation. The maximum size is 255 characters.
  google.protobuf.StringValue title = 9; // optional
  // The step number an annotation visible in logs originates from if applicable
  google.protobuf.Int64Value step_number = 10; // optional
}
