apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - resourcequota.yaml
  - servicemeshconfig.yaml

patchesStrategicMerge:
  - deployment.yaml

configMapGenerator:
  - name: config
    behavior: merge
    literals:
      - TWIRP_INTERNAL_API_URL='https://internal-api.service.iad.github.net/internal'
