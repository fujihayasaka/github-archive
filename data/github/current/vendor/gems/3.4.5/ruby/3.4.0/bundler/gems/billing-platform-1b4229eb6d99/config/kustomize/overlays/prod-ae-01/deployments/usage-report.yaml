apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-report
spec:
  replicas: 2
  template:
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: usage-report
          env:
            - name: KUSTO_BLOB_EXPORT_STORAGE_ACCOUNT_ENDPOINT
              value: https://mbprodae01.blob.core.windows.net
            - name: KUSTO_ENDPOINT
              value: https://ede-billing-prodae01.australiaeast.kusto.windows.net
            - name: IS_PROXIMA
              value: "true"
            - name: HYDRO_CONSUMER_GROUP_ID
              value: usage-ingestion-production-consumerV2-prod-ae-01
