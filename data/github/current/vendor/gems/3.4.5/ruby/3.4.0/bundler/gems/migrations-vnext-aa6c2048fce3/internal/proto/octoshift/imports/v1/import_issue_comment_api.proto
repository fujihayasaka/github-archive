syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/issue_comment.proto";
import "google/protobuf/timestamp.proto";

// ImportIssueCommentAPI handles the issue comment import operation.
service ImportIssueCommentAPI {
  // ImportIssueComment imports a single issue comment to a migrated issue.
  rpc ImportIssueComment(ImportIssueCommentRequest) returns (ImportIssueCommentResponse);
}

message ImportIssueCommentRequest {
  // issue_id is the id of the issue that owns the commnet. (required)
  int64 issue_id = 1;
  // author_login is the login of the user that created the issue (can be a mannequin). (required)
  string author_login = 2;
  // body is the text contents of the issue comment (with markup)
  string body = 3;
  // created_at indicates the date and time when the issue comment was created.
  google.protobuf.Timestamp created_at = 4;
}

message ImportIssueCommentResponse {
  // issue_comment is the created issue_comment. (required)
  IssueComment issue_comment = 1;
}
