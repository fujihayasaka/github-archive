on:
  push:
    branches-ignore:
      - enterprise-*.*-release
      - enterprise-*.*-test
      - enterprise-*.*.*-release
      - enterprise-*.*.*-test
      - enterprise-*.*-backport-**
      - gh-readonly-queue/**
  merge_group: {}

permissions:
  id-token: write

jobs:
  moda-config-bundle:
    uses: github/internal-actions/.github/workflows/moda.yml@9d65fcb92d5fab6304f8430e1072b9ed48efb871
    with:
      ci-formatted-job-name: moda-config-bundle
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
