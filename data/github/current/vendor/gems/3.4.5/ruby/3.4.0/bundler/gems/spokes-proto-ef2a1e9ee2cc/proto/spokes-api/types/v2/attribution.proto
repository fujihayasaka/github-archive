syntax = "proto3";

package github.spokes.types.v2;

option go_package = "github.com/github/spokes-proto/gen/go/v2/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V2";

import "spokes-api/types/v1/timestamp.proto";

// Attribution represents an individual and instant. Supports non-UTF-8 byte
// values in the name and email fields.
message Attribution {
    // name is the name of the individual.
    bytes name = 1;

    // email is the email address of the individual.
    bytes email = 2;

    // date is the instant when the attribution (e.g. commit authorship) occurred.
    github.spokes.types.v1.Timestamp date = 3;
}
