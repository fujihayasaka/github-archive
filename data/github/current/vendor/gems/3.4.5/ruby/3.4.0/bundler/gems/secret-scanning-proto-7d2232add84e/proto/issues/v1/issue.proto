syntax = "proto3";

package github.secretscanning.issues.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/issues";
option ruby_package = "GitHub::Proto::SecretScanning::Issues::V1";

message Issue {
  // title is the field that represents issue title
  bytes title = 1;
  
  // body is the field that represents description of an issue
  bytes body = 2;
}

message IssueComment {
  // issue comment body
  bytes body = 1;
}

message IssueTitle {
  // title is the field that represents the issue title
  bytes title = 1;
}

message IssueBody {
  // body is the field that represents the description of an issue
  bytes body = 1;
}

message IssueIdentifier {
  // the database ID of the issue
  uint64 issue_id = 1;

  // the repo scoped number of the issue
  uint32 issue_number = 2;
}
