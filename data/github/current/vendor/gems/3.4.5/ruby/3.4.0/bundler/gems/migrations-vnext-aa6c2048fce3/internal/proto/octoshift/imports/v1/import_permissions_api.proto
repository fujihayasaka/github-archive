syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";
import "imports/v1/batch_validation_error.proto";

// ImportPermissionsAPI handles the operations for importing team permissions to repositories.
service ImportPermissionsAPI {
  // ImportPermissions imports team permissions to the target repository.
  rpc ImportPermissions(ImportPermissionsRequest) returns (ImportPermissionsResponse);
}

message ImportPermissionsRequest {
  // repository_id is the id of the repository to which the permissions will be applied. (required)
  int64 repository_id = 1;
  // permissions is a list of permissions that will be imported for the repository. (required)
  repeated Permission permissions = 2;
} 

message Permission {
  // team_name is the name of the team that will have the permission. (required)
  string team_name = 1;
  // role is the role assigned to the team. (required)
  string role = 2;
}

message ImportPermissionsResponse {
 // batch_validation_errors is a list of validation errors for models that failed to import. (optional)
 repeated BatchValidationError batch_validation_errors = 1;
}
