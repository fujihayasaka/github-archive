linters-settings:
  depguard:
    rules:
      main:
        files:
          - $all
          # Files with pre-existing issues that should be cleaned up as part of Mu deprecation.
          - "!**/observability/http.go"
          - "!**/observability/logger/logger.go"
          - "!**/pkg/processors/webhook/processor_test.go"
          - "!**/utils/appcontext/appcontext.go"
          - "!**/utils/appcontext/appcontext_test.go"
        list-mode: lax
        # Packages that are not allowed where the value is a suggestion.
        deny:
          - pkg: "github.com/github/go-reqmeta"
            desc: Should be replaced by github.com/github/launch/observability/ctxstash package
      mu:
        # Allow mu to use mu
        files:
          - $all
          - "!**/pkg/mu/**"
        list-mode: lax
        deny:
          - pkg: "github.com/github/launch/pkg/mu/kvp"
            desc: Should be replaced by 'github.com/github/go-kvp' package
  forbidigo:
    forbid:
      - p: ^LogWith$
        pkg: ^github.com/github/launch/pkg/mu/muhttp/mw$
        msg: Should be replace by 'WithField' from package 'github.com/github/launch/observability/ctxstash'
  goimports:
    local-prefixes: github.com/github/launch
  gocritic:
    enabled-checks:
      - ruleguard
    settings:
      ruleguard:
        rules: "ruleguard/rules.go"

    # Disabled to minimize changes while upgrading to golangci-lint v1.61.0
    # We may want to re-enable them in the future
    disabled-checks:
      - assignOp
      - appendAssign
      - captLocal
      - ifElseChain
      - singleCaseSwitch
  govet:
    disable:
      # Disabled to minimize changes while upgrading to golangci-lint v1.61.0
      # We have a lot of "non-constant format string in call" errors that need to be fixed
      # See https://github.com/golang/go/issues/60529 for details on how this could be problematic
      - printf
  revive:
    rules:
      # Disabled to minimize changes while upgrading to golangci-lint v1.61.0
      # Primarily warnings about "Ids" in variables that should be "IDs"
      - name: var-naming
        disabled: true

linters:
  enable:
    - depguard
    - errcheck
    - forbidigo
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
  disable-all: true

run:
  # A subset of linters including gocritic (ruleguard) should be run against tests.
  tests: true

issues:
  exclude:
    - ".*returns unexported type.*"
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - goconst
        # don't add gocritic here. we use gocritic to run ruleguard against test code.
        - gocyclo
        - gofmt
        - goimports
        - gosimple
        - govet
        - ineffassign
        - revive
        - staticcheck
        - unconvert
        - unparam
        - unused
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*\\.twirp\\.go$"
    - "mock_.*\\.go$"

