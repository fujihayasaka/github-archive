syntax = "proto3";

package mvnd.migrations.api.v1;

option go_package = "github.com/github/migrations-vnext/proto/mnvd/api/v1";

// MigrationContext is the context of a migration that is passed around the pipeline.
message MigrationContext {
  // enterprise_id is the id of the enterprise that this resource belongs to.
  // For security reasons, this field is overwritten by the gh/gh mvnd endpoint
  // to be the id of the enterprise that the user PAT is a member of.
  int64 enterprise_id = 1;

  // admin_user_id is the id the enterprise use that will be used to
  // create the org and repo that the migration will be run on.
  // For security reasons, this field is overwritten by the gh/gh mvnd endpoint
  // to be the id of the user given in the user PAT.
  int64 admin_user_id = 2;

  // migration_id is the id of the migration that this resource belongs to.
  // (not used yet)
  int64 migration_id = 3;

  // source_url is the url of the source instance that this migration belongs to.
  // this is needed to carry out certain transformations in the pipeline. Tampering with
  // this field doesn't pose a security risk.
  string source_url = 4;
}