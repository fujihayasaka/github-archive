syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/user.proto";
import "imports/v1/repository.proto";
import "imports/v1/pull_request.proto";

message Import {
  // id is the database ID of the import record. (required)
  int64 id = 1;
  // creator is the user who created the import. (required)
  User creator = 2;
  // repositories is associated repositories to this import.
  repeated Repository repositories = 3;
  // pull_requests are all pull requests associated to this import.
  repeated PullRequest pull_requests = 4;
}
