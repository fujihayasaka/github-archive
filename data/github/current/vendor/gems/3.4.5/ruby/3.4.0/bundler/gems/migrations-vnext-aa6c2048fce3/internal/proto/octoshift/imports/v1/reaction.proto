syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/timestamp.proto";

message Reaction {
  // id is the database ID of the reaction (required).
  int64 id = 1;
}

message ReactionBatch {
  // user_login is the source login for the author of the reaction (required).
  string user_login = 1;
  // content is the reaction emoji of the reaction (required).
  ReactionContent content = 2;
  // created_at is the timestamp of when the reaction was created (required).
  google.protobuf.Timestamp created_at = 3;
}

enum ReactionContent {
  // REACTION_CONTENT_INVALID is present because enums require a zero value. This should never be returned.
  REACTION_CONTENT_INVALID = 0;
  // REACTION_CONTENT_THUMBS_UP is returned if the reaction is "thumbs up".
  REACTION_CONTENT_THUMBS_UP = 1;
  // REACTION_CONTENT_THUMBS_DOWN is returned if the reaction is "thumbs down".
  REACTION_CONTENT_THUMBS_DOWN = 2;
  // REACTION_CONTENT_LAUGH is returned if the reaction is "laugh".
  REACTION_CONTENT_LAUGH = 3;
  // REACTION_CONTENT_TADA is returned if the reaction is "tada".
  REACTION_CONTENT_TADA = 4;
  // REACTION_CONTENT_CONFUSED is returned if the reaction is "confused".
  REACTION_CONTENT_CONFUSED = 5;
  // REACTION_CONTENT_HEART is returned if the reaction is "heart".
  REACTION_CONTENT_HEART = 6;
  // REACTION_CONTENT_ROCKET is returned if the reaction is "rocket".
  REACTION_CONTENT_ROCKET = 7;
  // REACTION_CONTENT_EYES is returned if the reaction is "eyes".
  REACTION_CONTENT_EYES = 8;
}

enum ReactionSubjectType {
  // REACTION_SUBJECT_TYPE_INVALID is present because because enums require a zero value. This should never be returned.
  REACTION_SUBJECT_TYPE_INVALID = 0;
  // REACTION_SUBJECT_TYPE_COMMIT_COMMENT is returned if the reaction is associated to a CommitComment model.
  REACTION_SUBJECT_TYPE_COMMIT_COMMENT = 1;
  // REACTION_SUBJECT_TYPE_DISCUSSION is returned if the reaction is associated to a Discussion model.
  REACTION_SUBJECT_TYPE_DISCUSSION = 2;
  // REACTION_SUBJECT_TYPE_DISCUSSION_COMMENT is returned if the reaction is associated to a DiscussionComment model.
  REACTION_SUBJECT_TYPE_DISCUSSION_COMMENT = 3;
  // REACTION_SUBJECT_TYPE_DISCUSSION_POST is returned if the reaction is associated to a DiscussionPost model.
  REACTION_SUBJECT_TYPE_DISCUSSION_POST = 4;
  // REACTION_SUBJECT_TYPE_DISCUSSION_POST_REPLY is returned if the reaction is associated to a DiscussionPostReply model.
  REACTION_SUBJECT_TYPE_DISCUSSION_POST_REPLY = 5;
  // REACTION_SUBJECT_TYPE_ISSUE is returned if the reaction is associated to a Issue model.
  REACTION_SUBJECT_TYPE_ISSUE = 6;
  // REACTION_SUBJECT_TYPE_ISSUE_COMMENT is returned if the reaction is associated to a IssueComment model.
  REACTION_SUBJECT_TYPE_ISSUE_COMMENT = 7;
  // REACTION_SUBJECT_TYPE_PULL_REQUEST_REVIEW is returned if the reaction is associated to a PullRequestReview model.
  REACTION_SUBJECT_TYPE_PULL_REQUEST_REVIEW = 8;
  // REACTION_SUBJECT_TYPE_PULL_REQUEST_REVIEW_COMMENT is returned if the reaction is associated to a PullRequestReviewComment model.
  REACTION_SUBJECT_TYPE_PULL_REQUEST_REVIEW_COMMENT = 9;
  // REACTION_SUBJECT_TYPE_RELEASE is returned if the reaction is associated to a Release model.
  REACTION_SUBJECT_TYPE_RELEASE = 10;
  // REACTION_SUBJECT_TYPE_REPOSITORY_ADVISORY is returned if the reaction is associated to a RepositoryAdvisory model.
  REACTION_SUBJECT_TYPE_REPOSITORY_ADVISORY = 11;
  // REACTION_SUBJECT_TYPE_REPOSITORY_ADVISORY_COMMENT is returned if the reaction is associated to a RepositoryAdvisoryComment model.
  REACTION_SUBJECT_TYPE_REPOSITORY_ADVISORY_COMMENT = 12;
}
