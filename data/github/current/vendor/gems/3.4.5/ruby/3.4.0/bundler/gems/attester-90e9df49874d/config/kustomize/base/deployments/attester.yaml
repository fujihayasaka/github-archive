apiVersion: apps/v1
kind: Deployment
metadata:
  name: attester
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attester
  template:
    metadata:
      labels:
        app: attester
      annotations:
         # If you emit structured logs, you can specify a parser to use so your logs are parsed
        # properly and are much nicer to query in splunk. For more details, see
        # https://thehub.github.com/engineering/development-and-ops/observability/logging/fluent-bit/
        fluentbit.io/parser: logfmt
        observability.github.com/splunk_index: attester
        heaven.githubapp.com/inject-kube-metadata-env-vars-into-containers: attester
    spec:
      # The following line is to fix transient dns issues in deployed environments
      # https://moda.githubapp.com/docs/frequently-asked-questions/#i-m-seeing-a-lot-of-dns-exceptions-what-gives
      dnsPolicy: Default
      containers:
        - name: attester
          image: attester
          resources:
            requests:
              cpu: "0.5"
              memory: "128Mi"
            limits:
              cpu: "3.0"
              memory: "1G"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ATTESTER_DOGSTATSD_HOST
              value: "$(KUBE_NODE_HOSTNAME):28125"
            - name: GOMAXPROCS
              value: "2"
            - name: ATTESTER_APP_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['moda_deployment_env']
          envFrom:
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-readiness-probes
          readinessProbe:
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 1
            httpGet:
              path: /status
              port: 8080
