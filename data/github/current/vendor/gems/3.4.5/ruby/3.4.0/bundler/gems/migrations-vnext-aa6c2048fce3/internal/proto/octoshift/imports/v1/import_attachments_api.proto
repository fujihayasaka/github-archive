syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/import_asset_api.proto";

// ImportAttachmentsAPI handles the attachments import operation. (deprecated: use ImportAssetAPI
// instead; this is not used anywhere)
service ImportAttachmentsAPI {
  // CreateStoragePolicy creates storage policy for attachment being imported.
  rpc CreateStoragePolicy(CreateStoragePolicyRequest) returns (CreateStoragePolicyResponse);
  // TrackAttachmentAsUploaded creates storage policy for attachment being imported.
  rpc TrackAttachmentAsUploaded(TrackAttachmentAsUploadedRequest) returns (TrackAttachmentAsUploadedResponse);
}

// CreateStoragePolicyRequest (deprecated: use CreateAssetStoragePolicyRequest instead; this is not used anywhere)
message CreateStoragePolicyRequest {
  // repository_id is the id of the repository. (required)
  int64 repository_id = 1;
  // name is the file name of the attachment. (required)
  string name = 2;
  // size is the size of the attachment. (required)
  int64 size = 3;
  // content_type is content type of the attachment. (required)
  string content_type = 4;
  // actor_id is the id of the user uploading the attachment. (required)
  int64 actor_id = 5;
}

// CreateStoragePolicyResponse (deprecated: use CreateAssetStoragePolicyResponse instead; this is not used anywhere)
message CreateStoragePolicyResponse {
  // upload_url is the url where the attachment should be uploaded to. (required)
  string upload_url = 1;
  // headers is a list of auth headers for attachment upload request. (optional)
  repeated PolicyData headers = 2;
  // form_data is a list of key-pair value form data to use when in attachment upload request. (optional)
  repeated PolicyData form_data = 3;
  // attachment_url is the user-facing GitHub URL of the uploaded attachment. (required)
  string attachment_url = 4;
  // attachment_type is the type of attachment being uploaded. (required)
  AttachmentType attachment_type = 5;
  // attachment_id is the ID of the attachment uploadable record. (required)
  int64 attachment_id = 6;
  // storage_policy_type is the type of storage policy being used for uploading attachments to GitHub. (required)
  StoragePolicyType storage_policy_type = 7;
}

// TrackAttachmentAsUploadedRequest (deprecated: use TrackAssetAsUploadedRequest instead; this is not used anywhere)
message TrackAttachmentAsUploadedRequest {
  // repository_id is the id of the repository. (required)
  int64 repository_id = 1;
  // attachment_id is the id of the attachment. (required)
  int64 attachment_id = 2;
  // attachment_type is the type of attachment being tracked as uploaded. (required)
  AttachmentType attachment_type = 3;
}

// TrackAttachmentAsUploadedResponse (deprecated: use TrackAssetAsUploadedResponse instead; this is not used anywhere)
message TrackAttachmentAsUploadedResponse {
  // empty
}

// AttachmentType denotes the type of attachment being uploaded, such as USER_ASSET,
// REPOSITORY_FILE, etc. (deprecated: use AssetType instead; this is not used anywhere)
enum AttachmentType {
  // ATTACHMENT_TYPE_INVALID is present because enums require a zero value. This
  // should never be used.
  ATTACHMENT_TYPE_INVALID = 0;

  // ATTACHMENT_TYPE_USER_ASSET denotes the UserAsset attachment type
  ATTACHMENT_TYPE_USER_ASSET = 1;

  // ATTACHMENT_TYPE_REPOSITORY_FILE denotes the RepositoryFile attachment type
  ATTACHMENT_TYPE_REPOSITORY_FILE = 2;
}
