apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actions-usage-metrics-dev

resources:
  - namespace.yaml
  - ../../base
  - jaeger.yaml

patchesStrategicMerge:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: config
    behavior: merge
    envs:
      - config.env
