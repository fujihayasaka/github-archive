name: Build Codespaces Development Container
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - .github/workflows/build_devcontainer.yml
  push:
    branches:
      - main

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log into registries
        run: |
          echo "${{ secrets.CONTAINER_BUILDER_TOKEN }}" | \
            docker login ghcr.io -u ${{github.actor}} --password-stdin

      - name: Build containers
        run: .devcontainer/build-devcontainer.sh
        env:
          GITHUB_TOKEN: ${{ secrets.CONTAINER_BUILDER_TOKEN }}

      - name: Tag and push a latest image if on the main branch
        if: ${{ success() && (github.ref == 'refs/heads/main') }}
        run: |
          # Don't attempt to push if we didn't successfully build an image.
          if [[ "$(docker images -q ghcr.io/github/authnd/codespace-nightly:latest)" != "" ]]
          then
            docker push ghcr.io/github/authnd/codespace-nightly:latest
          else
            echo "Unable to find the image we were supposed to have built. Skipping the image push."
          fi
