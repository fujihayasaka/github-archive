syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// ImportOrganizationAPI handles the operations for importing organizations.
service ImportOrganizationAPI {
    // ImportOrganization imports a new organization to the target enterprise.
    rpc ImportOrganization(ImportOrganizationRequest) returns (ImportOrganizationResponse);
  }
  
  message ImportOrganizationRequest {
    // target_enterprise_id is the database id for the target enterprise. (required)
    int64 target_enterprise_id = 1;
    // target_org_name is the name of the organization to be created. (required)
    string target_org_name = 2;
    // user_id is the id of the admin of the new organization. (required)
    int64 user_id = 3;
    // target_access_token is the target_access_token to be used for import. (required)
    string target_access_token = 4;
  } 
  
  message ImportOrganizationResponse {
    // id is the organization ID. (required)
    int64 id = 1;
  }
