syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/batch_validation_error.proto";

// ImportLabelsAPI handles the labels import operation.
service ImportLabelsAPI {
  // ImportLabels imports labels to a migrated repository.
  rpc ImportLabels(ImportLabelsRequest) returns (ImportLabelsResponse);
  // AddLabelsToIssue adds a list of labels to an issue or a pull request.
  rpc AddLabelsToIssue(AddLabelsToIssueRequest) returns (AddLabelsToIssueResponse);
}

message ImportLabelsRequest {
  // repository_id is the id of the repository that owns the labels. (required)
  int64 repository_id = 1;
  // labels is a list of labels that will be imported into the repository.
  repeated Label labels = 2;
}

message Label {
  // name is the label name. (required)
  string name = 1;
  // color is the label color string in hexadecimal format.
  string color = 2;
  // default indicates whether this is a default repository label.
  bool default = 3;
  // description is the label description.
  string description = 4;
}

message ImportLabelsResponse {
  // batch_validation_errors is a list of validation errors for models that failed to import. (optional)
  repeated BatchValidationError batch_validation_errors = 1;
}

message AddLabelsToIssueRequest {
  // repository_id is the id of the repository that owns the issue or pull request. (required)
  int64 repository_id = 1;
  // issue_number is issue or pull request number. (required)
  int64 issue_number = 2;
  // labels is a list of label names that will be added to the issue or pull request. (required)
  repeated string labels = 3;
}

message AddLabelsToIssueResponse {
  // empty
}
