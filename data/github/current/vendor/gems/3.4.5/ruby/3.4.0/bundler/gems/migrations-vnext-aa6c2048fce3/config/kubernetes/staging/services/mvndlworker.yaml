apiVersion: v1
kind: Service
metadata:
  name: mvndlworker
  labels:
    service: mvndlworker
  annotations:
    moda.github.net/domain-name: "mvndlworker-%environment%.service.%region%.github.net"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: mvndlworker
  type: LoadBalancer