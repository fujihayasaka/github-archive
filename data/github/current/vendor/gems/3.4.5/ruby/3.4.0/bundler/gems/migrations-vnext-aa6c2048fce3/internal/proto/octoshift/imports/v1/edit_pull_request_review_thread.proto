syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/live_migration_action.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// EditPullRequestReviewThreadAPI handles pull request review thread edit operations.
service EditPullRequestReviewThreadAPI {
  // EditPullRequestReviewThread edits pull request review thread data during live migrations.
  rpc EditPullRequestReviewThread(EditPullRequestReviewThreadRequest) returns (EditPullRequestReviewThreadResponse);
}

message EditPullRequestReviewThreadRequest {
  // id is the ID of the pull request review thread to edit. (required)
  int64 id = 1;
  // LiveMigrationAction is action that will be performed against the pull request review thread. (required)
  LiveMigrationAction action = 2;
  // updated_at indicates the date and time when the pull request review thread was last updated. (required)
  google.protobuf.Timestamp updated_at = 3;
  // user_login indicates the login for the user performing the action. (required)
  string user_login = 4;
  // resolved_at indicates the date and time when the pull request review thread was resolved.
  google.protobuf.Timestamp resolved_at = 5;
  // EditPullRequestReviewThreadState is state to update the pull request review thread to.
  EditPullRequestReviewThreadState state = 6;
}

message EditPullRequestReviewThreadResponse {
  // id is the database ID of the edited pull request review thread. (required)
  int64 id = 1;
}

// EditPullRequestReviewThreadState denotes what state to move the pull request review thread to.
enum EditPullRequestReviewThreadState {
  // EDIT_PULL_REQUEST_REVIEW_THREAD_STATE_INVALID is present because because enums require a zero value. This
  // should never be used.
  EDIT_PULL_REQUEST_REVIEW_THREAD_STATE_INVALID = 0;

  // EDIT_PULL_REQUEST_REVIEW_THREAD_STATE_UNRESOLVED denotes that the issue will be unresolved
  EDIT_PULL_REQUEST_REVIEW_THREAD_STATE_UNRESOLVED = 5;

  // EDIT_PULL_REQUEST_REVIEW_THREAD_STATE_RESOLVED denotes that the issue will be resolved
  EDIT_PULL_REQUEST_REVIEW_THREAD_STATE_RESOLVED = 10;
}
