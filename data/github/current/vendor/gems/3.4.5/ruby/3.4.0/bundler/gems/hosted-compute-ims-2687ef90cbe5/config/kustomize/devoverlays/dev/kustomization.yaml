resources:
- "../../base/hosted-compute-ims-api"
- "../../base/hosted-compute-ims-worker"
- "../../base/cronjobs"

namespace: hosted-compute-ims

components:
- "../base-patches"

patches:
# override environment variables for deployments
- path: env-deployments.yaml
  target:
    kind: Deployment
    name: ^hosted-compute-ims-.*
# override environment variables for jobs
- path: env-cronjobs.yaml
  target:
    kind: CronJob

configMapGenerator:
  - name: kube-cluster-metadata
  - name: application-config

secretGenerator:
  - name: vault-secrets
