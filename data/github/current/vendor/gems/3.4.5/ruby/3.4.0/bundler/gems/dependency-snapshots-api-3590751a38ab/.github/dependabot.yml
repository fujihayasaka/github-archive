---
version: 2
registries:
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: "${{secrets.CONTAINER_BUILDER_TOKEN}}"
updates:
- package-ecosystem: docker
  target-branch: "main"
  directory: "/"
  registries:
  - ghcr
  schedule:
    interval: weekly
    time: '21:00'
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: github-actions
  ignore:
    - dependency-name: "github/internal-actions"
  directory: "/"
  schedule:
    interval: daily
  groups:
    all-dependencies:
      patterns:
      - "*"
# https://thehub.github.com/epd/engineering/dev-practicals/containers/container-development/adopt-base-images-for-service/
- package-ecosystem: "docker"
  target-branch: "enterprise-3.12-release"
  directory: "/"
  registries:
    - ghcr
  schedule:
    interval: "weekly"
    time: "21:00"
  labels:
    - "ern:not-customer-facing"
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: "docker"
  target-branch: "enterprise-3.13-release"
  directory: "/"
  registries:
    - ghcr
  schedule:
    interval: "weekly"
    time: "21:00"
  labels:
    - "ern:not-customer-facing"
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: "docker"
  target-branch: "enterprise-3.14-release"
  directory: "/"
  registries:
    - ghcr
  schedule:
    interval: "weekly"
    time: "21:00"
  labels:
    - "ern:not-customer-facing"
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: "docker"
  target-branch: "enterprise-3.15-release"
  directory: "/"
  registries:
    - ghcr
  schedule:
    interval: "weekly"
    time: "21:00"
  labels:
    - "ern:not-customer-facing"
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: "docker"
  target-branch: "enterprise-3.16-release"
  directory: "/"
  registries:
    - ghcr
  schedule:
    interval: "weekly"
    time: "21:00"
  labels:
    - "ern:not-customer-facing"
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  reviewers:
    - 'github/dependency-graph-reviewers'
  labels:
    - 'dependabot'
    - 'go'
  groups:
    minor-version-updates:
      update-types:
        - "minor"
    patch-version-updates:
      update-types:
        - "patch"
