syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

message PullRequestReview {
  // id is the database ID of the pull request review. (required)
  int64 id = 1;
  // review_threads are the pull request review threads for this pull request review. (required)
  repeated PullRequestReviewThreadResponse review_threads = 2;
  // review_comments are the pull request review comment replies from a thread from another review. (required)
  repeated PullRequestReviewCommentResponse review_comments = 3;
}

message PullRequestReviewThreadResponse {
  // id is the database ID of the pull request review comment. (required)
  int64 id = 1;
  // review_comments are the pull request review comments for this pull request thread. (required)
  repeated PullRequestReviewCommentResponse review_comments = 2;
}

message PullRequestReviewCommentResponse {
  // id is the database ID of the pull request review comment. (required)
  int64 id = 1;
}
