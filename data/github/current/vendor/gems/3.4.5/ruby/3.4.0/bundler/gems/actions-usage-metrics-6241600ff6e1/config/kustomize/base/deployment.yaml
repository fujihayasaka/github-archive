apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
      annotations:
        fluentbit.io/parser: logfmt
        observability.github.com/splunk_index: actions-usage-metrics
    spec:
      containers:
        - name: api-server
          image: actions-usage-metrics
          command: ["/api-server"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          lifecycle:
            preStop: # https://gh.io/prestop-hook
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              # WARNING: This should be updated to a meaningful endpoint for your application which will return a 200 once the app is fully started.
              # See: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-readiness-probes
              path: /health
              port: http
          resources:
            requests:
              memory: 2Gi
              cpu: 1000m
            limits:
              memory: 4Gi
              cpu: 2000m
          envFrom:
            - configMapRef:
                name: config
          env:
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_CONTAINER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
