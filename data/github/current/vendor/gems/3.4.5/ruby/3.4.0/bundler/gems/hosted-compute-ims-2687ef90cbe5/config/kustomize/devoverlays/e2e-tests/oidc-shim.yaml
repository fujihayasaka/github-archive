apiVersion: v1
kind: Service
metadata:
  name: ims-oidc-shim
spec:
  ports:
  - port: 9002
    nodePort: 28139
  selector:
    app: ims-oidc-shim
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-oidc-shim
spec:
  selector:
    matchLabels:
      app: ims-oidc-shim
  template:
    metadata:
      labels:
        app: ims-oidc-shim
    spec:
      containers:
      - image: ims-oidc-shim
        imagePullPolicy: Never
        name: ims-oidc-shim
        command:
        - node
        - index.mjs
        readinessProbe:
          initialDelaySeconds: 5
          timeoutSeconds: 1
          httpGet:
              path: /.well-known/openid-configuration
              port: 9002
        ports:
        - containerPort: 9002
          name: oidc-shim