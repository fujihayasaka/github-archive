name: proto-check-latest
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
jobs:
  pr:
    name: Check that we have the latest version of the Octoshift protobufs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'migrations-vnext'
      - uses: actions/checkout@v4
        with:
          github-server-url: 'https://github.ghe.com'
          path: 'octoshift'
          repository: 'github/octoshift'
          ssh-key: ${{ secrets.PROXIMA_OCTOSHIFT_RO_DEPLOY_KEY }}
          ssh-known-hosts: ${{ vars.PROXIMA_KNOWN_HOSTS }}
          ssh-user: github
      - name: Compare the VERSION files
        run: |
          diff migrations-vnext/internal/proto/octoshift/imports/VERSION octoshift/proto/imports/VERSION || { echo "FATAL: Octoshift protobufs are out-of-date. Run 'script/update-octoshift-protobufs' to correct."; exit 1; }