version: v1
breaking:
  use:
    - FILE
lint:
  use:
    - DEFAULT
  except:
    # so we don't need to prefix our directory structure with "/github/actions/"
    - PACKAGE_DIRECTORY_MATCH
    # so that service definitions for internal Dotcom Twirp APIs can end in "API"
    - SERVICE_SUFFIX
  ignore:
    # billing-platform protos are temporary to get integrated with their twirp client
    - billing-platform
  enum_zero_value_suffix: _UNKNOWN
  rpc_allow_google_protobuf_empty_responses: true