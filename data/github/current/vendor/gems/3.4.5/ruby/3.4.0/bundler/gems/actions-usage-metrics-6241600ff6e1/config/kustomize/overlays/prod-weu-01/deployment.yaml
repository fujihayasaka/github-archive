apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
spec:
  template:
    spec:
      containers:
        - name: api-server
          env:
            - name: SERVICE_PRINCIPAL_TENANT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_actions_usage_metrics_prod_weu_01_tenant_id
                  name: vault-secrets
            - name: SERVICE_PRINCIPAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_actions_usage_metrics_prod_weu_01_client_id
                  name: vault-secrets
            - name: SERVICE_PRINCIPAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: spn_actions_usage_metrics_prod_weu_01
                  name: vault-secrets
            - name: STORAGE_ACCOUNT_NAME
              value: aumprodweu01
