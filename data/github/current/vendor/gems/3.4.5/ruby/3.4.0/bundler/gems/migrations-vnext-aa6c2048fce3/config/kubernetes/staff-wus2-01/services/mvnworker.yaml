apiVersion: v1
kind: Service
metadata:
  name: mvnworker
  labels:
    service: mvnworker
  annotations:
    moda.github.net/domain-name: "mvnworker-%environment%.service.%region%.github.net"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: mvnworker
  type: LoadBalancer