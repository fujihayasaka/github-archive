kind: Deployment
metadata:
  name: trust-metadata-api
spec:
  template:
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: trust-metadata-api
          env:
            - name: TMA_AZURE_BLOB_ACCOUNT
              value: "tmastaffwus201"
            - name: TMA_AZURE_BLOB_CONTAINER
              value: "attestations"
            # the Azure tenant ID used to authenticate with Azure with a service principal
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_non_prod_staff_wus2_01_tenant_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_non_prod_staff_wus2_01_client_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_non_prod_staff_wus2_01"
            # https://github.com/github/github-telemetry-go/blob/main/README.md?plain=1#L66-L69
            - name: GITHUB_TELEMETRY_ENVIRONMENT
              value: "development"
            - name: HTTP_PROXY
              value: "http://network-proxy.service.$(KUBE_CLUSTER_STAMP).github.net:3128"
            - name: HTTPS_PROXY
              value: "http://network-proxy.service.$(KUBE_CLUSTER_STAMP).github.net:3128"
            - name: TMA_TRUSTED_KEYS
              value: |
                {}
            - name: TMA_PKG_READ_AUTH_CONFIG
              value: |
                []
            - name: TMA_PKG_WRITE_AUTH_CONFIG
              value: |
                []
            - name: TMA_TUF_MIRROR
              value: "https://github.github.com/staging-tuf-root"
            - name: TMA_STAMP
              value: "staff-wus2-01"
          envFrom:
            - secretRef:
                name: vault-secrets
            - configMapRef:
                name: kube-cluster-metadata
