apiVersion: batch/v1
kind: CronJob
metadata:
  name: ims-image-events-publishing-job
spec:
  # Runs every day at 1 AM UTC
  schedule: "0 1 * * *"
  # Prevent multiple jobs from running at the same time
  concurrencyPolicy: Forbid
  # suspend is overwritten for a single cluster
  suspend: true
  # Keep jobs for debugging failures and issues
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: ims-image-events-publishing-job
    spec:
      # Will cleanup and delete resources after N seconds when job completed
      ttlSecondsAfterFinished: 60
      # Will terminate the job after N seconds
      activeDeadlineSeconds: 3600
      # Will attempt to run job N times before marking as failed
      backoffLimit: 0
      template:
        metadata:
          annotations:
            fluentbit.io/parser: logfmt
            observability.github.com/logger: fluent-bit
            observability.github.com/kafka_topic: launch
            observability.github.com/splunk_index: hosted_compute_ims
        spec:
          restartPolicy: Never
          containers:
          - name: ims-image-events-publishing-job
            image: hosted-compute-ims
            command:
              - /usr/bin/tools/istio-job-wrapper
              - /app/bin/hosted-compute-ims-cronjobs
              - image-events-publishing
            envFrom:
              - configMapRef:
                  name: application-config
              - secretRef:
                  name: vault-secrets
            env:
              - name: GOMAXPROCS
                valueFrom:
                  resourceFieldRef:
                    containerName: ims-image-events-publishing-job
                    resource: limits.cpu
              - name: STATSD_ADDR
                value: "$(KUBE_NODE_HOSTNAME):28125"
              - name: STATS_ADDR
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: "1"
                memory: "256Mi"
              limits:
                cpu: "2"
                memory: "512Mi"
