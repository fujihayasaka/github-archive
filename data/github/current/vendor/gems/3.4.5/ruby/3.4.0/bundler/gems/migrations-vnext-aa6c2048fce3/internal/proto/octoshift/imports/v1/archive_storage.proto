syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

message ArchiveStorageMetadata {
  // id is the ID of the archive in GitHub-owned storage.
  int64 id = 1;
  // name is the name of the archive uploaded to GitHub-owned storage.
  string name = 2;
  // size is the size of the archive in GitHub-owned storage, in bytes.
  int64 size = 3;
  // url is the URL used to download the archive from GitHub-owned storage.
  string url = 4;
  // guid is the GUID of the archive in GitHub-owned storage.
  string guid = 5;
}
