name: 🚲 Batch
description: A slice of work significant enough to capture meaningful progress or value, while being small enough to complete in under two weeks.
type: batch
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "one or two human readable sentences describing the batch, short and 🍭"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why we are doing this work? Additional context helping to understand the batch.
      value: |
        We are doing this batch because ... link to previous work items ...
        
  - type: textarea
    id: corresponding
    attributes:
      label: Batch work items
      description: "Add Tasks that ladder up to this batch"
      value: |
        ```[tasklist]
        - [ ] ... ?
        - [ ] ... ?
        ```
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "list of known dependencies to complete this work"
      value: |
        - [ ] ... ?
        - [ ] ... ?
  - type: textarea
    id: documentation
    attributes:
      label: Supporting Documentation
      description: "Links to documents, spreadsheets, issues, etc."
