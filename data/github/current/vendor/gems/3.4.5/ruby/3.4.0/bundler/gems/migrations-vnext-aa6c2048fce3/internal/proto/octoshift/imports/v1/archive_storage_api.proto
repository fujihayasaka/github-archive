syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/archive_storage.proto";

// ArchiveStorageAPI handles retrieving metadata for archives hosted by GitHub-owned storage.
service ArchiveStorageAPI {
  // GetArchiveStorageMetadata acquires metadata for an archive and returns the metadata.
  rpc GetArchiveStorageMetadata(GetArchiveStorageMetadataRequest) returns (GetArchiveStorageMetadataResponse);
  // DeleteArchive deletes an archive and returns the metadata.
  rpc DeleteArchive(DeleteArchiveRequest) returns (DeleteArchiveResponse);
}

message GetArchiveStorageMetadataRequest {
  // archive_id is the ID of the organization that owns the archive in GitHub-owned storage. (required)
  int64 organization_id = 2;
  // guid is the GUID of the archive in GitHub-owned storage. (required)
  string guid = 3;
}

message GetArchiveStorageMetadataResponse {
  // metadata is the metadata for the archive from GitHub-owned storage. (required)
  ArchiveStorageMetadata metadata = 1;
}

message DeleteArchiveRequest {
  // organization_id is the ID of the organization that owns the archive in GitHub-owned storage. (required)
  int64 organization_id = 1;
  // guid is the GUID of the archive in GitHub-owned storage. (required)
  string guid = 2;
}

message DeleteArchiveResponse {
  // metadata is the metadata for the archive from GitHub-owned storage. (required)
  ArchiveStorageMetadata metadata = 1;
}
