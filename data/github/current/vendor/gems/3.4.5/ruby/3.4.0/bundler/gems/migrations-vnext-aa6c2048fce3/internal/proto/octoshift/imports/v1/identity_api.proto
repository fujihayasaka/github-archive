syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/user.proto";

// IdentityAPI manages Identity information.
service IdentityAPI {
  // FindUserIdentity retrieves an identity of a user by user_id.
  rpc FindUserIdentity(FindUserIdentityRequest) returns (FindUserIdentityResponse);
}

message FindUserIdentityRequest {
  // user_id is the id of the user to be found (required)
  int64 user_id = 1;
}

message FindUserIdentityResponse {
  User user = 1;
}
