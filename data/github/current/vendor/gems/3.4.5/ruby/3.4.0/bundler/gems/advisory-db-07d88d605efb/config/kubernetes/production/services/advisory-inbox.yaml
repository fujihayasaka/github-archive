# advisory-inbox is the curation WebApp used by curators
apiVersion: v1
kind: Service
metadata:
  annotations:
    moda.github.net/domain-name: "advisory-inbox-%environment%.service.%site%.github.net"

  name: advisory-inbox
  labels:
    service: advisory-inbox
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: advisory-db
  type: LoadBalancer
