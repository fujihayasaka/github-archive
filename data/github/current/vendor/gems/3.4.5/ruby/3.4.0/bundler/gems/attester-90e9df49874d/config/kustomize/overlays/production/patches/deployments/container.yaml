kind: Deployment
metadata:
  name: attester
spec:
  template:
    spec:
      containers:
        - name: attester
          env:
            # the Azure tenant ID used to authenticate with Azure with a service principal
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_attester_prod_tenant_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_attester_prod_client_id"
            # the Azure client secret used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_attester_prod"
            - name: APP_ENV
              value: production
            - name: ATTESTER_RELEASE_AZURE_KEYVAULT_REF
              value: azurekms://attester-production.vault.azure.net/attester-2024-10
            - name: ATTESTER_TSA_URL
              value: https://timestamp.githubapp.com/api/v1/timestamp
            - name: ATTESTER_RELEASE_CERTIFICATE_PATH
              value: certs/production/leaf-attester.crt
