apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/default

patches:
  - path: quotas.json
    target:
      kind: ResourceQuota
      name: gh-default
  - path: deployments/notifyd-api.json
    target:
      kind: Deployment
      name: notifyd-api
  - path: deployments/notifyd-delete-repository-workers.json
    target:
      kind: Deployment
      name: notifyd-delete-repository-workers
  - path: deployments/notifyd-delete-user-workers.json
    target:
      kind: Deployment
      name: notifyd-delete-user-workers
  - path: deployments/notifyd-delete-user-repositories-workers.json
    target:
      kind: Deployment
      name:
        notifyd-delete-user-repositories-workers
  - path: deployments/notifyd-delete-repository-for-users-workers.json
    target:
      kind: Deployment
      name: notifyd-delete-repository-for-users-workers
  - path: deployments/notifyd-email-workers.json
    target:
      kind: Deployment
      name: notifyd-email-workers
  - path: deployments/notifyd-mobile-push-workers.json
    target:
      kind: Deployment
      name: notifyd-mobile-push-workers
  - path: deployments/notifyd-notify-workers.json
    target:
      kind: Deployment
      name: notifyd-notify-workers
  - path: shared-deployment-config.json
    target:
      kind: Deployment
  - path: shared-workers-deployment-config.json
    target:
      kind: Deployment
      name: notifyd-.*-workers
  - path: proxima-shared-jobs-config.json
    target:
      kind: Job
      name: .*-job
  - path: proxima-shared-deployment-config.json
    target:
      kind: Deployment
      name: .*
  - path: servicemeshconfig.json
    target:
      kind: ServiceMeshConfig
      name: config
