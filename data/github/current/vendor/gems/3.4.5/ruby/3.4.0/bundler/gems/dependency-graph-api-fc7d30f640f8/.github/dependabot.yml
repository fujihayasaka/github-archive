version: 2
registries:
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{secrets.CONTAINER_BUILDER_TOKEN}}
  rubygems-github-packages:
    type: rubygems-server
    url: https://rubygems.pkg.github.com/github
    token: ${{secrets.CONTAINER_BUILDER_TOKEN}}
updates:
  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'weekly'
    vendor: true
    reviewers:
      - 'github/dependency-graph-reviewers'
    versioning-strategy: increase
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "graphql" # ignore updates to graphql because we depend on specific behaviour of the 1.x version
    labels:
      - 'dependabot'
      - 'ruby'
    registries:
      - rubygems-github-packages
    groups:
      all-dependencies:
        patterns:
        - "*"
  - package-ecosystem: gomod
    directory: go/
    schedule:
      interval: weekly
    reviewers:
      - 'github/dependency-graph-reviewers'
    labels:
      - 'dependabot'
      - 'go'
    groups:
      minor-version-updates:
        update-types:
          - "minor"
      patch-version-updates:
        update-types:
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: 'weekly'
    reviewers:
      - 'github/dependency-graph-reviewers'
    labels:
      - 'dependabot'
      - 'actions'
    groups:
      all-dependencies:
        patterns:
        - "*"
  - package-ecosystem: "docker"
    directories: 
      - "/"
      - "package_manager_adapters/cargo"
      - "package_manager_adapters/composer"
      - "package_manager_adapters/go"
      - "package_manager_adapters/maven"
      - "package_manager_adapters/npm"
      - "package_manager_adapters/nuget"
      - "package_manager_adapters/pub"
      - "package_manager_adapters/pypi"
      - "package_manager_adapters/rubygems"
      - "go/mysql-lock"
    schedule:
      interval: "weekly"
    reviewers:
      - 'github/dependency-graph-reviewers'
    labels:
      - 'dependabot'
      - 'docker'
    registries:
      - ghcr
    groups:
      all-dependencies:
        patterns:
        - "*"
  # https://thehub.github.com/epd/engineering/dev-practicals/containers/container-development/adopt-base-images-for-service/
  - package-ecosystem: "docker"
    target-branch: "enterprise-3.12-release"
    directory: "/"
    registries:
      - ghcr
    schedule:
      interval: "weekly"
      time: "21:00"
    labels:
      - "ern:not-customer-facing"
    allow:
      - dependency-name: "github/*"
    groups:
      all-dependencies:
        patterns:
        - "*"
  - package-ecosystem: "docker"
    target-branch: "enterprise-3.13-release"
    directory: "/"
    registries:
      - ghcr
    schedule:
      interval: "weekly"
      time: "21:00"
    labels:
      - "ern:not-customer-facing"
    allow:
      - dependency-name: "github/*"
    groups:
      all-dependencies:
        patterns:
        - "*"
  - package-ecosystem: "docker"
    target-branch: "enterprise-3.14-release"
    directory: "/"
    registries:
      - ghcr
    schedule:
      interval: "weekly"
      time: "21:00"
    labels:
      - "ern:not-customer-facing"
    allow:
      - dependency-name: "github/*"
    groups:
      all-dependencies:
        patterns:
        - "*"
  - package-ecosystem: "docker"
    target-branch: "enterprise-3.15-release"
    directory: "/"
    registries:
      - ghcr
    schedule:
      interval: "weekly"
      time: "21:00"
    labels:
      - "ern:not-customer-facing"
    allow:
      - dependency-name: "github/*"
    groups:
      all-dependencies:
        patterns:
        - "*"
