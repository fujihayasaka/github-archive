syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// LiveMigrationAction denotes what action to take when performing live updates, such as EDITED or DELETED.
enum LiveMigrationAction {
  // LIVE_MIGRATION_ACTION_INVALID is present because because enums require a zero value. This
  // should never be used.
  LIVE_MIGRATION_ACTION_INVALID = 0;

  // LIVE_MIGRATION_ACTION_EDITED denotes that the model will be edited
  LIVE_MIGRATION_ACTION_EDITED = 5;

  // LIVE_MIGRATION_ACTION_DELETED denotes that the model will be deleted
  LIVE_MIGRATION_ACTION_DELETED = 10;
}
