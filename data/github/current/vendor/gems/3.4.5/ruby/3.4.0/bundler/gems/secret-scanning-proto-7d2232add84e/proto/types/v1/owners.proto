syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

enum OwnerScope {
    UNKNOWN_SCOPE = 0;
    REPOSITORY_SCOPE = 1;
    ORGANIZATION_SCOPE = 2;
    BUSINESS_SCOPE = 3;
    USER_SCOPE = 4;
  }

message Owner {
  // the owner id relative to the owner_scope
  uint64 id = 1;
  OwnerScope owner_scope = 2;
}
