# This file is intended for setting feature flag state in local environment where dotcom FFs are not available (IMS codespace or dotcom codespace when dotcom is not running)
# Usually, you don't need to commit changes in this file unless you want to enable the FF for all other developers

enabledGlobally:
  - ims_e2e_test_feature_globally_enabled
  - ims_vexi_feature_flag_canary
  - ims_azure_resources_layout_v2
enabledPerActor:
  - flag: ims_e2e_test_feature_enabled_per_owner
    actor: "Organization:33435682" # global id: O_kgDOAf4wIg
  - flag: ims_e2e_test_feature_enabled_per_actor
    actor: "ImageDefinition:1"