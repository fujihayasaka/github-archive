syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

message PullRequest {
  // id is the database ID of the pull request. (required)
  int64 id = 1;
  // issue_id is the database ID of the issue used within a pull request. (required)
  int64 issue_id = 2;
  // issue_number is the pull request issue number. (required)
  int64 issue_number = 3;
}
