syntax = "proto3";

package octoshift.imports.v2;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v2";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V2";

import "imports/v2/github_issue_comment.proto";
import "imports/v2/import_error.proto";
import "google/protobuf/timestamp.proto";

// ImportIssueCommentsAPI handles the issue comments bulk import operation.
service ImportIssueCommentsAPI {
  // ImportIssueComments imports a list of issue comments in bulk to a migrated issue.
  rpc ImportIssueComments(ImportIssueCommentsRequest) returns (ImportIssueCommentsResponse);
}

message ImportIssueCommentsRequest {
  // issue_id is the id of the issue that owns the comment. (required)
  int64 issue_id = 1;
  // transformed_issue_comments is a list of transformed issue comments to be imported. (required)
  repeated TransformedIssueComment transformed_issue_comments = 2;
}

message TransformedIssueComment {
  // resource_identifier is usually the id of the transformed resource. (required)
  string resource_identifier = 1;
  // author_login is the login of the user that created the issue comment (can be a mannequin).
  string author_login = 2;
  // body is the text contents of the issue comment (with markup). (required)
  string body = 3;
  // created_at indicates the date and time when the issue comment was created. (required)
  google.protobuf.Timestamp created_at = 4;
}

message ImportIssueCommentsResponse {
  // issue_comments is a list of the created issue comments. (required)
  repeated GitHubIssueComment issue_comments = 1;
  // errors is a list of all encountered errors during import. (required)
  repeated ImportError errors = 2;
}
