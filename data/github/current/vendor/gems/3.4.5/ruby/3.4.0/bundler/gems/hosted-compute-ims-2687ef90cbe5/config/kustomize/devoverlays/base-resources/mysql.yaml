apiVersion: v1
kind: Service
metadata:
  name: ims-mysql
spec:
  ports:
  - port: 28142
    nodePort: 28142
  selector:
    app: ims-mysql
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-mysql
spec:
  selector:
    matchLabels:
      app: ims-mysql
  strategy:
    # Delete existing node before trying to create a new one to prevent MySQL lock collision
    type: Recreate
  template:
    metadata:
      labels:
        app: ims-mysql
    spec:
      containers:
      - image: mysql:8.0
        name: ims-mysql
        env:
        - name: MYSQL_DATABASE
          value: hosted_compute_ims_development
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "1"
        - name: MYSQL_TCP_PORT
          value: "28142"
        - name: MYSQL_ROOT_HOST
          value: "%"
        ports:
        - containerPort: 28142
          name: mysql
        readinessProbe:
          exec:
            command:
              - mysql
              - -h
              - "127.0.0.1"
              - -e
              - "SELECT 1"
          initialDelaySeconds: 10
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - name: ims-mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-initdb
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: ims-mysql-data
        persistentVolumeClaim:
          claimName: ims-mysql-pv-claim
      - name: mysql-initdb
        configMap:
          name: mysqlinitdb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysqlinitdb
data:
  initdb.sql: |-
    CREATE USER IF NOT EXISTS 'readonly'@'%';
    GRANT SELECT ON *.* TO 'readonly'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ims-mysql-pv-claim
spec:
  storageClassName: manual
  volumeName: ims-mysql-pv-vol
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ims-mysql-pv-vol
spec:
  storageClassName: manual
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/ims-mysql-data