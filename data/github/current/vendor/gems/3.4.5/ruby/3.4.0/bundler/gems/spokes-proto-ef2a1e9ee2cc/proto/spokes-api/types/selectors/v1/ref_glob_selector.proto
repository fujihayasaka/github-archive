syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/glob.proto";

// RefGlobSelector is a selector for selecting refs matching a glob.
message RefGlobSelector {
    // include are the globs to match against.
    repeated github.spokes.types.v1.Glob include = 1;

    // exclude are globs that, if matched, indicate a reference should be
    // excluded from the result.
    repeated github.spokes.types.v1.Glob exclude = 3;

    // ignore_case controls whether matching is done case-sensitively.
    bool ignore_case = 2;
}
