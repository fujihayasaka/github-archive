syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/mannequin.proto";

// MannequinAPI manages mannequin information.
service MannequinAPI {
  // FindMannequin retrieves a mannequin within a specified organization/owner by source login name.
  rpc FindMannequin(FindMannequinRequest) returns (FindMannequinResponse);
  // FetchOwnerMannequins retrieves all mannequins within a specified organization/owner.
  rpc FetchOwnerMannequins(FetchOwnerMannequinsRequest) returns (FetchOwnerMannequinsResponse);
  // CreateMannequin creates a mannequin within a specified organization/owner by source login name.
  rpc CreateMannequin(CreateMannequinRequest) returns (CreateMannequinResponse);
}

message FetchOwnerMannequinsRequest {
  // owner_id is the id of the organization/owner that owns the mannequin to be found (required)
  int64 owner_id = 1;
}

message FetchOwnerMannequinsResponse {
  // mannequins is a list of mannequins that the owner has. (required)
  repeated Mannequin mannequins = 1;
}

message FindMannequinRequest {
  // source_login is the login of the user on the source instance (required)
  string source_login = 1;
  // owner_id is the id of the organization that owns the mannequin to be found (required)
  int64 owner_id = 2;
}

message FindMannequinResponse {
  Mannequin mannequin = 1;
}

message CreateMannequinRequest {
  // source_login is the login of the user on the source instance (required)
  string source_login = 1;
  // owner_id is the id of the organization that owns the mannequin to be found (required)
  int64 owner_id = 2;
  // profile_name is the name that (if present) is displayed for the mannequin
  string profile_name = 3;
  // email is the email (if present) of the mannequin
  string email = 4;
}

message CreateMannequinResponse {
  Mannequin mannequin = 1;
}
