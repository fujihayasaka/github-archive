bases:
  - ../_base/
patches:
  - path: ./configmaps/environment.yaml
  - path: ./servicemeshconfigs/servicemeshconfig.yaml
  - path: ./services/turboghas.yaml
  - target:
      annotationSelector: turboghas.github.net/single-cluster=true
    patch: |-
      - op: add
        path: /metadata/annotations/moda.github.net~1cluster-preferences
        value: |
          {
            "proxima-1-%stamp%-az1": {
              "spec": {
                "suspend": false
              }
            }
          }
  - target:
      kind: Deployment
      name: processor
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  - target:
      kind: Deployment
      name: turboghas
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
