---
linters:
  FinalNewline:
    enabled: false
  SpaceAroundErbTag:
    enabled: true
  RightTrim:
    enabled: false
  AllowedScriptType:
    enabled: true
    allowed_types:
      - 'application/ld+json'
      - 'application/json'
      - 'text/javascript'
      - 'text/html'
    allow_blank: false
    disallow_inline_scripts: false
  ClosingErbTagIndent:
    enabled: false
  SpaceIndentation:
    enabled: false
  TrailingWhitespace:
    enabled: true
  SpaceInHtmlTag:
    enabled: false
  ExtraNewline:
    enabled: false
  SelfClosingTag:
    enabled: false
  NoJavascriptTagHelper:
    enabled: false
  ErbSafety:
    enabled: false
  ButtonHasType:
    enabled: true
  LinkHasHref:
    enabled: true
  BooleanAttributes:
    enabled: true
  DisabledAttribute:
    enabled: true
  NestedInteractiveElements:
    enabled: true
  RequiredAttribute:
    enabled: true
  NoPositiveTabindex:
    enabled: true
  TooltipCounter:
    enabled: true
  LandmarkHasLabel:
    enabled: true
  DropdownDividerRole:
    enabled: true
  ProperTagNesting:
    enabled: true
  DeprecatedInPrimer:
    enabled: true
    ignore_classes:
      - container
  DeprecatedCustomCss:
    enabled: true
    ignore_files:
      - 'app/views/biztools/*'
      - 'app/views/stafftools/*'
  FlexbugNumberNine:
    enabled: true