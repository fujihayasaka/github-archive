syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/reaction.proto";
import "imports/v1/batch_validation_error.proto";

// ImportReactionsAPI handles reaction import operation.
service ImportReactionsAPI {
  // ImportReactions imports reaction data to a migrated repository.
  rpc ImportReactions(ImportReactionsRequest) returns (ImportReactionsResponse);
}

message ImportReactionsRequest {
  // subject_type is the related model that the reaction will be added to (required).
  ReactionSubjectType subject_type = 1;
  // subject_id is the id of the related model that the reaction will be added to (required).
  int64 subject_id = 2;
  // reactions are the reactions to be added to the related model (required).
  repeated ReactionBatch reactions = 3;
}

message ImportReactionsResponse {
  // reactions are the created reactions (required).
  repeated Reaction reactions = 1;
  // batch_validation_errors is a list of validation errors for models that failed to import. (optional)
  repeated BatchValidationError batch_validation_errors = 2;
}
