syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/project.proto";
import "google/protobuf/timestamp.proto";

// ImportProjectAPI handles project import operation.
service ImportProjectAPI {
  // ImportProject imports project data to a migrated repository.
  rpc ImportProject(ImportProjectRequest) returns (ImportProjectResponse);
  // ImportProjectCards imports project columns to an existing project.
  rpc ImportProjectColumn(ImportProjectColumnRequest) returns (ImportProjectColumnResponse);
  // ImportProjectCards imports project cards to an existing project column.
  rpc ImportProjectCards(ImportProjectCardsRequest) returns (ImportProjectCardsResponse);
}

message ImportProjectRequest {
  // name is the name of the project (required)
  string name = 1;
  // number identifies the project number (required).
  int64 number = 2;
  // owner_login indicates the login of the owner (repository, organization, or user). (required)
  string owner_login = 3;
  // owner_type is the type of project owner. (required)
  OwnerType owner_type = 4;
  // creator_login is the login of the project creator. (required)
  string creator_login = 5;
  // created_at is the date and time the project was created. (required)
  google.protobuf.Timestamp created_at = 6;
  // repository_id is the associated repository id if the owner is a repository.
  int64 repository_id = 7;
  // body is the body of the project.
  string body = 8;
  // is_public indicates whether or not the project is a public project.
  bool is_public = 9;
  // updated_at is the date and time the project was updated.
  google.protobuf.Timestamp updated_at = 10;
  // closed_at is the date and time the project was closed.
  google.protobuf.Timestamp closed_at = 11;
  // columns are the list of columns in the project. (deprecated)
  repeated ProjectColumn columns = 12;
}

message ImportProjectResponse {
  // project is a GitHub project.
  Project project = 1;
  // project_import_errors is a list of errors for project models that failed to import. (optional)
  repeated ProjectImportError project_import_errors = 2;
}

message ImportProjectColumnRequest {
  // imported_project_id is the GitHub project column ID to import columns to.
  int64 imported_project_id = 1;
  // name is the name of the column. (required)
  string name = 2;
  // color is the color of the column.
  string color = 3;
  // created_at is the date and time the column was created. (required)
  google.protobuf.Timestamp created_at = 4;
  // updated_at is the date and time the column was updated.
  google.protobuf.Timestamp updated_at = 5;
  // purpose is the purpose of the column.
  ColumnPurpose purpose = 6;
  // cards are the list of cards in the column.
  int64 position = 7;
  // hidden_at is the date and time the column was hidden.
  google.protobuf.Timestamp hidden_at = 8;
  // workflows are the list of workflows in the column.
  repeated ProjectWorkflow workflows = 9;
}

message ImportProjectColumnResponse {
  // imported_project_id is the imported GitHub project column ID. (required)
  int64 imported_project_column_id = 1;
  // project_column_import_errors is a list of errors for project models that failed to import. (optional)
  repeated ProjectColumnImportError project_column_import_errors = 2;
}

message ImportProjectCardsRequest {
  // imported_project_column_id is the project column ID to import cards to.
  int64 imported_project_column_id = 1;
  // cards are the cards to import into the project column.
  repeated ProjectCard project_cards = 2;
}

message ImportProjectCardsResponse {
  // project_card_import_errors is a list of errors for project models that failed to import. (optional)
  repeated ProjectCardImportError project_card_import_errors = 1;
}

// ProjectColumn is used to import columns when importing projects with ImportProjectRequest. (deprecated)
message ProjectColumn {
  // name is the name of the column. (required)
  string name = 1;
  // color is the color of the column.
  string color = 2;
  // created_at is the date and time the column was created. (required)
  google.protobuf.Timestamp created_at = 3;
  // updated_at is the date and time the column was updated.
  google.protobuf.Timestamp updated_at = 4;
  // purpose is the purpose of the column.
  ColumnPurpose purpose = 5;
  // cards are the list of cards in the column.
  repeated ProjectCard cards = 6;
  // position is the position of the column in the board.
  int64 position = 7;
  // hidden_at is the date and time the column was hidden.
  google.protobuf.Timestamp hidden_at = 8;
  // workflows are the list of workflows in the column.
  repeated ProjectWorkflow workflows = 9;
}

message ProjectCard {
  // creator_login is the login of the creator. (required)
  string creator_login = 1;
  // content_type is the content type of the card. (required)
  ContentType content_type = 2;
  // content_id is the id of the content of the card.  (required if content_type is an issue)
  int64 content_id = 3;
  // note is the text of the note of the card. (required if content_type is a note)
  string note = 4;
  // priority is the priority of the card.
  uint64 priority = 5;
  // created_at is the date and time the card was created. (required)
  google.protobuf.Timestamp created_at = 6;
  // updated_at is the date and time the card was updated.
  google.protobuf.Timestamp updated_at = 7;
  // archived_at is the date and time the card was archived.
  google.protobuf.Timestamp archived_at = 8;
  // hidden_at is the date and time the card was hidden.
  google.protobuf.Timestamp hidden_at = 9;
  // priority_nil indicates whether the priority is nil.
  bool has_nil_priority = 10;
}

message ProjectWorkflow {
  // creator_login is the login of the creator. (required)
  string creator_login = 1;
  // trigger_type is the trigger type of the workflow. (required)
  TriggerType trigger_type = 2;
  // created_at is the date and time the card was created. (required)
  google.protobuf.Timestamp created_at = 3;
  // last_updater_login is the login of the user to last update the workflow.
  string last_updater_login = 4;
  // updated_at is the date and time the card was updated.
  google.protobuf.Timestamp updated_at = 5;
  // actions are the list of actions in the workflow.
  repeated ProjectWorkflowAction actions = 6;
}

message ProjectWorkflowAction {
  // creator_login is the login of the creator. (required)
  string creator_login = 1;
  // created_at is the date and time the card was created. (required)
  google.protobuf.Timestamp created_at = 2;
  // last_updater_login is the login of the user to last update the workflow action.
  string last_updater_login = 3;
  // updated_at is the date and time the card was updated.
  google.protobuf.Timestamp updated_at = 4;
}

message ProjectImportError {
  // error_message is the import error message for the model that failed. (required)
  string error_message = 1;
  // model_type is the type of the model that failed to import. (required)
  ProjectModelType model_type = 2;
}

message ProjectColumnImportError {
  // error_message is the import error message for the model that failed. (required)
  string error_message = 1;
  // model_type is the type of the model that failed to import. (required)
  ProjectModelType model_type = 2;
}

message ProjectCardImportError {
  // error_message is the import error message for the model that failed. (required)
  string error_message = 1;
  // model_type is the type of the model that failed to import. (required)
  ProjectModelType model_type = 2;
}

enum OwnerType {
  OWNER_TYPE_INVALID = 0;
  OWNER_TYPE_ORGANIZATION = 1;
  OWNER_TYPE_USER = 2;
  OWNER_TYPE_REPOSITORY = 3;
}

enum ColumnPurpose {
  COLUMN_PURPOSE_INVALID = 0;
  COLUMN_PURPOSE_TODO = 1;
  COLUMN_PURPOSE_IN_PROGRESS = 2;
  COLUMN_PURPOSE_DONE = 3;
}

enum ContentType {
  CONTENT_TYPE_INVALID = 0;
  CONTENT_TYPE_ISSUE = 1;
  CONTENT_TYPE_NOTE = 2;
}

enum ProjectModelType {
  PROJECT_MODEL_TYPE_INVALID = 0;
  PROJECT_MODEL_TYPE_PROJECT_COLUMN = 1;
  PROJECT_MODEL_TYPE_PROJECT_CARD = 2;
  PROJECT_MODEL_TYPE_PROJECT_WORKFLOW = 3;
  PROJECT_MODEL_TYPE_PROJECT_WORKFLOW_ACTION = 4;
}

enum TriggerType {
  TRIGGER_TYPE_INVALID = 0;
  TRIGGER_TYPE_ISSUE_CLOSED_TRIGGER = 1;
  TRIGGER_TYPE_ISSUE_PENDING_CARD_ADDED_TRIGGER = 2;
  TRIGGER_TYPE_ISSUE_REOPENED_TRIGGER = 3;
  TRIGGER_TYPE_PR_APPROVED_TRIGGER = 4;
  TRIGGER_TYPE_PR_CLOSED_NOT_MERGED_TRIGGER = 5;
  TRIGGER_TYPE_PR_MERGED_TRIGGER = 6;
  TRIGGER_TYPE_PR_PENDING_APPROVAL_TRIGGER = 7;
  TRIGGER_TYPE_PR_PENDING_CARD_ADDED_TRIGGER = 8;
  TRIGGER_TYPE_PR_REOPENED_TRIGGER = 9;
  TRIGGER_TYPE_REVIEW_DISMISSED_TRIGGER = 10;
}
