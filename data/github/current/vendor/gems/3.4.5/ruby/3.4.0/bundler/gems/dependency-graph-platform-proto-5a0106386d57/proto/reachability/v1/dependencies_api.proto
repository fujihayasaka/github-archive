syntax = "proto3";

package github.dependency_graph_platform.reachability.v1;

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/reachability/v1";

import "types/v1/manifest.proto";

service DependenciesAPI {
    rpc GetDependencies(GetDependenciesRequest) returns (GetDependenciesResponse);
}

message GetDependenciesRequest {
    // Required: the ID of the Github repository to process
    uint64 repository_id = 1;
    // Required: the commit SHA.
    string commit_oid = 2;
    // Optional: true will return malformed dependencies
    bool include_malformed_dependencies = 3;
}

message GetDependenciesResponse {
    uint64 repository_id = 1;
    string commit_oid = 2;
    JobStatus status = 3;
    repeated github.dependency_graph_platform.types.v1.Manifest manifests = 4;
}

enum JobStatus {
    JOB_STATUS_PROCESSING = 0;
    JOB_STATUS_COMPLETED = 1;
    JOB_STATUS_FAILED = 2;
}
