syntax = "proto3";

package github.actions.checks.v1;

// Status is the status of any check entity (suite, run, step)
// Dotcom equivalent: https://github.com/github/github/blob/2d08655067b0fccd45ef6dd0bdd1f9f338d09974/packages/checks/app/models/check_run.rb#L62-L69
enum Status {
  // Unused, default value for enum
  STATUS_UNKNOWN = 0;
  // Resource has been created but a job has not yet been queued
  STATUS_REQUESTED = 1;
  // Resource will be processed, but is not known to have started yet (default value)
  STATUS_QUEUED = 2;
  // Resource is currently being processed
  STATUS_IN_PROGRESS = 3;
  // Resource is waiting on a [gate state](https://github.com/github/c2c-actions/blob/7729e3e/docs/adrs/1683-add-waiting-status-to-checkrun.md)
  STATUS_WAITING = 4;
  // Resource is blocked by [group-based concurrency](https://github.com/github/c2c-actions/blob/7729e3e/docs/adrs/2340-add-pending-state-for-checks.md)
  STATUS_PENDING = 5;
  // Resource has finished
  STATUS_COMPLETED = 6;
}
