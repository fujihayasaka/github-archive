
syntax = "proto3";

package github.secretscanning.users.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/users";
option ruby_package = "GitHub::Proto::SecretScanning::Users::V1";

// UsersAPI manages user information.
service UsersAPI {
  // FindUsers retrieves a list of users by selector (ids, or logins)
  rpc FindUsers(FindUsersRequest) returns (FindUsersResponse);
}

// Type of user record.
enum UserType {
  // USER_TYPE_INVALID should never be set, but a zero value is required for enums.
  USER_TYPE_INVALID = 0;
  // USER_TYPE_USER denotes a normal user account.
  USER_TYPE_USER = 1;
  // USER_TYPE_ORGANIZATION denotes an organization, a special type of user account
  // that can be administered by any number of admins but that can't log-in.
  USER_TYPE_ORGANIZATION = 2;
  // USER_TYPE_BOT denotes a bot, a special type of user used in conjunction with
  // an integration; it performs actions on behalf of the integration and
  // exists solely as a means for attributing these actions to the integration.
  USER_TYPE_BOT = 3;
}

// UserListItem models user information returned in a list of users.
message UserListItem {
  // id is the database ID of the record. (required)
  int64 id = 1;
  // login is the username of the user. (required)
  string login = 2;
  // name is the name of the user.
  string name = 3;
  // type provides a mechanism to indicate the specific type of user account. (required)
  UserType type = 4;
  // email is the primary email address of the user.
  string email = 5;
}

message IdsSelector {
  repeated uint64 ids = 1;
}

message LoginsSelector {
  repeated string logins = 1;
}

// Requests with BusinessSelector will only return results if the business fully managed
// the users
message BusinessSelector {
  uint64 id = 1;
}

message FindUsersRequest {
  // ids is the list of IDs used to retrieve users. Can pass at most 100 IDs. (required)
  repeated int64 ids = 1 [deprecated = true];

  // selector for how we want to retrieve users. Can pass at most a 100 items.
  oneof selector {
    IdsSelector ids_selector = 2;
    LoginsSelector logins_selector = 3;
    BusinessSelector business_selector = 4;
  }

  // cursor represents an opaque object to be used to identify where to continue on a stream of users
  // Only used by the BusinessSelector at the moment
  bytes cursor = 5;
}

message FindUsersResponse {
  // users are the list of users found for the provided selections. (required)
  repeated UserListItem users = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of organizations.
  bytes next_cursor = 2;
}