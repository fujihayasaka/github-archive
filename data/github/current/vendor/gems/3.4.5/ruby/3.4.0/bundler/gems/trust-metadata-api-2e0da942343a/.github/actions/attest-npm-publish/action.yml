---
name: "Attest npm Publish Statement"
description: "Generate an npm publish attestation"
author: "GitHub"

inputs:
  subject-path:
    description: >
      Path to the artifact serving as the subject of the attestation.
    required: true
  package-name:
    description: >
      Name of package being published.
    required: true
  package-version:
    description: >
      Version of package being published.
    required: true
  private-key:
    description: >
      Private key to use for signing attestation (base64-encoded PEM file).
    required: true
outputs:
  bundle-path:
    description: "The path to the file containing the attestation bundle."

runs:
  using: node20
  main: ./dist/index.js
