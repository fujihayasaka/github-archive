syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/repository.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

// ImportRepositoryAPI handles repository import operation.
service ImportRepositoryAPI {
  // ImportRepository imports a repository.
  rpc ImportRepository(ImportRepositoryRequest) returns (ImportRepositoryResponse);
  // UpdateRepository updates an existing repository.
  rpc UpdateRepository(UpdateRepositoryRequest) returns (UpdateRepositoryResponse);
  // DeleteRepository deletes an existing repository.
  rpc DeleteRepository(DeleteRepositoryRequest) returns (DeleteRepositoryResponse);
  // SetRepositorySequence sets an existing repository's sequence number.
  rpc SetRepositorySequence(SetRepositorySequenceRequest) returns (SetRepositorySequenceResponse);
  // UpdateActionsSettings updates the actions settings for a repository.
  rpc UpdateActionsSettings(UpdateActionsSettingsRequest) returns (UpdateActionsSettingsResponse);
  // UpdateRepositoryVisibility updates the visibility for an existing repository.
  rpc UpdateRepositoryVisibility(UpdateRepositoryVisibilityRequest) returns (UpdateRepositoryVisibilityResponse);
  // CheckIfRepositoryExists checks if a repository already exists
  rpc CheckIfRepositoryExists(CheckIfRepositoryExistsRequest) returns (CheckIfRepositoryExistsResponse);
}

message ImportRepositoryRequest {
  // import_id is the associated import ID. (optional)
  int64 import_id = 1;
  // owner_id is the ID of the owner for the new repository.
  int64 owner_id = 2;
  // name of the new repository. (required)
  string name = 3;
  // visibility indicates the repository's visibility level. (required)
  RepositoryVisibility visibility = 4;
  // create_wiki tells the handler to initialize an empty wiki git repository. (required)
  bool create_wiki = 5;
  // create a repository with max_object_size in MB (default : 100)
  int32 max_object_size = 6;
  // user_id is the ID of the user that initialized the migration. (optional)
  int64 user_id = 7;
}

message ImportRepositoryResponse {
  // repository is the created repository. (required)
  Repository repository = 1;
}

message UpdateRepositoryRequest {
  // repository_id is the database ID of an existing repository record. (required)
  int64 repository_id = 1;
  // default_branch is the default branch for the repository. (required)
  string default_branch = 2;
  // description is the repository description.
  string description = 3;
  // has_wiki determines whether or not to enable wikis on the repository. (required)
  bool has_wiki = 4;
  // has_issues determines whether or not to enable issues on the repository. (required)
  bool has_issues = 5;
  // has_downloads determines whether or not to enable downloads on the repository. (required)
  bool has_downloads = 6;
  // page is the repository's page settings.
  Page page = 7;
  // webhooks are the webhooks to be imported for the repository.
  repeated Webhook webhooks = 8;
  // autolinks are the autolink references to be imported for the repository.
  repeated Autolink autolinks = 9;
  // repository_topics are the repository topics to be imported for the repository.
  repeated RepositoryTopic repository_topics = 10;
  // has_dependency_graph determines whether or not to enable dependency graphs on the repository. (required)
  bool has_dependency_graph = 11;
  // has_vulnerability_alerts determines whether or not to enable vulnerability alerts on the repository. (required)
  bool has_vulnerability_alerts = 12;
  // has_vulnerability_updates determines whether or not to enable vulnerability updates on the repository. (required)
  bool has_vulnerability_updates = 13;
  // has_advanced_security determines whether or not to enable advanced security on the repository. (required)
  bool has_advanced_security = 14;
  // has_token_scanning determines whether or not to enable token scanning on the repository. (required)
  bool has_token_scanning = 15;
  // has_token_scanning_push_protection determines whether or not to enable token scanning push protection on the repository. (required)
  bool has_token_scanning_push_protection = 16;
  // general_settings are the repository's general settings.
  GeneralSettings general_settings = 17;
  // general_repository_settings are the repository's general repository settings.
  GeneralRepositorySettings general_repository_settings = 18;
}

message DeleteRepositoryRequest {
  // repository_id is the database ID of an existing repository record. (required)
  int64 repository_id = 1;
}

message UpdateActionsSettingsRequest {
  // repository_id is the database ID of an existing repository record. (required)
  int64 repository_id = 1;
  // actions_permission is the actions permission setting for repository. (required)
  ActionsPermissionType actions_permission = 2;
  // allows_github_owned_actions is the flag that allows github actions for the repository.
  bool allows_github_owned_actions = 3;
  // allows_verified_actions is the flag that allows verified actions for the repository.
  bool allows_verified_actions = 4;
  // patterns is the list of specified actions allowed for the repository.
  repeated string patterns = 5;
}

message UpdateActionsSettingsResponse {
  // repository is the updated repository. (required)
  Repository repository = 1;
}

message Page {
  // source is the repository's source page setting.
  string source = 1;
  // source_ref_name is the repository's source_ref_name page setting.
  string source_ref_name = 2;
  // source_subdir is the repository's source_subdir page setting.
  string source_subdir = 3;
  // is_public is the repository's is_public page setting.
  bool is_public = 4;
  // build_type is the repository's build_type page setting.
  string build_type = 5;
}

message Webhook {
  // payload_url the url to send the payload of the webhook (required)
  string payload_url = 1;
  // whether or not the webhook should be active (required)
  bool active = 2;
  // whether this webhook should use ssl (required)
  bool enable_ssl_verification = 3;
  // event_types is a list of events that will trigger this webhook. (required)
  repeated string event_types = 4;
  // the http method to use for the webhook (required)
  string content_type = 5;
}

message RepositoryTopic {
  // topic_name is the name of the topic to be imported (required).
  string topic_name = 1;
  // topic_url is the url of the topic to be imported.
  string topic_url = 2;
  // state is the state of the topic to be imported (required).
  RepositoryTopicState state = 3;
  // creator_login is the creator of the topic to be imported (required).
  string creator_login = 4;
  // created_at is the creation date of the topic to be imported (required).
  google.protobuf.Timestamp created_at = 5;
  // updated_at is the last update date of the topic to be imported.
  google.protobuf.Timestamp updated_at = 6;
}

enum RepositoryTopicState {
  REPOSITORY_TOPIC_STATE_INVALID = 0;
  REPOSITORY_TOPIC_STATE_CREATED = 1;
  REPOSITORY_TOPIC_STATE_SUGGESTED = 2;
  REPOSITORY_TOPIC_STATE_DECLINED_NOT_RELEVANT = 3;
  REPOSITORY_TOPIC_STATE_DECLINED_TOO_SPECIFIC = 4;
  REPOSITORY_TOPIC_STATE_DECLINED_PERSONAL_PREFERENCE = 5;
  REPOSITORY_TOPIC_STATE_DECLINED_TOO_GENERAL = 6;
}

message Autolink {
  // key_prefix the reference prefix for the autolink reference. (required)
  string key_prefix = 1;
  // url_template the target url for the autolink reference. (required)
  string url_template = 2;
  // is_alphanumeric the configuration for the autolink reference.
  bool is_alphanumeric = 3;
}

// To Be Deprecated After Implementing GeneralRepositorySettings Message
message GeneralSettings {
  // is_template indicates whether a repository is a template.
  bool is_template = 1;
  // has_allow_forking indicates whether a repository has forking allowed.
  bool has_allow_forking = 2;
  // has_sponsorships indicates whether sponsorships are enabled.
  bool has_sponsorships = 3;
  // has_discussions indicates whether discussions are enabled.
  bool has_discussions = 4;
  // has_merge_commit indicates whether merge commits are enabled.
  bool has_merge_commit = 5;
  // has_squash_merge indicates whether squash merges are enabled.
  bool has_squash_merge = 6;
  // has_rebase_merge indicates whether rebase merges are enabled.
  bool has_rebase_merge = 7;
  // has_auto_merge indicates whether auto merging is enabled.
  bool has_auto_merge = 8;
  // has_delete_branch_heads indicates whether branch heads will automatically be deleted upon merge.
  bool has_delete_branch_heads = 9;
  // has_update_branch indicates whether the "update branch" option will appear in pull requests.
  bool has_update_branch = 10;
  // has_git_lfs_in_archives indicates whether git lfs files are included in archives.
  bool has_git_lfs_in_archives = 11;
  // has_projects indicates whether projects are enabled.
  bool has_projects = 12;
}

message GeneralRepositorySettings {
  // is_template indicates whether a repository is a template.
  google.protobuf.BoolValue is_template = 1;
  // has_allow_forking indicates whether a repository has forking allowed.
  google.protobuf.BoolValue has_allow_forking = 2;
  // has_sponsorships indicates whether sponsorships are enabled.
  google.protobuf.BoolValue has_sponsorships = 3;
  // has_discussions indicates whether discussions are enabled.
  google.protobuf.BoolValue has_discussions = 4;
  // has_merge_commit indicates whether merge commits are enabled.
  google.protobuf.BoolValue has_merge_commit = 5;
  // has_squash_merge indicates whether squash merges are enabled.
  google.protobuf.BoolValue has_squash_merge = 6;
  // has_rebase_merge indicates whether rebase merges are enabled.
  google.protobuf.BoolValue has_rebase_merge = 7;
  // has_auto_merge indicates whether auto merging is enabled.
  google.protobuf.BoolValue has_auto_merge = 8;
  // has_delete_branch_heads indicates whether branch heads will automatically be deleted upon merge.
  google.protobuf.BoolValue has_delete_branch_heads = 9;
  // has_update_branch indicates whether the "update branch" option will appear in pull requests.
  google.protobuf.BoolValue has_update_branch = 10;
  // has_git_lfs_in_archives indicates whether git lfs files are included in archives.
  google.protobuf.BoolValue has_git_lfs_in_archives = 11;
  // has_projects indicates whether projects are enabled.
  google.protobuf.BoolValue has_projects = 12;
}

message UpdateRepositoryResponse {
  // repository is the created repository. (required)
  Repository repository = 1;
}

message DeleteRepositoryResponse {
  // repository is the repository that was deleted. (required)
  Repository repository = 1;
}

message SetRepositorySequenceRequest {
  // repository_id is the database ID of an existing repository record. (required)
  uint64 repository_id = 1;
  // sequence_number is the number the sequence will be set to. (required)
  uint32 sequence_number = 2;
}

message SetRepositorySequenceResponse {
  //empty
}

enum ActionsPermissionType{
  ACTIONS_PERMISSION_TYPE_INVALID = 0;
  ACTIONS_PERMISSION_TYPE_ALL_ENABLED = 1;
  ACTIONS_PERMISSION_TYPE_LOCAL_ENABLED = 2;
  ACTIONS_PERMISSION_TYPE_SPECIFIC_ENABLED = 3;
  ACTIONS_PERMISSION_TYPE_INHERITED = 4;
}

message UpdateRepositoryVisibilityRequest {
  // repository_id is the database ID of an existing repository record. (required)
  int64 repository_id = 1;
  // visibility indicates the repository's visibility level. (required)
  RepositoryVisibility visibility = 2;
  // is_archived indicates whether the repository should be archived. (required)
  bool is_archived = 3;
}

message UpdateRepositoryVisibilityResponse {
  // repository is the updated repository. (required)
  Repository repository = 1;
}

message CheckIfRepositoryExistsRequest {
  // owner_id is the ID of the owner for the new repository.(required)
  int64 owner_id = 1;
  // name of the repository. (required)
  string name = 2;
}

message CheckIfRepositoryExistsResponse {
  // repository is the created repository. (required)
  Repository repository = 1;
}
