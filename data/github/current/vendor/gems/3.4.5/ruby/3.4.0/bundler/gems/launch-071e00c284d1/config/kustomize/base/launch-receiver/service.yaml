# http://kubernetes.io/docs/user-guide/services
apiVersion: v1
kind: Service

metadata:
  name: launch-receiver
  labels:
    service: launch-receiver
  annotations:
    moda.github.net/istio-ingress-enabled: "true"

spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 6824
  type: LoadBalancer
  selector:
    service: launch-receiver
---
apiVersion: v1
kind: Service

# This maps to the launch-receiver service, but we can use a generic "launch"
# since it's the only public service in launch
metadata:
  name: launch
  labels:
    service: launch
  annotations:
    moda.github.net/istio-ingress-enabled: "true"

spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 6824
  type: LoadBalancer
  selector:
    service: launch-receiver