syntax = "proto3";

package billing_platform.base.v1;

message EntityDetail {
    string customerId = 1;
    int64 ownerId = 2;
    int64 repoId = 3;
    int64 actorId = 4;
}

enum ResourceType {
    NoTarget = 0;
    User = 1;
    Team = 2;
    Repo = 3;
    Org = 4;
    Enterprise = 5;
    CostCenterResource = 6;
}

enum RepositoryVisibility {
    VISIBILITY_UNKNOWN = 0;
    PUBLIC = 1;
    PRIVATE = 2;
    INTERNAL = 3;
}

enum CostCenterState {
    CostCenterActive = 0;
    CostCenterArchived = 1;
}