# http://kubernetes.io/docs/user-guide/services
apiVersion: v1
kind: Service

metadata:
  name: launch-worker
  labels:
    service: launch-worker
  annotations:
    moda.github.net/domain-name: "launch-worker-%environment%.service.%site%.github.net,launch-worker-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"

spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 6824
  type: LoadBalancer
  selector:
    service: launch-worker
