syntax = "proto3";

package hydro.schemas.blackbird.v0.entities;

option java_package = "com.github.hydro.schemas.blackbird.v0.entities";
option csharp_namespace = "GitHub.Hydro.Schemas.Blackbird.V0.Entities";

// The mode corresponding to a given epoch.
enum EpochMode {
  LEGACY_HYBRID = 0; // [Deprecated] Embeddings and lexical/code (for smaller environments such as Proxima stamps).
  LEXICAL = 1; // Lexical code search only.
  EMBEDDINGS = 2; // Embeddings only.
  EMBEDDINGS_GRAPH = 3; // Embeddings only (graph indices).
  HYBRID = 4; // Hybrid mode: embeddings and lexical/code, sharded by doc sha. Used in Proxima.
}
