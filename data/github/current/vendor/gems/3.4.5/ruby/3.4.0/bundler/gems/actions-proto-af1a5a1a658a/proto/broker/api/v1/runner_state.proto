syntax = "proto3";

package github.actions.broker.api.v1;

import "broker/api/v1/runner_type.proto";
import "broker/api/v1/runner_scale_set_statistics.proto";

service RunnerStateService {
    rpc GetRunnerStates(GetRunnerStatesRequest) returns (GetRunnerStatesResponse);
    rpc DeactivateRunner(DeactivateRunnerRequest) returns (DeactivateRunnerResponse);
}

enum RunnerStatus {
    RUNNER_STATUS_UNKNOWN = 0;
    RUNNER_STATUS_OFFLINE = 1;
    RUNNER_STATUS_IDLE = 2;
    RUNNER_STATUS_BUSY = 3;
}

message Runner {
    string owner_id = 1;
    RunnerType runner_type = 2;
    int64 runner_id = 3;
}

message GetRunnerStatesRequest {
    string billing_owner_id = 1;
    repeated Runner runners = 2;
    bool include_scale_set_statistics = 3;
}

message RunnerState {
    RunnerStatus status = 1;
    string version = 2;
}

message AssignedRequest {
    string job_name = 1;
    string check_run_id = 2;
    string external_build_id = 3;
}

message RunnerWithState {
    Runner runner = 1;
    RunnerState state = 2;
    BrokerRunnerScaleSetStatistics scale_set_statistics = 3;
    AssignedRequest assigned_request = 4;
}

message GetRunnerStatesResponse {
    repeated RunnerWithState runner_states = 1;
}

message DeactivateRunnerRequest {
    string billing_owner_id = 1;
    Runner runner = 2;
}

message DeactivateRunnerResponse {
}
