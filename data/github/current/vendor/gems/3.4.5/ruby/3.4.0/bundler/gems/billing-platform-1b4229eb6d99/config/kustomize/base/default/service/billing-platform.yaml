apiVersion: v1
kind: Service
metadata:
  name: billing-platform
  labels:
    service: billing-platform
  annotations:
    # https://moda.githubapp.com/docs/features/load-balancing/#using-variables-in-domain-names
    moda.github.net/domain-name: "billing-platform-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 8989
    protocol: TCP
    targetPort: http
  selector:
    app: apiv1
  type: LoadBalancer
