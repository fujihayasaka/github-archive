syntax = "proto3";

package notifyd.layouts.mobile;
option go_package = "proto/layouts/mobile";
option ruby_package = "Notifyd::Proto::Layouts::Mobile";

// Basic layout to render a generic mobile push notification
message Basic {
  // Permalink to the notification's subject
  string url = 1;

  // Title of the notification
  string title = 2;

  // Additional high-level context that will be rendered below the title
  string subtitle = 3;

  // Detailed description of the notification that will be rendered below the subtitle
  // The body will get truncated if it's longer than 500 characters.
  string body = 4;

  // Avatar URL of the notification author, can be empty
  string avatar_url = 5;

  // Author's GitHub profile name, can be empty
  string author_profile_name = 6;

  // Author's GitHub handle
  string author_username = 7;

  // Global Relay ID of the notification thread object to reply to, can be empty
  string thread_id = 8;

  // Class of the notification thread object to reply to, can be empty
  string thread_type = 9;

  // Addtional ID that can be used to give more context to the client about the notification subject, can be empty
  string subject_id = 10;
}
