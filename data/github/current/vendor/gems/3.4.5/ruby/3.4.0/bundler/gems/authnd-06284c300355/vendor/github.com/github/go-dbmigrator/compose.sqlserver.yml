version: '3.6'

services:
  migrations:
    image: go-dbmigrator-sqlserver:latest
    build:
      context: ./sqlserver
      dockerfile: ./migrations.dockerfile
      args:
        - BRANCH
    volumes:
      - "./sqlserver/script:/sqlscripts"
      - "${DB_MIGRATIONS_DIR:-./sqlserver/test_migrations:/sqlscripts/migrations}"
      - "${DB_DATABASES_DIR:-./sqlserver/test_databases:/sqlscripts/databases}"
    depends_on:
       - db
    environment:
      - BRANCH
      - ECHO_COLOR_OFF
      - SA_PASSWORD=${SA_PASSWORD:-yourStrong(!)Password}
      - DB_USERNAME=${DB_USERNAME:-sa}
      - DB_HOSTNAME=${DB_HOSTNAME:-db}
      - DB_PORTNUM=${DB_PORTNUM:-1433}
      - DB_NAME=${DB_NAME:-test}
      - SQL_PRIMARY_USER_NAME=${SQL_PRIMARY_USER_NAME:-appuser1}
      - SQL_PRIMARY_USER_PASSWORD=${SQL_PRIMARY_USER_PASSWORD:-#test123Password!}
      - SQL_SECONDARY_USER_NAME=${SQL_SECONDARY_USER_NAME:-appuser2}
      - SQL_SECONDARY_USER_PASSWORD=${SQL_SECONDARY_USER_PASSWORD:-!Password321test#}
      - SQL_TEST_USER_NAME=${SQL_TEST_USER_NAME:-GHAE Usage Service Test Client INT}
      - MIGRATION_ENV_VARS=${MIGRATION_ENV_VARS:-SQL_TEST_USER_NAME DB_NAME SQL_PRIMARY_USER_NAME SQL_PRIMARY_USER_PASSWORD SQL_SECONDARY_USER_NAME SQL_SECONDARY_USER_PASSWORD}
  db:
    image: mcr.microsoft.com/mssql/server:latest
    ports:
      - 2433:1433
    environment:
      - SA_PASSWORD=${SA_PASSWORD:-yourStrong(!)Password}
      - ACCEPT_EULA=Y
      - MSSQL_PID=Enterprise
