syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/release.proto";
import "google/protobuf/timestamp.proto";

// ImportReleaseAPI handles release import operation.
service ImportReleaseAPI {
  // ImportRelease imports release data to a migrated repository.
  rpc ImportRelease(ImportReleaseRequest) returns (ImportReleaseResponse);
}

message ImportReleaseRequest {
  // repository_id is the associated repository id. (required)
  int64 repository_id = 1;
  // author_login is the source login for the author of the release. (required)
  string author_login = 2;
  // name is the name of the release. (optional)
  string name = 3;
  // tag_name identifies the release tag_name (required).
  string tag_name = 4;
  // body is the body of the release. (optional)
  string body = 5;
  // state is the state of the release. (required)
  ReleaseState state = 6;
  // pending_tag is the pending_tag of the release. (optional)
  string pending_tag = 7;
  // is_pre_release is the pre release state of the release. (optional)
  bool is_pre_release = 8;
  // target_commitish is the target_commitish of the release. (optional)
  string target_commitish = 9;
  // published_at indicates the date and time when the release was created. (optional)
  google.protobuf.Timestamp published_at = 10;
  // created_at indicates the date and time when the release was created. (required)
  google.protobuf.Timestamp created_at = 11;
}

enum ReleaseState {
  RELEASE_STATE_INVALID = 0;
  RELEASE_STATE_PUBLISHED = 1;
  RELEASE_STATE_DRAFT = 2;
}

message ImportReleaseResponse {
  // release is the created release. (required)
  Release release = 1;
}
