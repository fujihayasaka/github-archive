name: proto-gen-go-check
on:
  pull_request: {}
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  pr:
    name: Check that generated Go protobuf code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go version
      - name: Building protobufs
        run: make build-protobufs
      - name: Check for stale Octoshift proto outputs
        run: |
          git diff --name-only | (! grep "octoshift/imports") || { echo "FAIL! Stale go protobuf clients detected (run: make build-protobufs)"; exit 1; }
      - name: Check for stale mvnd proto outputs
        run: |
         git diff --name-only | (! grep "pkg/mvnd/api") || { echo "FAIL! Stale go protobuf clients detected (run: make build-protobufs)"; exit 1; }