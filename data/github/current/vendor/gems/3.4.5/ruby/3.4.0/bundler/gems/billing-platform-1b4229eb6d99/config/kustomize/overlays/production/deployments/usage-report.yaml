apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-report
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "canary"
spec:
  selector:
    matchLabels:
      canary: "production"
  template:
    metadata:
      labels:
        canary: "production"
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: usage-report
          env:
          - name: KUSTO_BLOB_EXPORT_STORAGE_ACCOUNT_ENDPOINT
            value: https://mbproduction.blob.core.windows.net
          - name: KUSTO_ENDPOINT
            value: https://ghbillingprod.eastus.kusto.windows.net
