syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

message BatchValidationError {
  // batch_index is the index of the batched models that failed validation. (required)
  int64 batch_index = 1;
  // error_message is the validation error message for the model that failed. (required)
  string error_message = 2;
}
