[package]
name = "spokes-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
prost-wkt-types = { git = "https://github.com/fdeantoni/prost-wkt.git", rev = "0d06c21b24f195fb2bf6e8558111eae9c552f466" }
serde = { version = "1.0", features = ["derive"] }
twirp = { git = "https://github.com/github/twirp-rs.git", rev = "7245d4556b8af9977d1b4a632c428cf875eb79ef" }

[build-dependencies]
glob = "0.3.1"
prost-build = "0.13"
twirp-build = { git = "https://github.com/github/twirp-rs.git", rev = "7245d4556b8af9977d1b4a632c428cf875eb79ef" }

[package.metadata.cargo-machete]
ignored = ["prost", "prost-wkt-types", "serde", "twirp"]
