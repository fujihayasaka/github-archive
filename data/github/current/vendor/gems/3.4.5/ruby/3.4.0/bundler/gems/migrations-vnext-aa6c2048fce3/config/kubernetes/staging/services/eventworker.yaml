apiVersion: v1
kind: Service
metadata:
  name: eventworker
  labels:
    service: eventworker
  annotations:
    moda.github.net/domain-name: "eventworker-%environment%.service.%region%.github.net"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: eventworker
  type: LoadBalancer