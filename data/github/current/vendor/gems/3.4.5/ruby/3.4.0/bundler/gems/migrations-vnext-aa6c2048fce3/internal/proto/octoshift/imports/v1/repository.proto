syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/wrappers.proto";

message Repository {
  // id is the database ID of the record. (required)
  int64 id = 1;
  // owner_id is the database ID of the user. (required)
  int64 owner_id = 2;
  // name is the name of the repository. (required)
  string name = 3;
  // visibility shows the visibility of a repository. (required)
  RepositoryVisibility visibility = 4;
  // ssh_push_url is the ssh push url of a repository. (required)
  string ssh_push_url = 5;
  // default_branch is the default branch for the repository. (required)
  string default_branch = 6;
  // http_url is the http url of a repository. (required)
  string http_url = 7;
  // wiki_ssh_url is the SSH url of a wiki repository.
  google.protobuf.StringValue wiki_ssh_url = 8;
  // wiki_http_url is the HTTP url of a wiki repository.
  google.protobuf.StringValue wiki_http_url = 9;
  // page_error_message is the optional page setting error message.
  string page_error_message = 10;
  // security_setting_errors are the errors that occurred when enabling security settings.
  repeated string security_setting_errors = 11;
  // general_setting_errors are the errors that occured when enabling general settings.
  repeated string general_setting_errors = 12;
  // is_archived indicates whether the repository is archived.
  bool is_archived = 13;
  // is_deleted indicates whether the repository is deleted.
  bool is_deleted = 14;
}

enum RepositoryVisibility {
  // REPOSITORY_VISIBILITY_INVALID is present because because enums require a zero value. This
  // should never be returned.
  REPOSITORY_VISIBILITY_INVALID = 0;
  // REPOSITORY_VISIBILITY_PUBLIC is returned if the repository is public.
  REPOSITORY_VISIBILITY_PUBLIC = 1;
  // REPOSITORY_VISIBILITY_PRIVATE is returned if the repository is private.
  REPOSITORY_VISIBILITY_PRIVATE = 2;
  // REPOSITORY_VISIBILITY_INTERNAL is returned if the repository is internal.
  REPOSITORY_VISIBILITY_INTERNAL = 3;
}
