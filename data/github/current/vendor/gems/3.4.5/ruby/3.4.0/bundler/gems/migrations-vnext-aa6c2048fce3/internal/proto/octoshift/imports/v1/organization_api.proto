syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// OrganizationAPI manages organization related operations.
service OrganizationAPI {
  // GetOrganization returns the organization associated with the import.
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
}

message GetOrganizationRequest {
  // login is the organization's login name. (required)
  string login = 1;
} 

message GetOrganizationResponse {
  // id is the organization ID. (required)
  int64 id = 1;
  // name is the organization's public profile name. (required)
  string name = 2;
  // login is the organization's login name. (required)
  string login = 3;
  // business_slug is the unique login identifier for a business that the organization belongs
  string business_slug = 4;
}
