syntax = "proto3";

package attester.v0;

option go_package = "attester/v0";
option ruby_package = "MonolithTwirp::Attester::V0";

service BooAPI {
    rpc HelloName(HelloNameRequest) returns (HelloNameResponse);
    rpc Error(HelloNameRequest) returns (HelloNameResponse);
}

message HelloNameRequest {
    string name = 1;
}

message HelloNameResponse{
    string message = 1;
}
