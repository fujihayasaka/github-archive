syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/issue.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// ImportIssueAPI handles issue import operation.
service ImportIssueAPI {
    // ImportIssue imports issue data to a migrated repository.
    rpc ImportIssue(ImportIssueRequest) returns (ImportIssueResponse);
}

message ImportIssueRequest {
    // author_login is the source login for the author of the imported issue. (required)
    string author_login = 1;
    // import_id is id of the import. (optional)
    int64 import_id = 2;
    // repository_id is the associated repository id. (required)
    int64 repository_id = 3;
    // title is the title of the issue. (required)
    string title = 4;
    // body is the body of the issue.
    string body = 5;
    // number identifies the issue number (required).
    int64 number = 6;
    // created_at indicates the date and time when the issue was created. (required)
    google.protobuf.Timestamp created_at = 7;
    // updated_at indicates the date and time when the issue was last updated.
    google.protobuf.Timestamp updated_at = 8;
    // closed_at indicates the date and time when the issue was closed.
    google.protobuf.Timestamp closed_at = 9;
    // milestone_id is the optional id of the imported milestone linked with this issue. (deprecated)
    google.protobuf.Int64Value milestone_id = 10;
    // assignees is a list of assignee logins.
    repeated string assignees = 11;
}

message ImportIssueResponse {
    // issue is the created issue. (required)
    Issue issue = 1;
}
