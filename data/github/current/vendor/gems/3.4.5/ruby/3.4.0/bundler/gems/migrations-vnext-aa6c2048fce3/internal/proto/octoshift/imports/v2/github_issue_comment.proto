syntax = "proto3";

package octoshift.imports.v2;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v2";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V2";

message GitHubIssueComment {
  // id is the database ID of the issue comment. (required)
  int64 id = 1;
  // resource_identifier is the resource identifier of the transformed resource that was successfully imported. (required)
  string resource_identifier = 2;
}
