syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/wrappers.proto";
import "imports/v1/protected_branch.proto";

// ImportProtectedBranchAPI handles the protected branch import operation.
service ImportProtectedBranchAPI {
  // ImportProtectedBranch imports a single protected branch for a repository.
  rpc ImportProtectedBranch(ImportProtectedBranchRequest) returns (ImportProtectedBranchResponse);
}

message ImportProtectedBranchRequest {
  // repository_id is the id of the imported repository for this branch. (required)
  int64 repository_id = 1;
  // name is the name of the protected branch pattern. (required)
  string name = 2;
  // requires_approving_reviews determines if approving reviews are required to update the branch.
  google.protobuf.BoolValue requires_approving_reviews = 3;
  // required_approving_review_count is the number of approving reviews required to update the branch.
  google.protobuf.Int32Value required_approving_review_count = 4;
  // requires_commit_signatures determines if commits are required to be signed.
  google.protobuf.BoolValue requires_commit_signatures = 5;
  // requires_linear_history determines if merge commits are prohibited from being pushed to this branch.
  google.protobuf.BoolValue requires_linear_history = 6;
  // allows_force_pushes determines if force pushes are allowed on this branch.
  google.protobuf.BoolValue allows_force_pushes = 7;
  // allows_deletions determines if this branch can be deleted.
  google.protobuf.BoolValue allows_deletions = 8;
  // is_admin_enforced determines if admins can overwrite branch protection.
  google.protobuf.BoolValue is_admin_enforced = 9;
  // requires_status_checks determines if status checks are required to update the branch.
  google.protobuf.BoolValue requires_status_checks = 10;
  // requires_strict_status_checks determines if branches are required to be up to date before merging.
  google.protobuf.BoolValue requires_strict_status_checks = 11;
  // requires_code_owner_reviews determines if reviews from code owners are required to update the branch.
  google.protobuf.BoolValue requires_code_owner_reviews = 12;
  // dismisses_stale_reviews determines if new commits pushed to the branch will dismiss pull request review approvals.
  google.protobuf.BoolValue dismisses_stale_reviews = 13;
  // restricts_review_dismissals determines if dismissal of pull request reviews is restricted.
  google.protobuf.BoolValue restricts_review_dismissals = 14;
  // restricts_pushes determines if pushing to the branch is restricted.
  google.protobuf.BoolValue restricts_pushes = 15;
  // required_status_check_contexts is a list of required status check contexts that must pass for commits to be accepted to the branch.
  repeated string required_status_check_contexts = 16;
  // requires_review_thread_resolution determines if review threads are required to be resolved before merging.
  google.protobuf.BoolValue requires_review_thread_resolution = 17;
  // require_last_push_approval determines if pull request requires approval of the most recent reviewable push by someone other than the person who pushed it.
  google.protobuf.BoolValue require_last_push_approval = 18;
}

message ImportProtectedBranchResponse {
  // protected_branch is the created protected branch. (required)
  ProtectedBranch protected_branch = 1;
}
