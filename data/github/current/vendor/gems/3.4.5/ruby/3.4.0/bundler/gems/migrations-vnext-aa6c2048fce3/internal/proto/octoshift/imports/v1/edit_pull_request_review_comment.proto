syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/live_migration_action.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// EditPullRequestReviewCommentAPI handles pull request review comment edit operations.
service EditPullRequestReviewCommentAPI {
  // EditPullRequestReviewComment edits pull request review comment data during live migrations.
  rpc EditPullRequestReviewComment(EditPullRequestReviewCommentRequest) returns (EditPullRequestReviewCommentResponse);
}

message EditPullRequestReviewCommentRequest {
  // id is the ID of the pull request review comment to edit. (required)
  int64 id = 1;
  // LiveMigrationAction is action that will be performed against the pull request review comment. (required)
  LiveMigrationAction action = 2;
  // updated_at indicates the date and time when the pull request review comment was last updated. (required)
  google.protobuf.Timestamp updated_at = 3;
  // user_login indicates the login for the user performing the action. (required)
  string user_login = 4;
  // body is the body of the pull request review comment.
  google.protobuf.StringValue body = 5;
}

message EditPullRequestReviewCommentResponse {
  // id is the database ID of the edited pull request review comment. (required)
  int64 id = 1;
}
