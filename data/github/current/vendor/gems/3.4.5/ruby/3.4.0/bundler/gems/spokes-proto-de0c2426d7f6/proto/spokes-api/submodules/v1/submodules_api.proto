syntax = "proto3";

package github.spokes.submodules.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/submodules";
option ruby_package = "GitHub::Spokes::Proto::Submodules::V1";

import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";
import "spokes-api/types/selectors/v1/treeish_selector.proto";
import "spokes-api/types/v1/submodule.proto";
import "spokes-api/types/v1/path.proto";

// SubmodulesAPI contains APIs for submodule-related Git operations.
service SubmodulesAPI {
    // ReadSubmodule returns the submodule object for a given repository and path.
    rpc ReadSubmodules(ReadSubmodulesRequest) returns (ReadSubmodulesResponse);
}

message ReadSubmodulesRequest {
    // repository is the repository to scope the submodule lookup to.
    github.spokes.types.v1.Repository repository = 1;

    github.spokes.types.v1.RequestContext request_context = 2;

    // selector is which tree to select the submodules from.
    oneof selector {
        // treeish_selector is a selector for picking a tree by its treeish.
        github.spokes.types.selectors.v1.TreeishSelector treeish_selector = 3;
    }

    // paths is the list of submodule paths to read the details. There is a limit of 1000 paths.
    repeated github.spokes.types.v1.Path paths = 4;
}

message ReadSubmodulesResponse {
  // submodules is the list of submodules.
  repeated github.spokes.types.v1.Submodule submodules = 1;
}
