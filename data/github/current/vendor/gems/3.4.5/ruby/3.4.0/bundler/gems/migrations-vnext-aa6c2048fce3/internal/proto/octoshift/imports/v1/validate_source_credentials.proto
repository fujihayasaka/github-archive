syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// ValidateSourceCredentialsAPI is used to validate source credentials for a migration
service ValidateSourceCredentialsAPI {
  // ValidateSourceCredentials validates the source credentials for a migration
  rpc ValidateSourceCredentials(ValidateSourceCredentialsRequest) returns (ValidateSourceCredentialsResponse);
}

message ValidateSourceCredentialsRequest {
  // access_token is the access_token to be used for export. (required)
  string access_token = 1;
  // repository_name is the name of the source repository. (required)
  string repository_name = 2;
  // owner_login is the login for organization that owns the source repository. (required)
  string owner_login = 3;
  // user_id is the id for the user creating the migration. (required)
  int64 user_id = 4;
  // is_org_migration indicates whether the migration is a repo or org migration
  bool is_org_migration = 5;
}

message ValidateSourceCredentialsResponse {
  // can_migrate is whether the given credentials are valid.
  bool can_migrate = 1;
}
