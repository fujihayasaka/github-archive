name: Staging E2E Test

on:
  workflow_dispatch:
    inputs:
      report-status:
        description: 'Report prober status to DataDog'
        default: true
        required: false
        type: boolean
  schedule:
    # run every 5 minutes, as often as Github Actions allows
    - cron: '*/5 * * * *'

permissions:
  id-token: write

jobs:
  prober:
    uses: github/package-security/.github/workflows/staging-e2e.yml@main
    with:
      hmac-client-id: dotcom
      report-status: ${{ inputs.report-status || true }}
      repository: ${{ github.repository }}
    secrets:
      hmac-key: "${{ secrets.DOTCOM_STAGING_HMAC_KEY }}"
      datadog-api-key: "${{ secrets.DATADOG_API_KEY }}"
