syntax = "proto3";

package github.actions.results.entities.v1;

// Concurrency (a.k.a. group lease) is used to ensure only a single run or job is running at a time
message Concurrency {
	// The name of the concurrency group
	string group = 1;

	// The plan or job that is blocking the concurrency group
	oneof waiting_on {
		WaitingOnPlan plan = 2;
		WaitingOnJob job = 3;
	}

	message WaitingOnPlan {
		// The UUID for the plan, referred to as PlanID in run service and WorkflowRunBackendID in results service
		string plan_id = 1;
	}

	message WaitingOnJob {
		// The UUID for the plan, referred to as PlanID in run service and WorkflowRunBackendID in results service
		string plan_id = 1;
		// The UUID for the job, referred to as JobUUID in run service and WorkflowJobRunBackendID in results service
		string job_id = 2;
	}
}
