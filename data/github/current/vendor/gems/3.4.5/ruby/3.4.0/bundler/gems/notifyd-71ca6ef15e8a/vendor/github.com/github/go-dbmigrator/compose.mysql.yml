version: '3.6'
services:
  db:
    platform: linux/amd64
    image: mysql:5.7
    container_name: go-dbmigrator-dev-db-container
    environment:
      MYSQL_DATABASE: go-dbmigrator-dev-db
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - data:/var/lib/mysql
    ports:
      - '127.0.0.1:5101:3306'
volumes:
  data:
    driver: local
