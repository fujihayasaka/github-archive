syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/timestamp.proto";

service ArchiveExportAPI {
  // GetArchiveExportStatus fetches the status of an archive export
  rpc GetArchiveExportStatus(GetArchiveExportStatusRequest) returns (GetArchiveExportStatusResponse);
  // GetArchiveExportURL fetches the URL of an archive export.
  rpc GetArchiveExportUrl(GetArchiveExportUrlRequest) returns (GetArchiveExportUrlResponse);
}

// Gets the status of the archive export
message GetArchiveExportStatusRequest {
  // owner_login is the name of the Organization that owns the archive. (required)
  string owner_login = 1;
  // archive_export_id is the migration archive export id. (required)
  int64 archive_export_id = 2;
}

message GetArchiveExportStatusResponse {
 // created_at is the timestamp of when the migration archive was created (required)
 google.protobuf.Timestamp created_at = 1;
 // state is the current state of the archive export (required)
 ArchiveExportState state = 2;
}

// ArchiveExportState denotes the state of the archive export, such as PENDING, FAILED, EXPORTED, etc.
enum ArchiveExportState {
  // ARCHIVE_EXPORT_STATE_INVALID is present because enums require a zero value. This should never be used.
  ARCHIVE_EXPORT_STATE_INVALID = 0;

  // ARCHIVE_EXPORT_STATE_PENDING denotes the pending state of the archive export.
  ARCHIVE_EXPORT_STATE_PENDING = 5;

  // ARCHIVE_EXPORT_STATE_FAILED denotes the failed state of the archive export.
  ARCHIVE_EXPORT_STATE_FAILED = 10;
  
  // ARCHIVE_EXPORT_STATE_EXPORTING denotes the exporting state of the archive export.
  ARCHIVE_EXPORT_STATE_EXPORTING = 15;

  // ARCHIVE_EXPORT_STATE_EXPORTED denotes the exported state of the archive export.
  ARCHIVE_EXPORT_STATE_EXPORTED = 20;
}

// Gets the URL of the archive export
message GetArchiveExportUrlRequest {
  // owner_login is the name of the Organization that owns the archive. (required)
  string owner_login = 1;
  // archive_export_id is the migration archive export id. (required)
  int64 archive_export_id = 2;

}

message GetArchiveExportUrlResponse {
  // archive_url is the migration archive export url
  string archive_url = 1;
}
