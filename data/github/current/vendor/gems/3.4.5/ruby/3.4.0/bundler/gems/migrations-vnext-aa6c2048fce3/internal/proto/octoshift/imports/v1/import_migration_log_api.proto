syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// ImportMigrationLogAPI handles migration log import operation.
service ImportMigrationLogAPI {
  // ImportMigrationLogAPI imports the migration log for a migrated repository.
  rpc ImportMigrationLog(ImportMigrationLogRequest) returns (ImportMigrationLogResponse);
}

message ImportMigrationLogRequest {
  // log_data is the migration log data. (required)
  string log_data = 1;
  // repository_id is the id of the imported repository. (deprecated)
  int64 repository_id = 2;
  // owner_login is the name of the target organization associated with the migration. (required)
  string owner_login = 3;
  // repository_name is the name of the target repository. (required)
  string repository_name = 4;
  // migration_id is the id of the migration. (required)
  string migration_id = 5;
}

message ImportMigrationLogResponse {
  // migration_log_url is the url for the migration log.
  string migration_log_url = 1;
  // migration_log_error is the error that occurs when importing the migration log.
  string migration_log_error = 2;
}
