apiVersion: v1
kind: Service
metadata:
  name: eventdlworker
  labels:
    service: eventdlworker
  annotations:
    moda.github.net/domain-name: "eventdlworker-%environment%.service.%region%.github.net"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: eventdlworker
  type: LoadBalancer