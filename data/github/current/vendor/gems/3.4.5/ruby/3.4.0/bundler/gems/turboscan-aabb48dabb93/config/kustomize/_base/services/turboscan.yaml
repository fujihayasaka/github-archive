apiVersion: v1
kind: Service
metadata:
  name: turboscan
  labels:
    service: turboscan
  annotations:
    moda.github.net/domain-name: "turboscan-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 8888
    protocol: TCP
    targetPort: http
  selector:
    role: internal-service
  type: LoadBalancer
