syntax = "proto3";

package octoshift.imports.v1;

import "google/protobuf/wrappers.proto";

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// DeployKeyAPI manages octoshift repository deploy keys to push git data.
service DeployKeyAPI {
  // CreateDeployKey creates a repository deploy key.
  rpc CreateDeployKey(CreateDeployKeyRequest) returns (CreateDeployKeyResponse);
  // DeleteDeployKey deletes a repository deploy key.
  rpc DeleteDeployKey(DeleteDeployKeyRequest) returns (DeleteDeployKeyResponse);
}

message CreateDeployKeyRequest {
  // repository_id is the ID of the repository. (required)
  int64 repository_id = 1;
  // verifier_user_id is the user ID that will be used to verify the deploy key. (required)
  int64 verifier_user_id = 2;
  // title is the deploy key title. (required)
  string title = 3;
  // key is contents of the (public) SSH key in OpenSSH format. (required)
  string key = 4;
  // is_write_enabled determines whether the deploy key has push (write) access. (required)
  google.protobuf.BoolValue is_write_enabled = 5;
}

message CreateDeployKeyResponse {
  // id is the deploy key ID. (required)
  int64 id = 1;
}

message DeleteDeployKeyRequest {
  // repository_id is the ID of the repository. (required)
  int64 repository_id = 1;
  // connector_id is the ID of the connector. (required)
  int64 deploy_key_id = 2;
}

message DeleteDeployKeyResponse {
  // empty
}
