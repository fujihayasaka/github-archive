# Copied from https://github.com/github/go-linter
name: go-linter
permissions:
  id-token: write
  contents: read
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up Go Proxy & Private Module Access
        uses: github/setup-goproxy@v1.1.0
      - name: Run Go Linter
        uses: github/go-linter@main
        env:
          GOFLAGS: -tags=integrationtest
