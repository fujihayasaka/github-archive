name: lint
permissions:
  id-token: write
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]
jobs:
  go-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up Go Proxy & Private Module Access
        uses: github/setup-goproxy@v1.1.0
      - name: Run Go Linter
        uses: github/go-linter@main
  rubocop:
    name: Lint Ruby
    runs-on: ubuntu-latest-xl
    steps:
      - uses: actions/checkout@v4
      - name: Login to registry
        run: echo "${{ secrets.CONTAINER_BUILDER_TOKEN }}" | docker login ghcr.io -u ${{github.actor}} --password-stdin
      - name: "Run Rubocop"
        run: 'make lint-ruby'
