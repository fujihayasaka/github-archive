syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/live_migration_action.proto";
import "google/protobuf/timestamp.proto";

// EditIssueCommentAPI handles issue comment edit operations.
service EditIssueCommentAPI {
  // EditIssueComment edits issue comment data during live migrations
  rpc EditIssueComment(EditIssueCommentRequest) returns (EditIssueCommentResponse);
}

message EditIssueCommentRequest {
  // id is the ID of the issue comment to edit. (required)
  int64 id = 1;
  // LiveMigrationAction is action that will be performed against the issue comment. (required)
  LiveMigrationAction action = 2;
  // updated_at indicates the date and time when the issue comment was last updated. (required)
  google.protobuf.Timestamp updated_at = 3;
  // user_login indicates the login for the user performing the action. (required)
  string user_login = 4;
  // body is the body of the issue comment.
  string body = 5;
}

message EditIssueCommentResponse {
  // id is the database ID of the issue comment. (required)
  int64 id = 1;
}
