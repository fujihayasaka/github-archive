<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zoomable-image {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        h1 {
            position: absolute;
            top: 10px;
            left: 10px;
            color: black;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>🕵️‍♂️ {{.Title}} 🕵️‍♂️</h1>
    <img src="/image?depth={{.Depth}}" alt="Graph Image" class="zoomable-image" />
</body>
</html>
