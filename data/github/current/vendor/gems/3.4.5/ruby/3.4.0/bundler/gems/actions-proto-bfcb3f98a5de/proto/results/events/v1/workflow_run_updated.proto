syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "checks/v1/annotation.proto";
import "checks/v1/status.proto";
import "checks/v1/conclusion.proto";
import "results/entities/v1/artifact.proto";
import "results/entities/v1/concurrency.proto";

package github.actions.results.events.v1;

message WorkflowRunUpdated {
  // ID from orchestration, used uniquely identify a run
  string plan_id = 1;
  // Used to verify order of messages, auto-incrementing of Run Level Events on Run Service side
  int64 change_order = 2;
  // One of https://github.com/github/actions-results/blob/de635888d2a2cc4d5c220459f9508da66366886d/proto/entities/checks/check_status.proto#L9
  checks.v1.Status status = 3;
  // CheckSuite/WorkflowRun conclusion
  checks.v1.Conclusion conclusion = 4;
  // CheckSuite/WorkflowRun start time
  google.protobuf.Timestamp started_at = 5;
  // CheckSuite/WorkflowRun completed time
  google.protobuf.Timestamp completed_at = 6;
  // Annotations to associate on the run
  repeated checks.v1.Annotation annotations = 7;
  // Artifacts to associate with the run
  repeated results.entities.v1.Artifact artifacts = 8;
  // Concurrency of the run
  results.entities.v1.Concurrency concurrency = 9;
  // A list of context IDs for the workflow orchestration context of the current run.
  repeated string orchestration_context_ids = 10;
  // If the run was intentionally delayed (i.e. concurrency group)
  bool delayed = 11;
  // If the run failed due to infrastructure failure
  bool is_infra_failure = 12;
}
