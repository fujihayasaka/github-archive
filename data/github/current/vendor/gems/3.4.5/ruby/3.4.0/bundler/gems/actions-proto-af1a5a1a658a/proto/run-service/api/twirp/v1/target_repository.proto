syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

message TargetRepository {
    // the global id of the repository
    string id = 1;

    // whether the repository is private
    bool private = 2;

    // the full name of the repository, ex: org/repo
    string nwo = 3;

    // when the repository was created at
    string created_at = 4;

    // the database id of the repository
    int64 database_id = 5;
}
