syntax = "proto3";

package github.ims.api.shared.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/github/hosted-compute-ims/gen/twirp/go/shared";
option ruby_package = "GitHub::HostedComputeIms::Api::Shared";

// In context of IMS, actor can be organization or enterprise
message Actor {
  string global_id = 1 [(buf.validate.field).required = true];
  string stamp = 2;
}
