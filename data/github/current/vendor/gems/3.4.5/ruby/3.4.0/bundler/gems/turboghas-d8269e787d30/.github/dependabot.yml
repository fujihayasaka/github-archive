version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "github/internal-actions"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - ghcr.io
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/*/"
    schedule:
      interval: "weekly"
    registries:
      - terraform.githubapp.com
registries:
  ghcr.io:
    type: docker-registry
    url: https://ghcr.io
    username: gh-containers-bot
    password: ${{ secrets.CONTAINER_BUILDER_TOKEN }}
  terraform.githubapp.com:
    type: terraform-registry
    url: https://terraform.githubapp.com
    token: ${{ secrets.TERRAFORM_REGISTRY_TOKEN }}
