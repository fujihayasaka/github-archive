name: "Build and test"

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: Check Go source files are properly formatted
        run: "! go fmt ./... | grep . || { echo 'Go not formatted'; exit 1; }"

      - name: Build program
        run: go build ./...

      - name: Run tests
        run: go test -race ./...
