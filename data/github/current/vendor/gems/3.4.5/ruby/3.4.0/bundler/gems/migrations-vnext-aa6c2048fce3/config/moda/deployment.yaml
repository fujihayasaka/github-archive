required_builds:
  - cibuild
  - migrations-vnext-moda-config-bundle / migrations-vnext-moda-config-bundle
  - migrations-vnext-docker-image / migrations-vnext-docker-image
  - migrations-vnext-docker-security / migrations-vnext-docker-security
notifications:
  slack_channels:
    - "#migrations-vnext-ops"
environments:
  - name: staging
    # Will use staging for testing, once all is good
    # we can deploy to production and set this to false
    require_pipeline: true
    cluster_selector:
      profile: general
      region: iad
    extra_start_message: |
      Check out our migrations-vnext dashboard: TODO
auto_start_pipeline: production_rollout
proxima:
  rollout_pattern:
    - kind: deployment
      start_message: We are deploying to {{stamp}} environment now with {{app}}/{{ref}}! Please pause or cancel the pipeline after the deploy if you want more time before continuing.
      config:
        timeout: 600
pipelines:
  production_rollout:
    append_proxima_stamps: true
    timeout: 600
    stages:
      - name: staging
        kind: deployment
        start_message: We are deploying to the staging environment now with {{app}}/{{ref}}! Please pause or cancel the pipeline after the deploy if you want more time before continuing.
        config:
          environment: staging
          timeout: 300
        gates:
          - kind: timer
            duration: 120
      - name: staff-wus2-01
        kind: deployment
        start_message: We are deploying to the staffship environment now with {{app}}/{{ref}}! Please pause or cancel the pipeline after the deploy if you want more time before continuing.
        config:
          environment: staff-wus2-01
          timeout: 300
        gates:
          - kind: timer
            duration: 120