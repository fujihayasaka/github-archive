syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

message Mannequin {
  // id is the mannequin ID. (required)
  int64 id = 1;
  // login is the mannequin login name. (required)
  string login = 2;
  // source_login is the mannequin's login from the source instance
  string source_login = 3;
  // claimant_login is the mannequin's claimed name for the target instance
  string claimant_login = 4;
  // profile_name is the name that (if present) is displayed for the mannequin
  string profile_name = 5;
}
