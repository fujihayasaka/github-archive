name: Moda

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
    reuse-previous-outcome: false
  merge_group:

# Only run one build per branch, and cancel in flight builds if another push is received.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  config-bundle:
    uses: github/internal-actions/.github/workflows/moda.yml@main
    name: blackbird-mw
    with:
      ci-formatted-job-name: "moda-config-bundle"
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  docker-image:
    uses: github/internal-actions/.github/workflows/kube.yml@main
    name: blackbird-mw
    with:
      ci-formatted-job-name: "docker-image"
      vault-keys: ${{ vars.VAULT_KEYS }}
      timeout: 15
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  docker-security:
    uses: github/internal-actions/.github/workflows/docker_security.yml@main
    name: blackbird-mw
    with:
      ci-formatted-job-name: "docker-security"
      vault-keys: ${{ vars.VAULT_KEYS }}
      timeout: 15
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  id-token: write
