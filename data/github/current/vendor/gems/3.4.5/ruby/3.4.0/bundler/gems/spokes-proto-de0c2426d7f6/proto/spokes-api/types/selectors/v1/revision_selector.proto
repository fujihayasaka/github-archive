syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/revision.proto";

// RevisionSelector is a selector for resolving commits from a
// list of one or more Git revisions.
message RevisionSelector {
    repeated github.spokes.types.v1.Revision revisions = 1;
}
