inherit_from: .rubocop_todo.yml

require:
  - rubocop-minitest
  - rubocop-sorbet

inherit_gem:
  rubocop-github:
  - config/default.yml # generic Ruby rules and cops

Minitest/MultipleAssertions:
  Enabled: false

Style/FileNull:
  Enabled: false

Sorbet/FalseSigil:
  Exclude:
    - "lib/notifyd/rubocop_formatter.rb"

AllCops:
  TargetRubyVersion: 3.2
  Exclude:
    - "lib/notifyd/proto/**/*.rb" # The generated protobuf files
  NewCops: enable
