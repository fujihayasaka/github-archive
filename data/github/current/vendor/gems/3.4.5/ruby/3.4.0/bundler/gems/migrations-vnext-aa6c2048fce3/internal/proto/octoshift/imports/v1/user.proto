syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

message User {
  // id is the database ID of the record. (required)
  int64 id = 1;
  // login is the username of the user. (required)
  string login = 2;
  // name is the name of the user.
  string name = 3;
}
