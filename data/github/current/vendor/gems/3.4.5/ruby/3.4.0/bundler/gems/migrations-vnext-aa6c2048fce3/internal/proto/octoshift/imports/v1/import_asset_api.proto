syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

// ImportAssetAPI handles the asset import operation.
service ImportAssetAPI {
  // CreateAssetStoragePolicy creates storage policy for an asset being imported.
  rpc CreateAssetStoragePolicy(CreateAssetStoragePolicyRequest) returns (CreateAssetStoragePolicyResponse);
  // TrackAssetAsUploaded creates storage policy for an asset being imported.
  rpc TrackAssetAsUploaded(TrackAssetAsUploadedRequest) returns (TrackAssetAsUploadedResponse);
}

message CreateAssetStoragePolicyRequest {
  // repository_id is the id of the repository. (required)
  int64 repository_id = 1;
  // name is the file name of the asset. (required)
  string name = 2;
  // size is the size of the asset. (required)
  int64 size = 3;
  // content_type is content type of the asset. (required)
  string content_type = 4;
  // actor_id is the id of the user uploading the asset. (required)
  int64 actor_id = 5;
  // asset_type is the type of asset being uploaded. (required)
  AssetType asset_type = 6;
  // release_id is the id of the release the asset belongs to (required if a release asset).
  int64 release_id = 7;
  // label is the label of the asset (optional if a release asset).
  string label = 8;
}

message CreateAssetStoragePolicyResponse {
  // upload_url is the url where the asset should be uploaded to. (required)
  string upload_url = 1;
  // headers is a list of auth headers for the asset upload request. (optional)
  repeated PolicyData headers = 2;
  // form_data is a list of key-pair value form data to use for the asset upload request. (optional)
  repeated PolicyData form_data = 3;
  // storage_policy_type is the type of storage policy being used for uploading assets to GitHub. (required)
  StoragePolicyType storage_policy_type = 4;
  // asset_url is the user-facing GitHub URL of the uploaded asset. (required)
  string asset_url = 5;
  // asset_type is the type of asset uploaded. (required)
  AssetType asset_type = 6;
  // asset_id is the ID of the asset uploadable record. (required)
  int64 asset_id = 7;
}

message TrackAssetAsUploadedRequest {
  // repository_id is the id of the repository. (required)
  int64 repository_id = 1;
  // asset_id is the id of the asset. (required)
  int64 asset_id = 2;
  // asset_type is the specific type of asset being tracked as uploaded. (required)
  AssetType asset_type = 3;
}

message TrackAssetAsUploadedResponse {
  // empty
}

message PolicyData {
  // key is the name of the policy data key. (required)
  string key = 1;
  // value is the value of the policy data key value.
  string value = 2;
}

// AssetType denotes the type of asset being uploaded. ASSET_TYPE_AUTO can be used as a default value
// to let the monolith determine the specific asset type if it is not known in Octoshift.
enum AssetType {
  // ASSET_TYPE_INVALID is present because enums require a zero value. This should never be used.
  ASSET_TYPE_INVALID = 0;

  // ASSET_TYPE_AUTO denotes that the asset type should be figured out in the monolith api handler.
  ASSET_TYPE_AUTO = 1;

  // ASSET_TYPE_USER_ASSET denotes the UserAsset asset type.
  ASSET_TYPE_USER_ASSET = 2;

  // ASSET_TYPE_REPOSITORY_FILE denotes the RepositoryFile asset type.
  ASSET_TYPE_REPOSITORY_FILE = 3;

  // ASSET_TYPE_RELEASE_ASSET denotes the ReleaseAsset asset type.
  ASSET_TYPE_RELEASE_ASSET = 4;
}

// StoragePolicyType denotes the type of storage policy being used for uploading assets to GitHub.
enum StoragePolicyType {
  // STORAGE_POLICY_TYPE_INVALID is present because enums require a zero value. This
  // should never be used.
  STORAGE_POLICY_TYPE_INVALID = 0;

  // STORAGE_POLICY_TYPE_CLUSTER denotes the Cluster storage policy type.
  STORAGE_POLICY_TYPE_CLUSTER = 1;

  // STORAGE_POLICY_TYPE_S3 denotes the S3 storage policy type.
  STORAGE_POLICY_TYPE_S3 = 2;

  // STORAGE_POLICY_TYPE_MEMORY_ALPHA denotes the MemoryAlpha storage policy type.
  STORAGE_POLICY_TYPE_MEMORY_ALPHA = 3;
}
