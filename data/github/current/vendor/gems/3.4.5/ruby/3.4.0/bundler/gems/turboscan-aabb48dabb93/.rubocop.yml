inherit_gem:
  rubocop-github:
    - config/default.yml

inherit_mode:
  merge:
    - Include
    - Exclude

require:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  DisplayCopNames: true
  DisplayStyleGuide: true
  ExtraDetails: true
  NewCops: enable
  Exclude:
    - 'ruby/lib/turboscan/proto/**/*'
    - 'vendor/**/*'

# We should decide if this adds anything for us and enable it if so.
Gemspec/DevelopmentDependencies:
  Enabled: false

# Arbitrary numbers are arbitrarily small.
RSpec/ExampleLength:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
