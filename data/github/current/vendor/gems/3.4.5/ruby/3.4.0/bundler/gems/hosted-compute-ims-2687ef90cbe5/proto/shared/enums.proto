syntax = "proto3";

package github.ims.api.shared.v1;

option go_package = "github.com/github/hosted-compute-ims/gen/twirp/go/shared";
option ruby_package = "GitHub::HostedComputeIms::Api::Shared";

enum ImageVersionState {
  Pending = 0;
  Provisioning = 1;
  Ready = 2;
  ProvisionFailed = 3;
  Deleting = 4;
  Generating = 5;
}

enum OsType {
  Linux = 0;
  Windows = 1;
  MacOS = 2;
}

enum Architecture {
  X64 = 0;
  Arm64 = 1;
}

enum ImageDefinitionState {
  ImageDefinitionReady = 0;
  ImageDefinitionDeleting = 1;
}

enum VmGeneration {
  Gen1 = 0;
  Gen2 = 1;
}

enum OsState {
  Generalized = 0;
  Specialized = 1;
}
