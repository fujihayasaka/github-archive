- op: add
  path: /spec/template/spec/containers/0/envFrom
  value: []
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: ENVIRONMENT
      value: "development"
    - name: SERVICE_NAME
      value: "hosted-compute-ims"
    - name: GITHUB_TELEMETRY_LOGS_LEVEL
      value: "info"
    - name: HMAC_AUTH_ENABLED
      value: "true"
    - name: HOSTED_COMPUTE_IMS_HMAC_VERIFY_KEYS
      value: "hmac-e2e"
    - name: VSSF_AUTH_ENABLED
      value: "true"
    - name: AQUEDUCT_URL
      value: "http://ims-aqueduct:28141"
    - name: AQUEDUCT_APP
      valueFrom:
        configMapKeyRef:
          name: ims-env-dynamic
          key: AQUEDUCT_APP
    - name: MYSQL_HOST
      value: "ims-mysql"
    - name: MYSQL_PORT
      value: "28142"
    - name: MYSQL_DATABASE_NAME
      value: "hosted_compute_ims_test_e2e"
    - name: FEATURE_FLAGS_ALLOW_FALLBACK_TO_LOCAL
      value: "true"
    - name: GITHUB_USER
      valueFrom:
        configMapKeyRef:
          name: ims-env-dynamic
          key: GITHUB_USER
    