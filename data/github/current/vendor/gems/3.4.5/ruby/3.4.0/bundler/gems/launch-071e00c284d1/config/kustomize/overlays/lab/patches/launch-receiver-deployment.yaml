# http://kubernetes.io/docs/user-guide/deployments/#what-is-a-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: launch-receiver
    annotations:
        heaven.githubapp.com/image-placeholder: "launch"
        heaven.githubapp.com/deploy-requirement: "true"
        moda.github.net/canary-v2: "true"
        moda.github.net/canary-label: "role"
spec:
    selector:
        matchLabels:
            service: launch-receiver
            role: lab
    # TODO allow dynamic configuration of replica size.
    replicas: 4
    template:
        metadata:
            # Labels are applied to all pods created by this deployment so we can
            # tell the service load balancer where to send traffic.
            # http://kubernetes.io/docs/user-guide/labels/
            labels:
                service: launch-receiver
                role: lab
        spec:
            containers:
                - name: launch-receiver
                  resources:
                    requests:
                        # Recommendations: https://app.datadoghq.com/s/59fe6c40c/nz6-i28-tpr
                        cpu: "25m"
                        memory: "100Mi"
                    limits:
                        # Adjust GOMAXPROCS in tandem. It's recommended the cpu limit be set to GOMAXPROCS+1.
                        cpu: "2"
                        memory: "200Mi"
                  envFrom:  # order matters! Subsequent entries can override earlier entries.
                    - secretRef:
                        name: vault-secrets
                    - configMapRef:
                        name: static-config
                  env:
                    - name: KUBE_POD
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                    - name: KUBE_NAMESPACE
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                    - name: REGION
                      valueFrom:
                        configMapKeyRef:
                            name: kube-cluster-metadata
                            key: region
                    # The HTTP_ADDR and INTERNAL_ADDR should be different for receiver.
                    # Only webhooks related endpoints should be exposed via HTTP_ADDR.
                    - name: HTTP_ADDR
                      value: ":6824"
                    - name: INTERNAL_ADDR
                      value: ":6825"
                    - name: DEPLOYER_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: deployer-hmac-secret
                    - name: KREDZ_HTTP_ADDR
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: kredz-http-addr
                    - name: KREDZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: kredz-hmac-secret
                    - name: VARZ_HTTP_ADDR
                      value: "https://kredz-varz-lab.service.iad.github.net"
                    - name: VARZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: varz-hmac-secret
                    - name: HAYSTACK_APP
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: haystack-app
                    # Federated secret
                    - name: FAILBOT_HAYSTACK_URL
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: failbot-haystack-url
                    # As of July 2024, RECEIVER_URL is not used to make service-to-service calls within the cluster's service mesh.
                    # For this reason, it should remain "unmeshified."
                    - name: RECEIVER_URL
                      value: "https://launch-receiver-lab.githubapp.com"
                    # RECEIVER_INTERNAL_URL is used for run-service to make requests to the receiver for requesting pre_job_info, ex: GITHUB_TOKEN
                    - name: RECEIVER_INTERNAL_URL
                      value: https://launch-receiver-internal-lab.service.iad.github.net
                    - name: ACTION_RUNNER_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: receiver-action-runner-secret
                    - name: NETWORK_CONFIGURATION_SERVICE_URL
                      value: "https://cps-network-service-staging.githubapp.com"
                    - name: CPS_NETWORK_SERVICE_HMAC_SECRETS
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: cps-network-service-hmac-secrets
                    - name: EARTHSMOKE_CUSTOM_TASKS_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: earthsmoke-custom-tasks-key
                    - name: EARTHSMOKE_DEPENDABOT_SECRETS_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: earthsmoke-dependabot-secrets-key
                    # The app id(s) for the Launch GitHub App (prod and lab)
                    # These are multiline strings because of https://github.com/kubernetes-sigs/kustomize/issues/4146
                    - name: GITHUB_ACTIONS_APP_IDS
                      value: |
                        15368
                        15470
                    - name: TRACING_ENABLED
                      value: "true"
                    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                      value: "https://opentelemetry-collector-production.service.iad.github.net/v1/traces"
                    - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: otel-exporter-otlp-traces-headers
                    - name: EMULATE_PREPARED_STATEMENTS
                      value: "true"
                    - name: USE_UTC_FOR_MYSQL
                      value: "true"
                    - name: FORCE_CHARSET_FOR_MYSQL
                      value: "true"
                    - name: LAUNCH_FRENO_URL
                      value: "http://freno.service.github.net:8111"
                    - name: LAUNCH_REDIS_URL
                      value: "db-redis-launch-rw.service.github.net:6379"
                    - name: LAUNCH_REDIS_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: launch-redis-secret
                    - name: GITHUB_TWIRP_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: github-twirp-hmac-secret
                    - name: GITHUB_TWIRP_ADDR
                      value: "https://internal-api.service.iad.github.net/internal"
                    - name: BILLING_PLATFORM_URL
                      value: "https://billing-platform-production.service.iad.github.net"
                    - name: BILLING_PLATFORM_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-lab
                            key: billing-platform-hmac-secret
                    - name: KAFKA_ROOT_CA_PATH
                      value: "/etc/ssl/certs/cp1-iad-production-1487801205-root.pem"
                    - name: KAFKA_BROKERS
                      value: "hydro-kafka-potomac-boot-1.service.iad.github.net:9093,hydro-kafka-potomac-boot-2.service.iad.github.net:9093,hydro-kafka-potomac-boot-3.service.iad.github.net:9093"
                    - name: ACTIONS_APP_REALM_WIDE_HMAC_KEY_NAME_PRIMARY
                      value: "ActionsAppLabRealmWideHmacKeyPrimary"
                    - name: ACTIONS_APP_REALM_WIDE_HMAC_KEY_NAME_SECONDARY
                      value: "ActionsAppLabRealmWideHmacKeySecondary"
                    - name: AZP_REALM_WIDE_VAULT_NAME
                      value: "dreamlifterghrt"
                    - name: TELEMETRY_ROUND_TRIPPER_ENABLE_LOGS
                      value: "true"
                    - name: JWKS_URL
                      value: "https://tokenghub.actions.githubusercontent.com/.well-known/jwks,https://tokenghppe.actionsppe.githubusercontent.com/.well-known/jwks,https://tokenz-lab.service.iad.github.net/.well-known/jwks"
                    - name: GOMAXPROCS
                      value: "1"
                    - name: LAUNCH_LOG_DEBUG
                      value: "true"
                    - name: AZURE_STORAGE_ACCOUNT_COUNT
                      value: "6"
                    - name: AZURE_STORAGE_ACCOUNT_PREFIX
                      value: "launchlabsa"
                    - name: AZURE_BLOB_STORAGE_ACCOUNT_COUNT
                      value: "6"
                    - name: AZURE_SPN_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-lab
                            name: launch-lab
                    - name: AZURE_SPN_CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-lab-client-id
                            name: launch-lab
                    - name: AZURE_SPN_TENANT_ID
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-lab-tenant-id
                            name: launch-lab
