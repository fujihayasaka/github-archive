syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "imports/v1/live_migration_action.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// EditIssueAPI handles issue edit operations.
service EditIssueAPI {
  // EditIssue edits issue data during live migrations.
  rpc EditIssue(EditIssueRequest) returns (EditIssueResponse);
}

message EditIssueRequest {
  // id is the ID of the issue to edit. (required)
  int64 id = 1;
  // LiveMigrationAction is action that will be performed against the issue. (required)
  LiveMigrationAction action = 2;
  // EditIssueTargetField is target field that will be edited on the issue. (deprecated)
  EditIssueTargetField target_field = 3;
  // updated_at indicates the date and time when the issue was last updated. (required)
  google.protobuf.Timestamp updated_at = 4;
  // user_login indicates the login for the user performing the action. This is required if the body
  // is being edited.
  string user_login = 5;
  // title is the title of the issue.
  string title = 6;
  // body is the body of the issue.
  google.protobuf.StringValue body = 7;
  // assignees is a list of assignee logins.
  repeated string assignees = 8;
  // closed_at indicates the date and time when the issue was closed.
  google.protobuf.Timestamp closed_at = 9;
  // EditIssueState is state to update the issue to.
  EditIssueState state = 10;
  // labels is a list of labels.
  repeated string labels = 11;
}

message EditIssueResponse {
  // id is the database ID of the issue. (required)
  int64 id = 1;
}
// EditIssueTargetField denotes what field should be edited in the issue, such as TITLE or BODY. (deprecated)
enum EditIssueTargetField {
  // EDIT_ISSUE_TARGET_FIELD_INVALID is present because because enums require a zero value. This
  // should never be used.
  EDIT_ISSUE_TARGET_FIELD_INVALID = 0;

  // EDIT_ISSUE_TARGET_FIELD_TITLE denotes that the title will be edited
  EDIT_ISSUE_TARGET_FIELD_TITLE = 5;

  // EDIT_ISSUE_TARGET_FIELD_BODY denotes that the body will be edited
  EDIT_ISSUE_TARGET_FIELD_BODY = 10;

  // EDIT_ISSUE_TARGET_FIELD_ASSIGNEES denotes that the assignees will be edited
  EDIT_ISSUE_TARGET_FIELD_ASSIGNEES = 15;

  // EDIT_ISSUE_TARGET_FIELD_STATE denotes that the state field will be edited
  EDIT_ISSUE_TARGET_FIELD_STATE = 20;
}

// EditIssueState denotes what state to move the issue to.
enum EditIssueState {
  // EDIT_ISSUE_STATE_INVALID is present because because enums require a zero value. This
  // should never be used.
  EDIT_ISSUE_STATE_INVALID = 0;

  // EDIT_ISSUE_STATE_OPEN denotes that the issue will be opened
  EDIT_ISSUE_STATE_OPEN = 5;

  // EDIT_ISSUE_STATE_CLOSED denotes that the issue will be closed
  EDIT_ISSUE_STATE_CLOSED = 10;
}
