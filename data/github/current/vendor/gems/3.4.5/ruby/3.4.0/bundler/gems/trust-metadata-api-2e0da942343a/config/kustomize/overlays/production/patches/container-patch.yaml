kind: Deployment
metadata:
    name: trust-metadata-api
spec:
    template:
        spec:
            containers:
                - name: trust-metadata-api
                  env:
                    - name: TMA_AZURE_BLOB_ACCOUNT
                      value: "tmaproduction"
                    - name: TMA_AZURE_BLOB_CONTAINER
                      value: "attestations"
                    - name: TMA_RELEASES_SAN
                      value: "https://dotcom.releases.github.com"
                    # the Azure tenant ID used to authenticate with Azure with a service principal
                    - name: AZURE_TENANT_ID
                      valueFrom:
                        secretKeyRef:
                          name: vault-secrets
                          key: "spn_trust_metadata_api_prod_tenant_id"
                    # the Azure client ID used to authenticate with Azure with a service principal
                    - name: AZURE_CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                          name: vault-secrets
                          key: "spn_trust_metadata_api_prod_client_id"
                    # the Azure client ID used to authenticate with Azure with a service principal
                    - name: AZURE_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: vault-secrets
                          key: "spn_trust_metadata_api_prod"
                    # https://github.com/github/github-telemetry-go/blob/main/README.md?plain=1#L66-L69
                    - name: GITHUB_TELEMETRY_ENVIRONMENT
                      value: "production"
                    - name: TMA_KAFKA_BROKERS
                      value: "hydro-kafka-potomac-boot-1.service.iad.github.net:9093,hydro-kafka-potomac-boot-2.service.iad.github.net:9093,hydro-kafka-potomac-boot-3.service.iad.github.net:9093"
                    - name: TMA_KAFKA_CLIENT_ID
                      value: "tma-production"
                    - name: TMA_KAFKA_ROOT_CA
                      value: "/etc/ssl/certs/cp1-iad-production-1487801205-root.pem"
                  envFrom:
                    - secretRef:
                        name: vault-secrets
