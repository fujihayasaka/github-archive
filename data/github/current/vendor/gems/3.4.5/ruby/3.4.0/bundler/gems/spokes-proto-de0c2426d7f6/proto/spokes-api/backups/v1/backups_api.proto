syntax = "proto3";

package github.spokes.backups.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/backups";
option ruby_package = "GitHub::Spokes::Proto::Backups::V1";

import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";

service BackupsAPI {
    rpc PerformBackup(PerformBackupRequest) returns (PerformBackupResponse);
}

message PerformBackupRequest {
    // The repository to backup.
    github.spokes.types.v1.Repository repository = 1;

    // The request context.
    github.spokes.types.v1.RequestContext request_context = 2;

    // The parent repository ID, if any.
    github.spokes.types.v1.Repository parent_repository = 3;
}

enum BackupErrorReason {
    // No reason set (invalid).
    BACKUP_ERROR_REASON_INVALID = 0;
    // No error incurred (operation successful)
    BACKUP_ERROR_REASON_NO_ERROR = 1;
    // The checksum of the repository changed during the backup.
    BACKUP_ERROR_REASON_CHECKSUM_MISMATCH = 2;
    // Another backup is already in progress.
    BACKUP_ERROR_REASON_CONCURRENT_BACKUP_RACE_DETECTED = 3;
}

message PerformBackupResponse {
    // The reason for an error that was encountered, if any.
    BackupErrorReason error_reason = 1;
    // A message describing any errors in more detail.
    string error_message = 2;
}
