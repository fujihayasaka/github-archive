syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

service LockRepositoryAPI {
  // LockRepository locks the repository for the migration, making it inaccessible from UI
  rpc LockRepository(LockRepositoryRequest) returns (LockRepositoryResponse);
  // UnlockRepository unlocks the repository for the migration, making it accessible from UI
  rpc UnlockRepository(UnlockRepositoryRequest) returns (UnlockRepositoryResponse);
}

// Locks a repository
message LockRepositoryRequest {
  // repository_id is the database ID of the record. (required)
  int64 repository_id = 1;
}

message LockRepositoryResponse {
 // empty
}

// Unlocks a repository
message UnlockRepositoryRequest {
   // repository_id is the database ID of the record. (required)
  int64 repository_id = 1;
}

message UnlockRepositoryResponse {
  // empty
}

