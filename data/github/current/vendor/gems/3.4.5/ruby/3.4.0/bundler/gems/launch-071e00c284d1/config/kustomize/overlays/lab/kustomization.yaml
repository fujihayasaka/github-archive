apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - static-config.yaml
  - resourcequota.yaml
  - ../../base/launch-chatops
  - ../../base/launch-deployer
  - ../../base/launch-receiver
  - ../../base/launch-worker

components:
# Order matters here!  components/baseline should generally come first.
- ../../base/components/baseline
- ../../base/components/lab

patches:
  - path: patches/launch-chatops-deployment.yaml
  - path: patches/launch-deployer-deployment.yaml
  - path: patches/launch-receiver-deployment.yaml
  - path: patches/launch-receiver-service.yaml
  - path: patches/launch-worker-deployment.yaml
  - path: patches/service-common.yaml
    target:
      kind: Service

patchesStrategicMerge:
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: launch
    $patch: delete