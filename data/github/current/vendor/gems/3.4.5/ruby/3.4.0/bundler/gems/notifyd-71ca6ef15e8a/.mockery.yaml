---
dir: "{{.InterfaceDir}}"
filename: "mock_{{.InterfaceName | snakecase}}.go"
mockname: "{{.InterfaceName}}Mock"
inpackage: true
packages:
  github.com/github/notifyd/internal/api/maintenanceserver:
    interfaces:
      Publisher:
  github.com/github/notifyd/internal/email/body:
    interfaces:
      Body:
  github.com/github/notifyd/internal/email/layout/views:
    interfaces:
      TemplateBuilder:
  github.com/github/notifyd/internal/email/pipeline:
    interfaces:
      PostProcessor:
  github.com/github/notifyd/internal/email:
    interfaces:
      Sender:
  github.com/github/notifyd/internal/pkg/devicetokens:
    interfaces:
      Storage:
  github.com/github/notifyd/internal/pkg/notify/auth:
    interfaces:
      AuthzdClient:
  github.com/github/notifyd/internal/notify:
    interfaces:
      Service:
  github.com/github/notifyd/internal/pkg/notify/stages:
    interfaces:
      IRouteRecipientsToChannelsStage:
        configs:
          - mockname: RouteRecipientsToChannelsStageMock
            filename: mock_route_recipients_to_channels_stage.go
      IQueueBatchedRecipientsStage:
        configs:
          - mockname: QueueBatchedRecipientsStageMock
            filename: mock_queue_batched_recipients_stage.go
  github.com/github/notifyd/internal/pkg/aqueduct:
    interfaces:
      Sender:
  github.com/github/notifyd/internal/pkg/deliverytracking:
    interfaces:
      DeliveryTracker:
  github.com/github/notifyd/internal/pkg/dotcom:
    interfaces:
      APIClient:
        configs:
          - mockname: NotifydAPIMock
  github.com/github/notifyd/internal/pkg/dotcom/policy:
    interfaces:
      Checker:
  github.com/github/notifyd/internal/pkg/featureflags:
    interfaces:
      Client:
      featuresClient:
  github.com/github/notifyd/internal/pkg/job/middlewares/retries:
    interfaces:
      Retrier:
        configs:
          - mockname: retrierMock
  github.com/github/notifyd/internal/pkg/job/tracking:
    interfaces:
      Publisher:
  github.com/github/notifyd/internal/pkg/mysql:
    interfaces:
      Throttler:
  github.com/github/notifyd/internal/pkg/o11y/exceptions:
    interfaces:
      Reporter:
  github.com/github/notifyd/internal/pkg/o11y/stats:
    interfaces:
      clientMock:
        configs:
          - mockname: ClientMock
            filename: mock_client.go
  github.com/github/notifyd/internal/pkg/routing:
    interfaces:
      Service:
      Storage:
  github.com/github/notifyd/internal/pkg/subscriptions:
    interfaces:
      Service:
      Storage:
  github.com/github/github-telemetry-go/log:
    interfaces:
      Logger:
        configs:
          - dir: internal/api/apiservice/mocks
            inpackage: false
            outpkg: mocks
          - dir: internal/pkg/job/middlewares/mocks
            inpackage: false
            outpkg: mocks
          - dir: internal/pkg/http/mocks
            inpackage: false
            outpkg: mocks
