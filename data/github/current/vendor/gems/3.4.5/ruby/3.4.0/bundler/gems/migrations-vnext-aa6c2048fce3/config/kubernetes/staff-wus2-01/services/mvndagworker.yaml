apiVersion: v1
kind: Service
metadata:
  name: mvndagworker
  labels:
    service: mvndagworker
  annotations:
    moda.github.net/domain-name: "mvndagworker-%environment%.service.%region%.github.net"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: mvndagworker
  type: LoadBalancer