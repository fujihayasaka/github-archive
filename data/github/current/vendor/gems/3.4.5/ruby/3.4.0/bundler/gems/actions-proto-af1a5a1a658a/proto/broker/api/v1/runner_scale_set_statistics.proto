syntax = "proto3";

package github.actions.broker.api.v1;

message BrokerRunnerScaleSetStatistics {
    int32 total_available_jobs = 1;
    int32 total_acquired_jobs = 2;
    int32 total_assigned_jobs = 3;
    int32 total_running_jobs = 4;
    int32 total_busy_runners = 5;
    int32 total_idle_runners = 6;
}