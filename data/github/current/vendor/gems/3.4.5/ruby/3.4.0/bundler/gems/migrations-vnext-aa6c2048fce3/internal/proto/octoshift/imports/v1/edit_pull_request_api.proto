syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// EditPullRequestAPI handles pull request edit operations.
service EditPullRequestAPI {
  // EditPullRequest edits pull request data during live migrations
  rpc EditPullRequest(EditPullRequestRequest) returns (EditPullRequestResponse);
}

message EditPullRequestRequest {
  // id is the ID of the pull request to edit. (required)
  int64 id = 1;
  // EditPullRequestTargetField is target field that will be edited on the pull request. (deprecated)
  EditPullRequestTargetField target_field = 2;
  // updated_at indicates the date and time when the pull request was last updated. (required)
  google.protobuf.Timestamp updated_at = 3;
  // user_login indicates the login for the user performing the action. This is required if the body
  // is being edited.
  string user_login = 4;
  // title is the title of the pull request.
  string title = 5;
  // body is the body of the pull request.
  google.protobuf.StringValue body = 6;
  // assignees is a list of assignee logins.
  repeated string assignees = 7;
  // EditPullRequestState is state to update the pull request to.
  EditPullRequestState state = 8;
  // closed_at indicates the date and time when the pull request was closed.
  google.protobuf.Timestamp closed_at = 9;
  // labels is a list of labels.
  repeated string labels = 10;
  // EditPullRequestReviewableState is reviewable state to update the pull request to.
  EditPullRequestReviewableState reviewable_state = 11;
  // base_ref is the base branch of the pull request.
  string base_ref = 12;
  // merge_commit_sha is the sha of the pull request's merge commit.
  google.protobuf.StringValue merge_commit_sha = 13;
  // merged_at indicates the date and time when the pull request was merged.
  google.protobuf.Timestamp merged_at = 14;
}

message EditPullRequestResponse {
  // id is the database ID of the pull request. (required)
  int64 id = 1;
}

// EditPullRequestTargetField denotes what field should be edited in the pull request, such as TITLE or BODY. (deprecated)
enum EditPullRequestTargetField {
  // EDIT_PULL_REQUEST_TARGET_FIELD_INVALID is present because because enums require a zero value. This
  // should never be used.
  EDIT_PULL_REQUEST_TARGET_FIELD_INVALID = 0;

  // EDIT_PULL_REQUEST_TARGET_FIELD_TITLE denotes that the title will be edited
  EDIT_PULL_REQUEST_TARGET_FIELD_TITLE = 5;

  // EDIT_PULL_REQUEST_TARGET_FIELD_BODY denotes that the body will be edited
  EDIT_PULL_REQUEST_TARGET_FIELD_BODY = 10;

  // EDIT_PULL_REQUEST_TARGET_FIELD_ASSIGNEES denotes that the assignees will be edited
  EDIT_PULL_REQUEST_TARGET_FIELD_ASSIGNEES = 15;

  // EDIT_PULL_REQUEST_TARGET_FIELD_STATE denotes that the state field will be edited
  EDIT_PULL_REQUEST_TARGET_FIELD_STATE = 20;
}

// EditPullRequestState denotes what state to move the pull request to.
enum EditPullRequestState {
  // EDIT_PULL_REQUEST_STATE_INVALID is present because because enums require a zero value. This
  // should never be used.
  EDIT_PULL_REQUEST_STATE_INVALID = 0;

  // EDIT_PULL_REQUEST_STATE_OPEN denotes that the pull request will be opened
  EDIT_PULL_REQUEST_STATE_OPEN = 5;

  // EDIT_PULL_REQUEST_STATE_CLOSED denotes that the pull request will be closed
  EDIT_PULL_REQUEST_STATE_CLOSED = 10;

  // EDIT_PULL_REQUEST_STATE_MERGED denotes that the pull request will be merged
  EDIT_PULL_REQUEST_STATE_MERGED = 15;
}

// EditPullRequestReviewableState denotes whether to mark the pull request as draft or ready-for-review.
enum EditPullRequestReviewableState {
  // EDIT_PULL_REQUEST_REVIEWABLE_STATE_INVALID is present because because enums require a zero value. This
  // should never be used.
  EDIT_PULL_REQUEST_REVIEWABLE_STATE_INVALID = 0;

  // EDIT_PULL_REQUEST_REVIEWABLE_STATE_DRAFT denotes that the pull request will be marked as draft
  EDIT_PULL_REQUEST_REVIEWABLE_STATE_DRAFT = 5;

  // EDIT_PULL_REQUEST_REVIEWABLE_STATE_READY_FOR_REVIEW denotes that the pull request will be marked as ready-for-review
  EDIT_PULL_REQUEST_REVIEWABLE_STATE_READY_FOR_REVIEW = 10;
}
