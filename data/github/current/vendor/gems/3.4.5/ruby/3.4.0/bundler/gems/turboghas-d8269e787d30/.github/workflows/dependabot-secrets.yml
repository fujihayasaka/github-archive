name: Update Dependabot Secrets
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  update-secrets:
    runs-on: ubuntu-22.04
    steps:
      - name: Update Secrets
        env:
          GITHUB_TOKEN: ${{ secrets.DSP_CODE_SCANNING_TOKEN }}
        run: |
          set_secret() {
            gh secret set --repo "$GITHUB_REPOSITORY" --app dependabot "$1" --body "$2"
          }
          set_secret "CONTAINER_BUILDER_TOKEN" "${{ secrets.CONTAINER_BUILDER_TOKEN }}"
          set_secret "OCTOFACTORY_USER" "${{ secrets.OCTOFACTORY_USER }}"
          set_secret "OCTOFACTORY_TOKEN" "${{ secrets.OCTOFACTORY_TOKEN }}"
