syntax = "proto3";

package octoshift.imports.v1;

option go_package = "github.com/github/migrations-vnext/internal/pkg/octoshift/imports/v1";
option ruby_package = "MonolithTwirp::Octoshift::Imports::V1";
import "google/protobuf/wrappers.proto";

// ImportTeamAPI handles the operations for importing teams.
service ImportTeamAPI {
  // ImportTeam imports a new team to the target organization.
  rpc ImportTeam(ImportTeamRequest) returns (ImportTeamResponse);
}

message ImportTeamRequest {
  // target_org_id is the database id for the target org. (required)
  int64 target_org_id = 1;
  // team_name is the name of the team to be created. (required)
  string team_name = 2;
  // team_name is the description of the team to be created.
  google.protobuf.StringValue team_description = 3;
  // parent_team_id is the id of the parent team of the team to be created.
  google.protobuf.Int64Value parent_team_id = 5;
  // state is the state of the release. (required)
  string visibility = 6;
} 

message ImportTeamResponse {
  // id is the team ID. (required)
  int64 id = 1;
}
