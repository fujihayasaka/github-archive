syntax = "proto3";

// Defines the application top level name used as the REST API prefix
package github.ims.api.images.v1;

import "buf/validate/validate.proto";
import "shared/actor.proto";
import "shared/enums.proto";

option go_package = "github.com/github/hosted-compute-ims/gen/twirp/go/services/images_api";
option ruby_package = "GitHub::HostedComputeIms::ImagesApi";

service ImageManagementService {
  // CREATE
  rpc CreateCustomerImageDefinition(CreateCustomerImageDefinitionRequest) returns (CreateCustomerImageDefinitionResponse) {}
  rpc CreateCustomerImageVersion(CreateCustomerImageVersionRequest) returns (CreateCustomerImageVersionResponse) {}

  // READ
  rpc ListCuratedImageDefinitions(ListCuratedImageDefinitionsRequest) returns (ListCuratedImageDefinitionsResponse) {}
  rpc GetCuratedImageDefinition(GetCuratedImageDefinitionRequest) returns (GetCuratedImageDefinitionResponse) {}
  rpc ListCuratedImageVersions(ListCuratedImageVersionsRequest) returns (ListCuratedImageVersionsResponse) {}
  rpc GetCuratedImageVersion(GetCuratedImageVersionRequest) returns (GetCuratedImageVersionResponse) {}
  rpc ListCustomerImageDefinitions(ListCustomerImageDefinitionsRequest) returns (ListCustomerImageDefinitionsResponse) {}
  rpc GetCustomerImageDefinition(GetCustomerImageDefinitionRequest) returns (GetCustomerImageDefinitionResponse) {}
  rpc ListCustomerImageVersions(ListCustomerImageVersionsRequest) returns (ListCustomerImageVersionsResponse) {}
  rpc GetCustomerImageVersion(GetCustomerImageVersionRequest) returns (GetCustomerImageVersionResponse) {}

  // UPDATE
  rpc UpdateCustomerImageDefinition(UpdateCustomerImageDefinitionRequest) returns (UpdateCustomerImageDefinitionResponse) {}

  // DELETE
  rpc DeleteCustomerImageDefinition(DeleteCustomerImageDefinitionRequest) returns (DeleteCustomerImageDefinitionResponse) {}
  rpc DeleteCustomerImageVersion(DeleteCustomerImageVersionRequest) returns (DeleteCustomerImageVersionResponse) {}
}

message ImageDefinition {
  uint64 id = 1;
  string name = 2;
  shared.v1.OsType os_type = 3;
  shared.v1.Architecture architecture = 4;
  string latest_version = 5;
  bool enabled = 6;
  int32 size_gb = 7;
  int32 latest_version_size_gb = 8;
  int32 image_versions_count = 9;
  int32 total_image_versions_size_gb = 10;
}

message ImageVersion {
  uint64 image_definition_id = 1;
  string version = 2;
  shared.v1.ImageVersionState state = 3;
  string state_details = 4;
  int32 size_gb = 5;
}

message GetCuratedImageDefinitionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
}

message GetCuratedImageDefinitionResponse {
  ImageDefinition image_definition = 1;
}

message GetCustomerImageDefinitionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
}

message GetCustomerImageDefinitionResponse {
  ImageDefinition image_definition = 1;
}

message GetCuratedImageVersionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
  string version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d+\\.\\d+\\.\\d+$"
  ];
}

message GetCuratedImageVersionResponse {
  ImageVersion image_version = 1;
}

message GetCustomerImageVersionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
  string version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d+\\.\\d+\\.\\d+$"
  ];
}

message GetCustomerImageVersionResponse {
  ImageVersion image_version = 1;
}

message ListCuratedImageDefinitionsRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  bool include_disabled = 2;
}

message ListCuratedImageDefinitionsResponse {
  repeated ImageDefinition image_definitions = 1;
}

message ListCustomerImageDefinitionsRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
}

message ListCustomerImageDefinitionsResponse {
  repeated ImageDefinition image_definitions = 1;
}

message ListCuratedImageVersionsRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
}

message ListCuratedImageVersionsResponse {
  repeated ImageVersion image_versions = 1;
}

message ListCustomerImageVersionsRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
}

message ListCustomerImageVersionsResponse {
  repeated ImageVersion image_versions = 1;
}

message CreateCustomerImageDefinitionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9._-]{1,100}$"
  ];
  shared.v1.OsType os_type = 3 [(buf.validate.field).enum.defined_only = true];
  shared.v1.Architecture architecture = 4 [(buf.validate.field).enum.defined_only = true];
}

message CreateCustomerImageDefinitionResponse {
  ImageDefinition image_definition = 1;
}

message CreateCustomerImageVersionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
  string version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d+\\.\\d+\\.\\d+$"
  ];
  string source_vhd_url = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uri = true
  ];
}

message CreateCustomerImageVersionResponse {
  ImageVersion image_version = 1;
}

message UpdateCustomerImageDefinitionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9._-]{1,100}$"
  ];
}

message UpdateCustomerImageDefinitionResponse {
  ImageDefinition image_definition = 1;
}

message DeleteCustomerImageDefinitionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
}

message DeleteCustomerImageDefinitionResponse {}

message DeleteCustomerImageVersionRequest {
  shared.v1.Actor owner = 1 [(buf.validate.field).required = true];
  uint64 image_definition_id = 2 [(buf.validate.field).required = true];
  string version = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^\\d+\\.\\d+\\.\\d+$"
  ];
}

message DeleteCustomerImageVersionResponse {
  ImageVersion image_version = 1;
}
