# Advisory-db is the service that gets webhooks from the advisory-review repo
apiVersion: v1
kind: Service
metadata:
  annotations:
    moda.github.net/domain-name: "advisory-inbox-%environment%.service.%site%.github.net"

  name: advisory-inbox-staging
  labels:
    service: advisory-inbox-staging
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: advisory-db
    role: advisory-db-staging
  type: LoadBalancer
