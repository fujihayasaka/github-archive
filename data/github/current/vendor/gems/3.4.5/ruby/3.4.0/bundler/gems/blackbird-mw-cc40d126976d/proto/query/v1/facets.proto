syntax = "proto3";

package blackbirdmw.query.v1;

option go_package = "query/v1";
option ruby_package = "Blackbird::Query::V1";

enum FacetKind {
   FACET_KIND_INVALID = 0;
   FACET_KIND_REPO = 1;
   FACET_KIND_LANGUAGE = 2;
   FACET_KIND_PATH = 3;
}

message FacetEntry {
   string name = 1;
   // If set, the owner name to use for avatar rendering
   string owner = 2;
   // If set, the color to use for language facets
   string language_color = 3;
   // The query atom to append for this facet
   string query = 4;
}

message Facet {
   FacetKind kind = 1;
   repeated FacetEntry entries = 2;
}
