syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// Repository is the identifier of a Git repository.
message Repository {
  enum Type {
    // TYPE_INVALID is present because enums require a zero value. This should never be used.
    TYPE_INVALID = 0;
    // TYPE_REPOSITORY is used if the repository is a normal Git repository.
    TYPE_REPOSITORY = 1;
    // TYPE_WIKI is used if the repository is a wiki Git repository.
    TYPE_WIKI = 2;
    // TYPE_GIST is used if the repository is a Gist.
    TYPE_GIST = 3;
  }

  // type is the type identifier of the repository. (required)
  Type type = 1;
  // is is the numerical identifier of the repository. (required)
  uint64 id = 2;
}
