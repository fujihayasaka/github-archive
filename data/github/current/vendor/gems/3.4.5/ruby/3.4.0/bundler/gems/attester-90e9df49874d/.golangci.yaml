version: "2"
run:
  go: "1.22"
linters:
  enable:
    - errorlint
    - goconst
    - gocritic
    - gosec
    - misspell
    - revive
    - tagliatelle
    - whitespace
  disable:
    - tagalign
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
        text: 'G404:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
