apiVersion: v1
kind: Service
metadata:
  name: attester
  labels:
    service: attester
  annotations:
    moda.github.net/domain-name: "attester-%environment%.service.%region%.github.net"
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: attester
  type: LoadBalancer
