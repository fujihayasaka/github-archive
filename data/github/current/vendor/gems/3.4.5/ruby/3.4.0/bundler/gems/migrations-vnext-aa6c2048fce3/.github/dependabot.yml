version: 2

registries:
  github:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.GOPROXY_TOKEN}}
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{secrets.CONTAINER_BUILDER_TOKEN}}

updates:
  - package-ecosystem: "docker"
    registries:
      - "ghcr"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      baseImages:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    registries:
      - github
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
