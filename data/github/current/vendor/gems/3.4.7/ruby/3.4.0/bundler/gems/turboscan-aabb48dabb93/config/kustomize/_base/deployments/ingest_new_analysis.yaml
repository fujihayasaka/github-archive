apiVersion: apps/v1
kind: Deployment
metadata:
    name: ingest-new-analysis
    annotations:
        heaven.githubapp.com/image-placeholder: "turboscan"
spec:
    # We deploy to multiple clusters, each cluster would have 2 workers
    replicas: 2
    selector:
        matchLabels:
            app: turboscan
            role: ingest-new-analysis
    template:
        metadata:
            labels:
                app: turboscan
                role: ingest-new-analysis
            annotations:
                observability.github.com/logger: fluent-bit
                fluentbit.io/parser: logfmt
                observability.github.com/splunk_index: turboscan
        spec:
            dnsPolicy: ClusterFirst
            containers:
                - name: turboscan
                  image: turboscan
                  command:
                      ["/app/bin/turboscan", "service", "start", "hydrosvc"]
                  env:
                      - name: STATS_ADDR
                        value: "$(KUBE_NODE_HOSTNAME):28125"
                      - name: KAFKA_GROUP
                        value: "turboscan-consumer-prod"
                      - name: GOMAXPROCS
                        valueFrom:
                            resourceFieldRef:
                                containerName: turboscan
                                resource: limits.cpu
                  envFrom:
                      - configMapRef:
                          name: environment
                      - configMapRef:
                          name: background-environment
                      - secretRef:
                          name: vault-secrets
                      - configMapRef:
                          name: kube-cluster-metadata
                  readinessProbe:
                      exec:
                          command: ["true"]
                      initialDelaySeconds: 10
                  resources:
                      requests:
                          memory: 2Gi
                          cpu: 2000m
                      limits:
                          memory: 4Gi
                          cpu: 4000m
