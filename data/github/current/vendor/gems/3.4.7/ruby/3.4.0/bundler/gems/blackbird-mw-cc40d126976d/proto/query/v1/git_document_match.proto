syntax = "proto3";

package blackbirdmw.query.v1;

import "query/v1/scoring_info.proto";

option go_package = "query/v1";
option ruby_package = "Blackbird::Query::V1";

message GitDocumentMatch {
  // term matches in this document
  repeated Range term_matches = 1;
  // location of this document in repos and paths
  repeated Location locations = 2;
  // full content of the blob
  bytes content = 3;
  // SHA1 git blob oid
  bytes blob_sha = 4;
  // linguist language_id of the document
  uint32 language_id = 5;
  // may be different that count of locations depending on
  // document_location_limit
  uint32 total_locations = 6;
  ScoringInfo scoring_info = 7;
  // the position of the match after retrieval from the index.  This position
  // includes all the false-positives which are later removed and is
  // generated while they are in doc_id order.
  uint32 retrieval_position = 8;
  // Blackbird document ID: in lexical and hybrid epochs, the same as blob_sha.
  // In embeddings epochs, this is a hash of the blob OID and path.
  bytes doc_sha = 9;
}

// Range represents a start and end byte offset in a document
message Range {
  // byte offset of start of match
  uint32 start = 1;
  // byte offset of end of match
  uint32 end = 2;
}

// Location of a document in a repo
message Location {
  // file path (repo relative)
  string path = 1;
  // id of repository
  uint32 repo_id = 2;
  // id of the user or org that owns this repository
  uint32 owner_id = 3;
  // SHA1 of the ref
  bytes commit_sha = 4;
  // qualified name of the ref
  string ref_name = 5;
  // score for this repo
  int32 repo_score = 7;
  // True if the repo associated with this location is public.
  bool is_repo_public = 8;
  // Total score of this location
  float score = 9;
  // The repository name with owner.
  string repo_nwo = 10;
  // Network id of the repoistory
  uint32 network_id = 11;

  reserved "index_score";
  reserved 6;
}
