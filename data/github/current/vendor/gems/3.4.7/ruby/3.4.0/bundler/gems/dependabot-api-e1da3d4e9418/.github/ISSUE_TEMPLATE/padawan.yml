name: Padawan Task
description: Assign a task to Padawan
title: "[🤖 Padawan]: "
labels: ["ai"]
assignees:
  - Copilot
body:
  - type: markdown
    attributes:
      value: |
        ## 🗣️ Description
  - type: textarea
    id: context
    attributes:
      label: description
      description: Provide the description of the task
      placeholder: Describe what you want Copilot to do. Please be specific.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### ✅ Acceptance Criteria
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define the acceptance criteria for the issue.
      placeholder: Describe the acceptance criteria...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 🔗 Useful Context
  - type: textarea
    id: useful-context
    attributes:
      label: Useful Context
      description: Provide any additional context or information that might be useful.
      placeholder: Provide any additional context...
    validations:
      required: false
