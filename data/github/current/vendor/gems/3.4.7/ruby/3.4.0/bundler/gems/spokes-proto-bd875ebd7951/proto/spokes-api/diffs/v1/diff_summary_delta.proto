syntax = "proto3";

package github.spokes.diffs.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/diffs";
option ruby_package = "GitHub::Spokes::Proto::Diffs::V1";

import "spokes-api/diffs/v1/diff_delta.proto";
import "spokes-api/diffs/v1/diff_summary_binary_changes.proto";
import "spokes-api/diffs/v1/diff_summary_text_changes.proto";

// DiffSummaryDelta is the information about each of the deltas in a diff
// summary, including before and after state and number of additions and
// deletions.
message DiffSummaryDelta {
    DiffDelta delta = 1;

    oneof changes {
      DiffSummaryBinaryChanges binary_changes = 2;

      DiffSummaryTextChanges text_changes = 3;
    }
}
