# For integration tests, build blackbird in Docker instead of downloading an image from ghcr.
# Used by `script/setup` when `$BLACKBIRD_SRCDIR` is set.
services:
  blackbird-1:
    pull_policy: build
    build:
      context: ${BLACKBIRD_SRCDIR}
      dockerfile: Dockerfile.dev
    # If a service has both `image` and `build` keys, docker compose builds it
    # and tags it locally with the given name.
    image: blackbird-dev-build

  blackbird-2:
    pull_policy: never
    depends_on:
      - blackbird-1
    image: blackbird-dev-build

  blackbird-cache-1:
    pull_policy: never
    depends_on:
      - blackbird-1
    image: blackbird-dev-build

  blackbird-mw-semantic:
    pull_policy: never
    depends_on:
      - blackbird-1
    image: blackbird-dev-build

  blackbird-mw-admin:
    pull_policy: build
    build:
      context: ${BLACKBIRD_MW_SRCDIR}
      dockerfile: Dockerfile
      args:
        BLACKBIRD_CLIB_IMAGE: blackbird-dev-build
        FRONTEND_MODE: without-frontend
    depends_on:
      - blackbird-1
    image: blackbird-mw-dev-build

  blackbird-mw-ingest:
    pull_policy: never
    depends_on:
      - blackbird-mw-admin
    image: blackbird-mw-dev-build

  blackbird-mw-query:
    pull_policy: never
    depends_on:
      - blackbird-mw-admin
    image: blackbird-mw-dev-build
