syntax = "proto3";

package github.spokes.blobs.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/blobs";
option ruby_package = "GitHub::Spokes::Proto::Blobs::V1";

import "spokes-api/types/v1/mode.proto";
import "spokes-api/types/v1/diff_status.proto";
import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/path.proto";

// ReachableBlobItem includes the oid, commit and path of a given blob.
message ReachableBlobItem {
    // blob_oid is the object id of the blob.
    github.spokes.types.v1.ObjectID blob_oid = 1;

    // commit_oid is a commit that the blob was featured in.
    github.spokes.types.v1.ObjectID commit_oid = 2;

    // field used to be string path.
    reserved 3;

    // path is the first tree path the blob was associated with in the commit.
    github.spokes.types.v1.Path path = 4;

    // mode is the file mode of the blob.
    github.spokes.types.v1.Mode mode = 5;

    // status is the status of the blob.
    github.spokes.types.v1.DiffStatus status = 6;
}
