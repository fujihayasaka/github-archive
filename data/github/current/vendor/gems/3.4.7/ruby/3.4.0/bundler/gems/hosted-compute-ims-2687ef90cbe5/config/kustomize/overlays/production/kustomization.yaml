apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- "../../base/hosted-compute-ims-api"
- "../../base/hosted-compute-ims-worker"
- "../../base/cronjobs"
- "../../base/servicemeshconfigs"
- "./services/api_canary.yaml"

replicas:
- name: hosted-compute-ims-worker
  count: 3
- name: hosted-compute-ims-api
  count: 2

patches:
- path: patches/deployment-shared.yaml
  target:
    kind: Deployment
- path: patches/cluster-preferences.yaml
  target:
    kind: CronJob
- path: patches/service-api.yaml
  target:
    kind: Service
    name: hosted-compute-ims