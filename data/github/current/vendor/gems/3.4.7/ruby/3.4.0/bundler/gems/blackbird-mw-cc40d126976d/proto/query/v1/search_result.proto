syntax = "proto3";

package blackbirdmw.query.v1;

import "query/v1/symbol.proto";
import "query/v1/git_document_match.proto";
import "query/v1/scoring_info.proto";

option go_package = "query/v1";
option ruby_package = "Blackbird::Query::V1";

enum SnippetFormat {
  SNIPPET_FORMAT_INVALID = 0;
  SNIPPET_FORMAT_PLAIN_TEXT = 1;
  SNIPPET_FORMAT_HTML = 2;
}

message RenderedSnippet {
  repeated string lines = 1;
  uint32 starting_line_number = 2;
  uint32 ending_line_number = 3;
  uint32 jump_to_line_number = 4;
  SnippetFormat format = 5;

  // The number of matches within the snippet itself
  uint32 match_count = 6;

  // A number representing how relevant the snippet is
  float score = 7;

  // The start and end byte offsets of the snippet in the file content
  uint32 start = 8;
  uint32 end = 9;
}

message DebugInfo {
  // the position of the match after retrieval from the index.  This position
  // includes all the false-positives which are later removed and is
  // generated while they are in doc_id order.
  uint32 retrieval_position = 1;
  float score = 2;
  repeated ScoringContribution factors = 3;
}

message DuplicateLocationInfo {
  string path = 1;
  uint32 repo_id = 2;
  string repo_nwo = 3;
  uint32 owner_id = 4;
  string commit_sha = 5;
  string ref_name = 6;
}

message SearchResult {
  // Result filename
  string path = 1;
  // Repo and owner information
  uint32 repo_id = 2;
  string repo_nwo = 3;
  uint32 owner_id = 4;
  // Git information
  // The hex-encoded SHA of the last crawled commit for this ref name
  // (NOTE: not the commit when this file was last crawled, as in legacy
  // search!)
  string commit_sha = 5;
  // The ref name for the branch this code was found on.
  string ref_name = 6;
  // The hex-encoded SHA of the blob for this search result
  string blob_sha = 7;
  // Language information
  string language_name = 8;
  uint32 language_id = 9;
  bool has_language_id = 10;
  string language_color = 11;
  // Term matches in this document
  uint32 match_count = 12;
  // Symbol matches in the document
  repeated Symbol matched_symbols = 13;
  repeated RenderedSnippet snippets = 14;
  DebugInfo debug_info = 15;
  // The line number to link to, if creating a link to the code.
  // One-indexed. If zero, there is no specific line to link to.
  uint32 line_number = 16;
  repeated Range term_matches = 17;

  // Any duplicated locations
  repeated DuplicateLocationInfo duplicate_locations = 18;

  // Size of the file, in bytes
  uint32 file_size = 19;

  // Symbols whose extent contains a match
  repeated Symbol enclosing_symbols = 20;
}
