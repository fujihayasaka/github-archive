data:
  ENVIRONMENT: '%stamp%'
  FEATURE_FLAGS_SUPPORTED_STAMPS: '%stamp%'
  HTTP_PROXY: network-proxy.service.github.net:3128
  HTTPS_PROXY: network-proxy.service.github.net:3128
  NO_PROXY: '*.github.net,*.cluster.local'
  AQUEDUCT_API_KEY_VERSION: "0"
  AQUEDUCT_APP: hosted-compute-ims
  AQUEDUCT_URL: https://aqueduct.service.%stamp%.github.net
  INTERNAL_URL: https://hosted-compute-ims-%stamp%.githubapp.com
  VEXI_HYDRO_BROKERS: hydro-kafka-%stamp%-%stamp%.service.%stamp%-az1.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az2.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az3.consul:9093
  VEXI_HYDRO_INIT_TIMEOUT_SEC: "15"
  # Note while the cert said cp1-iad it's used in proxima too. See: https://github.com/github/turboscan/blob/6797a36c860a6c120674b22feeab7f109657056b/config/kubernetes/staff-wus2-01/configmaps/environment.yaml#L34
  VEXI_HYDRO_ROOT_CA: /etc/ssl/certs/cp1-iad-production-1487801205-root.pem

