name: "go-linter"

env:
  HUSKY: 0

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.COPILOT_AGENT_RUNTIME_PAT }}
          submodules: "recursive"
      - name: Set Up Go Proxy & Private Module Access
        uses: github/setup-goproxy@v1.0.1
        with:
          go-version-file: ./go.mod
          goproxy-token: ${{secrets.GOPROXY_TOKEN}}
      - name: Run Go Linter
        run: script/lint
        env:
          # Configuration parameters for script/lint
          LINT_VERSION: v2.5.0
          LINT_ARGS: internal/agentcallback/... internal/agentcleanup/... internal/api/... internal/aqueduct/... internal/auth/... internal/authnd/... internal/cache/... internal/capi/... internal/config/... internal/experiments/... internal/featureflags/... internal/firewall/... internal/goerrors/... internal/mcp/... internal/customagent/... internal/spokes/... internal/tips/... internal/redis/... internal/agenticapp/...
          GOERRORSLINT_PKGS: internal/spokes/...