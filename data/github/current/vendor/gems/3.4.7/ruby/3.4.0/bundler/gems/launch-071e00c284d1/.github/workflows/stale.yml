name: Mark stale pull requests

on:
  schedule:
  - cron: "30 1 * * *"

jobs:
  stale:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/stale@v8
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-pr-message: 'This PR has been open without changes in the last 7 days'
        stale-pr-label: 'stale'
        exempt-pr-labels: 'blocked,keep'
        days-before-stale: 7
