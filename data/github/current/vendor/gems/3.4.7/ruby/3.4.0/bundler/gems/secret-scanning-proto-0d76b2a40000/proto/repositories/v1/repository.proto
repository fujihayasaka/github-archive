syntax = "proto3";

package github.secretscanning.repositories.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/repositories";
option ruby_package = "GitHub::Proto::SecretScanning::Repositories::V1";

import "google/protobuf/timestamp.proto";

message Repository {
  // The repository database id.
  uint32 id = 1;

  // The repository global relay id.
  string global_relay_id = 2;

  // The repository name.
  string name = 3;

  // The repository visibility.
  enum Visibility {
    VISIBILITY_UNKNOWN = 0;
    PUBLIC = 1;
    PRIVATE = 2;
    INTERNAL = 3;
  }
  Visibility visibility = 4;

  // The parent repository id if this is a fork.
  uint32 parent_id = 5;

  // The timestamp the repository was last pushed at.
  google.protobuf.Timestamp pushed_at = 6;

  // The repository created at timestamp.
  google.protobuf.Timestamp created_at = 7;

  // The repository updated at timestamp.
  google.protobuf.Timestamp updated_at = 8;

  // The repository's current default branch name, e.g. 'master'
  // Deprecated: use default_branch_bytes instead.
  string default_branch = 9;

  // The owner of this repository.
  User owner = 10;

  // The network_id of this repository.
  uint32 network_id = 11;

  // set of scanning related flags associated with this repository.
  repeated string feature_flags = 12;

  // repo state concerning secret scanning operations.
  Capabilities capabilities = 13;

  // whether or not the repo has been deleted.
  bool is_deleted = 14;

  // whether or not the repo has been archived.
  bool is_archived = 15;

  // The repository's current default branch name, e.g. 'master'
  bytes default_branch_bytes = 16;
}

message User {
  // The id of the user.
  uint32 id = 1;

  // The login of the user.
  string login = 2;

  enum Type {
    UNKNOWN = 0;
    USER = 1;
    ORGANIZATION = 2;
    BOT = 3;
  }
  // The type of the user account.
  Type type = 3;

  // The user global relay id for the GitHub Platform.
  string global_relay_id = 4;

  // business that the user is associated with (only relevant for orgs)
  Business business = 5;
}

message Business {
  // The id of the business.
  uint32 id = 1;

  // The name of the business.
  string name = 2;

  // The slug for the business.
  string slug = 3;
}

message Capabilities {
  bool scannable = 1;
  bool ghas_secret_scanning = 2;
  bool results_visible = 3;
  bool validity_checks = 4;
  bool lower_confidence_patterns = 5;
  bool generic_secrets = 6;
  bool wiki_scanning = 7;
}


