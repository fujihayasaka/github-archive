syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

import "google/protobuf/timestamp.proto";
import "types/v1/owners.proto";

enum JobGroupStatus {
    // ScanStatusUnknown
    JOB_GROUP_UNKNOWN = 0; 
    // ScanStatusPending
    JOB_GROUP_PENDING = 1; 
    // ScanStatusQueued, ScanStatusStarted, ScanStatusFailed, ScanStatusPaused
    JOB_GROUP_RUNNING = 2; 
    // ScanStatusCompleted
    JOB_GROUP_COMPLETED = 3; 
    // ScanStatusCancelled, ScanStatusTerminal, ScanStatusParentJobGroupCancelled
    JOB_GROUP_SKIPPED_OR_FAILED = 4; 
}

enum JobGroupType {
  JOB_GROUP_TYPE_UNKNOWN = 0;
  JOB_GROUP_TYPE_DRY_RUN = 1;
  JOB_GROUP_TYPE_BACKFILL = 2;
  JOB_GROUP_TYPE_CONTENT_BACKFILL = 3;
  JOB_GROUP_TYPE_GENERIC_SECRETS_BACKFILL = 4;
  JOB_GROUP_TYPE_PULL_REQUEST_BACKFILL = 5;
  JOB_GROUP_TYPE_DISCUSSION_BACKFILL = 6;
  JOB_GROUP_TYPE_WIKI_BACKFILL = 7;
  JOB_GROUP_TYPE_ASSESSMENT_GIT_BACKFILL = 8;
  JOB_GROUP_TYPE_ASSESSMENT_ISSUE_BACKFILL = 9;
  JOB_GROUP_TYPE_ASSESSMENT_PULL_REQUEST_BACKFILL = 10;
  JOB_GROUP_TYPE_ASSESSMENT_DISCUSSION_BACKFILL = 11;
  JOB_GROUP_TYPE_ASSESSMENT_WIKI_BACKFILL = 12;
}

message JobGroup {
    uint64 job_group_id = 1; 
    JobGroupStatus status = 2; 
    google.protobuf.Timestamp started_at = 3;
    google.protobuf.Timestamp completed_at = 4;
    uint64 owner_id = 5;
    OwnerScope owner_scope = 6;
    JobGroupType type = 7;
    uint64 CustomPatternId = 8;
}
