---
version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  groups:
    all-dependencies:
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  ignore:
    - dependency-name: "github/internal-actions"
  groups:
    all-dependencies:
      patterns:
      - "*"
