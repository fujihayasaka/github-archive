syntax = "proto3";

package github.secretscanning.tenant.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/tenant";
option ruby_package = "GitHub::Proto::SecretScanning::Tenant::V1";

// TenantAPI defines the service to retrieve the current tenant for
// the Secret Scanning Service.
service TenantAPI {
  // GetTenant retrieves the relevant tenant for the given request payload
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
}

message GetTenantRequest {
  // repo_id is the ID of the repository to look up. (required) */
  int64 repo_id = 1;
}

message GetTenantResponse {
  string tenant_slug = 1;
}