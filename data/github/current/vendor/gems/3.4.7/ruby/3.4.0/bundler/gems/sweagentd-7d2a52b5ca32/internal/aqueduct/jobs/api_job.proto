// Update generated code with script/protoc

syntax = "proto3";

package github.sweagentd.aqueduct.jobs;

option go_package = "./;jobs";

message APIJob {
  // The sweagentd assignment ID.
  string assignment_id = 1;
  // The sweagentd job ID that this (aqueduct) job is associated with.
  string job_id = 2;

  // The owner ID of the repository.
  int64 owner_id = 3;

  // The repository ID.
  int64 repository_id = 4;

  // The actor ID is the GitHub ID of the user that initiated the job.
  int64 actor_id = 5;

  // The session ID is the ID of the session that this job is associated with.
  string session_id = 6;

  // The GitHub request ID flows continuously despite events being enqueued and dequeued.
  string github_request_id = 7;

  // The number of times this job has been requeued.
  // This value should NOT be set when creating/queueing/requeueing a job. It is
  // set by the aqueduct package handlers when the job is requeued.
  int32 requeue_count = 8;
}