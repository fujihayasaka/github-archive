apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../moda-base

patchesStrategicMerge:
  - service.yaml

configMapGenerator:
  - name: config
    behavior: merge
    literals:
      - TWIRP_INTERNAL_API_URL='https://internal-api.service.%stamp%.github.net/internal'
      - KUSTO_REPO_DATABASE=local_warehouse
      - KUSTO_REPO_TABLE=repositories_daily
      - KUSTO_ORG_TABLE=users_daily
