name: Mark and close stale pull requests

on:
  schedule:
    - cron: '0 5 * * *'  # Run at approximately 5:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    env:
      # Allow 2 weeks of inactivity before marking PRs as stale
      PR_DAYS_BEFORE_STALE: 14
      # Allow an additional 1 week of inactivity before closing stale PRs
      PR_DAYS_BEFORE_CLOSE: 7
      # Label used to mark PRs as stale
      PR_STALE_LABEL: stale
    steps:
      - uses: actions/stale@v9
        with:
          stale-pr-message: '👋 This pull request has been marked as stale because it is still open without any recent activity in the previous ${{ env.PR_DAYS_BEFORE_STALE }} days. To delay its impending closure for a while, you can push a commit, add a comment, add a review, or remove the ${{ github.server_url }}/${{ github.repository }}/labels/${{ env.PR_STALE_LABEL }} label.<br><br>If you do nothing, this pull request will be closed in ${{ env.PR_DAYS_BEFORE_CLOSE }} days. 🧹'
          stale-pr-label: ${{ env.PR_STALE_LABEL }}
          close-pr-label: 'closed-by-stale'
          days-before-pr-stale: ${{ env.PR_DAYS_BEFORE_STALE }}
          days-before-pr-close: ${{ env.PR_DAYS_BEFORE_CLOSE }}
          delete-branch: true
          # Start with the oldest items first
          ascending: true
          # Allow more operations at the risk of hitting API rate limits
          operations-per-run: 1000
          # Prevent Stale from considering issues since we want to focus on only pull requests
          days-before-issue-stale: -1
          days-before-issue-close: -1
