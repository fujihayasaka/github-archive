name: "🐛 Bug Report"
description: Report a bug
type: 'bug'
body:
  - type: textarea
    id: Summary
    attributes:
      label: Summary
      description: "Brief summary of what doesn't work as expected"
  - type: textarea
    id: Repro
    attributes:
      label: Reproduction steps
      description: "Reproduction steps, expected behaviour, actual behaviour and if a work around exists"
  - type: textarea
    id: CC
    attributes:
      label: Any other information
      description: "Sometimes bugs are only reproducible with certain underlying data. If there's a specific record (Issue/PR/etc.), please add a link"
      value: |
        cc @github/compute-flex
