syntax = "proto3";

package github.actions.broker.billing_owner.v1;

option ruby_package = "GitHub::ActionsBrokerService::BillingOwner::V1";

service BillingOwnerAPI {
  rpc GetBillingOwner(GetBillingOwnerRequest) returns (GetBillingOwnerResponse);
}

message GetBillingOwnerRequest {
  string entity_id = 1;
}

message GetBillingOwnerResponse {
  string billing_owner_id = 1;
}