run-name: Dependency Submission
on: push
jobs:
  submit-golang:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup-ecosystem
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'

      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: submit-dependency-snapshot
        uses: actions/go-dependency-submission@5cde65f6ad26dfda3fcfb1adb534b987098a69b2 # v2.0.3
        with:
          go-mod-path: "./go.mod"
