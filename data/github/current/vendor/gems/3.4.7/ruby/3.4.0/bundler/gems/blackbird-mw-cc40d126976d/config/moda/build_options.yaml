# Ignore Moda lint for PodDisruptionBudget
#
# NOTE: This ignores this rule globally. Ideally, we would like to ignore this
# rule only in the Proxima ingest deployment files, but this is not possible
# today. There is an open issue requesting more granular lint configuration:
# https://github.com/github/moda-linter/issues/1153
ignored_rules:
  - "service mesh enabled without pdb"
# These are shared configs used for individual Proxima environments, not "real" ones
ignored_dirs:
  - proxima-blue
  - proxima-green
