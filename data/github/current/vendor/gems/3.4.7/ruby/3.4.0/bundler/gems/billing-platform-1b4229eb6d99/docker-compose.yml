services:

  cosmos-db:
    container_name: cosmos-db
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8950:8081"
      - "10250-10255:10250-10255"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=10
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true

  oktaproxy:
    container_name: oktaproxy
    image: base-dev-runtime
    ports:
      - 8899:8899
      - 4040:4040
    volumes:
      - ./bin:/app/bin
      - /usr/local/share/ca-certificates/emulatorcert.crt:/usr/local/share/ca-certificates/emulatorcert.crt
    command: >
      bash -c "update-ca-certificates &&
            ./script/dlvexec 4040 /app/bin/oktaproxy"
    env_file:
      - dev.vscode.env
    extra_hosts:
      - "localhost:host-gateway"
    security_opt:
      - seccomp:unconfined  # Disable seccomp filtering for delve

  admin:
    container_name: admin
    image: base-dev-runtime
    ports:
      - 8888:8888
      - 4041:4041
    volumes:
