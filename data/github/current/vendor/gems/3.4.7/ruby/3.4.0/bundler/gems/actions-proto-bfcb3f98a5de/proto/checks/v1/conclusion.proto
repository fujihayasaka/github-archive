syntax = "proto3";

package github.actions.checks.v1;

// Conclusion is the status of any check entity (suite, run, step)
// Dotcom equivalent: https://github.com/github/github/blob/2d08655067b0fccd45ef6dd0bdd1f9f338d09974/packages/checks/app/models/check_run.rb#L70-L79
enum Conclusion {
  // Unused, default value for enum
  CONCLUSION_UNKNOWN = 0;
  // The resource was neutral
  CONCLUSION_NEUTRAL = 1;
  // The resource was successful
  CONCLUSION_SUCCESS = 2;
  // The resource failed
  CONCLUSION_FAILURE = 3;
  // The resource was cancelled
  CONCLUSION_CANCELLED = 4;
  // The resource has an action required (ie: pending approval)
  CONCLUSION_ACTION_REQUIRED = 5;
  // The resource timed out
  CONCLUSION_TIMED_OUT = 6;
  // The resource was skipped
  CONCLUSION_SKIPPED = 7;
  // The resource was marked as stale (by StaleChecksJob)
  CONCLUSION_STALE = 8;
  // The resource failed to start (CheckSuite only)
  CONCLUSION_STARTUP_FAILURE = 9;
}
