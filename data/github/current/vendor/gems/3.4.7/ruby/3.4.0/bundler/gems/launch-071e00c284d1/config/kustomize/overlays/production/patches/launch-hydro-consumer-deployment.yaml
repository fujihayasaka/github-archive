# http://kubernetes.io/docs/user-guide/deployments/#what-is-a-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: launch-hydro-consumer
spec:
    template:
        spec:
            containers:
                - name: launch-hydro-consumer
                  env:
                    - name: KREDZ_HTTP_ADDR
                      valueFrom:
                        secretKeyRef:
                            name: launch-production
                            key: kredz-http-addr
                    - name: KREDZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-production
                            key: kredz-hmac-secret
                    - name: DEPLOYER_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-production
                            key: deployer-hmac-secret
                    - name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
                      valueFrom:
                        secretKeyRef:
                            name: launch-production
                            key: otel-exporter-otlp-traces-headers
                    - name: LAUNCH_REDIS_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-production
                            key: launch-redis-secret
                    - name: GITHUB_TWIRP_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-production
                            key: github-twirp-hmac-secret
                    # The app id for the Launch GitHub App
                    - name: GITHUB_APP_ID
                      valueFrom:
                        configMapKeyRef:
                            name: static-config
                            key: GITHUB_APP_ID
