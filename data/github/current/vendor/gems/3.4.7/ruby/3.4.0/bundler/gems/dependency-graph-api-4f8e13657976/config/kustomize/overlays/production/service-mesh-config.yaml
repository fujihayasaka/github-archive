apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config  # name *must* be `config`
spec:
  authorization:
    create: true
    strictTLS: true

    inboundNamespaces:
    - github-%environment%
    - dependency-graph-api-%environment%
    - dependency-graph-platform-%environment%
  loadBalancing:
    retryOnReset: true
    useLocalityLoadBalancing: true
