apiVersion: v1
kind: Service
metadata:
  name: authnd-canary
  labels:
    service: authnd-canary
  annotations:
    # https://moda.githubapp.com/docs/features/load-balancing/#using-variables-in-domain-names
    # For example, this will render out to authnd-production.service.iad.github.net
    # if this is your production deployment in iad.
    moda.github.net/domain-name: "authnd-%environment%-canary.service.%region%.github.net"
    moda.github.net/backend-keepalive-enabled: "true"
    # 10ms connect timeout
    moda.github.net/timeout-connect: "10"
    # 5 second response deadline
    moda.github.net/timeout-server: "5"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: authnd
    canary: canary
  type: LoadBalancer
