apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
    name: config
spec:
    authorization:
        create: true
        strictTLS: true
        inboundNamespaces:
            - aleph-%stamp%
            - copilot-api-%stamp%
            - github-%stamp%
            - feature-flag-hub-%stamp%
    loadBalancing:
        retryOnReset: true
        useLocalityLoadBalancing: true
