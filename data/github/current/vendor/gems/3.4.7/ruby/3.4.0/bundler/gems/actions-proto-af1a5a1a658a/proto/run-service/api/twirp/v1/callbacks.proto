syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

message Callbacks {
    string signature_key = 1;
    string pre_job_url = 2;
    string receiver_url = 3;
    string permissions_url = 4;
    string results_receiver_url = 5;
}
