- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: LAUNCH_ENV
    value: production
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: CHATOPS_AUTH_BASE_URL
    value: https://launch-chatops-production.service.iad.github.net
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DEPLOYER_TWIRP_ADDR
    value: https://launch-deployer-production.service.iad.github.net
