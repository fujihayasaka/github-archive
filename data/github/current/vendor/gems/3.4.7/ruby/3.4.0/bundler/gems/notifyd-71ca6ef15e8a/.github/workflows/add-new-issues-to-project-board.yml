name: Add all new issues to our project backlog
on:
  issues:
    types: [opened]
jobs:
  github-projects-loves-actions:
    runs-on: ubuntu-latest
    steps:
    - name: Add new issues to project backlog
      uses: actions/add-to-project@v1.0.2
      with:
        project-url: https://github.com/orgs/github/projects/3011
        github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
