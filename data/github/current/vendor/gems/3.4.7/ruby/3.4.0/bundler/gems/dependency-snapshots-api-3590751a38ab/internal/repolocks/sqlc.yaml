version: "2"
sql:
  - schema: "../../schemas/ds_repo_locks.sql"
    queries: "repo_lock_queries.sql"
    engine: "mysql"
    gen:
      go:
        package: "models"
        out: "internal/models"
        sql_driver: "github.com/go-sql-driver/mysql"
        emit_prepared_queries: true
        emit_interface: true
        emit_exported_queries: true
        emit_result_struct_pointers: true
