apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config
spec:
  authorization:
    create: true
    strictTLS: true
    inboundNamespaces:
    - "github-%stamp%"
    - "dependency-graph-api-%stamp%"
    - "dependency-graph-platform-%stamp%"
  loadBalancing:
    retryOnReset: true
    useLocalityLoadBalancing: true
