- op: replace
  path: /spec/type
  value: LoadBalancer
- op: add
  path: /metadata/annotations/moda.github.net~1domain-name
  value: notifyd-chatops-%environment%.service.%site%.github.net,notifyd-chatops-%environment%.service.%region%.github.net
- op: add
  path: /metadata/annotations/moda.github.net~1istio-ingress-enabled
  value: true
