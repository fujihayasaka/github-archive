syntax = "proto3";

package github.dependency_snapshots_api;

option go_package = "./proto";

/* DiagnosticService is a simple service to test connectivity and basic diagnostic functionality (boom!) */
service DiagnosticService {
    // Ping returns successfully whenever the service is considered healthy.
    rpc Ping(PingRequest) returns (PingResponse);
    // Boom returns an error whenever called, primarily this is used for traceability testing.
    rpc Boom(BoomRequest) returns (BoomResponse);
    // Timeout times out whenever called, primarily this is used for operability testing.
    rpc Timeout(TimeoutRequest) returns (TimeoutResponse);
    // IsFeatureFlagEnabled checks whether a given feature is enabled (globally or per-actor) for each submitted actor.
    rpc IsFeatureFlagEnabled(IsFeatureFlagEnabledRequest) returns (IsFeatureFlagEnabledBatchResponse);
    // IsFeatureFlagEnabledForRepository checks whether a given feature is enabled (globally or per-repo) for a given repository.
    rpc IsFeatureFlagEnabledForRepository(IsFeatureFlagEnabledForRepositoryRequest) returns (IsFeatureFlagEnabledSingleResponse);
}

// PingRequest is the request message for a Ping operation. 
message PingRequest {
}

// PingResponse is the response message for a Ping operation. The contents of the response are not considered meaningful.
message PingResponse {
    string message = 1;
}

// BoomRequest is the request message for a Boom operation.
message BoomRequest {
    // If should_panic, this endpoint panics, otherwise it returns an error.
    bool should_panic = 1;
}

// BoomResponse is the response message for a Boom operation. It shouldn't ever be returned, since the operation is always intended to fail.
message BoomResponse {
}

// TimeoutRequest is the request message for a Timeout operation.
message TimeoutRequest {
    // Amount of time to sleep. The request will sleep for 5 minutes by default (guaranteeing timeout) but you can timeout with smaller durations with this param.
    int32 sleep_duration_seconds = 1;
}

// TimeoutResponse is the response message for a Timeout operation. It shouldn't ever be returned, since the operation is always intended to timeout.
message TimeoutResponse {
}

// IsFeatureFlagEnabledRequest is the request message for IsFeatureFlagEnabled.
message IsFeatureFlagEnabledRequest {
    // The dotcom feature name to check against.
    string feature = 1;
    // The actors to check feature flags for. Results will be returned relative to the order in this request. For more information on actor formatting, check the features implementation.
    repeated string actors = 2;
}

// IsFeatureFlagEnabledForRepositoryRequest is the request message for IsFeatureFlagEnabledForRepository.
message IsFeatureFlagEnabledForRepositoryRequest {
    // The dotcom feature name to check against.
    string feature = 1;
    // The repository_id to check the feature flag enablement for.
    uint64 repository_id = 2;
}

// IsFeatureFlagEnabledBatchResponse is the response message for feature flag requests that pass in enumerable lists to check enablement for.
message IsFeatureFlagEnabledBatchResponse {
    // An ordered list of whether or not a feature is enabled, relative to the request's ordering.
    repeated bool is_enabled = 1;
}

// IsFeatureFlagEnabledBatchResponse is the response message for feature flag requests that pass in single items to check enablement for.
message IsFeatureFlagEnabledSingleResponse {
    // True if a feature is enabled, false if it is not.
    bool is_enabled = 1;
}