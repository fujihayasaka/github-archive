syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

package github.actions.results.entities.v1;

// Artifact is a stored file associated with a run
message Artifact {
  // The name of the artifact
  string name = 1;
  // Size of the artifact in bytes
  int64 size = 2;
  // The url where the artifact can be located
  string source_url = 3;
  // When the artifact was created
  google.protobuf.Timestamp created_at = 4;
  // When the artifact expires
  google.protobuf.Timestamp expires_at = 5;
  // The SHA-256 digest of the artifact, calculated on upload for upload-artifact v4 & newer
  google.protobuf.StringValue digest = 6;
}
