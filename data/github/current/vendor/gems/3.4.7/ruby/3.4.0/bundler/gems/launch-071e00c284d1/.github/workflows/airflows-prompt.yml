name: "Airflow Schemas Prompt"

on:
  pull_request:
    paths:
    - 'schemas/**/*.sql'
    reuse-previous-outcome: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: comment PR
        uses: unsplash/comment-on-pr@bc79160dfc20ea0f151d47803638dc520190c815
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          msg: "## :rotating_light: ACTION REQUIRED :rotating_light: \nIt looks like you're updating a database schema. If this PR adds/removes/updates a column you may need to [update the airflow schema](https://github.com/github/airflow-sources/blob/master/dags/db_snapshots/configs/vitess/launch/launch-daily.yaml) for this table. This schema controls the DB snapshots, e.g. for [workflow_builds](https://data.githubapp.com/warehouse/hive/snapshots_presto/workflow_builds#!schema-tab)."
          check_for_duplicate_msg: true
