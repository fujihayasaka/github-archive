linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - stylecheck
    - thelper
    - typecheck
    - unconvert
    - unused
linters-settings:
  gosimple:
    checks:
      - all
      - '-S1028' # disable the rule S1028 -- We use errors.New for stack traces, and converting to fmt.Errorf is a regression.
run:
  go: 'go1.22'
  build-tags:
    - integration
