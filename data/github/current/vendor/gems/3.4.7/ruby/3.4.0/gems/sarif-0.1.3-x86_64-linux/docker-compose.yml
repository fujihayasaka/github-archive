services:
  bundle:
    build:
      context: .
      dockerfile: Dockerfile.deps
      target: base
    volumes:
      - "./:/src"
    command: bundle update
  cargo:
    build:
      context: .
      dockerfile: Dockerfile.deps
      target: base
    volumes:
      - "./:/src"
    depends_on:
      bundle:
        condition: service_completed_successfully
    command: cargo update
  rake:
    build:
      context: .
      dockerfile: Dockerfile.deps
    depends_on:
      cargo:
        condition: service_completed_successfully
    volumes:
      - "./:/src"
