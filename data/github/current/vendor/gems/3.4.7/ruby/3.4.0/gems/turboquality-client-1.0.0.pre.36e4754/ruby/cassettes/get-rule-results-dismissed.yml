              {
                "category": "CAT_MAINTAINABILITY",
                "description": "A condition that always evaluates to 'true' or always evaluates to 'false' should be removed, and if the condition is a loop condition, the condition is likely to cause an infinite loop.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "100",
                "rule_help": "# Constant condition\nA condition that always evaluates to `true` or always evaluates to `false` can be removed, thereby simplifying the program logic. If the condition is a loop condition, consider rewriting the loop using bounded iteration (for example, a `foreach` loop), if possible.\n\n\n## Recommendation\nAvoid constant conditions where possible, and either eliminate the conditions or replace them.\n\n\n## Example\nIn the following example, the condition `a \u003e a` is constantly false, so `Max(x, y)` always returns `x`.\n\n\n```csharp\nclass Bad\n{\n    public int Max(int a, int b)\n    {\n        return a \u003e a ? a : b;\n    }\n}\n\n```\nThe revised example replaces the condition with `a \u003e b`.\n\n\n```csharp\nclass Good\n{\n    public int Max(int a, int b)\n    {\n        return a \u003e b ? a : b;\n    }\n}\n\n```\n",
                "rule_id": "cs/constant-condition",
                "sarif_identifier": "cs/constant-condition",
                "severity": "SEV_WARNING",
                "title": "Constant condition"
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "Calling 'string.Format()' with either an invalid format string or incorrect number of arguments may result in dropped arguments or a 'System.FormatException'.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "82",
                "rule_help": "# Invalid string formatting\nWhen using string formatting methods (such as `string.Format()`), the following should be taken into account:\n\n1. The formatting string must be formatted correctly, otherwise the exception `System.FormatException` will be thrown.\n1. All passed arguments should be used by the formatting string, otherwise such arguments will be ignored.\n1. Missing arguments will result in a `System.FormatException` exception being thrown.\n\n## Recommendation\n1. Change the format string so that it is correctly formatted. Ensure that each format item adheres to the syntax: \u003cblockquote\u003e \u003cp\u003e\u003cb\u003e{\u003c/b\u003e\u003ci\u003eindex\u003c/i\u003e\\[\u003cb\u003e,\u003c/b\u003e\u003ci\u003ealignment\u003c/i\u003e\\]\\[\u003cb\u003e:\u003c/b\u003e\u003ci\u003eformatString\u003c/i\u003e\\]\u003cb\u003e}\u003c/b\u003e\u003c/p\u003e \u003c/blockquote\u003e When literals `{` or `}` are required, replace them with `{{` and `}}`, respectively, or supply them as arguments.\n1. Change the format string to use the highlighted argument, or remove the unnecessary argument.\n1. Supply the correct number of arguments to the format method, or change the format string to use the correct arguments.\n\n## Example\nIn this example, a format string uses both literals `{` and `}`, but the literals are not properly escaped.\n\n\n```csharp\nusing System;\n\nclass Bad1\n{\n    string GenerateEmptyClass(string c)\n    {\n        return string.Format(\"class {0} { }\", \"C\");\n    }\n}\n\n```\nIn the revised example, the literals are properly escaped.\n\n\n```csharp\nusing System;\n\nclass Good1\n{\n    string GenerateEmptyClass(string c)\n    {\n        return string.Format(\"class {0} {{ }}\", \"C\");\n    }\n}\n\n```\n\n## Example\nHere are three examples where the format string does not use all the arguments.\n\n\n```csharp\nusing System;\n\nclass Bad2\n{\n    void M(Exception ex)\n    {\n        Console.WriteLine(\"Error processing file: {0}\", ex, ex.HResult);\n        Console.WriteLine(\"Error processing file: {1} ({1})\", ex, ex.HResult);\n        Console.WriteLine(\"Error processing file: %s (%d)\", ex, ex.HResult);\n    }\n}\n\n```\n* On line 7, the second argument (`ex.HResult`) is not logged.\n* On line 8, the first argument (`ex`) is not logged but the second argument (`ex.HResult`) is logged twice.\n* On line 9, a C-style format string is used, which is incorrect, and neither argument will be logged.\n\n## Example\nHere are two examples where the call to `String.Format()` is missing arguments.\n\n\n```csharp\nusing System;\n\nclass Bad3\n{\n    void Hello(string first, string last)\n    {\n        Console.WriteLine(\"Hello {0} {1}\", first);\n        Console.WriteLine(\"Hello {1} {2}\", first, last);\n    }\n}\n\n```\n* On line 7, the second argument (`last`) is not supplied.\n* On line 8, the format items are numbered `{1}` and `{2}`, instead of `{0}` and `{1}` as they should be.\nIn the revised example, both arguments are supplied.\n\n\n```csharp\nusing System;\n\nclass Good3\n{\n    void Hello(string first, string last)\n    {\n        Console.WriteLine(\"Hello {0} {1}\", first, last);\n    }\n}\n\n```\n\n## References\n* MSDN: [String.Format Method](https://msdn.microsoft.com/en-us/library/system.string.format.aspx).\n* Microsoft: [Composite Formatting](https://docs.microsoft.com/en-us/dotnet/standard/base-types/composite-formatting).\n",
                "rule_id": "cs/invalid-string-formatting",
                "sarif_identifier": "cs/invalid-string-formatting",
                "severity": "SEV_ERROR",
                "title": "Invalid string formatting"
              },
              {
                "category": "CAT_MAINTAINABILITY",
                "description": "A private field where all assignments occur as part of the declaration or in a constructor in the same class can be 'readonly'.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "67",
                "rule_help": "# Missed 'readonly' opportunity\nA private field where all assignments occur as part of the declaration or in a constructor in the same class can be `readonly`. Making a field `readonly` prevents unintended assignments after object initialization.\n\n\n## Recommendation\nAdd a `readonly` modifier to the field, unless changes to the field are allowed after object initialization.\n\n\n## Example\nIn the following example, the field `Field` is only assigned to in the constructor, but it can still be modified after object initialization.\n\n\n```csharp\nclass Bad\n{\n    int Field;\n\n    public Bad(int i)\n    {\n        Field = i;\n    }\n}\n\n```\nIn the revised example, the field is made `readonly`.\n\n\n```csharp\nclass Good\n{\n    readonly int Field;\n\n    public Good(int i)\n    {\n        Field = i;\n    }\n}\n\n```\n\n## References\n* Microsoft: [readonly](https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/readonly).\n",
                "rule_id": "cs/missed-readonly-modifier",
                "sarif_identifier": "cs/missed-readonly-modifier",
                "severity": "SEV_NOTE",
                "title": "Missed 'readonly' opportunity"
