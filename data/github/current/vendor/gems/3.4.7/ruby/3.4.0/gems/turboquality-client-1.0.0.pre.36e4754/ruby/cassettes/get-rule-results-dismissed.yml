              {
                "category": "CAT_RELIABILITY",
                "description": "Methods that create objects of type 'IDisposable' should call 'Dispose' on those objects, otherwise unmanaged resources may not be released.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "63",
                "rule_help": "# Missing Dispose call on local IDisposable\nObjects whose type implements `IDisposable` should be disposed of by calling `Dispose`.\n\n\n## Recommendation\nIf possible, wrap the allocation of the object in a `using` block to automatically dispose of the object once the `using` block has completed.\n\nIf this is not possible, ensure that `Dispose` is called on the object. It is usually recommended to call `Dispose` within a `finally` block, to ensure that the object is disposed of even if an exception is thrown.\n\n\n## Example\nIn this example, a `FileStream` is created, but it is not disposed of.\n\n\n```csharp\nusing System;\nusing System.IO;\n\nclass Bad\n{\n    long GetLength(string file)\n    {\n        var stream = new FileStream(file, FileMode.Open);\n        return stream.Length;\n    }\n}\n\n```\nIn the revised example, a `using` statement is used to ensure that the file stream is properly closed.\n\n\n```csharp\nusing System;\nusing System.IO;\n\nclass Good\n{\n    long GetLength(string file)\n    {\n        using (var stream = new FileStream(file, FileMode.Open))\n            return stream.Length;\n    }\n}\n\n```\n\n## References\n* MSDN: [IDisposable Interface](https://msdn.microsoft.com/en-us/library/system.idisposable.aspx).\n* Common Weakness Enumeration: [CWE-404](https://cwe.mitre.org/data/definitions/404.html).\n* Common Weakness Enumeration: [CWE-459](https://cwe.mitre.org/data/definitions/459.html).\n* Common Weakness Enumeration: [CWE-460](https://cwe.mitre.org/data/definitions/460.html).\n",
                "rule_id": "cs/local-not-disposed",
                "sarif_identifier": "cs/local-not-disposed",
                "severity": "SEV_WARNING",
                "title": "Missing Dispose call on local IDisposable"
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "Comparing the size of a container to zero with this operator will always return the same value.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "31",
                "rule_help": "# Container size compared to zero.\nA collection, string or array will always have size of at least zero. Checking that an object of one of these types has size greater than or equal to zero will always be true, while checking that it has size less than zero will always be false.\n\n\n## Recommendation\nFor strings, it may be preferred to use the `System.String.IsNullOrEmpty` static method. In other cases, check that the `Count` or `Length` field is greater than (**not** equal to) zero.\n\n\n## Example\nThe following example shows creation of a file guarded by comparison of a string length with zero. This can result in the attempted creation of a file with an empty name.\n\n\n```csharp\nusing System.IO;\nusing System;\n\nclass ContainerSizeCmpZero\n{\n    private static FileStream MakeFile(String filename)\n    {\n        if (filename != null \u0026\u0026 filename.Length \u003e= 0)\n        {\n            return File.Create(filename);\n        }\n        return File.Create(\"default.name\");\n    }\n}\n\n```\nIn the following revised example, the check against zero has been replaced with a call to `String.IsNullOrEmpty`. This correctly guards against the attempted creation of a file with an empty name.\n\n\n```csharp\nusing System.IO;\nusing System;\n\nclass ContainerSizeCmpZero\n{\n    private static FileStream MakeFile(String filename)\n    {\n        if (filename != null \u0026\u0026 !(String.IsNullOrEmpty(filename)))\n        {\n            return File.Create(filename);\n        }\n        return File.Create(\"default.name\");\n    }\n}\n\n```\n\n## References\n* MSDN Library (.NET Framework 4.5): [String.IsNullOrEmpty Method](https://msdn.microsoft.com/en-us/library/system.string.isnullorempty(v=vs.110).aspx).\n",
                "rule_id": "cs/test-for-negative-container-size",
                "sarif_identifier": "cs/test-for-negative-container-size",
                "severity": "SEV_WARNING",
                "title": "Container size compared to zero."
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "Calling the default implementation of 'ToString' returns a value that is unlikely to be what you expect.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "20",
                "rule_help": "# Use of default ToString()\nCalling `System.Object`'s (or `System.ValueType`'s) `ToString` method on a value returns the fully qualified name of the type of that value. In most cases this is not useful, or what was intended. This rule finds explicit and implicit calls to the default `ToString` methods.\n\n\n## Recommendation\nOverride the default `ToString` method, if possible, or perform bespoke string conversion.\n\n\n## Example\nIn the following example, the default `ToString` method is invoked first on an object of type `Person`, and then on an integer array. The output results are `p: Bad+Person` and `ints: System.Int32[]`, respectively.\n\n\n```csharp\nusing System;\n\nclass Bad\n{\n    static void Main(string[] args)\n    {\n        var p = new Person(\"Eric Arthur Blair\");\n        Console.WriteLine(\"p: \" + p);\n\n        var ints = new int[] { 1, 2, 3 };\n        Console.WriteLine(\"ints: \" + ints);\n    }\n\n    class Person\n    {\n        private string Name;\n\n        public Person(string name)\n        {\n            this.Name = name;\n        }\n    }\n}\n\n```\nIn the fixed example, the `ToString` method is overridden in the class `Person`, and `string.Join` is used to print the elements of the integer array (it is not possible to override `ToString` in that case). The output results are `p: Eric Arthur Blair` and `ints: 1, 2, 3`, respectively.\n\n\n```csharp\nusing System;\n\nclass Good\n{\n    static void Main(string[] args)\n    {\n        var p = new Person(\"Eric Arthur Blair\");\n        Console.WriteLine(\"p: \" + p);\n\n        var ints = new int[] { 1, 2, 3 };\n        Console.WriteLine(\"ints: \" + string.Join(\", \", ints));\n    }\n\n    class Person\n    {\n        private string Name;\n\n        public Person(string name)\n        {\n            this.Name = name;\n        }\n\n        public override string ToString() =\u003e Name;\n    }\n}\n\n```\n\n## References\n* MSDN: [Object.ToString Method](http://msdn.microsoft.com/en-us/library/system.object.tostring.aspx), [ValueType.ToString Method](https://msdn.microsoft.com/en-us/library/wb77sz3h(v=vs.110).aspx).\n",
                "rule_id": "cs/call-to-object-tostring",
                "sarif_identifier": "cs/call-to-object-tostring",
                "severity": "SEV_WARNING",
                "title": "Use of default ToString()"
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "Assigning a variable to itself is useless and very likely indicates an error in the code.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "11",
                "rule_help": "# Self-assignment\nAssigning a variable to itself is redundant and often an indication of a mistake in the code.\n\n\n## Recommendation\nCheck the assignment carefully for mistakes. If the assignment is truly redundant and not simply incorrect then remove it.\n\n\n## Example\nIn this example the programmer clearly intends to assign to `this.i` but made a mistake.\n\n\n```csharp\nclass SelfAssignment\n{\n    private int i;\n    public SelfAssignment(int i)\n    {\n        i = i;\n    }\n}\n\n```\n",
                "rule_id": "cs/self-assignment",
                "sarif_identifier": "cs/self-assignment",
                "severity": "SEV_ERROR",
                "title": "Self-assignment"
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "Testing whether a dictionary contains a value before getting it is inefficient and redundant. Use 'TryGetValue' to combine these two steps.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "10",
                "rule_help": "# Inefficient use of ContainsKey\nUsing the `ContainsKey` method to check whether a dictionary contains a value before getting the value is inefficient because it performs two operations on the dictionary. It is simpler and more efficient to combine the operations using the `TryGetValue` method.\n\n\n## Recommendation\nReplace the two operations with a single call to `TryGetValue`.\n\n\n## Example\nThis code first checks whether `ip` is in the `hostnames` table, before looking up the value.\n\n\n```csharp\n// BAD: Two operations on the hostnames table.\n\nif(hostnames.ContainsKey(ip))\n  return hostnames[ip];\n\n```\nThis code performs the same function as the example above, but uses `TryGetValue`, which makes it is more efficient.\n\n\n```csharp\n// GOOD: One operation on the hostnames table.\n\nif(hostnames.TryGetValue(ip, out hostname))\n  return hostname;\n\n```\n\n## References\n* MSDN: [ContainsKey Method](https://msdn.microsoft.com/en-us/library/kw5aaea4(v=vs.110).aspx), [TryGetValue Method](https://msdn.microsoft.com/en-us/library/bb347013(v=vs.110).aspx).\n",
                "rule_id": "cs/inefficient-containskey",
                "sarif_identifier": "cs/inefficient-containskey",
                "severity": "SEV_NOTE",
                "title": "Inefficient use of ContainsKey"
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "Comparing results of floating-point computations with '==' or '!=' is likely to yield surprising results since floating-point computation does not follow the standard rules of algebra.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "6",
                "rule_help": "# Equality check on floating point values\nDirectly comparing two floating point values is dangerous due to the imprecision encountered when storing and performing arithmetic on them.\n\n\n## Recommendation\nFloating point numbers should be treated as equal if the difference between their values is within a certain margin of error. The appropriate margin of error depends on the situation in which it is used.\n\nAs a cautionary note, floating-point comparison is a non-trivial topic, and our documentation here takes a pragmatic approach rather than trying to do it justice. You are strongly advised to consult the references for further information.\n\n\n## Example\nAlthough you might expect this example to output \"True\" it actually outputs \"False\" due to the imprecise way floating point arithmetic is performed.\n\n\n```csharp\nclass EqualityCheckOnFloats\n{\n    public static void Main(string[] args)\n    {\n        Console.WriteLine((0.1 + 0.2) == 0.3);\n    }\n}\n\n```\nThe class should be changed to perform a comparison with a tolerance value as in the following example.\n\n\n```csharp\nclass EqualityCheckOnFloatsFix\n{\n    public static void Main(string[] args)\n    {\n        const double EPSILON = 0.001;\n        Console.WriteLine(Math.Abs((0.1 + 0.2) - 0.3) \u003c EPSILON);\n    }\n}\n\n```\n\n## References\n* Oracle Numerical Computation Guide: [What Every Computer Scientist Should Know About Floating-Point Arithmetic](https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html).\n* Bruce Dawson: [Comparing Floating Point Numbers](https://randomascii.wordpress.com/2012/02/25/comparing-floating-point-numbers-2012-edition/).\n",
                "rule_id": "cs/equality-on-floats",
                "sarif_identifier": "cs/equality-on-floats",
                "severity": "SEV_WARNING",
                "title": "Equality check on floating point values"
              },
              {
                "category": "CAT_MAINTAINABILITY",
                "description": "Calling 'GetHashCode()' on integer types is redundant because the method always returns the original value.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "6",
                "rule_help": "# Useless call to GetHashCode()\nThe method `GetHashCode()` on an integer simply returns the original value of the integer. This method call is therefore redundant, inefficient, and obscures the logic of the hash function. Several of the built-in types have this behavior, including `int`, `uint`, `short`, `ushort`, `long`, `ulong`, `byte` and `sbyte`.\n\n\n## Recommendation\nRemove the call to `GetHashCode()`, and review the hash function.\n\n\n## Example\nThe following hash function has two problems. Firstly, the calls to `GetHashCode()` are redundant, and secondly, the hash function generates too many collisions.\n\n\n```csharp\npublic override int GetHashCode()\n{\n    return row.GetHashCode() ^ col.GetHashCode();\n}\n\n```\nThese problems are resolved by removing the redundant calls to `GetHashCode()`, and by changing the hash function to generate fewer collisions.\n\n\n```csharp\npublic override int GetHashCode()\n{\n    return unchecked(row * 16777619 + col);\n}\n\n```\n\n## References\n* MSDN, C\\# Reference, [Object.GetHashCode Method](https://msdn.microsoft.com/en-us/library/system.object.gethashcode.aspx).\n",
                "rule_id": "cs/useless-gethashcode-call",
                "sarif_identifier": "cs/useless-gethashcode-call",
                "severity": "SEV_NOTE",
                "title": "Useless call to GetHashCode()"
              },
              {
                "category": "CAT_RELIABILITY",
                "description": "The index is compared to be less than or equal to the container length, then used in an array indexing operation that could be out of bounds.",
                "language": "RULE_LANGUAGE_CSHARP",
                "result_count": "4",
                "rule_help": "# Off-by-one comparison against container length\nAn indexing operation against a collection, string or array should use an index at most one less than the length. If the index to be accessed is compared to be less than or equal to the length (`\u003c=`), instead of less than the length (`\u003c`), the index could be out of bounds.\n\n\n## Recommendation\nUse less than (`\u003c`) rather than less than or equals (`\u003c=`) when comparing a potential index against a length. For loops that iterate over every element in an array or collection, prefer to use the `foreach` syntax instead of looping over explicit indexes.\n\n\n## Example\nThe following example shows two methods which identify whether a value appears in a comma-separated list of values.\n\nIn the first example, a loop using an index variable - `i` - is used to iterate over the elements in the comma-separated list. However, the terminating condition of the loop is incorrectly specified as `i \u003c= values.Length`. This condition will succeed if `i` is equal to `values.Length`, but the access `values[i]` in the body of the loop will fail because the index is out of bounds.\n\nOne potential solution would be to replace `i \u003c= values.Length` with `i \u003c values.Length`. However, arrays in C\\# can also be used in `foreach` loops. This is shown in the second example. This circumvents the need to specify an index at all, and therefore prevents errors where the index is out of bounds.\n\n\n```csharp\nusing System.IO;\nusing System;\n\nclass ContainerLengthOffByOne\n{\n    public static boolean BadContains(string searchName, string names)\n    {\n        string[] values = names.Split(',');\n        // BAD: index could be equal to length\n        for (int i = 0; i \u003c= values.Length; i++)\n        {\n            // When i = length, this access will be out of bounds\n            if (values[i] == searchName)\n            {\n                return true;\n            }\n        }\n    }\n\n    public static boolean GoodContains(string searchName, string names)\n    {\n        string[] values = names.Split(',');\n        // GOOD: Avoid using indexes, and use foreach instead\n        foreach (string name in values)\n        {\n            if (name == searchName)\n            {\n                return true;\n            }\n        }\n    }\n}\n\n```\n\n## References\n* Common Weakness Enumeration: [CWE-193](https://cwe.mitre.org/data/definitions/193.html).\n",
                "rule_id": "cs/index-out-of-bounds",
                "sarif_identifier": "cs/index-out-of-bounds",
                "severity": "SEV_ERROR",
                "title": "Off-by-one comparison against container length"
              },
