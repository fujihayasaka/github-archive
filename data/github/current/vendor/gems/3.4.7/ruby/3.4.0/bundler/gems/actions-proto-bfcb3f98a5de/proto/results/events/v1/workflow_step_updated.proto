syntax = "proto3";

import "results/entities/v1/step.proto";

package github.actions.results.events.v1;

message WorkflowStepsUpdated {
  // Used to verify order of messages, auto-incrementing of Run Level Events on Run Service side
  int64 change_order = 1;

  // Updated steps
  repeated results.entities.v1.Step steps = 2;
}
