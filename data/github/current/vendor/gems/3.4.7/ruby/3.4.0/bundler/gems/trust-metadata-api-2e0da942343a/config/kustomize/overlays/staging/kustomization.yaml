apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
patches:
  - path: patches/container-patch.yaml
    target:
      kind: Deployment
      name: trust-metadata-api
  - path: patches/service-patch.yaml
    target:
      kind: Service
      name: trust-metadata-api
  - path: patches/jobs/transition-job-patch.yaml
    target:
      kind: Job
      name: transition-template-job
