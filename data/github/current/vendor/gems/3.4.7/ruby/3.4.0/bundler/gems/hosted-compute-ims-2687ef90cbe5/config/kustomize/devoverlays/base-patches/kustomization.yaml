apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
# Prevent attempts to pull "hosted-compute-ims" docker image from remote because we don't publish it
- path: image-pull-policy-patch.yaml
  target:
    kind: Deployment
    name: ^hosted-compute-ims-.*
# Mount $HOME/.azure directory from Codespace to share Azure auth
- path: mount-azure-auth-patch.yaml
  target:
    kind: Deployment
    name: hosted-compute-ims-worker
# Bind ims-api to the constant port to simplify dev flow
- path: static-api-port-patch.yaml
  target:
    kind: Service
    name: hosted-compute-ims
# Suspend cronjobs to avoid automatic running
- path: suspend-cronjobs-patch.yaml
  target:
    kind: CronJob
# Mount $HOME/.azure directory from Codespace to share Azure auth
- path: mount-azure-auth-cronjob-patch.yaml
  target:
    kind: CronJob