syntax = "proto3";

package oss_license_compliance.v0;

import "google/protobuf/timestamp.proto";

option go_package = "./;proto";

message OrganizationPolicy {
  uint64 organization_id = 1;
  google.protobuf.Timestamp created_at = 2;
  PolicyLicenses licenses = 3 [deprecated=true];
  repeated PackagePolicy packages = 4 [deprecated=true];
  string custom_remediation_guidance = 5;
  repeated DistributionPolicy distribution_policies = 6;
}

message LicenseEntry {
  string spdx_id = 1;
  repeated string contexts = 2 [deprecated=true];
  google.protobuf.Timestamp added_at = 3;
}

message PolicyLicenses {
  repeated LicenseEntry allowed = 1;
}

// Keep in sync with dependency-graph-api:
// https://github.com/github/dependency-graph-api/blob/master/proto/twirp/v1/dependency_graph_api.proto#L108
enum PackageManager {
  PACKAGE_MANAGER_UNKNOWN = 0;
  PACKAGE_MANAGER_RUBYGEMS = 1;
  PACKAGE_MANAGER_NPM = 2;
  PACKAGE_MANAGER_PIP = 3;
  PACKAGE_MANAGER_MAVEN = 4;
  PACKAGE_MANAGER_NUGET = 5;
  PACKAGE_MANAGER_COMPOSER = 6;
  PACKAGE_MANAGER_GOMOD = 7;
  PACKAGE_MANAGER_RUST = 8;
  PACKAGE_MANAGER_ACTIONS = 9;
  PACKAGE_MANAGER_PUB = 10;
  PACKAGE_MANAGER_SWIFT = 11;
}

message PackagePolicy {
  PackageManager package_manager = 1;
  string name = 2;
  PackageAction action = 3;
  string reason = 4;
  repeated string extra_allowed_spdx_ids = 5;
  repeated string contexts = 6 [deprecated=true];
  google.protobuf.Timestamp added_at = 7;
}

enum PackageAction {
  PACKAGE_ACTION_UNKNOWN = 0;
  PACKAGE_ACTION_ALLOWED = 1;
  PACKAGE_ACTION_BLOCKED = 2;
  PACKAGE_ACTION_PRIVATE = 3;
}

message EnterprisePolicy {
  uint64 enterprise_id = 1;
  google.protobuf.Timestamp created_at = 2;
  PolicyLicenses licenses = 3 [deprecated=true];
  repeated PackagePolicy packages = 4 [deprecated=true];
  string custom_remediation_guidance = 5;
  repeated DistributionPolicy distribution_policies = 6;

}

message RepositoryPolicy {
  reserved 1;
  reserved "organization_id";
  uint64 repository_id = 2;
  google.protobuf.Timestamp created_at = 3;
  PolicyLicenses licenses = 4;
  repeated PackagePolicy packages = 5;
}

message DistributionPolicy {
  string name = 1;
  PolicyLicenses licenses = 2;
  repeated PackagePolicy packages = 3;
}

enum FailureReason {
  FAILURE_REASON_UNKNOWN = 0;
  FAILURE_REASON_LICENSE_NOT_ALLOWED = 1;
  FAILURE_REASON_PACKAGE_BLOCKED = 2;
  FAILURE_REASON_EXPIRED = 3;
}

enum PolicyLevel {
  POLICY_LEVEL_UNKNOWN = 0;
  POLICY_LEVEL_REPOSITORY = 1;
  POLICY_LEVEL_ORGANIZATION = 2;
  POLICY_LEVEL_ENTERPRISE = 3;
}

message CombinedPackage {
  PackageManager package_manager = 1;
  string name = 2;
  PackageAction action = 3;
  string reason = 4;
  repeated string extra_allowed_spdx_ids = 5;
  google.protobuf.Timestamp added_at = 6;
  PolicyLevel level = 7;
}

message CombinedLicense {
  string spdx_id = 1;
  google.protobuf.Timestamp added_at = 2;
  PolicyLevel level = 3;
}

message CombinedRepositoryPolicy {
  repeated CombinedLicense licenses = 1;
  repeated CombinedPackage packages = 2;
  string custom_remediation_guidance = 3;
}

enum FailureLevel {
  FAILURE_LEVEL_UNKNOWN = 0;
  FAILURE_LEVEL_NONE = 1;
  FAILURE_LEVEL_REPOSITORY = 2;
  FAILURE_LEVEL_ORGANIZATION = 3;
  FAILURE_LEVEL_ENTERPRISE = 4;
}

message Package {
  PackageManager package_manager = 1;
  string name = 2;
  string version = 3;
  string license = 4;
  bool dev_dependency = 5;
  repeated string manifests = 6;
}

message PackageFailure {
  Package package = 1;
  FailureReason reason = 2;
  FailureLevel level = 3;
}

message RepositoryResults {
  int64 success_count = 1;
  int64 failure_count = 2;
  int64 error_count = 3;
  string last_error = 4;
  repeated PackageFailure failures = 5;
}

enum RepositoryCheckStatus {
  REPOSITORY_CHECK_STATUS_UNKNOWN = 0;
  REPOSITORY_CHECK_STATUS_FAIL = 1;
  REPOSITORY_CHECK_STATUS_PASS = 2;
  REPOSITORY_CHECK_STATUS_PENDING = 3;
}

enum AlertStatus {
  ALERT_STATUS_UNKNOWN = 0;
  ALERT_STATUS_OPEN = 1;
  ALERT_STATUS_REVIEW_REQUESTED = 2;
  ALERT_STATUS_CLOSED = 3;
}

enum AlertResolution {
  ALERT_RESOLUTION_UNKNOWN = 0;
  ALERT_RESOLUTION_EXCEPTION_ADDED = 1;
  ALERT_RESOLUTION_POLICY_CHANGED = 2;
}

message Alert {
  uint64 id = 1;
  uint32 number = 2;
  AlertStatus status = 3;
  AlertResolution resolution = 4;
  google.protobuf.Timestamp created_at = 5;
  uint64 repository_id = 6;
  uint64 organization_id = 7;
  uint64 enterprise_id = 8;
  string manifest_name = 9;
  uint32 manifest_line_number = 10;
  PackageManager package_ecosystem = 11;
  string package_name = 12;
  string package_version = 13;
  string license = 14;
  uint32 pull_request_number = 15;
}

enum AlertEventType {
  ALERT_EVENT_TYPE_UNKNOWN = 0;
  ALERT_EVENT_TYPE_REVIEW_REQUESTED = 1;
  ALERT_EVENT_TYPE_REVIEW_DENIED = 2;
  ALERT_EVENT_TYPE_EXCEPTION_ADDED = 3;
  ALERT_EVENT_TYPE_LICENSES_ADDED = 4;
  ALERT_EVENT_TYPE_CLOSED = 5;
  ALERT_EVENT_TYPE_REVIEW_APPROVED = 6;
}

message AlertEvent {
  uint64 id = 1;
  uint64 alert_id = 2;
  AlertEventType event_type = 3;
  uint64 user_id = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string event_body = 6;
}
