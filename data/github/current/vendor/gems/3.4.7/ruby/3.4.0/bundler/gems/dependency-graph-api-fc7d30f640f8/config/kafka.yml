default: &default
  # corresponds to auto.offset.reset Kafka config; false is "latest", true is "earliest"
  # NOTE: only honored the first time a NEW CONSUMER GROUP NAME is deployed; tracked
  #       offsets against the group name take precedent over this init-only setting.
  # https://kafka.apache.org/documentation/#consumerconfigs_auto.offset.reset
  # Setting START_FROM_BEGINNING env var will override to "true" in any env
  start_from_beginning: <%= !ENV["HYDRO_START_FROM_BEGINNING"].nil? %>

  package_metadata_topic: package_license_gateway.clearlydefined.v0.PackageMetadata

  package_release_topic: cp1-iad.ingest.github.dependencygraph.v0.PackageRelease

  snapshot_request_topic: cp1-iad.ingest.github.dependencygraph.v0.RequestPushSnapshot

  repo_manifest_file_change_topic: cp1-iad.ingest.github.dependencygraph.v1.RepositoryManifestFileChange

  repo_manifest_file_deleted_topic: cp1-iad.ingest.github.dependencygraph.v0.RepositoryManifestFileDeleted

  repo_deleted_topic: github.repositories.v1.Deleted

  repo_visibility_change_topic: github.repositories.v1.VisibilityChanged

  repo_archived_status_change_topic: cp1-iad.ingest.github.v1.RepositoryArchivedStatusChanged

  package_metadata_schema: "package_license_gateway.clearlydefined.v0.PackageMetadata"

  package_release_schema: "hydro.schemas.github.dependencygraph.v0.PackageRelease"

  repo_archived_status_change_schema: "hydro.schemas.github.v1.RepositoryArchivedStatusChanged"

  repo_deleted_schema: "hydro.schemas.github.repositories.v1.Deleted"

  repo_manifest_file_deleted_schema: "hydro.schemas.github.dependencygraph.v0.RepositoryManifestFileDeleted"

  repo_visibility_change_schema: "hydro.schemas.github.repositories.v1.VisibilityChanged"

  snapshot_request_schema: "hydro.schemas.github.dependencygraph.v0.RequestPushSnapshot"

  repo_manifest_file_change_schema: "hydro.schemas.github.dependencygraph.v0.RepositoryManifestFileChange"

development:
  <<: *default
  hydro_seed_brokers: <%= "127.0.0.1:9092".to_s.split %>
  client_id: dependency_graph
  snapshot_request_consumer_group: dependency_graph_snapshot_request
  repo_deleted_consumer_group: dependency_graph_repo_deleted
  package_release_consumer_group: dependency_graph_package_release
  repo_manifest_file_deleted_consumer_group: dependency_graph_repo_manifest_file_deletes
  repo_visibility_change_consumer_group: dependency_graph_repo_visibility_changed
  repo_manifest_file_change_consumer_group: dependency_graph_repo_manifest_file_changes
  repo_archived_status_change_consumer_group: dependency_graph_repo_archived_status_changed
  package_metadata_consumer_group: dependency_graph_package_metadata


test:
  <<: *default
  hydro_seed_brokers: <%= "127.0.0.1:9092".to_s.split %>
  client_id: dependency_graph
  snapshot_request_consumer_group: dependency_graph_snapshot_request
  repo_deleted_consumer_group: dependency_graph_repo_deleted
  package_release_consumer_group: dependency_graph_package_release
  repo_manifest_file_deleted_consumer_group: dependency_graph_repo_manifest_file_deletes
  repo_visibility_change_consumer_group: dependency_graph_repo_visibility_changed
  repo_manifest_file_change_consumer_group: dependency_graph_repo_manifest_file_changes
  repo_archived_status_change_consumer_group: dependency_graph_repo_archived_status_changed
  package_metadata_consumer_group: dependency_graph_package_metadata

production:
  <<: *default
  hydro_seed_brokers: <%= ENV["HYDRO_BROKERS_SSL"].to_s.split %>
  client_id: <%= ENV["KAFKA_CLIENT_ID"] %>
  # Wondering how these get populated? They are (mostly) stored in vault. The keys
  # are used in the base processor dynamically (search for "consumer_group").
  # Enterprise2 hardcodes a subset (only what's used) of these values in hcl.ctmpl .
  snapshot_request_consumer_group: <%= ENV["INGEST_SNAPSHOT_REQUEST_CONSUMER_GROUP"] %>
  repo_deleted_consumer_group: <%= ENV["REPO_DELETED_CONSUMER_GROUP"] %>
  package_release_consumer_group: <%= ENV["INGEST_PACKAGES_CONSUMER_GROUP"] %>
  repo_manifest_file_deleted_consumer_group: <%= ENV["REPO_MANIFEST_FILE_DELETED_CONSUMER_GROUP"] %>
  repo_visibility_change_consumer_group: <%= ENV["REPO_VISIBILITY_CHANGES_CONSUMER_GROUP"] %>
  repo_manifest_file_change_consumer_group: <%= ENV["REPO_MANIFEST_FILE_CHANGES_CONSUMER_GROUP"] %>
  repo_archived_status_change_consumer_group: <%= ENV["REPO_ARCHIVED_STATUS_CHANGE_CONSUMER_GROUP"] %>
  package_metadata_consumer_group: <%= ENV["PACKAGE_METADATA_CONSUMER_GROUP"] %>
