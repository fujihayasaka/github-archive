# Database configurations are specified here.
# The top level keys correspond to environments, with the special environment "all" applying to _all_ environments
# Merging keys from 'all' and environment-specific sections is done _shallowly_, so individual db configuration values are not merged.

# The values within a connection map directly to values on https://pkg.go.dev/github.com/go-sql-driver/mysql#Config.
# Values may contain environment variable references which will be expanded with os.Expand (https://pkg.go.dev/os#Expand).

# NOTE: Development-time values are hard-coded in internal/common/config/db.go so we don't have to deal with tracking down this file :).

all:
  "mysql1:ro":
    addr: db-mysql-github-ro.service.github.net
    user: mysql1_authnd_ro_0
    passwd: ${MYSQL_MYSQL1_RO_PASSWORD}
    dbname: github_production

  "authnd:rw":
    addr: db-mysql-authnd-production-rw.service.github.net
    user: ${MYSQL_AUTHND_RW_USER}
    passwd: ${MYSQL_AUTHND_RW_PASSWORD}
    dbname: authnd_production

  "authnd:ro":
    addr: db-mysql-authnd-production-ro.service.github.net
    user: ${MYSQL_AUTHND_RO_USER}
    passwd: ${MYSQL_AUTHND_RO_PASSWORD}
    dbname: authnd_production

  "collab:ro":
    addr: db-mysql-collab-ro.service.github.net
    user: ${MYSQL_COLLAB_RO_USER}
    passwd: ${MYSQL_COLLAB_RO_PASSWORD}
    dbname: github_production

  "collab:rw":
    addr: db-mysql-collab-rw.service.github.net
    user: ${MYSQL_COLLAB_RO_USER}
    passwd: ${MYSQL_COLLAB_RO_PASSWORD}
    dbname: github_production

  "lodge:ro":
    addr: db-mysql-lodge-ro.service.github.net
    user: ${MYSQL_LODGE_RO_USER}
    passwd: ${MYSQL_LODGE_RO_PASSWORD}
    dbname: lodge

  "lodge:rw":
    addr: db-mysql-lodge-rw.service.github.net
    user: ${MYSQL_LODGE_RO_USER}
    passwd: ${MYSQL_LODGE_RO_PASSWORD}
    dbname: lodge