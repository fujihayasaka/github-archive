syntax = "proto3";

package notifyd.api.newsies;
option go_package = "proto/services/newsies";
option ruby_package = "Notifyd::Proto::Newsies";

// Service to newsies workflows in notifyd. The purpose of this endoint is to
// assist with the migration and data sync from newsies to notifyd.
//
// If you you are an integrator and you find yourself using this endpoint for
// other purpose, please stop and contact with the notifications team.
service Newsies {
  rpc Watch(WatchRequest) returns (WatchResponse);
  rpc Unwatch(UnwatchRequest) returns (UnwatchResponse);
  rpc Ignore(IgnoreRequest) returns (IgnoreResponse);
  rpc UnwatchAll(UnwatchAllRequest) returns (UnwatchAllResponse);
}

enum ThreadTypes {
  ISSUE = 0;
  PULL_REQUEST = 1;
  RELEASE = 2;
  DISCUSSION = 3;
  SECURITY_ALERT = 4;
}

// Custom field of a subscription or routing setting
message CustomField {
  string name = 1;
  string value = 2;
}

// Request to watch specific specific Newsies list or Thread types
message WatchRequest {
  int64 user_id = 1;
  int64 ref_id = 2;
  string ref_type = 3;
  repeated ThreadTypes thread_types = 4;
  repeated CustomField custom_fields = 5;
}

// Response in return to Watch request
message WatchResponse {
  int64 user_id = 1;
  int64 ref_id = 2;
  string ref_type = 3;
}

// Request to cleanup watch subscriptions and settings for specific Newsies list or Thread types
message UnwatchRequest {
  int64 user_id = 1;
  int64 ref_id = 2;
  string ref_type = 3;
  repeated int64 ref_ids = 4;
}

// Request to cleanup all watch subscriptions and settings for a specific ref type
message UnwatchAllRequest {
  int64 user_id = 1;
  string ref_type = 2;
}

// Response in return to Watch request
message UnwatchResponse {
  int64 user_id = 1;
  int64 ref_id = 2;
  string ref_type = 3;
  repeated int64 ref_ids = 4;
}

// Response to UnwatchAllRequest
message UnwatchAllResponse {
  int64 user_id = 1;
  string ref_type = 2;
}

// Request to ignore specific Newsies list
message IgnoreRequest {
  int64 user_id = 1;
  int64 ref_id = 2;
  string ref_type = 3;
  repeated CustomField custom_fields = 4;
}

message IgnoreResponse {
  int64 user_id = 1;
  int64 ref_id = 2;
  string ref_type = 3;
}
