apiVersion: v1
kind: Service
metadata:
  name: notifyd-pprof-delete-user-repositories-workers
  labels:
    service: notifyd-pprof-delete-user-repositories-workers
  annotations:
    opaque.github.net/checks: >
      - http:
          url: http://{{.Instance.Name}}:8081/_ping
spec:
  ports:
    - name: pprof
      port: 8081
      protocol: TCP
      targetPort: pprof
  selector:
    app: notifyd-delete-user-repositories-workers
  type: ClusterIP
