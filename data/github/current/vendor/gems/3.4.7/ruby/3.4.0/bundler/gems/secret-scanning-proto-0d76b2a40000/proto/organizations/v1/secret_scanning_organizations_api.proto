syntax = "proto3";

package github.secretscanning.organizations.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/organizations";
option ruby_package = "GitHub::Proto::SecretScanning::Organizations::V1";

import "organizations/v1/organization.proto";

// OrganizationAPI defines the service to retrieve and handle organizations for
// the Secret Scanning Service.
service OrganizationAPI {
  // GetOrganization retrieves a specific organization mapped to the given identifier
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);

  // ListOrganizations retrieves a list of organizations
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
}

message GetOrganizationRequest {
  // a selection of how we are looking up the organization.
  oneof organization {
    // owner_id is the ID of the organization to look up. (required) */
    int64 owner_id = 1;
  }
}

message GetOrganizationResponse {
  // organization for the given identifier
  Organization organization = 1;
}

message ListOrganizationsRequest {
  // cursor represents an opaque object to be used to identify where to continue on a stream of organizations.
  bytes cursor = 1;

  // A selection for how we are looking up the organizations.
  oneof business {
    // business_id is the ID of the business(enterprise) to look up orgs for. (required)
    uint64 business_id = 2;
  }
}

message ListOrganizationsResponse {
  // a list of organizations
  repeated Organization organizations = 1;

 // next_cursor represents an opaque object to be used to identify where to continue on a stream of organizations.
  bytes next_cursor = 2;
}
