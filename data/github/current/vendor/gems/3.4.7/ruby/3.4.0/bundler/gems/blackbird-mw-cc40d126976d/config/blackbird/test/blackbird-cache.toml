# blackbird-cache config for integration (end2end) tests.
[metrics.exporter]
type = "noop"

[kafka.blackbird]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka:29096"
group_suffix = "002"

[kafka.potomac]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka:29096"
group_suffix = "002"

[redis.embeddings]
url = "redis://root@redis:6379"
password_env_var = "EMBEDDINGS_REDIS_PASSWORD"

[cluster.cache-001]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.cache001"

[cluster.cache-001.embeddings_client]
model = "text-embedding-3-small"
dimensions = 512
batch_size = 12
token_limit = 8000
max_retries = 10

[[cluster.cache-001.embeddings_client.backends]]
backend = "aip"
url = "https://blackbird-embedding-switzerlandnorth.openai.azure.com/openai/deployments/blackbird-embedding-3-small/embeddings?api-version=2024-02-15-preview"
secret_env_var = "AZURE_BLACKBIRD_EMBEDDING_SWITZERLANDNORTH_KEY"
max_concurrent_requests = 100

[cluster.cache-001.policy]
type = "rendezvous"

[cluster.cache-002]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.cache002"

[cluster.cache-002.policy]
type = "rendezvous"

[cluster.zeta]
index_dir = "unused but required"

[cluster.zeta.storage]
type = "emulator"
address = "azurite"
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.eta]
index_dir = "unused but required"

[cluster.eta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.theta]
index_dir = "unused but required"

[cluster.theta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init
