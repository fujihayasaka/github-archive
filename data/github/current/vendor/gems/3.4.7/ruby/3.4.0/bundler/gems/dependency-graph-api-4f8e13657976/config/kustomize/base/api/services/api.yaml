apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    service: dependency-graph-api
    role: api
  annotations:
    moda.github.net/timeout-connect: "10"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 9596
  selector:
    app: dependency-graph-api
    role: api
  type: LoadBalancer
