version: v1
plugins:
  - plugin: go
    out: ../gen/twirp/go
    opt: paths=source_relative
  - plugin: twirp
    out: ../gen/twirp/go
    opt: paths=source_relative
  - plugin: twirp_ruby
    out: ../gen/twirp/ruby
    opt: paths=source_relative
  - plugin: buf.build/protocolbuffers/ruby:v22.4
    out: ../gen/twirp/ruby
  - plugin: buf.build/bufbuild/validate-go
    out: ../gen/twirp/go
    opt: paths=source_relative