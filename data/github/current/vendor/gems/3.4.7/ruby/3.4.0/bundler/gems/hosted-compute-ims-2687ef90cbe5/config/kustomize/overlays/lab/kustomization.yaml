apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- "../../base/hosted-compute-ims-api"
- "../../base/hosted-compute-ims-worker"
- "../../base/servicemeshconfigs"

replicas:
- name: hosted-compute-ims-worker
  count: 2
- name: hosted-compute-ims-api
  count: 2

patches:
- path: patches/deployment-shared.yaml
  target:
    kind: Deployment
- path: patches/service-api.yaml
  target:
    kind: Service
    name: hosted-compute-ims
# NOTE: CronJobs are not run in Lab on purpose by not setting a cluster-perference to enable them in a single clustes