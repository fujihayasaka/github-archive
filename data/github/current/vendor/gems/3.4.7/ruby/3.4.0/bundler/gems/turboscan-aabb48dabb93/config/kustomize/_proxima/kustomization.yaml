bases:
  - ../_base/
patches:
  - path: ./configmaps/environment.yaml
  - path: ./servicemeshconfigs/servicemeshconfig.yaml
  - path: ./services/turboscan.yaml
  - target:
      annotationSelector: turboscan.github.net/single-cluster=true
    patch: |-
      - op: add
        path: /metadata/annotations/moda.github.net~1cluster-preferences
        value: |
          {
            "proxima-1-%stamp%-az1": {
              "spec": {
                "suspend": false
              }
            }
          }
