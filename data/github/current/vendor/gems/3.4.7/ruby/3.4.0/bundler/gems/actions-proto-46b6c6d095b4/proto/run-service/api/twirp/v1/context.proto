syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

import "run-service/api/twirp/v1/billing_plan_owner.proto";
import "run-service/api/twirp/v1/github_event_info.proto";
import "run-service/api/twirp/v1/properties.proto";
import "run-service/api/twirp/v1/tenant_info.proto";

message Context {
    // the extra information about the triggering github event.
    GitHubEventInfo github_event_info = 1;
    
    // the repository NWO which the event is received for
    string repository = 2;

    // the repository gloabl ID which the event is received for
    string repository_id = 3;

    // whether this repository is private or not
    bool private_repository = 4;

    // whether this repository is a fork or not
    bool forked_repository = 5;

    // when the owner (user or org) was created at
    string owner_created_at = 6;

    // for a forked repository, the parent repository's owner (org or user)
    string parent_repository_owner = 7;
    
    // for a forked repository, the parent repository's name
    string parent_repository_name = 8;

    // the repository tier. https://thehub.github.com/support/process/trust/tier-calculations/
    int64 repository_tier = 9;

    // whether this event is a pull request from a fork
    bool forked_pull_request = 10;

    // the billing plan owner data that includes the fully repository hierarchy (ex: enterprise/org/repo)
    BillingPlanOwner billing_plan_owner = 11;

    // the extra properties for the workflow run
    Properties properties = 12;

    // the repository database ID which the event is received for
    int64 repository_database_id = 13;

    // Use `invoking_user_id` inside the `github_event_info`
    string invoking_user_id = 14 [deprecated = true];
    
    // Use `invoking_user_name` inside the `github_event_info`
    string invoking_user_name = 15 [deprecated = true];
    
    // Use `invoking_user_database_id` inside the `github_event_info`
    int64 invoking_user_database_id = 16 [deprecated = true];
    
    // Use `event_ref` inside the `github_event_info`
    string event_ref = 17 [deprecated = true];
    
    // Use `event_sha` inside the `github_event_info`
    string event_sha = 18 [deprecated = true];
    
    // the user-provided name in the workflow YAML. https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#name
    string workflow_name = 19;

    // the database id in launch's workflow_builds table for the workflow run. https://github.com/github/launch/blob/a369d74596783497b7ef9551744ac470ee77f6aa/schemas/deployer/workflow_builds.sql#L2-L3
    int64 workflow_build_database_id = 20;

    // optional repository tenant info for interacting with actions-dotnet services.
    TenantInfo repository_tenant_info = 21;

    // optional organization tenant info for interacting with actions-dotnet services.
    TenantInfo organization_tenant_info = 22;

    // optional enterprise tenant info for interacting with actions-dotnet services.
    TenantInfo enterprise_tenant_info = 23;
}