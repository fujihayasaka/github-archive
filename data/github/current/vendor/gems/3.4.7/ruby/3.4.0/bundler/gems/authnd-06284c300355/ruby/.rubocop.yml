AllCops:
  Exclude:
    - "lib/authnd-client/proto/**/*.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/CaseLikeIf:
  Enabled: false

Style/Documentation:
  Enabled: false

Naming/FileName:
  Enabled: false

Metrics:
  Enabled: false

# Arbitrary line-length restrictions aren't helpful
Layout/LineLength:
  Enabled: false

# Trailing commas on multi-line lists are GOOD!
Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma