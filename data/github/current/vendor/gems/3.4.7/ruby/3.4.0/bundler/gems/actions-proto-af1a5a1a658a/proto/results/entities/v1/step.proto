syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "checks/v1/status.proto";
import "checks/v1/conclusion.proto";

package github.actions.results.entities.v1;

// Step is an action within a job
message Step {
  // External ID from actions
  string external_id = 1;
  // Zero indexed order in the list of steps for a job
  int64 number = 2;
  // The name for the UI
  string name = 3;
  // Step status
  checks.v1.Status status = 4;
  // Step conclusion
  checks.v1.Conclusion conclusion = 5;
  // When the check started
  google.protobuf.Timestamp started_at = 6;
  // When the check completed
  google.protobuf.Timestamp completed_at = 7;
  // The completed log url
  google.protobuf.StringValue completed_log_url = 8; // optional
  // The number of completed log lines
  google.protobuf.Int64Value completed_log_lines = 9; // optional
}

message Steps {
  repeated Step steps = 1;
}
