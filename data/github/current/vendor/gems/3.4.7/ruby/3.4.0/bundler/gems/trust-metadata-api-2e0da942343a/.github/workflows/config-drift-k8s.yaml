name: Detect Kubernetes config drift

on:
  pull_request:
    paths:
      - 'config/generator/templates/kustomize/**'
      - 'config/generator/gen-moda*.sh'
      - 'config/kustomize/**'
      - 'config/kubernetes/**'

jobs:
  compare-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.0.0
      - name: Install gh-kustomize
        run: gh extension install github/gh-kustomize
        env:
            GH_TOKEN: ${{ secrets.GH_KUSTOMIZE_READ_ONLY }}
      - name: Run gen-moda-all.sh
        run: |
          cd ./config/generator
          ./gen-moda-all.sh
      - name: Verify no file changes
        run: |
          git diff --exit-code
          if [ $? -ne 0 ]; then
            echo "Error: Files were changed. Did you alter config files without updating scripts/templates in config/generator?"
            exit 1
          fi
