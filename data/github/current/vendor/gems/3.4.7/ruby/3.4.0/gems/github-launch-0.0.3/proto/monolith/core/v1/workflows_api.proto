syntax = "proto3";

package actions.core.v1;

option go_package = "core/v1";
option ruby_package = "MonolithTwirp::Actions::Core::V1";

service WorkflowsAPI {
  // FilterActiveWorkflows filters down a list of workflows in a repository if they are active (not disabled).
  // Note: Any workflows _not found_ will be considered active, since they may have not yet been created.
  rpc FilterActiveWorkflows(FilterActiveWorkflowsRequest) returns (FilterActiveWorkflowsResponse);
}

message FilterActiveWorkflowsRequest {
  // The repository containing the workflows
  int64 repository_id = 1;
  // The paths of the workflows to find
  repeated string workflow_paths = 2;
}

message FilterActiveWorkflowsResponse {
  // Workflows that are not disabled
  repeated string workflow_paths = 1;
}
