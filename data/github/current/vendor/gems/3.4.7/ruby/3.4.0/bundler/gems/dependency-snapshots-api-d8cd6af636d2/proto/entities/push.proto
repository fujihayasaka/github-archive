syntax = "proto3";

import "google/protobuf/timestamp.proto";

package github.dependency_snapshots_api.entities;

option go_package = "proto/entities";

// This is _loosely_ based on https://github.com/github/hydro-schemas/blob/main/proto/hydro/schemas/github/v1/repository_push.proto,
// as well as the Push class in github/github.

// Given a snapshot, you can get this information within the monolith like this:
// push = Push.find_by(repository_id: snapshot.repository_id, after: snapshot.sha)
// commits = Push.commits

message Push {
  // SHA of the ref before and after the push
  string before = 1;
  string after = 2;

  // the latest commit timestamp
  google.protobuf.Timestamp committed_at = 3;

  // The ref that was pushed to
  string ref = 4;

  // NOTE: these timestamps are not part of the hydro schema, but they are part of the Push class
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp pushed_at = 7;

  // defined here: https://github.com/github/github/blob/24cef8cb65b208a7d52fb4d400a07ffe54d81a02/app/helpers/repos/activity_view_dependency.rb#L22
  enum ActivityType {
    PUSH = 0;
    FORCE_PUSH = 1;
    BRANCH_CREATION = 2;
    BRANCH_DELETION = 3;
    PR_MERGE = 4;
    DIRECT_PUSH = 5;
    MERGE_QUEUE_MERGE = 6;
  }
  ActivityType push_type = 8;
}
