syntax = "proto3";

package github.spokes.merges.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/merges";
option ruby_package = "GitHub::Spokes::Proto::Merges::V1";

// MergeBaseType encapsulates the possible algorithms for computing merge
// bases.
enum MergeBaseType {
    // MERGE_BASE_TYPE_INVALID indicates an invalid merge base type.
    MERGE_BASE_TYPE_INVALID = 0;

    // MERGE_BASE_TYPE_SINGLE indicates a request for a single merge base using
    // the default algorithm.
    MERGE_BASE_TYPE_SINGLE = 1;

    // MERGE_BASE_TYPE_ALL indicates a request for all of the merge bases.
    MERGE_BASE_TYPE_ALL = 2;

    // MERGE_BASE_TYPE_BEST indicates a request for a single merge base using
    // our best merge base algorithm.
    MERGE_BASE_TYPE_BEST = 3;
}
