syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

// ReferenceUpdate represents a single update to a ref identified by the ref name, and a before and after commit.
message ReferenceUpdate {
    bytes name = 1;
    string before_oid = 2;
    string after_oid = 3;
}