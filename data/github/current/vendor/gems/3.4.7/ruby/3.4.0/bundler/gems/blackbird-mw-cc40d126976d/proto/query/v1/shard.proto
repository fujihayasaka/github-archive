syntax = "proto3";

package blackbirdmw.query.v1;

import "google/protobuf/timestamp.proto";

import "hydro/schemas/blackbird/v0/entities/epoch_mode.proto";

option go_package = "query/v1";
option ruby_package = "Blackbird::Query::V1";

message ShardMetadata {
  // Hostname of the shard
  string hostname = 1;
  // The amount of time spent executing query and receiving response
  int64 response_micros = 2;
  // Query stats returned by an individual shard
  QueryStats stats = 3;
  // Indicates that there was an error talking to a particular shard.
  string error = 4;
  // Metadata about the blackbird shard software and index.
  ShardStatus status = 6;

  reserved 5; // uint32 retries
}

message QueryStats {
  // A value representing the cost of executing this query. To be used for quotas, metrics, etc.
  float cost = 17;
  // The number of documents returned from posting lists that had their content
  // fetched, either from cache or RPC
  uint32 docs_retrieved = 1;
  // Number of candidates before any deduplication. A candidate is a document +
  // location pair which has matched the query.
  uint32 docs_scored = 5;
  uint32 locations_retrieved = 14;
  uint32 locations_scored = 15;
  uint32 iters_created = 16;
  // Total time spent scoring for this query
  uint32 scoring_duration_micros = 8;
  // True if a server error occurred in query processing. The results are not
  // necessarily empty, but may be incomplete or suboptimal.
  bool had_panic = 9;
  // True if this query timed out. The results are not necessarily empty, but
  // may be incomplete or suboptimal.
  bool had_timeout = 10;
  bool hit_retrieval_limit = 11;
  bool hit_scoring_limit = 12;
  bool hit_return_limit = 13;

  reserved 2;  // uint32 docs_fetched_failed
  reserved 3;  // uint32 docs_rejected_due_to_content_validation
  reserved 4;  // uint32 docs_rejected_due_to_meta_validation
  reserved 6;  // uint32 num_candidates_after_ref_deduplication
  reserved 7;  // uint32 num_candidates_after_path_deduplication
}

message ShardStatus {
  // The index version that this server is currently running.
  uint32 index_version = 1;
  // Sha from which the current binary was built
  string sha = 2;
  // The latest snapshot topic offset up to which the shard can serve.
  int64 serving_offset = 3;

  // Vergen build timestamp for the running code.
  google.protobuf.Timestamp build_timestamp = 4;

  // Epoch id this server is currently serving.
  uint32 epoch_id = 5;
  // Which indexing mode is being run for the epoch.
  hydro.schemas.blackbird.v0.entities.EpochMode epoch_mode = 6;
}
