syntax = "proto3";

package github.secretscanning.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

// Service for enablement status queries
service EnablementStatusAPI {
  rpc GetEnablementStatusForOrg(GetEnablementStatusForOrgRequest) returns (GetEnablementStatusForOrgResponse);
}

message GetEnablementStatusForOrgRequest {
  uint64 org_id = 1;
}

message GetEnablementStatusForOrgResponse {
  // True if results_visible is true for all repositories for this org
  bool secret_scanning_enabled_on_all_repos = 1;
}
