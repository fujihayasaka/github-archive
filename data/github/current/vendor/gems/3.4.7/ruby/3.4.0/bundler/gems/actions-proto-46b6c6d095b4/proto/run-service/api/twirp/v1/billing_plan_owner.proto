syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

message BillingPlanOwner {
    string id = 1;
    string plan_sku = 2;
    string type = 3;
    string name = 4;
    string tenant_name = 5;
    string organization_id = 6;
    string organization_tenant_name = 7;
    string organization_name = 8;
    int64 organization_database_id = 9;
    int64 database_id = 10;
    int64 customer_id = 11;
}