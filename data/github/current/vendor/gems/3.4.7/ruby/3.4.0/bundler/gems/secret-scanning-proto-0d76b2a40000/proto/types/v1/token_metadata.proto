syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

// Metadata for token
message TokenMetadata {
    // the token type (ex: CLOJARS_DEPLOY_TOKEN, cp_1234)
    string token_type = 1;
    // the token slub (ex: clojars_deploy_token)
    string slug = 2;
    // the friendly display name
    string label = 3;
    // the partner token provider (ex: CLOJARS, AWS...) or "CUSTOM_PATTERN" for custom patterns
    string provider = 4;
}
