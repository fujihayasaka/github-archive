repos:
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: 62acdd0e6aaf398eb04af4a6fcd97a9f3f538668 # v0.1.22
    hooks:
      - id: gofmt
  - repo: https://github.com/golangci/golangci-lint
    # be careful when updating this version that we aren't losing linters, golangci-lint has historically disabled linters when needed to support later Go versions, for example.
    # make sure this doesn't change independent of the version set in our Makefile.
    rev: v1.54.2
    hooks:
      - id: golangci-lint
