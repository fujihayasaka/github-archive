- op: add
  path: /spec/template/spec/volumes
  value:
  - name: azure-auth
    hostPath:
      path: /minikube-host/.azure
- op: add
  path: /spec/template/spec/containers/0/volumeMounts
  value:
    - name: azure-auth
      mountPath: /home/github/.azure
- op: add
  path: /spec/template/spec/securityContext
  value:
    supplementalGroups:
    - 127
    - 1000