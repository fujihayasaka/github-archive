apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-ingestionv1
  annotations:
    moda.github.net/vpa-updater-enabled: 'true'
spec:
  replicas: 12
  selector:
    matchLabels:
      app: usage-ingestionv1
  template:
    metadata:
      labels:
        app: usage-ingestionv1
      annotations:
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: billing
        fluentbit.io/parser: logfmt
    spec:
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 80
      containers:
      - name: usage-ingestionv1
        image: billing-platform
        command: ["./bin/queue-worker"]
        env:
        - name: script
          value: build
        - name: HYDRO_CONSUMER_GROUP_ID
          value: "usage-ingestion-production-consumerV2"
        - name: WORKER_TYPE
          value: "usage-ingestion"
        - name: STATS_ADDR
          value: "$(KUBE_NODE_HOSTNAME):28125"
        - name: APP_SHA
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['heaven.githubapp.com/sha']
        - name: APP_REF
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['heaven.githubapp.com/ref']
        envFrom:
          - configMapRef:
              name: environment
          - configMapRef:
              name: kube-cluster-metadata
          - secretRef:
              name: vault-secrets
        readinessProbe:
          exec:
            command:
             - cat
             - /tmp/consumer_healthy
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 0.4
            memory: "1024Mi"
          limits:
            # Adjust GOMAXPROCS in tandem. It's recommended the cpu limit be set to GOMAXPROCS+1.
            cpu: 3.0
            memory: "4096Mi"
