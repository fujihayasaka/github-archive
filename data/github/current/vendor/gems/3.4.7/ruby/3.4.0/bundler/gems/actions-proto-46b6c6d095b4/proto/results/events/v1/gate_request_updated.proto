syntax = "proto3";

import "run-service/contracts/v1/gate_request.proto";

package github.actions.results.events.v1;

message GateRequestUpdated {
  // ID used to keep track of requests through each service
  string plan_id = 1;
  // Updated GateRequest object
  github.actions.run_service.contracts.v1.GateRequest gate_request = 2;
}
