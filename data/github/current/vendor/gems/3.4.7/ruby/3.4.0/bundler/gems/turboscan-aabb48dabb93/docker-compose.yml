services:
  vtcombo:
    image: 'docker.io/vitess/vttestserver:mysql80@sha256:bf09f897dadc3855162febbcf2d4bf61e0647dc53adcf415bcd5bdd7195bc635'
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "mysql", "-u", "root", "-P", "13307", "-h", "127.0.0.1", "-e", "quit" ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
    container_name: turboscan-vtcombo
    environment:
      MYSQL_FLAVOR: ${VTCOMBO_MYSQL_FLAVOR:-MySQL80}
    expose:
      - "13307"
    ports:
      - "127.0.0.1:13307:13307"
    x-topology: &topology |
      {
        "keyspaces": [
          {
            "name": "turboscan_development_ks",
            "shards": [
              {
                "name": "0",
                "db_name_override": "turboscan_development"
              }
            ]
          },
          {
            "name": "turboscan_test_ks",
            "shards": [
              {
                "name": "0",
                "db_name_override": "turboscan_test"
              }
            ]
          }
        ]
      }
    entrypoint: [
        "/vt/bin/vtcombo",
        "--schema_dir", "/schemas/",
        "--queryserver-config-max-result-size", "500000",
        "--mysql_server_port", "13307",
        "--mysql_server_bind_address", "0.0.0.0",
        "--mysql_auth_server_impl", "none",
        "--db_app_user", "root",
        "--db_allprivs_user", "root",
        "--db_appdebug_user", "root",
        "--db_dba_user", "root",
        "--db_repl_user", "root",
        "--db_host", "db",
        "--db_port", "13806",
        "--json_topo", *topology,
        "--queryserver-config-schema-change-signal=1",
        "--health_check_interval=1s",
        "--schema_change_signal",
        "--planner-version", "v3",
        "--db_charset", "utf8mb4"
    ]
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: turboscan-mysql
    command: --datadir=${MYSQL_DATADIR:-/var/lib/mysql} --port 13806 --log_error_verbosity=${MYSQL_LOG_LEVEL:-2} --max-connections=20100 --server-id=1 --sql_mode="STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,ONLY_FULL_GROUP_BY,NO_ENGINE_SUBSTITUTION" --enforce-gtid-consistency="ON" --gtid-mode="ON"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    expose:
      - "13806"
    ports:
      - "127.0.0.1:13806:13806"
    tmpfs:
      - "/var/lib/mysql-tmpfs"
    volumes:
      - "db-data:/var/lib/mysql"
    healthcheck:
      test: [ 'CMD', 'mysql', '-u', 'root', '-P', '13806', '-h', '127.0.0.1', '-e', 'quit' ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
  azure:
    image: mcr.microsoft.com/azure-storage/azurite@sha256:2628ee10a72833cc344b9d194cd8b245543892b307d16cf26a2cf55a15b816af
    container_name: turboscan-azure
    expose:
      - "10000"
    ports:
      - "127.0.0.1:10000:10000"
    command: ["azurite-blob", "--blobHost", "0.0.0.0"]
  s3:
    image: minio/minio:RELEASE.2022-10-29T06-21-33Z
    container_name: turboscan-minio
    command: ["server", "/export"]
    environment:
      MINIO_ACCESS_KEY: "minio"
      MINIO_SECRET_KEY: "miniostorage"
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: [ 'CMD', 'curl', 'http://localhost:9000/minio/health/live' ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
  elasticsearch8:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: turboscan-elasticsearch8
    command: ["elasticsearch", "-E", "logger.org.elasticsearch=${ES_LOG_LEVEL:-WARN}"]
    ports:
      - "127.0.0.1:9402:9402"
    volumes:
      - "es8-data:/usr/share/elasticsearch/data"
    environment:
      - action.auto_create_index=false
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - http.port=9402
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=changeme
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    healthcheck:
      test: [ 'CMD', 'curl', '-u', 'elastic:changeme', 'http://localhost:9402/_cluster/health' ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
    ulimits:
      memlock:
        soft: -1
        hard: -1
  aqueduct-lite:
    image: ghcr.io/github/aqueduct-lite/aqueduct-lite:f1ea91f2de06e069a0a2a762a341e0e013610062@sha256:bab66a31221fff787d6de3f4be54b246e8d63e7d36a2a2a77aa2ff6b2b53214c
    platform: linux/amd64
    profiles:
      - processor
    expose:
      - '18081'
    ports:
      - '127.0.0.1:18081:18081'
    depends_on:
      redis:
        condition: service_healthy
    command: bin/aqueduct-lite --redis-address redis:16379 --listen-address 0.0.0.0:18081
    healthcheck:
      test: [ 'CMD', 'netcat', '-z', '127.0.0.1', '18081' ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
  redis:
    image: redis:5.0
    profiles:
      - processor
    expose:
      - '16379'
    ports:
      - '127.0.0.1:16379:16379'
    command: --daemonize no --bind 0.0.0.0 --port 16379
    healthcheck:
      test: [ 'CMD', 'bash', '-c', 'cat < /dev/null > /dev/tcp/localhost/16379' ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
  kafka:
    image: ghcr.io/github/actions-broker/kafka-lite:1e0ffb80fc6ffbcfa263bafa43cf414d621456210dfb10641a0daa17772b700c
    profiles:
      - processor
    expose:
      - '9092'
    ports:
      - '127.0.0.1:9092:9092'
    platform: linux/amd64
    healthcheck:
      test: [ 'CMD', 'netcat', '-z', '127.0.0.1', '9092' ]
      interval: 1s
      timeout: 10s
      retries: 30
      start_period: 10s
    command: |
      /kafka-lite \
        --listen-address 0.0.0.0:9092 \
        --advertised-listener-address localhost:9092 \
        --max-message-bytes 200000000 \
        --seed-topic cp1-iad.ingest.turboscan.v0.AlertEvent:1 \
        --seed-topic code_scanning.v0.NewAnalysis:1 \
        --seed-topic code_scanning.v0.ProcessedAnalysis:1 \
        --seed-topic code_scanning.v0.FailedAnalysis:1
volumes:
  db-data:
    driver: local
  es8-data:
    driver: local
