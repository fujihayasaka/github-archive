name: Proto Generation
on: [push]
jobs:
  Ensure-Proto-Generation-Is-Up-To-Date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: dependency-snapshots-api
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run protogen
        run: script/protogen/protogen
      - name: Check for git changes
        run: |
          if [[ `git status --porcelain` ]]; then
            echo "Git Repository changes were detected, this indicates you need to either regenerate client proto or server proto. Run 'make proto' locally. Make sure your local docker images are current."
            exit 1
          else
            echo "No proto related changes detected."
          fi
