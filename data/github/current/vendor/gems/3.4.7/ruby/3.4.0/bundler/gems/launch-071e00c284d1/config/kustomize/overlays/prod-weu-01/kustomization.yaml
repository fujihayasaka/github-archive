apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- static-config.yaml
- ../../base/cronjobs/launch-frequent-jobs
- ../../base/cronjobs/launch-heal-workflows
- ../../base/cronjobs/launch-incomplete-workflows
- ../../base/launch-chatops
- ../../base/launch-chatops/poddisruptionbudget
- ../../base/launch-deployer
- ../../base/launch-deployer/poddisruptionbudget
- ../../base/launch-hydro-consumer
- ../../base/launch-hydro-consumer/poddisruptionbudget
- ../../base/launch-receiver
- ../../base/launch-receiver/poddisruptionbudget
- ../../base/launch-worker
- ../../base/launch-worker/poddisruptionbudget
- ../../base/servicemeshconfig

components:
# Order matters here!  components/baseline should generally come first.
- ../../base/components/baseline
- ../../base/components/proxima

patches:
- path: patches/launch-chatops-deployment.yaml
- path: patches/launch-chatops-service.yaml
- path: patches/launch-deployer-deployment.yaml
- path: patches/launch-deployer-service.yaml
- path: patches/launch-frequent-jobs-cronjob.yaml
- path: patches/launch-heal-workflows-cronjob.yaml
- path: patches/launch-hydro-consumer-deployment.yaml
- path: patches/launch-hydro-consumer-service.yaml
- path: patches/launch-incomplete-workflows-cronjob.yaml
- path: patches/launch-receiver-deployment.yaml
- path: patches/launch-receiver-internal-service.yaml
- path: patches/launch-receiver-service.yaml
- path: patches/launch-worker-deployment.yaml
- path: patches/launch-worker-service.yaml


patchesStrategicMerge:
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: launch
    $patch: delete