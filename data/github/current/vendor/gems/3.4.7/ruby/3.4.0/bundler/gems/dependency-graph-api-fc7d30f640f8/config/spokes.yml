default: &default
  base_uri: <%= ENV["SPOKES_BASE_URI"] %>
  connection_open_timeout: <%= ENV.fetch("SPOKES_CONN_OPEN_TIMEOUT", 5) %>
  connection_read_timeout: <%= ENV.fetch("SPOKES_CONN_READ_TIMEOUT", 10) %>
development:
  <<: *default
  base_uri: "http://127.0.0.1:28081"
test:
  <<: *default
  base_uri: "http://127.0.0.1:12080"
production:
  <<: *default
  connection_open_timeout: <%= ENV.fetch("SPOKES_CONN_OPEN_TIMEOUT", 2) %>
  connection_read_timeout: <%= ENV.fetch("SPOKES_CONN_READ_TIMEOUT", 5) %>
