apiVersion: v1
kind: ConfigMap
metadata:
  name: environment
data:
  SPOKES_URL: "http://spokesd.spokesd-%stamp%.svc.cluster.local"
  AZURE_STORAGE_BLOB_ENDPOINT: "https://ghdsapi%stamp_without_separators%.blob.core.windows.net/"
  MONOLITH_TWIRP_URL: "http://unicorn-internal-api.github-%stamp%.svc.cluster.local/internal"
  CHATOPS_BASE_URL: "https://dependency-snapshots-api.service.%stamp%.github.net/"

  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otelcol-mesh.otelcol-production.svc.cluster.local:14318/v1/traces"
  FAILBOT_HAYSTACK_URL: "http://failbotg.failbotg-%stamp%.svc.cluster.local/api/needles"

  # Vitess not supported on Proxima, using mysql
  DEPENDENCY_SNAPSHOTS_DB_HOST: "db-mysql-%stamp%-rw.service.%stamp%.github.net"
  DEPENDENCY_SNAPSHOTS_DB: "dependency_snapshots_api"
  DEPENDENCY_SNAPSHOTS_DB_PORT: "6033"

  APP_ENV: "proxima"

  VEXI_HYDRO_BROKERS: "hydro-kafka-%stamp%-%stamp%.service.%stamp%-az1.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az2.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az3.consul:9093"
  MYSQL_TLS_CONFIG: "skip-verify"
