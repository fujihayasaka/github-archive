syntax = "proto3";

package github.spokes.repositories.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/repositories";
option ruby_package = "GitHub::Spokes::Proto::Repositories::V1";

// ReplicaItem contains information about a replica of a repository.
message ReplicaItem {
    // ip is the ip address of the replica.
    string ip = 1;
    // absolute_path is the path for the repository on disk.
    string absolute_path = 2;
    // name of the host that holds the replica.
    // NOTE: only use this field to match up the replicas (like a primary key), but not for anything else.
    string host_name = 3;
    // replica type indicates how a 'git push' should use this replica.
    ReplicaType route_type = 4;
}

enum ReplicaType {
    // This may be used if the type is not known.
    REPLICA_TYPE_INVALID = 0;

    // Equivalent to "noerror" from gitauth. This is returned, for example,
    // when a replica is non-voting or has an unexpected checksum.
    REPLICA_TYPE_NOERROR = 1;

    // Equivalent to no value from gitauth.
    REPLICA_TYPE_NORMAL = 2;
}
