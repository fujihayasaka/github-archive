syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/extensions/v1/field_options.proto";

import "spokes-api/types/v1/reference.proto";
import "spokes-api/types/v1/object_id.proto";

// DistinctCommitsSelector is a selector for locating commits that are
// unique to the target branch in a repository.
message DistinctCommitsSelector {
    github.spokes.types.v1.Reference reference = 1;

    // The point in the ref's history to start the search from.
    // If omitted, the head of the reference will be used.
    github.spokes.types.v1.ObjectID oid = 3;

    // A maximum of 10 OIDs can be excluded from the results.
    repeated github.spokes.types.v1.ObjectID exclude_oids = 2 [(github.spokes.extensions.v1.limit) = 10];
}
