# This Dockerfile is being used in script/generate-twirp and not used in any CI
# or development
FROM golang:1.23-bullseye
RUN apt-get update && apt-get install -y unzip

COPY .dependency_versions.env .
RUN . ./.dependency_versions.env && \
    wget "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOBUF_VERSION/protoc-$PROTOBUF_VERSION-linux-x86_64.zip" && \
    unzip "protoc-$PROTOBUF_VERSION-linux-x86_64.zip" -d "/protobuf" && \
    go install github.com/twitchtv/twirp/protoc-gen-twirp@$PROTOC_GEN_TWIRP_VERSION && \
    go install google.golang.org/protobuf/cmd/protoc-gen-go@$PROTOC_GEN_GO_VERSION && \
    go install github.com/arthurnn/twirp-ruby/protoc-gen-twirp_ruby@$PROTOC_GEN_TWIRP_RUBY_VERSION

ENTRYPOINT ["/protobuf/bin/protoc", "-I/protobuf"]