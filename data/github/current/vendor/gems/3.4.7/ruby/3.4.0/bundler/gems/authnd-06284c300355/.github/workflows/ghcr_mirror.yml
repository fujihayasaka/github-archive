name: Mirror image to GHCR
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  authnd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log into registry
        run: echo "${{ secrets.CONTAINER_BUILDER_TOKEN }}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

      - name: Build containers
        run: docker build -f Dockerfile -t ghcr.io/${{ github.repository }}/authnd-focal:${{ github.sha }} .
        env:
          GITHUB_TOKEN: ${{ secrets.CONTAINER_BUILDER_TOKEN }}

      - name: Push result to GPR
        run: |
          docker push ghcr.io/${{ github.repository }}/authnd-focal:${{ github.sha }}
