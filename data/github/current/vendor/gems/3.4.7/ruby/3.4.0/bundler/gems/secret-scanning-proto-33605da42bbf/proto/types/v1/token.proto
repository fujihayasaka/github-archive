syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

enum TokenResolution {
  NO_RESOLUTION = 0;
  REVOKED = 1;
  FALSE_POSITIVE = 2;
  reserved 3;
  WONT_FIX = 4;
  REOPENED = 5;
  USED_IN_TESTS = 6;
  PATTERN_DELETED = 7;
  PATTERN_EDITED = 8;
  HIDDEN_BY_CONFIG = 9;
}

enum TokenValidity {
  TOKEN_VALIDITY_UNKNOWN = 0;
  TOKEN_VALIDITY_ACTIVE = 1;
  TOKEN_VALIDITY_INACTIVE = 2;
  TOKEN_VALIDITY_REVOKED = 3;
  TOKEN_VALIDITY_UNVERIFIABLE = 4;
}
