kind: Deployment
metadata:
  name: trust-metadata-api
spec:
  template:
    spec:
      containers:
        - name: trust-metadata-api
          env:
            - name: TMA_AZURE_BLOB_ACCOUNT
              value: "tmastaging"
            - name: TMA_AZURE_BLOB_CONTAINER
              value: "attestations"
            - name: TMA_TUF_MIRROR
              value: "https://github.github.com/staging-tuf-root"
            # the Azure tenant ID used to authenticate with Azure with a service principal
            - name: TMA_RELEASES_SAN
              value: "https://staging-dotcom.releases.github.com"
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_non_prod_tenant_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_non_prod_client_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_non_prod"
            # https://github.com/github/github-telemetry-go/blob/main/README.md?plain=1#L66-L69
            - name: GITHUB_TELEMETRY_ENVIRONMENT
              value: "development"
            - name: TMA_TRUSTED_KEYS
              value: |
                {
                  "SHA256:JXkT/aBM9baLZ7dpjJLQhJrj3Ru5s/OSXoZzZsPUyhg": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEztMhKw7mGA6DV6Cc510h10d/KFISm3fIue5AoZiKjh+noDv0bxxzr780F/tkqqw80+hSnJXKj7DuUyRD0IZH3A==",
                  "SHA256:jm5oBa2I8iiBLJLPfJr8GxskLwCDwV3TQ2bFaJ42ZZs": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAER+/o25U8hqvV1VCEPNUFN14dwpV0JYZe7YCDNHCGsuzOyP24PQpLg1PpgVoljRHwuPsSDxI5n77NoI2ByZg3iw=="
                }
            - name: TMA_LOG_LEVEL
              value: "debug"
          envFrom:
            - secretRef:
                name: vault-secrets
