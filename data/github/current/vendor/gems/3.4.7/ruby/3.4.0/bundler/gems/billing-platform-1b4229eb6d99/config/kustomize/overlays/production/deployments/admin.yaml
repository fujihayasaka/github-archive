apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "canary"
spec:
  selector:
    matchLabels:
      canary: "production"
  template:
    metadata:
      labels:
        canary: "production"
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: admin
          env:
            - name: BILLING_PLATFORM_DB_READ_ONLY_SPN_TENANT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_billing_platform_cosmosdb_ro_prod_tenant_id
                  name: vault-secrets
            - name: BILLING_PLATFORM_DB_READ_ONLY_SPN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_billing_platform_cosmosdb_ro_prod_client_id
                  name: vault-secrets
            - name: BILLING_PLATFORM_DB_READ_ONLY_SPN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: spn_billing_platform_cosmosdb_ro_prod
                  name: vault-secrets
