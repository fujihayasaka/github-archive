# http://kubernetes.io/docs/user-guide/deployments/#what-is-a-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: launch-receiver
spec:
    # TODO allow dynamic configuration of replica size.
    replicas: 2
    template:
        metadata:
            # Labels are applied to all pods created by this deployment so we can
            # tell the service load balancer where to send traffic.
            # http://kubernetes.io/docs/user-guide/labels/
            labels:
                service: launch-receiver
        spec:
            dnsPolicy: ClusterFirst
            containers:
                - name: launch-receiver
                  resources:
                    requests:
                        # Recommendations: https://app.datadoghq.com/s/59fe6c40c/yiw-snn-zrt
                        cpu: "25m"
                        memory: "250Mi"
                    limits:
                        # Adjust GOMAXPROCS in tandem. It's recommended the cpu limit be set to GOMAXPROCS+1.
                        cpu: "2"
                        memory: "500Mi"
                  envFrom:  # order matters! Subsequent entries can override earlier entries.
                    - configMapRef:
                        name: kube-cluster-metadata
                    - secretRef:
                        name: vault-secrets
                    - configMapRef:
                        name: static-config
                  env:
                    - name: KUBE_POD
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                    - name: KUBE_NAMESPACE
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                    # The HTTP_ADDR and INTERNAL_ADDR should be different for receiver.
                    # Only webhooks related endpoints should be exposed via HTTP_ADDR.
                    - name: HTTP_ADDR
                      value: ":6824"
                    - name: INTERNAL_ADDR
                      value: ":6825"
                    - name: DEPLOYER_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: deployer-hmac-secret
                    - name: KREDZ_HTTP_ADDR
                      value: "http://kredz.kredz-%stamp%.svc.cluster.local:80"
                    - name: KREDZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: kredz-hmac-secret
                    - name: BILLING_PLATFORM_URL
                      value: "http://billing-platform.billing-platform-%stamp%.svc.cluster.local:8989"
                    - name: BILLING_PLATFORM_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: billing-platform-hmac-secret
                    - name: VARZ_HTTP_ADDR
                      value: "http://kredz-varz.kredz-%stamp%.svc.cluster.local:80"
                    - name: VARZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: varz-hmac-secret
                    - name: NETWORK_CONFIGURATION_SERVICE_URL
                      value: "https://cps-network-service-staffship.githubapp.com"
                    - name: CPS_NETWORK_SERVICE_HMAC_SECRETS
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: cps-network-service-hmac-secrets
                    - name: EARTHSMOKE_CUSTOM_TASKS_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: earthsmoke-custom-tasks-key
                    - name: EARTHSMOKE_DEPENDABOT_SECRETS_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: earthsmoke-dependabot-secrets-key
                    - name: EMULATE_PREPARED_STATEMENTS
                      value: "true"
                    - name: USE_UTC_FOR_MYSQL
                      value: "true"
                    - name: FORCE_CHARSET_FOR_MYSQL
                      value: "true"
                    - name: LAUNCH_FRENO_URL
                      value: "https://freno-gh.service.staff-wus2-01.github.net"
                    - name: LAUNCH_FRENO_OVERRIDE_CLUSTER
                      value: "staffship"
                    - name: LAUNCH_REDIS_URL
                      value: "db-redis-launch-%stamp%.redis.cache.windows.net:6380"
                    - name: LAUNCH_REDIS_USE_TLS
                      value: "true"
                    - name: LAUNCH_REDIS_USERNAME
                      value: "default"
                    - name: LAUNCH_REDIS_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: launch-redis-secret
                    - name: KAFKA_ROOT_CA_PATH
                      value: "/etc/ssl/certs/cp1-iad-production-1487801205-root.pem"
                    - name: KAFKA_BROKERS
                      value: "hydro-kafka-%stamp%-boot-1.service.%stamp%.github.net:9093,hydro-kafka-%stamp%-boot-2.service.%stamp%.github.net:9093,hydro-kafka-%stamp%-boot-3.service.%stamp%.github.net:9093"
                    # As of July 2024, RECEIVER_URL is not used to make service-to-service calls within the cluster's service mesh.
                    # For this reason, it should remain "unmeshified."
                    - name: RECEIVER_URL
                      value: "https://launch-receiver.%stamp%.ghe.com"
                    # RECEIVER_INTERNAL_URL is used for run-service to make requests to the receiver for requesting pre_job_info, ex: GITHUB_TOKEN
                    - name: RECEIVER_INTERNAL_URL
                      value: "https://launch-receiver-internal.service.%stamp%.github.net"
                    - name: ACTION_RUNNER_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: receiver-action-runner-secret
                    - name: GITHUB_ACTIONS_APP_IDS
                      value: "6"
                    - name: GITHUB_TWIRP_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: github-twirp-hmac-secret
                    - name: GITHUB_TWIRP_ADDR
                      value: "https://internal-api.service.%stamp%.github.net/internal"
                    - name: TRACING_ENABLED
                      value: "true"
                    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                      value: "http://otelcol-mesh.otelcol-production.svc.cluster.local:14318/v1/traces"
                    # Federated secret
                    - name: FAILBOT_HAYSTACK_URL
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: failbot-haystack-url
                    - name: AZP_FORCE_TOKEN_OVER_AAD
                      value: "true"
                    - name: ACTIONS_APP_REALM_WIDE_HMAC_KEY_NAME_PRIMARY
                      value: "ActionsAppLabRealmWideHmacKeyPrimary"
                    - name: ACTIONS_APP_REALM_WIDE_HMAC_KEY_NAME_SECONDARY
                      value: "ActionsAppLabRealmWideHmacKeySecondary"
                    - name: AZP_REALM_WIDE_VAULT_NAME
                      value: "dreamlifterghrt"
                    - name: AZP_GH_APP_PRIVATE_KEY_PEM
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: azp-gh-app-private-key-pem
                    - name: TELEMETRY_ROUND_TRIPPER_ENABLE_LOGS
                      value: "true"
                    - name: JWKS_URL
                      value: "http://tokenz.tokenz-%stamp%.svc.cluster.local:8080/.well-known/jwks"
                    - name: MULTI_TENANT_ENTERPRISE_ISSUER
                      value: http://tokenz.tokenz-%stamp%.svc.cluster.local:8080
                    - name: GOMAXPROCS
                      value: "1"
                    - name: LAUNCH_LOG_DEBUG
                      value: "true"
                    - name: AZURE_STORAGE_ACCOUNT_PREFIX
                      value: "launch%stamp_without_separators%sa"
                    - name: AZURE_SPN_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob
                            name: launch-%stamp%
                    - name: AZURE_SPN_CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-client-id
                            name: launch-%stamp%
                    - name: AZURE_SPN_TENANT_ID
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-tenant-id
                            name: launch-%stamp%
