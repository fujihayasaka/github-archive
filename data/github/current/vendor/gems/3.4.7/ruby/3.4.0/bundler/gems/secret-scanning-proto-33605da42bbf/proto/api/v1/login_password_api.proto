syntax = "proto3";

package github.secretscanning.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

import "api/v1/shared.proto";

// LoginPasswordAPI contains APIs used by secret scanning for user passwords found in scanned source code and commit metadata.
service LoginPasswordAPI {
  // RevokeLoginPassword revokes user passwords for cases when the login(or email) and password were found
  // in commit metadata or in content pushed to a repository.
  rpc RevokeLoginPassword(RevokeLoginPasswordRequest) returns (RevokeLoginPasswordResponse);

  // VerifyLoginPassword verifies whether login (or email) and passwords are valid working credentials.
  rpc VerifyLoginPassword(VerifyLoginPasswordRequest) returns (VerifyLoginPasswordResponse);
}

message RevokeLoginPasswordRequest {
  message LoginPasswordCandidate {
    // user is a string that can be either a login or an email.
    string user = 1;

    // password_encrypted is a secret found by secret scanning, encrypted for transit. 
    string password_encrypted = 2;

    // commit hash where the credential was found
    string commit_oid = 3;

    // identifies where did we find the credential (content, commit, issue etc)
    TokenSource credential_source = 4;

    // url is the url of the location that the token was found in
    string url = 5;
  }

  // candidates are the potential users and passwords that should be revoked if valid.
  repeated LoginPasswordCandidate candidates = 1;

  // Id of the repository, used for internal private revocation
  int64 repository_id = 2;

  // type of repository (gist or repos)
  RepositoryType repository_type = 3;
}

message RevokeLoginPasswordResponse {
  // revoked_count is the number of login/password credentials that were revoked
  uint64 revoked_count = 1;

  message LoginPassword {
    // revoke_result identifies what the result was when the login/password at the given ordinal was attempted to be revoked
    RevokeResult revoke_result = 1;
  }

  // results are the revocation results for each login/password requested
  repeated LoginPassword results = 2;
}

message VerifyLoginPasswordRequest {
  message LoginPasswordCandidate {
    // user is a string that can be either a login or an email.
    string user = 1;

    // password_encrypted is a secret found by secret scanning, encrypted for transit. 
    string password_encrypted = 2;

    // commit hash where the credential was found
    string commit_oid = 3;

    // identifies where did we find the credential (content, commit, issue etc)
    TokenSource credential_source = 4;

    // url is the url of the location that the token was found in
    string url = 5;
  }

  // candidates are the potential users and passwords that should be revoked if valid.
  repeated LoginPasswordCandidate candidates = 1;

  // Id of the repository, used for internal private revocation
  int64 repository_id = 2;

  // type of repository (gist or repos)
  RepositoryType repository_type = 3;
}

message VerifyLoginPasswordResponse {
  message LoginPassword {
    // is_verified is whether the login/password at this index was a valid working credential
    bool is_verified = 1;
  }

  // results are the verification results for each login/password requested
  repeated LoginPassword results = 1;
}
