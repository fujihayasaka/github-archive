syntax = "proto3";

package github.actions.results.events.v1;

message WorkflowJobRunCreate {
    // This is the external ID of the workflow job run
    string workflow_job_run_backend_id = 1;
    // This is the external ID of the workflow run 
    string workflow_run_backend_id = 2;
    // This is the global ID of the repository
    string repository_global_id = 3;
    // This is the display name of the job on UI
    string name = 4;
    // This is the associated check run database ID for the workflow job run
    int64 check_run_database_id = 5;
}
