syntax = "proto3";

package blackbirdmw.query.v1;

import "hydro/schemas/blackbird/v0/entities/symbol_kind.proto";

option go_package = "query/v1";
option ruby_package = "Blackbird::Query::V1";

// A Symbol describes a symbol (e.g. a function, class, or type) extracted from
// some code indexed for Blackbird. Symbols are extracted using tree-sitter in
// blackbird-mw, see https://github.com/github/blackbird-mw
message Symbol {
  // The symbol's fully qualified name (e.g. in Rust something like, StructName::function_name).
  // To get the unqualified name, first calculate the length of the identifier using the ident_start
  // and ident_end fields. The identifier is the suffix of the fully qualified name.
  string fully_qualified_name = 1;
  hydro.schemas.blackbird.v0.entities.SymbolKind kind = 2;
  // The byte offset of the start of the identifier (i.e. the symbol's name) in
  // the code it was extracted from
  uint32 ident_start = 3;
  // The byte offset of the end of the identifier (i.e. the symbol's name) in
  // the code it was extracted from
  uint32 ident_end = 4;
  // The byte offset of the start of the logical scope of the symbol (e.g. for a
  // function, the start of the function) in the code it was extracted from
  uint32 extent_start = 5;
  // The byte offset of the end of the logical scope of the symbol (e.g. for a
  // function, the end of the function) in the code it was extracted from
  uint32 extent_end = 6;
  // The score assinged to this symbol match
  float score = 7;
}
