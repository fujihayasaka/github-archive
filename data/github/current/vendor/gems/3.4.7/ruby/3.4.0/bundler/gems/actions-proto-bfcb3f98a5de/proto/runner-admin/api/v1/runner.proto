syntax = "proto3";

package github.actions.runner_admin.api.v1;

import "runner-admin/api/v1/runner_status.proto";
import "runner-admin/api/v1/runner_label.proto";
import "runner-admin/entities/v1/identity.proto";
import "runner-admin/api/v1/assigned_request.proto";

option ruby_package = "GitHub::ActionsRunnerAdmin::Api::V1";

message Runner {
    uint64 id = 1;
    entities.v1.Identity owner_id = 2;
    int64 group_id = 3;
    string name = 4;
    string version = 5;
    string created = 6;
    string modified = 7;
    bool updates_disabled = 8;
    string client_id = 9;
    RunnerStatus runner_status = 10;
    repeated Label labels = 11;
    bool ephemeral = 12;
    int64 current_parallelism = 13;
    string os = 14;
    string arch = 15;
    AssignedRequest assigned_request = 16;
    string status = 17;
    uint64 scale_set_id = 18;
}