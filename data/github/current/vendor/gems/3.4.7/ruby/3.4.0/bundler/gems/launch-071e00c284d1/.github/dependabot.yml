---
version: 2
registries:
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: "${{secrets.CONTAINER_BUILDER_TOKEN}}"
updates:
# Grouping configuration based on https://github.com/github/pages-engineering/discussions/4471
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  groups:
    minor-go-dependencies:
      # Go: Only group minor and patch updates (we want to carefully review major updates)
      update-types: [minor, patch]

- package-ecosystem: docker
  directory: "/"
  registries:
  - ghcr
  schedule:
    interval: weekly
  groups:
    all-docker-dependencies:
      # Docker: We rely on base images (https://thehub.github.com/epd/engineering/dev-practicals/containers/container-development/adopt-base-images-for-service/) exclusively
      # They don't follow semantic versioning so we just bundle all kind of updates
      update-types: [minor, patch, major]

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    minor-actions-dependencies:
      # GitHub Actions: Only group minor and patch updates (we want to carefully review major updates)
      update-types: [minor, patch]

# GHES backports for base images
# Note: one section per target-branch is needed. Those must be kept in sync too.
- package-ecosystem: docker
  directory: "/"
  target-branch: enterprise-3.16-release
  labels:
  - "ern:not-customer-facing"
  registries:
  - ghcr
  schedule:
    interval: weekly
  groups:
    ghes-3.16-base-images:
      update-types: [minor, patch, major]
- package-ecosystem: docker
  directory: "/"
  target-branch: enterprise-3.15-release
  labels:
  - "ern:not-customer-facing"
  registries:
  - ghcr
  schedule:
    interval: weekly
  groups:
    ghes-3.15-base-images:
      update-types: [minor, patch, major]
- package-ecosystem: docker
  directory: "/"
  target-branch: enterprise-3.14-release
  labels:
  - "ern:not-customer-facing"
  registries:
  - ghcr
  schedule:
    interval: weekly
  groups:
    ghes-3.14-base-images:
      update-types: [minor, patch, major]
- package-ecosystem: docker
  directory: "/"
  target-branch: enterprise-3.13-release
  labels:
  - "ern:not-customer-facing"
  registries:
  - ghcr
  schedule:
    interval: weekly
  groups:
    ghes-3.13-base-images:
      update-types: [minor, patch, major]
