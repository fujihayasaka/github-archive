syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// Algorithm encapsulates the possible algorithms for diffs.
enum DiffAlgorithm {
    // DIFF_STATUS_INVALID indicates an invalid diff algorithm.
    DIFF_ALGORITHM_INVALID = 0;

    // DIFF_STATUS_DEFAULT indicates that the default algorithm is to be used.
    DIFF_ALGORITHM_DEFAULT = 1;
}
