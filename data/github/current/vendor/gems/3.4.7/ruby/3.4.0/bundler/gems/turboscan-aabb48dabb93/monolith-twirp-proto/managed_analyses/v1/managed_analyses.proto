syntax = "proto3";

package code_scanning.managed_analyses.v1;

option go_package = "monolith_twirp/managed_analyses/v1";
option ruby_package = "MonolithTwirp::CodeScanning::ManagedAnalyses::V1";

service ManagedAnalysesAPI {
    rpc AreRequiredServicesEnabled(AreRequiredServicesEnabledRequest) returns (AreRequiredServicesEnabledResponse); // Check if the required services (GHAS and Actions) are enabled
    rpc CancelQueuedRuns(CancelQueuedRunsRequest) returns (CancelQueuedRunsResponse);  // Cancel workflows that are in QUEUED status
    rpc CreateCheckForPR(CreateCheckForPRRequest) returns (CreateCheckForPRResponse); // Create a check for a PR
    rpc GetCodeScanningBotInfo(GetCodeScanningBotInfoRequest) returns (GetCodeScanningBotInfoResponse); // Get the data of the Code Scanning Bot
    rpc IsCodeQLRequired(IsCodeQLRequiredRequest) returns (IsCodeQLRequiredResponse); // Check if Code Scanning has been required on a ref or not
}

message AreRequiredServicesEnabledRequest {
    uint64 repository_id = 1;
}

message AreRequiredServicesEnabledResponse {
    reserved 2;
    reserved "actions_installation_id";

    bool enabled = 1;
    string tenant_slug = 3;
    int64 tenant_id = 4;
    string codeql_packs = 5;
}

message CancelQueuedRunsRequest {
    uint64 repository_id = 1;
    repeated uint64 workflow_run_id = 2;
}

message CancelQueuedRunsResponse {
    repeated WorkflowRunStatus workflow_run_status = 1;
}

message WorkflowRunStatus {
    uint64 workflow_run_id = 1;
    string status = 2;
    string error = 3; // The error field reflects an error when determining the status/conclusion
    string conclusion = 4;
}

message CreateCheckForPRRequest {
    uint64 repository_id = 1;
    uint64 pull_request_id = 2;
}

message CreateCheckForPRResponse {
    uint64 check_suite_id = 1;
}

message GetCodeScanningBotInfoRequest {}

message GetCodeScanningBotInfoResponse {
    string grid = 1;
    string login = 2;
}

message IsCodeQLRequiredRequest {
    uint64 repository_id = 1;
    bytes ref = 2;
}

message IsCodeQLRequiredResponse {
    bool required = 1;
}
