syntax = "proto3";

package github.secretscanning.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

import "google/protobuf/timestamp.proto";
import "api/v1/shared.proto";

service ExemptionsAPI {
    // GetExemption returns the ExemptionRequest and corresponding ExemptionResponses for the given exemption request ID
    rpc GetExemption(GetExemptionRequest) returns (GetExemptionResponse);
}

message GetExemptionRequest {
    uint64 exemption_request_id = 1;
}

message GetExemptionResponse {
    ExemptionRequest exemption_request = 1; 
    ExemptionResponse exemption_response = 2;
}

message ExemptionRequest {
    uint64 exemption_request_id = 1;
    google.protobuf.Timestamp created_at = 2; 
    uint64 requester_id = 3; 
    string requester_comment = 4;
    ExemptionReason reason = 5; 
}

message ExemptionResponse {
    uint64 reviewer_id = 1; 
    google.protobuf.Timestamp created_at = 2; 
    ExemptionResponseStatus status = 3;
    string message = 4;
}

enum ExemptionResponseStatus {
    UNKNOWN_EXEMPTION_RESPONSE_STATUS = 0; 
    PENDING = 1; 
    APPROVED = 2; 
    REJECTED = 3;
}

