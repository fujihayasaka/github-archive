name: Testing all types of dependencies

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      # Push events on main branch
      - main
      # Push events to branches matching refs/heads/mona/octocat
      - 'mona/octocat'
      # Push events to branches matching refs/heads/releases/10
      - 'releases/**'
    # Sequence of patterns matched against refs/tags
    tags:
      - v1             # Push events to v1 tag
      - v1.*           # Push events to v1.0, v1.1, and v1.9 tags

jobs:
  first_job:
    runs-on: ubuntu-latest

    steps:
    - uses: "actions/regular_external_action@v1"
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 30
        stale-pr-message: ":wave: This PR is automatically being marked as stale because there hasn't been any activity in the last 30 days! Please consider shipping it or closing it! If there isn't any activity in the next 7 days it will be closed automatically. Don't worry though: you can always re-open it once you're ready to resume development. 😅"
  second_job:
    steps:
      - name: My first step
        # Uses the default branch of a public repository
        uses: actions/ext_action_branch_version@main
      - name: My second step
        # Uses a specific version tag of a public repository
        uses: actions/aws@v2.0.1
      - name: My docker step
        uses: docker://alpine:3.8
  third_job:
    uses: octo-org/this-repo/.github/workflows/workflow-sha-version.yml@172239021f7ba04fe7327647b213799853a9eb89
    container:
      image: ghcr.io/owner/image
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.ghcr_token }}
    services:
      myservice1:
        image: ghcr.io/owner/myservice1
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token }}
