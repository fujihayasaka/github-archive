name: GHES

env:
  AWS_ENDPOINT: 'http://localhost:10005/'
  ENTERPRISE: '1'
  SCHEMA: './db/enterprise_structure.sql'

on:
  push:

jobs:
  publish:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: script/cibuild-enterprise-publish
        env:
          JANKY_AUTH_TOKEN: ${{ secrets.API_AUTH_TOKEN }}

  build-verify:
    # Builds the enterprise image but doesn't publish it
    # Used on dependabot triggered runs where we don't have access to all the publishing secrets
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: script/cibuild-enterprise-publish --build-only
