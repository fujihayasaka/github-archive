apiVersion: v1
kind: Service
metadata:
  name: api-server
  labels:
    service: api-server
  annotations:
    moda.github.net/domain-name: "actions-usage-metrics-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: |
      - http:
          url: https://{{.Instance.Name}}/health
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app: api-server
  type: LoadBalancer
