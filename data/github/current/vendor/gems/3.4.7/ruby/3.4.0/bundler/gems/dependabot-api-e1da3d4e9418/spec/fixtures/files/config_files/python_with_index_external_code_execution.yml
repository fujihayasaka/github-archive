version: 2
registries:
  python-azp-acme:
    type: python-index
    url: https://pkgs.dev.azure.com/acme/_packaging/my-awesome-feed/pypi/simple
    token: ${{secrets.MY_AZURE_DEVOPS_TOKEN}}
    replaces-base: true
updates:
  - package-ecosystem: "pip"
    directory: "/"
    registries:
      - python-azp-acme
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
