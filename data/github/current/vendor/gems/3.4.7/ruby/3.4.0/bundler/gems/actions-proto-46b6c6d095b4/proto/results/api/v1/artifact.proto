syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

package github.actions.results.api.v1;

service ArtifactService {
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse);
  rpc FinalizeArtifact(FinalizeArtifactRequest) returns (FinalizeArtifactResponse);
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetSignedArtifactURL(GetSignedArtifactURLRequest) returns (GetSignedArtifactURLResponse);
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
  rpc MigrateArtifact(MigrateArtifactRequest) returns (MigrateArtifactResponse);
  rpc FinalizeMigratedArtifact(FinalizeMigratedArtifactRequest) returns (FinalizeMigratedArtifactResponse);
}

message MigrateArtifactRequest {
  string workflow_run_backend_id = 1;
  string name = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message MigrateArtifactResponse {
  bool ok = 1;
  string signed_upload_url = 2;
}

message FinalizeMigratedArtifactRequest {
  string workflow_run_backend_id = 1;
  string name = 2;
  int64 size = 3;
}

message FinalizeMigratedArtifactResponse {
  bool ok = 1;
  int64 artifact_id = 2;
}


message CreateArtifactRequest {
  string workflow_run_backend_id = 1;
  string workflow_job_run_backend_id = 2;
  string name = 3;
  google.protobuf.Timestamp expires_at = 4;
  int32 version = 5;
}

message CreateArtifactResponse {
  bool ok = 1;
  string signed_upload_url = 2;
}

message FinalizeArtifactRequest {
  string workflow_run_backend_id = 1;
  string workflow_job_run_backend_id = 2;
  string name = 3;
  int64 size = 4;
  google.protobuf.StringValue hash = 5; // optional
}

message FinalizeArtifactResponse {
  bool ok = 1;
  int64 artifact_id = 2;
}

message ListArtifactsRequest {
  // The backend plan ID
  string workflow_run_backend_id = 1;
  // The backend job ID
  string workflow_job_run_backend_id = 2;
  // Name of the artifact to filter on
  google.protobuf.StringValue name_filter = 3; // optional
  // Monolith Database ID of the artifact to filter on
  google.protobuf.Int64Value id_filter = 4; // optional
}

message ListArtifactsResponse {
  message MonolithArtifact {
    // The backend plan ID
    string workflow_run_backend_id = 1;
    // The backend job ID
    string workflow_job_run_backend_id = 2;
    // Monolith database ID of the artifact
    int64 database_id = 3;
    // Name of the artifact
    string name = 4;
    // Size of the artifact in bytes
    int64 size = 5;
    // When the artifact was created in the monolith
    google.protobuf.Timestamp created_at = 6;
  }

  repeated MonolithArtifact artifacts = 1;
}

message GetSignedArtifactURLRequest {
  string workflow_run_backend_id = 1;
  string workflow_job_run_backend_id = 2;
  string name = 3;
}

message GetSignedArtifactURLResponse {
  string signed_url = 1;
}

message DeleteArtifactRequest {
  string workflow_run_backend_id = 1;
  string workflow_job_run_backend_id = 2;
  string name = 3;
}

message DeleteArtifactResponse {
  bool ok = 1;
  int64 artifact_id = 2;
}
