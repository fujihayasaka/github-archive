#
# This is a skeema-diff GitHub Action file.
# Use this file for non-rails repositories. Repository will need to have schema definition in skeema's expected layout
#

name: skeema-diff

on:
  pull_request:
    branches:
    - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write # To request the OIDC token to reach the repo via Actions Network Gateway (ANG)

jobs:
  skeema-diff:
    uses: github/skeefree/.github/workflows/skeema-diff.yml@master
    with:
      pull-request-number: ${{ github.event.pull_request.number }}
    secrets: inherit
