# Learn more about the syntax here:
# https://docs.github.com/en/early-access/github/save-time-with-slash-commands/syntax-for-user-defined-slash-commands
---
trigger: triage
title: First Responder Triage
surfaces:
  - issue
description: Form for triaging issues as the Notifications First Responder
steps:
  - type: form
    style: embedded
    body:
      - type: dropdown
        attributes:
          label: Impact
          description: "Does this issue impact only a few users (Low) or cause a lot of noise in telemetry and affect many users (High)?"
          options:
            - label: "🔍 Low"
              value: ":mag: Low"
            - label: "⚠️ Medium"
              value: ":warning: Medium"
            - label: "🌎 High"
              value: ":earth_americas: High"
      - type: dropdown
        attributes:
          label: Severity
          description: "Severity: Is this a minor issue with a workaround (Low) or severe and unavoidable when it occurs (High)?"
          options:
            - label: "✨ Low"
              value: ":sparkles: Low"
            - label: "💥 High"
              value: ":boom: High"
      - type: dropdown
        attributes:
          label: Effort
          description: "Effort: What effort would it take to explore and solve this issue?"
          options:
            - label: "✨ Low"
              value: ":sparkles: Low"
            - label: "💥 High"
              value: ":boom: High"
      - type: dropdown
        attributes:
          label: Priority
          description: "Priority based on our [triage procedures](https://github.com/github/notifications/blob/master/docs/on-call-FR/customer-escalations-triage-process.md)"
          options:
            - label: "P0"
              value: "P0"
            - label: "P1"
              value: "P1"
            - label: "P2"
              value: "P2"
            - label: "P3"
              value: "P3"
            - label: "P4"
              value: "P4"
      - type: textarea
        attributes:
          label: Reason
          placeholder: Given that...

  - type: fill
    template: |-
      Hello! Thank you for filing this issue. 
    
      Can you help us triage this by providing more customer details if you haven't already?
      
       - Customer name:
       - Number of billable seats:
       - Enterprise type (GHES, GHEC) & version (3.8, 3.9):
       - Support Plan (Premium Plus, Standard, Unified):
       - Slack or Teams Integration: 
       - Additional Info: (Like if a part of a large deal or otherwise valuable customer)
      
      ### First Responder Triage

      Based on our [triage process](https://github.com/github/notifications/blob/master/docs/on-call-FR/customer-escalations-triage-process.md) we've assigned this issue the following priority:
      
      | Impact | Severity | Effort | Priority |
      | ---- | ---- | ---- | --- |
      | {{ data.Impact }} | {{ data.Severity }} |  {{ data.Effort }} | {{ data.Priority }} |


      **Notes:** {{ data.Reason }}

      This product is currently in Maintenance Mode. For more information on the Quality of Service for this product, see [this issue](https://github.com/github/collaboration-workflows/issues/121).
