apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/default
  - configmaps/common-config.yaml
  - deployments/authnd-tester.yaml
  - services/authnd-canary.yaml

patches:
  - path: patches/services/authnd.json
    target:
      kind: Service
      name: authnd
  - path: patches/deployments/authnd.json
    target:
      kind: Deployment
      name: authnd
