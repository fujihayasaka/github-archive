run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - gocheckcompilerdirectives
    - gocritic
    - gofmt
    - goimports
    - revive
    - wrapcheck

linters-settings:
  revive:
    rules:
      - name: var-naming
        severity: warning
        disabled: false
        arguments:
          - ["ID", "URL", "URI", "HTTP", "API", "UUID"] # AllowList
          - [] # DenyList
  wrapcheck:
    ignorePackageGlobs:
      - github.com/github/billing-platform/*
