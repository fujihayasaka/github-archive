name: Terraform Branch Deploy

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read

jobs:
  terraform-branch-deploy:
    uses: github/cosmosdb/.github/workflows/branch-deploy.yml@v2.0.1
    with:
      working-directory: config/terraform
      environment-targets: terraform-deploy # Used to require environment approval
    secrets:
      tfe-host: "terraform.githubapp.com"
      tfe-token: ${{ secrets.TFE_TOKEN }}
