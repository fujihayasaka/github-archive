apiVersion: v1
kind: Service
metadata:
  name: hosted-compute-ims-api-canary
  labels:
    service: hosted-compute-ims-api-canary
  annotations:
    moda.github.net/domain-name: hosted-compute-ims-%environment%-canary.service.%region%.github.net
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 21010
    protocol: TCP
    targetPort: http
  selector:
    app: hosted-compute-ims-api
    # This means requests to this service will only hit canary pods
    # role is setup in config/kustomize/base/hosted-compute-ims-api/deployment.yaml
    # via moda.github.net/canary-label
    role: canary
  type: LoadBalancer
