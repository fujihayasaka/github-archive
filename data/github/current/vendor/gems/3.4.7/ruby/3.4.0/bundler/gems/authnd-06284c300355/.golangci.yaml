run:
  timeout: 2m

linters:
  enable:
    - depguard
    - forbidigo
    - gofmt

linters-settings:
  depguard:
    rules:
      main:
        list-mode: lax
        files:
        - "$all"
        - "!$test"
        # packages which are disallowed, with a substitute where possible
        deny:
        - pkg: "math/rand"
          desc: Should be replaced by crypto/rand

issues:
  # excludes the vendor directory
  exclude-dirs-use-default: true
  exclude-rules:
  # cli for local development only
  - path: cmd/authnd-client/
    linters:
    - forbidigo
  # go helpers for scripts
  - path: script/
    linters:
    - forbidigo
  # mobile api test server
  - path: internal/api/local_mobile_client_server.go
    linters:
    - forbidigo

