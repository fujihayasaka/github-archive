apiVersion: v1
kind: Service
metadata:
  name: trust-metadata-api
  labels:
    service: trust-metadata-api
  annotations:
    moda.github.net/dns-registration-enabled: "false"
    moda.github.net/load-balancer-type: public-external-http
    moda.github.net/backend-keepalive-enabled: "true"
    moda.github.net/timeout-connect: "20"
    opaque.github.net/checks: |
      - http:
          url: https://{{.Instance.Name}}/status
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: trust-metadata-api
  type: LoadBalancer
