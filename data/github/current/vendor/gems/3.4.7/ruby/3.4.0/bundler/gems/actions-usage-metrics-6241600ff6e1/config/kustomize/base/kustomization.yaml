apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: config
    behavior: create
    literals:
      - KUSTO_DATABASE=hydro
      - KUSTO_REPO_DATABASE=snapshots
      - KUSTO_REPO_TABLE=github_mysql1_repositories_current
      - KUSTO_ORG_TABLE=github_mysql1_users_current
