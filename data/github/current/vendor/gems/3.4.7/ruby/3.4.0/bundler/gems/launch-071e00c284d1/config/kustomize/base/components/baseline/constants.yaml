### CONSTANTS: The following values are expected to remain constant between Launch services, environments, stamps, clusters, etc.
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: LAUNCH_MODE
    value: hosted
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: STATS_PREFIX
    value: launch
