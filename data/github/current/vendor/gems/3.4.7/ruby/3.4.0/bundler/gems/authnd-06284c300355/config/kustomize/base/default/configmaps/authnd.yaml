apiVersion: v1
kind: ConfigMap
metadata:
  name: authnd
  annotations:
    moda.github.net/canary-v2: "true"
data:
  # security config used for specifying where and how chatops can be used, etc.
  # spec https://github.com/github/go-chatops/blob/6f1adf6f06d001011f66cf7a20f34de1e18de8c8/security/validator.go
  # example https://github.com/github/node-problem-healer/blob/00dc9e7a1e71f6aab900c1f8c630a6bf598351da/config/kubernetes/default/configmap/node-problem-healer.yaml
  security-config.yaml: |
    ---
    profiles:
      common-configs: &common-cfgs
        owner: '@github/authentication'
      normal-commands: &normal
        <<: *common-cfgs
        safe_rooms:
        - authnd-ops
        - authnd-ops-private
      sensitive-commands: &sensitive
        <<: *common-cfgs
        2fa: true
        safe_rooms:
        - authnd-ops-private
    commands:
      ping:
        <<: *normal
      pprof:
        <<: *normal
      hmac:
        <<: *sensitive
