syntax = "proto3";

package github.actions.runner_admin.api.v1;
option ruby_package = "GitHub::ActionsRunnerAdmin::Api::V1";

message OwnerConcurrency {
  string global_id = 1;
  string platform = 2;
  int32 concurrency_value = 3;
  int64 version = 4;
}

message DefaultConcurrency {
  string platform = 1;
  string plan = 2;
  string tier = 3;
  int32 concurrency_value = 4;
}