version: 2
registries:
  ghcr: # Define access for a private registry
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{secrets.CONTAINER_BUILDER_TOKEN}}
updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of go.mod
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    groups: # Group all go module dependency updates
        go-modules:
          patterns:
            - "*"  # Use a wildcard to match all updates
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "monday"
      time: "05:00"
    ignore:
      - dependency-name: "github/internal-actions"
    groups: # Group all actions dependency updates
        actions:
          patterns:
            - "*"  # Use a wildcard to match all updates
  - package-ecosystem: "docker"
    directory: "/"
    registries:
      - ghcr # Allow version updates for dependencies in this registry
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    groups: # Group all docker dependency updates
        docker:
          patterns:
            - "*"  # Use a wildcard to match all updates
