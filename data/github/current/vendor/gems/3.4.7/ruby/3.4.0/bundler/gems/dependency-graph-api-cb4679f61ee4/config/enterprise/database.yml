default: &default
  adapter: trilogy
  pool: 50
  deadlock_retries: 3
  query_retries: 1
  read_timeout: <%= ENV["ENTERPRISE_TRILOGY_READ_TIMEOUT_OVERRIDE"]&.to_i || 60 %>
  reconnect: true
  timeout: 5000
  write_timeout: 60
  username: <%= ENV["ENTERPRISE_MYSQL_USERNAME"] || "github" %>
  password: <%= ENV["ENTERPRISE_MYSQL_PASSWORD"] || "github" %>
<% if ENV["ENTERPRISE_MYSQL_TLS"] %>
  ssl_mode: <%= Trilogy::SSL_VERIFY_IDENTITY %>
  tls_min_version: <%= Trilogy::TLS_VERSION_12 %>
<% end %>

development:
  primary:
    <<: *default
    database: dependency_graph_development
  reading:
    <<: *default
    database: dependency_graph_development
  analytics:
    <<: *default
    database: dependency_graph_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: dependency_graph_test
  reading:
    <<: *default
    database: dependency_graph_test
  analytics:
    <<: *default
    database: dependency_graph_test

production:
  primary:
    <<: *default
    database: <%= ENV["ENTERPRISE_MYSQL_DATABASE"] || "github_enterprise" %>
    host: <%= ENV["ENTERPRISE_MYSQL_HOSTNAME"] || "localhost" %>
    port:  <%= ENV["ENTERPRISE_MYSQL_PORT"] || "3306" %>
  reading:
    <<: *default
    database: <%= ENV["ENTERPRISE_MYSQL_DATABASE"] || "github_enterprise" %>
    host: <%= ENV["ENTERPRISE_MYSQL_HOSTNAME"] || "localhost" %>
    port:  <%= ENV["ENTERPRISE_MYSQL_PORT"] || "3306" %>
  analytics:
    <<: *default
    database: <%= ENV["ENTERPRISE_MYSQL_DATABASE"] || "github_enterprise" %>
    host: <%= ENV["ENTERPRISE_MYSQL_HOSTNAME"] || "localhost" %>
    port:  <%= ENV["ENTERPRISE_MYSQL_PORT"] || "3306" %>

github:
  default: &default
    adapter: trilogy
    pool: 5
    deadlock_retries: 3
    query_retries: 1
    read_timeout: 60
    reconnect: true
    timeout: 5000
    write_timeout: 60
    username: <%= ENV["ENTERPRISE_MYSQL_USERNAME"] || "github" %>
    password: <%= ENV["ENTERPRISE_MYSQL_PASSWORD"] || "github" %>
<% if ENV["ENTERPRISE_MYSQL_TLS"] %>
    ssl_mode: <%= Trilogy::SSL_VERIFY_IDENTITY %>
    tls_min_version: <%= Trilogy::TLS_VERSION_12 %>
<% end %>

  development:
    <<: *default
    database: github_development

  test:
    <<: *default
    database: github_test_dga

  production:
    <<: *default
    database: <%= ENV["ENTERPRISE_GITHUB_MYSQL_DATABASE"] || "github_enterprise" %>
    host: <%= ENV["ENTERPRISE_MYSQL_HOSTNAME"] || "localhost" %>
    port:  <%= ENV["ENTERPRISE_MYSQL_PORT"] || "3306" %>

github_notify:
  default: &default
    adapter: trilogy
    pool: 5
    deadlock_retries: 3
    query_retries: 1
    read_timeout: 60
    reconnect: true
    timeout: 5000
    write_timeout: 60
    username: <%= ENV["ENTERPRISE_MYSQL_USERNAME"] || "github" %>
    password: <%= ENV["ENTERPRISE_MYSQL_PASSWORD"] || "github" %>
<% if ENV["ENTERPRISE_MYSQL_TLS"] %>
    ssl_mode: <%= Trilogy::SSL_VERIFY_IDENTITY %>
    tls_min_version: <%= Trilogy::TLS_VERSION_12 %>
<% end %>

  development:
    <<: *default
    database: github_development_notify

  test:
    <<: *default
    database: github_test_notify_dga

  production:
    <<: *default
    database: <%= ENV["ENTERPRISE_GITHUB_MYSQL_DATABASE"] || "github_enterprise" %>
    host: <%= ENV["ENTERPRISE_MYSQL_HOSTNAME"] || "localhost" %>
    port:  <%= ENV["ENTERPRISE_MYSQL_PORT"] || "3306" %>
