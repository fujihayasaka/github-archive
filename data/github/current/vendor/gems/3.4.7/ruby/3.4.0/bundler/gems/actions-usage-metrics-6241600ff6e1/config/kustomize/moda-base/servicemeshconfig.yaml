apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config # name *must* be `config`
spec:
  authorization:
    create: true
    strictTLS: false
    # The ServiceMeshConfig resource should enable strict TLS once all clients have migrated to communicating with services in this namespace via the mesh.
    # More info: https://github.com/github/moda-linter/blob/main/rules/docs/service_mesh_config_strict_tls_true.md
    inboundNamespaces:
      - actions-usage-metrics-%stamp%
  loadBalancing:
    retryOnReset: true
    useLocalityLoadBalancing: true
