apiVersion: batch/v1
kind: CronJob
metadata:
  name: turboscan-repo-deleter
  annotations:
    turboscan.github.net/single-cluster: "true"
spec:
  # run every hour
  schedule: "0 * * * *"
  # we use cluster-preferences to override this for a single cluster only
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: turboscan
            role: repo-deleter
          annotations:
            observability.github.com/logger: fluent-bit
            fluentbit.io/parser: logfmt
            observability.github.com/splunk_index: turboscan
        spec:
          dnsPolicy: ClusterFirst
          containers:
            - name: turboscan
              image: turboscan
              envFrom:
                - configMapRef:
                    name: environment
                - configMapRef:
                    name: background-environment
                - configMapRef:
                    name: kube-cluster-metadata
                - secretRef:
                    name: vault-secrets
              env:
                - name: STATS_ADDR
                  value: "$(KUBE_NODE_HOSTNAME):28125"
                - name: KAFKA_GROUP
                  value: "turboscan-consumer-prod"
                - name: GOMAXPROCS
                  valueFrom:
                    resourceFieldRef:
                      containerName: turboscan
                      resource: limits.cpu
              command:
                - /app/script/istio-job-wrapper
                - /app/bin/turboscan
                - cronjobs
                - exec
                - repo-deleter
                - --limit=1000
                - --deadline=55
                - --delete
              resources:
                requests:
                  memory: 1Gi
                  cpu: 1000m
                limits:
                  memory: 4Gi
                  cpu: 1000m
          restartPolicy: OnFailure
      activeDeadlineSeconds: 3590
      ttlSecondsAfterFinished: 60
