name: "Build and test"

on:
  pull_request:
  workflow_dispatch:
  merge_group:

jobs:
  build:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5.5.0
        with:
          go-version: '1.23'

      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: Lint Code
        uses: github/go-linter@main
        with:
          strict: true

      - name: Check Go source files are properly formatted
        run: "! go fmt ./... | grep . || { echo 'Go not formatted'; exit 1; }"

      - name: Build program
        run: make build

      - name: Start Azure blob
        run: docker compose up -d azurite

      - name: Run tests
        run: make test
