version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/github/actions-proto/gen/go
plugins:
  - name: go # Invokes the protoc-gen-go executable
    out: gen/go
    opt: paths=source_relative
  - name: twirp # Invokes the protoc-gen-twirp executable
    out: gen/go
    opt: paths=source_relative