syntax = "proto3";

package github.actions.runner_admin.entities.v1;

import "runner-admin/entities/v1/identity.proto";

option ruby_package = "GitHub::ActionsRunnerAdmin::Entities::V1";

message GitHubEntityHierarchy {
    // only set if the entity is a repository, otherwise nil
    entities.v1.Identity repository_id = 1; 
    // only set if the entity is a repo/user/organization (user and org are synomomous), nil when an entity is an enterprise
    entities.v1.Identity organization_id = 2; 
    // only set if the entity is an repo/org belonging to an enterprise or if the entity is itself an enterprise, otherwise nil
    entities.v1.Identity enterprise_id = 3;  
}