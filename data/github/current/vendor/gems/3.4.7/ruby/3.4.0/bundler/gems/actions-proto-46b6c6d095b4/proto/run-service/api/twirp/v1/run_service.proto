syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

import "google/protobuf/empty.proto";
import "run-service/api/twirp/v1/configuration.proto";
import "run-service/api/twirp/v1/context.proto";
import "run-service/api/twirp/v1/rerun_context.proto";
import "checks/v1/annotation.proto";
import "checks/v1/status.proto";

service RunService {
    rpc StartPlan(StartPlanRequest) returns (StartPlanResponse) {}
    rpc CancelPlan(CancelPlanRequest) returns (CancelPlanResponse) {}
    rpc NotifyGate(NotifyGateRequest) returns (google.protobuf.Empty) {}
    rpc GetPlanStatus(GetPlanStatusRequest) returns (GetPlanStatusResponse) {}
    rpc CreateAnnotation(CreateAnnotationRequest) returns (google.protobuf.Empty) {}
}

message StartPlanRequest {
    string plan_id = 1;
    Configuration configuration = 2;
    string workflow_template = 3;
    map<string, string> variables = 4;
    map<string, string> secrets = 5;
    Context context = 6;
    map<string, bool> features = 7;
    string expression_data = 8;
    RerunContext rerun_context = 9;
}

message StartPlanResponse {
    string plan_id = 1;
    string run_stamp_url = 2;
}

message CancelPlanRequest {
    string plan_id = 1;
    string reason = 2;
    bool is_force_cancel = 3;
    string cancelled_by = 4;
}

message CancelPlanResponse { string plan_id = 1; }

message NotifyGateRequest {
    string gate_global_id = 1;
    string workflow_run_backend_id = 2; // check_suite.external_id / Run Service PlanID
    string workflow_job_run_backend_id = 3; // check_run.external_id / Run Service JobID
    bool is_open = 4;
}

message GetPlanStatusRequest { string plan_id = 1; }

message GetPlanStatusResponse {
    string plan_id = 1;
    repeated JobStatus job_statuses = 2;
}

message JobStatus {
    string job_id = 1;
    checks.v1.Status status = 2;
}

message CreateAnnotationRequest {
    checks.v1.AnnotationLevel level = 1;
    string message = 2;
    string job_instance_id = 3;
    string plan_id = 4;
}
