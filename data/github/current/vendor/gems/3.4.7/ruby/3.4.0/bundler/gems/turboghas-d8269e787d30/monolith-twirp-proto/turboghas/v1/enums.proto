syntax = "proto3";

package code_scanning.turboghas.v1;

option go_package = "github.com/github/turboghas/internal/monolith_twirp/turboghas/v1";
option ruby_package = "MonolithTwirp::CodeScanning::Turboghas::V1";

enum EntityType {
  ENTITY_TYPE_INVALID = 0;
  ENTITY_TYPE_BUSINESS = 1;
  ENTITY_TYPE_USER = 2;
}

enum Feature {
  FEATURE_NONE = 0;
  FEATURE_ALL = 1;
  FEATURE_CODE_SCANNING = 2;
  FEATURE_SECRET_SCANNING = 4;
  FEATURE_DEPENDABOT = 8;
}

enum SKU {
  SKU_INVALID = 0;
  SKU_GHAS_SEATS = 1;
  SKU_GHAS_LICENSES = 2;
  SKU_GHAS_CODE_SECURITY_LICENSES = 3;
  SKU_GHAS_SECRET_PROTECTION_LICENSES = 4;
}
