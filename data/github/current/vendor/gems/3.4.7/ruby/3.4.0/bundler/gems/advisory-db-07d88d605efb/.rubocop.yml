require:
  - rubocop-performance
<% unless Bundler.app_config_path.to_s.include? "packages/advisory_db_toolkit/.bundle" %>
  - rubocop-rails
  - "./test/rubocop/cop/custom_cops"
<% end %>

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # For files that are copypaste from github, let's avoid altering them more to make sure future porting is easy.
    - 'lib/github/encoding.rb'
<% unless Bundler.app_config_path.to_s.include? "packages/advisory_db_toolkit/.bundle" %>
    - 'packages/advisory_db_toolkit/**/*'
<% end %>
  NewCops: enable
  TargetRubyVersion: 3.1.3

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/HashAlignment:
  Enabled: true
  EnforcedLastArgumentHashStyle: ignore_implicit

Layout/LineLength:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  Enabled: true
  EnforcedStyle: indented

Lint/MissingSuper:
  Enabled: false

Lint/NonAtomicFileOperation:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: true
  AllowUnusedKeywordArguments: true

Metrics:
  Enabled: false

Naming/BlockForwarding:
  Enabled: false

# The allowed patterns below are standard naming conventions
# used by NVD in generating JSON files to describe a CVE.
Naming/MethodName:
  Enabled: true
  AllowedPatterns:
    - attackComplexity
    - attackVector
    - availabilityImpact
    - confidentialityImpact
    - integrityImpact
    - privilegesRequired
    - userInteraction
    - vectorString

Naming/MethodParameterName:
  Enabled: false

Naming/PredicateName:
  Enabled: true

Naming/RescuedExceptionsVariableName:
  Enabled: true
  PreferredName: error

Naming/VariableNumber:
  Enabled: true
  EnforcedStyle: snake_case
  CheckMethodNames: false
  CheckSymbols: false
  AllowedIdentifiers:
    - cvss_v2
    - cvss_v3
    - cvss_v4

<% unless Bundler.app_config_path.to_s.include? "packages/advisory_db_toolkit/.bundle" %>
Rails/ActionOrder:
  Enabled: false

Rails/ActionControllerTestCase:
  Enabled: false

Rails/CreateTableWithTimestamps:
  Enabled: true
  Exclude:
    - db/migrate/20201013184654_add_cwe_table.rb
    - db/migrate/20201020171923_add_advisories_cwes.rb

Rails/EnvironmentVariableAccess:
  Exclude:
    - lib/advisory_db/config/**/*

# We really don't care about needing to batch `each` performance in test cases.
Rails/FindEach:
  Exclude:
    - test/**/*

# Until there's a value that allows dependent records
# to be ignored, don't require the :dependent option.
Rails/HasManyOrHasOneDependent:
  Enabled: false

# We aren't using localization
Rails/I18nLocaleTexts:
  Enabled: false

Rails/NotNullColumn:
  Enabled: true
  Exclude:
    - db/migrate/20190227213559_add_publication_indexing_columns.rb

Rails/Pluck:
  Enabled: false

Rails/RefuteMethods:
  Enabled: true
  EnforcedStyle: refute

Rails/ReversibleMigration:
  Exclude:
    - db/migrate/20180409211722_change_advisory_fields.rb
    - db/migrate/20200102182420_additional_cve_review_fields.rb
    - db/migrate/20201029210441_remove_cvss_v3_from_advisory_reviews_and_feed_entries.rb

Rails/SkipsModelValidations:
  Enabled: true
  Exclude:
    - db/**/*
    - test/**/*
<% end %>

Style/ConcatArrayLiterals:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/EvalWithLocation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always_true

Style/GuardClause:
  Enabled: false

Style/HashSyntax:
  Enabled: true
  EnforcedShorthandSyntax: either

Style/IfUnlessModifier:
  Enabled: false

Style/ModuleFunction:
  Enabled: true
  EnforcedStyle: extend_self

Style/NumericLiterals:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/RegexpLiteral:
  Enabled: true
  EnforcedStyle: mixed

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Style/SymbolArray:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: comma

Style/WhileUntilModifier:
  Enabled: false

Style/WordArray:
  Enabled: false
