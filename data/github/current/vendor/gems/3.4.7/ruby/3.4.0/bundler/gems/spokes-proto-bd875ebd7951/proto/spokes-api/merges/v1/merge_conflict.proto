syntax = "proto3";

package github.spokes.merges.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/merges";
option ruby_package = "GitHub::Spokes::Proto::Merges::V1";

import "spokes-api/types/v1/mode.proto";
import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/path.proto";

// MergeConflict represents the conflicts for an individual path in a merge. A
// `nil` TreeEntry value indicates that the entry is not present in the
// associated tree.
message MergeConflict {
    // TreeEntry represents a tree entry (in a conflict or resolution) for a
    // merge operation.
    message TreeEntry {
        // mode is the file mode of the entry.
        github.spokes.types.v1.Mode mode = 1;

        // oid is the object ID of the entry.
        github.spokes.types.v1.ObjectID oid = 2;

        // path is the path to the entry in its tree.
        github.spokes.types.v1.Path path = 3;
    }

    // base is the conflicted tree entry in the base.
    TreeEntry base = 1;

    // head is the conflicted tree entry in the head.
    TreeEntry head = 2;

    // merge_base is the conflicted tree entry in the merge base.
    TreeEntry merge_base = 3;
}
