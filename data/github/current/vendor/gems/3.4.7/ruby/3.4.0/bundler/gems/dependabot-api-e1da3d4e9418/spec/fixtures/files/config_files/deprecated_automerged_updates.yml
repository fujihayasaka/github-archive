version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval:
      interval: "daily"
    automerged_updates:
      - dependency-type: "production"
        update-type: "security-patch"
      - dependency-type: "development"
        update-type: "in-range"
      - dependency-name: "rack"
        dependency-type: "direct"
