apiVersion: v1
kind: Service
metadata:
  name: blackbird-query
  labels:
    service: blackbird-query
  annotations:
    # https://moda.githubapp.com/docs/features/load-balancing/#using-variables-in-domain-names
    # For example, this will render out to blackbird-query-production.service.iad.github.net
    # if this is your production deployment in iad.
    moda.github.net/domain-name: "blackbird-query-%environment%.service.%region%.github.net"
    # Enables inbound requests from GLB to continue working after strictTLS is turned on
    # Also makes sure the connection between GLB and the backend is encrypted
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: |
      - http:
          url: https://{{.Instance.Name}}/ready
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: blackbird-query
  type: LoadBalancer
