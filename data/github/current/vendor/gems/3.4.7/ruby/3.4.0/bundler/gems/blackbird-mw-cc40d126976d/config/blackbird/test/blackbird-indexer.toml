# blackbird-indexer config for integration (end2end) tests.
[metrics.exporter]
type = "noop"

[indexer]
partition_target_size = 100000
partition_exp_base = 1.07556

max_ingest_queue_size = 20_048_576 # 20MiB
max_flush_seconds = 2 # 2 seconds
max_memory_index_size = 12_884_901_888 # 12GiB
epoch_check_period_seconds = 1 # 1 second

[kafka]
security_protocol = "plaintext"
# brokers hostname must match whats advertised for kafka service defined in docker-compose.yml
brokers = "blackbird-mw-kafka:29094"
group_suffix = "002"

[cluster.zeta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.zeta"

[cluster.zeta.storage]
type = "emulator"
address = "azurite"
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.zeta.corpus]
name = "Blue"
document_topic_base = "blackbird.v1.GitDocument.Blue"
snapshot_topic_base = "blackbird.v1.SnapshotTreeUpdate.Blue"

[cluster.eta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.eta"

[cluster.eta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.eta.corpus]
name = "Green"
document_topic_base = "blackbird.v1.GitDocument.Green"
snapshot_topic_base = "blackbird.v1.SnapshotTreeUpdate.Green"

[cluster.theta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.theta"

[cluster.theta.storage]
type = "emulator"
address = "azurite"        # defined in docker-compose.yml
container = "int-test-idx" # container name must match whats defined in docker-compose.yml for azurite-storage-init

[cluster.theta.corpus]
name = "Yellow"
document_topic_base = "blackbird.v1.GitDocument.Yellow"
snapshot_topic_base = "blackbird.v1.SnapshotTreeUpdate.Yellow"
