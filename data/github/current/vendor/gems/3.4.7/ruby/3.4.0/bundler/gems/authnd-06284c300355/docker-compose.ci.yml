version: '3.6'
services:
  authnd:
    environment:
      CGO_ENABLED: 0
    build:
      context: .
      dockerfile: Dockerfile
      target: build
      args:
        - MODMODE
    depends_on:
      - "db"
      - "kafka-lite"
  kafka-lite:
    image: ghcr.io/github/kafka-lite/kafka-lite:648019b51bffc32b6e30d90dc82fb0135b5e90dd
    command: ["/kafka-lite", "--store", "memory", "--listen-address", "kafka-lite:9092"]
    ports:
      - '9092:9092'
volumes:
  data:
    driver: local
