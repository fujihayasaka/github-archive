syntax = "proto3";

package github.spokes.diffs.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/diffs";
option ruby_package = "GitHub::Spokes::Proto::Diffs::V1";

// DiffSummaryTextChanges represents the changes for a text file.
message DiffSummaryTextChanges {
    // additions is the number of lines added (including modified lines).
    uint64 additions = 1;

    // deletions is the number of lines deleted (including modified lines).
    uint64 deletions = 2;
}
