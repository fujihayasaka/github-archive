# http://kubernetes.io/docs/user-guide/services
apiVersion: v1
kind: Service

metadata:
  name: launch-receiver
  annotations:
    moda.github.net/allowed-ips: 0.0.0.0/0
    moda.github.net/domain-name: launch-receiver.githubapp.com
    moda.github.net/load-balancer-glb-scope: iad
    moda.github.net/load-balancer-type: public-http
    opaque.github.net/checks: |
      - http:
        url: https://launch-receiver.githubapp.com/_ping
