syntax = "proto3";

package github.spokes.references.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/references";
option ruby_package = "GitHub::Spokes::Proto::References::V1";

import "spokes-api/types/v1/reference.proto";
import "spokes-api/references/v1/update_ref_op_verify.proto";
import "spokes-api/references/v1/update_ref_op_verify_update.proto";
import "spokes-api/references/v1/update_ref_op_update.proto";

// UpdateRefRequest represents a request to update or verify a ref.
message UpdateRefRequest {
    // FastForward reflects whether we should record that the update was a
    // fast forward.
    enum FastForward {
        FAST_FORWARD_INVALID = 0;

        // Don't record whether the update was a fast-forward.
        FAST_FORWARD_OMIT = 1;
        // Compute whether the update was a fast-forward and record that.
        FAST_FORWARD_COMPUTE = 2;
        // Assert that the update is or is not a fast-forward and record that
        // value.
        FAST_FORWARD_TRUE = 3;
        FAST_FORWARD_FALSE = 4;
    }

    // fast_forward indicates the fast forward status of the ref.
    FastForward fast_forward = 1;

    // reference is the ref involved in the update.
    github.spokes.types.v1.Reference reference = 2;

    oneof operation {
      UpdateRefOpVerify ref_verify = 3;
      UpdateRefOpVerifyUpdate ref_verify_update = 4;
      UpdateRefOpUpdate ref_update = 5;
    }
}
