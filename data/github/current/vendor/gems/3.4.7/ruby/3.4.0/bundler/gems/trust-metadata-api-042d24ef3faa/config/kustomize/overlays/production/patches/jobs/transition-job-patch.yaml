kind: Job
metadata:
  name: transition-template-job
spec:
  template:
    spec:
      containers:
        - name: transition
          env:
            # the Azure tenant ID used to authenticate with Azure with a service principal
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_prod_tenant_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_prod_client_id"
            # the Azure client ID used to authenticate with Azure with a service principal
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: "spn_trust_metadata_api_prod"
            - name: TMA_AZURE_BLOB_ACCOUNT
              value: "tmaproduction"
            - name: TMA_AZURE_BLOB_CONTAINER
              value: "attestations"
