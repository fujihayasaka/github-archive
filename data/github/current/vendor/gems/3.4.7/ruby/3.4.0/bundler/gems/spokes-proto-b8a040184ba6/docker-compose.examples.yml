services:
  go_example:
    image: "golang:1.17.0"
    command: ["bash", "-ec", "source env.sh && go run main.go -url http://spokesd:8080"]
    volumes:
      - ".:/src"
      - "go_caches:/root"
    working_dir: "/src/examples/go"
    depends_on:
      - spokesd

  ruby_example:
    image: "ruby:3.0.0"
    command: ["bash", "-ec", "bash bootstrap.sh && source env.sh && bundle exec ruby main.rb http://spokesd:8080"]
    volumes:
      - ".:/src"
      - "ruby_deps:/src/examples/ruby/deps"
    working_dir: "/src/examples/ruby"
    depends_on:
      - spokesd

volumes:
  go_caches:
  ruby_deps:
