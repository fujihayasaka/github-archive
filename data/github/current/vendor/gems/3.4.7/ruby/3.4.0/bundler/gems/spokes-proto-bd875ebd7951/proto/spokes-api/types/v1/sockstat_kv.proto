syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// SockstatKV represents one item of sockstat data.
message SockstatKV {
    // key represents the key for this item.
    string key = 1;

    // These entries are the value for this item.
    oneof value {
       bytes bytes_value = 2;
       int64 int64_value = 3;
       bool bool_value = 4;
       uint64 uint64_value = 5;
    }
}
