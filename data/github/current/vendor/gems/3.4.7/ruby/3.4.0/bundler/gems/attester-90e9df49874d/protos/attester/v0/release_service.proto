syntax = "proto3";

package attester.v0;

import "sigstore_bundle.proto";
import "in_toto_attestation/v1/statement.proto";

option go_package = "attester/v0";
option ruby_package = "MonolithTwirp::Attester::V0";

service ReleaseAPI {
  rpc CreateReleaseAttestation(CreateReleaseAttestationRequest) returns (CreateReleaseAttestationResponse);
}

message CreateReleaseAttestationRequest {
  in_toto_attestation.v1.Statement statement = 1;
}

message CreateReleaseAttestationResponse {
  dev.sigstore.bundle.v1.Bundle bundle = 1;
}

message ReleasePredicate {
  string purl = 1;
  string release_id = 2;
  string tag = 3;
  string repository = 4;
  string repository_id = 5;
  string owner_id = 6;
  optional string enterprise = 7;
  optional string enterprise_id = 8;
}