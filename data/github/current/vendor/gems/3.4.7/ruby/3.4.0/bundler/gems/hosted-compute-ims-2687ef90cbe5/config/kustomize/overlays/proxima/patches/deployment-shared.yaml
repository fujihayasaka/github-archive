- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ENVIRONMENT
    value: '%stamp%'
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HTTP_PROXY
    value: network-proxy.service.github.net:3128
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HTTPS_PROXY
    value: network-proxy.service.github.net:3128
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: NO_PROXY
    value: '*.github.net,*.cluster.local'
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AQUEDUCT_API_KEY_VERSION
    value: "0"