syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/repository.proto";

// MergeObjectSelector is a selector for one of the source entities of a merge
// operation (i.e., left/right/base). The selector does not allow specifying
// objects using a dynamic identifier (e.g. a reference) to ensure consistent
// results across replicas.
message MergeObjectSelector {
    oneof object {
        // by_oid is the object ID of a mergeable entity, e.g.
        // abb31df1fc098985b7a4576847e7d2bca719b8e4
        github.spokes.types.v1.ObjectID by_oid = 1;
    }

    // source_repository is the source repository containing the entity. If
    // unspecified, the source repository is inherited from the request.
    github.spokes.types.v1.Repository source_repository = 2;
}
