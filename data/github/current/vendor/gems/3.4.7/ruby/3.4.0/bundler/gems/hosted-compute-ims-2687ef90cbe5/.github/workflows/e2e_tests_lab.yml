# Triggers a Build Pipelines job that runs E2E tests against Lab environment during every deployment
name: run_e2e_tests_lab
on:
  deployment_status:
  workflow_dispatch:

permissions:
  id-token: write
  packages: read
  contents: read

env:
  GO_VERSION: 1.23
  TERM: linux
  AZURE_TENANT_ID: 398a6654-997b-47e9-b12b-9515b896b4de # Github Azure
  AZURE_CLIENT_ID: 23901513-387b-45a1-a4ae-1c647b0179c5 # spn-hosted-compute-ims-dev

jobs:
  run_e2e_tests_lab:
    name: run_e2e_tests_lab
    if: ${{ github.event.deployment_status == null || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'lab') }}
    # hosted-compute-ims-lab is deployed inside the internal GH network so it is not accessible from regular runners
    # Therefore we use the self-hosted agent to access the lab environment: https://thehub.github.com/epd/engineering/devops/ci/actions/actions-self-hosted-runners/#using-self-hosted-runners-in-other-non-dotcom-repository-workflows
    # runs-on: self-hosted
    runs-on: ubuntu-latest-xl
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.0.1
      - name: Setup minikube environment
        uses: ./.github/actions/setup-minikube-env
        with:
          docker-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: make download
      - name: Vendor dependencies
        run: make vendor
      - name: Build app
        run: script/build
      - name: Setup dependencies
        run: script/setup
      - name: Install tools
        run: make tools-ci
      - name: OIDC Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: d4ec39fa-c14d-4485-a6c1-b66698d5abf6 # GitHub - NonProd - Dev E2E - Hosted Compute IMS - 001
      - name: Run e2e tests in full mode
        run: script/test-e2e --full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #- name: Generating Azure SAS Token for container with test images
      # run: script/ci/generate_container_sas_without_azcli
      #  id: generate-sas-token
      #  env:
      #    AZURE_CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
      #    AZURE_TENANT_ID: ${{ env.AZURE_TENANT_ID }}
      #- uses: hashicorp/vault-action@v2.4.0
      #  id: import-secrets
      #  with:
      #    url: https://vault.service.github.net:8200
      #    caCertificate: ${{ secrets.VAULT_CA_CERT }}
      #    method: jwt
      #    role: github-hosted-compute-ims-lab
      #    secrets: |
      #      secret-kv2/data/apps/hosted-compute-ims/_lab HOSTED_COMPUTE_IMS_HMAC_KEY | HOSTED_COMPUTE_IMS_HMAC_KEY
      #- name: Run E2E tests on Lab
      #  run: script/test-e2e-lab
      #  env:
      #    STORAGE_ACCOUNT_NAME: imstestimages
      #    STORAGE_CONTAINER_SAS_TOKEN: ${{ steps.generate-sas-token.outputs.CONTAINER_SAS_TOKEN }}
      #    E2E_TWIRP_AUTH_HMAC_KEY: ${{ steps.import-secrets.outputs.HOSTED_COMPUTE_IMS_HMAC_KEY }}
      - name: Publish test results to job summary
        run: |
          if [ -f "tests-output.md" ]; then
            cat tests-output.md >> $GITHUB_STEP_SUMMARY
          fi
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: logs
          if-no-files-found: warn
        if: success() || failure()