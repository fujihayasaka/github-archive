syntax = "proto3";

package github.actions.hosted_compute_insights.events.v1;

message WorkflowJobRunCreated {
    // This is the external ID of the workflow job run
    string workflow_job_run_backend_id = 1;
    // This is the external ID of the workflow run 
    string workflow_run_backend_id = 2;
    // This is the database ID of the repository
    int64 repository_database_id = 3;
    // This is the associated check run database ID for the workflow job run
    int64 check_run_database_id = 4;
}
