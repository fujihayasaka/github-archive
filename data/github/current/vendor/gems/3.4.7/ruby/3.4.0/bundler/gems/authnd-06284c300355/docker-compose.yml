version: '3.6'
services:
  db:
    platform: linux/x86_64
    image: mysql@sha256:0f90283199964e9cc2a45c73ed2991da6943f416368025433932ed81007235a7
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - data:/var/lib/mysql
    ports:
      - '3001:3306'
volumes:
  data:
    driver: local
