inherit_gem:
  rubocop-github:
    - config/default.yml

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'bin/**/*'
    - 'lib/zuorest/version.rb'
    - 'lib/zuorest/api/**/*'  # Exclude API files with unusual syntax for now
    - 'lib/zuorest/rest_client.rb'  # Exclude rest_client.rb with unusual syntax for now

# Initially disable rules that would require extensive code changes
Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/RedundantRegexpArgument:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Style/HashSyntax:
  Enabled: false

# Disable layout issues for now
Layout:
  Enabled: false

# Disable performance issues for now  
Performance:
  Enabled: false

# Disable naming issues for now
Naming:
  Enabled: false