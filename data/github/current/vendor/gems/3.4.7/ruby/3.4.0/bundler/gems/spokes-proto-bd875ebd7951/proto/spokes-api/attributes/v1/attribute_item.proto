syntax = "proto3";

package github.spokes.attributes.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/attributes";
option ruby_package = "GitHub::Spokes::Proto::Attributes::V1";

import "spokes-api/types/v1/attribute.proto";
import "spokes-api/types/v1/path.proto";

message AttributeItem {
    // path is the path where the Git attributes were read from.
    github.spokes.types.v1.Path path = 1;

    // attributes is the list of Git attributes for the specified path.
    repeated github.spokes.types.v1.Attribute attributes = 2;
}
