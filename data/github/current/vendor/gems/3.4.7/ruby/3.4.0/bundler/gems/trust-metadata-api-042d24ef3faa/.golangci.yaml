run:
  timeout: 10m
  go: '1.22'
linters:
  enable:
    - revive
    - gofmt
    - goconst
    - tagliatelle
    - whitespace
    - gosec
    - gocritic
    - misspell
    - errcheck
    - errorlint
    - unused
    - staticcheck
    # - wrapcheck
  presets:
    - format
  disable:
    - gofumpt
    - gci
    - tagalign
issues:
  exclude-rules:
    # Skip gosec-G404 for test files
    # G404: Use of weak random number generator (math/rand or math/rand/v2 instead of crypto/rand)
    - path: _test\.go
      text: "G404:"
      linters:
        - gosec
