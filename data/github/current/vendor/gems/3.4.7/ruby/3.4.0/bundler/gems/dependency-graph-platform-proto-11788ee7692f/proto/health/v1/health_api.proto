syntax = "proto3";

package github.dependency_graph_platform.health.v1;

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/health/v1";

service HealthService {
  rpc Ping(PingRequest) returns (PingResponse);
}

// PingRequest - empty RPC message for health checks
message PingRequest {
}

// PingResponse - returns a 200 OK response with a static message
message PingResponse {
    string message = 1;
}
