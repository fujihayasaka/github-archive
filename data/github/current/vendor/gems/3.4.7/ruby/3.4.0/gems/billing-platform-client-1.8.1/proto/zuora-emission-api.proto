syntax = "proto3";

package billing_platform.api.v1;

option go_package = "lib/twirp/proto";
option ruby_package = "BillingPlatform::Api::V1";

import "proto/usage-api.proto";

service ZuoraEmissionAPI {
  rpc GetZuoraEmissions(GetZuoraEmissionsRequest) returns (GetZuoraEmissionsResponse);
}

message GetZuoraEmissionsRequest {
  string customerId = 1;
  int64 year = 2;
  int64 month = 3;
  int64 day = 4;
}

message GetZuoraEmissionsResponse {
  repeated ZuoraEmission emissions = 1;
}

message ZuoraEmission {
  string customerId = 1;
  int64 year = 2;
  int64 month = 3;
  int64 day = 4;
  UsageTotal usageTotal = 5;
  map<string, ProductTotal> ProductTotals = 6;
}