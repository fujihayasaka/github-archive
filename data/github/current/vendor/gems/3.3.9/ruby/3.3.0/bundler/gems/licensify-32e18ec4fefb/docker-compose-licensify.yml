services:
  redis-server:
    container_name: redis-server
    image: redis
    ports:
      - "6379:6379"

  kafka-lite:
    container_name: kafka-lite
    image: ghcr.io/github/kafka-lite/kafka-lite:ef76e63091c87149df0c45b40d3bad2cbe4b4117
    ports:
      - "9092:9092"
    expose:
      - 9092
    command:
      [
        "/kafka-lite",
        "--listen-address",
        "0.0.0.0:9092",
        "--redis-address",
        "redis://redis-server:6379/0",
        "--advertised-listener-address",
        "kafka-lite.localhost:9092",
        "--store",
        "redis",
        "--log-format",
        "production",
        "max-message-age-ms",
        "86400000",
      ]
    depends_on:
      - redis-server

  aqueduct-lite:
    container_name: aqueduct-lite
    image: ghcr.io/github/aqueduct-lite/aqueduct-lite
    ports:
      - 18081:18081
    command:
      [
        "./bin/aqueduct-lite",
        "--redis-address",
        "redis://redis-server:6379/0",
        "--listen-address",
        "0.0.0.0:18081",
      ]
    depends_on:
      - redis-server