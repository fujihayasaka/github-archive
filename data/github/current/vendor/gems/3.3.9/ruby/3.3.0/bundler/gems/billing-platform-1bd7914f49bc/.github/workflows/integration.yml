name: integration
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.vscode/**'
      - 'config/**'
      - 'docs/**'
      - 'proto/**'
  merge_group:
  workflow_dispatch:
  schedule:
    # Run once a day to trigger PAv2 emission tests and avoid IcM incidents about account inactivity
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  check_for_go_file_changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.check_for_go_file_changes.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scheduled/Manual run override
        id: override_step
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Scheduled/Manual run - override check for go file changes"
          echo "on=true" >> $GITHUB_OUTPUT

      - name: check for go file changes
        id: check_for_go_file_changes
        env:
          OVERRIDE_ON: ${{ steps.override_step.outputs.on || 'false' }}
        run: |
          if $OVERRIDE_ON; then
            echo "Scheduled/Manual override is on"
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            if git diff --name-only ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }} ${{ github.sha }} | grep -E '(.*\.go|go\.mod|go\.sum)$'; then
              echo "Go file changes detected"
              echo "changes=true" >> $GITHUB_OUTPUT
            else
              echo "No Go file changes detected, skipping integration tests"
              echo "changes=false" >> $GITHUB_OUTPUT
            fi
          fi

  run_integration:
    needs: check_for_go_file_changes
    if: ${{ needs.check_for_go_file_changes.outputs.changes == 'true' }}
    runs-on: ubuntu-latest-xl
    strategy:
      fail-fast: false

    env:
      GOPROXY: https://goproxy.githubapp.com/mod,https://proxy.golang.org/,direct
      GOPRIVATE: ""
      GONOPROXY: ""
      GONOSUMDB: github.com/github/*
      AZURE_COMMERCE_SPN_CLIENT_SECRET: ${{ secrets.AZURE_COMMERCE_SPN_CLIENT_SECRET }}
      READ_ONLY_SPN_TENANT_ID: ${{ secrets.READ_ONLY_SPN_TENANT_ID_ACTIONS }}
      READ_ONLY_SPN_CLIENT_ID: ${{ secrets.READ_ONLY_SPN_CLIENT_ID_ACTIONS }}
      READ_ONLY_SPN_CLIENT_SECRET: ${{ secrets.READ_ONLY_SPN_CLIENT_SECRET_ACTIONS }}
      ACTIONS_RUN_NUMBER: ${{github.run_number}}
      GITHUB_USER: ${{github.actor}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_SPN_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SPN_CLIENT_SECRET }}","subscriptionId":"57997474-7983-4d65-a2e3-83410c0e43b3","tenantId":"${{ secrets.AZURE_SPN_TENANT_ID }}"}'

      # From https://github.com/github/goproxy/blob/main/doc/user.md#set-up:
      - name: Configure Go private module access
        run: |
          echo "machine goproxy.githubapp.com login nobody password ${{ secrets.CONTAINER_BUILDER_TOKEN }}" >> $HOME/.netrc

      - name: Configure NuGet private package access
        run: |
          dotnet nuget add source --username PAT --password ${{ secrets.CONTAINER_BUILDER_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/github/index.json"

      - name: Configure ghcr.io access
        env:
          CONTAINER_BUILDER_TOKEN: ${{ secrets.CONTAINER_BUILDER_TOKEN }}
        run: |
          docker login -u token -p "${CONTAINER_BUILDER_TOKEN}" ghcr.io

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Setup env variables
        run: script/set-remote ci

      - name: Start Depends
        run: script/dc up -d aqueduct-lite kafka-lite

      - name: Run integration tests (against CosmosDB)
        env:
          GOTESTSUM: true
        run: |
          script/integration-tests

      - name: Stop Depends
        if: always()
        run: script/dc stop
