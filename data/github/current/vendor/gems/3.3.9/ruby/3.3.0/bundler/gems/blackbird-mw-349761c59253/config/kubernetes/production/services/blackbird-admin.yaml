apiVersion: v1
kind: Service
metadata:
  name: blackbird-admin
  labels:
    service: blackbird-admin
  annotations:
    # https://moda.githubapp.com/docs/features/load-balancing/#using-variables-in-domain-names
    # For example, this will render out to blackbird-admin-production.service.iad.github.net
    # if this is your production deployment in iad.
    moda.github.net/domain-name: "blackbird-admin-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: |
      - http:
          url: https://{{.Instance.Name}}/ready
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: blackbird-admin
  type: LoadBalancer
