---
trigger: emoji
title: Emoji reference
surfaces:
   - pull_request
description: Lists the emojis we use in code review comments and their intended meaning.

steps:
   - type: fill
     template: |-
        👍: This is great! It always feels good when somebody likes your work. Show them!
        ❓: I have a question / can you clarify?
        ❌: This has to change. It’s possibly an error or strongly violates existing conventions.
        🔧: This is a well-meant suggestion. Take it or leave it.
        🙃: This is a nitpick. Normally related to a small formatting or stylizing detail that shouldn’t block moving forward.
        💭: I’m just thinking out loud here. Something doesn’t necessarily have to change, but I want to make sure to share my thoughts.
        🤡: This is a complaint about something with no obvious answer, not necessarily a problem originating from changes.
