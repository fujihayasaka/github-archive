syntax = "proto3";

package github.dependency_graph_platform.alerting.v1;

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/alerting/v1";

import "types/v1/manifest.proto";
import "types/v1/dependency.proto";

service AlertingAPI {
    rpc AllRepositoriesWithDependencyVersion(AllRepositoriesWithDependencyVersionRequest) returns (AllRepositoriesWithDependencyVersionResponse);
}

message AllRepositoriesWithDependencyVersionRequest {
    // Required: the ecosystem to search for.
    github.dependency_graph_platform.types.v1.Ecosystem package_ecosystem = 1;

    // Required: the name of the dependency to search for.
    string package_name = 2;

    // Required: the raw requirements string to search for.
    string requirements = 3;

    // Optional: a limit and cursor to paginate the results. If not provided, the first page of results is
    // returned.
    Pagination pagination = 4;
}

message AllRepositoriesWithDependencyVersionResponse {
    repeated RepositoryResult repository_results = 1;
    Cursors next_cursor = 2;
}

message Cursors {
    int64 dgp_declared_requirements_id = 1;
    int64 repository_id = 2;
    int64 dgp_dependency_id = 3;
}

message Pagination {
    // Optional: the number of results to return. Default is determined by DGP, which is not guaranteed to
    // return all results.
    int32 limit = 1;

    // Optional: the cursor to start returning results from. If not provided, the first page of results is
    // returned. Clients should neither interpret nor modify this value.
    Cursors cursor = 2;
}

message RepositoryResult {
    uint64 repository_id = 1;
    string requirements = 2;
    uint64 dgp_dependency_id = 3;
    github.dependency_graph_platform.types.v1.Scope scope = 4;
    string manifest_name = 5;
    string manifest_path = 6;
    github.dependency_graph_platform.types.v1.Relationship relationship = 7;
}
