apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    moda.github.net/inject-unified-service-tag-env-var: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        fluentbit.io/parser: logfmt
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: licensify
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: api
          image: licensify
          command: ["./bin/api"]
          env:
            - name: APP_SHA
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['heaven.githubapp.com/sha']
            - name: APP_REF
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['heaven.githubapp.com/ref']
            - name: GOMAXPROCS
              value: "2"
            - name: STATS_ADDR
              value: $(KUBE_NODE_HOSTNAME):28125
          envFrom:
            - configMapRef:
                name: environment
            - configMapRef:
                name: kube-cluster-metadata
            - secretRef:
                name: vault-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - containerPort: 12345
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /_ping
              port: 12345
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
                cpu: 3
                memory: 2048Mi
            requests:
                cpu: 63m
                memory: 729Mi
