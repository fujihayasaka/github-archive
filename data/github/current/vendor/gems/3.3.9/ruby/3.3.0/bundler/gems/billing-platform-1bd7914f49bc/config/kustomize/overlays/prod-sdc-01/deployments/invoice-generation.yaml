apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-generation
spec:
  replicas: 2
  template:
    spec:
      containers:
      - name: "invoice-generation"
        env:
        - name: DAILY_EMISSION_CUSTOMER_IDS
          value: "81"
        - name: MONTHLY_EMISSION_CUSTOMER_IDS
          value: "81"
