# For integration tests, use a local blackbird build instead of downloading an image from ghcr.
# Used by `script/setup` when `$BLACKBIRD_USE_LOCAL_DEBUG_BUILD` is set.
services:
  blackbird-1:
    pull_policy: build
    build:
      context: ${BLACKBIRD_SRCDIR}
      dockerfile: Dockerfile.actions.release
      args:
        PROFILE: debug
    image: blackbird-local-debug-build

  blackbird-2:
    pull_policy: never
    depends_on:
      - blackbird-1
    image: blackbird-local-debug-build

  blackbird-cache-1:
    pull_policy: never
    depends_on:
      - blackbird-1
    image: blackbird-local-debug-build

  blackbird-mw-admin:
    pull_policy: build
    build:
      context: ${BLACKBIRD_MW_SRCDIR}
      dockerfile: Dockerfile
      args:
        BLACKBIRD_CLIB_IMAGE: blackbird-local-debug-build
        FRONTEND_MODE: without-frontend
    depends_on:
      - blackbird-1
      - blackbird-2
      - blackbird-cache-1
    image: blackbird-mw-local-debug-build

  blackbird-mw-ingest:
    pull_policy: never
    depends_on:
      - blackbird-mw-admin
    image: blackbird-mw-local-debug-build

  blackbird-mw-query:
    pull_policy: never
    depends_on:
      - blackbird-mw-admin
    image: blackbird-mw-local-debug-build
