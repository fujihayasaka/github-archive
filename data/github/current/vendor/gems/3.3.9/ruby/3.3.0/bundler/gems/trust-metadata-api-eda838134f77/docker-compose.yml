services:
  # MySQL Server
  mysql-server:
    image: mysql:8.0.36
    platform: linux/amd64
    container_name: tma-dev-db
    ports:
      - "${TMA_MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${TMA_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${TMA_MYSQL_DATABASE}
      - MYSQL_USER=${TMA_MYSQL_USER}
      - MYSQL_PASSWORD=${TMA_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=3232505856505856 # Set max_allowed_packet to 32M
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  # Azure Storage Emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.31.0
    container_name: "azurite"
    hostname: azurite
    restart: always
    ports:
      # The blob service listenes on port 10000
      - "10000:10000"
