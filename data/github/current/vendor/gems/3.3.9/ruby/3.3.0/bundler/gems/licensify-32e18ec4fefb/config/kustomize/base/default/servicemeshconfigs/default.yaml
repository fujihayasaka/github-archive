apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config
spec:
  authorization:
    create: true
    strictTLS: true

    # List the namespaces that will be authorized to make network requests to this service.
    inboundNamespaces:
      - github-%stamp%
  loadBalancing:
    retryOnReset: true
    useLocalityLoadBalancing: true
