syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/path.proto";
import "spokes-api/types/v1/revision.proto";
import "spokes-api/types/v1/treeish.proto";

// ObjectSelector is a selector for resolving objects.
message ObjectSelector {
    oneof object {
        // e.g. main:proto/types/selectors/v1/object_selector.proto
        TreeishAndPath by_treeish_and_path = 1;

        // e.g. abb31df1fc098985b7a4576847e7d2bca719b8e4
        github.spokes.types.v1.ObjectID by_id = 2;

        // e.g. main, refs/heads/master, abb31df1
        github.spokes.types.v1.Revision by_name = 3;
    }

    message TreeishAndPath {
        github.spokes.types.v1.Treeish treeish = 1;
        github.spokes.types.v1.Path path = 2;
    }
}
