syntax = "proto3";

package github.secretscanning.discussions.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/discussions";
option ruby_package = "GitHub::Proto::SecretScanning::Discussions::V1";

message DiscussionIdentifier {
  // the database ID of the discussion
  uint64 discussion_id = 1;

  // the repo scoped number of the discussion
  uint32 discussion_number = 2;
}
