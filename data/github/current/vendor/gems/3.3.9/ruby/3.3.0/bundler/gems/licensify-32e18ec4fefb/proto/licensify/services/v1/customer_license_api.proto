syntax = "proto3";
package licensify.services.v1;

import "licensify/services/v1/common.proto";

option go_package = "lib/twirp/proto/licensify/services/v1";
option ruby_package = "Licensify::Services::V1";

service CustomerLicenseService {
  rpc GetCustomerLicense(GetCustomerLicenseRequest) returns (GetCustomerLicenseResponse);
  rpc GetCustomerLicenses(GetCustomerLicensesRequest) returns (GetCustomerLicensesResponse);
  rpc UpsertCustomerLicense(UpsertCustomerLicenseRequest) returns (UpsertCustomerLicenseResponse);
  rpc GetLicenseeGlobalIds(GetLicenseeGlobalIdsRequest) returns (GetLicenseeGlobalIdsResponse);
  rpc GetLicenseeIds(GetLicenseeIdsRequest) returns (GetLicenseeIdsResponse);
  rpc SyncOrganizationMemberships(SyncOrganizationMembershipsRequest) returns (SyncOrganizationMembershipsResponse);
}

message GetCustomerLicenseRequest {
  uint64 customerId = 1;
  repeated licensify.services.v1.common.Product products = 2;
  licensify.services.v1.common.Licensee licensee = 3;
}

message GetCustomerLicenseResponse {
  repeated licensify.services.v1.common.CustomerLicense customerLicenses = 1;
}

message GetCustomerLicensesRequest {
  uint64 customerId = 1;
  licensify.services.v1.common.Product product = 2;
}

message GetCustomerLicensesResponse {
  repeated licensify.services.v1.common.CustomerLicense customerLicenses = 1;
}

message UpsertCustomerLicenseRequest {
  licensify.services.v1.common.CustomerLicense customerLicense = 1;
}

message UpsertCustomerLicenseResponse {
}

message GetLicenseeGlobalIdsRequest {
  uint64 customerId = 1;
  licensify.services.v1.common.Product product = 2;
  licensify.services.v1.common.LicenseStatus licenseStatus = 3;
}

message GetLicenseeGlobalIdsResponse {
  repeated string globalIds = 1;
}

message GetLicenseeIdsRequest {
  uint64 customerId = 1;
  licensify.services.v1.common.Product product = 2;
  repeated licensify.services.v1.common.EnablementReason enablementReasons = 3;
}

message GetLicenseeIdsResponse {
  repeated uint64 licenseeIdsDeprecated = 1 [deprecated = true]; // deprecated in favor of string type ids
  repeated string licenseeIds = 2;
}

enum SyncEntityType {
  SYNC_ENTITY_TYPE_UNSPECIFIED = 0;
  SYNC_ENTITY_TYPE_ORGANIZATION = 1;
  SYNC_ENTITY_TYPE_CUSTOMER= 2;
}

message SyncOrganizationMembershipsRequest {
  SyncEntityType entityType = 1;
  uint64 entityId = 2;
}

message SyncOrganizationMembershipsResponse {
  string jobId = 1;
}
