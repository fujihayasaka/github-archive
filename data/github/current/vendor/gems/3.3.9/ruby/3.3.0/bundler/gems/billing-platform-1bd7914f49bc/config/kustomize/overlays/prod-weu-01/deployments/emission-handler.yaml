apiVersion: apps/v1
kind: Deployment
metadata:
  name: emission-handler
spec:
  template:
    spec:
      containers:
      - name: emission-handler
        env:
        - name: DAILY_EMISSION_CUSTOMER_IDS
          value: "476, 481, 486"
        - name: MONTHLY_EMISSION_CUSTOMER_IDS
          value: "476, 481, 486"