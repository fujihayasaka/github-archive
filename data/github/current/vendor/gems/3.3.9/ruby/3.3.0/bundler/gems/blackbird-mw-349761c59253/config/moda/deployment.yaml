environments:
  # Production (dotcom) deployments
  - name: production # query, probers, maintenance, admin
    cluster_selector:
      profile: general
      region: iad
    service_mesh:
      enabled: true
  - name: lab
    secret_environment: production
    auto_deploy: true
    cluster_selector:
      profile: general
      region: iad
    service_mesh:
      enabled: true
  - name: blue
    secret_environment: production
    auto_deploy: true
    cluster_selector:
      profile: general
      region: iad
  - name: green
    secret_environment: production
    auto_deploy: true
    service_mesh:
      enabled: true
    cluster_selector:
      profile: general
      region: iad
  - name: yellow
    secret_environment: production
    auto_deploy: true
