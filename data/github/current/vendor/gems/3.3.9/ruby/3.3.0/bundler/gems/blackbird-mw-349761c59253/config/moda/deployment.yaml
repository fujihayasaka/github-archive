      region: iad

  # Because we cannot yet define our environments via `append_proxima_stamps`,
  # the below environments' configs are keyed manually to the proxima, proxima-blue, proxima-green
  # directories by setting `resource_path` appropriately.

  # staff-wus2-01 (proxima) deployments
