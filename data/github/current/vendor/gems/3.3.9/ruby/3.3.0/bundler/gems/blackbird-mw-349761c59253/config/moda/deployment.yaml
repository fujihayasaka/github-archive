pipelines:
  production_rollout:
    thread_notifications: true
    notify_users_via_dm: false
    auto_start_wait: false
    timeout: 3600 # 1 hr
    stages:
      - name: staff-wus2-01
        kind: concurrent_group
        config:
          timeout: 360
        stages:
          - name: proxima staff-wus2-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: staff-wus2-01
              timeout: 360
          - name: proxima staff-wus2-01-blue
            kind: deployment
            config:
              environment: staff-wus2-01-blue
              timeout: 360
          - name: proxima staff-wus2-01-green
            kind: deployment
            config:
              environment: staff-wus2-01-green
              timeout: 360
      - name: dotcom
        kind: concurrent_group
        config:
          timeout: 360
        stages:
          - name: production (query, probers, maintenance, admin ui, chatops, admin api)
            kind: deployment
            config:
              environment: production
              timeout: 360
          - name: dotcom blue
            kind: deployment
            config:
              environment: blue
              timeout: 360
          - name: dotcom green
            kind: deployment
            config:
              environment: green
              timeout: 360
        gates:
          - kind: datadog
            monitor_id: "136267946" # https://app.datadoghq.com/monitors/136267946
            execution_mode: continuous
            display_name: "Monitoring blackbird-mw query success"
            evaluation_period: 60
      - name: proxima
        kind: concurrent_group
        config:
          timeout: 720
        stages:
          - name: prod-weu-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-weu-01
              timeout: 360
          - name: prod-weu-01-blue
            kind: deployment
            config:
              environment: prod-weu-01-blue
              timeout: 360
          - name: prod-weu-01-green
            kind: deployment
            config:
              environment: prod-weu-01-green
              timeout: 360
          - name: prod-sdc-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-sdc-01
              timeout: 360
          - name: prod-sdc-01-blue
            kind: deployment
            config:
              environment: prod-sdc-01-blue
              timeout: 360
          - name: prod-sdc-01-green
            kind: deployment
            config:
              environment: prod-sdc-01-green
              timeout: 360
          - name: prod-ae-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-ae-01
              timeout: 360
          - name: prod-ae-01-blue
            kind: deployment
            config:
              environment: prod-ae-01-blue
              timeout: 360
          - name: prod-ae-01-green
            kind: deployment
            config:
              environment: prod-ae-01-green
              timeout: 360
        gates:
          - kind: datadog
            monitor_id: "136267946" # https://app.datadoghq.com/monitors/136267946
            execution_mode: continuous
            display_name: "Monitoring blackbird-mw query success"
            evaluation_period: 60

required_builds:
  - "blackbird-mw / docker-image"
  - "blackbird-mw / moda-config-bundle"
  - "Run Go tests"
notifications:
  slack_channels:
    - "#blackbird-ops"
ok_for_moda_to_remove_from_deprecating_clusters: true
auto_start_pipeline: production_rollout
