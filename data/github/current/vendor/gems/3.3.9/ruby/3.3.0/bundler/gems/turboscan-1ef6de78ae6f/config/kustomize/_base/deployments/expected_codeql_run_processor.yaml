apiVersion: apps/v1
kind: Deployment
metadata:
  name: expected-codeql-run-processor
  annotations:
    heaven.githubapp.com/image-placeholder: "turboscan"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: turboscan
      role: expected-codeql-run-processor
  template:
    metadata:
      labels:
        app: turboscan
        role: expected-codeql-run-processor
      annotations:
        observability.github.com/logger: fluent-bit
        fluentbit.io/parser: logfmt
        observability.github.com/splunk_index: turboscan
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: turboscan
          image: turboscan
          command:
            - /app/bin/turboscan
            - service
            - start
            - expectedcodeqlrunprocessorsvc
          env:
            - name: STATS_ADDR
              value: "$(KUBE_NODE_HOSTNAME):28125"
            - name: KAFKA_GROUP
              value: "turboscan_expected_codeql_run_processor"
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  containerName: turboscan
                  resource: limits.cpu
          envFrom:
            - configMapRef:
                name: environment
            - configMapRef:
                name: background-environment
            - secretRef:
                name: vault-secrets
            - configMapRef:
                name: kube-cluster-metadata
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 10
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: 1000m
