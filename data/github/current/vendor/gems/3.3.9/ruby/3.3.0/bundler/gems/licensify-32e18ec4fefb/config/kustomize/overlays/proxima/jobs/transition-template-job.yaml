apiVersion: batch/v1
kind: Job
metadata:
  name: transition-template-job
spec:
  template:
    spec:
      containers:
        - name: transition
          env:
            - name: DB_READ_WRITE_SPN_TENANT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_licensify_cosmosdb_rw_%stamp_with_underscores%_tenant_id
                  name: vault-secrets
            - name: DB_READ_WRITE_SPN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_licensify_cosmosdb_rw_%stamp_with_underscores%_client_id
                  name: vault-secrets
            - name: DB_READ_WRITE_SPN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: spn_licensify_cosmosdb_rw_%stamp_with_underscores%
                  name: vault-secrets