syntax = "proto3";
package licensify.services.v1.common;

import "google/protobuf/timestamp.proto";

option go_package = "lib/twirp/proto/licensify/services/v1";
option ruby_package = "Licensify::Services::V1";

enum Product {
  PRODUCT_UNSPECIFIED = 0;
  PRODUCT_GHAS = 1;
  PRODUCT_SDLC = 2;
}

enum ProductEnablementType {
  PRODUCT_ENABLEMENT_TYPE_UNSPECIFIED = 0;
  PRODUCT_ENABLEMENT_TYPE_ORG = 1;
  PRODUCT_ENABLEMENT_TYPE_REPO = 2;
  PRODUCT_ENABLEMENT_TYPE_ENTERPRISE_SERVER = 3;
}

message ProductEnablement {
  uint64 customerId = 1;
  Product product = 2;
  uint64 enablementId = 3;
  ProductEnablementType enablementType = 4;
  string globalId = 5;
  google.protobuf.Timestamp enabledAt = 6;
}

enum LicenseeType {
  LICENSEE_TYPE_UNSPECIFIED = 0;
  LICENSEE_TYPE_USER = 1;
  LICENSEE_TYPE_ENTERPRISE_SERVER_USER = 2;
}

enum LicenseStatus {
  LICENSE_STATUS_UNSPECIFIED = 0;
  LICENSE_STATUS_ACTIVE = 1;
  LICENSE_STATUS_DEACTIVATED = 2;
  LICENSE_STATUS_SUSPENDED = 3;
}

message Licensee {
  LicenseeType type = 1;
  uint64 id_deprecated = 2 [deprecated = true]; // deprecated in favor of string type id
  string globalId = 3;
  string id = 4;
}

enum EnablementReason {
  ENABLEMENT_REASON_UNSPECIFIED = 0;
  ENABLEMENT_REASON_ORG_MEMBERSHIP = 1;
  ENABLEMENT_REASON_REPOSITORY_COLLABORATOR = 2;
  ENABLEMENT_REASON_ENTERPRISE_SERVER_USER = 3;
}

message CustomerLicenseEnablement {
  ProductEnablementType type = 1;
  EnablementReason reason = 2;
  repeated uint64 enablementIds = 3;
}

message CustomerLicense {
  uint64 customerId = 1;
  Product product = 2;
  Licensee licensee = 3;
  repeated CustomerLicenseEnablement enablements = 4;
  google.protobuf.Timestamp expiresAt = 5;
  LicenseStatus licenseStatus = 6;
  google.protobuf.Timestamp suspendedAt = 7;
}

enum LicensingModel {
  LICENSING_MODEL_UNSPECIFIED = 0;
  LICENSING_MODEL_METERED = 1;
  LICENSING_MODEL_VOLUME = 2;
}

message Customer {
  uint64 id = 1;
  LicensingModel sdlcLicensingModel = 2;
  bool sdlcTrial = 3;
}
