apiVersion: v1
kind: Service
metadata:
  name: blackbird-query
  labels:
    service: blackbird-query
  annotations:
    opaque.github.net/checks: |
        - http:
            url: http://{{.Instance.Name}}/ready
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: blackbird-query
  type: ClusterIP
