apiVersion: apps/v1
kind: Deployment
metadata:
  name: change-feed-processor
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "canary"
spec:
  selector:
    matchLabels:
      canary: "production"
  template:
    metadata:
      labels:
        canary: "production"
    spec:
      dnsPolicy: ClusterFirst
      containers:
      - name: change-feed-processor
        resources:
          requests:
            cpu: "1000m"
            memory: "3000Mi"
          limits:
            cpu: "1500m"
            memory: "4000Mi"
