apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "canary"
spec:
  selector:
    matchLabels:
      app: api
      canary: production
  template:
    metadata:
      labels:
        canary: production
    spec:
      containers:
        - name: api
          env:
            - name: DB_READ_WRITE_SPN_TENANT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_licensify_cosmosdb_rw_prod_tenant_id
                  name: vault-secrets
            - name: DB_READ_WRITE_SPN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_licensify_cosmosdb_rw_prod_client_id
                  name: vault-secrets
            - name: DB_READ_WRITE_SPN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: spn_licensify_cosmosdb_rw_prod
                  name: vault-secrets
