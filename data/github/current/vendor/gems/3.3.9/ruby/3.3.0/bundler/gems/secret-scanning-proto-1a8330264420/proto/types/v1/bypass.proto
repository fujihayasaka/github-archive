syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

import "google/protobuf/timestamp.proto";

// This represents a delegated bypass request, queried from Repos Security's `exemption_requests` DB table.
message DelegatedBypassRequest {
    // Corresponds to the `exemption_requests.resource_identifier` column, as well as `secret_scanning_push_protections_bypass_placeholders.ksuid`
    string placeholder_ksuid = 1;

    // Corresponds to `exemption_requests.id`
    uint64 exemption_request_id = 2;

    // Corresponds to `exemption_requests.expires_at`
    google.protobuf.Timestamp expires_at = 3;

    // The secret-scanning-specific reason why the requester wants to bypass. Stored in `exemption_requests.metadata`
    BypassReason reason = 4;
}

enum BypassReason {
    BYPASS_REASON_UNKNOWN = 0;
    BYPASS_REASON_FALSE_POSITIVE = 1;
    BYPASS_REASON_WILL_FIX_LATER = 2;
    BYPASS_REASON_USED_IN_TESTS = 3;
}