apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-report
spec:
  template:
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: usage-report
          env:
          - name: KUSTO_BLOB_EXPORT_STORAGE_ACCOUNT_ENDPOINT
            value: https://mbstaffwus201.blob.core.windows.net
          - name: KUSTO_ENDPOINT
            value: https://ede-billing-staffship.westus2.kusto.windows.net
          - name: IS_PROXIMA
            value: "true"
          - name: HYDRO_CONSUMER_GROUP_ID
            value: usage-ingestion-production-consumerV2-staff-wus2-01
