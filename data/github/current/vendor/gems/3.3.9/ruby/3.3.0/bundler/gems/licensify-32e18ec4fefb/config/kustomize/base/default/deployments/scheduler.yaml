apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  annotations:
    moda.github.net/inject-unified-service-tag-env-var: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
      annotations:
        fluentbit.io/parser: logfmt
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: licensify
    spec:
      dnsPolicy: ClusterFirst
      containers:
      - name: scheduler
        image: licensify
        command: ["./bin/scheduler"]
        env:
        - name: script
          value: build
        - name: APP_SHA
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['heaven.githubapp.com/sha']
        - name: APP_REF
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['heaven.githubapp.com/ref']
        - name: GOMAXPROCS
          value: "2"
        - name: STATS_ADDR
          value: "$(KUBE_NODE_HOSTNAME):28125"
        envFrom:
          - configMapRef:
              name: environment
          - configMapRef:
              name: kube-cluster-metadata
          - secretRef:
              name: vault-secrets
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        readinessProbe:
          exec:
            command:
              - cat
              - /tmp/consumer_healthy
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "0.4"
            memory: "1024Mi"
          limits:
            # Adjust GOMAXPROCS in tandem. It's recommended the cpu limit be set to GOMAXPROCS+1.
            cpu: 3.0
            memory: "4096Mi"
