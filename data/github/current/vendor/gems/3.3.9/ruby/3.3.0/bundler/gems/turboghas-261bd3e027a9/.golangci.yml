run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - goimports
    - gosec
    - govet
    - misspell
    - predeclared
    - sqlclosecheck
    - stylecheck
    - thelper
    - unconvert
    - wastedassign
  disable:
    - forcetypeassert
    - nolintlint

linters-settings:
  exhaustive:
    default-signifies-exhaustive: false # worth the slight annoyance in exchange for guaranteed completeness on GORM and other methods
  stylecheck:
    checks: ["ST1000", "ST1020", "ST1021", "ST1022", "ST1023", "ST1016"]
  errcheck:
    check-type-assertions: true
  gosec:
    excludes:
      - "G307" # deferring methods with errors. This duplicates errcheck, and I don't want to have to use two nolints.
      - "G304" # potential file includes as a variable. This is too hard for a linter to know if it's correct or not.
      - "G204" # subprocess launched with variable. This is too hard for a linter to know if it's correct or not.
      - "G104" # unhandled errors. This duplicates errcheck, which has better filtering.
      - "G301" # directory permissions too open
      - "G302" # file permissions too open
      - "G306" # file permissions too open
      - "G404" # use of insecure rand

issues:
  exclude-use-default: false
  exclude:
    # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
    - 'Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked'
  exclude-rules:
    - linters:
        - staticcheck
      text: "SA1019:" # ignore deprecation warnings
    - linters: gocritic
      text: "could simplify .* repoID.AsKVP" # ignore as it's a false positive. AsKVP is not a pointer receiver.
