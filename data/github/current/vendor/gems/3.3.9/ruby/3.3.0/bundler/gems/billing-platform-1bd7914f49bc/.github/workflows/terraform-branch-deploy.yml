name: Terraform Branch Deploy

on:
  issue_comment:
    types: [ created ]

jobs:
  terraform-branch-deploy:
    uses: github/cosmosdb/.github/workflows/branch-deploy.yml@6defddcf4abef3af9314cba370bf6f3979c8ff16
    with:
      paved-path: true
      terraform-directory: config/terraform
      environment-targets: production, staff-wus2-01, prod-weu-01, prod-sdc-01, prod-ae-01
      terraform-version: 1.4.4
    secrets:
      tfe-host: ${{ secrets.TFE_HOST }}
      tfe-token: ${{ secrets.TFE_TOKEN }}
