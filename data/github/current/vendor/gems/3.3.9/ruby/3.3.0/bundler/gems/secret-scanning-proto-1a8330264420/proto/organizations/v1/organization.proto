syntax = "proto3";

package github.secretscanning.organizations.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/organizations";
option ruby_package = "GitHub::Proto::SecretScanning::Organizations::V1";

import "google/protobuf/timestamp.proto";

message Organization {
  // The id of the org.
  uint64 id = 1;

  // The login of the org.
  string login = 2;

  // The billing plan of the org.
  string billing_plan = 3;

  // Is the org spammy.
  bool spammy = 4;

  // The org global relay id for the GitHub Platform.
  string global_relay_id = 5;

  // The created at timestamp for the org.
  google.protobuf.Timestamp created_at = 6;

  // Is the org suspended.
  bool suspended = 7;

  // The spamurai classification for the org.
  enum SpamuraiClassification {
    SPAMURAI_CLASSIFICATION_UNKNOWN = 0;
    HAMMY = 1;
    SPAMMY = 2;
  }
  SpamuraiClassification spamurai_classification = 8;

  // The org's billing email, also known as contact email.
  string billing_email = 9;

  // The id of the business that owns the org.
  string business_id = 10;
}
