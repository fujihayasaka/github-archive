syntax = "proto3";

package github.trust_metadata_api;
import "sigstore/sigstore_bundle.proto";
import "google/protobuf/timestamp.proto";
option go_package = "rpc/v0";
option ruby_package = "Proto::TrustMetadataApi::V0";

service GitHubAPI {
  rpc GetAttestationByRepository(GetAttestationByRepositoryRequest) returns (GetAttestationByRepositoryResponse);
  rpc GetAttestationSummaryByRepository(GetAttestationSummaryByRepositoryRequest) returns (GetAttestationSummaryByRepositoryResponse);
  rpc ListAttestationsBySubjectDigest(ListAttestationsBySubjectDigestRequest) returns (ListAttestationsBySubjectDigestResponse);
  rpc CreateAttestationByOwnerRepository(CreateAttestationByOwnerRepositoryRequest) returns (CreateAttestationByOwnerRepositoryResponse);
  rpc ListAttestationsByRepositorySummary(ListAttestationsByRepositoryRequest) returns (ListAttestationsByRepositorySummaryResponse);
  rpc ListAttestationSummariesByRepository(ListAttestationsByRepositoryRequest) returns (ListAttestationSummariesByRepositoryResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

service PackageInfoReadAPI {
  rpc GetPackageAttestations(GetPackageAttestationsRequest) returns (GetPackageAttestationsResponse);
  rpc GetPackageProvenanceSummary(GetPackageProvenanceSummaryRequest) returns (GetPackageProvenanceSummaryResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message GetPackageAttestationsRequest {
  string purl = 1;
  optional uint64 owner_id = 2;
  optional uint64 repository_id = 3;
}

message GetAttestationByRepositoryRequest {
  uint64 attestation_id = 1;
  optional uint64 owner_id = 2;
  optional uint64 repository_id = 3;
}

message GetAttestationByRepositoryResponse {
  ArtifactAttestation attestation = 1;
  ProvenanceSummary provenance_summary = 2;
}

message ListAttestationsBySubjectDigestRequest{
  string subject_digest = 1;
  uint64 owner_id = 2;
  optional uint64 repository_id = 3;
  optional uint64 before = 4;
  optional uint64 after = 5;
  optional uint32 per_page = 6;
}

message ListAttestationsByRepositoryRequest{
  uint64 owner_id = 1;
  uint64 repository_id = 2;
  optional uint64 before = 3;
  optional uint64 after = 4;
  optional uint32 per_page = 5;
}

message GetPackageAttestationsResponse {
  repeated PackageAttestation attestations = 1;
}

// ref: https://docs.github.com/en/graphql/reference/objects#pageinfo
message PageInfo {
  uint64 endCursor = 1; // When paginating forwards, the cursor to continue.
  uint64 startCursor = 2; // When paginating backwards, the cursor to continue.
  bool hasNextPage = 3; // When paginating forwards, are there more items?.
  bool hasPreviousPage = 4; // When paginating backwards, are there more items?.
}

message ListAttestationsBySubjectDigestResponse {
  uint64 owner_id = 1;
  uint64 repository_id = 2;
  repeated ArtifactAttestation attestations = 3;
  PageInfo page_info = 4;
}

message GetPackageProvenanceSummaryRequest {
  string purl = 1;
}

message GetPackageProvenanceSummaryResponse {
  ProvenanceSummary provenance_summary = 1;
}

message GetAttestationSummaryByRepositoryRequest {
  uint64 attestation_id = 1;
  optional uint64 owner_id = 2;
  optional uint64 repository_id = 3;
}

message GetAttestationSummaryByRepositoryResponse {
  AttestationSummary attestation_summary = 1;
  CertificateSummary certificate_summary = 2;
}

message Subject {
  string subject_digest = 1;
  string subject_name = 2;
}

message AttestationSummary {
  uint64 id = 1;
  uint64 owner_id = 2;
  uint64 repository_id = 3;
  google.protobuf.Timestamp created_at = 4;
  string subject_digest = 5;
  string predicate_type = 6;
  optional CertificateSummary certificate_summary = 7;
  string subject_name = 8;
  repeated Subject subjects = 9;
  optional uint64 subjects_count = 10;
}

message ListAttestationsByRepositorySummaryResponse {
  uint64 owner_id = 1;
  uint64 repository_id = 2;
  repeated AttestationSummary attestation_summaries = 3;
  PageInfo page_info = 4;
}

message ListAttestationSummariesByRepositoryResponse {
  uint64 owner_id = 1;
  uint64 repository_id = 2;
  repeated AttestationSummary attestation_summaries = 3;
  PageInfo page_info = 4;
}

message SubjectAlternativeName {
  string type = 1;
  string value = 2;
}

message CertificateSummary {
  string issuer = 1;
  string build_signer_uri = 2;
  string build_signer_digest = 3;
  string runner_environment = 4;
  string source_repository_uri = 5;
  string source_repository_digest = 6;
  string source_repository_ref = 7;
  string source_repository_identifier = 8;
  string source_repository_owner_uri = 9;
  string source_repository_owner_identifier = 10;
  string build_config_uri = 11;
  string build_config_digest = 12;
  string build_trigger = 13;
  string run_invocation_uri = 14;
  string source_repository_visibility_at_signing = 15;
  SubjectAlternativeName subject_alternative_name= 16;
}

message ProvenanceSummary {
  string subject_alternative_name = 1;
  string certificate_issuer = 2;
  string issuer = 3;
  string issuer_display_name = 4;
  string build_trigger = 5;
  string build_config_uri = 6;
  string source_repository_uri = 7;
  string source_repository_digest = 8;
  string source_repository_ref = 9;
  string run_invocation_uri = 10;
  google.protobuf.Timestamp expires_at = 11;
  google.protobuf.Timestamp included_at = 12;
  string resolved_source_repository_commit_uri = 13;
  string transparency_log_uri = 14;
  string build_config_display_name = 15;
  string resolved_build_config_uri = 16;
  string artifact_name = 17;
}

service PackageInfoWriteAPI {
  rpc CreatePackageAttestation(CreatePackageAttestationRequest) returns (CreatePackageAttestationResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message CreatePackageAttestationRequest {
  string purl = 1;
  dev.sigstore.bundle.v1.Bundle bundle = 2;
  optional uint64 owner_id = 3;
  optional uint64 repository_id = 4;
}

message CreateAttestationByOwnerRepositoryRequest {
  dev.sigstore.bundle.v1.Bundle bundle = 1;
  uint64 owner_id = 2;
  uint64 repository_id = 3;
}

message CreatePackageAttestationResponse {
  uint64 attestation_id = 1;
}

message CreateAttestationByOwnerRepositoryResponse {
  uint64 attestation_id = 1;
}

message PackageAttestation {
  string predicate_type = 1;
  dev.sigstore.bundle.v1.Bundle bundle = 2;
  string signed_access_signature_url = 3;
}

message ArtifactAttestation {
  uint64 id = 1;
  string predicate_type = 2;
  dev.sigstore.bundle.v1.Bundle bundle = 3;
  string subject_digest = 4;
  uint64 owner_id = 5;
  uint64 repository_id = 6;
  google.protobuf.Timestamp created_at = 7;
  ProvenanceSummary provenance_summary = 8;
  uint64 tenant_id = 9;
  string signed_access_signature_url = 10;
}

service TrustMetadataAPI {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc LogErr(LogErrRequest) returns (LogErrResponse);
}

message StatusRequest {};

message StatusResponse {
  string state = 1;
  string commit = 2;
}

message LogErrRequest {
  string message = 1;
};

message LogErrResponse {
  string errorMessage = 1;
}
