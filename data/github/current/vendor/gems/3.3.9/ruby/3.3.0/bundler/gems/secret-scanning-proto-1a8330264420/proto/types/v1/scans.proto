syntax = "proto3";

package github.secretscanning.types.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/types";
option ruby_package = "GitHub::Proto::SecretScanning::Types::V1";

import "google/protobuf/timestamp.proto";
import "types/v1/owners.proto";
import "types/v1/job_groups.proto";

enum ScanStatus {
  SCAN_STATUS_UNKNOWN = 0;
  SCAN_STATUS_PENDING = 1;
  SCAN_STATUS_QUEUED = 2;
  SCAN_STATUS_STARTED = 3;
  SCAN_STATUS_COMPLETED = 4;
  SCAN_STATUS_FAILED = 5;
  SCAN_STATUS_CANCELLED = 6;
  SCAN_STATUS_PAUSED = 7;
  SCAN_STATUS_TERMINAL = 8;
  SCAN_STATUS_PARENT_JOB_GROUP_CANCELLED = 9;
}

enum ScanType {
  SCAN_TYPE_UNKNOWN = 0;
  SCAN_TYPE_DRY_RUN = 1;
  SCAN_TYPE_PUSH = 2;
  SCAN_TYPE_BACKFILL = 3;
  SCAN_TYPE_CUSTOM_PATTERN_BACKFILL = 4;
  SCAN_TYPE_CONTENT_BACKFILL = 5;
  SCAN_TYPE_PULL_REQUEST_BACKFILL = 6;
  SCAN_TYPE_INCR_GENERIC_SECRETS = 7;
  SCAN_TYPE_GENERIC_SECRETS_BACKFILL = 8;
  SCAN_TYPE_DISCUSSION_BACKFILL = 9;
  SCAN_TYPE_WIKI_BACKFILL = 10;
  SCAN_TYPE_HCS_UPGRADE_BACKFILL = 11;
  SCAN_TYPE_HCS_UPGRADE_CONTENT_BACKFILL = 12;
  SCAN_TYPE_HCS_UPGRADE_PULL_REQUEST_BACKFILL = 13;
  SCAN_TYPE_HCS_UPGRADE_DISCUSSION_BACKFILL = 14;
  SCAN_TYPE_HCS_UPGRADE_WIKI_BACKFILL = 15;
}

message Scan {
  uint64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  uint64 repository_id = 4;
  ScanStatus scan_status = 5;
  ScanType scan_type = 6;
  uint64 job_group_id = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string aqueduct_job_id = 10;
  uint32 restart_count = 11;
  string hcs_changelog_version = 12;
  // the repository owner id
  uint64 owner_id = 13;
  // The type of repository owner, organization or user
  OwnerScope owner_scope = 14;
  // JobGroup will be null if the scan was not part of a job group
  JobGroup job_group = 15;
}
