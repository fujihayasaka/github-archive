apiVersion: v1
kind: Service
metadata:
  name: trust-metadata-api
  labels:
    service: trust-metadata-api
  annotations:
    moda.github.net/domain-name: trust-metadata-api-%cluster%.service.%site%.github.net
    moda.github.net/istio-ingress-enabled: "true"
    moda.github.net/load-balance-across-clusters: "false"
    moda.github.net/load-balancer-type: internal-http
