version: 2
registries:
  ghcr: # Define access for a private registry
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{secrets.CONTAINER_BUILDER_TOKEN}}
  terraform.githubapp.com:
    type: terraform-registry
    url: https://terraform.githubapp.com/
    token: ${{ secrets.TFE_TOKEN }}
updates:
  - package-ecosystem: "docker"
    registries:
      - ghcr
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "gomod"
    directory: "/" # Location of go.mod
    schedule:
      interval: "weekly"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "github/internal-actions"
  - package-ecosystem: "terraform"
    registries:
      - terraform.githubapp.com
    directories:
      - "/config/terraform/application"
      - "/config/terraform/azure-blob-storage"
      - "/config/terraform/fetch-secrets"
      - "/config/terraform/prod-weu-01"
      - "/config/terraform/production"
      - "/config/terraform/staff-wus2-01"
    schedule:
      interval: weekly
