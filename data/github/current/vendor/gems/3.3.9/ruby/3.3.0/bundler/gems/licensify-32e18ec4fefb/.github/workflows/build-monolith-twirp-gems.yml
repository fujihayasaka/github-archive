name: Build Monolith Twirp Gems
on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  build:
    name: Build Rubygem
    uses: github/monolith-twirp-tools/.github/workflows/build-and-publish-gem.yml@v1
    with:
      namespace: licensing
      module_root: monolith-twirp-proto
      publish: ${{ github.ref == 'refs/heads/main' }}
