syntax = "proto3";

package github.secretscanning.blobs.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/blobs";
option ruby_package = "GitHub::Proto::SecretScanning::Blobs::V1";

// BlobsAPI contains APIs for blobs
service BlobsAPI {
  // GetLocations fetches the first revision containing for each blob
  rpc GetLocations(GetLocationsRequest) returns (GetLocationsResponse);
}

message GetLocationsRequest {
  uint64 repository_id = 1;
  repeated string blob_oids = 2;
}

message GetLocationsResponse {
  message BlobRevision {
    string blob_oid = 1;
    string commit_oid = 2;
    bytes path = 3;
  }

  repeated BlobRevision attributed_blobs = 1;
}
