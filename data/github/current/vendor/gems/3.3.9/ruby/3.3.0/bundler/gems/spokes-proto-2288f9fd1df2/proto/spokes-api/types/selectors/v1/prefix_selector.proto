syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/prefix.proto";

// PrefixSelector is a selector for selecting based on a prefix matcher.
message PrefixSelector {
    // prefixes are the prefixes to match against.
    repeated github.spokes.types.v1.Prefix prefixes = 1;
}
