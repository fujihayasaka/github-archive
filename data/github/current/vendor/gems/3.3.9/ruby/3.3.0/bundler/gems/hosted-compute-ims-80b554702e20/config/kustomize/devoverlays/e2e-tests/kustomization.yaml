resources:
- "../../base/hosted-compute-ims-api"
- "../../base/hosted-compute-ims-worker"
- oidc-shim.yaml

namespace: hosted-compute-ims

components:
- "../base-patches"

patches:
# override environment variables
- path: env-deployments.yaml
  target:
    kind: Deployment
    name: ^hosted-compute-ims-.*
# wait for all dependencies to wake up
- path: wait-for-dependencies-patch.yaml
  target:
    kind: Deployment
    name: ^hosted-compute-ims-.*