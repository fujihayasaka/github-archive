syntax = "proto3";

package github.dependency_graph_platform.experimental;
import "google/protobuf/timestamp.proto";

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/v1/experimental";

service DependenciesAPI {
    rpc GetDependencies(GetDependenciesRequest) returns (GetDependenciesResponse);
}

message Cursor {
    bytes value = 1;
}

message GetDependenciesRequest {
    // Required: the GitHub repository ID.
    uint64 repository_id = 1;
    // Optional: the full path to the manifest file. By default, all manifests will be returned.
    string manifest_path = 2;
    // Optional: a substring query to filter the dependencies. By default, all dependencies will be returned.
    string query = 3;
    // Optional: the cursor to paginate through the results.
    Cursor cursor = 4;
}

message GetDependenciesResponse {
    message TransitiveDependency {
        string package_name = 1;
        string requirements = 2;
    }
    message Dependency {
        PackageManager package_manager = 1;
        string package_name = 2;
        string requirements = 3;
        string manifest_path = 4;
        Scope scope = 5;
        Relationship relationship = 6;
        string license = 7;
        google.protobuf.Timestamp updated_at = 8;
        repeated TransitiveDependency dependencies = 9;
    }
    repeated Dependency dependencies = 1;
    Cursor next_cursor = 2;
}

// Keep in sync with dependency-graph-api
// https://github.com/github/dependency-graph-api/blob/c8e964eccb9a74c149e4f938e1f842ab688164b1/proto/twirp/v1/dependency_graph_api.proto#L98
enum PackageManager {
  PACKAGE_MANAGER_UNKNOWN = 0;
  PACKAGE_MANAGER_RUBYGEMS = 1;
  PACKAGE_MANAGER_NPM = 2;
  PACKAGE_MANAGER_PIP = 3;
  PACKAGE_MANAGER_MAVEN = 4;
  PACKAGE_MANAGER_NUGET = 5;
  PACKAGE_MANAGER_COMPOSER = 6;
  PACKAGE_MANAGER_GOMOD = 7;
  PACKAGE_MANAGER_RUST = 8;
  PACKAGE_MANAGER_ACTIONS = 9;
  PACKAGE_MANAGER_PUB = 10;
  PACKAGE_MANAGER_SWIFT = 11;
}

enum Scope {
  SCOPE_UNKNOWN = 0;
  SCOPE_RUNTIME = 1;
  SCOPE_DEVELOPMENT = 2;
}

enum Relationship {
    RELATIONSHIP_UNKNOWN = 0;
    RELATIONSHIP_DIRECT = 1;
    RELATIONSHIP_TRANSITIVE = 2;
}
