name: Rubocop and type check
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Bootstrap
        env:
          GITHUB_USER: ${{ secrets.OCTOFACTORY_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: bash ./script/bootstrap --ci

      - name: Rubocop
        run: bundle exec rubocop

      - name: Type check
        run: bundle exec srb tc
