apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespaces/namespace.yaml
  - ../../base/default
  - ./servicemeshconfigs/default.yaml

patchesStrategicMerge:
  - configmaps/environment.yaml
  - ./deployments/admin.yaml
  - ./deployments/api.yaml
  - ./deployments/azure-emission.yaml
  - ./deployments/emission-handler.yaml
  - ./deployments/customer-azure-emission-daily-rollup.yaml
  - ./deployments/customer-zuora-emission-daily-rollup.yaml
  - ./deployments/customer-daily-rollup.yaml
  - ./deployments/customer-monthly-rollup.yaml
  - ./deployments/customer-yearly-rollup.yaml
  - ./deployments/high-watermark-rollover-handler.yaml
  - ./deployments/hydro-consumer.yaml
  - ./deployments/invoice-generation.yaml
  - ./deployments/request-handler.yaml
  - ./deployments/scheduler.yaml
  - ./deployments/usage-ingestion.yaml
  - ./deployments/usage-report.yaml
  - ./deployments/zero-out-quantities-handler.yaml
  - ./deployments/change-feed-processor.yaml
  - ./deployments/failed-rollup-processor.yaml
  - ./deployments/watermark-handler.yml