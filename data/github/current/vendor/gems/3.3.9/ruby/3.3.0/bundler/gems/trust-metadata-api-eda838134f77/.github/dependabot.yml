---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    ignore:
      - dependency-name: "github/internal-actions"
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "go.opentelemetry.io/*" # github/github-telemetry-go indirect dependency
      - dependency-name: "github.com/sigstore/sigstore-go" # TODO: temporarily ignore breaking changes until they can be addressed. See https://github.com/github/trust-metadata-api/pull/517
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "sigstore/*" # Don't group sigstore updates, potential breaking changes require fixes in TMA
