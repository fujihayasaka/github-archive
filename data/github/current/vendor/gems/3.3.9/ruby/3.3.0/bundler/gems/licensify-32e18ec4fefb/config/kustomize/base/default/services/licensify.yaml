apiVersion: v1
kind: Service
metadata:
  name: licensify
  labels:
    service: licensify
  annotations:
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 12345
    protocol: TCP
    targetPort: http
  selector:
    app: api
  type: LoadBalancer
