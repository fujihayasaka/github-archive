syntax = "proto3";

package github.turboghas;

import "entity_type.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./;proto";
option ruby_package = "Turboghas::Proto";

service AdvancedSecurityAPI {
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  rpc GetRepositories(GetRepositoriesRequest) returns (GetRepositoriesResponse);
  rpc GetOrganizations(GetOrganizationsRequest) returns (GetOrganizationsResponse);
  rpc GetEnterpriseUsers(GetEnterpriseUsersRequest) returns (GetEnterpriseUsersResponse);
  rpc GetCommittersForBusiness(GetCommittersForBusinessRequest) returns (GetCommittersResponse);
  rpc GetCommittersForOwner(GetCommittersForOwnerRequest) returns (GetCommittersResponse);
  rpc GetActiveCommitters(GetActiveCommittersRequest) returns (GetActiveCommittersResponse);
  rpc GetAdditionalCommittersPerRepository(GetAdditionalCommittersPerRepositoryRequest) returns (GetAdditionalCommittersPerRepositoryResponse);

  rpc GetMeterEmissions(GetMeterEmissionsRequest) returns (GetMeterEmissionsResponse);
}

message GetMeterEmissionsRequest {
  uint64 entity_id = 1;
  code_scanning.turboghas.v1.EntityType entity_type = 2;
  uint64 customer_id = 3;
  repeated uint64 additional_user_ids = 4;
}

message GetMeterEmissionsResponse {
  repeated uint64 added = 1;
  repeated uint64 removed = 2;
}

message Owner {
  uint64 id = 1;
  string login = 2;
}

message GetActiveCommittersRequest {
  uint64 entity_id = 1;
  code_scanning.turboghas.v1.EntityType entity_type = 2;
}

message GetActiveCommittersResponse {
  message User {
    uint64 id = 1;
  }
  repeated User users = 1;
}

message GetSummaryRequest {
  uint64 entity_id = 1;
  code_scanning.turboghas.v1.EntityType entity_type = 2;
  repeated uint64 repository_ids = 3;
  uint64 customer_id = 4;
  repeated uint64 additional_user_ids = 5;
}

message GetSummaryResponse {
  uint64 active_committers = 1;
  uint64 maximum_committers = 2;
  uint64 additional_committers = 3;
  uint64 unique_committers = 4;
  uint64 additional_metered_committers = 5;
}

message Cursor {
  uint64 offset = 1;
}

enum Order {
  ORDER_INVALID = 0;
  ORDER_ASC = 1;
  ORDER_DESC = 2;
}

message GetRepositoriesRequest {
  enum Column {
    REPOSITORIES_ORDER_INVALID = 0;
    REPOSITORIES_ORDER_NAME = 1;
    REPOSITORIES_ORDER_COMMITTERS = 2;
    REPOSITORIES_ORDER_UNIQUE_COMMITTERS = 3;
  }
  message ColumnOrder {
    Column column = 1;
    Order order = 2;
  }

  uint64 owner_id = 1;
  Cursor cursor = 2;
  repeated ColumnOrder column_order = 3;
  uint32 limit = 4;
}

message GetRepositoriesResponse {
  message Repository {
    uint64 id = 1;
    uint64 active_committers = 2;
    uint64 unique_committers = 3;
    string name = 4;
  }
  repeated Repository repositories = 1;
  uint64 count = 2;
  Cursor next_cursor = 3;
}

message GetOrganizationsRequest {
  enum Column {
    ORGANIZATIONS_ORDER_INVALID = 0;
    ORGANIZATIONS_ORDER_LOGIN = 1;
    ORGANIZATIONS_ORDER_COMMITTERS = 2;
    ORGANIZATIONS_ORDER_UNIQUE_COMMITTERS = 3;
  }
  message ColumnOrder {
    Column column = 1;
    Order order = 2;
  }

  uint64 business_id = 1;
  repeated ColumnOrder column_order = 2;
  Cursor cursor = 3;
  uint32 limit = 4;
}

message GetOrganizationsResponse {
  message Organization {
    uint64 id = 1;
    uint64 active_committers = 2;
    uint64 unique_committers = 3;
    string login = 4;
  }
  repeated Organization organizations = 1;
  uint64 count = 2;
  Cursor next_cursor = 3;
}

message GetEnterpriseUsersRequest {
  enum Column {
    ENTERPRISE_USERS_ORDER_INVALID = 0;
    ENTERPRISE_USERS_ORDER_LOGIN = 1;
    ENTERPRISE_USERS_ORDER_COMMITTERS = 2;
    ENTERPRISE_USERS_ORDER_UNIQUE_COMMITTERS = 3;
  }
  message ColumnOrder {
    Column column = 1;
    Order order = 2;
  }
  uint64 business_id = 1;
  repeated ColumnOrder column_order = 2;
  Cursor cursor = 3;
  uint32 limit = 4;
}

message GetEnterpriseUsersResponse {
  message User {
    uint64 id = 1;
    uint64 active_committers = 2;
    uint64 unique_committers = 3;
    string login = 4;
  }
  repeated User users = 1;
  uint64 count = 2;
  Cursor next_cursor = 3;
}

enum CommitterType {
  ACTIVE_COMMITTERS = 0;
  MAXIMUM_COMMITTERS = 1;
  ADDITIONAL_COMMITTERS = 2;
}

message GetCommittersForBusinessRequest {
  uint64 business_id = 1;
  Cursor cursor = 2;
  uint32 limit = 3;
  CommitterType committer_type = 4;
  repeated uint64 repository_ids = 5;
}

message GetCommittersForOwnerRequest {
  uint64 owner_id = 1;
  Cursor cursor = 2;
  uint32 limit = 3;
  CommitterType committer_type = 4;
  repeated uint64 repository_ids = 5;
}

message GetCommittersResponse {
  message Committer {
    uint64 id = 1;
    string login = 2;
    uint64 repository_id = 3;
    string repository_nwo = 4;
    google.protobuf.Timestamp pushed_at = 5;
    bytes email = 6;
  }
  repeated Committer committers = 1;
  uint64 count = 2;
  Cursor next_cursor = 3;
}

message GetAdditionalCommittersPerRepositoryRequest {
  enum Filter {
    ADDITIONAL_COMMITTERS_SOME = 0;
    ADDITIONAL_COMMITTERS_NONE = 1;
    ADDITIONAL_COMMITTERS_ANY = 2;
  }

  uint64 entity_id = 1;
  code_scanning.turboghas.v1.EntityType entity_type = 2;
  repeated uint64 repository_ids = 3;
  Filter filter = 4;
}

message GetAdditionalCommittersPerRepositoryResponse {
  message Repository {
    uint64 id = 1;
    uint64 additional_committers = 2;
  }

  repeated Repository repositories = 1;
}
