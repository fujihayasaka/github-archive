- op: add
  path: /metadata/annotations
  value:
    moda.github.net/cluster-preferences: | 
      {
        "general-3-va3-iad":  {
          "spec": {
            "suspend": false
          }
        }
      }
# Curated is all image locations. So, dotcom + proxima supported regions.
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: CURATED_IMAGE_AZURE_REGIONS
    value: "australiaeast canadacentral canadaeast centralus eastus eastus2 francecentral germanywestcentral japaneast koreacentral northcentralus northeurope norwayeast southcentralus southeastasia southindia swedencentral switzerlandnorth uksouth westus westus2 westus3 italynorth"
# Custom is only regions for dotcom.
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: CUSTOM_IMAGE_AZURE_REGIONS
    value: "australiaeast canadacentral canadaeast centralus eastus eastus2 francecentral germanywestcentral japaneast koreacentral northcentralus northeurope norwayeast southcentralus southeastasia southindia swedencentral switzerlandnorth uksouth westus westus2 westus3 italynorth"
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: RUNNER_INSTANCE_NAMES
    value: "runnerghubeus21 runnerghubeus20 runnerghubeus1 runnerghubwus31"
- op: add
  path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
  value:
    name: TOKEN_URL
    value: "https://vstoken.actions.githubusercontent.com/"