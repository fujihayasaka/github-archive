apiVersion: v1
kind: Service
metadata:
  name: licensify
  annotations:
    # https://moda.githubapp.com/docs/features/load-balancing/#using-variables-in-domain-names
    moda.github.net/domain-name: "licensify-%environment%.service.%stamp%.github.net"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: >
      - http:
          url: http://{{.Instance.Name}}/_ping
spec:
  type: LoadBalancer
