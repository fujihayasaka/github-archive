syntax = "proto3";

package licensing.customers.v1;

import "google/protobuf/timestamp.proto";

option go_package = "customers/v1";
option ruby_package = "MonolithTwirp::Licensing::Customers::V1";

service UsersAPI {
  // GetUsers returns the users of either a single organization or all organizations under a customer.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}

// The type of entity to get organization and repo members for.
enum EntityType {
  // Invalid entity type
  ENTITY_TYPE_INVALID = 0;
  // Organization entity type
  ENTITY_TYPE_ORGANIZATION = 1;
  // Customer entity type
  ENTITY_TYPE_CUSTOMER = 2;
}

message User {
  // The database ID of the user.
  uint64 id = 1;
  // The database IDs of all organizations the user is a member of.
  repeated uint64 organization_memberships = 2;
  // The database IDs of all repositories the user is a private outside collaborator on.
  repeated uint64 collaborating_repositories = 3;
  // If the user is an EMU suspended user, the timestamp the user was suspended at.
  google.protobuf.Timestamp suspended_at = 4;
}

message GetUsersRequest {
  // The type of entity to get organization members for. If the entity_type is Organization, only organization members are returned. 
  // If the entity_type is Customer, all organization members under the customer are returned.
  EntityType entity_type = 1;
  // The database ID of the entity to get organization members for.
  uint64 entity_id = 2;
  // The page token to use for the next page of results.
  string page_token = 3;
  // The number of results to return per page.
  uint32 page_size = 4;
}

message GetUsersResponse {
  // The customer id associated with the requested entity. If the requested entity is an organization, it is the payingcustomer associated with the organization.
  uint64 customer_id = 1;
  // The users associated with the requested entity.
  repeated User users = 2;
  // The token to use for the next page of results if there are more results.
  string next_page_token = 3;
}
