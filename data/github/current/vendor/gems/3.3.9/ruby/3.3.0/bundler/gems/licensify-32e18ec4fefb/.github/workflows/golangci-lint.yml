name: go-linter
permissions:
  id-token: write
  contents: read
  checks: write
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up Go Proxy & Private Module Access
        uses: github/setup-goproxy@v1.1.0
      - name: Run Go Linter
        uses: github/go-linter@v1.3.7
