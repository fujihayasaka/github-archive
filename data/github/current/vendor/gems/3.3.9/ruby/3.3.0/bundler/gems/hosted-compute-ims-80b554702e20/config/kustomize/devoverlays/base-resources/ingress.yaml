apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ims-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: hosted-compute-ims.codedev.ms
      http:
        paths:
          - backend:
              service:
                name: hosted-compute-ims
                port:
                  number: 21010
            path: /
            pathType: Prefix