# The turboghas-monolith-twirp build is not triggered properly when using the merge queue. This job triggers it manually.

name: Build Monolith Twirp Gem
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/monolith-twirp-gem.yml

permissions: {}

jobs:
  monolith-twirp-gem:
    name: Build Monolith Twirp Gem
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger Build
        env:
          JANKY_API_TOKEN: ${{ secrets.JANKY_API_TOKEN }}
        run: |
          curl \
            --fail --silent --show-error \
            --user ":$JANKY_API_TOKEN" \
            --header "Content-Type: application/json" \
            --request POST \
            --data '{"buildable_name":"turboghas-monolith-twirp","force":"true"}' \
            "https://janky.githubapp.com/api/builds"
