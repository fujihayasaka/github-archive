- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: wait-for-oidc-shim
      image: curlimages/curl:8.9.1
      command:
      - "sh"
      - "-c"
      - "while [ $(curl -ksw '%{http_code}' 'http://ims-oidc-shim:9002/.well-known/openid-configuration' -o /dev/null) -ne 200 ]; do echo waiting for oidc-shim; sleep 1; done; echo oidc-shim is up and running"
    - name: wait-for-aqueduct
      image: curlimages/curl:8.9.1
      command:
      - "sh"
      - "-c"
      - "while [ $(curl -ksw '%{http_code}' 'ims-aqueduct:28141/admin/health' -o /dev/null) -ne 200 ]; do sleep 5; echo waiting for aqueduct; done; echo aqueduct is up and running"
    - name: wait-for-mysql
      image: mysql:8.0
      command: 
      - "sh"
      - "-c"
      - "until mysql -e 'SELECT 1' -u root --host ims-mysql --port 28142 &>/dev/null; do echo waiting for mysql; sleep 1; done; echo DB is up and running"
