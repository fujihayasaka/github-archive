syntax = "proto3";
package licensify.services.v1;

import "licensify/services/v1/common.proto";

option go_package = "lib/twirp/proto/licensify/services/v1";
option ruby_package = "Licensify::Services::V1";

service CustomerService {
  rpc UpsertCustomer(UpsertCustomerRequest) returns (UpsertCustomerResponse);
}

message UpsertCustomerRequest {
  licensify.services.v1.common.Customer customer = 1;
}

message UpsertCustomerResponse {
}