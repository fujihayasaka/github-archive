# TODO: Should the blackbird client report metrics?
[metrics.exporter]
type = "noop"

[kafka]
security_protocol = "ssl"
ca_bundle = "/etc/ssl/certs/cp1-iad-production-1487801205-root.pem"
brokers = "hydro-kafka-blackbird-boot-1.service.azure-eastus.github.net:9093,hydro-kafka-blackbird-boot-2.service.azure-eastus.github.net:9093,hydro-kafka-blackbird-boot-3.service.azure-eastus.github.net:9093"
# log_level = "debug"
group_suffix = "001"

[cluster.zeta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.zeta"

[cluster.eta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.eta"

[cluster.theta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.theta"

[cluster.iota]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.iota"

[cluster.kappa]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.kappa"

[cluster.lambda]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.lambda"

[cluster.cache-001]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.cache001"
allow_zero_offset_shards = true

[cluster.cache-001.policy]
type = "rendezvous"

[cluster.cache-002]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.cache002"
allow_zero_offset_shards = true

[cluster.cache-002.policy]
type = "rendezvous"

[cluster.cache-003]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.cache003"
allow_zero_offset_shards = true

[cluster.cache-003.policy]
type = "rendezvous"

[cluster.cache-004]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.cache004"
allow_zero_offset_shards = true

[cluster.cache-004.policy]
type = "rendezvous"
