# This docker compose file defines an overlay for running the blackbird-mw
# services in a test environment. See docker-compose.yml for the base compose
# environment and docker-compose.mw.yaml for the mw services overlay.
services:
  blackbird-mw-admin:
    environment:
      BLACKBIRD_MW_ENV: test
      GITHUB_INTERNAL_API_URL: "http://host.docker.internal:11223"
    depends_on:
      mysql:
        condition: service_healthy
      blackbird-1:
        condition: service_healthy
      blackbird-2:
        condition: service_healthy
    extra_hosts:
      # TODO: We should just run a docker compose service that is the fake github api instead of all this.
      #
      # Allow blackbird-mw-admin container to reach the host via this name for repo data via internal API
      # https://medium.com/@TimvanBaarsen/how-to-connect-to-the-docker-host-from-inside-a-docker-container-112b4c71bc66
      - "host.docker.internal:host-gateway"

  blackbird-mw-ingest:
    environment:
      BLACKBIRD_MW_ENV: test
      GITHUB_INTERNAL_API_URL: "http://host.docker.internal:11223"
    depends_on:
      kafka:
        condition: service_healthy
      bootstrap-kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    extra_hosts:
      # Allow blackbird-mw-ingest container to reach the host via this name for repo data via internal API
      # https://medium.com/@TimvanBaarsen/how-to-connect-to-the-docker-host-from-inside-a-docker-container-112b4c71bc66
      - "host.docker.internal:host-gateway"

  blackbird-mw-query:
    environment:
      BLACKBIRD_MW_ENV: test
      GITHUB_INTERNAL_API_URL: "http://host.docker.internal:11223"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      blackbird-1:
        condition: service_healthy
      blackbird-2:
        condition: service_healthy
    extra_hosts:
      # Allow blackbird-mw-query container to reach the host via this name for auth via internal API
      # https://medium.com/@TimvanBaarsen/how-to-connect-to-the-docker-host-from-inside-a-docker-container-112b4c71bc66
      - "host.docker.internal:host-gateway"

  bootstrap-skeema:
    environment:
      - env=test
