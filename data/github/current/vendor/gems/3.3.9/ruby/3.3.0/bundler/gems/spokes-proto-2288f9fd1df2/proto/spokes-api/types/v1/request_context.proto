syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// RequestContext is extra information that is used by Gitmon when figuring out
// which quotas to apply and how to enforce them.
//
// For more information see docs/gitmon.md
message RequestContext {
    // QualityOfService defines how Gitmon will apply quotas.
    enum QualityOfService {
        // QUALITY_OF_SERVICE_INVALID is the default enum value and should not
        // be used.
        QUALITY_OF_SERVICE_INVALID = 0;

        // QUALITY_OF_SERVICE_NO_DELAY forbids Gitmon from delaying or aborting
        // requests. This is only appropriate for user-facing requests where a
        // the client cannot tolerate delays (e.g. when rendering a page on
        // github.com).
        QUALITY_OF_SERVICE_NO_DELAY = 1;

        // QUALITY_OF_SERVICE_DELAYABLE is the "normal" way for Gitmon to apply
        // quotas. This means that the request may be delayed or aborted,
        // depending on the state of the quotas and the server's health.
        QUALITY_OF_SERVICE_DELAYABLE = 2;

        // QUALITY_OF_SERVICE_FAIL_FAST means that Gitmon will abort rather
        // than delay responses. This is appropriate for non-urgent work that
        // the caller is OK with retrying later.
        QUALITY_OF_SERVICE_FAIL_FAST = 3;
    }

    // quality_of_service is the requested QoS for this request.
    QualityOfService quality_of_service = 1;

    // user_id is the ID of the current actor. Some quotas are based on this.
    //
    // If the actor is not known, use the default value (0).
    uint64 user_id = 2;

    // real_ip is the IP address of the current actor. Some quotas are based on
    // this.
    //
    // If the actor's IP address is not known, use the default value (""). Do
    // not provide IPs from our internal network.
    string real_ip = 3;

    // read_uncommitted should be set when the request is trying to read Git
    // data during a 'git push' before _commit_refs has finished. When
    // read_uncommitted is set, spokesd will try the current request on all
    // replicas until it receives a success (<300). If all replicas respond
    // with an error, the last error will be returned.
    bool read_uncommitted = 4;

    // a serialized blob describing the state of a git push. It includes information like
    // the quarantine ID that identifies the path to the quarantine directory where the packs 
    // from the push are placed on a replica, the list of replicas that successfully received the 
    // incoming pack, sockstat variables for the push and may include more fields moving forward.
    // when making a Spokes Access API call during a `git push`, this field should be set to the value that Spokesd  passed to `_commit_refs`.
    bytes push_state = 5;

    // read_after_write should be set when the request is trying to read data
    // and the client expects to be able to read data that was written
    // immediately before the read call. This is analogous to "use the primary
    // mysql instance", though the implementation might not be to use the
    // primary spokesdb.
    bool read_after_write = 6;

    // reduce_cost_for_spokes_api enables the feature of the same name in
    // Gitmon.
    bool reduce_cost_for_spokes_api = 7;
}
