apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiv1
spec:
  replicas: 10
  selector:
    matchLabels:
      app: apiv1
  template:
    metadata:
      labels:
        app: apiv1
      annotations:
        observability.github.com/logger: fluent-bit
        observability.github.com/splunk_index: billing
        fluentbit.io/parser: logfmt
    spec:
      dnsPolicy: ClusterFirst
      containers:
      - name: apiv1
        image: billing-platform
        command: ["./bin/api"]
        ports:
        - name: http
          containerPort: 8989
          protocol: TCP
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        env:
        - name: script
          value: build
        - name: WORKER_TYPE
          value: "usage-ingestion"
        - name: STATS_ADDR
          value: "$(KUBE_NODE_HOSTNAME):28125"
        - name: APP_SHA
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['heaven.githubapp.com/sha']
        - name: APP_REF
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['heaven.githubapp.com/ref']
        envFrom:
          - configMapRef:
              name: environment
          - configMapRef:
              name: kube-cluster-metadata
          - secretRef:
              name: vault-secrets
        readinessProbe:
          httpGet:
            path: /_ping
            port: 8989
        resources:
          requests:
            cpu: 0.1
            memory: "512Mi"
          limits:
            # Adjust GOMAXPROCS in tandem. It's recommended the cpu limit be set to GOMAXPROCS+1.
            cpu: 2.0
            memory: "2048Mi"
