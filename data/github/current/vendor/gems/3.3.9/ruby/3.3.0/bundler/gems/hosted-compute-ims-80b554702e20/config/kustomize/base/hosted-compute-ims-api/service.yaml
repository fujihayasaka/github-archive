apiVersion: v1
kind: Service
metadata:
  name: hosted-compute-ims
  labels:
    service: hosted-compute-ims-api
  annotations:
    moda.github.net/domain-name: hosted-compute-ims-%environment%.githubapp.com
    moda.github.net/istio-ingress-enabled: "true"
    moda.github.net/load-balancer-type: public-internal-http
    moda.github.net/load-balancer-glb-scope: iad
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 21010
    protocol: TCP
    targetPort: http
  selector:
    app: hosted-compute-ims-api
  type: LoadBalancer
