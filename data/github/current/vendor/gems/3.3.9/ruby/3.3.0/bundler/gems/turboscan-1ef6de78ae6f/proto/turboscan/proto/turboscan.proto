syntax = "proto3";

package github.turboscan;

option go_package = "./;proto";
option ruby_package = "Turboscan::Proto";

// This represents a combined rule and security severity
enum Severity {
  NO_SEVERITY = 0;
  // Rule severities
  SEVERITY_NOTE = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
  // Security severity
  SEVERITY_LOW = 4;
  SEVERITY_MEDIUM = 5;
  SEVERITY_HIGH = 6;
  SEVERITY_CRITICAL = 7;
}

enum RuleSeverity {
  NONE = 0;
  NOTE = 1;
  WARNING = 2;
  ERROR = 3;
}

enum SecuritySeverity {
  NO_SECURITY_SEVERITY = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

enum ResultResolution {
  NO_RESOLUTION = 0;
  FALSE_POSITIVE = 1;
  WONT_FIX = 2;
  USED_IN_TESTS = 3;
}

enum ResultResolutionFilter {
  FILTER_NONE = 0;
  FILTER_NO_RESOLUTION = 1;
  FILTER_FALSE_POSITIVE = 2;
  FILTER_WONT_FIX = 3;
  FILTER_USED_IN_TESTS = 4;
}

enum AlertStateFilter {
  ALERT_STATE_FILTER_NONE = 0;
  ALERT_STATE_FILTER_ALL = 1;
  ALERT_STATE_FILTER_OPEN = 2;
  ALERT_STATE_FILTER_CLOSED = 3;
  ALERT_STATE_FILTER_CLOSED_RESOLVED = 4;
  ALERT_STATE_FILTER_CLOSED_FIXED = 5;
}

enum RepositoryVisibility {
  REPOSITORY_VISIBILITY_UNKNOWN = 0;
  REPOSITORY_VISIBILITY_PUBLIC = 1;
  REPOSITORY_VISIBILITY_PRIVATE = 2;
  REPOSITORY_VISIBILITY_INTERNAL = 3;
}

enum AlertClassificationFilter {
  ALERT_CLASSIFICATION_FILTER_NO_FILTER = 0;
  ALERT_CLASSIFICATION_FILTER_UNCLASSIFIED = 1;
  ALERT_CLASSIFICATION_FILTER_ANY_CLASSIFICATION = 2;
}

enum AlertLinksFilter {
  ALERT_LINKS_FILTER_NO_FILTER = 0;
  ALERT_LINKS_FILTER_NO_LINKS = 1;
  ALERT_LINKS_FILTER_ANY_LINKS = 2;
}

enum AutofixFilter {
  AUTOFIX_FILTER_NO_FILTER = 0;
  AUTOFIX_FILTER_SUPPORTED = 1;
  AUTOFIX_FILTER_GENERATED = 2;
}

message RepoNumber {
  uint64 repository_id = 1;
  uint32 number = 2;
}

message AlertsFilter {
  reserved 2, 3, 4, 5, 10;
  AlertStateFilter state = 1;
  string search_query = 6;
  repeated string excluded_rule_sarif_identifiers = 7;
  repeated string excluded_tools = 8;
  repeated Severity excluded_severities = 9;
  repeated ResultResolutionFilter excluded_resolutions = 11;
  repeated Severity severities = 12;
  repeated string tools = 13;
  repeated string tool_guids = 14;
  repeated string rule_sarif_identifiers = 15;
  repeated string rule_tags = 22;
  repeated string excluded_rule_tags = 23;
  repeated RepositoryVisibility repository_visibilities = 16;
  repeated ResultResolutionFilter resolutions = 17;
  AlertClassificationFilter classification = 18;
  AlertLinksFilter alert_links = 19;
  AutofixFilter autofix = 20;
  repeated RepoNumber repo_numbers = 21;
  repeated AutofixFilter autofixes = 24;
  repeated AutofixFilter excluded_autofixes = 25;
  repeated uint64 security_campaign_ids = 26;
}
