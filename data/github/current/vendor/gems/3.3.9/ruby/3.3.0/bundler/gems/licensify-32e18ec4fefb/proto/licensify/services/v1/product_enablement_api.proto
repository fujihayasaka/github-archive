syntax = "proto3";
package licensify.services.v1;

import "licensify/services/v1/common.proto";

option go_package = "lib/twirp/proto/licensify/services/v1";
option ruby_package = "Licensify::Services::V1";

service ProductEnablementService {
  rpc GetProductEnablements(GetProductEnablementsRequest) returns (GetProductEnablementsResponse);
  rpc UpsertProductEnablement(UpsertProductEnablementRequest) returns (UpsertProductEnablementResponse);
}

message GetProductEnablementsRequest{
  uint64 customerId = 1;
}

message GetProductEnablementsResponse{
  repeated licensify.services.v1.common.ProductEnablement productEnablements = 1;
}

message UpsertProductEnablementRequest{
  licensify.services.v1.common.ProductEnablement productEnablement = 1;
}

message UpsertProductEnablementResponse{
}