version: "3"
services:
  oktaproxy:
    container_name: oktaproxy
    image: base-dev-runtime
    ports:
      - 8899:8899
      - 4040:4040
    volumes:
      - ./bin:/app/bin
      - /usr/local/share/ca-certificates/emulatorcert.crt:/usr/local/share/ca-certificates/emulatorcert.crt
    command: >
      bash -c "update-ca-certificates &&
            ./script/dlvexec 4040 /app/bin/oktaproxy"
    env_file:
      - dev.vscode.env
    extra_hosts:
      - "localhost:host-gateway"
    security_opt:
      - seccomp:unconfined  # Disable seccomp filtering for delve

  admin:
    container_name: admin
    image: base-dev-runtime
    ports:
