syntax = "proto3";

package licensing.repositories.v1;

option go_package = "repositories/v1";
option ruby_package = "MonolithTwirp::Licensing::Repositories::V1";

service RepositoriesAPI {
  // GetRepositoryInformation returns a repository with additional details if requested.
  rpc GetRepositoryInformation(GetRepositoryInformationRequest) returns (GetRepositoryInformationResponse);
}

message Repository {
  // The database ID of the repository.
  uint64 id = 1;
  // The repository visibility.
  enum Visibility {
    VISIBILITY_INVALID = 0;
    VISIBILITY_PUBLIC = 1;
    VISIBILITY_PRIVATE = 2;
    VISIBILITY_INTERNAL = 3;
  }
  // The visibility of the repository.
  Visibility visibility = 2;
  // The parent repository id if this is a fork
  uint32 parent_id = 3;
  // The customer ID of the repository owner.
  int64 owner_customer_id = 4;
  // Whether or not the repo is a fork
  bool is_fork = 5;
  // Whether or not the repo is an advisory workspace
  bool is_advisory_workspace = 6;
  // Whether or not the repo is active
  bool is_active = 7;
}

message GetRepositoryInformationRequest {
  // The database ID of the repository to get outside collaborators for.
  uint64 id = 1;
  // Whether or not to include outside collaborators in the response.
  bool include_collaborators = 2;
}

message GetRepositoryInformationResponse {
  // The repository
  Repository repository = 1;
  // The collaborator IDs that belong to the repository.
  repeated uint64 collaborator_ids = 2;
}
