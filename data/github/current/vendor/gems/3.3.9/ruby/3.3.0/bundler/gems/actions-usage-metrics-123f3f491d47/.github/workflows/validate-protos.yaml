name: Validate Protos

on:
  pull_request:
    branches: [main]
    reuse-previous-outcome: true
  merge_group:
    reuse-previous-outcome: true

permissions:
  id-token: write # for setup-goproxy OIDC
  contents: read

jobs:
  validate-protos:
    runs-on: ubuntu-20.04-xl
    steps:
      - uses: actions/checkout@v4

      - name: Fetch origin/main (for breaking change detection)
        run: git fetch origin main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: Bootstrap
        run: ./script/bootstrap --no-auth
        env:
          CONTAINER_BUILDER_TOKEN: ${{ secrets.CONTAINER_BUILDER_TOKEN }}

      - name: Check for breaking changes
        uses: bufbuild/buf-breaking-action@c57b3d842a5c3f3b454756ef65305a50a587c5ba #v1.1.4
        with:
          input: ./proto
          against: "https://github.com/github/actions-usage-metrics.git#branch=main"
        continue-on-error: true # Rely on running script/protoc to fail, this is really just to add PR annotations

      - name: Lint
        uses: bufbuild/buf-lint-action@06f9dd823d873146471cfaaf108a993fe00e5325 #v1.1.1
        with:
          input: ./proto
        continue-on-error: true # Rely on running script/protoc to fail, this is really just to add PR annotations

      - name: Generate
        run: ./script/protoc

      - name: Check for uncommitted changes
        run: |
          changed_files_count=$(git status --porcelain | wc -l)
          if [ $changed_files_count -ne 0 ]; then
            echo 'uncommitted changes after generating protos:'
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo 'Found uncommitted changes. Did you forget to generate protos or check generated files in?'
            exit 1
          fi
