name: Staging npm Prober

on:
  workflow_dispatch:
  schedule:
    # run every 5 minutes, as often as Github Actions allows
    - cron:  '*/5 * * * *'

permissions:
  contents: read
  id-token: write

jobs:
  prober:
    uses: ./.github/workflows/npm-prober.yml
    with:
      environment: "staging"
      report-prober-status: true
      tma-host: trust-metadata-api-staging.githubapp.com
      hmac-reader-client-id: npm/read
      hmac-writer-client-id: uploading-worker
    secrets:
      hmac-reader-key: "${{ secrets.NPM_READER_STAGING_HMAC_KEY }}"
      hmac-writer-key: "${{ secrets.NPM_WRITER_STAGING_HMAC_KEY }}"
      npm-publish-signing-key: "${{ secrets.NPM_PUBLISH_SIGNING_KEY }}"
      datadog-api-key: "${{ secrets.DATADOG_API_KEY }}"
