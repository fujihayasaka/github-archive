apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespaces/namespace.yaml
  - ../../base/default

patchesStrategicMerge:
  - configmaps/environment.yaml
  - configmaps/kafka.yaml
  - deployments/api.yaml
  - deployments/hydro-processor.yaml
  - deployments/queue-worker.yaml
  - deployments/scheduler.yaml
  - deployments/low-priority-queue-worker.yaml
  - services/licensify.yaml
  - jobs/transition-template-job.yaml
