apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: actions-usage-metrics-dev

resources:
  - namespace.yaml
  - ../../base
  - jaeger.yaml

patchesStrategicMerge:
  - deployments/api-server.yaml
  - services/api-server.yaml

configMapGenerator:
  - name: config
    behavior: merge
    envs:
      - config.env
