syntax = "proto3";

package dependabot.settings.v1;

option go_package = "settings/v1";
option ruby_package = "MonolithTwirp::Dependabot::Settings::V1";

service AutofixAPI {
  rpc CreateSuggestedFixAnnotation(CreateSuggestedFixAnnotationRequest)
    returns (CreateSuggestedFixAnnotationResponse);
}

message CreateSuggestedFixAnnotationRequest {
  int64 repository_id = 1;
  /* NOTE: unused as of October 8, 2024
  int64 pull_request_id = 2;
  */
  int64 autofix_job_id = 3;
  int64 check_run_id = 4;
  AnnotationLocation annotation_location = 5;
  string level = 6;
  string message = 7;
  int64 pull_request_number = 8;
}

message AnnotationLocation {
  string file_path = 1;
  uint32 start_line = 2;
  uint32 end_line = 3;
  uint32 start_column = 4;
  uint32 end_column = 5;
}

message CreateSuggestedFixAnnotationResponse {
  int64 id = 1;
  bool success = 2;
}
