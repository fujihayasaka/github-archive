version: 2
registries:
  nuget-azp-acme:
    type: nuget-feed
    url: 'https://aws.example.com/nuget/v3/index.json'
    aws-region: test-region
    account-id: '123456789'
    role-name: test-role
    domain: test-domain
    domain-owner: '987654321'
    replaces-base: true
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    registries:
      - nuget-azp-acme
    schedule:
      interval: "daily"
