apiVersion: v1
kind: Service
metadata:
    annotations:
        moda.github.net/allowed-ips: 0.0.0.0/0
        moda.github.net/dns-registration-enabled: "false"
        moda.github.net/domain-name: dependabot-badges.githubapp.com
        moda.github.net/istio-ingress-enabled: "true"
        moda.github.net/load-balancer-glb-scope: iad
        moda.github.net/load-balancer-type: public-external-http
        opaque.github.net/checks: |
            - check_interval: 1m
              http:
                url: https://{{.Instance.Name}}/_ping
    labels:
        role: api
        service: dependabot-badges
    name: dependabot-badges
spec:
    ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: http
    selector:
        app: dependabot-badges
        role: api
    type: LoadBalancer
