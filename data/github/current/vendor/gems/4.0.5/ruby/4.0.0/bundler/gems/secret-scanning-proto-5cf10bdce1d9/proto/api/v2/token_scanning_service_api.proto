message CampaignAssignmentsRequest {
  uint64 campaign_id = 1;
  repeated TokenNumber assignments = 2;
  uint64 updated_by_id = 3;
}

message CampaignAssignmentsResponse {}

message GetTokenMetadataRequest {
  uint64 repository_id = 1;
  uint64 token_number = 2;
  uint64 requested_by_user_id = 3;
}

message RefreshTokenMetadataRequest {
  uint64 repository_id = 1;
  uint64 token_number = 2;
  uint64 requested_by_user_id = 3;
}

message RefreshTokenMetadataResponse {
  // encrypted_metadata bytes, when decrypted, can be marshaled to
  // TokenMetadataParts (see above), which holds multiple TokenMetadataPart
  bytes encrypted_metadata = 3;
}

message TokenMetadataPart {
  string key = 1;
  string value = 2;
}

message TokenMetadataParts {
  repeated TokenMetadataPart metadata = 1;
  string owner_email = 2;
  string secret_id = 3;
  string secret_name = 4;
  string owner_id = 5;
  string owner_name = 6;
  string org_name = 7;
  string org_id = 8;
  string secret_issued_at = 9;
  string secret_expires_at = 10;
  string secret_last_used_at = 11;
  string org_access = 12;
}

message GetTokenMetadataResponse {
  message TokenMetadata {
    string key = 1;
    string value = 2;
  }
  repeated TokenMetadata metadata = 1;
  string raw = 2 [deprecated = true];
}

message CampaignDeletionRequest {
  uint64 campaign_id = 1;
  uint64 updated_by_id = 2;
  oneof campaign_owner {
    uint64 organization_id = 3;
    uint64 business_id = 4;
  }
}

message CampaignDeletionResponse {}

// buf:lint:ignore ENUM_ZERO_VALUE_SUFFIX Legacy zero value is already in use.
enum PushProtectionBypassState {
  // PUSH_PROTECTION_BYPASS_STATE_ALL includes all alerts regardless of bypass state.
  PUSH_PROTECTION_BYPASS_STATE_ALL = 0;
  PUSH_PROTECTION_BYPASS_STATE_BYPASSED = 1;
  PUSH_PROTECTION_BYPASS_STATE_NOT_BYPASSED = 2;
}

message IsTokenTypeRevocableRequest {
  // The canonical token type slug (e.g. "github_personal_access_token")
  // matching the slug_value used in TokenType.
  string token_type = 1;
  // Optional. The ID of the repository where the token was found, used for
  // actor-scoped feature flag evaluation (e.g. gradual rollouts). When 0 or
  // unset, feature flags fall back to global evaluation with no actor context.
  uint64 repository_id = 2;
  // Optional. The ID of the organization that owns the repository. Used for
  // actor-scoped feature flag evaluation. When 0 or unset, no organization
  // actor is included in the evaluation.
  uint64 organization_id = 3;
  // Optional. The ID of the business (GitHub Enterprise) that owns the
  // organization. Used for actor-scoped feature flag evaluation. When 0 or
  // unset, no business actor is included in the evaluation.
  uint64 business_id = 4;
}

message IsTokenTypeRevocableResponse {
  bool revocable = 1;
}

// AlertScanType is the customer-facing classification of how an alert was
// discovered. It abstracts over the internal scan_scope/scan_type details.
enum AlertScanType {
  ALERT_SCAN_TYPE_INVALID = 0;
  // The alert was found during an incremental (push) scan.
  ALERT_SCAN_TYPE_INCREMENTAL = 1;
  // The alert was found during a historical (backfill) scan.
  ALERT_SCAN_TYPE_HISTORICAL = 2;
}
