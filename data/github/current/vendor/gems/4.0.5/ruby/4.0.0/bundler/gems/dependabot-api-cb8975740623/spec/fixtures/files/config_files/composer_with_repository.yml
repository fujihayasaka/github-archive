version: 2
registries:
  composer-acme:
    type: composer-repository
    url: repo.packagist.com/acme-company
    username: acme
    password: ${{secrets.MY_PACKAGIST_PASSWORD}}
updates:
  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - composer-acme
    schedule:
      interval: "daily"
