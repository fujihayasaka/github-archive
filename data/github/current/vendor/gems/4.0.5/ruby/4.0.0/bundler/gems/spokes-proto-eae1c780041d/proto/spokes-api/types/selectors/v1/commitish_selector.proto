syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/commitish.proto";

// CommitishSelector is a selector for selecting objects based on commitish.
message CommitishSelector {
    // commitish is the commitish to select for.
    github.spokes.types.v1.Commitish commitish = 1;
}
