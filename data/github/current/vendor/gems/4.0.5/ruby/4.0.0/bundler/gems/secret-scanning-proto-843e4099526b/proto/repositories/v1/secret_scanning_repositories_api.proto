syntax = "proto3";

package github.secretscanning.repositories.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/repositories";
option ruby_package = "GitHub::Proto::SecretScanning::Repositories::V1";

import "repositories/v1/repository.proto";

// RepositoryAPI defines the service to retrieve and handle repositories for
// the Secret Scanning Service.
service RepositoryAPI {
  // GetRepository retrieves a specific repository mapped the given identifier
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);

  // ListRepositories retrieves a list of repositories for a given selection.
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
}

message GetRepositoryRequest {
  // a selection of how we are looking up the repository. 
  oneof repository {
    // repo_id is the ID of the repository to look up.
    int64 repo_id = 1;
    // the name-with-owner (e.g., github/secret-scanning) to lookup 
    string nwo = 2;
  }
}

message GetRepositoryResponse {
  // repository for the given identifier
  Repository repositories = 1;
}

message ListRepositoriesIdsSelector {
  repeated uint64 ids = 1;
}

message ListRepositoriesOrgSelector {
  uint64 org_id = 1;
}

message ListRepositoriesUserSelector {
  uint64 user_id = 1;
}

message ListRepositoriesRequest {
  // a selection for how we are looking up the organization (deprecated) 
   oneof organization {
    // org_id is the ID of the organization to look up for repositories. (required) */
    int64 org_id = 1 [deprecated = true];
   }
  // cursor represents an opaque object to be used to identify where to continue on a stream of repositories.  
  bytes cursor = 2;

  // a selection for how we are looking up.
  oneof selector {
    ListRepositoriesIdsSelector ids_selector = 3;
    ListRepositoriesOrgSelector org_selector = 4;
    ListRepositoriesUserSelector user_selector = 5; 
  }
}

message ListRepositoriesResponse {
  // repositories are the repositories for the given organization
  repeated Repository repositories = 1;

 // next_cursor represents an opaque object to be used to identify where to continue on a stream of repositories. 
  bytes next_cursor = 2;
}
