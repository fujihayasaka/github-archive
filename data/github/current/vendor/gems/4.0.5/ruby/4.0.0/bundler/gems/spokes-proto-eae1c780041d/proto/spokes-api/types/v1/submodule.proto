syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/path.proto";
import "spokes-api/types/v1/object_id.proto";

message Submodule {
  // path is the path to the submodule.
  github.spokes.types.v1.Path path = 1;

  // oid is the object ID of the submodule.
  github.spokes.types.v1.ObjectID oid = 2;

  // name is the name of the submodule.
  string name = 3;

  // url is the URL of the submodule.
  string url = 4;
}
