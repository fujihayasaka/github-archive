plugins:
  - rubocop-rspec
  - rubocop-factory_bot
  - rubocop-rspec_rails
  - rubocop-performance
  - rubocop-rails

require:
  - ./lib/rubocop/cop/rails/no_bulk_change_table.rb
  - ./lib/rubocop/cop/dependabot/no_local_feature_flags.rb
  - ./lib/rubocop/cop/dependabot/no_dependabot_logger_instance.rb

AllCops:
  NewCops: enable
  DisplayCopNames: true
  Exclude:
    - vendor/**/*
    - lib/hydro/schemas/**/*
    - tmp/**/*
    - Brewfile
    - gen/**/*
    - 'db/migrate/2019*.rb'
    - 'db/migrate/2020*.rb'
    - 'db/migrate/2021*.rb'
    - 'db/migrate/2022*.rb'

FactoryBot/CreateList:
  Enabled: false
FactoryBot/AssociationStyle:
  Enabled: true
FactoryBot/ConsistentParenthesesStyle:
  Enabled: true
FactoryBot/ExcessiveCreateList:
  Enabled: true
FactoryBot/FactoryAssociationWithStrategy:
  Enabled: true
FactoryBot/FactoryNameStyle:
  Enabled: true
FactoryBot/IdSequence:
  Enabled: true
FactoryBot/RedundantFactoryOption:
  Enabled: true
FactoryBot/SyntaxMethods:
  Enabled: true

Gemspec/AddRuntimeDependency:
  Enabled: true
Gemspec/DeprecatedAttributeAssignment:
  Enabled: true
Gemspec/DevelopmentDependencies:
  Enabled: true
Gemspec/RequireMFA:
  Enabled: true

Metrics/MethodLength:
  Max: 20

Metrics/BlockLength:
  Exclude:
    - spec/**/*
    - config/routes.rb
    - config/scheduled_jobs.rb
    - lib/tasks/**/*

Metrics/AbcSize:
  Max: 30

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/ParameterLists:
  CountKeywordArgs: false

Style/AccessorGrouping:
