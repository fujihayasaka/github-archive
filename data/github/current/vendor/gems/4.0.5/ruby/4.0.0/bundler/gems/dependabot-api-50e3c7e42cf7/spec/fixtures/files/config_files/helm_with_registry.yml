version: 2
enable-beta-ecosystems: true
registries:
  docker-acme:
    type: helm-registry
    url: ghcr.io
    username: acme
    password: ${{secrets.MY_GITHUB_PERSONAL_TOKEN}}
    replaces-base: true
updates:
- package-ecosystem: "helm"
  directory: "/"
  registries:
    - docker-acme
  schedule:
    interval: "daily"
