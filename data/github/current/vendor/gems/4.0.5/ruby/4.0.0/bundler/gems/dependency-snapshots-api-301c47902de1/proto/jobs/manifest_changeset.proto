syntax = "proto3";

package dependency_snapshots_api.jobs;
option go_package = "./job";

message ManifestChangesetJob {
  // repository that received this push
  uint64 repository_id = 1;

  // if the ref below maps to the default branch
  // of the repo, this will be "true". Initially,
  // DGP will only process these
  bool is_default_branch = 2;

  // the fully-qualified Git ref that was pushed
  string ref = 3;

  // the commit OID (SHA) of the ref prior to this push
  string before_oid = 4;

  // the commit OID (SHA) of the ref after this push - the new current HEAD
  string after_oid = 5;

  // The GitHub request ID associated with the originating push. as
  // carried to us by the source PostReceive event, captured if present.
  string request_id = 6;

  // ID of the source PostReceive event that represents the originating push
  string event_id = 7;

  // as recorded in the source PostReceive event. just for logging as
  // a debug convenience; could be stale vs. the dgp_repos table.
  // Tracks the enum values laid out here:
  // https://github.com/github/dependency-graph-platform/blob/main/proto/hydro/schemas/github/v1/entities/repository.pb.go#L28-L33
  uint32 repository_visibility = 8;

  // Global ID of repository that received this push
  string repository_global_id = 9;

  // Global ID of actor that originated the push
  string actor_global_id = 10;

  // Login of actor that originated the push
  string actor_login = 11;
}
