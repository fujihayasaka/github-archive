openapi: 3.0.3
info:
  title: Copilot Error Progress Schema
  version: 0.0.0
  description: |
    Schema definition for error progress updates in the copilot namespace.

    This schema defines the payload structure for progress updates with:
    - namespace: "copilot"
    - kind: "error"
    - version: 0

    These errors are designed to be simple and sufficient for rendering in chat-like
    UIs and other GitHub interfaces. The schema includes properties common to error
    types across the industry, enabling consistent error presentation.

paths: {}

components:
  schemas:
    CopilotError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: |
            A human-readable error message suitable for display to end users.
            This should clearly describe what went wrong.
          example: "Failed to parse configuration file"

        code:
          type: string
          description: |
            An optional machine-readable error code that categorizes the error type.
            This can be used by clients to handle specific error conditions programmatically.
            Common codes include: rate_limited, quota_exceeded, invalid_request, timeout, etc.
          example: "parse_error"

        severity:
          type: string
          enum:
            - warning
            - error
            - critical
          description: |
            The severity level of the error. This can be used by UIs to determine
            how prominently to display the error and what styling to apply.
            - warning: Issues that don't prevent operation but should be noted
            - error: Errors that prevented an operation from completing
            - critical: Severe errors requiring immediate attention
          default: error
          example: "error"

        details:
          type: string
          description: |
            Optional additional details about the error, such as technical information,
            stack traces, or debugging context. This field should not be shown to end users
            by default but may be useful for debugging or support.
          example: "Error at line 42: unexpected token '}'"

        request_id:
          type: string
          description: |
            Optional request identifier that can be used to correlate this error with
            server logs or support requests. This helps with debugging and troubleshooting.
          example: "00000-077118d3-e114-46d8-8c52-8ddf19ed130c"

        timestamp:
          type: integer
          format: int64
          description: |
            Optional Unix timestamp (in seconds) when the error occurred. If not provided,
            the parent progress entry's created_at timestamp should be used.
          example: 1701453600

      description: |
        Error payload for the copilot namespace. This represents a generic error that can be
        rendered in chat interfaces and other UIs. The schema is intentionally simple to start,
        with just enough information to communicate errors effectively to users.

        The required `message` field ensures every error can be displayed meaningfully. Optional
        fields like `code`, `severity`, and `details` allow for richer error handling and presentation
        while keeping the basic use case straightforward.
