# Note, this assumes a secret called INFIN8X_PAT exists in the repo and is a PAT with the repo and write:org scopes.

name: Add new issues to board's Triage column

on: [issues]

jobs:
  automate-project-columns:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      repository-projects: write
    steps:
      - name: Move new issues into Triage
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: alex-page/github-project-automation-plus@303f24a24c67ce7adf565a07e96720faf126fe36 # v0.9.0
        with:
          project: Security Workflows
          column: Triage 📥
          repo-token: ${{ secrets.INFIN8X_PAT }}
