required_builds:
  - build
  - osslicensecompliance-moda-config-bundle / osslicensecompliance-moda-config-bundle
  - osslicensecompliance-docker-image / osslicensecompliance-docker-image
  - osslicensecompliance-docker-security / osslicensecompliance-docker-security

auto_start_pipeline: production_rollout

notifications:
  slack_channels:
    - "#dg-ops"

environments:
  - name: production
    require_pipeline: true
    cluster_selector:
      profile: general
      region: iad
    service_mesh:
      enabled: true

pipelines:
  production_rollout:
    timeout: 3600
    stages:
      - name: production
        kind: deployment
        start_message: We are now going to deploy {{app}}/{{ref}}! Please pause or cancel the pipeline after the deploy if you want more time before your pull request(s) auto merges.
        config:
          environment: production
          timeout: 900
        gates:
          - kind: blocked
            reason: "Please check the [License Compliance Health](https://app.datadoghq.com/dashboard/qin-dxy-uxq/license-compliance-health) dashboard before continuing."

ok_for_moda_to_remove_from_deprecating_clusters: true
