version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval:
      interval: "daily"
      time: "20:00"
      day: "tuesday"
      timezone: "Zulu"
    target-branch: "rollout"
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "drwho"
      - "bot/sec"
    labels:
      - "security"
      - "deps"
    assignees:
      - "drwho"
    milestone: 12
    allow:
      - dependency-type: "all"
      - dependency-name: "rails"
    ignore:
      - dependency-name: "rails"
        versions: "> 6.0"
      - dependency-name: "rspec"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    pull-request-branch-name:
      separator: "-"
