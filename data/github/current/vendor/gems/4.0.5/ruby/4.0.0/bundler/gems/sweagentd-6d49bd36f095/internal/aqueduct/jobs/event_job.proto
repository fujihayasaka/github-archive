// Update generated code with script/protoc

syntax = "proto3";

import "google/protobuf/timestamp.proto";

package github.sweagentd.aqueduct.jobs;

option go_package = "./;jobs";

message EventJob {

  // The id of the original enveloped hydro message. This can be used to track
  // the message as it moves through pipelines.
  string id = 1;

  // The topic of the original hydro event. Used to determine the type of event
  // payload represented in the message.
  string topic = 2;

  // The enveloped hydro message payload. This is the raw message that was
  // received from hydro.
  bytes message = 3;

  // The timestamp of the original hydro event.
  google.protobuf.Timestamp timestamp = 4;

  // The owner ID of the repository.
  int64 owner_id = 5;

  // The repository ID.
  int64 repository_id = 6;

  // The ID of the user that triggered the event. This should be used to check
  // permissions or feature flags.
  int64 actor_id = 7;

  // The GitHub request ID flows continuously despite events being enqueued and dequeued.
  string github_request_id = 8;

  // The number of times this job has been requeued.
  // This value should NOT be set when creating/queueing/requeueing a job. It is
  // set by the aqueduct package handlers when the job is requeued.
  int32 requeue_count = 9;

  // The agent ID is the ID of the agent that will process this job.
  int64 agent_id = 10;

  // The trigger that caused this event job to be created (e.g.
  // "workflow_run_failed", "issue_created"). When set, the job is routed to
  // the trigger queue for processing by the worker.
  string trigger = 11;
}