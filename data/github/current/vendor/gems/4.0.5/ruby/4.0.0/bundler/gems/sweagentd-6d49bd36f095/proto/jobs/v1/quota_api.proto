syntax = "proto3";

package sweagentd.jobs.v1;

option go_package = "jobs/v1";
option ruby_package = "Sweagentd::JobsAPI::V1";

// QuotaAPI service is used for internal quota snapshot lookups.
service QuotaAPI {
    // GetQuotaSnapshot returns quota snapshot fields for a user.
    rpc GetQuotaSnapshot(GetQuotaSnapshotRequest) returns (GetQuotaSnapshotResponse);
}

message GetQuotaSnapshotRequest {
    int64 user_id = 1;
}

message GetQuotaSnapshotResponse {
    int32 remaining = 1;
    double percentage_remaining = 2;
    bool can_start_session = 3;
    bool unlimited = 4;
    string copilot_plan = 5;
}
