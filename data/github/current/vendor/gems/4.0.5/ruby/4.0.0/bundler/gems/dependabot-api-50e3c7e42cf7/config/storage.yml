local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# GHES stores files with an S3-like interface
amazon:
  service: S3
  bucket: "<%= Prius.get(:dependency_files_s3_bucket) %>"

azure:
  service: AzureStorage
  storage_account_name: "<%= Prius.get(:azure_storage_account) %>"
  storage_access_key: "<%= Prius.get(:azure_storage_access_key) %>"
  container: "<%= Prius.get(:azure_storage_container) %>"
  upload_properties:
    # The default size threshold in the AzureStorage adapter which determines whether
    # writing a blob to ABS occurs in one vs multiple http requests is 128MB.
    # With that value dependabot-api was receiving timeouts.
    # Choosing a lower value of 16 MB (16 * 1024 * 1024) to alleviate the timeouts.
    single_block_upload_threshold: 16777216


amazon_migration_to_azure:
  service: Mirror
  primary: azure
  mirrors:
    - amazon
