syntax = "proto3";

package github.secretscanning.users.v1;

import "api/v2/token_scanning_service_api.proto";
import "publicmonitoring/v1/public_monitoring_api.proto";

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/users";
option ruby_package = "GitHub::Proto::SecretScanning::Users::V1";

// UsersAPI manages user information.
service UsersAPI {
  // FindUsers retrieves a list of users by selector (ids, or logins)
  rpc FindUsers(FindUsersRequest) returns (FindUsersResponse);

  // GetSecretAuthor resolves the GitHub user ID for the author of a secret.
  // For commits, it looks up the user by commit SHA email attribution
  // For other content types (issues, PRs, discussions), it looks up the content author.
  // Returns user_id = 0 if the author cannot be resolved.
  rpc GetSecretAuthor(GetSecretAuthorRequest) returns (GetSecretAuthorResponse);

  // GetEnterprisesForUser returns the list of enterprise IDs that a user is a member of.
  // Used for Public Monitoring Alerts to determine which enterprises should receive alerts.
  // Returns an empty list if the user is not found or has no enterprises.
  rpc GetEnterprisesForUser(GetEnterprisesForUserRequest) returns (GetEnterprisesForUserResponse);
}

// Type of user record.
enum UserType {
  // USER_TYPE_INVALID should never be set, but a zero value is required for enums.
  USER_TYPE_INVALID = 0;
  // USER_TYPE_USER denotes a normal user account.
  USER_TYPE_USER = 1;
  // USER_TYPE_ORGANIZATION denotes an organization, a special type of user account
  // that can be administered by any number of admins but that can't log-in.
  USER_TYPE_ORGANIZATION = 2;
  // USER_TYPE_BOT denotes a bot, a special type of user used in conjunction with
  // an integration; it performs actions on behalf of the integration and
  // exists solely as a means for attributing these actions to the integration.
  USER_TYPE_BOT = 3;
}

// UserListItem models user information returned in a list of users.
message UserListItem {
  // id is the database ID of the record. (required)
  int64 id = 1;
  // login is the username of the user. (required)
  string login = 2;
  // name is the name of the user.
  string name = 3;
  // type provides a mechanism to indicate the specific type of user account. (required)
  UserType type = 4;
  // email is the primary email address of the user.
  string email = 5;
}

message IdsSelector {
  repeated uint64 ids = 1;
}

message LoginsSelector {
  repeated string logins = 1;
}

// Requests with BusinessSelector will only return results if the business fully managed
// the users
message BusinessSelector {
  uint64 id = 1;
}

message FindUsersRequest {
  // ids is the list of IDs used to retrieve users. Can pass at most 100 IDs. (required)
  repeated int64 ids = 1 [deprecated = true];

  // selector for how we want to retrieve users. Can pass at most a 100 items.
  oneof selector {
    IdsSelector ids_selector = 2;
    LoginsSelector logins_selector = 3;
    BusinessSelector business_selector = 4;
  }

  // cursor represents an opaque object to be used to identify where to continue on a stream of users
  // Only used by the BusinessSelector at the moment
  bytes cursor = 5;
}

message FindUsersResponse {
  // users are the list of users found for the provided selections. (required)
  repeated UserListItem users = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of organizations.
  bytes next_cursor = 2;
}

message GetSecretAuthorRequest {
  // The repository where the secret was detected
  uint64 repository_id = 1;

  oneof content_source {
    // Use for secrets detected in commits (repository blobs, commit metadata)
    CommitSource commit = 2;
    // Use for secrets detected in issues, PRs, discussions, and their comments
    ContentSource content = 3;
  }
}

message CommitSource {
  // The SHA of the commit where the secret was detected
  string commit_sha = 1;
  // When true, the commit lives in the repository's wiki rather than the main repo.
  // Used for public monitoring author attribution of secrets detected in wiki pages.
  bool is_wiki = 2;
}

message ContentSource {
  // The type of content where the secret was detected
  github.secretscanning.v2.ContentType content_type = 1;
  // The unique ID of the content (e.g., comment ID, discussion ID)
  uint64 content_id = 2;
}

message GetSecretAuthorResponse {
  // The GitHub user ID of the secret author. Returns 0 if unresolved.
  uint64 user_id = 1;
  // The email address of the secret author. Empty if unresolved.
  string user_email = 2;
}

message GetEnterprisesForUserRequest {
  // user_id is the GitHub user ID to look up. (required)
  uint64 user_id = 1;
}

message GetEnterprisesForUserResponse {
  // Deprecated: Use enterprises instead.
  // enterprise_ids is the list of enterprise IDs that the user is a member of.
  // Empty if the user is not found or has no enterprises.
  repeated uint64 enterprise_ids = 1 [deprecated = true];

  // enterprises replaces enterprise_ids and represents the same set of enterprises,
  // with each enterprise ID paired with its attribution method.
  // During migration, producers should populate both enterprise_ids and enterprises
  // for backward compatibility. Empty if the user is not found or has no enterprises.
  repeated EnterpriseAttribution enterprises = 2;
}

// EnterpriseAttribution pairs an enterprise ID with the method by which
// the enterprise was linked to the user.
message EnterpriseAttribution {
  // The enterprise (business) ID.
  uint64 enterprise_id = 1;
  // How the enterprise was attributed to the user.
  github.secretscanning.publicmonitoring.v1.AttributionMethod attribution_method = 2;
}
