syntax = "proto3";

package github.secretscanning.v1;

import "types/v1/job_groups.proto";

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

service JobGroupsAPI {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME Legacy request type name is already in use.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME Legacy response type name is already in use.
  rpc GetJobGroupSummary(JobGroupSummaryRequest) returns (JobGroupSummaryResponse);
}

message JobGroupSummaryRequest {
  uint64 job_group_id = 1;
}

message JobGroupSummaryResponse {
  github.secretscanning.types.v1.JobGroup job_group = 1;
  uint64 total_token_count = 2;
  uint64 repos_scanned_count = 3;
}
