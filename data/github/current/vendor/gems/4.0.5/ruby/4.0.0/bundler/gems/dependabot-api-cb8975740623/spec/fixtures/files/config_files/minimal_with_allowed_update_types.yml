version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "rails"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-type: "production"
        update-types:
          - "version-update:semver-patch"
