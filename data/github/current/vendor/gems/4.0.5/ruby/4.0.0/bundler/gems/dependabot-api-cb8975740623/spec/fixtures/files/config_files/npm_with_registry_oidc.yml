version: 2
registries:
  npm-acme:
    type: npm-registry
    url: registry.npmjs.org
    aws-region: test-region
    account-id: '123456789'
    role-name: test-role
    domain: test-domain
    domain-owner: '987654321'
    replaces-base: true
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-acme
    schedule:
      interval: "daily"
