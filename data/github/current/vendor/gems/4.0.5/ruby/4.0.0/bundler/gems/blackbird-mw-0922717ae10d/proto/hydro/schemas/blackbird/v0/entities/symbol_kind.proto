
syntax = "proto3";

package hydro.schemas.blackbird.v0.entities;

option java_package = "com.github.hydro.schemas.blackbird.v0.entities";
option csharp_namespace = "GitHub.Hydro.Schemas.Blackbird.V0.Entities";

// Symbols are extracted using tree-sitter and https://github.com/github/symbol-extraction
enum SymbolKind {
  SYMBOL_KIND_UNKNOWN = 0;

  // Definitions. Fields 1-99 reserved.
  // LSP Standard SymbolKinds (sorted to match the standard document rather than field numbers)
  // https://microsoft.github.io/language-server-protocol/specifications/lsp/3.17/specification/#symbolKind

  SYMBOL_KIND_FILE_DEF = 12; // Currently unsupported
  SYMBOL_KIND_MODULE_DEF = 4;
  SYMBOL_KIND_NAMESPACE_DEF = 13; // Currently unsupported
  SYMBOL_KIND_PACKAGE_DEF = 14; // Currently unsupported
  SYMBOL_KIND_CLASS_DEF = 3;
  SYMBOL_KIND_METHOD_DEF = 2;
  SYMBOL_KIND_PROPERTY_DEF = 15; // Currently unsupported
  SYMBOL_KIND_FIELD_DEF = 9;
  SYMBOL_KIND_CONSTRUCTOR_DEF = 16; // Currently unsupported
  SYMBOL_KIND_ENUM_DEF = 17;
  SYMBOL_KIND_INTERFACE_DEF = 7;
  SYMBOL_KIND_FUNCTION_DEF = 1;
  SYMBOL_KIND_VARIABLE_DEF = 18; // Currently unsupported
  SYMBOL_KIND_CONSTANT_DEF = 10;
  SYMBOL_KIND_STRING_DEF = 19; // Currently unsupported
  SYMBOL_KIND_NUMBER_DEF = 20; // Currently unsupported
  SYMBOL_KIND_BOOLEAN_DEF = 21; // Currently unsupported
  SYMBOL_KIND_ARRAY_DEF = 22; // Currently unsupported
  SYMBOL_KIND_OBJECT_DEF = 23; // Currently unsupported
  SYMBOL_KIND_KEY_DEF = 24; // Currently unsupported
  SYMBOL_KIND_NULL_DEF = 25; // Currently unsupported
  SYMBOL_KIND_ENUM_MEMBER_DEF = 26;
  SYMBOL_KIND_STRUCT_DEF = 27;
  SYMBOL_KIND_EVENT_DEF = 28; // Currently unsupported
  SYMBOL_KIND_OPERATOR_DEF = 29; // Currently unsupported
  SYMBOL_KIND_TYPE_PARAMETER_DEF = 30; // Currently unsupported

  // Non-LSP Standard SymbolKinds

  SYMBOL_KIND_TYPE_DEF = 6;
  SYMBOL_KIND_IMPLEMENTATION_DEF = 8;
  SYMBOL_KIND_MACRO_DEF = 11;
  SYMBOL_KIND_TRAIT_DEF = 31;
  SYMBOL_KIND_UNION_DEF = 32;

  // Documents. Fields 50-99 reserved.

  SYMBOL_KIND_SECTION_1_DEF = 50;
  SYMBOL_KIND_SECTION_2_DEF = 51;
  SYMBOL_KIND_SECTION_3_DEF = 52;
  SYMBOL_KIND_SECTION_4_DEF = 53;
  SYMBOL_KIND_SECTION_5_DEF = 54;
  SYMBOL_KIND_SECTION_6_DEF = 55;

  // References

  SYMBOL_KIND_CALL_REF = 100; // Call site of a function or method
  SYMBOL_KIND_FIELD_REF = 101;
  SYMBOL_KIND_PROPERTY_REF = 102;
  SYMBOL_KIND_ENUM_MEMBER_REF = 103;

  // Documentation

  SYMBOL_KIND_COMMENT = 150;

  reserved 5; // SYMBOL_KIND_CALL_DEF = 5;
}
