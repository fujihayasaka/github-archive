name: "Wait for CCA to complete"
description: "Cleanup the open pull request copilot created"
inputs:
  token:
    description: "The GitHub token to use for API calls"
    required: true
  session_id:
    description: "The id of the session for this CCA run"
    required: true
  capi_base_url:
    description: "The Copilot API base URL"
    required: false
    default: "https://api.githubcopilot.com"
  integration_id:
    description: "The Copilot-Integration-Id header value"
    required: false
    default: "playground-dev"
  no_progress_timeout_minutes:
    description: "Fail if the session's state and published_event_count do not change for this many minutes. Set to 0 to disable."
    required: false
    default: "0"
outputs:
  workflow_run_id:
    description: "The workflow run ID of the CCA session"
    value: ${{ steps.wait.outputs.workflow_run_id }}
  session_state:
    description: "The final state of the CCA session"
    value: ${{ steps.wait.outputs.session_state }}
runs:
  using: "composite"
  steps:
    - name: Wait for CCA to complete
      id: wait
      shell: bash
      run: |
        no_progress_timeout_minutes="${{ inputs.no_progress_timeout_minutes }}"
        if ! [[ "$no_progress_timeout_minutes" =~ ^[0-9]+$ ]]; then
          echo "no_progress_timeout_minutes must be a non-negative integer, got '$no_progress_timeout_minutes'"
          exit 1
        fi
        no_progress_timeout_seconds=$((10#$no_progress_timeout_minutes * 60))
        last_progress_at=$(date +%s)
        last_progress_fingerprint=""

        echo "Polling session: ${{ inputs.session_id }}"

        while true; do
          http_code=$(curl -s -o /tmp/session_response.json -w "%{http_code}" ${{ inputs.capi_base_url }}/agents/sessions/${{ inputs.session_id }} -H "Authorization: Bearer ${{ inputs.token }}" -H "Copilot-Integration-Id: ${{ inputs.integration_id }}")
          response=$(cat /tmp/session_response.json)
          echo "HTTP status: $http_code"
          echo "Response: $response"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            state=$(echo "$response" | jq -r '.state')
            workflow_run_id=$(echo "$response" | jq -r '.current_workflow_run_id // empty')
            published_event_count=$(echo "$response" | jq -r '.published_event_count // empty')
            progress_fingerprint="$state:$published_event_count"

            if [ -n "$workflow_run_id" ]; then
              echo "workflow_run_id=$workflow_run_id" >> "$GITHUB_OUTPUT"
            fi

            if [ "$progress_fingerprint" != "$last_progress_fingerprint" ]; then
              last_progress_at=$(date +%s)
              last_progress_fingerprint="$progress_fingerprint"
              echo "Observed progress fingerprint: $progress_fingerprint"
            fi

            if [ "$state" = "completed" ]; then
              echo "session_state=$state" >> "$GITHUB_OUTPUT"
              echo "Agent task completed successfully"
              exit 0
            elif [ "$state" = "failed" ] || [ "$state" = "cancelled" ] || [ "$state" = "timed_out" ]; then
              error_code=$(echo "$response" | jq -r '.error.code // "unknown"')
              error_message=$(echo "$response" | jq -r '.error.message // "no message"')
              echo "Agent task reached terminal state: $state"
              echo "  Error code: $error_code"
              echo "  Error message: $error_message"
              echo "session_state=$state" >> "$GITHUB_OUTPUT"
              exit 1
            fi

            echo "Agent task still in progress (state: $state), sleeping for 30 seconds..."
          fi

          if [ "$no_progress_timeout_seconds" -gt 0 ]; then
            no_progress_seconds=$(($(date +%s) - last_progress_at))
            if [ "$no_progress_seconds" -ge "$no_progress_timeout_seconds" ]; then
              echo "Agent task made no observable progress for ${no_progress_timeout_minutes} minutes"
              echo "Last progress fingerprint: $last_progress_fingerprint"
              echo "Last response: $response"
              exit 1
            fi
          fi

          sleep 30
        done
