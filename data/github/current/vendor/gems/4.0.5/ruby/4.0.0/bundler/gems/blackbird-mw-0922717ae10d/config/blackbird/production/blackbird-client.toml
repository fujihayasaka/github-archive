# TODO: Should the blackbird client report metrics?
[metrics.exporter]
type = "noop"

[kafka.blackbird-eastus]
security_protocol = "ssl"
ca_bundle = "/etc/ssl/certs/ca-certificates.crt"
brokers = "hydro-kafka-blackbird-boot-1.service.azure-eastus.github.net:9093,hydro-kafka-blackbird-boot-2.service.azure-eastus.github.net:9093,hydro-kafka-blackbird-boot-3.service.azure-eastus.github.net:9093"
# log_level = "debug"
group_suffix = "001"

[kafka.blackbird-gc-cus-02]
security_protocol = "ssl"
ca_bundle = "/etc/ssl/certs/ca-certificates.crt"
brokers = "hydro-kafka-blackbird-gc-cus-02.service.gc-cus-02.consul:9093"
# log_level = "debug"
group_suffix = "001"

[cluster.zeta]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"

[cluster.eta]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"

[cluster.theta]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"

[cluster.iota]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-gc-cus-02"

[cluster.kappa]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-gc-cus-02"

[cluster.lambda]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"

[cluster.mu]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"

[cluster.nu]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"

[cluster.xi]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-gc-cus-02"

[cluster.cache-001]
index_dir = "/data/blackbird/idx"
kafka_cluster_name = "blackbird-eastus"
allow_zero_offset_shards = true

[cluster.cache-001.policy]
type = "rendezvous"

