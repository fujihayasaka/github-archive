syntax = "proto3";

package actions.core.v1;

option go_package = "core/v1";
option ruby_package = "MonolithTwirp::Actions::Core::V1";

service TenantAPI {
  // GetTenantShortcode is used to get a tenant shortcode, which is unique across stamps
  rpc GetTenantShortcode(GetTenantShortcodeRequest) returns (GetTenantShortcodeResponse);
}

// GetTenantShortcodeRequest is request payload to get a tenant shortcode
message GetTenantShortcodeRequest {
  // Unused, included for future usage
  string stamp_name = 1;

  // ID of the tenant on the stamp
  int64 tenant_id = 2;
}

// GetTenantShortcodeResponse is a response containing the tenant shortcode
message GetTenantShortcodeResponse {
  string tenant_shortcode = 1;
}
