name: Sorbet
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: read

jobs:
  sorbet:
    name: Sorbet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          bundler-cache: true

      - name: Flag if sorbet/tapioca/require.rb references files that no longer exist
        # Use static analysis to avoid booting the full Rails app, which forces setting env vars etc.
        run: |
          bundle exec ruby -I lib -e '
            requires = File.readlines("sorbet/tapioca/require.rb").grep(/\Arequire ["'\''](.+)["'\'']\s*\z/) { $1 }

            missing = requires.reject do |r|
              if r.start_with?("./")
                [r, "#{r}.rb"].any? { |f| File.exist?(f) && !File.directory?(f) }
              else
                $LOAD_PATH.any? { |d| [r, "#{r}.rb"].any? { |ext| File.exist?("#{d}/#{ext}") && !File.directory?("#{d}/#{ext}") } }
              end
            end

            abort("Missing requires in sorbet/tapioca/require.rb:\n#{missing.join("\n")}") if missing.any?
          '

      - run: bundle exec tapioca gem --verify

      - run: bundle exec srb tc

      - run: bundle exec spoom srb coverage

      - run: |
          bundle exec spoom srb bump --from=false --to=true --dry
          bundle exec spoom srb bump --from=true --to=strict --dry
          bundle exec spoom srb bump --from=strict --to=strong --dry

      - run: bundle exec spoom srb coverage snapshot --save

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spoom_data
          path: ./spoom_data/

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ./script/generate-coverage-report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: spoom_report
          path: ./spoom_report.html
