version: "2"
run:
  go: go1.25.3
  build-tags:
    - integration
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - thelper
    - unconvert
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -S1028
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
