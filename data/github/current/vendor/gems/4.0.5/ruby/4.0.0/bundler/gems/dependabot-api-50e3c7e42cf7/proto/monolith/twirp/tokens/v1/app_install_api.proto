syntax = "proto3";

package dependabot.tokens.v1;

option go_package = "tokens/v1";
option ruby_package = "MonolithTwirp::Dependabot::Tokens::V1";

service AppInstallAPI {
  rpc CreateRepositoryInstall(CreateRepositoryInstallRequest)
    returns (CreateRepositoryInstallResponse);
}

message CreateRepositoryInstallRequest {
  enum InstallTrigger {
    INSTALL_TRIGGER_INVALID = 0;
    INSTALL_TRIGGER_DEPENDENCY_GRAPH_REQUESTED = 1;
  }

  int64 repository_id = 1;
  InstallTrigger trigger = 2;
}

message CreateRepositoryInstallResponse {
  enum InstallState {
    INSTALL_STATE_INVALID = 0;
    INSTALL_STATE_EXISTS = 1;           // An install already exists for this repo id
    INSTALL_STATE_CREATED = 2;          // An install has been successfully created
    INSTALL_STATE_REFUSED_DELETED = 3;  // No install exists, none will be requested
    INSTALL_STATE_REFUSED_ARCHIVED = 4; // No install exists, none will be requested
    INSTALL_STATE_REFUSED_SPAMMY = 5;   // No install exists, none will be requested
  }

  int64 repository_id = 1;
  InstallState state = 2;
  int64 installation_id = 3;
}
