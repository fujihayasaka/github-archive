version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "invalid property"
    target-branch: "rollout"
    versioning-strategy: "increase-if-necessary"
    vendor: true
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "drwho"
    labels:
      - "security"
      - "deps"
    assignees:
      - "drwho"
    milestone: 12
    allow:
      - dependency-type: "all"
      - dependency-name: "rails"
    ignore:
      - dependency-name: "rails"
        versions: "> 6.0"
      - dependency-name: "rspec"
    insecure-external-code-execution: deny
    groups:
      development:
        applies-to: security-updates
        patterns:
          - dev*
 
