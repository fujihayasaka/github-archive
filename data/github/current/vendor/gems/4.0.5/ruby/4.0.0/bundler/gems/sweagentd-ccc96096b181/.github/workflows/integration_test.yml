name: "Test Copilot Coding Agent"

on:
  schedule:
    # Run continuously - every 15 minutes
    - cron: "*/15 * * * *"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/integration_test*"

permissions:
  contents: read

jobs:
  job-api-test:
    uses: ./.github/workflows/integration_test_job_api.yml
    secrets:
      token: ${{ secrets.CCA_TESTING_TOKEN }}
      datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
    with:
      repo_name: cca-automated-testing
      reporting_id: job-api-linux
  job-api-test-windows:
    uses: ./.github/workflows/integration_test_job_api.yml
    secrets:
      token: ${{ secrets.CCA_TESTING_TOKEN }}
      datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
    with:
      repo_name: cca-automated-testing-windows
      reporting_id: job-api-windows
  mcp-test-linux:
    uses: ./.github/workflows/integration_test_mcp.yml
    secrets:
      token: ${{ secrets.CCA_TESTING_TOKEN }}
      datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
    with:
      repo_name: cca-automated-testing
      reporting_id: mcp-test-linux
      issue_number: "3710"
  mcp-test-windows:
    uses: ./.github/workflows/integration_test_mcp.yml
    secrets:
      token: ${{ secrets.CCA_TESTING_TOKEN }}
      datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
    with:
      repo_name: cca-automated-testing-windows
      reporting_id: mcp-test-windows
      issue_number: "22"
  issue-assignment-cli-test:
    uses: ./.github/workflows/integration_test_issue_assignment_cli.yml
    secrets:
      token: ${{ secrets.CCA_TESTING_TOKEN }}
      datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
    with:
      reporting_id: issue-assignment-cli
  pr-comment-test:
    uses: ./.github/workflows/integration_test_pr_comment.yml
    secrets:
      token: ${{ secrets.CCA_TESTING_TOKEN }}
      datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
    with:
      repo_name: cca-automated-testing
      reporting_id: pr-comment
