pipelines:
  production_rollout:
    thread_notifications: true
    notify_users_via_dm: false
    auto_start_wait: false
    timeout: 3600 # 1 hr
    stages:
      - name: canary
        kind: canary_deployment
        config:
          environment: production
          hosts: canary
          timeout: 720
        gates:
          - kind: datadog
            auto_rollback:
              enabled: true
            monitor_id: "171393642" # https://app.datadoghq.com/monitors/171393642
            display_name: "Monitoring blackbird-query success in prod/canary"
            evaluation_period: 60
            execution_mode: single
      - name: staff-wus2-01
        kind: concurrent_group
        config:
          timeout: 900
        stages:
          - name: proxima staff-wus2-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: staff-wus2-01
              timeout: 720
          - name: proxima staff-wus2-01-blue
            kind: deployment
            config:
              environment: staff-wus2-01-blue
              timeout: 720
          - name: proxima staff-wus2-01-green
            kind: deployment
            config:
              environment: staff-wus2-01-green
              timeout: 720
        gates:
          - kind: datadog
            auto_rollback:
              enabled: true
            monitor_id: "175615272" # https://app.datadoghq.com/monitors/175615272
            display_name: "Monitoring Go services 200 responses in staff-wus2-01"
            evaluation_period: 60
            execution_mode: single
      - name: dotcom
        kind: concurrent_group
        config:
          timeout: 900
        stages:
          - name: production (query, probers, maintenance, admin ui, chatops, admin api)
            kind: deployment
            config:
              environment: production
              timeout: 720
          - name: dotcom blue
            kind: deployment
            config:
              environment: blue
              timeout: 720
          - name: dotcom green
            kind: deployment
            config:
              environment: green
              timeout: 720
        gates:
          - kind: datadog
            auto_rollback:
              enabled: true
            monitor_id: "175616265" # https://app.datadoghq.com/monitors/175616265
            execution_mode: single
            display_name: "Monitoring Go services 200 responses in production"
            evaluation_period: 60
      - name: proxima
        kind: concurrent_group
        config:
          timeout: 900
        stages:
          - name: prod-weu-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-weu-01
              timeout: 720
          - name: prod-weu-01-blue
            kind: deployment
            config:
              environment: prod-weu-01-blue
              timeout: 720
          - name: prod-weu-01-green
            kind: deployment
            config:
              environment: prod-weu-01-green
              timeout: 720
          - name: prod-sdc-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-sdc-01
              timeout: 720
          - name: prod-sdc-01-blue
            kind: deployment
            config:
              environment: prod-sdc-01-blue
              timeout: 720
          - name: prod-sdc-01-green
            kind: deployment
            config:
              environment: prod-sdc-01-green
              timeout: 720
          - name: prod-ae-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-ae-01
              timeout: 720
          - name: prod-ae-01-blue
            kind: deployment
            config:
              environment: prod-ae-01-blue
              timeout: 720
          - name: prod-ae-01-green
            kind: deployment
            config:
              environment: prod-ae-01-green
              timeout: 720
          - name: prod-cus-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-cus-01
              timeout: 720
          - name: prod-cus-01-blue
            kind: deployment
            config:
              environment: prod-cus-01-blue
              timeout: 720
          - name: prod-cus-01-green
            kind: deployment
            config:
              environment: prod-cus-01-green
              timeout: 720
          - name: test-cnc-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: test-cnc-01
              timeout: 720
          - name: test-cnc-01-blue
            kind: deployment
            config:
              environment: test-cnc-01-blue
              timeout: 720
          - name: test-cnc-01-green
            kind: deployment
            config:
              environment: test-cnc-01-green
              timeout: 720
          - name: prod-jpw-01 (query, probers, maintenance, admin api)
            kind: deployment
            config:
              environment: prod-jpw-01
              timeout: 720
          - name: prod-jpw-01-blue
            kind: deployment
            config:
              environment: prod-jpw-01-blue
              timeout: 720
          - name: prod-jpw-01-green
            kind: deployment
            config:
              environment: prod-jpw-01-green
              timeout: 720
        gates:
          - kind: datadog
            auto_rollback:
              enabled: true
            monitor_id: "173358182" # https://app.datadoghq.com/monitors/173358182
            execution_mode: single
            display_name: "Monitoring Go services 200 responses in all proxima stamps"
            evaluation_period: 60

required_builds:
  - "blackbird-mw / docker-image"
  - "blackbird-mw / moda-config-bundle"
  - "Run Go tests"
notifications:
  slack_channels:
    - "#blackbird-ops"
ok_for_moda_to_remove_from_deprecating_clusters: true
auto_start_pipeline: production_rollout
auto_retry_count: 2
partition_failure_tolerance: 2
