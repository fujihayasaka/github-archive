name: PR Checks

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

jobs:
  do-not-merge:
    name: Check for DO NOT MERGE text
    runs-on: ubuntu-slim
    # Skip in merge queue - there is no PR to check there.
    if: ${{ github.event_name != 'merge_group' }}
    steps:
      - uses: github/blackbird-actions/do-not-merge@main
        with:
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
