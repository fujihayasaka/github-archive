version: 2
registries:
  ghcr: # Define access for a private registry
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{secrets.BASE_CONTAINER_IMAGE_READER_DEPENDABOT}}
updates:
  - package-ecosystem: docker
    registries:
      - ghcr
    directory: "/"
    schedule:
      interval: weekly
    groups:
      baseImages:
        patterns:
          - "*"
  # Docker image dependencies (images/cca/Dockerfile)
  - package-ecosystem: docker
    directory: "/images/cca"
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
    groups:
      docker-images:
        patterns:
          - "*"
  # Docker image dependencies (images/cca-runtime/Dockerfile)
  - package-ecosystem: docker
    directory: "/images/cca-runtime"
    schedule:
      interval: daily
    labels:
      - dependencies
      - docker
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "github/internal-actions"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      godeps:
        patterns:
          - "*"
