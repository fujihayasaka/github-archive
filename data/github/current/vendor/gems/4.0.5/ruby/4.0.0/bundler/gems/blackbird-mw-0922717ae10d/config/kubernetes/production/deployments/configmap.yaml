apiVersion: v1
kind: ConfigMap
metadata:
  name: chatops-config
  annotations:
    moda.github.net/canary-v2: "true"
data:
  security-config.yaml: |
    ---
    profiles:
        common-configs: &common-cfgs
            owner: '@github/blackbird'
            safe_rooms:
                - blackbird-ops
            safe_roles:
                - blackbird-mw
        high-risk-commands: &high-risk
            <<: *common-cfgs
            2fa: true
        low-risk-commands: &low-risk
            <<: *common-cfgs
            2fa: false
    commands:
        corpus:
            <<: *low-risk
  ldap-config.yaml: |
    ---
    base: dc=github,dc=net
    host: ops-ldap.github.net
    port: 636
    usessl: true
    binddn: uid=blackbird-mw_production,ou=Scout_Accounts,dc=github,dc=net
    userfilter: "(&(objectClass=organizationalPerson)(uid=%s))"
    groupfilter: "(uniqueMember=uid=%s,ou=People,dc=github,dc=net)"
    attributes:
      - sn
      - cn
      - uid
