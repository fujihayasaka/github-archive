services:
  db:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_TCP_PORT=3307
    network_mode: host
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:5.0.8
    network_mode: host

  aqueduct-lite:
    image: ghcr.io/github/aqueduct-lite/aqueduct-lite:latest
    command: bin/aqueduct-lite
    restart: always
    network_mode: host
    ports:
      - "18081:18081"
    expose:
      - 18081
    depends_on:
      - redis
    environment:
      - AQUEDUCT_LITE_LISTEN_ADDRESS=0.0.0.0:18081
      - AQUEDUCT_LITE_LOG_LEVEL=debug
      - AQUEDUCT_LITE_REDIS_ADDRESS=127.0.0.1:6379

  web:
    build:
      context: .
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder-base
    image: dependabot-api
    command: bundle exec foreman start web
    environment:
      - AQUEDUCT_URL=http://127.0.0.1:18081/twirp
      - AWS_ENDPOINT
      - BOOTSNAP_CACHE_DIR=/tmp/bootsnap
      - BUNDLE_RUBYGEMS__PKG__GITHUB__COM
      - CODESPACES
      - DATABASE_URL=trilogy://127.0.0.1:3307
      - ENTERPRISE
      - HYDRO_KAFKA_BROKERS
      - INTERNAL_DEPLOYMENT=true
      - OVERRIDE_UPDATE_JOB_QUEUE_NAME=update-jobs-dev
      - PORT=3001
      - PROXIMA_STAMP
      - RAILS_ENV
      - REDIS_URL=redis://127.0.0.1:6379/0
      - SCHEMA
    network_mode: host
    volumes:
      - .:/app:rw,delegated
      - bootsnap-cache:/tmp/bootsnap:cached
    depends_on:
      - db
      - redis
      - timerd
      - aqueduct-worker

  timerd:
    image: dependabot-api
    command: bundle exec bin/timerd ./config/scheduled_jobs.rb
    environment:
      - AQUEDUCT_URL=http://127.0.0.1:18081/twirp
      - AWS_ENDPOINT
      - BOOTSNAP_CACHE_DIR=/tmp/bootsnap
      - CODESPACES
      - DATABASE_URL=trilogy://127.0.0.1
      - ENTERPRISE
      - HYDRO_KAFKA_BROKERS
      - INTERNAL_DEPLOYMENT=true
      - OVERRIDE_UPDATE_JOB_QUEUE_NAME=update-jobs-dev
      - PORT=3001
      - PROXIMA_STAMP
      - RAILS_ENV
      - REDIS_URL=redis://127.0.0.1:6379/0
      - SCHEMA
    network_mode: host
    volumes:
      - .:/app:rw,delegated
      - bootsnap-cache:/tmp/bootsnap:cached
    depends_on:
      - db
      - aqueduct-lite
      - aqueduct-worker

  aqueduct-worker:
    image: dependabot-api
    command: bundle exec dotenv -f ".env.local,.env" bundle exec resqued -p /tmp/resqued.pid config/resqued/aqueduct_enterprise.rb
    environment:
      - AQUEDUCT_URL=http://127.0.0.1:18081/twirp
      - AWS_ENDPOINT
      - BOOTSNAP_CACHE_DIR=/tmp/bootsnap
      - DATABASE_URL=trilogy://127.0.0.1:3307
      - ENTERPRISE
      - OVERRIDE_UPDATE_JOB_QUEUE_NAME=update-jobs-dev
      - PROXIMA_STAMP
      - RAILS_ENV
      - REDIS_URL=redis://127.0.0.1:6379/0
      - SCHEMA
    network_mode: host
    volumes:
      - .:/app:rw,delegated
      - bootsnap-cache:/tmp/bootsnap:cached
    depends_on:
      - aqueduct-lite
      - db
      - redis

  consumer:
    image: dependabot-api
    command: bundle exec dotenv -f ".env.local,.env" script/hydro-enterprise-consumer
    environment:
      - AQUEDUCT_URL=http://127.0.0.1:18081/twirp
      - AWS_ENDPOINT
      - BOOTSNAP_CACHE_DIR=/tmp/bootsnap
      - CODESPACES
      - DATABASE_URL=trilogy://127.0.0.1:3307
      - ENTERPRISE
      - HYDRO_KAFKA_BROKERS
      - OVERRIDE_UPDATE_JOB_QUEUE_NAME=update-jobs-dev
      - RAILS_ENV
      - REDIS_URL=redis://127.0.0.1:6379/0
      - SCHEMA
    network_mode: host
    volumes:
      - .:/app:rw,delegated
      - bootsnap-cache:/tmp/bootsnap:cached
    depends_on:
      - db
      - redis

volumes:
  mysql-data:
    driver: local
  bootsnap-cache:
    driver: local
