apiVersion: v1
kind: Service
metadata:
    annotations:
        moda.github.net/domain-name: dependabot-chatops-%environment%.service.%site%.github.net,dependabot-chatops-%environment%.service.%region%.github.net
        moda.github.net/istio-ingress-enabled: "true"
        moda.github.net/load-balancer-type: internal-http
        opaque.github.net/checks: |
            - check_interval: 1m
              http:
                url: https://{{.Instance.Name}}/_ping
    labels:
        service: dependabot-chatops
    name: dependabot-chatops
spec:
    ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 3000
    selector:
        app: dependabot-chatops
    type: LoadBalancer
