syntax = "proto3";

package github.spokes.tags.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/tags";
option ruby_package = "GitHub::Spokes::Proto::Tags::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";
import "spokes-api/types/v1/transaction_context.proto";
import "spokes-api/types/v2/attribution.proto";

// TagsAPI contains APIs for Git operations involving tag objects.
service TagsAPI {
    // CreateTag creates a tag object from the given tag metadata and returns
    // the object ID.
    rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
}

message CreateTagRequest {
    // repository is the repository into which we're writing the new tag.
    github.spokes.types.v1.Repository repository = 1;

    github.spokes.types.v1.RequestContext request_context = 2;

    // name is the name of the tag to be stored in the object's metadata.
    bytes name = 3;

    // target is the object ID of the object to be tagged.
    github.spokes.types.v1.ObjectID target = 4;

    // tagger is the attribution associated with this tag.
    github.spokes.types.v2.Attribution tagger = 5;

    // message is the tag's message.
    bytes message = 6;
}

message CreateTagResponse {
    // transaction_context contains the updated state after performing the
    // write.
    github.spokes.types.v1.TransactionContext transaction_context = 1;

    // oid is the object ID of the newly-created tag
    github.spokes.types.v1.ObjectID oid = 2;
}
