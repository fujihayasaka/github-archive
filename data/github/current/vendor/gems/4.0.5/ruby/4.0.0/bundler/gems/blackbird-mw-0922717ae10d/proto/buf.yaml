version: v1

lint:
  use:
    - DEFAULT
  except:
    - PACKAGE_DIRECTORY_MATCH
  ignore:
    - hydro
  ignore_only:
    ENUM_ZERO_VALUE_SUFFIX:
      - query/v1/service.proto
      - query/v1/scoring_info.proto
      - query/v1/symbol.proto
  enum_zero_value_suffix: _INVALID
  service_suffix: API

breaking:
  use:
    - PACKAGE
