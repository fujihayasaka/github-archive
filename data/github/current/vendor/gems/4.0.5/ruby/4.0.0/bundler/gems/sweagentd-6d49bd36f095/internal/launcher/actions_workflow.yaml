# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
run-name: '<< .RunName >>'

permissions:
  deployments: write  # Required temporarily because we are technically "deploying" to Copilot

on: dynamic

jobs:
  << .JobName >>:
    runs-on: << index .Customization "runs-on" >>
    timeout-minutes: << index .Customization "timeout-minutes" >>
    << index .Customization "permissions" >>
    << index .Customization "snapshot" >>
    << index .Customization "container" >>
    << index .Customization "services" >>
    <<- if or (not .UseAgentSecrets) .IncludeCopilotEnvironmentInDynamicWorkflow >>
    environment: copilot
    <<- end >>
    env:
      SHOULD_CONTINUE: 'true'  # This variable is used to short-circuit steps if prerequisites fail
      << if or (contains .Secrets "HTTP_PROXY") (contains .Variables "HTTP_PROXY") >>
      HTTP_PROXY: '${{ secrets.HTTP_PROXY || vars.HTTP_PROXY }}'
      << end >>
      << if or (contains .Secrets "HTTPS_PROXY") (contains .Variables "HTTPS_PROXY") >>
      HTTPS_PROXY: '${{ secrets.HTTPS_PROXY || vars.HTTPS_PROXY }}'
      << end >>
      << if or (contains .Secrets "NO_PROXY") (contains .Variables "NO_PROXY") >>
      NO_PROXY: '${{ secrets.NO_PROXY || vars.NO_PROXY }}'
      << end >>
      << if or (contains .Secrets "NODE_EXTRA_CA_CERTS") (contains .Variables "NODE_EXTRA_CA_CERTS") >>
      NODE_EXTRA_CA_CERTS: '${{ secrets.NODE_EXTRA_CA_CERTS || vars.NODE_EXTRA_CA_CERTS }}'
      << end >>
      << if or (contains .Secrets "SSL_CERT_FILE") (contains .Variables "SSL_CERT_FILE") >>
      SSL_CERT_FILE: '${{ secrets.SSL_CERT_FILE || vars.SSL_CERT_FILE }}'
      << end >>
    steps:
      - name: Initialize
        shell: bash
        run: |
          NONCE=$(jq -r '.inputs.COPILOT_AGENT_INPUTS | fromjson | .COPILOT_JOB_NONCE' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$NONCE"

      << if or .IsDevelopmentEnvironment .IsStagingEnvironment >>
      # Only do this on linux because windows requires a different format for the environment variable
      # depending on the shell.
      - name: Set HOME environment variable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Persist HOME into the workflow env context so later steps can reference ${{ env.HOME }}.
          echo "HOME=$HOME" >> "$GITHUB_ENV"
      << end >>

      - name: Validate runner OS
        if: ${{ runner.os != 'Linux' && runner.os != 'Windows' }}
        shell: bash
        run: |
          echo "SHOULD_CONTINUE=false" >> $GITHUB_ENV
          echo "${{ runner.os }} is not currently supported. Only Linux and Windows are supported."
          exit 1

      << if ne .IsDevelopmentEnvironment true >>
      # Firewall must be disabled if:
      # - OS is Windows (firewall not supported on Windows), OR
      # - Runner is self-hosted (can't guarantee firewall support on self-hosted runners)
      - name: Validate firewall settings (Linux)
        if: ${{ runner.environment == 'self-hosted' && runner.os == 'Linux' }}
        shell: bash
        run: |
          if [ "$COPILOT_AGENT_FIREWALL_ENABLED" == "true" ]; then
            echo "SHOULD_CONTINUE=false" >> $GITHUB_ENV
            echo "You have configured Copilot cloud agent to use self-hosted GitHub Actions runners in copilot-setup-steps.yml, but the agent firewall is enabled. You must disable the agent firewall in the repository's settings to use self-hosted runners. For more information, see https://gh.io/cca-self-hosted-disable-firewall."
            exit 1
          fi
        env:
          << if .UseMaterializedFirewall >>
          COPILOT_AGENT_FIREWALL_ENABLED: "<< .MaterializedFirewallEnabled >>"
          << else >>
          COPILOT_AGENT_FIREWALL_ENABLED: "${{ vars.COPILOT_AGENT_FIREWALL_ENABLED || << .AgentFirewallEnabledDefault >> }}"
          << end >>

      - name: Validate firewall settings (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if ($env:COPILOT_AGENT_FIREWALL_ENABLED -eq "true") {
            "SHOULD_CONTINUE=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "The agent firewall is enabled, but firewall is not supported on Windows runners. You must disable the agent firewall in the repository's settings to use Windows runners. For more information, see https://gh.io/cca-disable-firewall."
            exit 1
          }
        env:
          << if .UseMaterializedFirewall >>
          COPILOT_AGENT_FIREWALL_ENABLED: "<< .MaterializedFirewallEnabled >>"
          << else >>
          COPILOT_AGENT_FIREWALL_ENABLED: "${{ vars.COPILOT_AGENT_FIREWALL_ENABLED || << .AgentFirewallEnabledDefault >> }}"
          << end >>
      << end >>

      # Pre-cache the Playwright MCP package tarball so that when npx later needs
      # to install it, the download comes from the local npm cache (~/.npm/) instead
      # of the network. We use `npm cache add` instead of `npm install -g` because
      # setup.sh (in the Prepare Copilot step) adds a different Node installation
      # (ghcca-node) to GITHUB_PATH, which has a separate global prefix. A global
      # install done here with the system npm would not be visible to ghcca-node's npx.
      << if not .UsePreinstalledRuntime >>
      - name: Pre-cache Playwright MCP server in the background (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && << .MCPEnabled >> && runner.os == 'Linux' }}
        shell: bash # Bash is required for the disown command, used to run installation in the background
        run: |
          if ! command -v npm &> /dev/null; then
            echo "Warning: npm is not available on this runner. Skipping Playwright MCP pre-download. The MCP server may be installed later if needed."
            exit 0
          fi
          echo "Starting background pre-cache of @playwright/mcp..."
          npm cache add @playwright/mcp@${{ env.PLAYWRIGHT_VERSION }} > /dev/null 2>&1 & disown
          echo "Started pre-caching @playwright/mcp@${{ env.PLAYWRIGHT_VERSION }} in the background"
        env:
          PLAYWRIGHT_VERSION: "<< .PlaywrightVersion >>"

      - name: Pre-cache Playwright MCP server in the background (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && << .MCPEnabled >> && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            Write-Host "Warning: npm is not available on this runner. Skipping Playwright MCP pre-download. The MCP server may be installed later if needed."
            exit 0
          }
          Write-Host "Starting background pre-cache of @playwright/mcp..."
          $job = Start-Job -ScriptBlock {
            param($version)
            npm cache add "@playwright/mcp@$version" 2>&1 | Out-Null
          } -ArgumentList $env:PLAYWRIGHT_VERSION
          Write-Host "Started pre-caching @playwright/mcp@$($env:PLAYWRIGHT_VERSION) in the background (Job ID: $($job.Id))"
        env:
          PLAYWRIGHT_VERSION: "<< .PlaywrightVersion >>"
      << end >>

      << if .UsePreinstalledRuntime >>
      # When using a custom image with pre-installed runtime, symlink from the
      # well-known image paths instead of downloading. Falls through to the
      # normal download path if the pre-installed paths don't exist or if the
      # installed runtime version doesn't match the expected version.
      - name: Use pre-installed runtime (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Linux' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PREINSTALLED_RUNTIME="/opt/copilot-runtime/copilot-developer-action-main"
          PREINSTALLED_NODE="/opt/copilot-runtime/ghcca-node"
          USE_PREINSTALLED="true"
          if [ ! -d "$PREINSTALLED_RUNTIME" ] || [ ! -d "$PREINSTALLED_NODE" ]; then
            echo "Pre-installed runtime not found (runtime=$PREINSTALLED_RUNTIME, node=$PREINSTALLED_NODE), falling through to download..."
            USE_PREINSTALLED="false"
          else
            EXPECTED_VERSION="${COPILOT_AGENT_RUNTIME_SHA}"
            if [ -f "$PREINSTALLED_RUNTIME/version" ]; then
              INSTALLED_VERSION=$(cat "$PREINSTALLED_RUNTIME/version")
              if [ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]; then
                echo "Pre-installed runtime version ($INSTALLED_VERSION) differs from expected ($EXPECTED_VERSION). Falling through to download."
                USE_PREINSTALLED="false"
              fi
            else
              echo "Pre-installed runtime has no version file, cannot verify version match. Falling through to download."
              USE_PREINSTALLED="false"
            fi
          fi

          if [ "$USE_PREINSTALLED" = "true" ]; then
            echo "Pre-installed runtime found, symlinking..."
            ln -sf "$PREINSTALLED_RUNTIME" "${{ runner.temp }}/copilot-developer-action-main"
            ln -sf "$PREINSTALLED_NODE" "${{ runner.temp }}/ghcca-node"
            echo "COPILOT_AGENT_START_TIME_SEC=$(date +%s)" >> "$GITHUB_ENV"
            echo "COPILOT_AGENT_TIMEOUT_MIN=<< index .Customization "timeout-minutes" >>" >> "$GITHUB_ENV"
            mkdir -p "runtime-logs" "cca-mcp-debug-logs"
            echo "COPILOT_PREINSTALLED_RUNTIME=true" >> "$GITHUB_ENV"
            echo "Copilot prepared from pre-installed runtime."
          else
            echo "COPILOT_PREINSTALLED_RUNTIME=false" >> "$GITHUB_ENV"
          fi
        env:
          COPILOT_AGENT_RUNTIME_SHA: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RUNTIME_SHA }}"
      << end >>

      # Download the runtime code and related binaries, but we don't want to be that specific in the name
      - name: Prepare Copilot (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Linux' << if .UsePreinstalledRuntime >> && env.COPILOT_PREINSTALLED_RUNTIME != 'true' << end >> }}
        working-directory: ${{ runner.temp }}
        run: |
          set -o pipefail
          echo "Preparing Copilot..." && \
          echo "Runtime version: $COPILOT_AGENT_RUNTIME_VERSION" && \
          echo "COPILOT_AGENT_START_TIME_SEC=$(date +%s)" >> $GITHUB_ENV
          echo "COPILOT_AGENT_TIMEOUT_MIN=<< index .Customization "timeout-minutes" >>" >> $GITHUB_ENV
          mkdir -p "runtime-logs" "cca-mcp-debug-logs" && \
          MAX_RETRIES=3 && RETRY_COUNT=0 && \
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do \
            if [ -n "$GITHUB_COPILOT_ACTION_OVERRIDE_DOWNLOAD_URL" ]; then \
              curl -f -D "runtime-logs/download.log" -H "Authorization: Bearer $GITHUB_COPILOT_API_TOKEN" $GITHUB_COPILOT_ACTION_OVERRIDE_DOWNLOAD_URL 2>> "runtime-logs/download.log" | tar -zxv >> "runtime-logs/download.log" 2>&1; \
            else \
              curl -f -D "runtime-logs/download.log" $GITHUB_COPILOT_ACTION_DOWNLOAD_URL 2>> "runtime-logs/download.log" | tar -zxv >> "runtime-logs/download.log" 2>&1; \
            fi; \
            if [ $? -eq 0 ]; then break; fi; \
            RETRY_COUNT=$((RETRY_COUNT + 1)); \
            sleep 1; \
          done && \
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then echo "Failed to download runtime after $MAX_RETRIES attempts"; exit 1; fi && \
          echo "Finished downloading and extracting runtime" && \
          if [ ! -d "copilot-developer-action-main" ]; then mv copilot-developer-action-* copilot-developer-action-main >> "runtime-logs/download.log" 2>&1; fi && \
          ./copilot-developer-action-main/script/setup.sh "${{ runner.temp }}/ghcca-node" && \
          echo "Copilot prepared successfully." 2>&1 | tee -a "runtime-logs/download.log"
        env:
          GITHUB_COPILOT_ACTION_DOWNLOAD_URL: ${{ secrets.GITHUB_COPILOT_ACTION_DOWNLOAD_URL }}
          COPILOT_AGENT_SOURCE_ENVIRONMENT: "<< .Environment >>"
          GITHUB_COPILOT_ACTION_OVERRIDE_DOWNLOAD_URL: "<< .ActionDownloadURL >>"
          GITHUB_COPILOT_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          COPILOT_AGENT_RUNTIME_VERSION: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RUNTIME_VERSION }}"

      - name: Prepare Copilot (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Windows' }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Write-Host "Preparing Copilot..."
          Write-Host "Runtime version: $env:COPILOT_AGENT_RUNTIME_VERSION"

          # Verify tar is available (built-in on Windows 10 1803+ and Server 2019+)
          if (-not (Get-Command tar -ErrorAction SilentlyContinue)) {
            throw "The 'tar' command is not available on this runner. Please either install the tar tool or use GitHub-hosted runners."
          }

          $timestamp = [int][double]::Parse((Get-Date -UFormat %s))
          "COPILOT_AGENT_START_TIME_SEC=$timestamp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "COPILOT_AGENT_TIMEOUT_MIN=<< index .Customization "timeout-minutes" >>" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path "runtime-logs", "cca-mcp-debug-logs" | Out-Null

          $maxRetries = 3
          $retryCount = 0
          $success = $false

          while ($retryCount -lt $maxRetries) {
            try {
              if ($env:GITHUB_COPILOT_ACTION_OVERRIDE_DOWNLOAD_URL) {
                $headers = @{ "Authorization" = "Bearer $env:GITHUB_COPILOT_API_TOKEN" }
                Invoke-WebRequest -Uri $env:GITHUB_COPILOT_ACTION_OVERRIDE_DOWNLOAD_URL -OutFile "action.tar.gz" -Headers $headers -ErrorAction Stop
              } else {
                Invoke-WebRequest -Uri $env:GITHUB_COPILOT_ACTION_DOWNLOAD_URL -OutFile "action.tar.gz" -ErrorAction Stop
              }
              $success = $true
              break
            } catch {
              $retryCount++
              Start-Sleep -Seconds 1
            }
          }

          if (-not $success) {
            throw "Failed to download action after $maxRetries retries"
          }

          # Extract tar.gz using tar (built-in on Windows 10 1803+ and Server 2019+)
          tar -zxf action.tar.gz *>> "runtime-logs\download.log"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract action.tar.gz with exit code $LASTEXITCODE"
          }

          # Rename directory if needed
          $dirs = Get-ChildItem -Directory -Filter "copilot-developer-action-*"
          if ($dirs -and -not (Test-Path "copilot-developer-action-main")) {
            Rename-Item -Path $dirs[0].FullName -NewName "copilot-developer-action-main"
          }

          # Run setup script (PowerShell version expected in the runtime package)
          if (Test-Path "copilot-developer-action-main\script\setup.ps1") {
            & "copilot-developer-action-main\script\setup.ps1" "${{ runner.temp }}\ghcca-node"
            if ($LASTEXITCODE -ne 0) { throw "Setup script failed with exit code $LASTEXITCODE" }
          } else {
            throw "setup.ps1 not found. The runtime package may be corrupted or incompatible with Windows runners."
          }

          Write-Host "Copilot prepared successfully."
        env:
          GITHUB_COPILOT_ACTION_DOWNLOAD_URL: ${{ secrets.GITHUB_COPILOT_ACTION_DOWNLOAD_URL }}
          COPILOT_AGENT_SOURCE_ENVIRONMENT: "<< .Environment >>"
          GITHUB_COPILOT_ACTION_OVERRIDE_DOWNLOAD_URL: "<< .ActionDownloadURL >>"
          GITHUB_COPILOT_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          COPILOT_AGENT_RUNTIME_VERSION: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RUNTIME_VERSION }}"

      # Run steps here - this should already have all references to MCP or GitHub secrets / vars removed through by replacing them w/''
      << index .Customization "steps" >>

      << if or (eq .RepositoryOwner "github") (eq .RepositoryOwner "dsp-testing") >>
      # To help test development releases of autofind, we allow overriding the autofind binaries if we're in github or dsp-testing org
      # only inject this step if on github or dsp-testing repos to avoid allowing external users to inject a custom autofind binary which could be a security risk.
      # AUTOFIND_LOC is expected to be defined in the repo's environment settings and it is relative to the repo root.
      - name: Checkout Repository for Post-Prepare
        if: ${{ env.SHOULD_CONTINUE == 'true' && vars.AUTOFIND_LOC != '' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ secrets.GITHUB_COPILOT_GIT_TOKEN }}

      - name: Post-Prepare Copilot (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && vars.AUTOFIND_LOC != '' && runner.os == 'Linux' }}
        shell: bash
        env:
          AUTOFIND_LOC: "${{ vars.AUTOFIND_LOC }}"
        run: |
          DEFAULT_AUTOFIND="$RUNNER_TEMP/copilot-developer-action-main/dist-autofind-ts/ts/autofind.js"
          NEW_AUTOFIND="$GITHUB_WORKSPACE/$AUTOFIND_LOC"

          echo "Overwriting default Autofind with AUTOFIND_LOC environment variable for testing..."
          echo "New Autofind: $NEW_AUTOFIND"
          echo "Will overwrite Autofind at: $DEFAULT_AUTOFIND"

          # Ensure NEW_AUTOFIND ends with autofind.js
          if [[ "$NEW_AUTOFIND" != */autofind.js ]]; then
            echo "AUTOFIND_LOC must point to an autofind.js file: $NEW_AUTOFIND"
            exit 1
          fi

          # check that $GITHUB_WORKSPACE exists and that AUTOFIND_LOC is a safe file within the workspace
          if [ ! -d "$GITHUB_WORKSPACE" ]; then
            echo "GITHUB_WORKSPACE does not exist, cannot verify AUTOFIND_LOC"
            echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
            echo "Be sure to create custom steps in copilot-setup-steps.yml that checks out the repository."
            exit 1
          fi

          TARGET_PATH="$(realpath "$GITHUB_WORKSPACE/$AUTOFIND_LOC" 2>/dev/null)" || {
            echo "Failed to resolve AUTOFIND_LOC: $GITHUB_WORKSPACE/$AUTOFIND_LOC"
            exit 1
          }

          # symlinks are allowed as long as they resolve to a file within the GITHUB_WORKSPACE.
          if [[ "$TARGET_PATH" != "$GITHUB_WORKSPACE/"* ]] || [ ! -f "$TARGET_PATH" ]; then
            echo "AUTOFIND_LOC must be a regular file autofind.js within GITHUB_WORKSPACE: $TARGET_PATH"
            exit 1
          fi

          rm -f "$DEFAULT_AUTOFIND"
          cp "$NEW_AUTOFIND" "$DEFAULT_AUTOFIND"

          echo "development, development" > "$(dirname "$DEFAULT_AUTOFIND")/ts_version"

      - name: Post-Prepare Copilot (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && vars.AUTOFIND_LOC != '' && runner.os == 'Windows' }}
        shell: pwsh
        env:
          AUTOFIND_LOC: "${{ vars.AUTOFIND_LOC }}"
        run: |
          $DEFAULT_AUTOFIND = "$env:RUNNER_TEMP\copilot-developer-action-main\dist-autofind-ts\ts\autofind.js"
          $NEW_AUTOFIND = "$env:GITHUB_WORKSPACE\$env:AUTOFIND_LOC"

          Write-Host "Overwriting default Autofind with AUTOFIND_LOC environment variable for testing..."
          Write-Host "New Autofind: $NEW_AUTOFIND"
          Write-Host "Will overwrite Autofind at: $DEFAULT_AUTOFIND"

          # Ensure NEW_AUTOFIND ends with autofind.js
          $NORMALIZED_NEW_AUTOFIND = $NEW_AUTOFIND -replace '/', '\'
          if ($NORMALIZED_NEW_AUTOFIND -notlike "*\autofind.js") {
            Write-Host "AUTOFIND_LOC must point to an autofind.js file: $NEW_AUTOFIND"
            exit 1
          }

          # check that GITHUB_WORKSPACE exists and that AUTOFIND_LOC is a safe file within the workspace
          if (-not (Test-Path $env:GITHUB_WORKSPACE -PathType Container)) {
            Write-Host "GITHUB_WORKSPACE does not exist, cannot verify AUTOFIND_LOC"
            Write-Host "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
            Write-Host "Be sure to create custom steps in copilot-setup-steps.yml that checks out the repository."
            exit 1
          }

          # check that AUTOFIND_LOC resolves to a file within GITHUB_WORKSPACE.
          $TARGET_PATH = (Resolve-Path "$env:GITHUB_WORKSPACE\$env:AUTOFIND_LOC" -ErrorAction SilentlyContinue).Path
          if (-not $TARGET_PATH) {
            Write-Host "Failed to resolve AUTOFIND_LOC: $env:GITHUB_WORKSPACE\$env:AUTOFIND_LOC"
            exit 1
          }

          # symlinks are allowed as long as they resolve to a file within the GITHUB_WORKSPACE.
          if (-not $TARGET_PATH.StartsWith("$env:GITHUB_WORKSPACE\") -or -not (Test-Path $TARGET_PATH -PathType Leaf)) {
            Write-Host "AUTOFIND_LOC must be a regular file autofind.js within GITHUB_WORKSPACE: $TARGET_PATH"
            exit 1
          }

          Remove-Item -Force $DEFAULT_AUTOFIND -ErrorAction SilentlyContinue
          Copy-Item $NEW_AUTOFIND $DEFAULT_AUTOFIND

          "development, development" | Out-File -FilePath (Join-Path (Split-Path $DEFAULT_AUTOFIND) "ts_version") -Encoding utf8 -NoNewline
      <<end>>

      << if not .ActionDownloadURL >>
      - name: Download Autofind (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Linux' << if .UsePreinstalledRuntime >> && env.COPILOT_PREINSTALLED_RUNTIME != 'true' << end >> }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          if [ -z "$GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL" ]; then
            echo "Autofind download URL not configured, skipping."
            exit 0
          fi
          echo "Starting background download of Autofind..."

          # Download and extract in background, then move to copilot-developer-action-main
          (
            START_TIME=$(date +%s.%N)
            echo "Starting Autofind download at $(date)" > runtime-logs/download-autofind.log
            curl -f "$GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL" 2>> runtime-logs/download-autofind.log | tar -zxv >> runtime-logs/download-autofind.log 2>&1
            mv autofind copilot-developer-action-main/ >> runtime-logs/download-autofind.log 2>&1
            END_TIME=$(date +%s.%N)
            ELAPSED=$(echo "$END_TIME - $START_TIME" | bc)
            echo "Autofind download completed in ${ELAPSED}s" >> runtime-logs/download-autofind.log
          ) & disown

        env:
          GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL: ${{ secrets.GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL }}

      - name: Download Autofind (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Windows' }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          if (-not $env:GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL) {
            Write-Host "Autofind download URL not configured, skipping."
            exit 0
          }
          Write-Host "Starting background download of Autofind..."

          # Download and extract in background, then move to copilot-developer-action-main
          $workDir = "${{ runner.temp }}"
          $job = Start-Job -ScriptBlock {
            param($url, $dir)
            Set-Location $dir
            $logFile = "runtime-logs\download-autofind.log"
            $startTime = Get-Date
            "Starting Autofind download at $startTime" | Out-File -FilePath $logFile
            try {
              Invoke-WebRequest -Uri $url -OutFile "autofind.tar.gz" -ErrorAction Stop
              tar -zxf autofind.tar.gz 2>&1 | Out-File -FilePath $logFile -Append
              Remove-Item autofind.tar.gz
              Move-Item -Path "autofind" -Destination "copilot-developer-action-main/"
              $endTime = Get-Date
              $elapsed = ($endTime - $startTime).TotalSeconds
              "Autofind download completed in ${elapsed}s" | Out-File -FilePath $logFile -Append
            } catch {
              $_ | Out-File -FilePath $logFile -Append
            }
          } -ArgumentList $env:GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL, $workDir
        env:
          GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL: ${{ secrets.GITHUB_COPILOT_AUTOFIND_DOWNLOAD_URL }}
      <<- end>>

      # Start mkcert CA key generation in the background so it overlaps with the
      # MCP-server startup step below. launch.sh should check for existing CA files
      # before running its own mkcert -install, so when the background job wins
      # the race the later call becomes a fast no-op.
      << if and (not .UsePreinstalledRuntime) .BackgroundMkcertKeygen >>
      - name: Generate agent firewall CA (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Linux' }}
        shell: bash
        run: |
          if [ "$COPILOT_AGENT_FIREWALL_ENABLED" != "true" ]; then
            echo "Firewall disabled, skipping mkcert CA pre-generation."
            exit 0
          fi
          MKCERT_BIN="${{ runner.temp }}/copilot-developer-action-main/ebpf/in-path/mkcert"
          MKCERT_CA_DST="${{ runner.temp }}/runtime-logs/mkcert"
          if [ ! -f "$MKCERT_BIN" ]; then
            echo "mkcert binary not found, skipping background keygen."
            exit 0
          fi
          if [ -f "$MKCERT_CA_DST/rootCA.pem" ]; then
            echo "CA already exists, skipping background keygen."
            exit 0
          fi
          mkdir -p "$MKCERT_CA_DST"
          echo "Starting mkcert CA keygen in background..."
          # Use setsid to fully detach from the Actions runner so the step
          # finishes immediately instead of waiting for the background process.
          MKCERT_LOCK="${{ runner.temp }}/mkcert-install.lock"
          setsid bash -c 'flock "$1" bash -c "CAROOT=\"$2\" \"$3\" -install && touch \"$2/.mkcert-bg-done\""' \
            _ "$MKCERT_LOCK" "$MKCERT_CA_DST" "$MKCERT_BIN" > /dev/null 2>&1 &
        env:
          << if .UseMaterializedFirewall >>
          COPILOT_AGENT_FIREWALL_ENABLED: "<< .MaterializedFirewallEnabled >>"
          << else >>
          COPILOT_AGENT_FIREWALL_ENABLED: "${{ vars.COPILOT_AGENT_FIREWALL_ENABLED || << .AgentFirewallEnabledDefault >> }}"
          << end >>
      << end >>

      << if eq .MCPEnabled true >>
      - name: Start MCP Servers (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Linux' }}
        working-directory: ${{ runner.temp }}
        run: |
          echo "Starting MCP servers..." && \
          export HOME="$(realpath ~)"
          export RUNNER_PATH="${{ runner.temp }}"

          # Secrets listed here are piped via stdin so they never appear in /proc
          secrets=$("$RUNNER_PATH/ghcca-node/node/bin/node" -p "JSON.stringify({
            GITHUB_COPILOT_GITHUB_TOKEN: process.env.GITHUB_COPILOT_GITHUB_TOKEN || '',
            GITHUB_PERSONAL_ACCESS_TOKEN: process.env.GITHUB_PERSONAL_ACCESS_TOKEN || '',
            GITHUB_COPILOT_API_TOKEN: process.env.GITHUB_COPILOT_API_TOKEN || '',
