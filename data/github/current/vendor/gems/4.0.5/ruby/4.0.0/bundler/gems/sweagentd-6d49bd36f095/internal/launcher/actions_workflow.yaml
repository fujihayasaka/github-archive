            COPILOT_JOB_NONCE: process.env.COPILOT_JOB_NONCE || ''
          })")
          unset GITHUB_COPILOT_GITHUB_TOKEN GITHUB_PERSONAL_ACCESS_TOKEN GITHUB_COPILOT_API_TOKEN GITHUB_COPILOT_INTEGRATION_ID COPILOT_JOB_NONCE
          printf '%s' "$secrets" | "$RUNNER_PATH/copilot-developer-action-main/script/start-mcp-servers.sh"

          echo "Ending MCP step"
        env:
          # NOTE: Before adding any new environment variables here, be sure to consider whether it is safe for bash / PowerShell or MCP servers
          # to get the variable. You should add any variables that should be filtered out to the following runtime file:
          # https://github.com/github/copilot-agent-runtime/blob/bd0245b74d550923ad9822ef6a1e3f51308915a7/src/settings/environment-settings.ts#L10-L58
          #
          # DO NOT ADD NEW SECRETS WITHOUT ASSURING THEY ARE ADDED ABOVE OTHERWISE THEY COULD LEAK
          #
          BLACKBIRD_MODE: "<< .BlackbirdMode >>"
          COPILOT_MCP_READ_ONLY_MODE: << .MCPReadOnlyMode >>
          COPILOT_API_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_API_URL }}"
          GITHUB_COPILOT_GITHUB_TOKEN: "${{ secrets.GITHUB_COPILOT_GITHUB_TOKEN }}"
          GITHUB_PERSONAL_ACCESS_TOKEN: "${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.<< .TokenSecretNames.MCP >> }}"
          GITHUB_COPILOT_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          GITHUB_COPILOT_3P_MCP_ENABLED: << .MCP3PEnabled >>
          COPILOT_AGENT_MCP_SERVER_TEMP: "${{ runner.temp }}/mcp-server"
          GITHUB_COPILOT_MCP_JSON_FROM_INPUT: "${{ github.event.inputs.GITHUB_COPILOT_MCP_JSON }}"
          GITHUB_COPILOT_REMOTE_MCP_ENABLED: << .McpRemoteEnabled >>
          GITHUB_COPILOT_INTERACTION_ID: "${{ github.event.inputs.GITHUB_COPILOT_INTERACTION_ID }}"
          COPILOT_FEATURE_FLAGS: "<< .FeatureFlags >>"
          COPILOT_EXPERIMENTS: "<< .Experiments >>"
          COPILOT_EXPERIMENT_ASSIGNMENT_CONTEXT: "<< .ExperimentAssignmentContext >>"
          GITHUB_COPILOT_INTEGRATION_ID: "${{ secrets.GITHUB_COPILOT_INTEGRATION_ID }}"
          COPILOT_USE_SESSIONS: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_USE_SESSIONS }}"
          COPILOT_USE_ASYNC_SESSIONS: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_USE_ASYNC_SESSIONS }}"
          COPILOT_MCP_EMIT_PENDING_SETUP_LOGS: '<< if eq .RuntimeEntryPoint "dist-cca-v3/index.js" >>false<< else >>true<< end >>'
          COPILOT_AGENT_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_SESSION_ID }}"
          COPILOT_AGENT_RESUME_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RESUME_SESSION_ID }}"
          # Path that MCP servers can place debug logs that are then uploaded as an artifact at the end of the run
          COPILOT_AGENT_MCP_DEBUG_LOGS_PATH: "${{ runner.temp }}/cca-mcp-debug-logs"
          # Required for telemetry
          COPILOT_AGENT_CALLBACK_URL: "<< .URLs.AgentCallbackURL >>"
          COPILOT_AGENT_JOB_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_JOB_ID }}"
          COPILOT_JOB_NONCE: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_JOB_NONCE }}"
          GITHUB_REPOSITORY_ID: "${{ github.repository_id }}"
          GITHUB_REPOSITORY_OWNER_ID: "${{ github.repository_owner_id }}"
          COPILOT_AGENT_INJECTED_SECRET_NAMES: "<< .InjectedSecretNames >>"
          << if .IsDevelopmentEnvironment >>
          GITHUB_MCP_URL_OVERRIDE: "<< .URLs.GitHubMCPURLOverride >>"
          << end >>
        <<- range .MCPSecrets>>
          <<.>>: ${{ secrets.<<.>> }}
        <<- end>>
        <<- range .MCPVariables>>
          <<.>>: ${{ vars.<<.>> }}
        <<- end>>

      - name: Start MCP Servers (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Windows' }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Write-Host "Starting MCP servers..."
          $env:HOME = (Resolve-Path ~).Path
          $env:RUNNER_PATH = "${{ runner.temp }}"

          if (Test-Path "$env:RUNNER_PATH\copilot-developer-action-main\script\start-mcp-servers.ps1") {
            & "$env:RUNNER_PATH\copilot-developer-action-main\script\start-mcp-servers.ps1"
            if ($LASTEXITCODE -ne 0) { throw "MCP servers startup script failed with exit code $LASTEXITCODE" }
          } else {
            throw "start-mcp-servers.ps1 not found. The runtime package may be corrupted or incompatible with Windows runners."
          }

          Write-Host "Ending MCP step"
        env:
          # NOTE: Before adding any new environment variables here, be sure to consider whether it is safe for bash / PowerShell or MCP servers
          # to get the variable. You should add any variables that should be filtered out to the following runtime file:
          # https://github.com/github/copilot-agent-runtime/blob/bd0245b74d550923ad9822ef6a1e3f51308915a7/src/settings/environment-settings.ts#L10-L58
          #
          # DO NOT ADD NEW SECRETS WITHOUT ASSURING THEY ARE ADDED ABOVE OTHERWISE THEY COULD LEAK
          #
          BLACKBIRD_MODE: "<< .BlackbirdMode >>"
          COPILOT_MCP_READ_ONLY_MODE: << .MCPReadOnlyMode >>
          COPILOT_API_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_API_URL }}"
          GITHUB_COPILOT_GITHUB_TOKEN: "${{ secrets.GITHUB_COPILOT_GITHUB_TOKEN }}"
          GITHUB_PERSONAL_ACCESS_TOKEN: "${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.<< .TokenSecretNames.MCP >> }}"
          GITHUB_COPILOT_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          GITHUB_COPILOT_3P_MCP_ENABLED: << .MCP3PEnabled >>
          COPILOT_AGENT_MCP_SERVER_TEMP: "${{ runner.temp }}/mcp-server"
          GITHUB_COPILOT_MCP_JSON_FROM_INPUT: "${{ github.event.inputs.GITHUB_COPILOT_MCP_JSON }}"
          GITHUB_COPILOT_REMOTE_MCP_ENABLED: << .McpRemoteEnabled >>
          GITHUB_COPILOT_INTERACTION_ID: "${{ github.event.inputs.GITHUB_COPILOT_INTERACTION_ID }}"
          COPILOT_FEATURE_FLAGS: "<< .FeatureFlags >>"
          COPILOT_EXPERIMENTS: "<< .Experiments >>"
          COPILOT_EXPERIMENT_ASSIGNMENT_CONTEXT: "<< .ExperimentAssignmentContext >>"
          GITHUB_COPILOT_INTEGRATION_ID: "${{ secrets.GITHUB_COPILOT_INTEGRATION_ID }}"
          COPILOT_USE_SESSIONS: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_USE_SESSIONS }}"
          COPILOT_USE_ASYNC_SESSIONS: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_USE_ASYNC_SESSIONS }}"
          COPILOT_MCP_EMIT_PENDING_SETUP_LOGS: '<< if eq .RuntimeEntryPoint "dist-cca-v3/index.js" >>false<< else >>true<< end >>'
          COPILOT_AGENT_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_SESSION_ID }}"
          COPILOT_AGENT_RESUME_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RESUME_SESSION_ID }}"
          # Path that MCP servers can place debug logs that are then uploaded as an artifact at the end of the run
          COPILOT_AGENT_MCP_DEBUG_LOGS_PATH: "${{ runner.temp }}/cca-mcp-debug-logs"
          # Required for telemetry
          COPILOT_AGENT_CALLBACK_URL: "<< .URLs.AgentCallbackURL >>"
          COPILOT_AGENT_JOB_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_JOB_ID }}"
          COPILOT_JOB_NONCE: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_JOB_NONCE }}"
          GITHUB_REPOSITORY_ID: "${{ github.repository_id }}"
          GITHUB_REPOSITORY_OWNER_ID: "${{ github.repository_owner_id }}"
          COPILOT_AGENT_INJECTED_SECRET_NAMES: "<< .InjectedSecretNames >>"
          << if .IsDevelopmentEnvironment >>
          GITHUB_MCP_URL_OVERRIDE: "<< .URLs.GitHubMCPURLOverride >>"
          << end >>

        <<- range .MCPSecrets>>
          <<.>>: ${{ secrets.<<.>> }}
        <<- end>>
        <<- range .MCPVariables>>
          <<.>>: ${{ vars.<<.>> }}
        <<- end>>
      << end >>

      << if .RuntimeSetup >>
      - name: Setup Agent (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Linux' }}
        working-directory: ${{ runner.temp }}
        run: |
          echo "Setting up the agent..."
          npm config get prefix
          << .RuntimeSetup >>

      - name: Setup Agent (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Windows' }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          Write-Host "Setting up the agent..."
          npm config get prefix
          << .RuntimeSetup >>
      << end >>

      << if .UsePreinstalledRuntime >>
      # Pre-seed mkcert CA from custom image to skip RSA keygen during firewall init.
      # launch.sh expects CA files at $RUNNER_TEMP/runtime-logs/mkcert/. If they exist,
      # mkcert -install just adds them to the trust store (~100ms) instead of generating
      # new RSA-3072 keys (3-23s depending on VM entropy).
      - name: Pre-seed mkcert CA (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && runner.os == 'Linux' && env.COPILOT_PREINSTALLED_RUNTIME == 'true' }}
        run: |
          MKCERT_CA_SRC="/opt/copilot-runtime/mkcert-ca"
          MKCERT_CA_DST="${{ runner.temp }}/runtime-logs/mkcert"
          if [ -f "$MKCERT_CA_SRC/rootCA.pem" ] && [ -f "$MKCERT_CA_SRC/rootCA-key.pem" ]; then
            mkdir -p "$MKCERT_CA_DST"
            ln -sf "$MKCERT_CA_SRC/rootCA.pem" "$MKCERT_CA_DST/rootCA.pem"
            ln -sf "$MKCERT_CA_SRC/rootCA-key.pem" "$MKCERT_CA_DST/rootCA-key.pem"
            echo "Pre-seeded mkcert CA from custom image."
          else
            echo "No pre-generated mkcert CA found, keygen will happen at launch time."
          fi
      << end >>

      << if not .EngineEnabled >>
      - name: Processing Request (Linux)
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Linux' }}
        run:  |
          set -euo pipefail
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'git-credentials-*.config' -print -delete

          # Generate a unique token and stop processing workflow commands to prevent the runtime from injecting commands
          STOP_TOKEN=$(cat /proc/sys/kernel/random/uuid)

          # Use a trap to ensure we always resume command processing and check for
          # fallback error annotations, even if the runtime exits with a non-zero code
          # (which would otherwise cause set -e to abort the shell before we get here).
          # The trap preserves the original exit code.
          copilot_cleanup() {
            echo "::$STOP_TOKEN::"
            FALLBACK_FILE="${RUNNER_TEMP}/copilot-fallback-error.txt"
            if [ -f "$FALLBACK_FILE" ]; then
              FALLBACK_MSG=$(head -c 500 "$FALLBACK_FILE" | tr -d '\n\r')
              echo "::error title=Copilot Error::${FALLBACK_MSG}"
              rm -f "$FALLBACK_FILE"
            fi
          }
          trap copilot_cleanup EXIT

          echo "::stop-commands::$STOP_TOKEN"

          # Secrets listed here are piped via stdin so they never appear in /proc
          secrets=$("${{ runner.temp }}/ghcca-node/node/bin/node" -p "JSON.stringify({
            GITHUB_TOKEN: process.env.GITHUB_TOKEN || '',
            GITHUB_COPILOT_GITHUB_TOKEN: process.env.GITHUB_COPILOT_GITHUB_TOKEN || '',
            GITHUB_COPILOT_API_TOKEN: process.env.GITHUB_COPILOT_API_TOKEN || '',
            GITHUB_COPILOT_INTEGRATION_ID: process.env.GITHUB_COPILOT_INTEGRATION_ID || '',
            COPILOT_INTEGRATION_ID_OVERRIDE: process.env.COPILOT_INTEGRATION_ID_OVERRIDE || '',
            CAPI_HMAC_KEY_OVERRIDE: process.env.CAPI_HMAC_KEY_OVERRIDE || '',
            COPILOT_JOB_NONCE: process.env.COPILOT_JOB_NONCE || ''
          })")
          unset GITHUB_TOKEN GITHUB_COPILOT_GITHUB_TOKEN GITHUB_COPILOT_API_TOKEN GITHUB_COPILOT_INTEGRATION_ID COPILOT_INTEGRATION_ID_OVERRIDE CAPI_HMAC_KEY_OVERRIDE COPILOT_JOB_NONCE

          echo "Processing requests..." && \
          printf '%s' "$secrets" | \
          "${{ runner.temp }}/copilot-developer-action-main/ebpf/launch.sh" \
            "${{ runner.temp }}/ghcca-node/node/bin/node --enable-source-maps ${{ runner.temp }}/copilot-developer-action-main/<< .RuntimeEntryPoint >>" \
            "${{ runner.temp }}/runtime-logs" \
            "false"
        env:
          # NOTE: Before adding any new environment variables here, be sure to consider whether it is safe for bash / PowerShell or MCP servers
          # to get the variable. You should add any variables that should be filtered out to the following runtime file:
          # https://github.com/github/copilot-agent-runtime/blob/bd0245b74d550923ad9822ef6a1e3f51308915a7/src/settings/environment-settings.ts#L10-L58
          #
          # DO NOT ADD NEW SECRETS WITHOUT ASSURING THEY ARE ADDED ABOVE OTHERWISE THEY COULD LEAK
          #
          # These are values that GitHub itself injects and should always be in the form GITHUB_*. Nothing else can use the GITHUB_ prefix
          GITHUB_TOKEN: "${{ secrets.GITHUB_COPILOT_GIT_TOKEN }}"
          # TODO (chuxel): Remove conditional once ff rolled out
          << if ne .TokenSecretNames.Shell "" >>
          GITHUB_COPILOT_GITHUB_TOKEN: "${{ secrets.<< .TokenSecretNames.Shell >> }}"
          << end >>
          GITHUB_COPILOT_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          GITHUB_COPILOT_INTEGRATION_ID: "${{ secrets.GITHUB_COPILOT_INTEGRATION_ID }}"
          # These are user configurable settings that should be something that can be set at the org or repo level.
          # They should generally be COPILOT_* or COPILOT_AGENT_* (for Padawan) specific items, but don't end in _OVERRIDE.
          << if .UseMaterializedFirewall >>
          COPILOT_AGENT_FIREWALL_ENABLED: "<< .MaterializedFirewallEnabled >>"
          COPILOT_AGENT_FIREWALL_RULESET_ALLOW_LIST: "<< .AgentFirewallRuleSetAllowListDefault >>"
          COPILOT_AGENT_FIREWALL_ENABLE_RULESET_ALLOW_LIST: "<< .MaterializedFirewallUseDefaultRules >>"
          COPILOT_AGENT_FIREWALL_ALLOW_LIST: "<< .AgentFirewallRequiredAllowList >>,<< .MaterializedFirewallAllowedRules >>,${{ github.server_url }}"
          << else >>
          COPILOT_AGENT_FIREWALL_ENABLED: "${{ vars.COPILOT_AGENT_FIREWALL_ENABLED || << .AgentFirewallEnabledDefault >> }}"
          COPILOT_AGENT_FIREWALL_RULESET_ALLOW_LIST: "${{ vars.COPILOT_AGENT_FIREWALL_RULE_SET_ALLOW_LIST || '<< .AgentFirewallRuleSetAllowListDefault >>' }}"
          COPILOT_AGENT_FIREWALL_ENABLE_RULESET_ALLOW_LIST: "${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST == '' && 'true' || 'false' }}"
          COPILOT_AGENT_FIREWALL_ALLOW_LIST: "<< .AgentFirewallRequiredAllowList >>,${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST }},${{ github.server_url }},${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS }}"
          << end >>
          << if and (not .UsePreinstalledRuntime) .BackgroundMkcertKeygen >>
          COPILOT_AGENT_BACKGROUND_MKCERT: "true"
          << end >>
          COPILOT_AGENT_SOURCE_ENVIRONMENT: "<< .Environment >>"
          GITHUB_UPLOADS_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).GITHUB_UPLOADS_URL }}"
          GITHUB_DOWNLOADS_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).GITHUB_DOWNLOADS_URL }}"
          SECRET_SCANNING_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).SECRET_SCANNING_URL }}"
          COPILOT_AGENT_RUNTIME_VERSION: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RUNTIME_VERSION }}"
          COPILOT_AGENT_DEBUG: "${{ (vars.COPILOT_AGENT_DEBUG == 'true' || ( vars.COPILOT_AGENT_DEBUG != 'true' && vars.COPILOT_AGENT_DEBUG != 'false' && '<< .AgentDebug >>' == 'true' )) && true || false }}"
          # Only injected if cfg.IsDevelopment() is true. Secrets/vars should generally be in the form of COPILOT_*_OVERRIDE to distinguish them.
          << if .IsDevelopmentEnvironment >>
          COPILOT_INTEGRATION_ID_OVERRIDE: "${{ secrets.COPILOT_INTEGRATION_ID_OVERRIDE }}"
          CAPI_HMAC_KEY_OVERRIDE: "${{ secrets.CAPI_HMAC_KEY_OVERRIDE }}"
          GITHUB_MCP_URL_OVERRIDE: "<< .URLs.GitHubMCPURLOverride >>"
          << end >>
          # This variable controls whether the runtime runs in "MCP mode" or not. Basically whether it looks for `mcp-config.json` to register MCP tools
          COPILOT_MCP_ENABLED: << .MCPEnabled >>
          COPILOT_MCP_READ_ONLY_MODE: << .MCPReadOnlyMode >>
          COPILOT_AGENT_MCP_SERVER_TEMP: "${{ runner.temp }}/mcp-server"
          # This variable determines how and whether blackbird is used by the agent.
          BLACKBIRD_MODE: "<< .BlackbirdMode >>"
          COPILOT_AGENT_INJECTED_SECRET_NAMES: "<< .InjectedSecretNames >>"
          # variables that control online evaluation. The trajectory file is needed for this feature to work.
          CPD_SAVE_TRAJECTORY_OUTPUT: ${{ runner.temp }}/copilot-developer-action-main/dist/trajectory.md
          COPILOT_AGENT_ONLINE_EVALUATION_DISABLED: "<< .AgentOnlineEvaluationDisabled >>"
          COPILOT_FEATURE_FLAGS: "<< .FeatureFlags >>"
          COPILOT_EXPERIMENTS: "<< .Experiments >>"
          COPILOT_EXPERIMENT_ASSIGNMENT_CONTEXT: "<< .ExperimentAssignmentContext >>"
          << if .CopilotTraceParent >>
          COPILOT_TRACE_PARENT: "<< .CopilotTraceParent >>"
          << end >>
          # These are used by launch.sh to log firewall setup progress to the session logs
          COPILOT_API_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_API_URL }}"
          COPILOT_AGENT_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_SESSION_ID }}"
          COPILOT_AGENT_RESUME_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RESUME_SESSION_ID }}"
          # This final section is secrets and variables that can only be set in an Actions "copilot" environment and are passed through. Be
          # sure to add values above this section to workflowDirectlyReferencedVarNames list in actions.go to so they are not injected twice.
        <<- range .Secrets>>
          <<.>>: ${{ secrets.<<.>> }}
        <<- end>>
        <<- range .Variables>>
          <<.>>: ${{ vars.<<.>> }}
        <<- end>>

      - name: Processing Request (Windows)
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Windows' }}
        shell: pwsh
        run:  |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter 'git-credentials-*.config' |
            ForEach-Object {
              Write-Host $_.FullName
              Remove-Item -LiteralPath $_.FullName -Force
            }

          # Generate a unique token and stop processing workflow commands to prevent the runtime from injecting commands
          $stopToken = [guid]::NewGuid().ToString()
          Write-Host "::stop-commands::$stopToken"

          try {
            Write-Host "Processing requests..."
            # Note: eBPF is not available on Windows, running node directly
            $nodePath = "${{ runner.temp }}\ghcca-node\node\bin\node.exe"
            if (-not (Test-Path $nodePath)) {
              $nodePath = "${{ runner.temp }}\ghcca-node\node\node.exe"
              if (-not (Test-Path $nodePath)) {
                throw "Node.js executable not found in expected locations: ${{ runner.temp }}\ghcca-node\node\bin\node.exe or ${{ runner.temp }}\ghcca-node\node\node.exe"
              }
            }
            & $nodePath --enable-source-maps "${{ runner.temp }}\copilot-developer-action-main\<< .RuntimeEntryPoint >>"
          } finally {
            # Resume processing workflow commands
            Write-Host "::${stopToken}::"

            # Emit fallback error annotation if the runtime wrote one
            $fallbackFile = Join-Path $env:RUNNER_TEMP "copilot-fallback-error.txt"
            if (Test-Path $fallbackFile) {
              $fallbackMsg = (Get-Content $fallbackFile -Raw -ErrorAction SilentlyContinue) -replace '[\r\n]+', ' '
              if ($fallbackMsg.Length -gt 500) { $fallbackMsg = $fallbackMsg.Substring(0, 500) }
              Write-Host "::error title=Copilot Error::$fallbackMsg"
              Remove-Item $fallbackFile -Force -ErrorAction SilentlyContinue
            }
          }
        env:
          # NOTE: Before adding any new environment variables here, be sure to consider whether it is safe for bash / PowerShell or MCP servers
          # to get the variable. You should add any variables that should be filtered out to the following runtime file:
          # https://github.com/github/copilot-agent-runtime/blob/bd0245b74d550923ad9822ef6a1e3f51308915a7/src/settings/environment-settings.ts#L10-L58
          #
          # DO NOT ADD NEW SECRETS WITHOUT ASSURING THEY ARE ADDED ABOVE OTHERWISE THEY COULD LEAK
          #
          # These are values that GitHub itself injects and should always be in the form GITHUB_*. Nothing else can use the GITHUB_ prefix
          GITHUB_TOKEN: "${{ secrets.GITHUB_COPILOT_GIT_TOKEN }}"
          # TODO: Remove conditional once ff rolled out
          << if ne .TokenSecretNames.Shell "" >>
          GITHUB_COPILOT_GITHUB_TOKEN: "${{ secrets.<< .TokenSecretNames.Shell >> }}"
          << end >>
          GITHUB_COPILOT_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          GITHUB_COPILOT_INTEGRATION_ID: "${{ secrets.GITHUB_COPILOT_INTEGRATION_ID }}"
          # Required for remote MCP (HTTP-based) GitHub API calls on Windows
          GITHUB_PERSONAL_ACCESS_TOKEN: "${{ secrets.COPILOT_MCP_GITHUB_PERSONAL_ACCESS_TOKEN || secrets.<< .TokenSecretNames.MCP >> }}"
          # These are user configurable settings that should be something that can be set at the org or repo level.
          # They should generally be COPILOT_* or COPILOT_AGENT_* (for Padawan) specific items, but don't end in _OVERRIDE.
          << if .UseMaterializedFirewall >>
          COPILOT_AGENT_FIREWALL_ENABLED: "<< .MaterializedFirewallEnabled >>"
          COPILOT_AGENT_FIREWALL_RULESET_ALLOW_LIST: "<< .AgentFirewallRuleSetAllowListDefault >>"
          COPILOT_AGENT_FIREWALL_ENABLE_RULESET_ALLOW_LIST: "<< .MaterializedFirewallUseDefaultRules >>"
          COPILOT_AGENT_FIREWALL_ALLOW_LIST: "<< .AgentFirewallRequiredAllowList >>,<< .MaterializedFirewallAllowedRules >>,${{ github.server_url }}"
          << else >>
          COPILOT_AGENT_FIREWALL_ENABLED: "${{ vars.COPILOT_AGENT_FIREWALL_ENABLED || << .AgentFirewallEnabledDefault >> }}"
          COPILOT_AGENT_FIREWALL_RULESET_ALLOW_LIST: "${{ vars.COPILOT_AGENT_FIREWALL_RULE_SET_ALLOW_LIST || '<< .AgentFirewallRuleSetAllowListDefault >>' }}"
          COPILOT_AGENT_FIREWALL_ENABLE_RULESET_ALLOW_LIST: "${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST == '' && 'true' || 'false' }}"
          COPILOT_AGENT_FIREWALL_ALLOW_LIST: "<< .AgentFirewallRequiredAllowList >>,${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST }},${{ github.server_url }},${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS }}"
          << end >>
          COPILOT_AGENT_SOURCE_ENVIRONMENT: "<< .Environment >>"
          GITHUB_UPLOADS_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).GITHUB_UPLOADS_URL }}"
          GITHUB_DOWNLOADS_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).GITHUB_DOWNLOADS_URL }}"
          COPILOT_AGENT_RUNTIME_VERSION: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RUNTIME_VERSION }}"
          COPILOT_AGENT_RESUME_SESSION_ID: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_AGENT_RESUME_SESSION_ID }}"
          COPILOT_AGENT_DEBUG: "${{ (vars.COPILOT_AGENT_DEBUG == 'true' || ( vars.COPILOT_AGENT_DEBUG != 'true' && vars.COPILOT_AGENT_DEBUG != 'false' && '<< .AgentDebug >>' == 'true' )) && true || false }}"
          # Only injected if cfg.IsDevelopment() is true. Secrets/vars should generally be in the form of COPILOT_*_OVERRIDE to distinguish them.
          << if .IsDevelopmentEnvironment >>
          COPILOT_INTEGRATION_ID_OVERRIDE: "${{ secrets.COPILOT_INTEGRATION_ID_OVERRIDE }}"
          CAPI_HMAC_KEY_OVERRIDE: "${{ secrets.CAPI_HMAC_KEY_OVERRIDE }}"
          GITHUB_MCP_URL_OVERRIDE: "<< .URLs.GitHubMCPURLOverride >>"
          << end >>
          # This variable controls whether the runtime runs in "MCP mode" or not. Basically whether it looks for `mcp-config.json` to register MCP tools
          COPILOT_MCP_ENABLED: << .MCPEnabled >>
          COPILOT_MCP_READ_ONLY_MODE: << .MCPReadOnlyMode >>
          COPILOT_AGENT_MCP_SERVER_TEMP: "${{ runner.temp }}/mcp-server"
          # This variable controls whether the runtime uses remote MCP (HTTP-based) instead of local binary.
          # Required for Windows since the local github-mcp-server binary is not available for Windows.
          GITHUB_COPILOT_REMOTE_MCP_ENABLED: << .McpRemoteEnabled >>
          # This variable determines how and whether blackbird is used by the agent.
          BLACKBIRD_MODE: "<< .BlackbirdMode >>"
          COPILOT_AGENT_INJECTED_SECRET_NAMES: "<< .InjectedSecretNames >>"
          # variables that control online evaluation. The trajectory file is needed for this feature to work.
          CPD_SAVE_TRAJECTORY_OUTPUT: ${{ runner.temp }}/copilot-developer-action-main/dist/trajectory.md
          COPILOT_AGENT_ONLINE_EVALUATION_DISABLED: "<< .AgentOnlineEvaluationDisabled >>"
          COPILOT_FEATURE_FLAGS: "<< .FeatureFlags >>"
          COPILOT_EXPERIMENTS: "<< .Experiments >>"
          COPILOT_EXPERIMENT_ASSIGNMENT_CONTEXT: "<< .ExperimentAssignmentContext >>"
          << if .CopilotTraceParent >>
          COPILOT_TRACE_PARENT: "<< .CopilotTraceParent >>"
          << end >>
          # This final section is secrets and variables that can only be set in an Actions "copilot" environment and are passed through. Be
          # sure to add values above this section to workflowDirectlyReferencedVarNames list in actions.go to so they are not injected twice.
        <<- range .Secrets>>
          <<.>>: ${{ secrets.<<.>> }}
        <<- end>>
        <<- range .Variables>>
          <<.>>: ${{ vars.<<.>> }}
        <<- end>>

      << end >>
      << if .EngineEnabled >>
      - name: Download and Run Engine
        if: ${{ env.SHOULD_CONTINUE == 'true' && (success() || !cancelled()) && runner.os == 'Linux' }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail

          # Download the engine
          echo "Downloading engine from << .EngineRepoNWO >>..."
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -D "runtime-logs/download-engine.log" "<< .EngineDownloadURL >>" 2>> "runtime-logs/download-engine.log" | tar -zxv >> "runtime-logs/download-engine.log" 2>&1; then
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Download attempt $RETRY_COUNT of $MAX_RETRIES failed, retrying..."
            sleep 1
          done
          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "ERROR: Failed to download engine after $MAX_RETRIES attempts"
            exit 1
          fi
          ENGINE_DIR=$(find . -maxdepth 1 -type d -name "$(echo '<< .EngineRepoNWO >>' | cut -d/ -f2)-*" | head -1)
          if [ -n "$ENGINE_DIR" ] && [ ! -d "engine" ]; then mv "$ENGINE_DIR" engine; fi
          echo "Engine downloaded and extracted to engine/"

          # Parse the engine's entrypoint from engine.yaml
          ENGINE_ENTRYPOINT=$(awk -F': *' '/^entrypoint:/ {print $2; exit}' engine/engine.yaml | tr -d "'\"")
          if [ -z "$ENGINE_ENTRYPOINT" ]; then
            echo "ERROR: Could not determine engine entrypoint from engine.yaml"
            exit 1
          fi
          # Resolve the entrypoint relative to the engine directory
          ENGINE_PREFIX="${{ runner.temp }}/engine/"
          ENGINE_CMD=$(echo "$ENGINE_ENTRYPOINT" | sed "s|[^ ]*$|${ENGINE_PREFIX}&|")
          echo "Engine command: $ENGINE_CMD"

          # Clean up credentials and run the engine wrapped in the eBPF firewall
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'git-credentials-*.config' -print -delete
          STOP_TOKEN=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$STOP_TOKEN"

          echo "Processing requests (engine mode)..." && \
          "${{ runner.temp }}/copilot-developer-action-main/ebpf/launch.sh" \
            "$ENGINE_CMD" \
            "${{ runner.temp }}/runtime-logs" \
            "false"

          echo "::$STOP_TOKEN::"
        env:
          GITHUB_COPILOT_INTEGRATION_ID: "${{ secrets.GITHUB_COPILOT_INTEGRATION_ID }}"
          GITHUB_GIT_TOKEN: "${{ secrets.GITHUB_COPILOT_GIT_TOKEN }}"
          GITHUB_JOB_ID: "<< .JobID >>"
          GITHUB_JOB_NONCE: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_JOB_NONCE }}"
          GITHUB_PLATFORM_API_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          GITHUB_PLATFORM_API_URL: "<< .URLs.AgentCallbackURL >>"
          GITHUB_INFERENCE_TOKEN: "${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
          GITHUB_INFERENCE_URL: "${{ fromJSON(github.event.inputs.COPILOT_AGENT_INPUTS).COPILOT_API_URL }}"
          # Firewall settings
          << if .UseMaterializedFirewall >>
          COPILOT_AGENT_FIREWALL_ENABLED: "<< .MaterializedFirewallEnabled >>"
          COPILOT_AGENT_FIREWALL_RULESET_ALLOW_LIST: "<< .AgentFirewallRuleSetAllowListDefault >>"
          COPILOT_AGENT_FIREWALL_ENABLE_RULESET_ALLOW_LIST: "<< .MaterializedFirewallUseDefaultRules >>"
          COPILOT_AGENT_FIREWALL_ALLOW_LIST: "<< .AgentFirewallRequiredAllowList >>,<< .MaterializedFirewallAllowedRules >>,${{ github.server_url }}"
          << else >>
          COPILOT_AGENT_FIREWALL_ENABLED: "${{ vars.COPILOT_AGENT_FIREWALL_ENABLED || << .AgentFirewallEnabledDefault >> }}"
          COPILOT_AGENT_FIREWALL_RULESET_ALLOW_LIST: "${{ vars.COPILOT_AGENT_FIREWALL_RULE_SET_ALLOW_LIST || '<< .AgentFirewallRuleSetAllowListDefault >>' }}"
          COPILOT_AGENT_FIREWALL_ENABLE_RULESET_ALLOW_LIST: "${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST == '' && 'true' || 'false' }}"
          COPILOT_AGENT_FIREWALL_ALLOW_LIST: "<< .AgentFirewallRequiredAllowList >>,${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST }},${{ github.server_url }},${{ vars.COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS }}"
          << end >>
          COPILOT_AGENT_SOURCE_ENVIRONMENT: "<< .Environment >>"
      << end >>

      << if .UsePreinstalledRuntime >>
      # Remove pre-generated mkcert CA files and pre-seeded runner temp links after use.
      - name: Clean up mkcert CA (Linux)
        if: always() && runner.os == 'Linux' && env.COPILOT_PREINSTALLED_RUNTIME == 'true'
        run: |
          rm -rf "${{ runner.temp }}/runtime-logs/mkcert" 2>/dev/null || true
          rm -rf /opt/copilot-runtime/mkcert-ca/ 2>/dev/null || true
      << end >>

      # This step ensures that tokens are cleaned up even if the runtime bombs and logs situations where a job is in a non-terminal state
      - name: Clean Up (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          echo "Cleaning up..." && \
          mkdir -p "${{ runner.temp }}/runtime-logs" && \
          curl -L -H "Content-Type: application/json" -H "Accept: application/json" --data '{"oid":'$GITHUB_REPOSITORY_OWNER_ID',"rid":'$GITHUB_REPOSITORY_ID',"wid":'$GITHUB_RUN_ID'}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_COPILOT_API_TOKEN }}" -H "X-GitHub-Copilot-Cleanup-List: ${{ secrets.GITHUB_COPILOT_API_TOKEN }},${{ secrets.GITHUB_COPILOT_GIT_TOKEN }},${{ secrets.GITHUB_COPILOT_GITHUB_TOKEN }}" \
            "<< .URLs.AgentCallbackURL >>/cleanup" > "${{ runner.temp }}/runtime-logs/clean.log" 2>&1

      - name: Clean Up (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Cleaning up..."
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\runtime-logs" | Out-Null

          $body = @{
            oid = $env:GITHUB_REPOSITORY_OWNER_ID
            rid = $env:GITHUB_REPOSITORY_ID
            wid = $env:GITHUB_RUN_ID
          } | ConvertTo-Json

          $headers = @{
            "Content-Type" = "application/json"
            "Accept" = "application/json"
            "Authorization" = "Bearer ${{ secrets.GITHUB_COPILOT_API_TOKEN }}"
            "X-GitHub-Copilot-Cleanup-List" = "${{ secrets.GITHUB_COPILOT_API_TOKEN }},${{ secrets.GITHUB_COPILOT_GIT_TOKEN }},${{ secrets.GITHUB_COPILOT_GITHUB_TOKEN }}"
          }

          try {
            Invoke-RestMethod -Uri "<< .URLs.AgentCallbackURL >>/cleanup" -Method Post -Body $body -Headers $headers -ContentType "application/json" -ErrorAction Stop | Out-File -FilePath "${{ runner.temp }}\runtime-logs\clean.log"
          } catch {
            $_ | Out-File -FilePath "${{ runner.temp }}\runtime-logs\clean.log"
          }

      - name: "[Optional] Archive Details"
        if: ${{ always() && ((vars.COPILOT_AGENT_DEBUG == 'true' || (vars.COPILOT_AGENT_DEBUG != 'true' && vars.COPILOT_AGENT_DEBUG != 'false' && '<< .AgentDebug >>' == 'true')) && true || false) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs
          path: |
            ${{ runner.temp }}/cca-mcp-debug-logs/*
            ${{ runner.temp }}/mcp-server/mcp-stdout.log
            ${{ runner.temp }}/mcp-server/mcp-stderr.log
            ${{ runner.temp }}/runtime-logs/blocked.jsonl
            ${{ runner.temp }}/runtime-logs/blocked.md
            ${{ runner.temp }}/runtime-logs/fw.jsonl
            ${{ runner.temp }}/runtime-logs/ipv6.log
            ${{ runner.temp }}/runtime-logs/download.log
            ${{ runner.temp }}/runtime-logs/download-autofind.log
            ${{ runner.temp }}/runtime-logs/mkcert.log
            ${{ runner.temp }}/runtime-logs/clean.log
            << if .IsDevelopmentEnvironment >>
            ${{ runner.temp }}/runtime-logs/params.log
            << end >>
            << if or .IsDevelopmentEnvironment .IsStagingEnvironment >>
            ${{ runner.os == 'Linux' && format('{0}/.copilot/logs', env.HOME) || '' }}
            << end >>
