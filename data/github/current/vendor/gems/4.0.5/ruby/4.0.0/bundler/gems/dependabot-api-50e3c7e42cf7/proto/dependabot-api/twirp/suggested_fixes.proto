syntax = "proto3";

package DependabotApi.v1;

import "google/protobuf/timestamp.proto";

service SuggestedFixes {
  // Get suggested dependabot autofix data
  rpc GetSuggestedFix(GetSuggestedFixRequest) returns (GetSuggestedFixResponse) {}

  rpc ApplySuggestedFix(ApplySuggestedFixRequest) returns (ApplySuggestedFixResponse) {}
  
  rpc DismissSuggestedFix(DismissSuggestedFixRequest) returns (DismissSuggestedFixResponse) {}
}

message GetSuggestedFixRequest {
  uint64 autofix_job_id = 1;
  uint64 github_repo_id = 2;
  uint64 github_pull_request_number = 3;
}

message GetSuggestedFixResponse {
  SuggestedFix suggested_fix = 1;
}

message SuggestedFix {
  enum SuggestedFixReviewStatus {
    STATUS_UNREVIEWED = 0;
    STATUS_APPROVED = 1;
    STATUS_DISMISSED = 2;
  }

  uint64 id = 1;
  uint64 autofix_job_id = 2;
  string description = 3;
  repeated SuggestedFixFile files = 4;
  SuggestedFixReviewStatus review_status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated DependencyMetadata dependency_metadata = 8;
}

message SuggestedFixFile {
  string file_path = 1;
  bytes diff_content = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message DependencyMetadata {
  string name = 1;
  string version = 2;
}

message DismissSuggestedFixRequest {
  uint64 autofix_job_id = 1;
  uint64 actor_id = 2;
  string reason = 3;
  uint64 github_repo_id = 4;
  uint64 github_pull_request_number = 5;
}

message DismissSuggestedFixResponse {
  bool success = 1;
}

message ApplySuggestedFixRequest {
  uint64 autofix_job_id = 1;
  uint64 actor_id = 2;
  uint64 github_repo_id = 3;
  uint64 github_pull_request_number = 4;
}

message ApplySuggestedFixResponse {
  bool success = 1;
}