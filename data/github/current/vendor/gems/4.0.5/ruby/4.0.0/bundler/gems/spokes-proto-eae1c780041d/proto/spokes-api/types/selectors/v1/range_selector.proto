syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/treeish.proto";
import "spokes-api/types/v1/path.proto";

// RangeSelector is a selector for selecting a range of objects by their treeish.
message RangeSelector {
    // start is the starting treeish of the range.
    github.spokes.types.v1.Treeish start = 1;

    // end is the ending treeish of the range.
    github.spokes.types.v1.Treeish end = 2;

    // paths is the list of paths which the diff output should be limited to.
    repeated github.spokes.types.v1.Path paths = 3;
}
