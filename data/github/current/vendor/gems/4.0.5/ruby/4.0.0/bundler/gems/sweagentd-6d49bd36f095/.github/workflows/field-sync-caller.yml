name: Slash Command Field Sync

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  sync-fields:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.comment.body, '#') ||
      contains(github.event.comment.body, '**') ||
      contains(github.event.comment.body, '<!-- data') ||
      contains(github.event.issue.body, '#') ||
      contains(github.event.issue.body, '**') ||
      contains(github.event.issue.body, '<!-- data')
    steps:
      - name: Generate GitHub App installation token (fallback)
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: '2241668'
          private-key: ${{ secrets.FIELD_UPDATE_BOT_PRIVATE_KEY }}
          repositories: |
            EPD-Synapse-Feature-Distro
            ${{ github.event.repository.name }}

      - name: Field Sync
        uses: github/EPD-Synapse-Feature-Distro/.github/actions/field-sync@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          fallback_token: ${{ secrets.GITHUB_TOKEN || secrets.ISSUE_FIELDS_TOKEN }}
          comment_body: ${{ github.event.comment.body || github.event.issue.body }}
          issue_number: ${{ github.event.issue.number }}
          repository: ${{ github.repository }}
          repository_owner: ${{ github.repository_owner }}
