syntax = "proto3";

package github.spokes.maintenance.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/maintenance";
option ruby_package = "GitHub::Spokes::Proto::Maintenance::V1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";

// MaintenanceAPI contains APIs for maintenance-related operations.
service MaintenanceAPI {
    // MaintenanceInfo returns maintenance statuses for repository replicas.
    rpc MaintenanceInfo(MaintenanceInfoRequest) returns (MaintenanceInfoResponse);
}

// RepackStatus holds the status of a repack operation.
message RepackStatus {
    // timestamp is the stop timestamp of the repack run.
    google.protobuf.Timestamp timestamp = 1;
    // duration is the duration of the repack run (stop - start).
    google.protobuf.Duration duration = 2;
    // failures is how many failures since the last successful repack run,
    // if no successes then it's the total failures.
    int32 failures = 3;
}

// MaintenanceInfoRequest is a request for maintenance status information.
message MaintenanceInfoRequest {
    // repository is the repository to get maintenance status for.
    github.spokes.types.v1.Repository repository = 1;
    // request_context provides request-level context.
    github.spokes.types.v1.RequestContext request_context = 2;
}

// ReplicaMaintenanceStatus holds the calculated maintenance status for a single replica.
message ReplicaMaintenanceStatus {
    // host is the replica host.
    string host = 1;
    // geometric is the status of geometric repacks.
    RepackStatus geometric = 2;
    // full is the status of full repacks.
    RepackStatus full = 3;
    // loose_objects is the estimated number of loose objects in the repository.
    uint32 loose_objects = 4;
    // packfiles is the estimated number of packfiles in the repository.
    uint32 packfiles = 5;
    // running indicates whether a maintenance operation is currently running.
    bool running = 6;
    // running_duration is how long the current maintenance operation has been running.
    google.protobuf.Duration running_duration = 7;
    // running_repack_type is the type of repack currently running (e.g., "geometric", "full").
    string running_repack_type = 8;
    // error is the error string if there was an rpc error.
    string error = 9;
}

// MaintenanceInfoResponse holds the calculated maintenance statuses for all replicas.
message MaintenanceInfoResponse {
    // replicas contains maintenance status for each replica host.
    repeated ReplicaMaintenanceStatus replicas = 1;
}
