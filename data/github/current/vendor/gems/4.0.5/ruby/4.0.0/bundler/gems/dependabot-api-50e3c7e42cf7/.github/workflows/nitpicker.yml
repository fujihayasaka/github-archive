name: "Nitpicker PR Advice"

on:
  pull_request:
    branches: [ main ]

jobs:
  advise:
    name: Advise
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write 

    steps:
      - uses: actions/checkout@v6
      - uses: ethanis/nitpicker@e891622bbd9a6ec97a473bcfacfca7332caf2862 # v1.7
        with:
          nitpicks: '.github/nitpicks.yml'
          token: '${{ secrets.GITHUB_TOKEN }}'
