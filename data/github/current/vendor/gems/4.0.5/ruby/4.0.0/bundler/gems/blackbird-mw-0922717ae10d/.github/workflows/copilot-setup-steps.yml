name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    # Must match OS where blackbird c libs are built
    runs-on: blackbird-custom-16core

    permissions:
      id-token: write # for setup-goproxy OIDC
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          token: ${{ secrets.BLACKBIRD_REPO_READER_PAT }}
      - uses: github/setup-goproxy@v1.1.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - uses: actions/cache@v5.0.3
        with:
          path: vendor
          key: ${{ runner.os }}-go-vendor-${{ hashFiles('go.sum') }}
