name: Build Monolith Twirp Gems
on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches-ignore:
      # Don't run on pushes to enterprise release or backport branches
      - 'enterprise-*-release'
      - 'enterprise-*-backport-*'
    tags-ignore:
      # Don't run on any pushed tags.
      - '*'
    paths:
      # Only run when changes are made to monolith-twirp proto files
      - 'proto/monolith/**'

permissions:
  id-token: write

jobs:
  build:
    name: monolith-twirp-dependabot
    strategy:
      fail-fast: false
    uses: github/internal-actions/.github/workflows/monolith_twirp.yml@main
    with:
      ci-formatted-job-name: monolith-twirp-dependabot
      publish-to-action-workflow: true
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
