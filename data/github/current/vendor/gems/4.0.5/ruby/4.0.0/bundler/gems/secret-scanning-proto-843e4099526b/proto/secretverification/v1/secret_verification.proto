syntax = "proto3";

package github.secretscanning.secretverification.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/secretverification";
option ruby_package = "GitHub::Proto::SecretScanning::SecretVerification::V1";

// SecretVerificationService provides LLM-based verification of potential secrets in code
service SecretVerificationService {
  // VerifySecret analyzes a code snippet to determine if it contains a real secret
  // Uses taint sink analysis to track how the potential secret is used
  rpc VerifySecret(VerifySecretRequest) returns (VerifySecretResponse);
}

// ============= VerifySecret =============

message VerifySecretRequest {
  // Path to the source file (used for language detection and prompt context)
  string file_path = 1;

  // The actual source code content to analyze
  string code = 2;

  // Starting line number of suspicious region (1-indexed, inclusive)
  int32 start_line = 3;

  // Ending line number of suspicious region (1-indexed, inclusive)
  int32 end_line = 4;

  // Starting column byte offset of secret value (0-indexed)
  // Optional: defaults to 0 (start of line) if not provided
  int32 start_col = 5;

  // Ending column byte offset of secret value (0-indexed, exclusive)
  // Optional: defaults to end of line if not provided
  int32 end_col = 6;

  // Number of context lines before/after suspicious region (default: 5)
  int32 context_lines = 7;
}

enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_LOW = 1;
  CONFIDENCE_MEDIUM = 2;
  CONFIDENCE_HIGH = 3;
}

message VerifySecretResponse {
  // Whether the code contains a real, production-usable secret
  bool is_secret = 1;

  // Confidence level of the classification
  Confidence confidence = 2;

  // Brief explanation for the classification
  string reason = 3;
}
