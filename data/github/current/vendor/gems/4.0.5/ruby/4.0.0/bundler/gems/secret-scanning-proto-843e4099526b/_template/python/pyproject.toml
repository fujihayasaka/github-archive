[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-scanning-proto"
version = "0.0.1"
description = "Generated client/server code for Secret Scanning Service API."
requires-python = ">=3.9"
dependencies = [
    "protobuf>=5.27.5",
    "twirpy",
    "multidict",
]

[tool.setuptools.packages.find]
where = ["src"]
