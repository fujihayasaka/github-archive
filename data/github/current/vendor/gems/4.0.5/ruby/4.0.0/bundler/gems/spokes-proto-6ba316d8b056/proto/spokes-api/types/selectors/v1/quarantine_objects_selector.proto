syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

// QuarantineObjectsSelector is a selector for selecting objects by that were included in a push
// specifically while they are still in quarantine.
message QuarantineObjectsSelector {
  // filter_preexisting_objects indicates whether to include objects that were already present in the repository before the push.
  // By default this is false, meaning that objects in the quarantine and in the main repository will be included.
  bool filter_preexisting_objects = 1;
}
