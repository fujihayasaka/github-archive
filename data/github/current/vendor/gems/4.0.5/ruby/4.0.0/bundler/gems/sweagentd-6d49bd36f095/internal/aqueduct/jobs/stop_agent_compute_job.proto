// Update generated code with script/protoc

syntax = "proto3";

package github.sweagentd.aqueduct.jobs;

option go_package = "./;jobs";

// StopAgentComputeJob is a delayed job that stops an agent compute (Sandbox)
// some time after the request was originally received. The Twirp endpoint
// schedules this job via Aqueduct rather than calling the Sandbox service
// directly, giving us a configurable delay between request and execution.
message StopAgentComputeJob {
  // The Sandbox compute ID to stop.
  string compute_id = 1;

  // The actor ID is the GitHub ID of the user that initiated the stop.
  int64 actor_id = 2;

  reserved 3, 4;
  reserved "repository_id", "agent_id";

  // The GitHub request ID flows continuously despite jobs being enqueued and
  // dequeued.
  string github_request_id = 5;

  // The number of times this job has been requeued.
  // This value should NOT be set when creating/queueing/requeueing a job. It
  // is set by the aqueduct package handlers when the job is requeued.
  int32 requeue_count = 6;

  // Generation is a monotonically increasing token recorded in the cache when
  // the StopAgentCompute Twirp endpoint is called. The handler skips
  // processing if the current generation in the cache does not match this
  // value, allowing a subsequent StopAgentCompute call for the same compute
  // ID to supersede (effectively cancel) a previously-scheduled job.
  int64 generation = 7;
}
