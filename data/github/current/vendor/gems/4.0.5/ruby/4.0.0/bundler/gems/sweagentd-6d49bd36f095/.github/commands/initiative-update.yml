trigger: initiative
title: Initiative Report
description: Initiative Progress Report
steps:
  - type: form
    style: embedded
    actions:
      submit: Create
      cancel: Discard
    body:
      - type: dropdown
        attributes:
          id: trending
          label: Trending
          options:
            - label: "🟢 on track"
              value: "🟢 on track"
            - label: "🟡 at risk"
              value: "🟡 at risk"
            - label: "🔴 off track"
              value: "🔴 off track"
            - label: "⚪ inactive"
              value: "⚪ inactive"
            - label: "⚪ not planned"
              value: "⚪ not planned"
            - label: "🟣 done"
              value: "🟣 done"
      - type: input
        attributes:
          id: target_date
          label: Target date
          format: date
      - type: textarea
        attributes:
          id: momentum
          label: Momentum 🚀
          description: What has moved forward since the last report? What decisions were made? What ships moved the needle? What are the top 2-3 opportunities for this week?
          placeholder: Link any releases or epics as needed
      - type: textarea
        attributes:
          id: insights
          label: Insights 👀
          description: What did you learn? Briefly explain the 2–3 most meaningful (metric) trends this week and why they matter— what story are they telling?
          placeholder: Link any dashboards as needed
      - type: textarea
        attributes:
          id: demos
          label: Demos 🔥
          description: Share any demos that show visible progress toward our goals.
          placeholder: Loom is best to ensure consistent access across Core-AI.
      - type: textarea
        attributes:
          id: risks
          label: Risks, Blockers, LT Review  🚧
          description: Highlight risks and mitigation plan. What do you need from LT to maintain or accelerate progress? 
          placeholder: Be specific about who and what kind of support is needed.
  - type: fill
    template: |-
      Weekly Initiative Status Update
      {% if data.trending != "" %}
      ### Trending

      {{ data.trending }}

      {% endif %}

      {% if data.target_date != "" %}
      ### Target Date

      {{ data.target_date }}

      {% endif %}
      
      {% if data.momentum != "" %}
      ### Momentum 🚀

      {{ data.momentum }}

      {% endif %}
      
      {% if data.insights != "" %}
      ### Insights 👀

      {{ data.insights }}
      
      {% endif %}
      
      {% if data.demos != "" %}
      ### Demos 🔥

      {{ data.demos }}

      {% endif %}
      
      {% if data.risks != "" %}
      ### Risks, Blockers, LT Review  🚧

      {{ data.risks }}

      {% endif %}
    submit_form: true
