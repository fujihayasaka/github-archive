- markdown: |
    :wave: This PR changes files that define the interface between this service
    and the dependabot-core updater. To ensure backwards compatibility with
    previous GHES versions the updater must not require these changes to
    continue functioning. The updater should be able to handle job inputs from
    older versions of the service and any job api calls the updater makes should
    not fail if made against older versions of the service which won't contain these
    changes. For further guidance, review the [ghes docs](https://github.com/github/dependabot-updates/blob/main/docs/development/working-on-ghes.md#feature-flags-and-new-features).

  pathFilter:
    - 'app/coach/routes/update_jobs/**'
    - 'app/serializers/update_job_serializer_private.rb'
    - 'app/serializers/update_job_credentials_serializer.rb'

- markdown: |
    It looks like you made a change to an environment variable.
    You may also need to change the environment file in github/enterprise2.

  pathFilter:
    - '**/environment.yml'
    - '**/environment.yaml'
