syntax = "proto3";

package billingcore.subscription.v1;

option go_package = "internal/billingcore/subscription/proto";
option ruby_package = "BillingCore::Subscription::V1";

service SubscriptionAPI {
  rpc GetProductSubscriptionStatus(GetProductSubscriptionStatusRequest) returns (GetProductSubscriptionStatusResponse);
}

message GetProductSubscriptionStatusRequest {
  int64 entity_id = 1;
  string entity_type = 2;
  string product_type = 3;
  repeated string product_keys = 4;
  optional BillingCycle billing_cycle = 5;
}

message GetProductSubscriptionStatusResponse {
  ProductSubscriptionStatus status = 1;
  repeated ActiveProduct active_products = 2;
}

enum ProductSubscriptionStatus {
  PRODUCT_SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  PRODUCT_SUBSCRIPTION_STATUS_NOT_FOUND = 1;
  PRODUCT_SUBSCRIPTION_STATUS_ACTIVE = 2;
  PRODUCT_SUBSCRIPTION_STATUS_ENDED = 3;
}

enum BillingCycle {
  BILLING_CYCLE_UNSPECIFIED = 0;
  BILLING_CYCLE_MONTH = 1;
  BILLING_CYCLE_YEAR = 2;
  BILLING_CYCLE_ONE_TIME = 3;
}

message ActiveProduct {
  string product_key = 1;
  BillingCycle billing_cycle = 2;
  int32 quantity = 3;
  optional string free_trial_ends_on = 4; // Calendar date in Pacific Time (America/Los_Angeles), format "YYYY-MM-DD"
  bool on_free_trial = 5;
}
