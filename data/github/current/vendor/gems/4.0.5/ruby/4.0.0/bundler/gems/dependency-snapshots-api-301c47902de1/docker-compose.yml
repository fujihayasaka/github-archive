version: '3.4'

services:
  dsapi_azure_storage:
    image: mcr.microsoft.com/azure-storage/azurite:3.17.1
    # container_name and port both need to be mindful of dg-api and keep to their own lanes
    container_name: azurite_dsapi
    ports:
      - "127.0.0.1:20100:10000"
      - "127.0.0.1:20101:10001"
      - "127.0.0.1:20102:10002"
    restart: always
    command: "azurite azurite-blob --blobHost 0.0.0.0"

  redis:
    image: redis:7
    restart: always
    expose:
      - 6379
    healthcheck:
      start_period: 10s
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "redis-cli", "ping"]

  aqueduct:
    image: ghcr.io/github/aqueduct-lite/aqueduct-lite:latest
    platform: linux/amd64
    restart: always
    ports:
      - "18081:18081"
    expose:
      - 18081
    depends_on:
      - redis
    environment:
      - AQUEDUCT_LITE_LISTEN_ADDRESS=0.0.0.0:18081
      - AQUEDUCT_LITE_REDIS_ADDRESS=redis:6379
      - AQUEDUCT_LITE_LOG_LEVEL=info
    command: "bin/aqueduct-lite"
    healthcheck:
      start_period: 10s
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 18081 || exit 1"]
