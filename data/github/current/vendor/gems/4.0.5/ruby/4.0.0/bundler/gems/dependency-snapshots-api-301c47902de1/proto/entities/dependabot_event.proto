syntax = "proto3";

package github.dependency_snapshots_api.entities;

option go_package = "github.com/github/dependency-snapshots-api/pkg/proto/entities;entities";

// The type of a dependabot snapshot event.
enum DependabotEventType {
  DEPENDABOT_EVENT_TYPE_UNSPECIFIED = 0;
  DEPENDABOT_EVENT_TYPE_INIT = 1;
  DEPENDABOT_EVENT_TYPE_PUSH = 2;
}

// The reason for a readiness determination on a dependabot event.
enum DependabotReadinessReason {
  DEPENDABOT_READINESS_REASON_UNSPECIFIED = 0;
  // No snapshots were requested for this event
  DEPENDABOT_READINESS_REASON_NO_EVENT = 1;
  // Some snapshots are still pending within their deadline
  DEPENDABOT_READINESS_REASON_PENDING = 2;
  // All requested snapshots have been received
  DEPENDABOT_READINESS_REASON_SNAPSHOT_COMPLETE = 3;
  // The deadline has passed and some but not all snapshots were received
  DEPENDABOT_READINESS_REASON_DEADLINE_PAST_PARTIAL_SNAPSHOT = 4;
  // The deadline has passed and no snapshots were received
  DEPENDABOT_READINESS_REASON_DEADLINE_PAST_NO_SNAPSHOT = 5;
}
