version: 2
registries:
  github-acme:
    type: hex-repository
    url: https://hex.example.com
    repo: my_hex_repository
    public-key-fingerprint: ${{secrets.MY_PUBLIC_KEY_FINGERPRINT}}
    auth-key: ${{secrets.MY_HEX_KEY}}
updates:
  - package-ecosystem: "mix"
    directory: "/"
    registries:
      - github-acme
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
