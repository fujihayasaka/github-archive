---
extends: default

rules:
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  indentation: disable # ideally we'd use: indent-sequences: consistent, but that creates a massive diff
  line-length: disable

ignore: |
  # ERB templates are not valid YAML
  config/database.yml
  config/storage.yml
  # Test fixtures contain intentionally invalid YAML
  spec/fixtures/
  # Vendored dependencies
  vendor/
