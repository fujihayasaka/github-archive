version: '3.4'

services:
  tests:
    image: "dependency-snapshots-api"
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      - db
      - dsapi_azure_storage
    environment:
      - DEPENDENCY_SNAPSHOTS_DB_HOST=db
      - DEPENDENCY_SNAPSHOTS_DB_PORT=3306
      - DEPENDENCY_SNAPSHOTS_DB=${DEPENDENCY_SNAPSHOTS_DB:-dependency_snapshots_test}
      - AZURE_STORAGE_BLOB_ENDPOINT=http://dsapi_azure_storage:10000/devstoreaccount1
