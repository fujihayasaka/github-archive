openapi: 3.0.3
info:
  title: Sessions Legacy Error Progress Schema
  version: 0.0.0
  description: |
    Schema definition for error progress updates in the sessions-legacy namespace.

    ⚠️ DEPRECATED - This schema is deprecated and retained only for backward
    compatibility with existing sessions. New integrations should use the
    copilot namespace instead.

    This schema defines the payload structure for progress updates with:
    - namespace: "sessions-legacy"
    - kind: "error"
    - version: 0

    The sessions-legacy error format is intentionally simple, containing only
    message and code properties for basic error reporting.

paths: {}

components:
  schemas:
    SessionsLegacyError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: |
            A human-readable error message describing what went wrong.
          example: "Failed to execute command"

        code:
          type: string
          description: |
            An optional machine-readable error code that categorizes the error type.
          example: "command_failed"
