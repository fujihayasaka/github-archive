# This docker compose file defines the core services blackbird-mw depends on.
# See also deps/spokes-proto/docker-compose.yml for the spokes compose
# environment.
services:
  kafka:
    # Check the version of Kafka included here: https://docs.confluent.io/platform/current/installation/versions-interoperability.html
    # Match it to what we run in production.
    image: confluentinc/cp-kafka:7.9.3
    container_name: blackbird-mw-kafka
    restart: on-failure
    expose:
      - 9092
      - 29092
      - 29093
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://blackbird-mw-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@blackbird-mw-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://blackbird-mw-kafka:29092,CONTROLLER://blackbird-mw-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # TODO: Check on this, should I generate one?
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
    healthcheck:
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
      test: ["CMD", "kafka-topics", "--bootstrap-server", "blackbird-mw-kafka:29092", "--list", "&>/dev/null"]

  kafka-2:
    # Check the version of Kafka included here: https://docs.confluent.io/platform/current/installation/versions-interoperability.html
    # Match it to what we run in production.
    image: confluentinc/cp-kafka:7.9.3
    container_name: blackbird-mw-kafka-2
    restart: on-failure
    expose:
      - 9092
      - 29092
      - 29093
    ports:
      - 19092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://blackbird-mw-kafka-2:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@blackbird-mw-kafka-2:29093
      KAFKA_LISTENERS: PLAINTEXT://blackbird-mw-kafka-2:29092,CONTROLLER://blackbird-mw-kafka-2:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # TODO: Check on this, should I generate one?
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
    healthcheck:
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
      test: ["CMD", "kafka-topics", "--bootstrap-server", "blackbird-mw-kafka-2:29092", "--list", "&>/dev/null"]

  # Kafka cluster simulating Potomac in the dotcom environment (shared topics that live on a different cluster).
  kafka-potomac:
    # Check the version of Kafka included here: https://docs.confluent.io/platform/current/installation/versions-interoperability.html
    # Match it to what we run in production.
    image: confluentinc/cp-kafka:7.9.3
    platform: linux/amd64
    container_name: blackbird-mw-kafka-potomac
    restart: on-failure
    expose:
      - 9092
      - 29092
      - 29093
    ports:
      - 20092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://blackbird-mw-kafka-potomac:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@blackbird-mw-kafka-potomac:29093
      KAFKA_LISTENERS: PLAINTEXT://blackbird-mw-kafka-potomac:29092,CONTROLLER://blackbird-mw-kafka-potomac:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # TODO: Check on this, should I generate one?
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_MESSAGE_TIMESTAMP_TYPE: LogAppendTime
    healthcheck:
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 10
      test: ["CMD", "kafka-topics", "--bootstrap-server", "blackbird-mw-kafka-potomac:29092", "--list", "&>/dev/null"]

  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --information_schema_stats_expiry=0
    restart: on-failure
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      # GitHub's MySql servers run in Pacific timezone. By setting this TZ here we ensure that our local environment
      # matches our production and catch any timezone related errors early in our end-to-end tests.
      - TZ=America/Los_Angeles
    expose:
      - 3306
    ports:
      - 9945:3306
    healthcheck:
      start_period: 10s
      interval: 10s
      timeout: 1s
      retries: 10
      test: ["CMD-SHELL", "mysql --host=mysql --user root --execute \"SHOW DATABASES;\""]

  redis:
    image: redis:7.2.4
    environment:
      ALLOW_EMPTY_PASSWORD: 1
    expose:
      - 6379
    ports:
      - 6380:6379
    healthcheck:
      start_period: 10s
      interval: 5s
      timeout: 1s
      retries: 10
      test: ["CMD", "redis-cli","ping"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite -l /data --loose --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - 10000:10000 # Blob
      - 10001:10001 # Queue
      - 10002:10002 # Table
    healthcheck:
      test: nc 127.0.0.1 10000 -z
      interval: 1s
      retries: 30

  azurite-storage-init:
    image: mcr.microsoft.com/azure-cli:latest
    command: >
      /bin/sh -c "az storage container create --name int-test-idx && touch finished && sleep infinity"
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      # https://github.com/Azure/Azurite/blob/main/README.md#usage-with-azure-storage-sdks-or-tools
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    healthcheck:
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
      test: test -f finished

  fake-github:
    environment:
      - BLACKBIRD_MW_ENV=test
      - BLACKBIRD_MW_LOG_LEVEL=info
      - BLACKBIRD_MW_MODE=${BLACKBIRD_MW_MODE}
    expose:
      - 11223
    ports:
      - 11223:11223
    networks:
      - default
    image: ${BLACKBIRD_MW_IMAGE:-ghcr.io/github/blackbird-mw/blackbird-mw:main}
    user: root
    entrypoint:
      - "/fakegithub"
    healthcheck:
      start_period: 5s
      interval: 10s
      timeout: 1s
      retries: 40
      test: [ "CMD-SHELL", "(curl --fail http://localhost:11223/ping) || exit 1" ]

  blackbird-cache-1:
    image: ${BLACKBIRD_BINARIES_IMAGE:-ghcr.io/github/blackbird/blackbird-binaries:debians-focal-release-main}
    command: blackbird-cache --disable-hmac --config /config/blackbird/test/blackbird-cache.toml --listen 0.0.0.0:4443
    user: root
    hostname: "blackbird-${BLACKBIRD_MW_CACHE_CLUSTER:-cache-001}" # NB: Report as something like blackbird-cache-001 so that the right hostname gets published for DSA
    environment:
      RUST_LOG: ${RUST_LOG:-info},librdkafka=warn,rdkafka::client=warn,blackbird_runtime::twirp::server=warn,blackbird_runtime::twirp::service_builder=warn
      RUST_BACKTRACE: full
      BLACKBIRD_ENV: test
      BLACKBIRD_CLUSTERNAME: ${BLACKBIRD_MW_CACHE_CLUSTER:-cache-001}
      EMBEDDINGS_REDIS_PASSWORD: ""
      AZURE_BLACKBIRD_EMBEDDING_CANADACENTRAL_KEY: ${AZURE_BLACKBIRD_EMBEDDING_CANADACENTRAL_KEY}
      METIS_VLLM_CANADACENTRAL_KEY: ${METIS_VLLM_CANADACENTRAL_KEY}
    volumes:
      - blackbird_cache_1:/data/blackbird/idx:rw
      - ./config/blackbird:/config/blackbird:ro
    expose:
      - 4443
    ports:
      - 9947:4443
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-potomac:
        condition: service_healthy
      bootstrap-kafka:
        condition: service_healthy
      bootstrap-kafka-2:
        condition: service_healthy
      bootstrap-kafka-potomac:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 40
      test: [ "CMD-SHELL", "curl --fail http://localhost:4443/_ping || exit 1" ]

  blackbird-1:
    image: ${BLACKBIRD_BINARIES_IMAGE:-ghcr.io/github/blackbird/blackbird-binaries:debians-focal-release-main}
    command: blackbird-foreman start --procfile /config/blackbird/test/Procfile
    user: root
    hostname: "blackbird-1"
    environment:
      RUST_LOG: ${RUST_LOG:-info},librdkafka=warn,rdkafka::client=warn,blackbird_runtime::twirp::server=warn,blackbird_runtime::twirp::service_builder=warn
      RUST_BACKTRACE: full
      BLACKBIRD_ENV: test
      BLACKBIRD_CLUSTERNAME: ${BLACKBIRD_CLUSTERNAME:-zeta}
    volumes:
      - blackbird_index_1:/data/blackbird/idx:rw
      - ./config/blackbird:/config/blackbird:ro
    expose:
      - 4443
      - 4444
    ports:
      - 9943:4443
      - 9904:4444
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      bootstrap-kafka:
        condition: service_healthy
      bootstrap-kafka-2:
        condition: service_healthy
    healthcheck:
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 40
      test: [ "CMD-SHELL", "(curl --fail http://localhost:4443/_ping && curl --fail http://localhost:4444/_ping) || exit 1" ]

  blackbird-2:
    image: ${BLACKBIRD_BINARIES_IMAGE:-ghcr.io/github/blackbird/blackbird-binaries:debians-focal-release-main}
    command: blackbird-foreman start --procfile /config/blackbird/test/Procfile
    user: root
    hostname: "blackbird-2"
    environment:
      RUST_LOG: ${RUST_LOG:-info},librdkafka=warn,rdkafka::client=warn,blackbird_runtime::twirp::server=warn,blackbird_runtime::twirp::service_builder=warn
      RUST_BACKTRACE: full
      BLACKBIRD_ENV: test
      BLACKBIRD_CLUSTERNAME: ${BLACKBIRD_CLUSTERNAME:-zeta}
    volumes:
      - blackbird_index_2:/data/blackbird/idx:rw
      - ./config/blackbird:/config/blackbird:ro
    expose:
      - 4443
      - 4444
    ports:
      - 9944:4443
      - 9905:4444
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      bootstrap-kafka:
        condition: service_healthy
      bootstrap-kafka-2:
        condition: service_healthy
    healthcheck:
      start_period: 5s
      interval: 5s
      timeout: 1s
      retries: 40
      test: [ "CMD-SHELL", "(curl --fail http://localhost:4443/_ping && curl --fail http://localhost:4444/_ping) || exit 1" ]

# Bootstrapping "services", these never exit because then compose might try to run them again.
  bootstrap-kafka:
    image: confluentinc/cp-kafka:7.9.3
    tty: false
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./script
        target: /script
        read_only: true
    healthcheck:
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 40
      test: test -f finished
    # To check the status of a topic, run:
    #    docker compose exec kafka /usr/bin/kafka-topics --describe --topic blackbird.v1.GitDocument.Yellow --bootstrap-server blackbird-mw-kafka:29092
    #
    # To delete a topic, run:
    #    docker compose exec kafka /usr/bin/kafka-topics --delete --topic blackbird.v1.GitDocument.Yellow --bootstrap-server blackbird-mw-kafka:29092
    command: >
      bash -c "/script/create-kafka-topics.sh blackbird-mw-kafka:29092 && touch finished && sleep infinity"

  bootstrap-kafka-2:
    image: confluentinc/cp-kafka:7.9.3
    tty: false
    depends_on:
      kafka-2:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./script
        target: /script
        read_only: true
    healthcheck:
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 40
      test: test -f finished
    # To check the status of a topic, run:
    #    docker compose exec kafka /usr/bin/kafka-topics --describe --topic blackbird.v1.GitDocument.Yellow --bootstrap-server blackbird-mw-kafka-2:29092
    #
    # To delete a topic, run:
    #    docker compose exec kafka /usr/bin/kafka-topics --delete --topic blackbird.v1.GitDocument.Yellow --bootstrap-server blackbird-mw-kafka-2:29092
    command: >
      bash -c "/script/create-kafka-topics.sh blackbird-mw-kafka-2:29092 && touch finished && sleep infinity"

  bootstrap-kafka-potomac:
    platform: linux/amd64
    image: confluentinc/cp-kafka:7.9.3
    tty: false
    depends_on:
      kafka-potomac:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./script
        target: /script
        read_only: true
    healthcheck:
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 40
      test: test -f finished
    # To check the status of a topic, run:
    #    docker compose exec kafka /usr/bin/kafka-topics --describe --topic blackbird.v1.GitDocument.Yellow --bootstrap-server blackbird-mw-kafka-potomac:29092
    #
    # To delete a topic, run:
    #    docker compose exec kafka /usr/bin/kafka-topics --delete --topic blackbird.v1.GitDocument.Yellow --bootstrap-server blackbird-mw-kafka-potomac:29092
    command: >
      bash -c "/script/create-kafka-topics.sh blackbird-mw-kafka-potomac:29092 && touch finished && sleep infinity"

  # Use script/create-bootstrap-skeema-image to generate this image.
  bootstrap-skeema:
    image: blackbird-mw-bootstrap-skeema
    pull_policy: never
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      start_period: 15s
      interval: 5s
      timeout: 1s
      retries: 40
      test: test -f finished
    environment:
      env: test
    command: >
      bash -c "
      ./script/skeema push $$env --debug --allow-unsafe
      && touch finished
      && sleep infinity
      "

volumes:
  blackbird_index_1:
  blackbird_index_2:
  blackbird_cache_1:

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: "10.1.11.0/24"
