syntax = "proto3";

package oss_license_compliance.v0;

import "google/protobuf/timestamp.proto";
import "oss_license_compliance/v0/types.proto";

option go_package = "./;proto";

service LicenseCompliance {
  rpc CreateEnterprisePolicy(CreateEnterprisePolicyRequest) returns (CreateEnterprisePolicyResponse);
  rpc GetEnterprisePolicy(GetEnterprisePolicyRequest) returns (GetEnterprisePolicyResponse);
  rpc SaveEnterprisePolicy(SaveEnterprisePolicyRequest) returns (SaveEnterprisePolicyResponse);
  rpc AddLicensesToEnterprisePolicy(AddLicensesToEnterprisePolicyRequest) returns (AddLicensesToEnterprisePolicyResponse);
  rpc DeleteLicensesFromEnterprisePolicy(DeleteLicensesFromEnterprisePolicyRequest) returns (DeleteLicensesFromEnterprisePolicyResponse);
  rpc DeletePackageExceptionsFromEnterprisePolicy(DeletePackageExceptionsFromEnterprisePolicyRequest) returns (DeletePackageExceptionsFromEnterprisePolicyResponse);

  rpc CreateOrganizationPolicy(CreateOrganizationPolicyRequest) returns (CreateOrganizationPolicyResponse);
  rpc GetOrganizationPolicy(GetOrganizationPolicyRequest) returns (GetOrganizationPolicyResponse);
  rpc AddLicensesToOrganizationPolicy(AddLicensesToOrganizationPolicyRequest) returns (AddLicensesToOrganizationPolicyResponse);

  rpc CreateRepositoryPolicy(CreateRepositoryPolicyRequest) returns (CreateRepositoryPolicyResponse);
  rpc GetRepositoryPolicy(GetRepositoryPolicyRequest) returns (GetRepositoryPolicyResponse);
  rpc GetCombinedRepositoryPolicy(GetCombinedRepositoryPolicyRequest) returns (GetCombinedRepositoryPolicyResponse);
  rpc SaveRepositoryPolicy(SaveRepositoryPolicyRequest) returns (SaveRepositoryPolicyResponse);
  rpc DeleteLicensesFromRepositoryPolicy(DeleteLicensesFromRepositoryPolicyRequest) returns (DeleteLicensesFromRepositoryPolicyResponse);
  rpc DeletePackageExceptionsFromRepositoryPolicy(DeletePackageExceptionsFromRepositoryPolicyRequest) returns (DeletePackageExceptionsFromRepositoryPolicyResponse);

  rpc ValidateLicenses(ValidateLicensesRequest) returns (ValidateLicensesResponse);

  rpc CheckRepository(CheckRepositoryRequest) returns (CheckRepositoryResponse);
  rpc GetAlert(GetAlertRequest) returns (GetAlertResponse);
  rpc CreatePackageException(CreatePackageExceptionRequest) returns (CreatePackageExceptionResponse);
  rpc AddLicensesForAlert(AddLicensesForAlertRequest) returns (AddLicensesForAlertResponse);
  rpc RequestAlertDismissal(RequestAlertDismissalRequest) returns (RequestAlertDismissalResponse);
  rpc RequestAlertDismissalById(RequestAlertDismissalByIdRequest) returns (RequestAlertDismissalByIdResponse);
  rpc DenyAlertDismissal(DenyAlertDismissalRequest) returns (DenyAlertDismissalResponse);
  rpc ExpireAlertDismissal(ExpireAlertDismissalRequest) returns (ExpireAlertDismissalResponse);
  rpc ExpireAlertDismissalByBatch(ExpireAlertDismissalByBatchRequest) returns (ExpireAlertDismissalByBatchResponse);
  rpc GetReviewableAlerts(GetReviewableAlertsRequest) returns (GetReviewableAlertsResponse);
  rpc CheckStatus(CheckStatusRequest) returns (CheckStatusResponse);
  rpc GetAlertsForPullRequest(GetAlertsForPullRequestRequest) returns (GetAlertsForPullRequestResponse);
  rpc RestartCheckJob(RestartCheckJobRequest) returns (RestartCheckJobResponse);
}

message CreateEnterprisePolicyRequest {
  uint64 enterprise_id = 1;
  PolicyLicenses licenses = 2;
  repeated PackagePolicy packages = 3;
  string custom_remediation_guidance = 4;
}

message CreateEnterprisePolicyResponse {
  EnterprisePolicy policy = 1;
}

message GetEnterprisePolicyRequest {
  uint64 enterprise_id = 1;
}

message GetEnterprisePolicyResponse {
  EnterprisePolicy policy = 1;
}

// SaveEnterprisePolicyRequest is a convenience endpoint that supports adding licenses,
// deleting licenses, and deleting package exceptions in a single request.
message SaveEnterprisePolicyRequest {
  // The enterprise ID to update policy for.
  uint64 enterprise_id = 1;
  string context = 2;
  uint64 user_id = 3;

  // Licenses to add.
  repeated string add_spdx_ids = 4;
  // Licenses to delete.
  repeated string delete_spdx_ids = 5;
  // Package exceptions to add. 
  repeated PackagePolicy add_packages = 6;
  // Package exceptions to delete.
  repeated PackagePolicy delete_packages = 7;
}

message SaveEnterprisePolicyResponse {
  // The updated enterprise policy (may be unset if no policy exists and no valid update was applied).
  EnterprisePolicy policy = 1;
  // SPDX IDs that failed validation when adding.
  repeated string failed_spdx_ids = 2;
}

message AddLicensesToEnterprisePolicyRequest {
  uint64 enterprise_id = 1;
  repeated string spdx_ids = 2;
  string context = 3;
  uint64 user_id = 4;
}

message AddLicensesToEnterprisePolicyResponse {
  EnterprisePolicy policy = 1;
  repeated string failed_spdx_ids = 2;
}

message DeleteLicensesFromEnterprisePolicyRequest {
  // The enterprise ID to update policy for.
  uint64 enterprise_id = 1;
  // The SPDX license IDs to delete from the specified context.
  repeated string spdx_ids = 2;
  // The context from which to remove the licenses.
  string context = 3;
}

message DeleteLicensesFromEnterprisePolicyResponse {
  EnterprisePolicy policy = 1;
}

message DeletePackageExceptionsFromEnterprisePolicyRequest {
  uint64 enterprise_id = 1;
  repeated PackagePolicy packages = 2;
}

message DeletePackageExceptionsFromEnterprisePolicyResponse {
  EnterprisePolicy policy = 1;
}

message CreateOrganizationPolicyRequest {
  uint64 organization_id = 1;
  PolicyLicenses licenses = 2;
  repeated PackagePolicy packages = 3;
  string custom_remediation_guidance = 4;
}

message CreateOrganizationPolicyResponse {
  OrganizationPolicy policy = 1;
}

message GetOrganizationPolicyRequest {
  uint64 organization_id = 1;
}

message GetOrganizationPolicyResponse {
  OrganizationPolicy policy = 1;
}

message AddLicensesToOrganizationPolicyRequest {
  uint64 organization_id = 1;
  repeated string spdx_ids = 2;
  string context = 3;
  uint64 user_id = 4;
}

message AddLicensesToOrganizationPolicyResponse {
  OrganizationPolicy policy = 1;
}

message CreateRepositoryPolicyRequest {
  reserved 1;
  reserved "organization_id";
  uint64 repository_id = 2;
  PolicyLicenses licenses = 3;
  repeated PackagePolicy packages = 4;
}

message CreateRepositoryPolicyResponse {
  RepositoryPolicy policy = 1;
}

message GetRepositoryPolicyRequest {
  uint64 repository_id = 1;
}

message GetRepositoryPolicyResponse {
  RepositoryPolicy policy = 1;
}

message GetCombinedRepositoryPolicyRequest {
  uint64 enterprise_id = 1;
  uint64 organization_id = 2;
  uint64 repository_id = 3;
  string distribution_policy_name = 4;
}

message GetCombinedRepositoryPolicyResponse {
  CombinedRepositoryPolicy policy = 1;
}

message SaveRepositoryPolicyRequest {
  uint64 repository_id = 1;
  // Licenses to delete.
  repeated string delete_spdx_ids = 2;
  // Package exceptions to delete.
  repeated PackagePolicy delete_packages = 3;
}

message SaveRepositoryPolicyResponse {
  bool success = 1;
}

message DeleteLicensesFromRepositoryPolicyRequest {
  // The repository ID to update policy for.
  uint64 repository_id = 1;
  // The SPDX license IDs to delete from the specified context.
  repeated string spdx_ids = 2;
}

message DeleteLicensesFromRepositoryPolicyResponse {
  reserved 1;
  reserved "policy";
  bool success = 2;
}

message DeletePackageExceptionsFromRepositoryPolicyRequest {
  uint64 repository_id = 1;
  repeated PackagePolicy packages = 2;
}

message DeletePackageExceptionsFromRepositoryPolicyResponse {
  reserved 1;
  reserved "policy";
  bool success = 2;
}

message ValidateLicensesRequest {
  repeated string spdx_ids = 1;
}

message ValidateLicensesResponse {
  repeated string valid_spdx_ids = 1;
  repeated string invalid_spdx_ids = 2;
}

message CheckRepositoryRequest {
  uint64 enterprise_id = 1;
  uint64 organization_id = 2;
  uint64 repository_id = 3;
  string commit_sha = 4;
  string base_sha = 5;
  string context = 6;
  uint64 pull_request_id = 7;
  uint64 pull_request_number = 8;
  // fork_repository_id (optional) is the fork/head repository ID for cross-repo PR checks.
  // When non-zero, snapshot and dependency diff queries use this as the target repository.
  uint64 fork_repository_id = 9;
  // head_ref is the head branch ref of the PR, e.g. "refs/heads/feature" or
  // just "feature" (server normalizes to the fully-qualified form on write).
  // Optional; persisted on the CheckJob row when provided. Used by snapshot-
  // processed event matching to wake waiting checks more reliably than SHA-
  // based matching alone.
  string head_ref = 10;
  // base_ref is the base branch ref of the PR, e.g. "refs/heads/main" or just
  // "main" (server normalizes to the fully-qualified form on write). Optional;
  // persisted on the CheckJob row when provided. Used by snapshot-processed
  // event matching to wake waiting checks when a Dependabot snapshot is
  // submitted for the PR's base branch.
  string base_ref = 11;
}

message CheckRepositoryResponse {
  RepositoryCheckStatus status = 1;
  string message = 2;
}

message GetAlertRequest {
  uint64 repository_id = 1;
  uint32 number = 2;
}

message GetAlertResponse {
  Alert alert = 1;
  repeated AlertEvent events = 2;
}

message CreatePackageExceptionRequest {
  uint64 repository_id = 1;
  uint64 organization_id = 2;
  uint64 enterprise_id = 3;
  uint64 user_id = 4;
  uint32 alert_number = 5;
  PolicyLevel policy_level = 6;
  repeated string contexts = 7;
  string comment = 8;
  PackageAction action = 9;
  string pattern = 10;
  ClosureReason closure_reason = 11;
}

message CreatePackageExceptionResponse {
  bool success = 1;
}

message AddLicensesForAlertRequest {
  uint64 repository_id = 1;
  uint32 alert_number = 2;
  uint64 user_id = 3;
  PolicyLevel policy_level = 4;
  repeated string contexts = 5;
  uint64 organization_id = 6;
  uint64 enterprise_id = 7;
  string comment = 8;
  ClosureReason closure_reason = 9;
}

message AddLicensesForAlertResponse {
  bool success = 1;
  repeated string added_licenses = 2;
  PolicyLevel policy_level = 3;
}

message RequestAlertDismissalRequest {
  uint64 repository_id = 1;
  uint32 number = 2;
  uint64 user_id = 3;
  ClosureReason closure_reason = 4;
  string comment = 5;
}

message RequestAlertDismissalResponse {
  bool success = 1;
}

message RequestAlertDismissalByIdRequest {
  uint64 alert_id = 1;
  uint64 user_id = 2;
  ClosureReason closure_reason = 3;
  string comment = 4;
}

message RequestAlertDismissalByIdResponse {
  bool success = 1;
}

message DenyAlertDismissalRequest {
  uint64 repository_id = 1;
  uint32 number = 2;
  uint64 user_id = 3;
  string comment = 4;
}

message DenyAlertDismissalResponse {
  bool success = 1;
}

message GetReviewableAlertsRequest {
  uint64 organization_id = 1;
  uint64 enterprise_id = 2;
}

message GetReviewableAlertsResponse {
  repeated Alert alerts = 1;
}

// ExpireAlertDismissalRequest contains the parameters to expire a review request.
message ExpireAlertDismissalRequest {
  // The repository ID containing the alert.
  uint64 repository_id = 1;
  // The alert number.
  uint32 number = 2;
  // The timestamp when the review request expired.
  google.protobuf.Timestamp expiry_timestamp = 3;
}

// ExpireAlertDismissalResponse is returned when a review request is successfully expired.
message ExpireAlertDismissalResponse {
  // The updated alert.
  Alert alert = 1;
  // The alert events including the new EventReviewExpired.
  repeated AlertEvent events = 2;
}

message ExpireAlertDismissalByBatchRequest {
  repeated ExpiredAlertDismissal dismissals = 1;
}

message ExpireAlertDismissalByBatchResponse {
  repeated ExpiredAlert expired_alerts = 1;
}

message CheckStatusRequest {
  uint64 repository_id = 1;
  uint64 pull_request_number = 2;
}

message CheckStatusResponse {
  uint64 id = 1;
  CheckJobStatus status = 2;
  google.protobuf.Timestamp check_started_at = 3;
  uint64 repository_id = 4;
  uint64 organization_id = 5;
  uint64 pull_request_id = 6;
  uint64 pull_request_number = 7;
  uint64 enterprise_id = 8;
  string base_sha = 9;
  string commit_sha = 10;
  uint32 expected_snapshots = 11;
  uint32 received_snapshots = 12;
  // Detectors we are still waiting on snapshots from while the check is in
  // the Waiting state. Cleared once all snapshots are received.
  repeated string missing_detectors = 13;
}

message GetAlertsForPullRequestRequest {
  uint64 repository_id = 1;
  uint64 pull_request_number = 2;
}

message GetAlertsForPullRequestResponse {
  repeated Alert alerts = 1;
}

message RestartCheckJobRequest {
  uint64 repository_id = 1;
  uint64 pull_request_number = 2;
}

message RestartCheckJobResponse {
  bool success = 1;
}
