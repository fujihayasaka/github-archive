      kind: Deployment
      name: actions-compute-usage-consumer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: push-consumer
      $patch: delete
  - target:
      kind: Deployment
      name: activation-lifecycle-consumer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: push-consumer
      $patch: delete
