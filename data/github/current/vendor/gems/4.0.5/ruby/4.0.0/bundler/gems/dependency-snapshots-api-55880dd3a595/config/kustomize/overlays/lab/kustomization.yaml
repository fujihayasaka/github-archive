patchesStrategicMerge:
  - ./config_maps/environment.yaml
  - ./services/api.yaml

patches:
  - target:
      kind: Deployment
      name: push-consumer
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: push-consumer
      $patch: delete
