---
"cve-id-issued":
  "Assign CVE": |-
    GitHub has issued ${{CVEID}} for this Security Advisory after reviewing it for compliance with CVE rules. Once your Security Advisory is published, we'll publish the CVE record to the [CVE List](https://www.cve.org/). At that time, if your package is in a [supported ecosystem](https://docs.github.com/en/code-security/concepts/vulnerability-reporting-and-management/about-the-github-advisory-database#github-reviewed-advisories), we'll also publish an advisory in the global GitHub Advisory Database and send security alerts to affected repositories.
  
    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
"cve-id-declined":
  "Test": |-
    GitHub cannot issue a CVE for this Security Advisory, as it appears to be a test. Thanks for your interest in securing open source.
  "Request does not originate from the official repo/fork for a project": |-
    GitHub cannot issue a CVE for this Security Advisory as it does not originate from the official repository for the software against which a CVE is being requested. At this time, we only support package maintainers requesting CVEs from the official package repository. If this request comes from a fork, you can move forward by working with the admins of the official repo to create a security advisory from there.

    Thank you for working to make the software ecosystem more secure.
  "Doesn't meet rules": |-
    GitHub cannot issue a CVE for this Security Advisory because it doesn't comply with one or more of the [CVE rules](https://www.cve.org/ResourcesSupport/AllResources/CNARules). You can move forward in one of two ways:

    - Review the counting rules and update your Security Advisory to meet the criteria specified in the rules.
      - Specifically for this advisory, make the following change(s):
      - ???
    - Publish your GitHub Security Advisory as-is.

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "Another CNA": |-
    Project is not under GitHub's CNA scope. other-organization is the registered CVE Numbering Authority with scope over project. GitHub is only authorized to assign CVEs to open source software not under the scope of another CNA.
    Accordingly, we suggest working with the other-organization CNA to get a CVE assigned. Their registered email address is `<other CNA's email>`.
    Please email `security-advisories@github.com` if you feel that INC1 should not apply in this case and we can work with you to get a CVE assigned to this advisory.
    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "Private repo": |-
    GitHub cannot issue a CVE for this Security Advisory because it concerns a private repository. GitHub is only authorized to issue CVEs for libraries and products hosted on github.com in public repositories. You can move forward in one of two ways:

    - Find the [applicable CNA](https://cve.mitre.org/cve/request_id.html) for your library or product and submit a CVE request to them; if there isn't one, submit your CVE request [directly to MITRE, the root CNA](https://cveform.mitre.org/).
    - [Make your repository public](https://help.github.com/en/github/administering-a-repository/setting-repository-visibility#making-a-repository-public) and re-request a CVE from GitHub.

    Thank you for working to make the software ecosystem more secure.
  "Already a CVE for this issue": |-
    GitHub cannot issue a CVE for this Security Advisory because it appears to be a duplicate of an existing CVE: https://nvd.nist.gov/vuln/detail/CVE-2019-10759. You can move forward in one of two ways:

    - If you agree that this Security Advisory corresponds to the CVE linked above, edit your Security Advisory to include this CVE ID and then publish the advisory.
    - Otherwise, edit your Security Advisory to include a new section outlining how it differs from the CVE linked above and then re-request a CVE from GitHub.

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "More than one vulnerability in one advisory": |-
    GitHub cannot issue a CVE for this Security Advisory because this advisory includes information about more than one vulnerability.

    According to [rule 4.2.11 of the CVE CNA rules](https://www.cve.org/ResourcesSupport/AllResources/CNARules#section_4-2_CVE_ID_Assignment):

    > 4.2.6 CNAs SHOULD assign different CVE IDs to separate Vulnerabilities, as determined using the guidance in [4.1](https://www.cve.org/ResourcesSupport/AllResources/CNARules#section_4-1_Vulnerability_Determination).

    > 4.2.11 CNAs SHOULD assign different CVE IDs to different, Independently Fixable Vulnerabilities.
    
    You can move forward in one of two ways:

    - If you agree that this Security Advisory concerns more than one independently fixable vulnerability, split each vulnerability into its own advisory and request one CVE for each vulnerability.
    - If you do not agree that these vulnerabilities are independently fixable, resubmit the CVE request with a section clarifying how they are dependent and should have the same CVE.

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing these vulnerabilities.
  "Vulnerable dependency": |-
    GitHub cannot issue a CVE for this Security Advisory because this advisory concerns a vulnerability that is dependent on another vulnerability.

    According to [rule 4.2.11 of the CVE CNA rules](https://www.cve.org/ResourcesSupport/AllResources/CNARules#section_4-2_CVE_ID_Assignment):

    > 4.1.12 The act of updating Product dependencies MUST NOT be determined to be a Vulnerability, regardless of whether the dependencies have Vulnerabilities. For example, updating a library to address a Vulnerability in that library MUST NOT be determined to be a new Vulnerability in a Product that uses the library, and a Vulnerability advisory for the Product SHOULD reference the CVE ID for the Vulnerability in the library. See [4.2.14](https://www.cve.org/ResourcesSupport/AllResources/CNARules#section_4-2_CVE_ID_Assignment).

    > 4.2.15 CNAs MUST NOT assign a different CVE ID to a Vulnerability that is fully interdependent with another Vulnerability. The Vulnerabilities are effectively the same single Vulnerability and MUST have one CVE ID.
    
    You can move forward in one of two ways:

    - If you agree that this Security Advisory concerns a vulnerability that is dependent on another vulnerability and/or a vulnerable dependency, use the CVE for the product with the original vulnerability.
    - If you do not agree that this vulnerability is dependent on another vulnerability, add a section to the advisory explaining how this vulnerability is independent of other vulnerabilities and resubmit the request.

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
