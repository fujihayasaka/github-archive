apiVersion: v1
kind: Service
metadata:
    name: configsd
    labels:
        service: configsd
    annotations:
        moda.github.net/istio-ingress-enabled: "true"
spec:
    ports:
        - name: http
          port: 8080
          protocol: TCP
          targetPort: http
    selector:
        app: configsd
    type: LoadBalancer
