apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "canary"
    moda.github.net/canary-replicas: "3"
spec:
  selector:
    matchLabels:
      canary: production
  template:
    metadata:
      labels:
        canary: production
