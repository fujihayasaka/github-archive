syntax = "proto3";

option java_package = "com.github.aqueduct.maintenance.api";

package aqueduct.maintenance.api.v1;

service MaintenanceService {
  // Describes the shards current state, returns a list of shards with their id and current state.
  rpc DescribeShards(DescribeShardsRequest) returns (DescribeShardsResponse) {};

  // Sets a shard as draining by setting its state to DRAIN.
  // Only one shard can be draining at a time.
  rpc DrainShard(ShardRequest) returns (ShardMaintenanceResponse) {};

  // Sets a shard as offline by settings its state to OFFLINE.
  // Only one shard can be offline at a time, and must have been in the draining state already.
  rpc OfflineShard(ShardRequest) returns (ShardMaintenanceResponse) {};

  // Sets a shard as online by removing any maintenance state.
  rpc OnlineShard(ShardRequest) returns (ShardMaintenanceResponse) {};
}

message DescribeShardsRequest {}

message ShardRequest {
  string id = 1;
}

message DescribeShardsResponse {
  repeated string shards = 1;
  ShardMaintenanceResponse maintenance = 2;
}

message ShardMaintenanceResponse {
  enum State {
    UNKNOWN_STATE = 0;
    DRAIN = 1;
    OFFLINE = 2;
    ONLINE = 4;
  }
  message Shard {
    string id = 1;
    State state = 2;
  }

  repeated Shard shards = 1;
}
