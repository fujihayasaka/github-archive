name: Check for uncommitted proto changes
on: # yamllint disable-line rule:truthy
  push:
    branches:
      - "main"
  pull_request:
  merge_group:

jobs:
  # This ensures a proto recompile matches the checked-in proto/dependabot-api/twirp proto files
  verify-proto-compile:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Rebuild the protobufs
        run: ./script/protoc

      - name: Compare the expected vs actual files
        run: git diff --exit-code

  ensure-go-mod-tidy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: proto/dependabot-api/go.mod

      - run: go mod tidy -diff
        working-directory: proto/dependabot-api
