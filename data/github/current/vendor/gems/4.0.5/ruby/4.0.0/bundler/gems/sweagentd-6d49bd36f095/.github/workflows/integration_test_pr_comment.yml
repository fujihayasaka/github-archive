name: "Test Copilot Coding Agent PR Comment"

on:
  workflow_call:
    secrets:
      token:
        required: true
      datadog_api_key:
        required: true
    inputs:
      repo_nwo:
        required: true
        type: string
      reporting_id:
        required: true
        type: string
      capi_base_url:
        description: "Copilot API base URL"
        type: string
        default: "https://api.githubcopilot.com"
      integration_id:
        description: "Copilot-Integration-Id header value"
        type: string
        default: "playground-dev"
      github_api_url:
        description: "GitHub API base URL (for proxima tenants)"
        type: string
        default: "https://api.github.com"
      github_server_url:
        description: "GitHub Server URL"
        type: string
        default: "https://github.com"
      stamp:
        description: "Stamp name for reporting"
        type: string
        default: "dotcom"
      stagger_delay_seconds:
        description: "Seconds to wait before launching the generated Copilot SWE workflow"
        type: number
        default: 0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stagger generated workflow launch
        if: ${{ inputs.stagger_delay_seconds > 0 }}
        run: |
          echo "Waiting ${{ inputs.stagger_delay_seconds }} seconds before launching ${{ inputs.reporting_id }}"
          sleep "${{ inputs.stagger_delay_seconds }}"

      - name: Create Job
        id: create-job
        run: |
          set -e
          response=$(curl --fail-with-body ${{ inputs.capi_base_url }}/agents/swe/v1/jobs/${{ inputs.repo_nwo }} -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Copilot-Integration-Id: ${{ inputs.integration_id }}" -d '{"problem_statement": "create a file titled \"Test PR Comment - Run ${{ github.run_id }}\", and in it write \"initial content\""}')
          session_id=$(echo "$response" | jq -r '.session_id')
          echo "Created coding agent session $session_id"
          echo "session_id=$session_id" >> $GITHUB_ENV
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.token }}
      - id: wait_for_cca
        timeout-minutes: 15
        uses: ./.github/actions/wait_for_cca
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
      - name: Get PR number and post comment
        id: post_comment
        run: |
          set -e
          response=$(curl -s --fail-with-body ${{ inputs.capi_base_url }}/agents/sessions/$session_id -H "Authorization: Bearer ${{ secrets.token }}" -H "Copilot-Integration-Id: ${{ inputs.integration_id }}")
          pull_request_id=$(echo "$response" | jq -r '.resource_id')
          echo "pull_request_id=$pull_request_id" >> $GITHUB_ENV

          all_prs=$(curl -s -H "Authorization: Bearer ${{ secrets.token }}" -H "Accept: application/vnd.github+json" ${{ inputs.github_api_url }}/repos/${{ inputs.repo_nwo }}/pulls?state=open)
          for pr in $(jq -r '.[] | @base64' <<< "$all_prs")
          do
            decoded_pr=$(echo "$pr" | base64 --decode)
            if [ "$(jq '.id' <<< "$decoded_pr")" -eq "$pull_request_id" ]
            then
              pr_number=$(jq '.number' <<< "$decoded_pr")
              break
            fi
          done

          if [ -z "$pr_number" ]; then
            echo "Error: no pull request number found"
            exit 1
          fi

          comment_response=$(curl -s --fail-with-body -X POST -H "Authorization: Bearer ${{ secrets.token }}" -H "Accept: application/vnd.github+json" ${{ inputs.github_api_url }}/repos/${{ inputs.repo_nwo }}/issues/$pr_number/comments -d '{"body": "@copilot please update the file content to say \"updated via PR comment\" instead"}')
          comment_id=$(echo "$comment_response" | jq -r '.id')
          if [ -z "$comment_id" ] || [ "$comment_id" = "null" ]; then
            echo "Error: failed to extract comment id from response: $comment_response"
            exit 1
          fi
          echo "Posted comment id=$comment_id"
          echo "comment_id=$comment_id" >> $GITHUB_ENV
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "pull_request_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pull_request_url=${{ inputs.github_server_url }}/${{ inputs.repo_nwo }}/pull/$pr_number" >> "$GITHUB_OUTPUT"
      - name: Wait for comment session
        id: wait_for_comment_session
        timeout-minutes: 3
        run: |
          while true; do
            http_code=$(curl -s -o /tmp/sessions_response.json -w "%{http_code}" ${{ inputs.capi_base_url }}/agents/sessions/resource/pull/$pull_request_id -H "Authorization: Bearer ${{ secrets.token }}" -H "Copilot-Integration-Id: ${{ inputs.integration_id }}")
            sessions=$(cat /tmp/sessions_response.json)
            echo "HTTP status: $http_code"
            echo "Response: $sessions"
            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              comment_session_id=$(echo "$sessions" | jq -r --arg cid "$comment_id" '[.sessions[] | select(.event_identifiers != null and (.event_identifiers[] == $cid))] | .[0].id // empty')
              if [ -n "$comment_session_id" ]; then
                echo "Found comment session $comment_session_id for comment $comment_id"
                echo "comment_session_id=$comment_session_id" >> $GITHUB_ENV
                echo "comment_session_id=$comment_session_id" >> "$GITHUB_OUTPUT"
                break
              fi
            fi
            echo "Comment session not yet created for comment $comment_id, sleeping for 10 seconds..."
            sleep 10
          done
      - id: wait_for_comment_cca
        timeout-minutes: 15
        uses: ./.github/actions/wait_for_cca
        with:
          token: ${{ secrets.token }}
          session_id: ${{ env.comment_session_id }}
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
      - id: cleanup_pr
        uses: ./.github/actions/cleanup_pr
        if: steps.create-job.outcome == 'success'
        with:
          token: ${{ secrets.token }}
          session_id: $session_id
          repo_nwo: ${{ inputs.repo_nwo }}
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
          github_api_url: ${{ inputs.github_api_url }}
          github_server_url: ${{ inputs.github_server_url }}
      - id: validate_initial_session
        uses: ./.github/actions/validate_session
        with:
          token: ${{ secrets.token }}
          session_id: ${{ env.session_id }}
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
      - id: validate_session
        uses: ./.github/actions/validate_session
        with:
          token: ${{ secrets.token }}
          session_id: ${{ env.comment_session_id }}
          capi_base_url: ${{ inputs.capi_base_url }}
          integration_id: ${{ inputs.integration_id }}
      - name: Write job summary
        id: write_summary
        if: ${{ always() }}
        uses: ./.github/actions/write_integration_summary
        with:
          test_name: "PR Comment Integration Test"
          reporting_id: ${{ inputs.reporting_id }}
          job_status: ${{ job.status }}
          repo_nwo: ${{ inputs.repo_nwo }}
          github_server_url: ${{ inputs.github_server_url }}
          capi_base_url: ${{ inputs.capi_base_url }}
          session_id: ${{ steps.create-job.outputs.session_id }}
          session_workflow_run_id: ${{ steps.wait_for_cca.outputs.workflow_run_id }}
          comment_session_id: ${{ steps.wait_for_comment_session.outputs.comment_session_id }}
          comment_session_workflow_run_id: ${{ steps.wait_for_comment_cca.outputs.workflow_run_id }}
          pull_request_number: ${{ steps.post_comment.outputs.pull_request_number || steps.cleanup_pr.outputs.pull_request_number }}
          pull_request_url: ${{ steps.post_comment.outputs.pull_request_url || steps.cleanup_pr.outputs.pull_request_url }}
          comment_id: ${{ steps.post_comment.outputs.comment_id }}
      - id: notify_datadog
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: ./.github/actions/notify_datadog
        with:
          datadog_api_key: ${{ secrets.datadog_api_key }}
          job_status: ${{ job.status }}
          test_type: ${{ inputs.reporting_id }}
          test_name: "PR Comment Integration Test"
          stamp: ${{ inputs.stamp }}
