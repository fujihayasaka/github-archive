syntax = "proto3";

package github.spokes.extensions.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/extensions";
option ruby_package = "GitHub::Spokes::Proto::Extensions::V1";

import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
    // limit is the maximum number of items allowed in a repeated field.
    uint32 limit = 50000;
}
