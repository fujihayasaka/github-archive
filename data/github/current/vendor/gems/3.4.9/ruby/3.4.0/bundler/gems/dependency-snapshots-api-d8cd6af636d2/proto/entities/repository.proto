syntax = "proto3";

import "google/protobuf/timestamp.proto";

package github.dependency_snapshots_api.entities;

option go_package = "proto/entities";

// Fields are inspired by
// https://github.com/github/hydro-schemas/blob/5f77c8b0406be57e75c885ba22e850fbe93b1a92/proto/hydro/schemas/github/v1/entities/repository.proto

message Repository {
  // The repository database id.
  uint32 id = 1;

  // The repository name.
  string name = 2;

  // The repository visibility.
  enum Visibility {
    VISIBILITY_UNKNOWN = 0;
    PUBLIC = 1;
    PRIVATE = 2;
    INTERNAL = 3;
  }
  Visibility visibility = 3;

  // The parent repository id if this is a fork.
  uint32 parent_id = 4;

  // The timestamp the repository was last pushed at.
  google.protobuf.Timestamp pushed_at = 5;

  // The repository's current default branch name, e.g. 'master'
  string default_branch = 6;

  // The repository's current default branch ref, eg. 'refs/heads/master'
  string default_branch_ref = 7;

  // The owner id of this repository.
  uint32 owner_id = 8;

  // Whether or not the repo is a fork
  bool is_fork = 9;

  // Whether or not the repo is archived
  bool is_archived = 10;
}
