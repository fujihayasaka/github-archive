---
version: 1
ownership:
- name: dependency-snapshots-api
  long_name: dependency-snapshots-api
  description: 'A service for storing and querying dependency submissions (colloquially:
    snapshots)'
  kind: moda
  repo: https://github.com/github/dependency-snapshots-api
  qos: experimental
  team_slack: dependency-graph
  team: github/dependency-graph
  maintainer: jovel
  exec_sponsor: aaroncathcart
  product_manager: ahpook
  dependencies:
  - dependency-graph-api
  - vitess
  - git-systems/spokes
  tier: 2
  sev1:
    slack: dg-alerts
    pagerduty: https://github.pagerduty.com/escalation_policies#P08OSWC
    issue: https://github.com/github/dependency-graph/issues
    tta: 3d
  sev2:
    slack: dg-alerts
    issue: https://github.com/github/dependency-graph/issues
    tta: 7d
  sev3:
    slack: dg-alerts
    issue: https://github.com/github/dependency-graph/issues
    tta: 14d
  support_squad:
    slack: dependency-graph
- name: go-dependency-submission
  long_name: Go Dependency Submission Action
  description: This Action instrospects on packages included in Go project builds
    triggered on the host repository, and submits a build-time dependency snapshot
    to the GitHub Dependency Submission API
  kind: artifact
  repo: https://github.com/actions/go-dependency-submission
  qos: best_effort
  team_slack: dependency-graph
  team: github/dependency-graph
  maintainer: trevrosen
  exec_sponsor: aaroncathcart
  dependencies:
  - dependency-snapshots-api
  - dependency-graph-api
  tier: 3
  sev1:
    slack: dependency-graph
    tta: 3 business days
  sev2:
    issue: https://github.com/github/dependency-graph/issues
    tta: 7 business days
  sev3:
    issue: https://github.com/github/dependency-graph/issues
    tta: 10 week
  support_squad:
    slack: support-squad-c2c
- name: component-detection-dependency-submission
  long_name: Component Detector Dependency Submission Action
  description: This Action instrospects on packages included in project builds triggered
    on the host repository, and submits a build-time dependency snapshot to the GitHub
    Dependency Submission API.
  kind: artifact
  repo: https://github.com/actions/component-detection-dependency-submission
  qos: best_effort
  team_slack: dependency-graph
  team: github/dependency-graph
  maintainer: trevrosen
  exec_sponsor: aaroncathcart
  dependencies:
  - dependency-graph-api
  - dependency-snapshots-api
  tier: 3
  sev1:
    slack: dependency-graph
    tta: 3 business days
  sev2:
    issue: https://github.com/github/dependency-graph/issues
    tta: 7 business days
  sev3:
    issue: https://github.com/github/dependency-graph/issues
    tta: 10 week
  support_squad:
    slack: support-squad-c2c
