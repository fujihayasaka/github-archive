syntax = "proto3";

package github.actions.runner_admin.entities.v1;

option ruby_package = "GitHub::ActionsRunnerAdmin::Entities::V1";

message Identity {
    // The Global Relay ID used to identify the entity in GraphQL queries.
    string global_id = 1;

    // The name of the entity (repo name/org name/enterprise name)
    string name = 2;
}