syntax = "proto3";

package github.actions.runner_admin.api.v1;

import "runner-admin/api/v1/runner_scale_set_label.proto";
import "runner-admin/entities/v1/identity.proto";

option ruby_package = "GitHub::ActionsRunnerAdmin::Api::V1";


message RunnerScaleSet {
    uint64 id = 1;
    entities.v1.Identity owner_id = 2;
    int64 group_id = 3;
    string name = 4;
    string created = 5;
    repeated RunnerScaleSetLabel labels = 6;
    RunnerSetting runner_setting = 7;
    string status = 8;
    string group_name = 9;
}

message RunnerSetting {
    bool ephemeral = 1;
    bool is_elastic = 2;
    bool disable_update = 3;
}

message RunnerScaleSetStatistics {
    int32 total_available_jobs = 1;
    int32 total_acquired_jobs = 2;
    int32 total_assigned_jobs = 3;
    int32 total_running_jobs = 4;
    int32 total_registered_runners = 5;
    int32 total_busy_runners = 6;
    int32 total_idle_runners = 7;
}