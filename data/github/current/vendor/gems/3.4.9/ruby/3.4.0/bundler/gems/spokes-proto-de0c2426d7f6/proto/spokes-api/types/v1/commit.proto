syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/attribution.proto";
import "spokes-api/types/v1/object_id.proto";

// Commit represents a Git commit.
message Commit {
    // tree is the tree identifier associated with the commit.
    github.spokes.types.v1.ObjectID tree = 1;

    // parents is the list of commits that parent the current one.
    repeated github.spokes.types.v1.ObjectID parents = 2;

    // author is who authored the commit along with a timestamp.
    github.spokes.types.v1.Attribution author = 3;

    // author is who committed the commit along with a timestamp.
    github.spokes.types.v1.Attribution committer = 4;

    // gpg_signature is the GPG signature for the commit.
    string gpg_signature = 5;

    // message contains the commit message and description as raw bytes.
    bytes message = 6;
}
