syntax = "proto3";
package git_hub.launch.services.concurrencylimitoverrides;

option go_package = "github.com/github/launch/services/deploy/concurrencylimitoverrides";

import "pbtypes/github.proto";

// ConcurrencyLimitOverrides service provides methods to manage hosted runner concurrency limits
service ConcurrencyLimitOverrides {
    // GetConcurrencyLimitOverrides retrieves the current concurrency limits for a billing owner
    rpc GetConcurrencyLimitOverrides(GetConcurrencyLimitOverridesRequest) returns (GetConcurrencyLimitOverridesResponse);
    
    // UpdateConcurrencyLimitOverrides updates concurrency limits for a billing owner
    rpc UpdateConcurrencyLimitOverrides(UpdateConcurrencyLimitOverridesRequest) returns (UpdateConcurrencyLimitOverridesResponse);
}

// ConcurrencyLimit represents a concurrency limit for a specific platform
message ConcurrencyLimit {
    // Platform type: "total" for overall limit, "macos" for macOS-specific limit
    string platform = 1;
    
    // The concurrency limit value
    int32 concurrency = 2;
}

// GetConcurrencyLimitOverridesRequest requests current concurrency limits
message GetConcurrencyLimitOverridesRequest {
    // Owner of the resources (organization or enterprise)
    pbtypes.git_hub.Identity owner_id = 1;
    
    // Billing owner ID (optional, can be determined from owner_id)
    pbtypes.git_hub.Identity billing_owner_id = 2;
}

// GetConcurrencyLimitOverridesResponse contains the current concurrency limits
message GetConcurrencyLimitOverridesResponse {
    // Whether the request was successful
    bool success = 1;
    
    // List of concurrency limits
    repeated ConcurrencyLimit limits = 2;
    
    // Error message if not successful
    string error_message = 3;
}

// UpdateConcurrencyLimitOverridesRequest updates concurrency limits
message UpdateConcurrencyLimitOverridesRequest {
    // Owner of the resources (organization or enterprise)
    pbtypes.git_hub.Identity owner_id = 1;
    
    // Billing owner ID (optional if can be determined from owner_id)
    pbtypes.git_hub.Identity billing_owner_id = 2;
    
    // List of limits to update
    repeated ConcurrencyLimit limits = 3;
}

// UpdateConcurrencyLimitOverridesResponse contains the updated limits
message UpdateConcurrencyLimitOverridesResponse {
    // Whether the update was successful
    bool success = 1;
    
    // List of updated concurrency limits
    repeated ConcurrencyLimit updated_limits = 2;
    
    // Error message if not successful
    string error_message = 3;
}
