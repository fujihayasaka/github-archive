# In general, try to match rules at https://github.com/github/actions-proto/blob/main/config/tools/generate/buf.yaml
version: v1
breaking:
  use:
    - WIRE
lint:
  use:
    - DEFAULT
  except:
    # so we don't need to prefix our directory structure and protos can just live in 'proto/'
    - PACKAGE_DIRECTORY_MATCH
  enum_zero_value_suffix: _UNKNOWN
  service_suffix: Api # github services generally end with 'Api', not 'Service'
