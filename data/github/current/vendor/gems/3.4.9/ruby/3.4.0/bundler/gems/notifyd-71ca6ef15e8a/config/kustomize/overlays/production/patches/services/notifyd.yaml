- op: replace
  path: /spec/type
  value: LoadBalancer
- op: add
  path: /metadata/annotations/moda.github.net~1domain-name
  value: notifyd-%environment%.service.%region%.github.net
- op: add
  path: /metadata/annotations/moda.github.net~1istio-ingress-enabled
  value: true
- op: replace
  path: /metadata/annotations/opaque.github.net~1checks
  value: |
      - http:
          url: https://{{.Instance.Name}}/_ping
