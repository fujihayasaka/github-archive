volumes:
  azurite-data:
services:
  mysql-server:
    image: mysql:8.0.36
    platform: linux/amd64
    container_name: olc-dev-db
    ports:
      - "${OLC_MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${OLC_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${OLC_MYSQL_DATABASE}
      - MYSQL_USER=${OLC_MYSQL_USER}
      - MYSQL_PASSWORD=${OLC_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=3232505856505856 # Set max_allowed_packet to 32M
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    restart: always
    ports:
      - "127.0.0.1:10100:10000"
      - "127.0.0.1:10101:10001"
      - "127.0.0.1:10102:10002"
    command: ["azurite-blob", "--blobHost", "0.0.0.0"]
    volumes:
      - azurite-data:/azurite/dataroot
