[package]
name = "dg-cargo-example"
version = "1.2.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "^0.8.5"
plotters = "^0.3.1"
rayon = "~1.5.1"
clap = { version = "3.1.6", features = ["derive"] }

[dev-dependencies]
serde = { version = "~1.2.3", features = ["derive"] }
serde_json = ">1.0.0, <=3"

[build-dependencies]
gif = "< 0.3.*"
aliased_time = { version = ">2.0.*, <3.5.0", package = "time" }

[target.'cfg(unix)'.dev-dependencies]
base64 = "<3.1.0, >= 1.2.2"

[target.'cfg(target_arch = "x86_64")'.build-dependencies]
aliased_bitflags = { package = "bitflags", version = "~1.1.0" }

[target.tandy-trs80-platform.dependencies]
parking_lot = ">1, <=3.4.5"
