version: 2
registries:
  ruby-ghp:
    type: rubygems-server
    url: https://rubygems.pkg.github.com/acme/github_api
    token: ${{secrets.MY_GITHUB_PERSONAL_TOKEN}}
    replaces-base: true
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    registries:
      - ruby-ghp
    schedule:
      interval: "daily"
