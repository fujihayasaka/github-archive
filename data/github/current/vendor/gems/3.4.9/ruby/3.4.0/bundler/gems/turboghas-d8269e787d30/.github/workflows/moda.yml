name: Moda

on:
  push: {}
  merge_group: {}

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  id-token: write

jobs:
  config-bundle:
    name: Config Bundle
    uses: github/internal-actions/.github/workflows/moda.yml@main
    with:
      ci-formatted-job-name: turboghas-moda-config-bundle
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
