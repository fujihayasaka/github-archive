name: Close stale pull requests

on:
  schedule:
  - cron: "0 0 * * *"

jobs:
  stale:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        days-before-stale: 30
        days-before-issue-stale: -1
        stale-pr-message: ":wave: This PR is automatically being marked as stale because there hasn't been any activity in the last 30 days! Please consider shipping it or closing it! If there isn't any activity in the next 7 days it will be closed automatically. Don't worry though: you can always re-open it once you're ready to resume development. 😅"
