services:
  turboscan:
    init: true
    privileged: true
    image: ghcr.io/github/turboscan/codespace
    container_name: turboscan-devcontainer
    ports:
      - "8888:8888"
    volumes:
      - type: volume
        source: dind-var-lib-docker
        target: /var/lib/docker # docker-in-docker keep stuff around
      - type: volume
        source: commandhistory
        target: /commandhistory
    cap_add:
      - SYS_PTRACE
volumes:
  commandhistory:
    name: turboscan-commandhistory
  dind-var-lib-docker:
    name: turboscan-dind-var-lib-docker
