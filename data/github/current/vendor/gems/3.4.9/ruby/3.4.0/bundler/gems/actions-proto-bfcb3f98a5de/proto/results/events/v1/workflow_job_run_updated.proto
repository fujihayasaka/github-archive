syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "checks/v1/annotation.proto";
import "checks/v1/status.proto";
import "checks/v1/conclusion.proto";
import "results/entities/v1/artifact.proto";
import "results/entities/v1/concurrency.proto";
import "results/entities/v1/environment.proto";
import "results/entities/v1/step.proto";

package github.actions.results.events.v1;

message WorkflowJobRunUpdated {
  // ID used to keep track of requests through each service (workflow_run_backend_id in Results)
  string plan_id = 1;
  // Used to verify order of messages, auto-incrementing of Job Level Events on Run Service side
  int64 change_order = 2;
  // CheckRun/WorkflowJobRun status
  checks.v1.Status status = 3;
  // CheckRun/WorkflowJobRun conclusion
  checks.v1.Conclusion conclusion = 4;
  // CheckRun/WorkflowJobRun start time
  google.protobuf.Timestamp started_at = 5;
  // CheckRun/WorkflowJobRun completed time
  google.protobuf.Timestamp completed_at = 6;
  // Unique ID for job, generated in Run Service (workflow_job_run_backend_id in Results)
  string job_id = 7;
  // Zero indexed job number in the workflow run
  int64 job_order_number = 8;
  // Name for the job displayed in the UI
  string display_name = 9;
  // Annotations to associate on the job
  repeated checks.v1.Annotation annotations = 10;
  // Artifacts to associate with the job
  repeated results.entities.v1.Artifact artifacts = 11;
  // Steps to associate with the job
  repeated results.entities.v1.Step steps = 12;
  // Environment of the job
  results.entities.v1.Environment environment = 13;
  // If the job was intentionally delayed (i.e. concurrency groups, runner assignment)
  bool delayed = 14;
  // Labels requested
  repeated string labels = 15;
  // ID of the job's runner
  int64 runner_id = 16;
  // Name of job's runner
  string runner_name = 17;
  // ID of the job's runner group
  int64 runner_group_id = 18;
  // Name of job's runner group
  string runner_group_name = 19;
  // Runner product sku
  string product_sku = 20;
  // When the job was queued, only sent on complete
  google.protobuf.Timestamp queued_at = 21;
  // Job key is the job identifier of a job (ie: build.__default)
  string job_key = 22;
  // Parent job ID is the name of the parent job
  string parent_job_id = 23;
  // Concurrency of the job
  results.entities.v1.Concurrency concurrency = 24;
  // If the check run is a rerun being created by cloning it from a previous susccessful run.
  bool is_cloned_from_previous_run = 25 [deprecated = true];
  // Plan ID for the previous attempt (used for partial rerun only)
  string previous_attempt_plan_id = 26;
  // Job ID for the previous attempt (used for partial rerun only)
  string previous_attempt_job_id = 27;
  // User responsible for the event that triggered the execution, e.g. issue creator or pull request opener
  uint64 invoking_user_id = 28;
  // The event which triggered the execution
  string invoking_event_type = 29;
  // The visibliity of the repository the workflow is acting on at the time of build queue
  enum RepositoryVisibility {
      REPOSITORY_VISIBILITY_UNKNOWN = 0;
      REPOSITORY_VISIBILITY_PUBLIC = 1;
      REPOSITORY_VISIBILITY_PRIVATE = 2;
      REPOSITORY_VISIBILITY_INTERNAL = 3;
  }
  RepositoryVisibility repository_visibility = 30;
  // The ID of the repository owner that the workflow is acting on
  uint64 repository_owner_id = 31;
  // The github.sha of the triggering event for the job execution
  string repository_sha = 32;
  // Path of the workflow file within the repository
  string workflow_file_path = 33;
  // User-defined optional name for the workflow file within the file
  string workflow_name = 34;
  // Id of the workflow build in launch's workflow_builds table for the workflow run
  int64 workflow_build_id = 35;
  // The operating system that the job ran on
  enum RunnerRuntime {
    RUNNER_RUNTIME_UNKNOWN = 0;
    RUNNER_RUNTIME_MACOS = 1;
    RUNNER_RUNTIME_UBUNTU = 2;
    RUNNER_RUNTIME_WINDOWS = 3;
  }
  RunnerRuntime job_runtime = 36;
  // User-defined identifier for the job within the workflow definition
  // NOTE: this is the _identifier_ in the jobs map, not the optional user-defined _name_
  // This is unique in the workflow file, but may be repeated in events due to matrix workflows
  // This is different compares to the `job_key, ie: build vs. build.__default
  string job_user_identifier = 37;
  // Total milliseconds spent in execution (completed_at - started_at)
  uint64 job_duration_ms = 38;
  // Whether the check to the billing API was successful before running the job
  bool billing_checked = 39;
  // A generic JSON blob of properties provided from the Hosted runner for the job (AzureVMSku, MachineSpec, etc)
  string runner_properties = 40;
  // The runner type that ran the job
  enum RunnerType {
      RUNNER_TYPE_UNKNOWN = 0;
      RUNNER_TYPE_SELF_HOSTED = 1;
      RUNNER_TYPE_HOSTED = 2;
      RUNNER_TYPE_CUSTOM = 3;
  }
  RunnerType runner_type = 41;
  // The global relay ID of the actual billing owner of the job
  string billing_owner_global_id = 42;  // coming from the run-service
  // Id of the workflow run that the job is associated with
  uint64 workflow_run_id = 43;
  // workflow run attempt
  int64 workflow_run_attempt = 44;
  // Id of the customer that the job is associated with for billing purposes
  uint64 customer_id = 45;
  // the URL of the stamp the workflow ran on 
  string stamp_url = 46;
  // the orchestration (go-workflows) id for the job that assigned by actions-run-service
  string orchestration_id = 47;
  // the actions-run-service cluster that orchestrates the workflow run.
  string run_service_cluster = 48;
  // the actions-run-service host that orchestrates the workflow run.
  string run_service_host = 49;
  // the actions-run-service namespace that orchestrates the workflow run.
  string run_service_namespace = 50;
  // the actions-run-service pod that orchestrates the workflow run.
  string run_service_pod = 51;
}
