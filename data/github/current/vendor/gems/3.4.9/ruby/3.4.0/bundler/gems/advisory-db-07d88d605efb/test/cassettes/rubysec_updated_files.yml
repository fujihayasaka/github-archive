        -0,0 +1,81 @@\n+---\n+gem: jquery-ui-rails\n+cve: 2022-31160\n+ghsa: h6gj-6jjq-h8g9\n+url:
        https://github.com/jquery/jquery-ui/security/advisories/GHSA-h6gj-6jjq-h8g9\n+title:\n+  jQuery
        UI vulnerable to XSS when refreshing a checkboxradio with an HTML-like\n+  initial
        text label\n+date: 2022-07-15\n+description: |\n+  ### Impact\n+  Initializing
        a checkboxradio widget on an input enclosed within a label makes\n+  that
        parent label contents considered as the input label. If you call\n+  `.checkboxradio(
        \"refresh\" )` on such a widget and the initial HTML contained\n+  encoded
        HTML entities, they will erroneously get decoded. This can lead to\n+  potentially
        executing JavaScript code.\n+\n+  For example, starting with the following
        initial secure HTML:\n+\n+  ```html\n+  <label>\n+  \t<input id=\"test-input\">\n+  \t&lt;img
        src=x onerror=\"alert(1)\"&gt;\n+  </label>\n+  ```\n+\n+  and calling:\n+\n+  ```javascript\n+  $(
        \"#test-input\" ).checkboxradio();\n+  $( \"#test-input\" ).checkboxradio(
        \"refresh\" );\n+  ```\n+\n+  will turn the initial HTML into:\n+\n+  ```html\n+  <label>\n+  \t<!--
        some jQuery UI elements -->\n+  \t<input id=\"test-input\">\n+  \t<img src=x
        onerror=\"alert(1)\">\n+  </label>\n+  ```\n+\n+  and the alert will get executed.\n+\n+  ###
        Patches\n+  The bug has been patched in jQuery UI 1.13.2.\n+\n+  ### Workarounds\n+  To
        remediate the issue, if you can change the initial HTML, you can wrap all\n+  the
        non-input contents of the `label` in a `span`:\n+\n+  ```html\n+  <label>\n+  \t<input
        id=\"test-input\">\n+  \t<span>&lt;img src=x onerror=\"alert(1)\"&gt;</span>\n+  </label>\n+  ```\n+\n+  ###
        References\n+  https://blog.jqueryui.com/2022/07/jquery-ui-1-13-2-released/\n+\n+  ###
        For more information\n+  If you have any questions or comments about this
        advisory, search for a\n+  relevant issue in [the jQuery UI repo](https://github.com/jquery/jquery-ui/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc).\n+  If
        you don''t find an answer, open a new issue.\n+cvss_v3: 6.1\n+patched_versions:\n+  -
        \">= 7.0.0\"\n+related:\n+  url:\n+    - https://github.com/jquery/jquery-ui/security/advisories/GHSA-h6gj-6jjq-h8g9\n+    -
        https://nvd.nist.gov/vuln/detail/CVE-2022-31160\n+    - https://github.com/advisories/GHSA-h6gj-6jjq-h8g9#:~:text=https%3A//nvd.nist,12/msg00015.html\n+    -
        https://blog.jqueryui.com/2022/07/jquery-ui-1-13-2-released/\n+    - https://www.drupal.org/sa-contrib-2022-052\n+    -
        https://security.netapp.com/advisory/ntap-20220909-0007/\n+    - https://lists.fedoraproject.org/archives/list/package-announce@lists.fedoraproject.org/message/6XBR3G3JR5ZIOJDO4224M3INXDS2VFDD/\n+    -
