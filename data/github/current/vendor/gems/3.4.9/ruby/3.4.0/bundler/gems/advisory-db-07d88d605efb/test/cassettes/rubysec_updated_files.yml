        -0,0 +1,46 @@\n+---\n+gem: sidekiq-unique-jobs\n+cve: 2024-25122\n+ghsa: cmh9-rx85-xj38\n+url:
        https://github.com/mhenrixon/sidekiq-unique-jobs/security/advisories/GHSA-cmh9-rx85-xj38\n+title:
        sidekiq-unique-jobs UI server vulnerable to XSS & RCE in Redis\n+date: 2024-02-13\n+description:
        |\n+  Cross site scripting (XSS) potentially exposing cookies / sessions /
        localStorage, fixed by sidekiq-unique-jobs v8.0.7.\n+\n+  ### Details\n+\n+  Specially
        crafted URL query parameters handled by any of the following endpoints of
        sidekiq-unique-jobs'' \"admin\" web UI,\n+  allow a super-user attacker, or
        an unwitting, but authorized, victim, who has received a disguised / crafted
        link,\n+  to successfully execute malicious code, which could potentially
        steal cookies, session data,\n+  or local storage data from the app the sidekiq-unique-jobs
        web UI is mounted in.\n+\n+  If your sidekiq-unique-jobs web UI is mounted
        at `/sidekiq`, the vulnerable paths and query parameters are:\n+\n+  * `/sidekiq/changelogs`\n+    *
        `filter`\n+    * `count`\n+  * `/sidekiq/locks`\n+    * `filter`\n+    * `count`\n+  *
        `/sidekiq/expiring_locks`\n+    * `filter`\n+\n+  ### Impact\n+\n+  This is
        a vulnerability of critical severity, which impacts many thousands of sites,
        since sidekiq-unique-jobs is widely deployed across the industry, with multiple
        attack vectors.\n+\n+  ### Patches\n+\n+  The fix for the XSS vulnerability
        was released in sidekiq-unique-jobs v8.0.7.\n+cvss_v3: 7.1\n+patched_versions:\n+  -
