syntax = "proto3";

package github.spokes.references.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/references";
option ruby_package = "GitHub::Spokes::Proto::References::V1";

import "spokes-api/types/v1/object_id.proto";

// UpdateRefOpVerifyUpdate represents an update to a single ref verifying the
// prior value
message UpdateRefOpVerifyUpdate {
    // before is the expected ref at the tip of the reference
    github.spokes.types.v1.ObjectID before = 1;

    // after is the value to set to reference
    github.spokes.types.v1.ObjectID after = 2;
}
