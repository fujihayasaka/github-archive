version: 0
codespaces:
  turboscan:
    repo: github/turboscan
    branch: main
    machine: premiumLinux
    network:
      ports:
        - 8888
        - 9000
  github:
    repo: github/github
    branch: master
    machine: xLargePremiumLinux
    devcontainer_path: ".devcontainer/devcontainer.json"
    network:
      ports:
        - 80
        - 9092
        - 5001
        - 18081
        - 28081
      local_ports:
        - 80:80
