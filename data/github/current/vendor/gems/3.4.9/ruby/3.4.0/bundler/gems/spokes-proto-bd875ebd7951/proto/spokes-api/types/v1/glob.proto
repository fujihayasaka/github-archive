syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// Glob represents a matcher for matching globs.
message Glob {
    // glob is the glob to match. (required)
    bytes glob = 1;
}
