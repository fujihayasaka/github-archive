apiVersion: apps/v1
kind: Deployment
metadata:
    name: osslicensecompliance-twirp
spec:
    replicas: 2
    selector:
        matchLabels:
            app: osslicensecompliance-twirp
    template:
        metadata:
            labels:
                app: osslicensecompliance-twirp
            annotations:
                observability.github.com/logger: fluent-bit
                fluentbit.io/parser: logfmt
                observability.github.com/splunk_index: osslicensecompliance
                proxy.istio.io/config: |
                  terminationDrainDuration: 25s
        spec:
            dnsPolicy: ClusterFirst
            terminationGracePeriodSeconds: 30
            containers:
                - name: osslicensecompliance-twirp
                  image: osslicensecompliance
                  command: ["/app/bin/twirp"]
                  env:
                    - name: APP_ENV
                      value: staging
                    - name: script
                      value: build
                    - name: STATS_PERIOD
                      value: "5s"
                    - name: STATS_ADDR
                      value: "$(KUBE_NODE_HOSTNAME):28125"
                    - name: APP_SHA
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.annotations['heaven.githubapp.com/sha']
                    - name: APP_REF
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.annotations['heaven.githubapp.com/ref']
                    - name: GOMAXPROCS
                      valueFrom:
                        resourceFieldRef:
                          containerName: osslicensecompliance-twirp
                          resource: limits.cpu
                  ports:
                    - name: http
                      containerPort: 8080
                      protocol: TCP
                  envFrom:
                    - configMapRef:
                        name: kube-cluster-metadata
                    - secretRef:
                        name: vault-secrets
                  resources:
                    requests:
                        cpu: "50m"
                    limits:
                        cpu: "1.0"
                  readinessProbe:
                    httpGet:
                        path: /_ping
                        port: http
                    initialDelaySeconds: 10
                    periodSeconds: 5
                  lifecycle: # Required to deal with k8s bug as per https://github.com/github/kubernetes-config-validation/blob/main/rules/docs/missing_prestop_hook.md
                    preStop:
                        exec:
                            command: ["sleep", "5"]
