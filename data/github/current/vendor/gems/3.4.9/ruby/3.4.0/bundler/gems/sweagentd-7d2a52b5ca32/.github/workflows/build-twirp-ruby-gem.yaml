name: twirp-ruby-gem

env:
  HUSKY: 0

on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  build:
    name: Build Twirp Ruby gem
    permissions:
      contents: read
      packages: write
    uses: github/monolith-twirp-tools/.github/workflows/build-and-publish-gem.yml@main
    with:
      namespace: sweagentd-proto
      module_root: proto
      publish: ${{ github.ref == 'refs/heads/main' }}
