syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// Attribute represents an attribute.
message Attribute {
    // key is the key of the attribute.
    bytes key = 1;

    // value is the value of the attribute.
    // value will be nil for an undefined attribute.
    oneof value {
        // A value has been assigned to the attribute.
        bytes byte_value = 2;

        // The attribute is set or unset (i.e. true or false)
        bool bool_value = 3;
    }
}
