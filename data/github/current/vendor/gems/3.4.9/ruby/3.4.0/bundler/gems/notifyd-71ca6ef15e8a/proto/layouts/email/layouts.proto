syntax = "proto3";

package notifyd.layouts.email;
option go_package = "proto/layouts/email";
option ruby_package = "Notifyd::Proto::Layouts::Email";

// Basic layout to render a generic email
message Basic {
  // Subject of the notification
  string subject = 1;

  // Detailed description of the notification that will be rendered in the email body
  string body = 2;

  // The address/name we would like the email to be delivered from
  From from = 3;

  // Permalink to the notification's subject. This is used for the "View on GitHub" links.
  string url = 4;

  // To address for the email
  string to = 5;

  // Email headers
  map<string, string> headers = 6;

  // Unsubscribe url templates
  UnsubscribeUrlTemplates unsubscribe_url_templates = 7;

  // Reasons to words to put in a footer
  map<string, string> reasons_to_words = 8;

  // Plain text (text/plain) version of the body
  // This will be used as a plain text alternative in the email body
  string text_body = 9;
}

// Templates for the unsubscribe URLs
message UnsubscribeUrlTemplates {
  string footer = 1;
  string header = 2;
}

// Raw layout to build emails where the different body parts have already been rendered.
message Raw {
  // Subject of the notification.
  string subject = 1;

  // Body composend of message parts.
  repeated Part body = 2;

  // The address/name we would like the email to be delivered from.
  From from = 3;

  // To address for the email.
  string to = 4;

  // Email headers.
  map<string, string> headers = 5;
}

message From {
    string email = 1;
    string name = 2;
}

// Each of the parts an email message body may be composed of
message Part {
  map<string, string> headers = 1;
  string content = 2;
}
