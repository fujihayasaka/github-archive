syntax = "proto3";

package github.actions.runner_admin.api.v1;

import "runner-admin/api/v1/concurrency.proto"; 

option ruby_package = "GitHub::ActionsRunnerAdmin::Api::V1";

service ConcurrencyService {
  rpc ListConcurrenciesForOwner(ListConcurrenciesForOwnerRequest) returns (ListConcurrenciesForOwnerResponse);
  rpc ListDefaultConcurrencies(ListDefaultConcurrenciesRequest) returns (ListDefaultConcurrenciesResponse);
}

message ListConcurrenciesForOwnerRequest {
  string global_id = 1;
}

message ListConcurrenciesForOwnerResponse {
  repeated OwnerConcurrency concurrencies = 1;
}

message ListDefaultConcurrenciesRequest {
}

message ListDefaultConcurrenciesResponse {
  repeated DefaultConcurrency concurrencies = 1;
}