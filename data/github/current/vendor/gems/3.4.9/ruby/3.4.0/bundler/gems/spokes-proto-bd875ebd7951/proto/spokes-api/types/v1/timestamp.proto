syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "google/protobuf/timestamp.proto";

// Timestamp represents an instant with time zone information.
message Timestamp {
    // timestamp is the instant from the Unix epoch.
    google.protobuf.Timestamp timestamp = 1;

    // offset is the offset in seconds from UTC.
    int32 offset = 2;
}
