syntax = "proto3";

package github.secretscanning.pull_requests.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/pull_requests";
option ruby_package = "GitHub::Proto::SecretScanning::PullRequests::V1";

import "pull_requests/v1/pull_request.proto";
import "google/protobuf/timestamp.proto";

// PullRequestsAPI defines the service to retrieve and handle pull requests for
// the Secret Scanning Service.
service PullRequestsAPI {
  // ListPullRequests retrieves a list of the pull request numbers in a repository
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);
  
  // StreamPullRequestContent streams all content associated with a pull request
  rpc StreamPullRequestContent(StreamPullRequestContentRequest) returns (stream StreamPullRequestContentResponse);
}

enum PullRequestContentType{
 UNKNOWN = 0;
 BODY = 1;
 TITLE = 2;
 COMMENT = 3;
 REVIEW = 4;
 REVIEW_COMMENT=5; 
}

message PullRequestContent {
  // content is the content to be scanned
  bytes content = 1;

  // type is which type of content we're scanning
  PullRequestContentType type = 2;

  // id is the ID of the content
  int64 id = 3;

  // revision is the revision of the content
  int64 revision = 4;
}

message StreamPullRequestContentRequest {
  // repo_id is the ID of the repository to look up (required)
  int64 repo_id = 1;

  // pull_request_number is the repo-scoped number of the PR to look up. (required)
  int64 pull_request_number = 2;

  // cursor represents an opaque object to be used to identify where to continue on a stream of pull request content
  StreamPullRequestContentResponseCursor cursor = 3;
}

message StreamPullRequestContentResponse {
  // the streamed content
  repeated PullRequestContent contents = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of pull request content.
  StreamPullRequestContentResponseCursor next_cursor = 2;
}

message StreamPullRequestContentResponseCursor {
  PullRequestContentType content_type = 1;
  repeated StreamPullRequestCursorValue cursors = 2;
}

message StreamPullRequestCursorValue {
  int64 last_id = 1;
  int64 revision = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListPullRequestsRequest {
    // repo_id is the ID of the repository to look up. (required) */
    int64 repo_id = 1;
    // cursor represents an opaque object to be used to identify where to continue on a stream of pull request numbers.
    bytes cursor = 2;
}
message ListPullRequestsResponse {
    // the identifiers for a list of pull request in this repo
    repeated PullRequestIdentifier identifiers = 1;
    // next_cursor represents an opaque object to be used to identify where to continue on a stream of pull request numbers.
    bytes next_cursor = 2;
}