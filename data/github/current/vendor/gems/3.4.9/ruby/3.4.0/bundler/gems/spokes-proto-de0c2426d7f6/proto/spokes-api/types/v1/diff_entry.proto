syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/mode.proto";
import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/path.proto";

// DiffEntry represents the diff of a blob between two trees.
message DiffEntry {
    // Status encapsulates the possible statuses a blob can have in a diff.
    enum Status {
        STATUS_INVALID = 0;
        // STATUS_ADDITION indicates that a file was added. Only the destination fields will be present.
        STATUS_ADDITION = 1;
        // STATUS_COPY indicates that a file was copied. The source fields will be the original file and the destination fields will be the new file. The score field will be filled in with Git's confidence that this was a copy and not an addition.
        STATUS_COPY = 2;
        // STATUS_DELETION indicates that a file was deleted. Only the source fields will be present.
        STATUS_DELETION = 3;
        // STATUS_MODIFICATION indicates that a file was modified, either contents or mode. The source and destination fields will all be filled in. The source path and destination path will be the same.
        STATUS_MODIFICATION = 4;
        // STATUS_RENAME indicates that a file was renamed. The source and destination fields will be filled in. The source field will be filled in with Git's confidence that this was a rename and not a deletion and addition.
        STATUS_RENAME = 5;
        // STATUS_TYPE indicates that a file's type changed. The source and destination fields will all be filled in. The source path and destination path will be the same.
        STATUS_TYPE = 6;
        // STATUS_UNMERGED indicates that a file in the index is not merged. This will never be returned by Spokes API.
        STATUS_UNMERGED = 7;
        // STATUS_UNKNOWN indicates that a change's type is not known. This is most probably a bug. Please report it!
        STATUS_UNKNOWN = 8;
    }

    // source_mode is the mode of the source blob. When status is STATUS_ADDITION, this will be nil.
    github.spokes.types.v1.Mode source_mode = 1;

    // source_oid is the object id of the source blob. When status is STATUS_ADDITION, this will be nil.
    github.spokes.types.v1.ObjectID source_oid = 2;

    // source is the path of the source blob. When status is STATUS_ADDITION, this will be nil.
    github.spokes.types.v1.Path source = 3;

    // destination_mode is the mode of the destination blob. When status is STATUS_DELETION, this will be nil.
    github.spokes.types.v1.Mode destination_mode = 4;

    // destination_oid is the object id of the destination blob. When status is STATUS_DELETION, this will be nil.
    github.spokes.types.v1.ObjectID destination_oid = 5;

    // destination is the path of the destination blob. When status is STATUS_DELETION, this will be nil.
    github.spokes.types.v1.Path destination = 6;

    // status is the status of the blob in the diff.
    Status status = 7;

    // score is the similarity of the blobs for certain statuses. This will only be filled in when status is STATUS_COPY or STATUS_RENAME. In all other cases it will be 0.
    uint32 score = 8;
}
