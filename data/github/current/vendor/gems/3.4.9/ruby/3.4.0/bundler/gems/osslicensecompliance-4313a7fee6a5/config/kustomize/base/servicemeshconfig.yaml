apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config  # name *must* be `config`
spec:
  authorization:
    create: true
    strictTLS: false

    inboundNamespaces:
    - osslicensecompliance-PLACEHOLDER  # Will be patched per environment
  loadBalancing:
    retryOnReset: true
    useLocalityLoadBalancing: true
