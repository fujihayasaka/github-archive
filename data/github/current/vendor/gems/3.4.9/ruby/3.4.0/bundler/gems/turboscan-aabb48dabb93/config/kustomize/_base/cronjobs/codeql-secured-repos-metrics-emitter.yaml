apiVersion: batch/v1
kind: CronJob
metadata:
    name: codeql-secured-repos-metrics-emitter
    annotations:
        turboscan.github.net/single-cluster: "true"
spec:
    # Run every day at 8
    schedule: "0 8 * * *"
    # we use cluster-preferences to override this for a single cluster only
    suspend: true
    concurrencyPolicy: Forbid
    jobTemplate:
        spec:
            template:
                metadata:
                    labels:
                        app: turboscan
                        role: codeql-secured-repos-metrics-emitter
                    annotations:
                        observability.github.com/logger: fluent-bit
                        fluentbit.io/parser: logfmt
                        observability.github.com/splunk_index: turboscan
                spec:
                    dnsPolicy: ClusterFirst
                    containers:
                        - name: turboscan
                          image: turboscan
                          envFrom:
                              - configMapRef:
                                    name: environment
                              - configMapRef:
                                    name: background-environment
                              - configMapRef:
                                    name: kube-cluster-metadata
                              - secretRef:
                                    name: vault-secrets
                          env:
                              - name: STATS_ADDR
                                value: "$(KUBE_NODE_HOSTNAME):28125"
                              - name: KAFKA_GROUP
                                value: "turboscan-consumer-prod"
                              - name: GOMAXPROCS
                                valueFrom:
                                    resourceFieldRef:
                                        containerName: turboscan
                                        resource: limits.cpu
                          command:
                              - /app/script/istio-job-wrapper
                              - /app/bin/turboscan
                              - cronjobs
                              - exec
                              - codeql-secured-repos-metrics
                              - --days=8
                    restartPolicy: OnFailure
            activeDeadlineSeconds: 3590
            ttlSecondsAfterFinished: 60
