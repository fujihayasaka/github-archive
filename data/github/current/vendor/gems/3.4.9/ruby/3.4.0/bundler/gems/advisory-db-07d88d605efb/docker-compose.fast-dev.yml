# Custom compose file used when we are only sideloading services for fast dev. 
# This is primarily used with the FAST_DEV_LOOP=1 env var, see README.md for details.

services:
  db:
    image: mysql@sha256:0f90283199964e9cc2a45c73ed2991da6943f416368025433932ed81007235a7
    environment:
    - MYSQL_ROOT_PASSWORD=password # Password for root access
    volumes:
    - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
    ports:
      - 3307:3306
  redis:
    image: redis:3.2
  zookeeper:
    image: zookeeper
  kafka:
    image: apache/kafka
    ports:
    - 9092:9092
    environment:
    - KAFKA_ADVERTISED_HOST_NAME=kafka
    - KAFKA_BROKER_ID=1
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
    - zookeeper
  mongo_db:
    image: docker.pkg.github.com/cveproject/cve-services/cveservices-dev:latest
    environment:
    - LOCAL_KEY=TCF25YM-39C4H6D-KA32EGF-V5XSHN3
    - MONGO_HOST=mongo_db
    - MONGO_PORT=27017
    - NODE_ENV=development
    - PORT=4000
    ports:
    - 4000:4000
volumes:
  gems:
    driver: local
  mysql-data:
    driver: local
  node-modules:
    driver: local
