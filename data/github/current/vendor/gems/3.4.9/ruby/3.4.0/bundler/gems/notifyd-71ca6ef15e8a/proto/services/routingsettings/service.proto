syntax = "proto3";

package notifyd.api.routingsettings;
option go_package = "proto/services/routingsettings";
option ruby_package = "Notifyd::Proto::RoutingSettings";

// Service to manage routing settings in Notifyd
service RoutingSettings {
    rpc Get(GetRequest) returns (GetResponse);
    rpc BatchGet(BatchGetRequest) returns (GetResponse);
    rpc BatchCreateAndDelete(BatchCreateAndDeleteRequest) returns (BatchCreateAndDeleteResponse);
    rpc BatchReplace(BatchReplaceRequest) returns (BatchReplaceResponse);
}


// Custom field of a subscription or routing setting
message CustomField {
    string name = 1;
    string value = 2;
}

// Routing settings topic
message Topic {
    string type = 1;
    string value = 2;
}

// Rule describing how to match certain attribute on the message
message MatchRule {
    string attribute = 1;
    string value = 2;
    string match_rule = 3;
}

// Filter
message Filter {
    string subject_type = 1;
    string trigger = 2;
    string reason = 3;
    repeated MatchRule match_rules = 4;
}

// Channel message definition
message Channel {
    string name = 1;
    bool enabled = 2;
}


// RoutingSetting message definition
message RoutingSetting {
    int64 id = 1;
    int32 user_id = 2;
    string name = 3;
    repeated Channel channels = 4;
    repeated Topic topics = 5;
    repeated Filter filters = 6;
    repeated CustomField custom_fields = 7;
    int64 created_at = 8;
}

// Get
// Request to get routing settings filtered by user and custom fields
message GetRequest {
    int32 user_id = 1;
    repeated CustomField filter_by_custom_fields = 2;
    Page page = 3;
}

message BatchGetRequest {
    repeated int32 user_ids = 1;
    repeated CustomField filter_by_custom_fields = 2;
    Page page = 3;
}

// Response in return to Get request
message GetResponse {
    repeated RoutingSetting routing_setting = 1;
    Pages pages = 2;
}

// BatchCreateAndDelete
// Request to create a routing setting
message CreateRequest {
    int32 user_id = 1;
    string name = 2;
    repeated Channel channels = 3;
    repeated Topic topics = 4;
    repeated Filter filters = 5;
    repeated CustomField custom_fields = 6;
}

// Request to delete routing settings by user and topics
message DeleteRequest {
    int64 id = 1;
}

// Request to create and delete multiple routing settings
message BatchCreateAndDeleteRequest {
    repeated CreateRequest to_create = 1;
    repeated DeleteRequest to_delete = 2;
}

// Response in return to CreateAndDeleteBatchRequest
message BatchCreateAndDeleteResponse {
    repeated int64 created_ids = 1;
    string error = 2;
}

// Request to replace routing settings by user and custom fields
message BatchReplaceRequest {
    int32 user_id = 1;
    repeated CustomField replace_by_custom_fields = 2;
    repeated Setting settings = 3;
}

// Response for BatchReplaceRequest operation
message BatchReplaceResponse {
    repeated int64 created_ids = 1;
}

// Request to create a setting to replace another
message Setting {
    repeated Topic topics = 1;
    repeated Filter filters = 2;
    repeated CustomField custom_fields = 3;
    repeated Channel channels = 4;
}

// Page is the pagination request parameter for Routing Settings
message Page {
    string cursor = 1;
    int64 limit = 2;
}

// Pages is the pagination response parameter for Routing Settings
message Pages {
    string next = 1; // this is the cursor to the next page
}
