apiVersion: v1
kind: Service
metadata:
  name: lab-api
  labels:
    service: dependency-graph-api-lab
    role: lab-api
  annotations:
    moda.github.net/domain-name: "dependency-graph-api-lab.service.%site%.github.net"
    moda.github.net/timeout-connect: "10"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 9596
  selector:
    app: dependency-graph-api
    role: lab-api
  type: LoadBalancer
