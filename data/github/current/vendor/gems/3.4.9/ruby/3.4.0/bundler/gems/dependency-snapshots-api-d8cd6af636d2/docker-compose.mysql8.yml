version: '3.4'
services:
  db:
    platform: linux/amd64
    image: mysql:8.4.0
    command:
      - --mysql-native-password=ON
      - --sql_mode=NO_AUTO_VALUE_ON_ZERO,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - data:/var/lib/mysql
    ports:
      - '127.0.0.1:3001:3306'
    expose:
      - 3306
    restart: always
    healthcheck:
      test: ["CMD", "mysql", "-e", "select version();"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 30s

volumes:
  data:
