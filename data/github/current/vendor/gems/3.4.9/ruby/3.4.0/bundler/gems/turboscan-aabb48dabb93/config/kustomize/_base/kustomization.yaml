patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations/moda.github.net~1vpa-updater-enabled
        value: "true"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: turboscan
    patch: |-
      - op: replace
        path: /metadata/annotations/moda.github.net~1vpa-updater-enabled
        value: "false"  

