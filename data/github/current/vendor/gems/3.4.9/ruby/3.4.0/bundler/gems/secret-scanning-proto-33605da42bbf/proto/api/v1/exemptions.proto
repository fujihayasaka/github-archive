syntax = "proto3";

package github.secretscanning.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

import "google/protobuf/timestamp.proto";
import "api/v1/shared.proto";

service ExemptionsAPI {
    // GetExemption returns the ExemptionRequest and corresponding ExemptionResponses for the given exemption request ID
    rpc GetExemption(GetExemptionRequest) returns (GetExemptionResponse);
    // GetExemptions returns a list of exemption request/response pairs for the given repo and resource ID
    rpc GetExemptions(GetExemptionsRequest) returns (GetExemptionsResponse);
}

message GetExemptionsRequest {
    // The resource ID of the Exemption in dotcom. For secret scanning, this is the ID of the secret scanning alert.
    string resource_id = 1;
    // The repository ID of the Exemption in dotcom.
    uint64 repository_id = 2;
}

message GetExemptionsResponse {
    // A list of Exemption request/response pairs.
    repeated GetExemptionResponse exemptions = 1; 
}

message GetExemptionRequest {
    uint64 exemption_request_id = 1;
}

message GetExemptionResponse {
    ExemptionRequest exemption_request = 1; 
    ExemptionResponse exemption_response = 2;
}

message ExemptionRequest {
    uint64 exemption_request_id = 1;
    google.protobuf.Timestamp created_at = 2; 
    uint64 requester_id = 3; 
    string requester_comment = 4;
    ExemptionReason reason = 5; 
    ExemptionType type = 6;

    enum ExemptionRequestStatus {
        UNKNOWN_EXEMPTION_REQUEST_STATUS = 0;
        PENDING = 1;
        COMPLETED = 2;
        REJECTED = 3;
        CANCELLED = 4;
        APPROVED = 5;
    }

    ExemptionRequestStatus status = 7;
    google.protobuf.Timestamp updated_at = 8;
}

message ExemptionResponse {
    uint64 reviewer_id = 1; 
    google.protobuf.Timestamp created_at = 2; 
    ExemptionResponseStatus status = 3;
    string message = 4;
}

enum ExemptionResponseStatus {
    UNKNOWN_EXEMPTION_RESPONSE_STATUS = 0; 
    PENDING = 1; 
    APPROVED = 2; 
    REJECTED = 3;
}

enum ExemptionType {
    UNKNOWN_EXEMPTION_TYPE = 0; 
    DELEGATED_BYPASS = 1; 
    CLOSURE_REQUEST = 2;
}
