name: Ensure Go Code is Generated

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
jobs:
  generate-go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run generate-go script
        run: |
          chmod +x script/generate-go
          ./script/generate-go

      - name: Check for changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Unexpected changes detected after generating Go code."
            git status --porcelain
            exit 1
          else
            echo "No changes detected."
          fi
permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  id-token: write
