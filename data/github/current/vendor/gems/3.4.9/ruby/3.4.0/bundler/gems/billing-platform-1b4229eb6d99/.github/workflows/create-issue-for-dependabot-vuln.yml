name: Create issues from Dependabot vulnerabilities
on:
  schedule:
    - cron: '0 15 * * *'  # Run at approximately 15:00 UTC every day
  workflow_dispatch:

permissions: {}

jobs:
  check_dependabot:
    runs-on: ubuntu-latest
    steps:     
      - name: Fetch Alerts and Create Issues
        env:
          # PAT needs
          # "Dependabot alerts" repository permissions (read)
          # https://docs.github.com/en/rest/dependabot/alerts?apiVersion=2022-11-28#list-dependabot-alerts-for-a-repository
          GH_TOKEN: ${{ secrets.MEUSE_BOT_GENERAL_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          alerts=$(gh api -X GET -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/$REPO/dependabot/alerts -f state='open')
          echo "$alerts" | jq -c '.[]' | while read -r alert; do

            number=$(echo $alert | jq -r '.number')
            summary=$(echo $alert | jq -r '.security_advisory.summary') 
            description=$(echo $alert | jq -r '.security_advisory.description')
            severity=$(echo $alert | jq -r '.security_advisory.severity' | tr '[:lower:]' '[:upper:]')
            url=$(echo $alert | jq -r '.html_url')
            repo_name=${REPO#*/}
            searchId="source_${REPO_ID}_depvuln_${number}"

            issue_title="[$severity][$repo_name] $summary | #$number"
            issue_body="# Dependabot Vulnerability Alert\n\n$url\n\n<!-- SearchID: $searchId -->\n\n## Description\n$description"
            
            existing_issues=$(gh issue list --repo github/gitcoin --search "$searchId in:body")
            if [ -z "$existing_issues" ]; then
              echo -e "$issue_body" | gh issue create --repo github/gitcoin --title "$issue_title" -l dependabot-vuln --body-file -
            else
                echo "Issues already exists for $issue_title"
            fi
          done
