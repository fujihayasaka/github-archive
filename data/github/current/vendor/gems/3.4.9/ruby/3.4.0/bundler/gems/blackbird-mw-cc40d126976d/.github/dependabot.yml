version: 2
registries:
  ghcr: # Define access for a private registry
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{secrets.CONTAINER_BUILDER_TOKEN}}

updates:
  - package-ecosystem: "gomod"
    directory: "/" # Location of package manifests
    rebase-strategy: disabled
    schedule:
      interval: "weekly"
    groups:
      minor-go-dependencies:
        # Go: Only group minor and patch updates (we want to carefully review major updates)
        update-types: [minor, patch]
    allow:
      - dependency-type: all

  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: disabled
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "github/internal-actions"

  - package-ecosystem: "docker"
    directory: "/"
    rebase-strategy: disabled
    registries:
      - ghcr # Allow version updates for dependencies in this registry
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/admin-frontend"
    rebase-strategy: disabled
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: direct
    ignore:
      - dependency-name: "styled-components" # Not compatible with @primer/react 36.10
        versions: ["6.x"]
