default: &default
  adapter: trilogy
  encoding: utf8mb4
  collation: utf8mb4_general_ci
  pool: 50
  deadlock_retries: 15
  query_retries: 1
  connection_retries: 1
  reconnect: true
  timeout: 5000
  username: <%= ENV.fetch("DEPENDENCYGRAPH_DB_USERNAME", "root") %>
  password: <%= ENV["DEPENDENCYGRAPH_DB_PASSWORD"] %>
  host: <%= ENV.fetch("DEPENDENCYGRAPH_DB_HOST", "127.0.0.1") %>

development:
  primary:
    <<: *default
    database: dependency_graph_development
  reading:
    <<: *default
    database: dependency_graph_development
    replica: true
  analytics:
    <<: *default
    database: dependency_graph_development
    replica: true


# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.

test:
  primary:
    <<: *default
    database: dependency_graph_test<%= ENV['TEST_ENV_NUMBER'] %>
  reading:
    <<: *default
    database: dependency_graph_test<%= ENV['TEST_ENV_NUMBER'] %>
    replica: true
  analytics:
    <<: *default
    database: dependency_graph_test<%= ENV['TEST_ENV_NUMBER'] %>
    replica: true

production:
  primary:
    <<: *default
    database: <%= ENV["DEPENDENCYGRAPH_DB"] %>
    host: <%= ENV["DEPENDENCYGRAPH_DB_HOST"] %>
    port: <%= ENV["DEPENDENCYGRAPH_DB_PORT"] %>
    read_timeout: <%= Rails.application.fast_api_host? ? 10 : 60 %>
    write_timeout: <%= Rails.application.fast_api_host? ? 10 : 60 %>
    reconnect: true
    deadlock_retries: 5
  <% if ENV["MYSQL_TLS_MODE"] %>
    ssl_mode: <%= Trilogy::SSL_REQUIRED_NOVERIFY %>
  <% end %>

  reading:
    <<: *default
    username: <%= ENV["DEPENDENCYGRAPH_READING_DB_USERNAME"] %>
    password: <%= ENV["DEPENDENCYGRAPH_READING_DB_PASSWORD"] %>
    database: <%= ENV["DEPENDENCYGRAPH_READING_DB"] %>
    host: <%= ENV["DEPENDENCYGRAPH_READING_DB_HOST"] %>
    port: <%= ENV["DEPENDENCYGRAPH_DB_PORT"] %>
    read_timeout: <%= Rails.application.fast_api_host? ? 10 : 60 %>
    reconnect: true
    replica: true
  <% if ENV["MYSQL_TLS_MODE"] %>
    ssl_mode: <%= Trilogy::SSL_REQUIRED_NOVERIFY %>
  <% end %>

  analytics:
    <<: *default
    username: <%= ENV["DEPENDENCYGRAPH_ANALYTICS_DB_USERNAME"] %>
    password: <%= ENV["DEPENDENCYGRAPH_ANALYTICS_DB_PASSWORD"] %>
    database: <%= ENV["DEPENDENCYGRAPH_ANALYTICS_DB"] %>
    host: <%= ENV["DEPENDENCYGRAPH_ANALYTICS_DB_HOST"] %>
    port: <%= ENV["DEPENDENCYGRAPH_DB_PORT"] %>
    read_timeout: 600
    reconnect: true
    replica: true

github:
  default: &default
    adapter: trilogy
    pool: 5
    reconnect: true
    timeout: 5000
    host: <%= ENV.fetch("GITHUB_MYSQL_HOST", "127.0.0.1") %>

  development:
    <<: *default
    database: github_development

  test:
    <<: *default
    database: github_test_dga<%= ENV['TEST_ENV_NUMBER'] %>

  production:
    <<: *default
    pool: 25
    reconnect: true
    query_retries: 1
    deadlock_retries: 3
    username: <%= ENV["GITHUB_MYSQL_USERNAME"] %>
    password: <%= ENV["GITHUB_MYSQL_PASSWORD"] %>
    host: <%= ENV["GITHUB_MYSQL_HOST"] %>
    port: <%= ENV["GITHUB_MYSQL_PORT"] %>
    database: <%= ENV["GITHUB_MYSQL_DATABASE"] %>

github_notify:
  default: &default
    adapter: trilogy
    pool: 5
    reconnect: true
    timeout: 5000
    host: <%= ENV.fetch("GITHUB_NOTIFY_MYSQL_HOST", "127.0.0.1") %>

  development:
    <<: *default
    database: github_development_notify

  test:
    <<: *default
    database: github_test_notify_dga<%= ENV['TEST_ENV_NUMBER'] %>

  production:
    <<: *default
    username: <%= ENV["GITHUB_NOTIFY_MYSQL_USERNAME"] %>
    password: <%= ENV["GITHUB_NOTIFY_MYSQL_PASSWORD"] %>
    host: <%= ENV["GITHUB_NOTIFY_MYSQL_HOST"] %>
    port: <%= ENV["GITHUB_NOTIFY_MYSQL_PORT"] %>
    database: <%= ENV["GITHUB_NOTIFY_MYSQL_DATABASE"] %>
