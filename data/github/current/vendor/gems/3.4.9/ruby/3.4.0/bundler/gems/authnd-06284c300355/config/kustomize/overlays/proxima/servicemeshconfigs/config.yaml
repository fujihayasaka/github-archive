---
apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config
spec:
  authorization:
    create: true
    inboundNamespaces:
    - "github-%stamp%"
    - "copilot-api-%stamp%"
    - "token-scanning-service-%stamp%"
    strictTLS: true
  loadBalancing:
    useLocalityLoadBalancing: true
    retryOnReset: true
