"cve-id-issued":
  "Advisory is draft, and advisory eligible for broadcast": |-
    GitHub has issued `${{CVEID}}` for this Security Advisory after reviewing it for compliance with CVE rules. Once you've published your Security Advisory, a few things will happen:

    - We'll publish the CVE to the [CVE List](https://cve.mitre.org/cve/)
    - We'll broadcast your Security Advisory via the [GitHub Advisory Database](https://github.com/advisories)
    - We'll send [security alerts](https://help.github.com/en/github/managing-security-vulnerabilities/about-security-alerts-for-vulnerable-dependencies) to all repositories that use your package (and have opted into security alerts).

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "Advisory is published, and advisory eligible for broadcast": |-
    GitHub has issued `${{CVEID}}` for this Security Advisory after reviewing it for compliance with CVE rules. Since you've already published this Security Advisory, we'll publish this CVE to the [CVE List](https://cve.mitre.org/cve/).

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "Advisory not eligible for broadcast": |-
    GitHub has issued `${{CVEID}}` for this Security Advisory after reviewing it for compliance with CVE rules. Once you've published your Security Advisory, we'll publish the CVE to the [CVE List](https://cve.mitre.org/cve/).

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
"cve-review-sla-addendum":
  "CVE issued outside of SLA addendum": |-
    NOTE: this particular CVE Request was not serviced in a timely fashion. Due to a technical issue, this request was not visible in our review queue until very recently when we identified this issue. We sincerely apologize for the inconvenience and are working to address the specific technical issue, as well as adding more visibility into our systems so we can better detect these kind of issues going forward.
"cve-id-declined":
  "Test": |-
    GitHub cannot issue a CVE for this Security Advisory, as it appears to be a test. Thanks for your interest in securing open source.
  "Request does not originate from the official repo for a project": |-
    GitHub cannot issue a CVE for this Security Advisory as it does not originate from the official repository for the software against which a CVE is being requested.   At this time, we only support package maintainers requesting CVEs from the official package repository.

    Thank you for working to make the software ecosystem more secure.
  "Request originates from a fork of the official repo": |-
    GitHub cannot issue a CVE for this Security Advisory as it does not originate from the official repository for the software against which a CVE is being requested.
    This request comes from a fork of what appears to be the official repo for the software for which a CVE is being requested.
    At this time, we only support package maintainers requesting CVEs from the official package repository.

    You can move forward by working with the admins of the official repo to create a security advisory from the official repo.

    Thank you for working to make the software ecosystem more secure.
  "Doesn't meet rules": |-
    GitHub cannot issue a CVE for this Security Advisory because it doesn't comply with one or more of the CVE rules. You can move forward in one of two ways:

    - Review the counting rules and update your Security Advisory to meet the criteria specified in the rules.
      - Specifically for this advisory, make the following change(s):
      - ???
    - Publish your GitHub Security Advisory as-is.

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "Another CNA": |-
    Project is not under GitHub's CNA scope. other-organization is the registered CVE Numbering Authority with scope over project. GitHub is only authorized to assign CVEs to open source software not under the scope of another CNA.
    Accordingly, we suggest working with the other-organization CNA to get a CVE assigned. Their registered email address is `<other CNA's email>`.
    Please email `security-advisories@github.com` if you feel that INC1 should not apply in this case and we can work with you to get a CVE assigned to this advisory.
    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
  "Private repo": |-
    GitHub cannot issue a CVE for this Security Advisory because it concerns a private repository. GitHub is only authorized to issue CVEs for libraries and products hosted on github.com in public repositories. You can move forward in one of two ways:

    - Find the [applicable CNA](https://cve.mitre.org/cve/request_id.html) for your library or product and submit a CVE request to them; if there isn't one, submit your CVE request [directly to MITRE, the root CNA](https://cveform.mitre.org/).
    - [Make your repository public](https://help.github.com/en/github/administering-a-repository/setting-repository-visibility#making-a-repository-public) and re-request a CVE from GitHub.

    Thank you for working to make the software ecosystem more secure.
  "Already a CVE for this issue": |-
    GitHub cannot issue a CVE for this Security Advisory because it appears to be a duplicate of an existing CVE: https://nvd.nist.gov/vuln/detail/CVE-2019-10759. You can move forward in one of two ways:

    - If you agree that this Security Advisory corresponds to the CVE linked above, edit your Security Advisory to include this CVE ID and then publish the advisory.
    - Otherwise, edit your Security Advisory to include a new section outlining how it differs from the CVE linked above and then re-request a CVE from GitHub.

    Thank you for making the open source ecosystem more secure by fixing and responsibly disclosing this vulnerability.
