syntax = "proto3";

package github.dependency_graph_platform.types.v1;

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/types/v1";

import "types/v1/dependency.proto";

message Manifest {
    string id = 1;
    string path = 2;
    string filename = 3;
    Ecosystem ecosystem = 4;
    repeated Dependency dependencies = 5;
}

enum Ecosystem {
    ECOSYSTEM_UNKNOWN = 0;
    ECOSYSTEM_NPM = 1;
    ECOSYSTEM_MAVEN = 2;
}
