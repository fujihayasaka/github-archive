name: Update Dependabot Secrets
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  update-secrets:
    runs-on: ubuntu-22.04
    steps:
      - name: Update Secrets
        env:
          GITHUB_TOKEN: ${{ secrets.DSP_CODE_SCANNING_TOKEN }}
        run: |
          set_secret() {
            gh secret set --repo "$GITHUB_REPOSITORY" --app dependabot "$1" --body "$2"
          }
          set_secret "CONTAINER_BUILDER_TOKEN" "${{ secrets.CONTAINER_BUILDER_TOKEN }}"
          set_secret "DATADOG_API_KEY" "${{ secrets.DATADOG_API_KEY }}"
          set_secret "DSP_CODE_SCANNING_TOKEN" "${{ secrets.DSP_CODE_SCANNING_TOKEN }}"
          set_secret "INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN" "${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}"
