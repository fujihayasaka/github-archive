apiVersion: v1
kind: Service
metadata:
  name: blackbird-admin
  labels:
    service: blackbird-admin
  annotations:
    moda.github.net/domain-name: "blackbird-admin.service.%stamp%.github.net"
    opaque.github.net/checks: |
        - http:
            url: https://{{.Instance.Name}}/ready
    # Required so that the admin UI can commuincate to each stamp's admin service
    moda.github.net/istio-ingress-enabled: "true"
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: blackbird-admin
  type: LoadBalancer
