apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/proxima

patches:
  - path: patches/shared-deployment-config.json
    target:
      kind: Deployment
  - path: patches/deployments/notifyd-api.json
    target:
      kind: Deployment
      name: notifyd-api
  - path: patches/deployments/notifyd-delete-repository-workers.json
    target:
      kind: Deployment
      name: notifyd-delete-repository-workers
  - path: patches/deployments/notifyd-delete-user-workers.json
    target:
      kind: Deployment
      name: notifyd-delete-user-workers
  - path: patches/deployments/notifyd-delete-user-repositories-workers.json
    target:
      kind: Deployment
      name:
        notifyd-delete-user-repositories-workers
  - path: patches/deployments/notifyd-delete-repository-for-users-workers.json
    target:
      kind: Deployment
      name: notifyd-delete-repository-for-users-workers
  - path: patches/deployments/notifyd-email-workers.json
    target:
      kind: Deployment
      name: notifyd-email-workers
  - path: patches/deployments/notifyd-mobile-push-workers.json
    target:
      kind: Deployment
      name: notifyd-mobile-push-workers
  - path: patches/deployments/notifyd-notify-workers.json
    target:
      kind: Deployment
      name: notifyd-notify-workers
