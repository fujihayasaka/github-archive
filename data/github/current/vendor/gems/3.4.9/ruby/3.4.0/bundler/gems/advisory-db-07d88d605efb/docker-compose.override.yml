# This file is making default executions of docker-compose override the volumes in each of our services.
# The .:/app volumes are sharing the entire working folder of our workspace with each container.
# This allows for the container to live update code and not be rebuilt every time, and is necessary because
# we develop and execute tests inside of containers even when developing.
# CI scripts use DOCKER_COMPOSE to specify a different set of files which means this will not be used by CI. 
# https://docs.docker.com/compose/extends/#understanding-multiple-compose-files
services:
  bootstrap:
    volumes:
      - ".:/app"
  throttle:
    volumes:
      - ".:/app"
  primary_hydro_processor:
    volumes:
      - ".:/app"
  web:
    volumes:
      - ~/.pry_history:/root/.pry_history
      - ".:/app"
  webpack:
    volumes:
      - ".:/app"
  worker:
    volumes:
      - ".:/app"
  scheduler:
    volumes:
      - ".:/app"
