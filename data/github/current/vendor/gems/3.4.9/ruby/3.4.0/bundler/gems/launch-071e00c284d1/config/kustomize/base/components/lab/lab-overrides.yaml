- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: LAUNCH_ENV
    value: lab
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: CHATOPS_AUTH_BASE_URL
    value: https://launch-chatops-lab.service.iad.github.net
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DEPLOYER_TWIRP_ADDR
    value: https://launch-deployer-lab.service.iad.github.net
# Note that embedded variables MYSQL_DEPLOYER_RO_USER, etc.
# are typically provided by the "envFrom: ... vault-secrets" directive.
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: READ_ONLY_DATABASE_URL
    value: $(MYSQL_DEPLOYER_RO_USER):$(MYSQL_DEPLOYER_RO_PASS)@tcp(vtgate-launch.vitess-production.service.github.net:3306)/launch_ks@replica?parseTime=true&collation=utf8mb4_bin
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DATABASE_URL
    value: $(MYSQL_DEPLOYER_RW_USER):$(MYSQL_DEPLOYER_RW_PASS)@tcp(vtgate-launch.vitess-production.service.github.net:3306)/launch_ks@master?parseTime=true&collation=utf8mb4_bin
