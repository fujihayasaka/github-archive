syntax = "proto3";

package github.spokes.merges.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/merges";
option ruby_package = "GitHub::Spokes::Proto::Merges::V1";

import "google/protobuf/empty.proto";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";
import "spokes-api/types/v1/transaction_context.proto";

import "spokes-api/types/selectors/v1/merge_object_selector.proto";
import "spokes-api/types/selectors/v1/none_selector.proto";
import "spokes-api/types/selectors/v1/repo_object_id_selector.proto";

import "spokes-api/merges/v1/merge_base_type.proto";
import "spokes-api/merges/v1/merge_conflict.proto";


// MergesAPI contains APIs for merge-related Git operations.
service MergesAPI {
    // FindMergeBases computes one or all of the merge bases between two commits
    // using a specified algorithm.
    rpc FindMergeBases(FindMergeBasesRequest) returns (FindMergeBasesResponse);

    // MergeTrees merges two treeish heads and returns either the merged tree
    // OID or a list of conflicts generated by the merge. Rename detection is
    // disabled by default.
    rpc MergeTrees(MergeTreesRequest) returns (MergeTreesResponse);
}

message FindMergeBasesRequest {
    // repository is the repository to operate on.
    github.spokes.types.v1.Repository repository = 1;

    github.spokes.types.v1.RequestContext request_context = 2;

    // base_oid is the base object ID to operate on.
    github.spokes.types.v1.ObjectID base_oid = 3;

    // head_oid is the head object ID to operate on.
    oneof head_oid {
        github.spokes.types.v1.ObjectID head_object_id = 4;
        github.spokes.types.selectors.v1.RepoObjectIDSelector repo_head_object_id = 5;
    }

    // merge_base_type is the type of merge base computation to perform.
    MergeBaseType merge_base_type = 6;
}

message FindMergeBasesResponse {
    // bases are the resultant bases.
    repeated github.spokes.types.v1.ObjectID bases = 1;
}

message MergeTreesRequest {
    // repository is the repository to operate on.
    github.spokes.types.v1.Repository repository = 1;

    github.spokes.types.v1.RequestContext request_context = 2;

    // base_selector is which treeish to use for the left side of the merge.
    github.spokes.types.selectors.v1.MergeObjectSelector base_selector = 3;

    // head_selector is which treeish to use for the right side of the merge.
    github.spokes.types.selectors.v1.MergeObjectSelector head_selector = 4;

    // merge_base is the merge base to use; if it is not provided, one will be
    // computed. If base_selector and/or head_selector select a treeish that is
    // *not* a commitish and "none" is specified for the merge base, we cannot
    // resolve the merge base and an error is returned.
    oneof merge_base {
        // merge_base_selector is a selector for picking a merge base treeish.
        github.spokes.types.selectors.v1.MergeObjectSelector merge_base_selector = 5;

        // merge_base_none represents an unspecified merge base, indicating that
        // one should be computed as part of the merge.
        github.spokes.types.selectors.v1.NoneSelector merge_base_none = 6;
    }

    message MergeTreesOptions {
        // mergeability_only indicates that the merge should be performed
        // without persisting any new objects in the repository. This is useful
        // for performing test merges where the resultant tree is not needed by
        // the client.
        bool mergeability_only = 1;

        // include_conflict_details indicates that, in addition to reporting a
        // conflicted merge status, the response should include details about
        // which files are conflicted.
        bool include_conflict_details = 2;
    }

    // options is the set of options used to customize the behavior of the
    // merge. If unspecified, all values use their default behavior.
    MergeTreesOptions options = 7;

    // (Optional) resolutions is a list of merge conflict resolutions that determine how
    // conflicts at particular paths should be resolved. During a conflict, the
    // path will be replaced with content referenced by the provided blob OID.
    repeated MergeConflict.TreeEntry resolutions = 8;
}

message MergeTreesResponse {
    enum Status {
        STATUS_INVALID = 0;
        STATUS_SUCCESS = 1;
        STATUS_MERGE_CONFLICT = 2;
        STATUS_ALREADY_MERGED = 3;
    }

    // transaction_context contains the updated state after performing the
    // write.
    github.spokes.types.v1.TransactionContext transaction_context = 1;

    // merge_status indicates the status of the merge operation.
    Status merge_status = 2;

    message MergeConflictResult {
        // entries are the individual path conflicts in the merge.
        repeated MergeConflict entries = 1;
    }

    oneof result {
        // oid is the object ID of the merged tree if the merge was successful.
        // Note that we return the OID of the successful merge in a
        // "mergeability only" request, but that OID is *not* persisted in the
        // repository and should be used for client-side auditing purposes only.
        github.spokes.types.v1.ObjectID oid = 3;

        // conflicts represents the merge conflicts, if any, that prevented the
        // merge from succeeding. Limited to 500 entries, only included when
        // `include_conflict_details` is enabled.
        MergeConflictResult conflicts = 4;

        // none represents an intentionally empty result (e.g., due to an
        // "already merged" status).
        google.protobuf.Empty none = 5;
    }
}
