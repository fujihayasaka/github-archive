apiVersion: v1
kind: Service
metadata:
  name: notifyd
  labels:
    service: notifyd
  annotations:
    opaque.github.net/checks: >
      - http:
          url: http://{{.Instance.Name}}:8080/_ping
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: notifyd-api
  type: ClusterIP
