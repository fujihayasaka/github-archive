<%
  schema_prefix = ""
  table_name_prefix = ""
  if ENV["ENTERPRISE"] == "1"
    schema_prefix = "enterprise_"
    table_name_prefix = "dependabot_"
  end 
%>

default: &default
  adapter: trilogy
  encoding: utf8mb4
  collation: utf8mb4_general_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  username: root
  password:
  url: <%= ENV["DATABASE_URL"] %>
  reconnect: true
  deadlock_retries: 3
  timeout: 5000
  schema_dump: <%= "#{schema_prefix}structure.sql"  %>
  table_name_prefix: <%= table_name_prefix %>

development:
  primary:
    <<: *default
    database: <%= "#{schema_prefix}dependabot_development" %>
  reading:
    <<: *default
    database: <%= "#{schema_prefix}dependabot_development" %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: <%= "#{schema_prefix}dependabot_test" %>
  reading:
    <<: *default
    database: <%= "#{schema_prefix}dependabot_test" %>

<% if ENV["MYSQL_DB"] %>
production:
  primary:
    adapter: trilogy
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
    database: <%= ENV["MYSQL_DB"] %>
    username: <%= ENV["MYSQL_USER"] %>
    password: <%= ENV["MYSQL_PASS"] %>
    host: <%= ENV["MYSQL_HOST"] %>
    port: <%= ENV["MYSQL_PORT"] %>
    reconnect: true
    ssl_mode: <%= ENV["DATABASE_SSL_MODE"] %>
  reading:
    adapter: trilogy
    encoding: utf8mb4
    collation: utf8mb4_general_ci
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
    database: <%= ENV["MYSQL_READING_DB"] %>
    username: <%= ENV["MYSQL_READING_USER"] %>
    password: <%= ENV["MYSQL_READING_PASS"] %>
    host: <%= ENV["MYSQL_READING_HOST"] %>
    port: <%= ENV["MYSQL_READING_PORT"] %>
    reconnect: true
    replica: true
    ssl_mode: <%= ENV["DATABASE_SSL_MODE"] %>
<% end %>
