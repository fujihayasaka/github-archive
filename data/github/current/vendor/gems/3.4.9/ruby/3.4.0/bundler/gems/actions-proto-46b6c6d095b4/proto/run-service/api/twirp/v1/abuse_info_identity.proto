syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

message AbuseInfoIdentity {
    // the global id of the identity
    string id = 1;
    // the name of the identity
    string name = 2;
    // the type of the identity (user, repo, org, enterprise)
    string type = 3;
    // the billing plan of the identity
    string plan = 4;
    // when the identity was created at
    string created_at = 5;
    // whether the identity is hammy (flagged by dotcom)
    bool is_hammy = 6;
}
