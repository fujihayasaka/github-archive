# Our default dev setup uses containers as the base environment for all development. It's a bit slow,
# but it closely matches our production environment. If you're tired of waiting for containers to build,
# try FAST_DEV_LOOP=1 (search README.md !).

services:
  db:
    image: mysql@sha256:0f90283199964e9cc2a45c73ed2991da6943f416368025433932ed81007235a7
    environment:
    - MYSQL_ALLOW_EMPTY_PASSWORD=1
    volumes:
    - mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
  redis:
    image: redis:3.2
  bootstrap:
    build:
      context: "."
      cache_from:
      - octofactory.githubapp.com/github-golden-docker/github-advisory-db:advisory-db
      target: base
    image: advisory-db
    environment:
    - NODE_ENV
    - RAILS_ENV
    - BUNDLE_RUBYGEMS__PKG__GITHUB__COM
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
  web:
    image: advisory-db
    environment:
    - ADVISORY_DB_ROLE=web
    - GITHUB_THROTTLE_OPEN=1
    - HYDRO_KAFKA_BROKERS=kafka:9092
    - NODE_ENV
    - RAILS_ENV
    - CODESPACES
    - REDIS_URL=redis://redis:6379/0
    ports:
    - 3000:3000
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
    depends_on:
    - db
    - redis
    - bootstrap
    - worker
    - scheduler
    - throttle
    - primary_hydro_processor
    - webpack
  worker:
    image: advisory-db
    command: bin/resqued config/resqued.rb
    environment:
    - ADVISORY_DB_ROLE=worker
    - WORKER_COUNT=2
    - HYDRO_KAFKA_BROKERS=kafka:9092
    - RAILS_ENV
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
    depends_on:
    - db
    - redis
    - bootstrap
  scheduler:
    image: advisory-db
    command: bin/rake resque:scheduler
    environment:
    - ADVISORY_DB_ROLE=scheduler
    - RAILS_ENV
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
    depends_on:
    - db
    - redis
    - bootstrap
  throttle:
    image: advisory-db
    command: bin/rake advisory_db:throttle_github
    environment:
    - ADVISORY_DB_ROLE=throttle
    - GITHUB_THROTTLE_OPEN=1
    - RAILS_ENV
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
    depends_on:
    - redis
    - bootstrap
  primary_hydro_processor:
    image: advisory-db
    command: bin/rake advisory_db:primary_hydro_processor
    environment:
    - ADVISORY_DB_ROLE=primary_hydro_processor
    - HYDRO_KAFKA_BROKERS=kafka:9092
    - RAILS_ENV
    - REDIS_URL=redis://redis:6379/0
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
    depends_on:
    - kafka
    - redis
    - bootstrap
  zookeeper:
    image: zookeeper
  kafka:
    image: apache/kafka
    ports:
    - 9092:9092
    environment:
    - KAFKA_ADVERTISED_HOST_NAME=kafka
    - KAFKA_BROKER_ID=1
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
    depends_on:
    - bootstrap
    - zookeeper
  webpack:
    image: advisory-db
    command: yarn start
    environment:
    - NODE_ENV=development
    volumes:
    - gems:/usr/local/bundle
    - node-modules:/app/node_modules
    depends_on:
    - bootstrap
  mongo_db:
    # use a mongo image that most closely matches the DocumentDB API
    image: mongo:3.6.20-xenial
    environment:
    - MONGO_HOST=mongo_db
    - MONGO_PORT=27017
    ports:
    - 27017:27017
  cve_services:
    image: docker.pkg.github.com/cveproject/cve-services/cveservices-dev:latest
    environment:
    - LOCAL_KEY=TCF25YM-39C4H6D-KA32EGF-V5XSHN3
    - MONGO_HOST=mongo_db
    - MONGO_PORT=27017
    - NODE_ENV=development
    - PORT=4000
    depends_on:
    - mongo_db
    ports:
    - 4000:4000
volumes:
  gems:
    driver: local
  mysql-data:
    driver: local
  node-modules:
    driver: local
