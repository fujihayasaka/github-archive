permissions:
  contents: write

name: Syft detection of dependencies
on:
  push:
jobs:
  syft-detection:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          dependency-snapshot: true
