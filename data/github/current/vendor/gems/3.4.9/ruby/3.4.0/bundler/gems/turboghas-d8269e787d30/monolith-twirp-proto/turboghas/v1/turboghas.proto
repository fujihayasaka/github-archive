syntax = "proto3";

package code_scanning.turboghas.v1;

import "turboghas/v1/enums.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/github/turboghas/internal/monolith_twirp/turboghas/v1";
option ruby_package = "MonolithTwirp::CodeScanning::Turboghas::V1";

service TurboghasAPI {
  rpc FindUsersByEmails(FindUsersByEmailsRequest) returns (FindUsersByEmailsResponse); // Fetch users by their email addresses.
  rpc GetBillableUsers(GetBillableUsersRequest) returns (GetBillableUsersResponse); // Fetch advanced security eligible users.
  rpc GetEntities(GetEntitiesRequest) returns (GetEntitiesResponse); // Fetch advanced security entities info.
  rpc GetRepositories(GetRepositoriesRequest) returns (GetRepositoriesResponse); // Fetch advanced security related repositories info.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse); // Fetch advanced security related users info.
}

message FindUsersByEmailsRequest {
  repeated bytes emails = 1;
  uint64 business_id = 2;
  uint64 repository_id = 3;
  google.protobuf.Timestamp pushed_at = 4;
}

message FindUsersByEmailsResponse {
  message User {
    bytes email = 1;
    uint64 id = 2;
    string login = 3;
    google.protobuf.Timestamp created_at = 4;
  }
  repeated User users = 1;
}

message GetBillableUsersRequest {
  uint64 owner_id = 1;
}

message GetBillableUsersResponse {
  uint64 billable_entity_id = 1;
  EntityType billable_entity_type = 2;
  repeated uint64 user_ids = 3;
}

enum UserType {
  USER_TYPE_INVALID = 0;
  USER_TYPE_ORGANIZATION = 1;
  USER_TYPE_USER = 2;
}

message GetRepositoriesResponse {
  message Entity {
    uint64 id = 1;
    EntityType type = 2;
  }

  message Repository {
    Entity entity = 1;
    int32 advanced_security_enabled = 2;
    uint64 owner_id = 3;
    string name = 4;
    bool is_archived = 5;
    bool is_public = 6;
    GetUsersResponse.User owner = 7;
  }

  map<uint64, Repository> repositories = 1;
}

message GetRepositoriesRequest {
  repeated uint64 repository_ids = 1;
}

message GetUsersRequest {
  repeated uint64 user_ids = 1;
}

message GetUsersResponse {
  message User {
    string login = 1;
    UserType type = 2;
    bool is_enterprise_managed = 3;
    google.protobuf.Timestamp created_at = 4;
  }

  map<uint64, User> users = 1;
}

message GetEntitiesRequest {
  message Entity {
    uint64 id = 1;
    EntityType type = 2;
  }

  repeated Entity entities = 1;
}

message GetEntitiesResponse {
  message Entity {
    uint64 id = 1;
    EntityType type = 2;
    repeated uint64 user_ids = 3;
  }

  repeated Entity entities = 1;
}
