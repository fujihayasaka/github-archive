syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/mode.proto";
import "spokes-api/types/v1/object.proto";
import "spokes-api/types/v1/path.proto";

// TreeEntry represents an entry when traversing Git trees.
message TreeEntry {
    // mode is the mode of the entry.
    github.spokes.types.v1.Mode mode = 1;

    // object is the object type and identifier.
    github.spokes.types.v1.Object object = 2;

    // path is the path of the entry.
    github.spokes.types.v1.Path path = 3;
}
