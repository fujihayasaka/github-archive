---
name: Proxima Fanout Status
description: Proxima Fanout Effort Weekly Update
body:
- type: dropdown
  attributes: 
    label: Weekly Status Update
    options: 
    - label: "🟢 Green (all good, on track to complete this quarter)"
      value: "🟢 Green"
    - label: "🟡 Yellow (some concerns, but under control and still expect to complete this quarter)"
      value: "🟡 Yellow"
    - label: "🔴 Red (blocked,help needed to complete this quarter)"
      value: "🔴 Red"
    - label: "➖ Gray (not started)"
      value: "➖ Gray"
    - label: "⚫ Black (shipped)"
      value: "⚫ Black"
- type: input
  attributes:
    label: Target date
    format: date
- type: textarea
  attributes:
    label: Updates
    placeholder: Description of any relevant updates for this week. 
- type: textarea
  attributes: 
    label: Details
    placeholder: If your status is yellow or red, please add details on what issues have been encountered, what steps are required to unblock, and any other relevant details. 
