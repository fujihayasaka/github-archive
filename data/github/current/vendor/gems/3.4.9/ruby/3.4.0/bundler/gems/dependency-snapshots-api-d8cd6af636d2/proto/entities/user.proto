syntax = "proto3";

package github.dependency_snapshots_api.entities;

option go_package = "proto/entities";

// https://github.com/github/hydro-schemas/blob/4ef6cc71bf61f6900931cd963db74694a6e03d7e/proto/hydro/schemas/github/v1/entities/user.proto

message User {
  // The id of the user.
  uint32 id = 1;

  // The login of the user (with the tenant prefix if there is one).
  string login = 2;

  // The login of the user without the tenant prefix.
  string display_login = 3;

  enum Type {
    UNKNOWN = 0;
    USER = 1;
    ORGANIZATION = 2;
    BOT = 3;
    PROGRAMMATIC_ACCESS_BOT = 4;
  }
  // The type of the user account.
  Type type = 4;
}
