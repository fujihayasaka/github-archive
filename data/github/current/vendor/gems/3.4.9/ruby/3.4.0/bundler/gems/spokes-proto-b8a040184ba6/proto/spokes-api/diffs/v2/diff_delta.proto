syntax = "proto3";

package github.spokes.diffs.v2;

option go_package = "github.com/github/spokes-proto/gen/go/v2/diffs";
option ruby_package = "GitHub::Spokes::Proto::Diffs::V2";

import "spokes-api/types/v1/diff_status.proto";
import "spokes-api/types/v1/tree_entry.proto";

// DiffDelta is the information about each of the deltas in a diff, including
// before and after state.
message DiffDelta {
    // old_tree_node represents the state in the old file.
    github.spokes.types.v1.TreeEntry old_tree_node = 1;

    // new_tree_node represents the state in the new file.
    github.spokes.types.v1.TreeEntry new_tree_node = 2;

    // diff_status represents whether the file was added, removed, copied, etc.
    github.spokes.types.v1.DiffStatus diff_status = 3;

    // similarity represents the percentage of similarity.  It is a value
    // between 0 and 100 and applies only to renames.
    optional uint32 similarity = 4;
}
