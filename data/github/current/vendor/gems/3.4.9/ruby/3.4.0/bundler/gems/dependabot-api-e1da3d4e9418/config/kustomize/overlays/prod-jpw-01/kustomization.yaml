apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespaces/dependabot-api-prod-jpw-01.yaml
  - ./servicemeshconfigs/config.yaml
  - ../../base/
patches:
  - path: ./configmaps/environment.yaml
  - path: ./deployments/api.yaml
  - path: ./deployments/aqueduct-resqued-worker.yaml
  - path: ./deployments/aqueduct-throttled-resqued-worker.yaml
  - path: ./deployments/chatops.yaml
  - path: ./deployments/dependabot-internal.yaml
  - path: ./deployments/github-action-compute-usage-consumer.yaml
  - path: ./deployments/installation-create-consumer.yaml
  - path: ./deployments/installation-delete-consumer.yaml
  - path: ./deployments/installation-repositories-added-consumer.yaml
  - path: ./deployments/installation-repositories-removed-consumer.yaml
  - path: ./deployments/repository-commit-status-created-consumer.yaml
  - path: ./deployments/repository-dependency-update-cleaned-up-consumer.yaml
  - path: ./deployments/repository-push-config-file-consumer.yaml
  - path: ./deployments/repository-push-consumer.yaml
  - path: ./deployments/update-graph-event.yaml
  - path: ./deployments/vulnerability-alert-create.yaml
  - path: ./deployments/vulnerability-alert-resolve-request.yaml
  - path: ./deployments/vulnerability-updates-disabled-consumer.yaml
  - path: ./deployments/vulnerability-updates-enabled-consumer.yaml
  - path: ./services/api.yaml
  - path: ./services/dependabot-chatops.yaml
  - path: ./services/dependabot-internal.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirst
  - target:
      group: batch
      version: v1
      kind: Job
    patch: |-
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirst
