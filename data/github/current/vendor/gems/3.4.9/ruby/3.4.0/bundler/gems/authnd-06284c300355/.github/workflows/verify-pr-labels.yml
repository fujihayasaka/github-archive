# This workflow will verify PR labels to confirm
# that they are in a mergable state.
# currently verifies that PRs don't have label signifying running migrations
# https://github.com/marketplace/actions/label-checker-for-pull-requests

name: Validate PR Labels
on:
  pull_request:
    types:
      - labeled
      - unlabeled

jobs:
  validate_labels:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://agilepathway/pull-request-label-checker:latest
        with:
          none_of: migration:skeefree:queued
          repo_token: ${{ secrets.CONTAINER_BUILDER_TOKEN }}