syntax = "proto3";

package github.spokes.transactions.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/transactions";
option ruby_package = "GitHub::Spokes::Proto::Transactions::V1";

import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";
import "spokes-api/types/v1/transaction_context.proto";

// TransactionsAPI contains APIs for managing Spokes API write transactions.
service TransactionsAPI {
    // BeginTransaction starts a transaction by creating a quarantine directory
    // into which new objects will be written. Returns the created
    // transaction_state.
    rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

    // CommitTransaction commits an active transaction by committing the
    // quarantine objects to the main repository. Returns the updated
    // transaction_state.
    rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

    // RollbackTransaction cancels a transaction by removing the active
    // quarantine and all of the objects it contains.
    rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);
}

message BeginTransactionRequest {
    // repository is the repository to operate on.
    github.spokes.types.v1.Repository repository = 1;

    // request_context contains the current transaction_state, which is used to
    // configure the creation of a new transaction
    github.spokes.types.v1.RequestContext request_context = 2;
}

message BeginTransactionResponse {
    // transaction_context is the updated state after beginning the transaction.
    github.spokes.types.v1.TransactionContext transaction_context = 1;
}

message CommitTransactionRequest {
    // repository is the repository to operate on.
    github.spokes.types.v1.Repository repository = 1;

    // request context must include transaction state, which identifies the
    // quarantine to commit.
    github.spokes.types.v1.RequestContext request_context = 2;
}

message CommitTransactionResponse {
    // transaction_context is the updated state after committing the
    // transaction.
    github.spokes.types.v1.TransactionContext transaction_context = 1;
}

message RollbackTransactionRequest {
    // repository is the repository to operate on.
    github.spokes.types.v1.Repository repository = 1;

    // request context must include transaction state, which identifies the
    // quarantine to roll back.
    github.spokes.types.v1.RequestContext request_context = 2;
}

message RollbackTransactionResponse {
    // transaction_context is the updated state after rolling back the
    // transaction.
    github.spokes.types.v1.TransactionContext transaction_context = 1;
}
