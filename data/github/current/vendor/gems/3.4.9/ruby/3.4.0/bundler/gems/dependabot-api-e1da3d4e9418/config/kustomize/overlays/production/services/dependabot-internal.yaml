apiVersion: v1
kind: Service
metadata:
    annotations:
        moda.github.net/domain-name: dependabot-internal-%environment%.service.%site%.github.net,dependabot-internal-%environment%.service.%region%.github.net
        moda.github.net/istio-ingress-enabled: "true"
        moda.github.net/load-balancer-glb-scope: iad
        opaque.github.net/checks: |
            - check_interval: 1m
              http:
                url: https://{{.Instance.Name}}/_ping
    labels:
        role: api
        service: dependabot-internal
    name: dependabot-internal
spec:
    ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: http
    selector:
        app: dependabot-internal
        role: api
    type: LoadBalancer
