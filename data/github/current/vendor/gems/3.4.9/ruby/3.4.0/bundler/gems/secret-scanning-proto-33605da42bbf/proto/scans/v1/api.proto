syntax = "proto3";

package github.secretscanning.scans.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/scans";
option ruby_package = "GitHub::Proto::SecretScanning::Scans::V1";

import "api/v1/shared.proto";
import "types/v1/token_metadata.proto";

import "google/protobuf/timestamp.proto";

service ScansAPI {
    // AddBypass adds a bypass for a scan
    rpc AddBypass(github.secretscanning.scans.v1.AddBypassRequest) returns (github.secretscanning.scans.v1.AddBypassResponse);
    // PromoteBypass adds a bypass for a bypass placeholder
    rpc PromoteBypass(github.secretscanning.scans.v1.PromoteBypassRequest) returns (github.secretscanning.scans.v1.PromoteBypassResponse);
    // GetBypassPlaceholders gets a bypass placeholder from the database
    rpc GetBypassPlaceholder(github.secretscanning.scans.v1.GetBypassPlaceholderRequest) returns (github.secretscanning.scans.v1.GetBypassPlaceholderResponse);
}

message PromoteBypassRequest {
    // the database id of the owner_scope
    uint64 owner_id = 1;
    // owner scope applicable to this owner_id
    github.secretscanning.v1.OwnerScope owner_scope = 2;
    // database id of the actor creating this bypass
    uint64 actor_id = 3;

    // any additional metadata to be stored with the bypass
    string notes = 4;

    // bypass reason
    BypassReason reason = 5;

    // this is expected for future enhancements, but for now this should be null and the expiration should be set
    // within the token-scanning-service.
    google.protobuf.Timestamp expire_at = 6;

    // ksuid of the bypass placeholder to promote into a bypass
    string placeholder_ksuid = 7;
}

message PromoteBypassResponse {
    Bypass bypass = 1;
}

message GetBypassPlaceholderRequest {
    // the database id of the owner_scope
    uint64 owner_id = 1;
    // owner scope applicable to this owner_id
    github.secretscanning.v1.OwnerScope owner_scope = 2;
    // ksuid of the placeholder record in the database
    string placeholder_ksuid = 3;
  }

message GetBypassPlaceholderResponse {
    BypassPlaceholder placeholder = 1;
}
  
message BypassPlaceholder {
    // the database id of the placeholder
    uint64 id = 1;
    // created at date
    google.protobuf.Timestamp created_at = 2;
    // the token signature associated with the bypass
    string signature = 3;
    // the token type associated with the bypass
    string token_type = 4;
    // the owner ID for this bypass
    uint64 owner_id = 5;
    // the owner scope for this bypass
    github.secretscanning.v1.OwnerScope owner_scope = 6;
    // the friendly unique identifier for the placeholder
    string ksuid = 7;
    // the token metadata for this bypass
    github.secretscanning.types.v1.TokenMetadata token_metadata = 8;
    // the id of the actor that created this bypass placeholder
    uint64 actor_id = 9;
}

message AddBypassResponse {
    Bypass bypass = 1;
}

message AddBypassRequest {
    // the database id of the owner_scope
    uint64 owner_id = 1;
    // owner scope applicable to this owner_id
    github.secretscanning.v1.OwnerScope owner_scope = 2;
    // database id of the actor creating this bypass
    uint64 actor_id = 3;
    // the type of token this bypass will be applied to
    string token_type = 4;
    // the token signature of the bypass
    string signature = 5;
    // any additional metadata to be stored with the bypass
    string notes = 6;

    // bypass reason
    BypassReason reason = 7;

    // this is expected for future enhancements, but for now this should be null and the expiration should be set
    // within the token-scanning-service.
    google.protobuf.Timestamp expire_at = 8;

}

enum BypassReason {
    UNKNOWN = 0;
    FALSE_POSITIVE = 1;
    WILL_FIX_LATER = 2;
    USED_IN_TESTS = 3;
}

message Bypass {
    // the database ID of this bypass
    uint64 id = 1;
    // timestamp this bypass was created
    google.protobuf.Timestamp created_at = 2;
    // database id of the actor that created this bypass
    uint64 created_by_id = 3;
    // the date this bypass was updated last
    google.protobuf.Timestamp updated_at = 4;
    // database id of the actor that upated this bypass last
    uint64 updated_by_id = 5;
    // the database id of the owner_scope
    uint64 owner_id = 6;
    // owner scope applicable to this owner_id
    github.secretscanning.v1.OwnerScope owner_scope = 7;
    // when this bypass will expire
    google.protobuf.Timestamp expire_at = 8;
    // the type of token this bypass will be applied to
    string token_type = 9;
    // the token resolution that will be applied, if possible, on token creation inside incremental scan
    BypassReason reason = 10;
    // any notes included during bypass creation
    string notes = 11;
    // any additional metadata to be stored with the bypass
    string signature = 12;
}
