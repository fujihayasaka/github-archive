apiVersion: apps/v1
kind: Deployment
metadata:
  name: zuora-batch-emission-handler
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "canary"
spec:
  selector:
    matchLabels:
      canary: "production"
  template:
    metadata:
      labels:
        canary: "production"
    spec:
      dnsPolicy: ClusterFirst
      containers:
      - name: zuora-batch-emission-handler
        env:
        - name: DAILY_EMISSION_CUSTOMER_IDS
          value: "9576408,10296845,5068038,1344544"
        - name: MONTHLY_EMISSION_CUSTOMER_IDS
          value: "9576408,10296845,5068038,1344544"