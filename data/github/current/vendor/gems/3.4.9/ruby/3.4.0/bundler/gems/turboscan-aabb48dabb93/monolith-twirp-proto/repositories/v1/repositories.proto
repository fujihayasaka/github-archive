syntax = "proto3";

package code_scanning.repositories.v1;

option go_package = "monolith_twirp/repositories/v1";
option ruby_package = "MonolithTwirp::CodeScanning::Repositories::V1";

service RepositoriesAPI {
	rpc FindRepositories(FindRepositoriesRequest) returns (FindRepositoriesResponse);
}

message FindRepositoriesRequest {
	repeated int64 ids = 1;
}

message FindRepositoriesResponse {
	map<int64, Repository> repositories_by_id = 1;
}

enum Visibility {
	VISIBILITY_INVALID = 0;
	VISIBILITY_PUBLIC = 1;
	VISIBILITY_PRIVATE = 2;
	VISIBILITY_INTERNAL = 3;
}

message Repository {
	uint32 id = 1;
	uint32 organization_id = 2;
	bool code_scanning_enabled = 3;
	bytes default_branch_ref = 4;
	Visibility visibility = 5;
}
