syntax = "proto3";

package github.actions.run_service.contracts.v1;
option ruby_package = "GitHub::ActionsRunService::Contracts::V1";

import "run-service/contracts/v1/gate.proto";

message Environment {
  string global_id = 1;
  int64 database_id = 2;
  string name = 3;
  repeated github.actions.run_service.contracts.v1.Gate gates = 4;
}