syntax = "proto3";

package github.actions.run_service.contracts.v1;
option ruby_package = "GitHub::ActionsRunService::Contracts::V1";

// Gate 
message Gate {
  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_TIMEOUT = 1;
    TYPE_REMOTE = 2;
  }

  string global_id = 1;
  int64 database_id = 2;
  Type gate_type = 3;
  int32 timeout_in_minutes = 4;
}