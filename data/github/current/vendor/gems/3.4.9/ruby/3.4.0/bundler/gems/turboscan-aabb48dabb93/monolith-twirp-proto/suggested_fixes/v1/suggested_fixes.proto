syntax = "proto3";

package code_scanning.suggested_fixes.v1;

option go_package = "monolith_twirp/suggested_fixes/v1";
option ruby_package = "MonolithTwirp::CodeScanning::SuggestedFixes::V1";

service SuggestedFixesAPI {
  rpc SuggestedFixStateChanged(SuggestedFixStateChangedRequest) returns (SuggestedFixStateChangedResponse); // Used to inform PR UI and/or alert UIs that state changed for the suggested fixes associated with the given alerts
}

message SuggestedFixStateChangedRequest {
  uint64 repository_id = 1;
  uint64 pull_request_id = 2;
  repeated uint32 alert_numbers = 3;
}

message SuggestedFixStateChangedResponse {}
