apiVersion: v1
kind: Service
metadata:
  name: ims-aqueduct-redis
spec:
  ports:
  - port: 6379
    nodePort: 28140
  selector:
    app: ims-aqueduct-redis
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ims-aqueduct-redis
spec:
  selector:
    matchLabels:
      app: ims-aqueduct-redis
  template:
    metadata:
      labels:
        app: ims-aqueduct-redis
    spec:
      containers:
      - image: redis:7.0.4
        command:
          - "redis-server"
          - "--save"
          - "60"
          - "1"
          - "--loglevel"
          - "warning"
        name: ims-aqueduct-redis
        ports:
        - containerPort: 6379
          name: redis
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 15
          periodSeconds: 2
          timeoutSeconds: 1
        volumeMounts:
        - name: ims-aqueduct-redis-data
          mountPath: /data
      volumes:
      - name: ims-aqueduct-redis-data
        persistentVolumeClaim:
          claimName: ims-aqueduct-redis-pv-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ims-aqueduct-redis-pv-claim
spec:
  storageClassName: manual
  volumeName: ims-aqueduct-redis-pv-vol
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ims-aqueduct-redis-pv-vol
spec:
  storageClassName: manual
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/ims-aqueduct-redis-data