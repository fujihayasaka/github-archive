syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

import "run-service/api/twirp/v1/abuse_info.proto";
import "google/protobuf/timestamp.proto";

message GitHubEventInfo {
    // opaque data for MMS to handle abuse detection
    AbuseInfo abuse_info = 1;

    // customer label we applied to the repository, ex: none, github, top100
    string customer_label = 2;

    // the global id of the actor that triggers the workflow run
    string invoking_user_id = 3;

    // the name of the actor that triggers the workflow run
    string invoking_user_name = 4;
    
    // the database id of the actor that triggers the workflow run
    int64 invoking_user_database_id = 5;
    
    // the triggering github event
    string invoking_event_type = 6;
    
    // the repository ref associate with the triggering event
    string invoking_event_ref = 7;
    
    // the repository sha associate with the triggering event
    string invoking_event_sha = 8;

    // the time the event was triggered
    google.protobuf.Timestamp invoking_event_time = 9;
}
