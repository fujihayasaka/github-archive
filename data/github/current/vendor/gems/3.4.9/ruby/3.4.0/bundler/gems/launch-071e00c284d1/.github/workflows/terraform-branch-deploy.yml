name: Terraform Branch Deploy

on:
  issue_comment:
    types: [created]

# Sentinel requires permissions to be defined in every workflow
# Copied from https://github.com/github/ABS/blob/152bf365213c5f98497aab0f1fd2d230f00d81cc/.github/workflows/branch-deploy.yml#L52C1-L56C15
permissions: write-all
  # pull-requests: write
  # deployments: write
  # contents: write
  # checks: read
  # statuses: write


jobs:
  terraform-branch-deploy:
    uses: github/abs/.github/workflows/branch-deploy.yml@branch-deploy-updates
    with:
      working-directory: config/terraform
      default-environment: lab # Default to lab and require an explicit `.deploy <env>` for all other envs
      environment-targets: lab, production, prod-ae-01, prod-cus-01, prod-sdc-01, prod-weu-01, staff-wus2-01, test-cnc-01
      terraform-version: 1.7.0
      use-environment-subfolder: true
      stable-branch: ${{ github.event.repository.default_branch }}
    secrets:
      # Team API token for the azure-launch organization owners team
      # To rotate this token:
      # 1. Rotate the token via the UI at https://terraform.githubapp.com/app/azure-launch/settings/teams/team-VET1tEuN9CFtnYo4
      #      Choose a date about one year out.  Avoid major holidays.
      # 2. Update the TF_API_TOKEN secret at https://github.com/github/launch/settings/secrets/actions
      # 3. Update the corresponding TF_API_TOKEN secret at https://github.com/github/launch/settings/secrets/dependabot
      # 4. Create a PR to update:
      #    - the reminder date in /.github/dependabot.yml
      #    - the reminder date on the line below

      # Expires February 28, 2026
      tfe-token: ${{ secrets.TF_API_TOKEN }}
