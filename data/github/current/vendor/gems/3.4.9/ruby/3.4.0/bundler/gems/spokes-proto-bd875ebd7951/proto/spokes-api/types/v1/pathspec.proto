syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

import "spokes-api/types/v1/pattern.proto";

// Pathspec represents [Git pathspecs](https://git-scm.com/docs/gitglossary#Documentation/gitglossary.txt-aiddefpathspecapathspec)
// to filter paths in a Git repository.
message Pathspec {
    repeated PathspecItem items = 1;
}

message PathspecItem {
    repeated github.spokes.types.v1.Pattern patterns = 1;

    enum PatternType {
        PATTERN_TYPE_INVALID = 0;
        // Paths relative to the directory prefix will be matched against that pattern using fnmatch(3);
        // in particular, * and ? can match directory separators.
        PATTERN_TYPE_WILDCARD = 1;
        // Wildcards in the pattern such as * or ? are treated as literal characters.
        PATTERN_TYPE_LITERAL = 2;
        // Git treats the pattern as a shell glob suitable for consumption by fnmatch(3)
        // with the FNM_PATHNAME flag: wildcards in the pattern will not match a / in the pathname.
        PATTERN_TYPE_GLOB = 3;
    }

    PatternType pattern_type = 2;

    bool ignore_case = 3;
    bool exclude = 4;
}
