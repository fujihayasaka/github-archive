syntax = "proto3";
package github.actions.run_service.api.twirp.v1;
option ruby_package = "GitHub::ActionsRunService::Api::Twirp::V1";

import "run-service/api/twirp/v1/abuse_info_identity.proto";
import "run-service/api/twirp/v1/target_repository.proto";

message AbuseInfo {
    string workflow_execution_id = 1;
    string workflow_file_path = 2;
    uint32 target_repository_tier = 3;
    string trigger_event = 4;
    string trigger_event_action = 5;
    AbuseInfoIdentity actor = 6;
    AbuseInfoIdentity target_repo_owner = 7;
    AbuseInfoIdentity billing_plan_owner = 8;
    TargetRepository target_repository = 9;
    // The workflow run database ID
    int64 workflow_run_id = 10;
    // Combined with workflow_execution_id to uniquely identify a job
    string job_run_external_id = 11;
}
