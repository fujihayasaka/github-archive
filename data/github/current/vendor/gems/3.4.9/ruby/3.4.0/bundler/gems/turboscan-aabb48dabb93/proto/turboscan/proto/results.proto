message EvalRefUpdateRulesRequest {
  uint64 repository_id = 1;
  bytes base_ref_bytes = 2;
  string head_commit_oid = 3;
  string merge_commit_oid = 4;
  repeated FileChange file_changes = 5;
  repeated RuleConfig rule_configs = 6;
  bool is_dependabot = 7;

  message RuleConfig {
    repeated ToolConfig tool_configs = 1;
  }

  message ToolConfig {
    string name = 1;
    SeverityChoice alerts_threshold = 2;
    SecuritySeverityChoice security_alerts_threshold = 3;
  }

  enum SeverityChoice {
    SEVERITY_NONE = 0;
    SEVERITY_ERRORS = 1;
    SEVERITY_ERRORS_AND_WARNINGS = 2;
    SEVERITY_ALL = 3;
  }

  enum SecuritySeverityChoice {
    SECURITY_SEVERITY_NONE = 0;
    SECURITY_SEVERITY_CRITICAL = 1;
    SECURITY_SEVERITY_HIGH_OR_HIGHER = 2;
    SECURITY_SEVERITY_MEDIUM_OR_HIGHER = 3;
    SECURITY_SEVERITY_ALL = 4;
  }
}

message EvalRefUpdateRulesResponse {
  repeated EvalResult results = 1;

  message EvalResult {
    bool passed = 1;
    string failure_message = 2;
  }
}

