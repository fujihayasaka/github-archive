  uint32 limit = 3;
}

message AlertConfigurationStatus {
  bytes ref_name_bytes = 1;
  string category = 2;
  string tool = 3;
  // created_at(_oid) may be null if we cannot determine when the alert was
  // first detected for this configuration
  google.protobuf.Timestamp created_at = 4;
  string created_at_oid = 5;
  // fixed_at(_oid) will be null if the alert is not fixed in this configuration
  google.protobuf.Timestamp fixed_at = 6;
  string fixed_at_oid = 7;
}

