  uint32 alert_number = 2; // required
  uint32 limit = 4;
  uint32 numeric_page = 5;
  bool skip_pagination = 6;
  bool branches_only = 7;
  bool no_count = 8;
  repeated bytes ref_names_bytes = 9;
}

message AlertInstancesResponse {
