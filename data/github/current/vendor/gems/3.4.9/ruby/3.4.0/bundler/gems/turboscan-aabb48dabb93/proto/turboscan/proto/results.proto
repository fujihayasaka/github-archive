  repeated AlertConfigurationStatus statuses = 1;
}

enum SearchStatus {
  STATUS_OK = 0;
  STATUS_INTERNAL_ERROR = 1;
  STATUS_NOT_CONFIGURED = 2;
  STATUS_INVALID_QUERY = 3;
}

message AlertsByRepoRequest {
