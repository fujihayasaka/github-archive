message CreateDeliveryRequest {
  message ZipTooBig {
    string max = 1;
  }
  message SarifTooBig {
    string max = 1;
  }
  message InvalidSarif {
    string message = 1;
  }
  message InvalidZip {
    bool empty = 1;
  }
  reserved 7, 18;
  uint64 repository_id = 1; // required
  string repository_nwo = 2;
  bytes ref = 3; // required
  string commit_oid = 4; // required
  string sarif_id = 5; // required
  string request_id = 6;
  string analysis_key = 8;
  string environment = 9;
  string checkout_uri = 10;
  google.protobuf.Timestamp build_started_at = 11;
  uint64 workflow_run_id = 12;
  int64 workflow_run_attempt = 25;
  google.protobuf.Timestamp upload_started_at = 13; // required
  google.protobuf.Timestamp upload_finished_at = 14; // required
  google.protobuf.Timestamp hydro_enqueued_at = 15; // required
  string sarif_path = 16; // required
  uint64 source_repository_id = 17;
  OutdatedConfiguration outdated_configuration = 19;
  bool rejected = 20;
  oneof error {
    ZipTooBig zip_too_big_error = 21;
    SarifTooBig sarif_too_big_error = 22;
    InvalidSarif invalid_sarif_error = 23;
    InvalidZip invalid_zip_error = 24;
  }
  string head_commit_oid = 26;
}

