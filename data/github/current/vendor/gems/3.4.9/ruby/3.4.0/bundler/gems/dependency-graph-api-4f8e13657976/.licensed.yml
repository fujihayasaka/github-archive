    - mime-types
    - nokogiri
    - kgio
    - digest-crc
    - cgi
    - excon
    - bigdecimal
    - reline
    - base64
    - rdoc
    - ruby-prof
    - stringio
    - strscan
    - net-http
    - uri
    - logger
    - racc
    - benchmark
    - securerandom
    - timeout
