syntax = "proto3";

package github.actions.run_service.environments.v1;

option ruby_package = "GitHub::ActionsRunService::Environments::V1";

import "run-service/contracts/v1/environment.proto";

// EnvironmentsAPI defines the service to retrieve and create Dotcom environments for Run Service.
service EnvironmentsAPI {
  // GetEnvironment retrieves an environment from Dotcom.
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);

  // CreateEnvironment creates an environment with idempotency in Dotcom.
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
}

message GetEnvironmentRequest {
  string repository_global_id = 1;
  string name = 2;
}

message GetEnvironmentResponse {
  github.actions.run_service.contracts.v1.Environment environment = 1;
}

message CreateEnvironmentRequest {
  string repository_global_id = 1;
  string name = 2;
}

message CreateEnvironmentResponse {
  github.actions.run_service.contracts.v1.Environment environment = 1;
}