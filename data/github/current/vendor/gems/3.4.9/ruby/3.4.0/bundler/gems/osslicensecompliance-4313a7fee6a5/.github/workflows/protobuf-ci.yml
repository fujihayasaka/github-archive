name: Buf CI
on:
  # Apply to all pull requests
  pull_request:

permissions:
  id-token: write
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Buf CI setup
        uses: bufbuild/buf-setup-action@daa9cf30fe9bd54ad25b1ba278e88bdb8ab0730b
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Buf Breaking Change Detection
        uses: bufbuild/buf-breaking-action@346c1819a73a9c835707ace754ae8243aaadf2a9
        with:
          input: proto
          against: 'https://github.com/github/osslicensecompliance.git#branch=main,subdir=proto'

      - name: Buf Lint
        uses: bufbuild/buf-lint-action@f083debe706775d9342e791bd05644d8bdb56e11
        with:
          input: proto

      - name: Authenticate with goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: Setup go
        uses: actions/setup-go@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: osslicensecompliance
          password: ${{ secrets.CONTAINER_BUILDER_TOKEN }}

      - name: Generate proto buf code
        run: "./script/protobuf-gen"

      - name: Commit code
        uses: stefanzweifel/git-auto-commit-action@e256565ae56ff1c64fad2e063453107bf88f6aa1
        with:
          commit_message: Generated protobuf code
