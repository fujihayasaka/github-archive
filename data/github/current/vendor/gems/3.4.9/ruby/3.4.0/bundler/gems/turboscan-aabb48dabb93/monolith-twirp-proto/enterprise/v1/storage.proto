syntax = "proto3";

package code_scanning.enterprise.v1;

option go_package = "monolith_twirp/enterprise/v1";
option ruby_package = "MonolithTwirp::CodeScanning::Enterprise::V1";

service StorageAPI {
  rpc Hosts(HostsRequest) returns (HostsResponse);
}

message HostsRequest {
}

message HostsResponse {
  repeated string least_loaded = 1;
}
