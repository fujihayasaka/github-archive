# http://kubernetes.io/docs/user-guide/services
apiVersion: v1
kind: Service

metadata:
  name: launch-hydro-consumer
  labels:
    service: launch-hydro-consumer
  annotations:
    moda.github.net/istio-ingress-enabled: "true"

spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 6824
  type: LoadBalancer
  selector:
    service: launch-hydro-consumer
