services:
  builder-base:
    build:
      context: .
      target: builder-base
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder-base
      secrets:
        - apt-auth-conf
        - pkg-mirror-host
    image: dependabot-api-builder-base

  builder:
    build:
      context: .
      target: builder
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder-base
      # Currently doesn't call `apt`, so no need for secrets
    image: dependabot-api-builder

  run:
    build:
      context: .
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder
        - octofactory.githubapp.com/github-golden-docker/github-dependabot-api:dependabot-api-builder-base
      secrets:
        - apt-auth-conf
        - pkg-mirror-host
    image: dependabot-api

secrets:
  apt-auth-conf:
    file: ./apt-auth-conf
  pkg-mirror-host:
    file: ./pkg-mirror-host
