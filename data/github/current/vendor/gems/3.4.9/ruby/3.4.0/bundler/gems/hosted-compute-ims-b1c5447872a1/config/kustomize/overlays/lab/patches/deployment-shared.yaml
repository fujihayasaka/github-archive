- op: add
  path: /spec/selector/matchLabels/role
  value: lab
- op: add
  path: /spec/template/metadata/labels/role
  value: lab
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: ENVIRONMENT
    value: "lab"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HTTP_PROXY
    value: "network-proxy.service.github.net:3128"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: HTTPS_PROXY
    value: "network-proxy.service.github.net:3128"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: NO_PROXY
    value: "*.github.net,*.cluster.local"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AQUEDUCT_API_KEY_VERSION
    value: "0"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AQUEDUCT_APP
    value: "hosted-compute-ims-lab"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: AQUEDUCT_URL
    value: "https://aqueduct-gateway-production.service.iad.github.net"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: FEATURE_FLAGS_SUPPORTED_STAMPS
    value: "dotcom"