- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: LAUNCH_ENV
    value: production
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: LAUNCH_IS_MULTI_TENANT
    value: "true"
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: CHATOPS_AUTH_BASE_URL
    value: https://launch-chatops.service.%stamp%.github.net
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DEPLOYER_TWIRP_ADDR
    value: http://launch-deployer.launch-%stamp%.svc.cluster.local:80
# Note that embedded variables MYSQL_DEPLOYER_RO_USER, etc.
# are typically provided by "envFrom:" directives.
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: READ_ONLY_DATABASE_URL
    value: $(MYSQL_DEPLOYER_RO_USER):$(MYSQL_DEPLOYER_RO_PASS)@tcp(db-mysql-$(STAMP_SHORTNAME)-ro.service.%stamp%.github.net:3306)/launch?parseTime=true&collation=utf8mb4_bin
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: DATABASE_URL
    value: $(MYSQL_DEPLOYER_RW_USER):$(MYSQL_DEPLOYER_RW_PASS)@tcp(db-mysql-$(STAMP_SHORTNAME)-rw.service.%stamp%.github.net:6033)/launch?parseTime=true&collation=utf8mb4_bin
