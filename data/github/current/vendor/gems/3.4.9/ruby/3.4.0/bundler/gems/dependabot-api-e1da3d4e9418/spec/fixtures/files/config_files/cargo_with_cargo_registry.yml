version: 2
registries:
  github-acme:
    type: cargo-registry
    registry: cargo-registry-name
    url: https://cargo.example.com/path
    token: ${{secrets.MY_CARGO_TOKEN}}
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    registries:
      - github-acme
    schedule:
      interval: "daily"
