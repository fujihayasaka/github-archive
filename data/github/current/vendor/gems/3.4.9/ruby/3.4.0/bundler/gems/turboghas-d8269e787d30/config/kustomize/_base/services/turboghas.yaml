apiVersion: v1
kind: Service
metadata:
  name: turboghas
  annotations:
    moda.github.net/domain-name: turboghas-%environment%.service.%region%.github.net
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: >
      - http:
          url: https://{{.Instance.Name}}/_ping
  labels:
    service: turboghas
spec:
  ports:
    - name: http
      port: 8866
      protocol: TCP
      targetPort: http
  selector:
    app: turboghas
    role: twirp
  type: LoadBalancer
