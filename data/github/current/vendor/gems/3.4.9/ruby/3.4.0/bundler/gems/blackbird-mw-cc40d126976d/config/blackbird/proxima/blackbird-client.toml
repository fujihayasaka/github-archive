[metrics.exporter]
type = "noop"

[kafka]
security_protocol = "ssl"
ca_bundle = "/etc/ssl/certs/ca-certificates.crt"
brokers = "hydro-kafka-blackbird-%stamp%-%stamp%.service.%stamp%-az1.consul:9093,hydro-kafka-blackbird-%stamp%-%stamp%.service.%stamp%-az2.consul:9093,hydro-kafka-blackbird-%stamp%-%stamp%.service.%stamp%-az3.consul:9093"
group_suffix = "001"

[cluster.zeta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.zeta"

[cluster.eta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.eta"

# Not used in proxima, helpful for not having to special case the valid clusters in blackbird-mw
[cluster.theta]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.theta"

# Not used in proxima, helpful for not having to special case the valid clusters in blackbird-mw
[cluster.iota]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.iota"
allow_zero_offset_shards = true

# Not used in proxima, helpful for not having to special case the valid clusters in blackbird-mw
[cluster.kappa]
index_dir = "/data/blackbird/idx"
assignment_topic_base = "blackbird.v0.kappa"
allow_zero_offset_shards = true

# Not used in proxima, helpful for not having to special case the valid clusters in blackbird-mw
[cluster.lambda]
index_dir = "/data/blackbird/idx"
