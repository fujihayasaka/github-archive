syntax = "proto3";

import "google/protobuf/empty.proto";

package notifyd.api.maintenance;
option go_package = "proto/services/maintenance";
option ruby_package = "Notifyd::Proto::Maintenance";

// Maintenance service API
service Maintenance {
  // Delete all the subscriptions and settings related to a repository.
  rpc DeleteRepository(DeleteRepositoryRequest) returns (google.protobuf.Empty);
  // Delete all the subscriptions and settings related to a repository for a set of users.
  rpc DeleteRepositoryForUsers(DeleteRepositoryForUsersRequest) returns (google.protobuf.Empty);
  // Delete all the subscriptions and settings for a user.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
  // Delete all the subscriptions and settings related to a set of repositories for a user.
  rpc DeleteUserRepositories(DeleteUserRepositoriesRequest) returns (google.protobuf.Empty);
}

message DeleteRepositoryRequest {
  int64 repository_id = 1;
}

message DeleteRepositoryForUsersRequest {
  int64 repository_id = 1;
  repeated int64 user_ids = 2;
}

message DeleteUserRequest {
  int64 user_id = 1;
}

message DeleteUserRepositoriesRequest {
  int64 user_id = 1;
  repeated int64 repository_ids = 2;
}
