[package]
name = "spokes-proto"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.13"
prost-wkt-types = "0.6"
serde = { version = "1.0", features = ["derive"] }
twirp = "0.9.1"

[build-dependencies]
glob = "0.3.1"
prost-build = "0.13"
twirp-build = "0.9.0"

[package.metadata.cargo-machete]
ignored = ["prost", "prost-wkt-types", "serde", "twirp"]
