syntax = "proto3";

package github.spokes.attributes.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/attributes";
option ruby_package = "GitHub::Spokes::Proto::Attributes::V1";

import "spokes-api/types/v1/path.proto";
import "spokes-api/types/v1/repository.proto";
import "spokes-api/types/v1/request_context.proto";

import "spokes-api/types/selectors/v1/key_selector.proto";
import "spokes-api/types/selectors/v1/treeish_selector.proto";
import "spokes-api/types/selectors/v1/universal_selector.proto";

import "spokes-api/attributes/v1/attribute_item.proto";

// AttributesAPI contains APIs for attribute-related Git operations.
service AttributesAPI {
    // ReadAttributes returns a list of attributes for the specified paths in a
    // treeish.
    rpc ReadAttributes(ReadAttributesRequest) returns (ReadAttributesResponse);
}

message ReadAttributesRequest {
    // repository is the repository to scope the attributes to.
    github.spokes.types.v1.Repository repository = 1;

    github.spokes.types.v1.RequestContext request_context = 2;

    // selector is which tree to select for.
    oneof selector {
        // treeish_selector selects a tree by its treeish.
        github.spokes.types.selectors.v1.TreeishSelector treeish_selector = 3;
    }

    // paths is the list of paths to read the attributes from.
    // A maximum of 1000 paths can be read per request.
    repeated github.spokes.types.v1.Path paths = 4;

    oneof keys_selector {
        // universal_selector selects all attributes for the treeish and path.
        github.spokes.types.selectors.v1.UniversalSelector universal_selector = 5;

        // key_selector selects individual attributes by their keys for the
        // treeish and path.
        github.spokes.types.selectors.v1.KeySelector key_selector = 6;
    }
}

message ReadAttributesResponse {
    // attribute_items is the list of attributes for each path in the treeish.
    repeated AttributeItem attribute_items = 1;
}
