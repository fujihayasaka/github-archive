syntax = "proto3";

package github.actions.run_service.contracts.v1;
option ruby_package = "GitHub::ActionsRunService::Contracts::V1";

import "google/protobuf/timestamp.proto";

message GateRequest {
  // https://github.com/github/github/blob/6f552b20c7bc79342d6b40418a95866b0eebeeb3/packages/actions/app/models/gate_request.rb#L5
  enum State {
    STATE_UNKNOWN = 0;
    STATE_CLOSED = 1;
    STATE_OPEN = 2;
    STATE_REJECTED = 3;
  }

  // Global ID of the Gate in gh/gh
  string gate_global_id = 1;
  // Unique ID of the job (generated by run service/orchestration)
  string workflow_job_run_backend_id = 2;
  // The state of the gate request
  State state = 3;
  // If the gate request is concluded
  bool concluded = 4;
  // The time that the gate request expires at
  google.protobuf.Timestamp expires_at = 5;
}
