name: Dependency Graph API CI - Actions

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  merge_group:

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read
  id-token: write
  attestations: write

jobs:
  #############
  # Default Simple jobs
  #############
  default-simple-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependency-graph-api', 'cibuild_script': 'cibuild'}]
    uses: github/internal-actions/.github/workflows/default_simple.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      timeout: 15
      cibuild-script: 'script/${{ matrix.ci_job.cibuild_script }}'
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Default Simple jobs (self hosted runner)
  #############
  default-simple-jobs-self-hosted:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependency-graph-api-package-manager-adapters', 'cibuild_script': 'cibuild-dependency-graph-api-package-manager-adapters'}]
    uses: github/internal-actions/.github/workflows/default_simple.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      timeout: 20
      runner-config: build-systems-default-small
      cibuild-script: 'script/${{ matrix.ci_job.cibuild_script }}'
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Moda jobs
  #############
  moda-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependency-graph-api-moda-config-bundle'}]
    uses: github/internal-actions/.github/workflows/moda.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Docker Image jobs
  #############
  docker-image-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependency-graph-api-docker-image'}]
    uses: github/internal-actions/.github/workflows/kube.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      timeout: 15
      vault-keys: ${{ vars.VAULT_KEYS }}
      attest: true
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Docker Security jobs
  #############
  docker-security-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependency-graph-api-docker-security'}]
    uses: github/internal-actions/.github/workflows/docker_security.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      timeout: 15
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}

  #############
  # Monolith-twirp jobs
  #############
  monolith-twirp-jobs:
    name: ${{ matrix.ci_job.job }}
    strategy:
      fail-fast: false
      matrix:
        ci_job: [{'job': 'dependency-graph-api-monolith-twirp'}]
    uses: github/internal-actions/.github/workflows/monolith_twirp.yml@main
    with:
      ci-formatted-job-name: ${{ matrix.ci_job.job }}
      vault-keys: ${{ vars.VAULT_KEYS }}
    secrets:
      dx-bot-token: ${{ secrets.INTERNAL_ACTIONS_DX_BOT_ACCOUNT_TOKEN }}
      datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
