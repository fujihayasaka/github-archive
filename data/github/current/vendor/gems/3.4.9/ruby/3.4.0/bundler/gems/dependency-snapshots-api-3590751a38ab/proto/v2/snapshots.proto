syntax = "proto3";

import "entities/pull_request.proto";
import "entities/push.proto";
import "entities/repository.proto";
import "entities/user.proto";
import "google/protobuf/timestamp.proto";

package github.dependency_snapshots_api.v2;

option go_package = "proto/v2";

// Collection of operations dedicated to finding, creating, and retrieving
// Snapshots. Snapshots are moment-in-time captures of a sets of dependencies.
// Dependency sets can be related to a single file (a manifest), a set of related
// files, or something like a specific build target.
service Snapshots {
  rpc AsyncCreateSnapshot(AsyncCreateSnapshotRequest)
      returns (AsyncCreateSnapshotResponse);
}

message AsyncCreateSnapshotRequest {
  // The `sha` field from the snapshot payload
  string sha = 1;

  // The `ref` field from the snapshot payload
  string ref = 2;

  // The timestamp representing the `scanned` field from the snapshot payload
  google.protobuf.Timestamp scanned_at = 3;

  // snapshot_payload is the raw bytes of the JSON request that was sent to
  // the GitHub API to create the snapshot.
  bytes snapshot_payload = 4;

  // Metadata about the repository at the time of the snapshot
  entities.Repository repository = 5;

  // Metadata about the owner of the repository
  entities.User repository_owner = 6;

  // The timestamp representing the time we received the snapshot
  // (either ingest time, or the time the snapshot was submitted to the API)
  google.protobuf.Timestamp received_at = 7;

  // Metadata about the push associated with the snapshot's `sha` and `ref`.
  // Optional.
  entities.Push push = 8;

  // Metadata about the pull request associated with the snapshot's `sha` and
  // `ref`. Optional.
  entities.PullRequest pull_request = 9;
}

message AsyncCreateSnapshotResponse {}
