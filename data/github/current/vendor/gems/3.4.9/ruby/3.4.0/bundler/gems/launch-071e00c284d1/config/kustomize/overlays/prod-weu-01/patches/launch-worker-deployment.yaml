# http://kubernetes.io/docs/user-guide/deployments/#what-is-a-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
    name: launch-worker
spec:
    replicas: 2
    template:
        metadata:
            # Labels are applied to all pods created by this deployment so we can
            # tell the service load balancer where to send traffic.
            # http://kubernetes.io/docs/user-guide/labels/
            labels:
                service: launch-worker
        spec:
            dnsPolicy: ClusterFirst
            containers:
                - name: launch-worker
                  resources:
                    requests:
                        # Recommendations: https://app.datadoghq.com/s/59fe6c40c/3u4-9um-6rk
                        cpu: "1000m"
                        memory: "512Mi"
                    limits:
                        # Adjust GOMAXPROCS in tandem. It's recommended the cpu limit be set to GOMAXPROCS+1.
                        cpu: "3"
                        memory: "1Gi"
                  envFrom:  # order matters! Subsequent entries can override earlier entries.
                    - configMapRef:
                        name: kube-cluster-metadata
                    - secretRef:
                        name: vault-secrets
                    - configMapRef:
                        name: static-config
                  env:
                    - name: KUBE_POD
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                    - name: KUBE_NAMESPACE
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                    - name: INTERNAL_ADDR
                      value: ":6824"
                    - name: HTTP_PROXY
                      value: "network-proxy.service.%stamp%.github.net:3128"
                    - name: HTTPS_PROXY
                      value: "network-proxy.service.%stamp%.github.net:3128"
                    - name: NO_PROXY
                      value: "github.net,github.com,*.cluster.local,*.blob.core.windows.net"
                    - name: LAUNCH_REDIS_URL
                      value: "db-redis-launch-%stamp%.redis.cache.windows.net:6380"
                    - name: LAUNCH_REDIS_USE_TLS
                      value: "true"
                    - name: LAUNCH_REDIS_USERNAME
                      value: "default"
                    - name: LAUNCH_REDIS_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: launch-redis-secret
                    - name: AQUEDUCT_APP
                      value: "actions-production"
                    - name: AQUEDUCT_URL
                      value: "https://aqueduct.service.%stamp%.github.net"
                    - name: AQUEDUCT_TIMEOUT_MS
                      value: "4000"
                    - name: AQUEDUCT_NUM_WORKERS
                      value: "64"
                    - name: AQUEDUCT_NUM_WORKERS_NON_WEBHOOK
                      value: "12"
                    - name: AQUEDUCT_HEARTBEAT_ATTEMPT_INTERVAL_MS
                      value: "5000"
                    - name: AQUEDUCT_MAX_TIME_WITHOUT_HEARTBEAT_MS
                      value: "30000"
                    - name: WEBHOOK_JOB_EXPIRATION_MINUTES
                      value: "30"
                    - name: GITHUB_GRAPHQL_SERVICE_TOKEN
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: github-graphql-service-token
                    - name: EARTHSMOKE_CUSTOM_TASKS_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: earthsmoke-custom-tasks-key
                    - name: EARTHSMOKE_DEPENDABOT_SECRETS_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: earthsmoke-dependabot-secrets-key
                    # The app id for the Launch GitHub App
                    - name: GITHUB_ACTIONS_APP_IDS
                      value: "6"
                    # The global id for the Dependabot GitHub App
                    - name: DEPENDABOT_APP_RELAY_ID
                      value: "A_kwELAQ"
                    - name: API_HOST
                      value: "https://internal-api.service.%stamp%.github.net"
                    - name: EXTERNAL_API_HOST
                      value: "https://api.<tenant>.ghe.com"
                    - name: EXTERNAL_GITHUB_HOST
                      value: "https://<tenant>.ghe.com"
                    - name: KAFKA_ROOT_CA_PATH
                      value: "/etc/ssl/certs/cp1-iad-production-1487801205-root.pem"
                    - name: KAFKA_BROKERS
                      value: "hydro-kafka-%stamp%-%stamp%.service.%stamp%-az1.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az2.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az3.consul:9093"
                    # The private key provisioned for the Launch GitHub App
                    - name: GITHUB_APP_PRIVATE_KEY
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: github-app-private-key
                    - name: GITHUB_TWIRP_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: github-twirp-hmac-secret
                    - name: GITHUB_TWIRP_ADDR
                      value: "https://internal-api.service.%stamp%.github.net/internal"
                    # The master key for generating action-runner keys
                    - name: ACTION_RUNNER_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: deployer-action-runner-secret
                    # As of July 2024, RECEIVER_URL is not used to make service-to-service calls within the cluster's service mesh.
                    # Instead, it's used to provide the receiver URL to external services that need to callback/postback.
                    # For these reasons, it should remain "unmeshified."
                    - name: RECEIVER_URL
                      value: "https://launch-receiver.%stamp%.ghe.com"
                    # RECEIVER_INTERNAL_URL is used for run-service to make requests to the receiver for requesting pre_job_info, ex: GITHUB_TOKEN
                    - name: RECEIVER_INTERNAL_URL
                      value: "https://launch-receiver-internal.service.%stamp%.github.net"
                    - name: RECEIVER_PUBLIC_URL
                      value: "https://launch-receiver.%stamp%.ghe.com"
                    # RESULTS_RECEIVER_URL is ultimately advertised to the runner as a callback endpoint.  It should remain "unmeshified."
                    - name: RESULTS_RECEIVER_URL
                      value: "https://results-receiver.actions.<tenant>.ghe.com"
                    - name: TRACING_ENABLED
                      value: "true"
                    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                      value: "http://otelcol-mesh.otelcol-production.svc.cluster.local:14318/v1/traces"
                    # Federated secret
                    - name: FAILBOT_HAYSTACK_URL
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: failbot-haystack-url
                    - name: EARTHSMOKE_KEYSTORE_AZP_ORGANIZATION
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: earthsmoke-keystore-azp-organization
                    - name: AZP_GH_APP_PRIVATE_KEY_PEM
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: azp-gh-app-private-key-pem
                    - name: AZP_FORCE_TOKEN_OVER_AAD
                      value: "true"
                    - name: AZP_ORG_CREATE_API_BASE_URL
                      value: "https://pipelines.actions.githubusercontent.com/serviceDeployments/pipelinesproxweu1"
                    - name: "PIPELINE_SCALE_UNIT_URLS"
                      value: |
                        https://pipelinesproxweu1.actions.githubusercontent.com
                    - name: TOKEN_SERVICE_KEY_PEM
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: token-service-key-pem
                    - name: TOKEN_SERVICE_CERT_PEM
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: token-service-cert-pem
                    - name: AZP_ORG_REGION
                      value: "prox%stamp_without_separators%"
                    - name: EMULATE_PREPARED_STATEMENTS
                      value: "true"
                    - name: USE_UTC_FOR_MYSQL
                      value: "true"
                    - name: FORCE_CHARSET_FOR_MYSQL
                      value: "true"
                    - name: SCHEDULE_SCATTER_OFFSET_DURATION
                      value: "240s"
                    - name: SPOKESD_URL
                      value: "http://spokesd.spokesd-%stamp%.svc.cluster.local:80"
                    - name: AUTHZD_URL
                      value: "https://authzd.service.%stamp%.github.net"
                    - name: KREDZ_HTTP_ADDR
                      value: "http://kredz.kredz-%stamp%.svc.cluster.local:80"
                    - name: KREDZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: kredz-hmac-secret
                    - name: VARZ_HTTP_ADDR
                      value: "http://kredz-varz.kredz-%stamp%.svc.cluster.local:80"
                    - name: VARZ_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: varz-hmac-secret
                    - name: TELEMETRY_ROUND_TRIPPER_ENABLE_LOGS
                      value: "true"
                    # - name: RUN_SERVICE_URL
                    #   value: "https://run-actions-prod-weu-01.githubapp.com"
                    # Note: This is currently set to run service's lab...
                    # ...we are setting it to prevent start up failures as we create run service client on start up
                    # ...when proxima run service is ready, this needs to be updated
                    - name: RUN_SERVICE_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: run-service-hmac-secret
                    - name: RESULTS_CORE_ADDR
                      value: http://results-core.actions-results-%stamp%.svc.cluster.local:8080
                    - name: RESULTS_CORE_HMAC_SECRET
                      valueFrom:
                        secretKeyRef:
                            name: launch-%stamp%
                            key: results-core-hmac-secret
                    - name: GOMAXPROCS
                      value: "2"
                    - name: LAUNCH_LOG_DEBUG
                      value: "true"
                    - name: QUEUE_RUN_RATE_LIMIT_ENABLED
                      value: "true"
                    - name: WEBHOOK_RATE_LIMIT_ENABLED
                      value: "true"
                    - name: AZURE_STORAGE_ACCOUNT_PREFIX
                      value: "launch%stamp_without_separators%sa"
                    - name: AZURE_SPN_CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob
                            name: launch-%stamp%
                    - name: AZURE_SPN_CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-client-id
                            name: launch-%stamp%
                    - name: AZURE_SPN_TENANT_ID
                      valueFrom:
                        secretKeyRef:
                            key: spn-launch-blob-tenant-id
                            name: launch-%stamp%
