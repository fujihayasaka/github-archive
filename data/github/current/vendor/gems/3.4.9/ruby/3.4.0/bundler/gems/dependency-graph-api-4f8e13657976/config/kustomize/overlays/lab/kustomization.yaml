apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/production
  - namespaces/namespace.yaml
  - deployments/lab-api.yaml
  - services/lab-api.yaml
  - service-mesh-config.yaml

components:
  - ../../components/logging

patches:
  - patch: |-
      - op: replace
        path: /data/OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: https://opentelemetry-collector-production.service.iad.github.net/v1/traces
    target:
      kind: ConfigMap
