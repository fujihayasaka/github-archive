syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/object_id.proto";
import "spokes-api/types/v1/repository.proto";

// RepoObjectIDSelector is a selector for selecting a range of objects by their treeish.
message RepoObjectIDSelector {
    // base_repository is the parent of this repository.
    github.spokes.types.v1.Repository base_repository = 1;

    // oid is the object to select.
    github.spokes.types.v1.ObjectID oid = 2;
}
