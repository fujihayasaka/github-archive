apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  annotations:
    moda.github.net/canary-v2: "true"
data:
  # Common environment variables for all pods.
  GOMAXPROCS: "1"
  STATS_PERIOD: "1s"
  DATABASE_CONFIG_PATH: "/app/config/databases.yml"
  MYSQL_CONN_MAX_LIFETIME: "285s"
  MYSQL_MAX_OPEN_CONNS: "100"
  MYSQL_MAX_IDLE_CONNS: "100"
  KAFKA_YUKON_BROKERS: "hydro-kafka-yukon-boot-1.service.iad.github.net:9093,hydro-kafka-yukon-boot-2.service.iad.github.net:9093,hydro-kafka-yukon-boot-3.service.iad.github.net:9093"
  KAFKA_POTOMAC_BROKERS: "hydro-kafka-potomac-boot-1.service.iad.github.net:9093,hydro-kafka-potomac-boot-2.service.iad.github.net:9093,hydro-kafka-potomac-boot-3.service.iad.github.net:9093"
  KAFKA_CA_CERT: "/etc/ssl/certs/cp1-iad-production-1487801205-root.pem"
  FRENO_THROTTLING_ENABLED: "true"
  MYSQL1_CUTOVER_ENABLED: "true"