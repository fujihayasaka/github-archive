syntax = "proto3";

package github.actions.runner_admin.entities.v1;

import "runner-admin/entities/v1/identity.proto";
import "runner-admin/entities/v1/github_entity_hierarchy.proto";


option ruby_package = "GitHub::ActionsRunnerAdmin::Entities::V1";

// The GitHub entity (repo/org/user/enterprise) that a Runner/RunnerGroup belongs to
message GitHubEntity {
    // The global id of the entity (e.g. E_123)
    entities.v1.Identity entity_id = 1;
    // The full hierarchy for this entity (any parent or billing entities)
    entities.v1.GitHubEntityHierarchy hierarchy = 2;
}