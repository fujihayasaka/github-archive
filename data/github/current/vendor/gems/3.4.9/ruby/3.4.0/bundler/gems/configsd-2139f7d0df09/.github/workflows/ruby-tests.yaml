name: Ruby Client Tests

on:
  push:
    branches:
      - main
  pull_request:
    reuse-previous-outcome: true
    paths:
      - 'ruby/**'
      - 'proto/**'
      - '.github/workflows/ruby-tests.yaml'
  workflow_dispatch:
  merge_group:
    reuse-previous-outcome: true
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ruby

      - name: Run tests
        run: bundle exec rake test
