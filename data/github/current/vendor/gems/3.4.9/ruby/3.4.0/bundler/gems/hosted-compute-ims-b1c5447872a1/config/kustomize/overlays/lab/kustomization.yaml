apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- "../../base/hosted-compute-ims-api"
- "../../base/hosted-compute-ims-worker"
- "../../base/cronjobs"
- "../../base/servicemeshconfigs"

patches:
- path: patches/deployment-shared.yaml
  target:
    kind: Deployment
- path: patches/deployment-api.yaml
  target:
    kind: Deployment
    name: hosted-compute-ims-api
- path: patches/deployment-worker.yaml
  target:
    kind: Deployment
    name: hosted-compute-ims-worker
- path: patches/service-api.yaml
  target:
    kind: Service
    name: hosted-compute-ims
- path: patches/job-shared.yaml
  target:
    kind: CronJob
- path: patches/job-replication.yaml
  target:
    kind: CronJob
    name: ims-replication-job