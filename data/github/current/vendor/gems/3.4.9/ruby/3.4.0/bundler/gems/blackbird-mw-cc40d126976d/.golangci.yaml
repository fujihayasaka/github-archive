linters-settings:
  goimports:
    local-prefixes: github.com/github/blackbird-mw
  exhaustruct:
    include:
      # Require exhaustruct for GitDocumentMatch to ensure we are setting DocSha as we migrate
      - '.+/query/v1\.GitDocumentMatch'
      - '.+/crates/client/pkg/blackbird/gen/search/v1\.GitDocumentMatch'
linters:
  enable:
    - gofmt
    - goimports
    - exhaustruct
