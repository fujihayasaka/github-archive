kind: Deployment
metadata:
  name: osslicensecompliance-twirp
spec:
  template:
    spec:
      containers:
        - name: osslicensecompliance-twirp
          env:
            - name: APP_ENV
              value: production
            - name: AZURE_STORAGE_SPN
              value: "spn_production_osslicensecompliance"
            - name: AZURE_STORAGE_ACCOUNT
              value: "olcproduction"
            - name: FAILBOT_HAYSTACK_URL
              value: http://failbotg.failbotg-production.svc.cluster.local/api/needles
            - name: GITHUB_TELEMETRY_LOGS_LEVEL
              value: debug
            - name: OLC_MYSQL_HOST
              value: vtgate.vitess-staging.service.github.net
            - name: OLC_MYSQL_DATABASE
              value: osslicensecompliance_staging_ks
            - name: OLC_MYSQL_PORT
              value: "3306"
