apiVersion: v1
kind: Service
metadata:
  name: notifyd-pprof-api
  labels:
    service: notifyd-pprof-api
  annotations:
    opaque.github.net/checks: >
      - http:
          url: http://{{.Instance.Name}}:8081/_ping
spec:
  ports:
  - name: pprof
    port: 8081
    protocol: TCP
    targetPort: pprof
  selector:
    app: notifyd-api
  type: ClusterIP
