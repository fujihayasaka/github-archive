---
name: Epic Status Update
description: Weekly status update for Epics
body:
  - type: dropdown
    attributes:
      label: Status
      options:
        - label: "🟢 GREEN (All good, smooth sailing)"
          value: 'Status: GREEN'
        - label: "⚠️ YELLOW (At risk, heads-up)"
          value: 'Status: YELLOW'
        - label: "🚨 RED (BLOCKED)"
          value: 'Status: RED'
  - type: input
    attributes:
      label: Projected ship date
      format: date
  - type: textarea
    attributes:
      label: Progress & decisions
      placeholder: Progress and decisions made since the last update. Include links if possible.
  - type: textarea
    attributes:
      label: Next week
      placeholder: Planned progress for the next week.
  - type: textarea
    attributes:
      label: Risks
      placeholder: Context for yellow/red status or other risks that may affect this epic. Can be blank.
  - type: markdown
    attributes:
      label: 'Attribution'
      value: '- [ ] Added or updated item in [Productivity Tools WIP](https://github.com/orgs/github/memexes/682)'
