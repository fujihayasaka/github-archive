syntax = "proto3";
package git_hub.launch.services.runnerscalesets;

option go_package = "github.com/github/launch/services/deploy/runnerscalesets";

import "pbtypes/github.proto";
import "services/selfhostedrunners.proto";
import "google/protobuf/timestamp.proto";

service RunnerScaleSets {
  rpc ListRunnerScaleSets(ListRunnerScaleSetsRequest) returns (ListRunnerScaleSetsResponse) {}
  rpc GetRunnerScaleSet(GetRunnerScaleSetRequest) returns (GetRunnerScaleSetResponse) {}
  rpc AddRunnerScaleSet(AddRunnerScaleSetRequest) returns (AddRunnerScaleSetResponse) {}
  rpc DeleteRunnerScaleSet(DeleteRunnerScaleSetRequest) returns (DeleteRunnerScaleSetResponse) {}
  rpc UpdateRunnerScaleSet(UpdateRunnerScaleSetRequest) returns (UpdateRunnerScaleSetResponse) {}

  rpc GenerateRunnerScaleSetJitRunnerConfig(GenerateRunnerScaleSetJitRunnerConfigRequest) returns (GenerateRunnerScaleSetJitRunnerConfigResponse) {}
    
  rpc CreateRunnerScaleSetSession(CreateRunnerScaleSetSessionRequest) returns (CreateRunnerScaleSetSessionResponse) {}
  rpc RefreshRunnerScaleSetSession(RefreshRunnerScaleSetSessionRequest) returns (RefreshRunnerScaleSetSessionResponse) {}
  rpc DeleteRunnerScaleSetSession(DeleteRunnerScaleSetSessionRequest) returns (DeleteRunnerScaleSetSessionResponse) {}
}

message ListRunnerScaleSetsRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  reserved 2;
  reserved 3;
  bool exclude_elastic_runners = 4;
  int64 runner_group_id = 5;
  string runner_scale_set_name = 6;
}

message ListRunnerScaleSetsResponse {
  repeated RunnerScaleSet runner_scale_sets = 1;
  int64 count = 2;
}

message GetRunnerScaleSetRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  int64 scale_set_id = 2;
}

message GetRunnerScaleSetResponse {
  RunnerScaleSet runner_scale_set = 1;
}

message AddRunnerScaleSetRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  string name = 2;
  int64 runner_group_id = 3;
  repeated Label labels = 4;
  RunnerSetting runner_setting = 5;
}

message AddRunnerScaleSetResponse {
  RunnerScaleSet runner_scale_set = 1;
}

message UpdateRunnerScaleSetRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  int64 scale_set_id = 2;
  string name = 3;
  int64 runner_group_id = 4;
  repeated Label labels = 5;
  RunnerSetting runner_setting = 6;
}

message UpdateRunnerScaleSetResponse {
  RunnerScaleSet runner_scale_set = 1;
}

message DeleteRunnerScaleSetRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  int64 scale_set_id = 2;
}

message DeleteRunnerScaleSetResponse {
}

message GenerateRunnerScaleSetJitRunnerConfigRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  string name = 2;
  repeated string labels = 3;
  string work_folder = 4;
  string git_hub_url = 5;
  int64 scale_set_id = 6;
}

message GenerateRunnerScaleSetJitRunnerConfigResponse {
  services.selfhostedrunners.Runner runner = 1;
  string encoded_jit_config = 2;
}

message CreateRunnerScaleSetSessionRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  int64 scale_set_id = 2;
  string owner_name = 3;
}

message CreateRunnerScaleSetSessionResponse {
  string token = 1;
  string session_id = 2;
  string owner_name = 3;
  RunnerScaleSet runner_scale_set = 4;
  string message_url = 5;
  RunnerScaleSetStatistics statistics = 6;
}

message RefreshRunnerScaleSetSessionRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  int64 scale_set_id = 2;
  string session_id = 3;
}

message RefreshRunnerScaleSetSessionResponse {
  string token = 1;
  string session_id = 2;
  string owner_name = 3;
  RunnerScaleSet runner_scale_set = 4;
  string message_url = 5;
  RunnerScaleSetStatistics statistics = 6;
}

message DeleteRunnerScaleSetSessionRequest {
  pbtypes.git_hub.Identity owner_id = 1;
  int64 scale_set_id = 2;
  string session_id = 3;
}

message DeleteRunnerScaleSetSessionResponse {
}

message RunnerScaleSet {
  int64 id = 1;
  string name = 2;
  int64 runner_group_id = 3;
  string runner_group_name = 4;
  string status = 5;
  RunnerScaleSetStatistics statistics = 6;
  repeated Label labels = 7;
  bool enabled = 8;
  string queue_name = 9;
  google.protobuf.Timestamp created_on = 10;
  RunnerSetting runner_setting = 11;
  string runner_jit_config_url = 12;
  string get_acquirable_jobs_url = 13;
  string acquire_jobs_url = 14;
  string create_session_url = 15;
}

message RunnerScaleSetStatistics {
  int64 total_available_jobs = 1;
  int64 total_acquired_jobs = 2;
  int64 total_assigned_jobs = 3;
  int64 total_running_jobs = 4;
  int64 total_registered_runners = 5;
  int64 total_busy_runners = 6;
  int64 total_idle_runners = 7;
}

message Label {
  int64 id = 1;
  string name = 2;
  string type = 3;
}

message RunnerSetting {
  bool ephemeral = 1;
  bool is_elastic = 2;
  bool disable_update = 3;
}