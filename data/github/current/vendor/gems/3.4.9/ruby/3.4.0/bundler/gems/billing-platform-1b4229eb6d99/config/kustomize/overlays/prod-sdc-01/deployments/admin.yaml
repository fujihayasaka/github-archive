apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: admin
          env:
            - name: BILLING_PLATFORM_DB_READ_ONLY_SPN_TENANT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_billing_platform_cosmosdb_ro_prod_sdc_01_tenant_id
                  name: vault-secrets
            - name: BILLING_PLATFORM_DB_READ_ONLY_SPN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: spn_billing_platform_cosmosdb_ro_prod_sdc_01_client_id
                  name: vault-secrets
            - name: BILLING_PLATFORM_DB_READ_ONLY_SPN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: spn_billing_platform_cosmosdb_ro_prod_sdc_01
                  name: vault-secrets