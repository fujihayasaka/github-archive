### DEFAULTS: The following entries define a safe default and may be overridden as needed.
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: GITHUB_TELEMETRY_ENVIRONMENT
    value: "production"
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: GITHUB_TELEMETRY_LOGS_LEVEL
    value: "debug"
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: LAUNCH_IS_MULTI_TENANT
    value: "false"
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: STATS_ADDR
    value: "$(KUBE_NODE_HOSTNAME):28125"
