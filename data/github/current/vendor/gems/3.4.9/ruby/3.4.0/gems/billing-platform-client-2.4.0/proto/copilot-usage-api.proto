syntax = "proto3";

package billing_platform.api.v1;

option go_package = "lib/twirp/proto";
option ruby_package = "BillingPlatform::Api::V1";

import "proto/base.proto";
import "proto/usage-api.proto";

service CopilotUsageApi {
  rpc GetCopilotUsageTable(GetCopilotUsageTableRequest) returns (GetCopilotUsageTableResponse);
  rpc GetCopilotUsageChartData(GetCopilotUsageChartDataRequest) returns (GetUsageChartDataResponse);
  rpc GetCopilotUsageCardData(GetCopilotUsageCardDataRequest) returns (GetUsageCardDataResponse);
  rpc GetCopilotModels(GetCopilotModelsRequest) returns (GetCopilotModelsResponse);
  rpc GetCopilotUsageReport(GetCopilotUsageReportRequest) returns (GetCopilotUsageReportResponse);
}

message GetCopilotUsageTableRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
    base.BillingPeriod billingPeriod = 4;
    int64 orgId = 5;
    int64 userId = 6;
    string model = 7;
    base.UsageGroupBy groupBy = 8;
    string costCenterId = 9;
    repeated int64 organizationAdminIds = 10;
    int64 page = 11;
    int64 rowsPerPage = 12;
}

message GetCopilotUsageTableResponse {
    UsageTable table = 1;
    int64 page = 2;
    int64 numPages = 3;
}

message GetCopilotUsageChartDataRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
    base.BillingPeriod billingPeriod = 4;
    int64 orgId = 5;
    int64 userId = 6;
    string model = 7;
    base.UsageGroupBy groupBy = 8;
    string costCenterId = 9;
    repeated int64 organizationAdminIds = 10;
}

message GetCopilotUsageCardDataRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
    base.BillingPeriod billingPeriod = 4;
    int64 orgId = 5;
    int64 userId = 6;
    string model = 7;
    string costCenterId = 8;
    repeated int64 organizationAdminIds = 9;
}

message GetUsageCardDataResponse {
    double net_billed_amount = 1;
    double net_quantity = 2;
    double discount_quantity = 3;
}

message GetCopilotModelsRequest {
    reserved 1;
    reserved "customerId";
}

message GetCopilotModelsResponse {
    repeated string models = 1;
    repeated string formattedModels = 2;
}

message UsageTable {
    repeated TableColumn columns = 1;
    repeated TableRow rows = 2;
}

message TableColumn {
    string name = 1;
}

message TableRow {
    string id = 1;
    repeated TableCell cells = 2;
    UsageTable subtable = 3;
}

message TableCell {
    string value = 1;
    string sortValue = 2;
}

message GetCopilotUsageReportRequest {
    string customerId = 1;
    int64 year = 2;
    int64 month = 3;
    int64 day = 4;
    base.BillingPeriod billingPeriod = 5;
    int64 orgId = 6;
    int64 userId = 7;
    string model = 8;
    string product = 9;
    string costCenterId = 10;
}

message GetCopilotUsageReportResponse {
    repeated CopilotReportItem reportItems = 1;
}

message CopilotReportItem {
    string product = 1;
    string model = 2;
    string sku = 3;
    double grossQuantity = 4;
    double discountQuantity = 5;
    double netQuantity = 6;
    double grossAmount = 7;
    double discountAmount = 8;
    double netAmount = 9;
    double pricePerUnit = 10;
    string unitTypeString = 11;
}
