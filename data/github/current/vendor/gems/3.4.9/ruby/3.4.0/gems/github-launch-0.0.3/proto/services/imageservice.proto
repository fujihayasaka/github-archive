syntax = "proto3";
package git_hub.launch.services.imageservice;

option go_package = "github.com/github/launch/services/deploy/imageservice";

import "pbtypes/github.proto";

service ImageService {
  // Lists the step data after a given changeID
  rpc RaiseImageVersionEvent(RaiseImageVersionEventRequest) returns (RaiseImageVersionEventResponse);
}

message RaiseImageVersionEventRequest {
  // ID of the repository the event should be raised for
  // Currently this is the same as the repository that generated the event
  pbtypes.git_hub.Identity repository_id = 1;
  // ID of the owner of the image definition
  pbtypes.git_hub.Identity owner_id = 2;
  // The ID of the image definition the event is for
  int64 image_definition_id = 3;
  // The name of the image definition the event is for
  string image_definition_name = 4;
  // The version of the image that was updated
  string image_version = 5;
  // The type of event that was raised (updated, added, deleted, etc)
  string type = 6;
}

message RaiseImageVersionEventResponse {}