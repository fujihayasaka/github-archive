# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
enabledFileTypes:
  "*": true
  go.mod: false
  go.sum: false
ignoreRegExpList:
  - usernames
languageSettings:
  - languageId: go
    allowCompoundWords: true
    ignoreRegExpList:
      - go-imports
      - go-nolint
      - go-generate
  - languageId: markdown
    allowCompoundWords: true
  - languageId: yaml
    allowCompoundWords: true
patterns:
  - name: usernames
    pattern:
      - at-username
      - todo-username
  - name: at-username
    description: "ignore usernames in the format: @username"
    pattern: "@\\w+"
  - name: todo-username
    description: 'ignore usernames in the format: "// TODO <username>
      (otherusername): comment"'
    pattern: //\s*TODO\s*(\([^)]+\)|<[^>]+>)(\s*(\([^)]+\)|<[^>]+>))*\s*:.*
  - name: go-imports
    pattern:
      - go-sl-import
      - go-ml-import
  - name: go-sl-import
    description: ignore single line imports
    pattern: import\s*.*\".*?\"
  - name: go-ml-import
    description: ignore multiline imports
    pattern: import\s*\((.|[\r\n])*?\)
  - name: go-nolint
    description: ignore go nolint directive
    pattern: //\s*nolint:.*
  - name: go-generate
    description: ignore go generate directive
    pattern: //\s*go:generate.*
dictionaries:
  - sweagentd
dictionaryDefinitions:
  - name: sweagentd
    description: "common stuff"
    path: ./.cspell-dict.txt
    noSuggest: true
    addWords: true
