  :npm_id: '1527'
  :summary: Information Exposure in apollo-server-cache-memcached
  :description: |-
    Versions of `apollo-server-cache-memcached` prior to 2.4.12 are vulnerable to Information Exposure. The package does not properly enforce validation rules when creating subscription servers, which includes a `NoInstrospection` rule for the Websocket. This leaks the GraphQL schema types, their relations and human-readable names.   More information can be found on the references.


    ## Recommendation

    Upgrade to version 2.14.2 or later.
