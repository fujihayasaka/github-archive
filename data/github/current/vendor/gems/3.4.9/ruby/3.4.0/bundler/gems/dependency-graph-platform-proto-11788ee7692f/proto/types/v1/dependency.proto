syntax = "proto3";

package github.dependency_graph_platform.types.v1;

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/types/v1";

message Dependency {
    string id = 1;
    string manifest_path = 2;
    string name = 3;
    string version = 4;
    string registry_url = 5;
    Relationship relationship = 6;
    Scope scope = 7;
    bool malformed = 8;
    repeated TransitiveDependency transitive_dependencies = 9;
}

message TransitiveDependency {
    string id = 1;
}

enum Scope {
    SCOPE_UNKNOWN = 0;
    SCOPE_RUNTIME = 1;
    SCOPE_DEVELOPMENT = 2;
}

enum Relationship {
    RELATIONSHIP_UNKNOWN = 0;
    RELATIONSHIP_DIRECT = 1;
    RELATIONSHIP_TRANSITIVE = 2;
    RELATIONSHIP_INCONCLUSIVE = 3;
}
