apiVersion: v1
kind: ConfigMap
metadata:
  name: common-config
  annotations:
    moda.github.net/canary-v2: "true"
data:
  # Common environment variables for all pods.
  GOMAXPROCS: "1"
  STATS_PERIOD: "1s"
  DATABASE_CONFIG_PATH: "/app/config/databases-proxima.yml"
  MYSQL_CONN_MAX_LIFETIME: "285s"
  MYSQL_MAX_OPEN_CONNS: "100"
  MYSQL_MAX_IDLE_CONNS: "100"
  FRENO_THROTTLING_ENABLED: "false"
  IS_PROXIMA: "true"
  KAFKA_CA_CERT: /etc/ssl/certs/cp1-iad-production-1487801205-root.pem
  # per-stamp configurations
  KAFKA_YUKON_BROKERS: "hydro-kafka-%stamp%-%stamp%.service.%stamp%-az1.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az2.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az3.consul:9093"
  KAFKA_POTOMAC_BROKERS: "hydro-kafka-%stamp%-%stamp%.service.%stamp%-az1.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az2.consul:9093,hydro-kafka-%stamp%-%stamp%.service.%stamp%-az3.consul:9093"
  MYSQL1_CUTOVER_ENABLED: "false"
