syntax = "proto3";

package github.dependency_graph_platform.graphql.v1;

option go_package = "github.com/github/dependency-graph-platform-proto/gen/go/graphql/v1";

import "types/v1/manifest.proto";
import "types/v1/dependency.proto";

// This service provides methods to retrieve manifest and dependency information from DGP for use by the DG-API's GraphQL API.
service GraphQLResolver {
    rpc RepositoryHasManifests(RepositoryHasManifestsRequest) returns (RepositoryHasManifestsResponse);
    rpc GetManifestsForRepository(GetManifestsForRepositoryRequest) returns (GetManifestsForRepositoryResponse);
    rpc GetDependenciesForManifest(GetDependenciesForManifestRequest) returns (GetDependenciesForManifestResponse);
}

message Manifest {
  // Manifest ID
  int64 id = 1;

  // GitHub repository ID
  uint64 repository_id = 2;
  
  // Manifest path, excluding filename
  string path = 3;
  
  // Manifest filename
  string name = 4;

  // Manifest ecosystem
  github.dependency_graph_platform.types.v1.Ecosystem ecosystem = 5;
}

message Dependency {
  // Dependency ID
  int64 id = 1;

  // Name of the package
  string package_name = 2;

  // Version requirements of the package
  string requirements = 3;

  // Ecosystem of the Dependency (e.g. NPM, RubyGems, etc.)
  github.dependency_graph_platform.types.v1.Ecosystem ecosystem = 4;

  // Whether the dependency is direct or transitive
  github.dependency_graph_platform.types.v1.Relationship relationship = 5;
}

message RepositoryHasManifestsRequest {
  // GitHub repository ID
  uint64 repository_id = 1;
}

message RepositoryHasManifestsResponse {
  // Whether the Repository has manifests
  bool has_manifests = 1;
}

message GetManifestsForRepositoryRequest {
  // GitHub repository ID
  uint64 repository_id = 1;

  // Optional list of manifest IDs to fetch 
  repeated int64 manifest_ids = 2;

  // Optional filter to only include manifests with dependencies.
  // Returns all manifests if filter is undefined or if set to false
  bool with_dependencies = 3;

  // Optional filter to return results for the set ecosystems
  repeated github.dependency_graph_platform.types.v1.Ecosystem ecosystems = 4;
}

message GetManifestsForRepositoryResponse {
  // List of manifests
  repeated Manifest manifests = 1;
}

message GetDependenciesForManifestRequest {
  // GitHub repository ID
  uint64 repository_id = 1;

  // DGP manifest ID
  int64 manifest_id = 2;
}

message GetDependenciesForManifestResponse {
  // List of dependencies
  repeated Dependency dependencies = 1;
}