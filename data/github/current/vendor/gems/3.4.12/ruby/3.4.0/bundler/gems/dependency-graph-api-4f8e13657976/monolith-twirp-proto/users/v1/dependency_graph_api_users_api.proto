syntax = "proto3";

package dependency_graph.users.v1;

option ruby_package = "MonolithTwirp::DependencyGraph::Users::V1";

service UsersAPI {
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}

enum UserType {
  // USER_TYPE_INVALID should never be set, but a zero value is required for enums.
  USER_TYPE_INVALID = 0;
  // USER_TYPE_USER denotes a normal user account.
  USER_TYPE_USER = 1;
  // USER_TYPE_ORGANIZATION denotes an organization, a special type of user account
  // that can be administered by any number of admins but that can't log-in.
  USER_TYPE_ORGANIZATION = 2;
  // USER_TYPE_BOT denotes a bot, a special type of user used in conjunction with
  // an integration; it performs actions on behalf of the integration and
  // exists solely as a means for attributing these actions to the integration.
  USER_TYPE_BOT = 3;
}

message UserListItem {
  int64 id = 1;
  UserType type = 2;
  string profile_name = 3;
}

message GetUsersRequest {
  repeated int64 ids = 1;
}

message GetUsersResponse {
  repeated UserListItem users = 1;
}
