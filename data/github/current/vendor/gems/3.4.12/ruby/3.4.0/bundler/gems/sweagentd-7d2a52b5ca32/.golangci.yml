version: "2"

run:
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: false
  relative-path-mode: gitroot

output:
  path-prefix: ""
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

linters:
  default: all

  disable:
    - asciicheck
    - canonicalheader
    - containedctx
    - cyclop
    - depguard
    - dogsled
    - dupl
    - err113
    - errcheck
    - exhaustive
    - exhaustruct
    - forbidigo
    - funlen
    - gochecknoglobals
    - gocognit
    - goconst
    - gocyclo
    - godot
    - godox
    - goerrorslint # This is enabled specifically in script/lint until we have it working on all packages
    - goheader
    - gomoddirectives
    - importas
    - inamedparam
    - intrange
    - ireturn
    - lll
    - mnd
    - musttag
    - nilnil
    - nlreturn
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - promlinter
    - protogetter
    - tagliatelle
    - testpackage
    - thelper
    - unparam
    - unqueryvet
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
    - wsl_v5

  exclusions:
    rules:
      - linters:
          - bodyclose
          - errcheck
          - goerrorslint
          - forcetypeassert
          - gosec
          - maintidx
          - noctx
        path: '_test\.go'
      - linters:
          - revive
        path: '_test\.go'
        text: "unchecked-type-assertion:"
      - linters:
          - govet
        path: '_test\.go'
        text: "unusedwrite:"

  settings:
    custom:
      goerrorslint:
        type: module
        description: Checks for uses of go error utilities that won't have our stacktracing built-in

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    forbidigo:
      forbid:
        - pattern: 'time.After\.*(# use of time After can create memory allocation issues see  https://github.com/github/go-linter/tree/main/doc/time_after.md )?'

    gocritic:
      disabled-checks:
        - importShadow
        - unnamedResult
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256

    gosec:
      excludes:
        - G204
        - G304
        - G307
        - G115
      config:
        G104:
          os:
            - Setenv

    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true

    nestif:
      min-complexity: 9

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true

    recvcheck:
      exclusions:
        - "*.UnmarshalJSON"

    revive:
      confidence: 0.8
      severity: "error"
      enable-all-rules: true
      rules:
        - name: comment-spacings
          arguments:
            - nolint
          disabled: false

        - name: unchecked-type-assertion
          disabled: false
          arguments:
            - acceptIgnoredAssertionResult: true

        - name: unhandled-error
          arguments:
            - fmt.Print
            - fmt.Printf
            - fmt.Println
            - os.Setenv
            - os.Unsetenv
          disabled: false

        - name: add-constant
          disabled: true

        - name: argument-limit
          disabled: true

        - name: banned-characters
          disabled: true

        - name: blank-imports
          disabled: true

        - name: cognitive-complexity
          disabled: true

        - name: confusing-naming
          disabled: true

        - name: constant-logical-expr
          disabled: true

        - name: cyclomatic
          disabled: true

        - name: empty-block
          disabled: true

        - name: error-naming
          disabled: true

        - name: file-header
          disabled: true

        - name: flag-parameter
          disabled: true

        - name: function-result-limit
          disabled: true

        - name: function-length
          disabled: true

        - name: get-return
          disabled: true

        - name: imports-blocklist
          disabled: true

        - name: import-alias-naming
          disabled: true

        - name: line-length-limit
          disabled: true

        - name: max-public-structs
          disabled: true

        - name: nested-structs
          disabled: true

        - name: optimize-operands-order
          disabled: true

        - name: redundant-import-alias
          disabled: true

        - name: string-format
          disabled: true

        - name: unused-parameter
          disabled: true

        - name: unused-receiver
          disabled: true

        - name: use-any
          disabled: true

    testifylint:
      enable-all: true
      disable:
        - bool-compare
        - empty
        - error-is-as
        - len
        - negative-positive
        - go-require

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
  fix: false

severity:
  default: error

formatters:
  enable:
    - goimports
  exclusions:
    generated: "lax"
    paths:
      - third_party$
      - builtin$
      - examples$
