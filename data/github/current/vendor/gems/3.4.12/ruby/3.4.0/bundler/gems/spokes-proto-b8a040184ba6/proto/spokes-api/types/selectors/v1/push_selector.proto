syntax = "proto3";

package github.spokes.types.selectors.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types/selectors";
option ruby_package = "GitHub::Spokes::Proto::Types::Selectors::V1";

import "spokes-api/types/v1/reference_update.proto";

// PushSelector is a selector for selecting objects by that were included in a push.
message PushSelector {
    // reference_updates is the set of pushes to select.
    repeated github.spokes.types.v1.ReferenceUpdate reference_updates = 1;
}
