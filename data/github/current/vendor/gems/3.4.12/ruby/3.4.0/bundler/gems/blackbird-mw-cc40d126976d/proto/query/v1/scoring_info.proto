syntax = "proto3";

package blackbirdmw.query.v1;

option go_package = "query/v1";
option ruby_package = "Blackbird::Query::V1";

import "query/v1/symbol.proto";

enum ScoringFactorKind {
  SCORING_FACTOR_KIND_UNSPECIFIED = 0;
  SCORING_FACTOR_KIND_REPO_SCORE = 1;
  SCORING_FACTOR_KIND_IS_TEST = 2;
  SCORING_FACTOR_KIND_IS_VENDORED = 3;
  SCORING_FACTOR_KIND_MATCH_DENSITY = 4;
  SCORING_FACTOR_KIND_LANGUAGE_TYPE = 5;
  SCORING_FACTOR_KIND_IS_GENERATED = 6;
  SCORING_FACTOR_KIND_MATCH_COMPLETENESS = 7;
  SCORING_FACTOR_KIND_LANGUAGE_CONTEXT = 8;
  SCORING_FACTOR_KIND_FILENAME_SCORE = 9;
  SCORING_FACTOR_KIND_COVERING_SCORE = 10;
  SCORING_FACTOR_KIND_REF_SCORE = 11;
  SCORING_FACTOR_KIND_IS_BOILERPLATE = 12;
  SCORING_FACTOR_KIND_CROWDING = 13;
}

message ScoringContribution {
  ScoringFactorKind kind = 1;
  float contribution = 2;
}

// Match score is the score produced for each individual matching position in
// the document. E.g. if a particular match is inside of a comment, it might be
// ranked lower than than a match that is defining a function
message MatchScore { float score = 1; }

// The snippet is the part of the document that is chosen to be shown on the
// results page
message Snippet {
  // Starting and ending byte offset of the snippet
  uint32 start = 1;
  uint32 end = 2;
  uint32 starting_line_number = 3;
  uint32 ending_line_number = 4;

  // A score to represent the importance of the snippet
  float score = 5;
}

message ScoringInfo {
  float score = 1;
  repeated ScoringContribution factors = 2;
  repeated MatchScore match_scores = 4;
  repeated Snippet snippets = 5;
  repeated Symbol matched_symbols = 6;
  repeated Symbol enclosing_symbols = 7;

  reserved 3; // was path_index
}
