apiVersion: apps/v1
kind: Deployment
metadata:
    name: repo-manifest-file-deleted
    annotations:
        heaven.githubapp.com/inject-heaven-env-vars-into-containers: "repo-manifest-file-deleted"
        heaven.githubapp.com/image-placeholder: "dependency-graph-api"
        heaven.githubapp.com/deploy-requirement: "true"
spec:
    replicas: 1
    strategy:
        type: RollingUpdate
    selector:
        matchLabels:
            app: dependency-graph-api
            role: repo-manifest-file-deleted
    template:
        metadata:
            labels:
                app: dependency-graph-api
                role: repo-manifest-file-deleted
        spec:
            dnsPolicy: ClusterFirst
            volumes:
                - name: github-metadata
                  hostPath:
                    path: /etc/github/metadata.json
            containers:
                - name: repo-manifest-file-deleted
                  image: dependency-graph-api
                  resources:
                    requests:
                        cpu: 200m
                        memory: "1Gi"
                    limits:
                        cpu: 1000m
                        memory: "2Gi"
                  command: ["./script/etl/repo_manifest_file_deleted"]
                  readinessProbe:
                    timeoutSeconds: 1
                    tcpSocket:
                        port: 8888
                  env:
                    - name: DOGSTATSD_HOST
                      valueFrom:
                        fieldRef:
                            fieldPath: spec.nodeName
                  envFrom:
                    - configMapRef:
                        name: environment
                    - secretRef:
                        name: vault-secrets
                  volumeMounts:
                    - mountPath: /etc/github/metadata.json
                      name: github-metadata
                      readOnly: true
