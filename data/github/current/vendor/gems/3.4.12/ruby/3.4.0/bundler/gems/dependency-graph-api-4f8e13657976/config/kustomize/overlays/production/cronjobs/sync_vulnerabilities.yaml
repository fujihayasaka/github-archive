apiVersion: batch/v1
kind: CronJob
metadata:
    name: sync-vulnerabilities
    annotations:
        heaven.githubapp.com/inject-heaven-env-vars-into-containers: "sync-vulnerabilities"
        heaven.githubapp.com/image-placeholder: "dependency-graph-api"
spec:
    schedule: "*/15 * * * *" # Every 15 minutes.
    concurrencyPolicy: Forbid # Do not allow multiple instances of the same job to run, at the same time.
    successfulJobsHistoryLimit: 2
    failedJobsHistoryLimit: 2
    jobTemplate:
        spec:
            template:
                spec:
                    dnsPolicy: ClusterFirst
                    volumes:
                        - name: github-metadata
                          hostPath:
                            path: /etc/github/metadata.json
                    restartPolicy: Never
                    containers:
                        - name: sync-vulnerabilities
                          image: dependency-graph-api
                          command: ["/usr/bin/tools/istio-job-wrapper", "script/run-with-lock", "-lock=sync_vulnerabilities", "-wait=false", "bundle", "exec", "rake", "sync_vulnerabilities"]
                          envFrom:
                            - configMapRef:
                                name: environment
                            - secretRef:
                                name: vault-secrets
                          env:
                            - name: DOGSTATSD_HOST
                              valueFrom:
                                fieldRef:
                                    fieldPath: spec.nodeName
                          volumeMounts:
                            - mountPath: /etc/github/metadata.json
                              name: github-metadata
                              readOnly: true
