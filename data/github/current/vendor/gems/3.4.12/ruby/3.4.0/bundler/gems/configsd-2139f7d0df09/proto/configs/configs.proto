syntax = "proto3";

package configs;
import "google/protobuf/timestamp.proto";

option go_package = "github.com/github/configsd/internal/twirpapi/configs";
option ruby_package = "Configs::Twirp";

service Configs {
  rpc ResolveConfigsByTarget(ResolveConfigsByTargetRequest) returns (ResolveConfigsByTargetResponse);
  rpc ResolveConfigsByTargetWithOwners(ResolveConfigsByTargetWithOwnersRequest) returns (ResolveConfigsByTargetResponse);
  rpc ResolveConfigsByTargetsWithOwners(ResolveConfigsByTargetsWithOwnersRequest) returns (ResolveConfigsByTargetsWithOwnersResponse);
}

enum TargetType {
  Repository = 0;
  User = 1;
  Business = 2;
  MemexProject = 3;
  Customer = 4;
  Team = 5;
  RepositoryNetwork = 6;
  Global = 7;
  Gist = 8;
}

message ConfigTarget {
  uint64 id = 1;
  TargetType type = 2;
}

message ConfigTargetWithOwners {
  uint64 repo_id = 1;
  uint64 owner_id = 3;
  uint64 business_id = 4;
}

message ResolveConfigsByTargetRequest {
  ConfigTarget target = 1;
}

message ResolveConfigsByTargetWithOwnersRequest {
  ConfigTargetWithOwners target = 1;
}

message ResolvedConfigs {
  map<string, Config> configs = 1;
}

message ResolveConfigsByTargetResponse {
  ResolvedConfigs configs = 1;
}

message ResolveConfigsByTargetsWithOwnersRequest {
  repeated ConfigTargetWithOwners targets = 1;
}

message ResolvedConfigsById {
  map<uint64, ResolvedConfigs> configs_by_id = 1;
}

message ResolveConfigsByTargetsWithOwnersResponse {
  map<uint32, ResolvedConfigsById> configs_by_type = 1;
}

message Config {
  string name = 1;
  string value = 2;
  ConfigTarget target = 3;
  bool final = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}
