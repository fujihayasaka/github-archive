syntax = "proto3";

package sweagentd.jobs.v1;

import "google/protobuf/timestamp.proto";

option go_package = "jobs/v1";
option ruby_package = "Sweagentd::JobsAPI::V1";

// JobsAPI service is used for all `service -> sweagentd` communication about Jobs.
service JobsAPI {
    // ListJobsForPullRequest returns the list of jobs associated with a given pull request.
    rpc ListJobsForPullRequest(ListJobsForPullRequestRequest) returns (ListJobsForPullRequestResponse);
    // CreateJob creates a new job for the given repository and owner.
    rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
    // CreateJobForIssue creates a new job for a specific issue.
    rpc CreateJobForIssue(CreateJobForIssueRequest) returns (CreateJobForIssueResponse);
    // GetJobBySessionID retrieves a job by its associated session ID.
    rpc GetJobBySessionID(GetJobBySessionIDRequest) returns (GetJobBySessionIDResponse);
    // CreateCommand creates a new command for the given job.
    rpc CreateCommand(CreateCommandRequest) returns (CreateCommandResponse);
}

message ListJobsForPullRequestRequest {
    int64 repo_id = 1;
    int64 owner_id = 2;
    int64 pull_request_id = 3;
}

message ListJobsForPullRequestResponse {
    repeated Job jobs = 1;
}

message CreateJobRequest {
    uint64 actor_id = 1;
    uint64 repo_id = 2;
    uint64 owner_id = 3;
    string problem_statement = 4;
    string base_branch_name = 5;
    string custom_agent = 6;
    CustomAgentAttributes custom_agent_attributes = 7;
    uint64 agent_id = 8;
    string event_url = 9;
    repeated string event_identifiers = 10;
    string event_content = 11;
}

message CreateJobForIssueRequest {
    uint64 actor_id = 1;
    uint64 repo_id = 2;
    uint64 owner_id = 3;
    string additional_instructions = 4;
    string base_branch_name = 5;
    string custom_agent = 6;
    CustomAgentAttributes custom_agent_attributes = 7;
    int64 issue_id = 8;
    string event_content = 9;
}

message CustomAgentAttributes {
    string display_name = 1;
    string description = 2;
    string prompt = 3;
    repeated string tools = 4;
}

message CreateJobResponse {
    string job_id = 1;
    string session_id = 2;
    int64 pull_request_id = 3;
    int64 pull_request_number = 4;
}

message CreateJobForIssueResponse {
    string job_id = 1;
    string session_id = 2;
    int64 pull_request_id = 3;
    int64 pull_request_number = 4;
}

message Job {
    string id = 1;
    int64 repo_id = 2;
    int64 owner_id = 3;
    string repo_node_id = 4;
    string owner_node_id = 5;
    string assignment_id = 6;
    int64 pull_request_id = 7;
    string compute_id = 8;
    string session_id = 9;
    EventType event_type = 10;
    string event_url = 11;
    repeated string event_identifiers = 12;
    JobStatus status = 13;
    google.protobuf.Timestamp created_at = 14;
    google.protobuf.Timestamp launched_at = 15;
    google.protobuf.Timestamp queued_at = 16;
    google.protobuf.Timestamp completed_at = 17;
    google.protobuf.Timestamp updated_at = 18;
    string model = 19;
    string branch_name = 20;
    string base_commit = 21;
    int64 actor_id = 22;
    string event_content = 23;
}

enum JobStatus {
    JOB_STATUS_INVALID = 0;
    JOB_STATUS_PENDING = 1;
    JOB_STATUS_QUEUED = 2;
    JOB_STATUS_RUNNING = 3;
    JOB_STATUS_COMPLETED = 4;
    JOB_STATUS_FAILED = 5;
    JOB_STATUS_CANCELLED = 6;
    JOB_STATUS_TIMED_OUT = 7;
}

enum EventType {
    EVENT_TYPE_INVALID = 0;
    EVENT_TYPE_ISSUE_ASSIGNMENT = 1;
    EVENT_TYPE_PULL_REQUEST_COMMENT = 2;
    EVENT_TYPE_PULL_REQUEST_REVIEW = 3;
    EVENT_TYPE_CODE_SCANNING_ALERTS_ASSIGNMENT = 4;
    EVENT_TYPE_API_CALL_RECEIVED = 5;
}

message GetJobBySessionIDRequest {
    string session_id = 1;
    int64 repo_id = 2;
    int64 owner_id = 3;
}

message GetJobBySessionIDResponse {
    Job job = 1;
}

message CreateCommandRequest {
    // The ID of the job to which we should attach this command to
    string job_id = 1;
    // The owner ID of the repository where the job belongs
    int64 owner_id = 2;
    // The repository ID where the job belongs
    int64 repo_id = 3;
    // An external ID to correlate this command with an external system (e.g. Sessions API)
    string external_id = 4;
    // The ID of the actor (user or bot) creating this command
    int64 actor_id = 5;
    // The content of the command (e.g. "change approach", "more tests", etc.)
    string content = 6;
    // The timestamp when the command was created in the external system (e.g. Sessions API)
    int64 timestamp = 7;
}

message CreateCommandResponse {
    // The ID of the newly created command
    string id = 1;
    // An external ID to correlate this command with an external system (e.g. Sessions API)
    string external_id = 2;
    // The ID of the job to which this command was attached
    string job_id = 3;
}
