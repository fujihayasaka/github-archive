        -0,0 +1,21 @@\n+```toml\n+[advisory]\n+id = \"RUSTSEC-0000-0000\"\n+package
        = \"array-macro\"\n+date = \"2022-04-27\"\n+url = \"https://gitlab.com/KonradBorowski/array-macro/-/issues/5\"\n+categories
        = [\"code-execution\", \"memory-corruption\", \"memory-exposure\"]\n+informational
        = \"unsound\"\n+\n+[versions]\n+patched = [\">= 2.1.2\"]\n+unaffected = [\"<
        2.1.0\"]\n+```\n+\n+# `array!` macro is unsound when its length is impure
        constant\n+\n+Affected versions of this crate did substitute the array length
        provided by an user at compile-time multiple times.\n+\n+When an impure constant
        expression is passed as an array length (such as a result of an impure procedural
        macro), this can result in the initialization of an array with uninitialized
        types, which in turn can allow an attacker to execute arbitrary code.\n+\n+The
        flaw was corrected in commit [d5b63f72](https://gitlab.com/KonradBorowski/array-macro/-/commit/d5b63f72090f3809c21ac28f9cfd84f12559bf7d)
        by making sure that array length is substituted just once."}]}'
