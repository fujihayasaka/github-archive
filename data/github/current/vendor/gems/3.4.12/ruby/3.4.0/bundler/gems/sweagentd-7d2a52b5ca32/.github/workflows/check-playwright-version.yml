name: "Check Playwright Version"

env:
  HUSKY: 0

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  check-playwright-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.COPILOT_AGENT_RUNTIME_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install dependencies
        working-directory: ./runtime
        run: npm ci

      - name: Check Playwright version
        id: version-check
        working-directory: ./runtime
        run: |
          # Run the version check script and capture output and exit code
          if output=$(npx tsx script/check-playwright-version.ts 2>&1); then
            echo "version-current=true" >> $GITHUB_OUTPUT
            echo "Playwright version is current"
          else
            echo "version-current=false" >> $GITHUB_OUTPUT
            echo "new-version=$output" >> $GITHUB_OUTPUT
            echo "Playwright version is out of date. New version: $output"
          fi

      - name: Check if upgrade branch already exists
        if: steps.version-check.outputs.version-current == 'false'
        id: check-branch
        run: |
          NEW_VERSION="${{ steps.version-check.outputs.new-version }}"
          BRANCH_NAME="upgrade-playwright-to-${NEW_VERSION}-v2"

          # Check if branch exists on remote
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "branch-exists=true" >> $GITHUB_OUTPUT
            echo "Branch $BRANCH_NAME already exists"
          else
            echo "branch-exists=false" >> $GITHUB_OUTPUT
            echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "Branch $BRANCH_NAME does not exist"
          fi

      - name: Create upgrade branch and commit changes
        if: steps.version-check.outputs.version-current == 'false' && steps.check-branch.outputs.branch-exists == 'false'
        run: |
          NEW_VERSION="${{ steps.version-check.outputs.new-version }}"
          BRANCH_NAME="${{ steps.check-branch.outputs.branch-name }}"

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create and switch to new branch
          git checkout -b "$BRANCH_NAME"

          # Update the Playwright version in the constants file
          sed -i "s/export const PLAYWRIGHT_VERSION = \".*\"/export const PLAYWRIGHT_VERSION = \"$NEW_VERSION\"/" runtime/src/model/capi/playwright-constants.ts

          # Update the Playwright version in internal/launcher/playwright.go
          sed -i "s/const playwrightVersion = \".*\"/const playwrightVersion = \"$NEW_VERSION\"/" internal/launcher/playwright.go

          # Commit the changes
          git add runtime/src/model/capi/playwright-constants.ts internal/launcher/playwright.go
          git commit -m "Upgrade Playwright MCP server to version $NEW_VERSION"

          # Push the branch
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.version-check.outputs.version-current == 'false' && steps.check-branch.outputs.branch-exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const newVersion = '${{ steps.version-check.outputs.new-version }}';
            const branchName = '${{ steps.check-branch.outputs.branch-name }}';

            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upgrade Playwright MCP server to version ${newVersion}`,
              head: branchName,
              base: 'main',
              body: `This PR automatically updates the Playwright MCP server from the current version to \`${newVersion}\`.

            ### Changes
            - Updated \`PLAYWRIGHT_VERSION\` constant in \`runtime/src/model/capi/playwright-constants.ts\`
            - Updated \`playwrightVersion\` constant in \`internal/launcher/playwright.go\`

            ### Notes
            - This PR was created automatically by the weekly Playwright version check workflow
            - Please review the changelog for any breaking changes before merging
            - Consider running tests to ensure compatibility with the new version

            **Playwright Changelog**: https://github.com/microsoft/playwright-mcp/releases/tag/v${newVersion}`
            });

            console.log(`Created PR #${pullRequest.number}: ${pullRequest.html_url}`);
