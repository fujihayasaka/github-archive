run-name: Dependency Submission
on: push
jobs:
  submit-golang:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: setup-ecosystem
        uses: actions/setup-go@v6
        with:
          go-version-file: './go.mod'

      - name: OIDC Setup for goproxy
        uses: github/setup-goproxy@v1.1.0

      - name: submit-dependency-snapshot
        uses: actions/go-dependency-submission@9b61b9485bc5fd63d1c4361fd29ae3100ca2baea # v2.0.3
        with:
          go-mod-path: "./go.mod"
