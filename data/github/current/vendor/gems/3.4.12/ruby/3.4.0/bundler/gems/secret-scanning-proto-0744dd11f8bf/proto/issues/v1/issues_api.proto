syntax = "proto3";

package github.secretscanning.issues.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/issues";
option ruby_package = "GitHub::Proto::SecretScanning::Issues::V1";

import "issues/v1/issue.proto";

// IssueAPI defines the service to retrieve and handle issues for
// the Secret Scanning Service.
service IssueAPI {
  // GetIssue retrieves a specific issue mapped to the given identifier
  rpc GetIssue(GetIssueRequest) returns (GetIssueResponse);

  // GetIssueBodyHistory retrieves the history of the body of a specific issue mapped to the given identifier
  rpc GetIssueBodyHistory(GetIssueBodyHistoryRequest) returns (GetIssueBodyHistoryResponse);

  // GetIssueTitleHistory retrieves the history of the title of a specific issue mapped to the given identifier
  rpc GetIssueTitleHistory(GetIssueTitleHistoryRequest) returns (GetIssueTitleHistoryResponse);

  // GetIssueComment retrieves a specific issue comment mapped to the given identifier
  rpc GetIssueComment(GetIssueCommentRequest) returns (GetIssueCommentResponse);

  // GetIssueComment retrieves the history of a specific issue comment mapped to the given identifier
  rpc GetIssueCommentHistory(GetIssueCommentHistoryRequest) returns (GetIssueCommentHistoryResponse);

  // ListIssues retrieves a list of the issues in a repository
  rpc ListIssues(ListIssuesRequest) returns (ListIssuesResponse);

  // ListIssues retrieves a list of the issue comments in an issue
  rpc ListIssueComments(ListIssueCommentsRequest) returns (ListIssueCommentsResponse);
}

message GetIssueRequest {
  // a selection of how we are looking up the repository. 
  oneof repository {
    // repo_id is the ID of the repository to look up. (required) */
    int64 repo_id = 1;
  }

  // a selection of how we are looking up the issue.
  oneof issue {
    // issue_number is the repo-scoped number of the issue to look up. (required) */
    int64 issue_number = 2;
  }
}

message GetIssueResponse {
  // issue for the given identifier
  Issue issue = 1;
}

message GetIssueBodyHistoryRequest {
  // repo_id is the ID of the repository to look up. (required) */
  int64 repo_id = 1;
  // issue_number is the repo-scoped number of the issue to look up. (required) */
  int64 issue_number = 2;

  // cursor represents an opaque object to be used to identify where to continue on a stream of issue bodies.
  bytes cursor = 3;
}

message GetIssueBodyHistoryResponse {
  // history of the issue for the given identifier
  // the first item is the original issue body, and the rest of the history continues in chronological order
  repeated IssueBody issue_body_history = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of issue bodies.
  bytes next_cursor = 2;
}

message GetIssueTitleHistoryRequest {
  // repo_id is the ID of the repository to look up. (required) */
  int64 repo_id = 1;
  // issue_number is the repo-scoped number of the issue to look up. (required) */
  int64 issue_number = 2;

  // cursor represents an opaque object to be used to identify where to continue on a stream of issue titles.
  bytes cursor = 3;
}

message GetIssueTitleHistoryResponse {
  // history of the issue title for the given identifier
  // the first item is the first title, and the rest of the history continues in chronological order
  repeated IssueTitle issue_title_history = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of issue titles.
  bytes next_cursor = 2;
}

message GetIssueCommentRequest {
    // a selection of how we are looking up the issue comment.
    oneof issue_comment {
      // issue_comment_id is the ID of the issue comment to look up. (required) */
      int64 issue_comment_id = 1;
    }
}

message GetIssueCommentResponse {
  // issue comment for the given identifiers
  IssueComment issue_comment = 1;
}

message GetIssueCommentHistoryRequest {
    // issue_comment_id is the ID of the issue comment to look up. (required) */
    int64 issue_comment_id = 1;
    
    // cursor represents an opaque object to be used to identify where to continue on a stream of issue comments.
    bytes cursor = 2;
}

message GetIssueCommentHistoryResponse {
  // history of the issue comment for the given identifiers
  // the first item is the original comment, and the rest of the history continues in chronological order
  repeated IssueComment issue_comment_history = 1;

  // next_cursor represents an opaque object to be used to identify where to continue on a stream of issue comments.
  bytes next_cursor = 2;
}

message ListIssuesRequest {
    // repo_id is the ID of the repository to look up. (required) */
    int64 repo_id = 1;

    // cursor represents an opaque object to be used to identify where to continue on a stream of issue numbers.
    bytes cursor = 2;
}

message ListIssuesResponse {
    // the identifiers for a list of issues in this repo
    repeated IssueIdentifier identifiers = 1;

    // next_cursor represents an opaque object to be used to identify where to continue on a stream of issue numbers.
    bytes next_cursor = 2;
}

message ListIssueCommentsRequest {
    // repo_id is the ID of the repository to look up. (required) */
    int64 repo_id = 1;
  
    // issue_number is the repo-scoped number of the issue to look up. (required) */
    int64 issue_number = 2;

    // cursor represents an opaque object to be used to identify where to continue on a stream of issue numbers.
    bytes cursor = 3;
}

message ListIssueCommentsResponse {
    // issue_comment_ids is a list of the ids of the comments in this issue
    repeated int64 issue_comment_ids = 1;

    // next_cursor represents an opaque object to be used to identify where to continue on a stream of issue numbers.
    bytes next_cursor = 2;
}