version: 0.0.1
rules:
  - kind: http-rule
    url: { scheme: ["https"], domain: crates.io }
  - kind: http-rule
    url: { scheme: ["https"], domain: index.crates.io }
  - kind: http-rule
    url: { scheme: ["https"], domain: static.crates.io }
  - kind: http-rule
    url: { scheme: ["https"], domain: sh.rustup.rs }
  - kind: http-rule
    url: { scheme: ["https"], domain: static.rust-lang.org }
