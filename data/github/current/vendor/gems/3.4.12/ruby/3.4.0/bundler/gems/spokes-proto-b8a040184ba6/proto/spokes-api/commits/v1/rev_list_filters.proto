syntax = "proto3";

package github.spokes.commits.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/commits";
option ruby_package = "GitHub::Spokes::Proto::Commits::V1";

import "spokes-api/types/v1/pattern.proto";
import "spokes-api/types/v1/pathspec.proto";
import "spokes-api/types/v1/timestamp.proto";

message RevListFilters {
    message PatternOptions {

        enum Mode {
            MODE_INVALID = 0;
            MODE_BASIC_REGEXP = 1;  // default
            MODE_EXTENDED_REGEXP = 2;
            MODE_FIXED_STRINGS = 3;  // don’t interpret pattern as a regular expression
        }

        Mode mode = 1;
        bool ignore_case = 2;
    }

    github.spokes.types.v1.Timestamp since = 1;
    github.spokes.types.v1.Timestamp until = 2;
    bool ignore_merges = 3;
    repeated github.spokes.types.v1.Pattern authors = 4;
    repeated github.spokes.types.v1.Pattern committers = 5;
    PatternOptions pattern_options = 6;
    repeated github.spokes.types.v1.Pattern message_patterns = 7;
    // pathspec can optionally be specified to only include commits
    // which modify files matching at least one of the paths in the pathspec.
    github.spokes.types.v1.Pathspec pathspec = 8;
}