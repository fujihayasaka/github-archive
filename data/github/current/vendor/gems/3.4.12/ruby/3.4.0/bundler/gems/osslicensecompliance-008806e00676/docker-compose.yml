volumes:
  azurite-data:
services:
  mysql-server:
    image: mysql:8.0.36
    platform: linux/amd64
    container_name: olc-dev-db
    ports:
      - "${OLC_MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${OLC_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${OLC_MYSQL_DATABASE}
      - MYSQL_USER=${OLC_MYSQL_USER}
      - MYSQL_PASSWORD=${OLC_MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=3232505856505856 # Set max_allowed_packet to 32M
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    restart: always
    ports:
      - "127.0.0.1:10100:10000"
      - "127.0.0.1:10101:10001"
      - "127.0.0.1:10102:10002"
    command: ["azurite-blob", "--blobHost", "0.0.0.0"]
    volumes:
      - azurite-data:/azurite/dataroot

  redis:
    image: redis:7
    restart: always
    expose:
      - 6379
    healthcheck:
      start_period: 10s
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "redis-cli", "ping"]

  kafka-lite:
    image: ghcr.io/github/kafka-lite/kafka-lite:ef76e63091c87149df0c45b40d3bad2cbe4b4117
    restart: always
    platform: linux/amd64
    ports:
      - "9092:9092"
    expose:
      - 9092
    depends_on:
      - redis
    environment:
      - KAFKA_LITE_REDIS_ADDRESS=redis:6379
    command:
      - /kafka-lite
      - --store
      - redis
      - --listen-address
      - 0.0.0.0:9092
      - --seed-topic
      - github.dependencygraph.v1.SnapshotProcessed:1
    healthcheck:
      start_period: 10s
      interval: 5s
      retries: 5
      test: ["CMD-SHELL", "echo ruok | nc 127.0.0.1 9092 || exit 1"]
