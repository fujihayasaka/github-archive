syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// ObjectID represents a Git object identifier.
message ObjectID {
    // id is the 40 character hexadecimal hash value that identifies an object. (required)
    string id = 1;
}
