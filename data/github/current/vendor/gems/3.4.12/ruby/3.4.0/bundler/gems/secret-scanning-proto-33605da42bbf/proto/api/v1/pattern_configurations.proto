syntax = "proto3";

package github.secretscanning.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/api";
option ruby_package = "GitHub::Proto::SecretScanning::Api::V1";

import "types/v1/owners.proto";
import "types/v1/settings.proto";

service PatternConfigurationsAPI {
    rpc UpsertPatternConfiguration(UpsertPatternConfigurationRequest) returns (UpsertPatternConfigurationResponse);
    rpc GetPatternConfigurationByOwner(GetPatternConfigurationByOwnerRequest) returns (GetPatternConfigurationByOwnerResponse);
    rpc GetEnabledPatternCount(GetEnabledPatternCountRequest) returns (GetEnabledPatternCountResponse);
}

message UpsertPatternConfigurationRequest {
    github.secretscanning.types.v1.Owner owner = 1;
    uint64 number = 2;
    string row_version = 3;
    uint64 updated_by = 4;
    repeated PatternOverrideUpdate pattern_overrides = 5;
    repeated CustomPatternOverrideUpdate custom_pattern_overrides = 6;
    github.secretscanning.types.v1.Owner business = 7;
    string updated_by_login = 8;
}

message UpsertPatternConfigurationResponse {
    PatternConfiguration config = 1;
}

message GetPatternConfigurationByOwnerRequest {
    github.secretscanning.types.v1.Owner owner = 1;
    uint64 business_id = 2;
}

message GetPatternConfigurationByOwnerResponse {
    PatternConfiguration config = 1;
}

message GetEnabledPatternCountRequest {
    github.secretscanning.types.v1.Owner owner = 1;
    uint64 business_id = 2;
}

message GetEnabledPatternCountResponse {
    uint64 enabled_pattern_count = 1;
}

message PatternConfiguration {
   uint64 number = 1;
   github.secretscanning.types.v1.Owner owner = 2;
   string row_version = 3;
   repeated PatternOverride provider_pattern_overrides = 4;
   repeated PatternOverride custom_pattern_overrides = 5;
   int64 alert_total = 6;
}

message PatternOverride {
    string token_type = 1;
    string display_name = 2;
    string slug = 3;
    int64 alert_total = 4;
    int64 false_positives = 5;
    int64 blocks = 6;
    int64 bypasses = 7;
    PatternOverrideSetting push_protection = 8;
    string row_version = 9;
}

message PatternOverrideUpdate {
    string token_type = 1;
    github.secretscanning.types.v1.BoolSetting push_protection_setting = 2;
}

message CustomPatternOverrideUpdate {
    string token_type = 1;
    github.secretscanning.types.v1.BoolSetting push_protection_setting = 2;
    string row_version = 3;
}

message PatternOverrideSetting {
    github.secretscanning.types.v1.BoolSetting setting = 1;
    // inherited settings info. not required for upsert.
    github.secretscanning.types.v1.BoolSetting parent_setting = 2;
    github.secretscanning.types.v1.BoolSetting default_setting = 3;
}
