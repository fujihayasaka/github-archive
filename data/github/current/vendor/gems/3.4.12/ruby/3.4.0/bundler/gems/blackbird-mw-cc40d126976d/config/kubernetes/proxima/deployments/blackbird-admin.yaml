apiVersion: apps/v1
kind: Deployment
metadata:
    name: blackbird-admin
spec:
    replicas: 1
    selector:
        matchLabels:
            app: blackbird-admin
    template:
        metadata:
            labels:
                app: blackbird-admin
            annotations:
                observability.github.com/logger: fluent-bit
                observability.github.com/splunk_index: blackbird
                fluentbit.io/parser: logfmt_sloppy
        spec:
            dnsPolicy: ClusterFirst
            containers:
                - name: blackbird-admin
                  image: blackbird-mw
                  command: ["/blackbird-admin"]
                  ports:
                    - name: http
                      containerPort: 8080
                      protocol: TCP
                  readinessProbe:
                    initialDelaySeconds: 5
                    timeoutSeconds: 5
                    httpGet:
                        path: /ready
                        port: 8080
                  lifecycle:
                    preStop:
                        exec:
                            command: ["sleep", "5"]
                  envFrom:
                    - configMapRef:
                        name: kube-cluster-metadata
                    - secretRef:
                        name: vault-secrets
                  env:
                    - name: BLACKBIRD_MW_ENV
                      value: production
                    - name: BLACKBIRD_MW_STATS_ADDR
                      value: "$(KUBE_NODE_HOSTNAME):28125"
                    - name: BLACKBIRD_MW_POD
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                    - name: BLACKBIRD_MW_KUBE_NAMESPACE
                      valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                    - name: SHARED_KAFKA_BROKERS
                      value: "hydro-kafka-$(KUBE_CLUSTER_STAMP)-$(KUBE_CLUSTER_STAMP).service.$(KUBE_CLUSTER_STAMP)-az1.consul:9093,hydro-kafka-$(KUBE_CLUSTER_STAMP)-$(KUBE_CLUSTER_STAMP).service.$(KUBE_CLUSTER_STAMP)-az2.consul:9093,hydro-kafka-$(KUBE_CLUSTER_STAMP)-$(KUBE_CLUSTER_STAMP).service.$(KUBE_CLUSTER_STAMP)-az3.consul:9093"
                    - name: BLACKBIRD_KAFKA_BROKERS
                      value: "hydro-kafka-blackbird-$(KUBE_CLUSTER_STAMP)-$(KUBE_CLUSTER_STAMP).service.$(KUBE_CLUSTER_STAMP)-az1.consul:9093,hydro-kafka-blackbird-$(KUBE_CLUSTER_STAMP)-$(KUBE_CLUSTER_STAMP).service.$(KUBE_CLUSTER_STAMP)-az2.consul:9093,hydro-kafka-blackbird-$(KUBE_CLUSTER_STAMP)-$(KUBE_CLUSTER_STAMP).service.$(KUBE_CLUSTER_STAMP)-az3.consul:9093"
                    - name: MYSQL_SKEEMA_ENV
                      value: "$(KUBE_CLUSTER_STAMP)-rw"
                    - name: BLACKBIRD_MW_ACCESSIBLE_RESOURCES_REDIS_ADDR
                      value: "db-redis-blackbird-$(KUBE_CLUSTER_STAMP).redis.cache.windows.net:6380"
                    - name: BLACKBIRD_MW_ACCESSIBLE_RESOURCES_REDIS_USERNAME
                      value: default
                    - name: BLACKBIRD_MW_PAGINATION_REDIS_ADDR
                      value: "db-redis-blackbird-$(KUBE_CLUSTER_STAMP).redis.cache.windows.net:6380"
                    - name: BLACKBIRD_MW_PAGINATION_REDIS_USERNAME
                      value: default
                    - name: REDIS_USE_TLS
                      value: "true"
                    - name: CHATTERBOX_URL
                      value: "https://chatterbox.githubapp.com"
                    - name: BLACKBIRD_MW_SPOKESD_URL
                      value: "http://spokesd.spokesd-$(KUBE_CLUSTER_STAMP).svc.cluster.local"
                    - name: BLACKBIRD_MW_GITHUB_INTERNAL_API_URL
                      value: "http://unicorn-internal-api.github-$(KUBE_CLUSTER_STAMP).svc.cluster.local"
                    - name: STAMP
                      value: "$(KUBE_CLUSTER_STAMP)"
                    - name: BLACKBIRD_ENV
                      value: dsa_client
                    - name: RUST_LOG
                      value: warn
                    - name: GOMAXPROCS
                      value: "1" # limits.cpu - 1
                  volumeMounts:
                    - name: blackbird-chatops-config
                      mountPath: /config
                  resources:
                    requests:
                        cpu: 1.0
                        memory: "512M"
                    limits:
                        cpu: 2.0
                        memory: "1G"
            volumes:
                - name: blackbird-chatops-config
                  configMap:
                    name: chatops-config
