syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// TransactionContext is a common structure containing transaction-related
// state for clients to propagate to subsequent requests.
message TransactionContext {
    // transaction_state is the updated transaction state after performing a
    // write.
    bytes transaction_state = 1;
}
