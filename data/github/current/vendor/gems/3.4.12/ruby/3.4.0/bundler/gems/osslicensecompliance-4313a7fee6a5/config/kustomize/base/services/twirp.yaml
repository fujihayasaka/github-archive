apiVersion: v1
kind: Service
metadata:
  name: osslicensecompliance-twirp
  labels:
    service: osslicensecompliance-twirp
  annotations:
    moda.github.net/domain-name: "osslicensecompliance-twirp-%environment%.service.%region%.github.net"
    moda.github.net/istio-ingress-enabled: "true"
    opaque.github.net/checks: |
      - http:
          url: https://{{.Instance.Name}}/_ping
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: http
  selector:
    app: osslicensecompliance-twirp
  type: LoadBalancer
