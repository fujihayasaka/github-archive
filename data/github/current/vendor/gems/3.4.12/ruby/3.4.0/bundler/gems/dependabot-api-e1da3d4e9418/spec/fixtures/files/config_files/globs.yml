version: 2
updates:
  - package-ecosystem: "bundler"
    directories:
    - "**"
    - "src/*"
    schedule:
      interval: "daily"
  # This is ok because the target-branch is different
  - package-ecosystem: "bundler"
    target-branch: dev
    directories:
    - "/other-*"
    schedule:
      interval: "daily"
  # This is ok because the package-manager is different
  - package-ecosystem: gomod
    directories:
    - "**"
    schedule:
      interval: "daily"