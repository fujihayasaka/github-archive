repository:
  sweagentd:
    issues:
      on:
        labels-changed:
          - uses: github/label-to-project-field-value
            with:
              projects:
                - number: 21230
                  mappings:
                    - field: Severity
                      options:
                        - name: Sev 1
                          labels:
                            - support-sev1
                        - name: Sev 2
                          labels:
                            - support-sev2
                        - name: Sev 3
                          labels:
                            - support-sev3
