version: 2
registries:
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: PAT
    password: ${{"{{"}}secrets.BASE_CONTAINER_IMAGE_READER_DEPENDABOT}}
updates:
  - package-ecosystem: docker
    registries:
      - ghcr
    directory: "/"
    schedule:
      interval: weekly
    groups:
      baseImages:
        patterns:
          - "*"  
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "github/internal-actions"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-packages:
        patterns:
          - "*"