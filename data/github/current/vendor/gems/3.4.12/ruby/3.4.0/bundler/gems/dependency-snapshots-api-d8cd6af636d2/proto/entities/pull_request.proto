syntax = "proto3";

import "google/protobuf/timestamp.proto";

package github.dependency_snapshots_api.entities;

option go_package = "proto/entities";

// https://github.com/github/hydro-schemas/blob/b8e74d96b0ea48e0ab6c93879d197d71ccdd4e40/proto/hydro/schemas/github/v1/entities/pull_request.proto

// You can get this in the monolith with:
// pr = PullRequest.find_by(repository_id: snapshot.repository_id, head_sha: snapshot.sha)
message PullRequest {
  // The pull request database id.
  uint64 id = 1;

  // The ID of the user who authored the pull request.
  uint64 author_id = 3;

  // The pull request state.
  enum PullRequestState {
    UNKNOWN = 0;
    OPEN = 1;
    CLOSED = 2;
    MERGED = 3;
  }
  PullRequestState pull_request_state = 4;

  // The pull request created at timestamp.
  google.protobuf.Timestamp created_at = 5;

  // The pull request updated at timestamp.
  google.protobuf.Timestamp updated_at = 6;

  // The draft status of the pull request.
  bool draft = 7;

  // The total number of commits in this pull request
  // We could've include all the commit refs in here. But in the worst case,
  // the maximum number of commit refs is 10K refs and this could add signifcant
  // payload size overhead. (@nronas, @tiabas)
  uint64 total_commits = 8;

  // The name of the branch that will be merged into the PR's base branch.
  bytes head_branch = 9;

  // The name of the branch that will receive this PR's changes.
  bytes base_branch = 10;

  // When the pull request was merged.
  google.protobuf.Timestamp merged_at = 11;

  // The head SHA or head OID of the ref.
  string head_sha = 12;

  // The base SHA or base OID of the ref.
  string base_sha = 13;
}
