---
secrets:
  DEPENDENCY_GRAPH_HMAC_SECRET:
    key: DEPENDENCY_GRAPH_HMAC_SECRET
    type: HMAC
    owner: "@github/dependency-graph"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/hmac/
    externally_usable: false
    kind: latest_at_deployment_start
  TWIRP_HMAC_KEYS:
    key: TWIRP_HMAC_KEYS
    type: HMAC
    owner: "@github/dependency-graph"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/hmac/
    externally_usable: false
    kind: latest_at_deployment_start
  OLC_MYSQL_PASSWORD:
    key: OLC_MYSQL_PASSWORD
    type: mysql
    owner: "@github/database-infrastructure"
    playbook: https://github.com/github/databases/blob/main/docs/mysql/playbooks/mysql-create-user.md#rotate-user-credentials
    externally_usable: false
    kind: latest_at_deployment_start
  OLC_MYSQL_USER:
    key: OLC_MYSQL_USER
    type: credentials
    owner: "@github/database-infrastructure"
    playbook: https://github.com/github/databases/blob/main/docs/mysql/playbooks/mysql-create-user.md#rotate-user-credentials
    externally_usable: false
    kind: latest_at_deployment_start
  kittens:
    key: kittens
    type: kittens
    owner: "@github/sae-iam"
    externally_usable: false
    kind: latest_at_deployment_start
  spn_staging_osslicensecompliance:
    key: spn_staging_osslicensecompliance
    type: azure_spn
    owner: "@github/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn
    externally_usable: true
    kind: latest_at_deployment_start
  spn_staging_osslicensecompliance_client_id:
    key: spn_staging_osslicensecompliance_client_id
    type: credentials
    owner: "@github/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn
    externally_usable: true
    kind: latest_at_deployment_start
  spn_staging_osslicensecompliance_tenant_id:
    key: spn_staging_osslicensecompliance_tenant_id
    type: config
    owner: "@github/sae-ps"
    playbook: https://thehub.github.com/security/security-operations/secrets/secrets-rotation/azure-spn
    externally_usable: true
    kind: latest_at_deployment_start
