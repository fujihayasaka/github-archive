syntax = "proto3";

package github.secretscanning.businesses.v1;

option go_package = "github.com/github/secret-scanning-proto/gen/go/v1/businesses";
option ruby_package = "GitHub::Proto::SecretScanning::Businesses::V1";

import "businesses/v1/business.proto";

// BusinessAPI defines the service to retrieve and handle businesses for
// the Secret Scanning Service.
service BusinessAPI {
  // GetBusiness retrieves a specific business mapped to the given identifier
  rpc GetBusiness(GetBusinessRequest) returns (GetBusinessResponse);
}

message GetBusinessRequest {
  // A selection of how we are looking up the business. 
  oneof business {
    // biz_id is the ID of the business to look up.
    int64 biz_id = 1;
    // The slug to look up.
    string slug = 2;
  }
}

message GetBusinessResponse {
  // business for the given identifier
  Business business = 1;
}
