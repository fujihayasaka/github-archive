version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/package"
    target-branch: "develop"
    schedule:
      interval:
      interval: "daily"
    versioning-strategy: "increase-if-necessary"
    reviewers:
      - "drwho"
      - "bot/sec"
    labels:
      - "security"
      - "deps"
    assignees:
      - "drwho"
    allow:
      - update-type: "none"
      - {}
      - rogue_key: "hi"
    ignore:
      - {}
      - dependency-name: "rails"
        rogue_key: "hi"

  - package-ecosystem: "bundler"
    directory: "/rb"
    target-branch: "rollout"
    schedule:
      interval:
      interval: "daily"
    versioning-strategy: "widen"
    reviewers:
      - "drwho"
      - 1
    labels:
      - "security"
      - "deps"
    assignees:
      - "drwho"
    allow:
      - dependency-type: "indirect"
