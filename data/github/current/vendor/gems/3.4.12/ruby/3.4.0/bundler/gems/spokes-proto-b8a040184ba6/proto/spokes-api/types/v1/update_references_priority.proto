syntax = "proto3";

package github.spokes.types.v1;

option go_package = "github.com/github/spokes-proto/gen/go/v1/types";
option ruby_package = "GitHub::Spokes::Proto::Types::V1";

// UpdateReferencessPriority represents the priority with which to update refs.
message UpdateReferencesPriority {
    enum Priority {
        PRIORITY_INVALID = 0;
        PRIORITY_LOW = 1;
        PRIORITY_HIGH = 2;
    }

    // priority indicates the priority with which to update.
    Priority priority = 1;
}
