# CCA E2E Feature Flags
# ====================
# Single source of truth for feature flags required by the e2e dev environment.
#
# Referenced by: script/setup-codespaces-copilot-swe-agent-v2
#
# Format:
#   [section]           — Group name (used by setup script to apply flags by stage)
#   enable FLAG_NAME    — Enable this flag
#   disable FLAG_NAME   — Disable this flag
#
# Lines starting with # are comments. Blank lines are ignored.

# ---------------------------------------------------------------------------
# [core] — SWE Agent flags, enabled during main setup
# ---------------------------------------------------------------------------
[core]
enable copilot_swe_agent
enable copilot_coding_agent_premium_requests
enable copilot_global_overlay_v2
enable copilot_immersive_agent_branch_selection
enable coding_agent_model_selection
enable coding_agent_model_selection_all_skus
enable copilot_lotus
enable sweagent_send_enabled
enable coding_agent_capi_version_20260109

# ---------------------------------------------------------------------------
# [agentshq] — Agents HQ / Codex, enabled during 3P agent seeding
# ---------------------------------------------------------------------------
[agentshq]
enable agentshq_policy
enable agentshq_mention

# ---------------------------------------------------------------------------
# [capi] — CAPI flags, enabled with --capi (local CAPI mode)
# ---------------------------------------------------------------------------
[capi]
enable copilot_api_agentproxy_token_descryption
enable copilot_api_enable_model_claude_sonnet4_AWS
enable copilot_api_enable_model_kiwi_openai_production
enable copilot_api_enable_model_gpt41_openai
enable copilot_api_model_rollout_claude35sonnet_integrations_no_users
enable copilot_model_registry_kiwi_rollout
disable copilot_api_agent_sessions
disable copilot_api_combined_usage_store
disable copilot_mission_control_service_proxy
disable copilot_swe_agent_firewall_enabled_by_default

# ---------------------------------------------------------------------------
# [prod-capi] — Flags toggled when using production CAPI (no --capi)
# ---------------------------------------------------------------------------
[prod-capi]
disable copilot_api_agent_sessions

# ---------------------------------------------------------------------------
# [e2e-extras] — Additional flags from e2e-development.md (manual steps)
# ---------------------------------------------------------------------------
[e2e-extras]
enable copilot_swe_agent_skip_agent_job_concurrency_limit
