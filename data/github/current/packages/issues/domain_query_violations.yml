    pull_requests.reviewable_state, pull_requests.reviews_with_body_count, pull_requests.review_comments_with_body_count,
    pull_requests.status FROM pull_requests INNER JOIN issues ON issues.pull_request_id
    = pull_requests.id WHERE pull_requests.repository_id = ? AND pull_requests.user_hidden
    = ? AND issues.id IN (SELECT issues_labels.issue_id FROM issues_labels WHERE issues_labels.label_id
    IN (SELECT labels.id FROM labels WHERE labels.repository_id = ? AND labels.lowercase_name
    IN (x?, x?)))
