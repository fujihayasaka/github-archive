development:
  servers:
    - master: localhost:6379:16
      replicas: localhost:6379:16

test:
  servers:
    - master: localhost:<%= 6379 + (ENV['TEST_ENV_NUMBER'] || 0).to_i %>:16
      replicas: localhost:<%= 6379 + (ENV['TEST_ENV_NUMBER'] || 0).to_i %>:16

# production redis config is stored in config/protected/redis_concurrent_request_limiter.yml
