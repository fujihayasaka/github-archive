apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../proxima

# scaling resources to 4x for prod-ae load testing in October 2024:
replicas:
  - name: sharedworker
    count: 24
  - name: unicorn
    count: 24
  - name: unicorn-api
    count: 46
  - name: unicorn-api-graphql
    count: 6
  - name: unicorn-gitauth-api
    count: 12
  - name: unicorn-internal-api
    count: 9
patches:
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: test
        path: /spec/template/spec/containers/2/env/13/name
        value: CPS_NETWORK_SERVICE_URL
      - op: replace
        path: /spec/template/spec/containers/2/env/13/value
        value: "https://cps-network-service-production-ae.githubapp.com/api/v1"

