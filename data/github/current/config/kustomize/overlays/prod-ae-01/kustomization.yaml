apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../base/metric-attribution

resources:
  - ../proxima
  - ../../base/commonBase/feature-flag-update-processor/feature-flag-update-processor-3
  - ../../base/commonBase/feature-flag-update-processor/feature-flag-update-processor-4
  - ../../base/commonBase/feature-flag-update-processor/feature-flag-update-processor-5

replicas:
  - name: unicorn-performance
    count: 3

patches:
  # Override proxima ScaledObject replica counts for this environment
  - target:
      kind: ScaledObject
      name: unicorn-api
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 8
      - op: replace
        path: /spec/maxReplicaCount
        value: 8
  - target:
      kind: ScaledObject
      name: unicorn-api-graphql
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 5
      - op: replace
        path: /spec/maxReplicaCount
        value: 5
  - target:
      kind: ScaledObject
      name: unicorn
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 6
      - op: replace
        path: /spec/maxReplicaCount
        value: 6
  - target:
      kind: ScaledObject
      name: unicorn-internal-api
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 3
      - op: replace
        path: /spec/maxReplicaCount
        value: 3
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: test
        path: /spec/template/spec/containers/2/env/14/name
        value: CPS_NETWORK_SERVICE_URL
      - op: replace
        path: /spec/template/spec/containers/2/env/14/value
        value: "https://cps-network-service-production-ae.githubapp.com/api/v1"
