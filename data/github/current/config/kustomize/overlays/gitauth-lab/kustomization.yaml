apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: dxcrprod.azurecr.io/docker-nginx
    digest: sha256:80c11338bbd7f71d16c66866571c2b43081be7027c0b6a901a2e5c58774c94ac

components:
  - ../../base/metric-attribution

resources:
  - ../../base/commonBase/unicorn-gitauth-api
  - ../../base/commonBase/unicorn-gitauth-api/configmaps

labels:
- includeSelectors: true
  pairs:
    service: unicorn-gitauth-api

configMapGenerator:
  - name: observability-config
    options:
      disableNameSuffixHash: true
      labels:
        kustomizeOverlayName: overlays__production__unicorn-gitauth-api
    literals:
      - GITHUB_TELEMETRY_LOGS_ENABLED="true"
      - GH_LOG_DESTINATION="stdout"
      - DOGSTATSD_SOCKET="/var/run/datadog/dsd.socket"
      - DOGSTATSD_SOCKET_ENABLED="1"



patches:
  - target:
      version: v1
      name: unicorn-gitauth-api
    patch: |-
      - op: replace
        path: /metadata/labels/kustomizeOverlayName
        value: overlays__production__unicorn-gitauth-api
  - path: ./deployments/unicorn-gitauth-api.yaml
    target:
      name: unicorn-gitauth-api
      labelSelector: "kustomizeOverlayName=overlays__production__unicorn-gitauth-api"
      group: apps
      version: v1
      kind: Deployment
  - path: ./services/unicorn-gitauth-api.yaml
    target:
      name: unicorn-gitauth-api
      labelSelector: "kustomizeOverlayName=overlays__production__unicorn-gitauth-api"
      version: v1
      kind: Service
