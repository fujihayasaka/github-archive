patches:
  # Override proxima ScaledObject replica counts for test stamp
  - target:
      kind: ScaledObject
      name: unicorn
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ScaledObject
      name: unicorn-api
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ScaledObject
      name: unicorn-api-graphql
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ScaledObject
      name: unicorn-internal-api
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ScaledObject
      name: hookworker
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  - target:
      kind: ScaledObject
      name: sharedworker
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
  # Remove replicas from KEDA-managed deployments (strategic merge)
  - target:
      kind: Deployment
      name: unicorn
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unicorn
      spec:
        replicas: null
  - target:
      kind: Deployment
      name: unicorn-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unicorn-api
      spec:
        replicas: null
  - target:
      kind: Deployment
      name: unicorn-api-graphql
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unicorn-api-graphql
      spec:
        replicas: null
  - target:
      kind: Deployment
      name: unicorn-internal-api
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unicorn-internal-api
      spec:
        replicas: null

  # Rename the base-namespace to the stamp-specific namespace (matches the
  # pattern used by staff-wus2-01 and the other per-stamp overlays).
  - target:
      kind: Namespace
      name: base-namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: github-test-krc-01
      - op: replace
        path: "/metadata/labels/github.com~1name"
        value: github-test-krc-01
  - target:
      kind: ResourceQuota
      name: pod-object-count
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: github-test-krc-01

  # billing-zuora-webhook-processor's base annotation allows 1 missing
  # ready pod. With replicas=1 across this test stamp, that's 100%
  # missing, which exceeds the moda-linter 25% threshold. Remove the
  # annotation for test-krc-01 so the default applies.
  - target:
      kind: Deployment
      name: billing-zuora-webhook-processor
    patch: |-
      - op: remove
        path: /metadata/annotations/moda.github.net~1allow-missing-ready-pods
