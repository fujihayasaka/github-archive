apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/proxima

# Minimum replica counts for test stamp with no tenant traffic.
# All services set to 1 replica (minimum viable) except processors
# that lack backing services, which are set to 0.
replicas:
  # Unicorn (Rails monolith) — 1 replica each
  - name: unicorn-gitauth-api
    count: 1
  - name: unicorn-performance
    count: 1
  # Workers — 1 replica each
  - name: timerd
    count: 1
  # Event processors — 1 replica (minimum functional for error visibility)
