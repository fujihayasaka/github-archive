apiVersion: v1
kind: Service
metadata:
    annotations:
        kubernetes.io/ingress.class: null
        haproxy.org/load-balance: null
        haproxy.org/check-interval: null
        haproxy.org/backend-config-snippet: null
        opaque.github.net/checks: |-
            - http:
                url: "https://api.github.com/status"
              tags:
                  - "api-type:unicorn-api-copilot"
                  - "dotcom-api:true"
    name: unicorn-api
spec:
    ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 80
          nodePort: null
