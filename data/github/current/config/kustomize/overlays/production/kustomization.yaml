      kind: ResourceQuota
      name: pod-object-count
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: github-production
  - target:
      kind: Deployment
      name: billing-platform-actions-usage-relay
    patch: |-
      - op: replace
        path: /spec/replicas
