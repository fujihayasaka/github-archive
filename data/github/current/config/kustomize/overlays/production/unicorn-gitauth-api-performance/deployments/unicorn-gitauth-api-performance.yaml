---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-gitauth-api
  annotations:
    heaven.githubapp.com/cluster-preferences: |
      {
        "dotcom-1-ash1-iad":  {
          "spec": {
            "template": {
              "spec": {
                "affinity": {
                  "nodeAffinity": {
                    "preferredDuringSchedulingIgnoredDuringExecution": [
                      { "weight": 1,
                        "preference": {
                          "matchExpressions": [
                            { "key": "kubernetes.github.com/pool",
                              "operator": "In",
                              "values": ["performance-testing"]
                            }
                          ]
                        }
                      }
                    ]
                  }
                }
              }
            }
          }
        }
      }
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: gpanel.githubapp.com/machine_type
                operator: In
                values:
                - general5.m.large
      containers:
        - name: nginx
          env:
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /etc/nginx/
            - name: NGINX_ENVSUBST_FILTER
              value: GITAUTH_MIRROR_
            - name: GITAUTH_MIRROR_REQUESTS
              valueFrom:
                secretKeyRef:
                  name: vault-secrets
                  key: GITAUTH_MIRROR_REQUESTS
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/
              name: nginx-conf
            - mountPath: /etc/nginx/
              name: nginx-conf
              $patch: delete
            - mountPath: /etc/nginx/templates/
              name: nginx-mirror-conf
        - name: unicorn
          env:
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: kube_deployment:unicorn-gitauth-api-performance
      volumes:
        - configMap:
            name: unicorn-gitauth-api-mirror-conf-performance
          name: nginx-mirror-conf
      tolerations:
        - effect: NoSchedule
          key: dedicated
          operator: Equal
          value: performance-testing
