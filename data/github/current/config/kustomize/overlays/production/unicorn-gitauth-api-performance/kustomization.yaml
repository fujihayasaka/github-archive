apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - ../../../base/commonBase/unicorn-gitauth-api

replicas:
    - name: unicorn-gitauth-api
      count: 3

nameSuffix: -performance

commonLabels:
  service: unicorn-gitauth-api-performance

configMapGenerator:
  - name: unicorn-gitauth-api-mirror-conf
    options:
      disableNameSuffixHash: true
      labels:
        kustomizeOverlayName: overlays__production__unicorn-gitauth-api-performance
    files:
      - ./configmaps/nginx.conf.template
generatorOptions:
  annotations: {}

patches:
  - target:
      version: v1
      name: unicorn-gitauth-api
    patch: |-
      - op: replace
        path: /metadata/labels/kustomizeOverlayName
        value: overlays__production__unicorn-gitauth-api-performance
  - path: ./services/unicorn-gitauth-api-performance.yaml
    target:
      labelSelector: "kustomizeOverlayName=overlays__production__unicorn-gitauth-api-performance"
      kind: Service
      version: v1
      name: unicorn-gitauth-api
  - path: ./deployments/unicorn-gitauth-api-performance.yaml
    target:
      kind: Deployment
      labelSelector: "kustomizeOverlayName=overlays__production__unicorn-gitauth-api-performance"
      group: apps
      version: v1
