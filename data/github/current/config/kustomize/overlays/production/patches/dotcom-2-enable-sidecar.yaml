apiVersion: apps/v1
kind: Deployment
metadata:
  name: UNUSED
  annotations:
    # Enable sidecar only on the dotcom-2-ash1-iad cluster
    moda.github.net/cluster-preferences: |-
      {
        "dotcom-2-ash1-iad": {
          "spec": {
            "template": {
              "metadata": {
                "labels": {
                  "sidecar.istio.io/inject": "true",
                  "istio.io/rev": "stable",
                  "moda.github.net/proxy-bypass": "outbound-non-mesh"
                }
              },
              "spec": {
                "dnsPolicy": "ClusterFirst"
              }
            }
          }
        }
      }
