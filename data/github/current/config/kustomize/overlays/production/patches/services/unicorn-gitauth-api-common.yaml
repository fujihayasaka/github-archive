---
apiVersion: v1
kind: Service
metadata:
  name: unicorn-gitauth-api
  annotations:
    haproxy.org/check-interval: 5s
    haproxy.org/load-balance: leastconn
    haproxy.org/backend-config-snippet: |-
      option redispatch 1
      option httpchk
      http-check connect
      http-check send meth GET uri /_ping ver HTTP/1.1 hdr host github.com
