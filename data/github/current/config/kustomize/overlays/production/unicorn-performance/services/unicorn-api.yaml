---
apiVersion: v1
kind: Service
metadata:
  name: unicorn-api
  annotations:
    moda.github.net/canary-v2: "false"
    kubernetes.io/ingress.class: haproxytech-unicorn-api-performance
    opaque.github.net/checks: |-
      - http:
          url: "https://api.github.com/rate_limit"
          header:
              authorization: "Bearer {{ .Env.GITHUB_API_TOKEN }}"
        tags:
            - "api-type:unicorn-api-performance"
            - "dotcom-api:true"
  labels:
    service: unicorn-api-performance
spec:
  selector:
    service: unicorn-performance
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
      nodePort: null
