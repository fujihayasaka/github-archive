apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - ../../../base/production/unicorn-api/
    - ../../../base/production/unicorn/

nameSuffix: -performance

# We only want to duplicate the unicorn deployment, not unicorn-api
patches:
  - |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unicorn-api

patchesJson6902:
  - target:
      kind: Service
      name: unicorn-api
    patch: |-
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-v2
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: "haproxytech-unicorn-api-performance"
      - op: replace
        path: /metadata/labels/service
        value: unicorn-api-performance
      - op: replace
        path: /spec/selector/service
        value: unicorn-performance
      - op: remove
        path: /spec/ports/0/nodePort
      - op: replace
        path: /metadata/annotations/opaque.github.net~1checks
        value:  |
          - http:
              url: "https://api.github.com/rate_limit"
              header:
                  authorization: "Bearer {{ .Env.GITHUB_API_TOKEN }}"
            tags:
                - "api-type:unicorn-api-performance"
                - "dotcom-api:true"
  - target:
      kind: Service
      name: unicorn
    patch: |-
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: "haproxytech-unicorn-performance"
      - op: replace
        path: /metadata/labels/service
        value: unicorn-performance
      - op: replace
        path: /spec/selector/service
        value: unicorn-performance
      - op: remove
        path: /spec/ports/0/nodePort
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 0
      - op: replace
        path: /spec/strategy/rollingUpdate/maxSurge
        value: 100%
      - op: replace
        path: /spec/selector/matchLabels/service
        value: unicorn-performance
      - op: replace
        path: /spec/template/metadata/labels/service
        value: unicorn-performance
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: KUBE_DEPLOYMENT_NAME
          value: unicorn-performance
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: DD_PROFILING_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: DD_SERVICE
          value: $(OTEL_SERVICE_NAME)
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: DD_ENV
          value: $(GH_OTEL_DEPLOYMENT_ENVIRONMENT)
      - op: add
        path : /spec/template/spec/containers/2/env/-
        value:
          name: DD_VERSION
          value: $(GH_OTEL_SERVICE_VERSION)
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: DD_PROFILING_TIMELINE_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: LUC_PERFORMANCE
          value: "1"
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: DD_TRACE_AGENT_URL
          value: "http://$(DOGSTATSD_HOST):28126"
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: DD_PROFILING_ALLOCATION_ENABLED
          value: "true"
      - op: add
        path: /metadata/annotations/moda.github.net~1cluster-preferences
        value: >
          {
            "dotcom-1-ash1-iad": {
              "spec": {
                "replicas": 12,
                "template": {
                  "spec": {
                    "affinity": {
                      "nodeAffinity": {
                        "preferredDuringSchedulingIgnoredDuringExecution": [
                          {
                            "weight": 1,
                            "preference": {
                              "matchExpressions": [
                                {
                                  "key": "kubernetes.github.com/pool",
                                  "operator": "In",
                                  "values": [
                                    "performance-testing"
                                  ]
                                }
                              ]
                            }
                          }
                        ]
                      }
                    },
                    "containers": [
                      {
                        "name": "unicorn",
                        "env": [
                          {
                            "name": "GH_UNICORN_WORKER_COUNT",
                            "value": "10"
                          }
                        ],
                        "resources": {
                          "requests": {
                            "cpu": 7,
                            "memory": "18Gi"
                          }
                        }
                      }
                    ]
                  }
                }
              }
            }
          }
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - effect: NoSchedule
            key: dedicated
            operator: Equal
            value: performance-testing
      - op: remove
        path: /metadata/annotations/moda.github.net~1allow-missing-ready-pods
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-v2
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-replicas
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-label
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-maxunavailable
