---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/production/unicorn-api/
  - ../../../base/production/unicorn/
  - ./configmaps/degrader.yaml

nameSuffix: -performance

configMapGenerator:
  - name: unicorn-mirror-conf
    options:
      disableNameSuffixHash: true
    files:
      - nginx.conf.template
generatorOptions:
  annotations: {}

patches:
  # We only want to duplicate the unicorn deployment, not unicorn-api
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unicorn-api
  - path: ./services/unicorn-api.yaml
  - path: ./services/unicorn.yaml
  - path: ./deployments/unicorn.yaml
  - target:
      kind: Service
      name: unicorn-api
    patch: |-
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-v2
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: remove
        path: /metadata/annotations/moda.github.net~1allow-missing-ready-pods
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-v2
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-replicas
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-label
      - op: remove
        path: /metadata/annotations/moda.github.net~1canary-maxunavailable

replicas:
  - name: unicorn
    count: 3
