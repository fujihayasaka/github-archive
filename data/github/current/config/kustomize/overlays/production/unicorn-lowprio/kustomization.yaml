apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - poddisruptionbudgets/unicorn-lowprio.yaml
  - scaledobjects/unicorn-lowprio.yaml
  - ../../../base/production/unicorn/

replicas:
    - name: unicorn
nameSuffix: -lowprio

labels:
  - pairs:
      service: unicorn-lowprio
    includeSelectors: true

transformers:
  - ./transformers/remove-replicas.yaml

patches:
    - path: ./deployments/unicorn-lowprio.yaml
    - path: ./services/unicorn-lowprio.yaml
