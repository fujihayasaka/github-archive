apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: unicorn
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1500
  maxReplicaCount: 50
  minReplicaCount: 15
  scaleTargetRef:
    name: unicorn-lowprio
    envSourceContainerName: unicorn
  triggers:
    - metadata:
        containerName: unicorn
        value: "70"
      metricType: Utilization
      type: cpu
