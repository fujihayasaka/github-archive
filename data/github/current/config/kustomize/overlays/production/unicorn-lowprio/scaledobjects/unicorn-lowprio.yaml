apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: unicorn
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1500
  maxReplicaCount: 95
  minReplicaCount: 15
  scaleTargetRef:
    name: unicorn-lowprio
    envSourceContainerName: unicorn
  triggers:
    - metadata:
        containerName: unicorn
        value: "70"
      metricType: Utilization
      type: cpu
    - type: datadog
      authenticationRef:
        kind: ClusterTriggerAuthentication
        name: keda-trigger-auth-datadog-secret
      metricType: Value
      metadata:
        age: "300"
        query: >-
          (avg:unicorn.workers{kube_deployment:unicorn-lowprio,kube_cluster:%cluster%}
          - avg:unicorn.idle_workers{kube_deployment:unicorn-lowprio,kube_cluster:%cluster%})
          * 100
          / avg:unicorn.workers{kube_deployment:unicorn-lowprio,kube_cluster:%cluster%}
        queryValue: "60"
