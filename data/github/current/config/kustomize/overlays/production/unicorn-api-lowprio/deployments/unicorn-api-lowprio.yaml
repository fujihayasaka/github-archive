---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  annotations:
    moda.github.net/canary-replicas: null
    moda.github.net/allow-missing-ready-pods: null

spec:
  selector:
    matchLabels:
      service: unicorn-api-lowprio
  template:
    metadata:
      labels:
        service: unicorn-api-lowprio
        sidecar.istio.io/inject: "true"
        istio.io/rev: stable
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: nginx
        - name: unicorn
          resources:
            requests:
              cpu: 6
          env:
            - name: KUBE_DEPLOYMENT_NAME
              value: unicorn-api-lowprio
            - name: USERS_CACHE_CONNECT_API
              value: "0"
