apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - poddisruptionbudgets/unicorn-api-lowprio.yaml
  - ../../../base/production/unicorn-api/

replicas:
    - name: unicorn-api
      count: 10
nameSuffix: -lowprio

labels:
  - pairs:
      service: unicorn-api-lowprio
    includeSelectors: true

patches:
    - path: ./deployments/unicorn-api-lowprio.yaml
    - path: ./services/unicorn-api-lowprio.yaml
