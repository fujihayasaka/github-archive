apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/commonBase/unicorn-api-lowprio/poddisruptionbudgets/
  - scaledobjects/unicorn-api-lowprio.yaml
  - ../../../base/production/unicorn-api/

replicas:
    - name: unicorn-api
nameSuffix: -lowprio

labels:
  - pairs:
      service: unicorn-api-lowprio
    includeSelectors: true

transformers:
  - ./transformers/remove-replicas.yaml

patches:
    - path: ./deployments/unicorn-api-lowprio.yaml
    - path: ./services/unicorn-api-lowprio.yaml
