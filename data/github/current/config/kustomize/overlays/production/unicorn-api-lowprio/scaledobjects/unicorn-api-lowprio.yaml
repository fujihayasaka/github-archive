apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: unicorn-api
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 1500
  maxReplicaCount: 30
  minReplicaCount: 8
  scaleTargetRef:
    name: unicorn-api-lowprio
    envSourceContainerName: unicorn
  triggers:
    - metadata:
        containerName: unicorn
        value: "55"
      metricType: Utilization
      type: cpu
