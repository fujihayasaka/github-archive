apiVersion: v1
kind: Service
metadata:
    annotations:
        kubernetes.io/ingress.class: haproxytech-unicorn-api-lowprio
        opaque.github.net/checks: |-
            - http:
                url: "https://api.github.com/rate_limit"
              tags:
                  - "api-type:unicorn-api-lowprio"
                  - "dotcom-api:true"
    name: unicorn-api
spec:
    ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: 80
          nodePort: null
