---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  annotations:
    moda.github.net/canary-replicas: 6
    moda.github.net/canary-maxunavailable: 1
    moda.github.net/allow-missing-ready-pods: 3
    moda.github.net/cluster-preferences: |
      {
        "dotcom-7-va3-iad": {
          "spec": {
            "template": {
              "spec": {
                "containers": [
                  {
                    "name": "unicorn",
                    "env": [
                      {
                        "name": "UNICORN_CHECK_CLIENT_CONNECTION_ENABLED",
                        "value": "1"
                      }
                    ]
                  }
                ]
              }
            }
          }
        }
      }

spec:
  selector:
    matchLabels:
      service: unicorn-api-graphql
  template:
    metadata:
      labels:
        service: unicorn-api-graphql
    spec:
      containers:
        - name: nginx
        - name: unicorn
          env:
            - name: KUBE_DEPLOYMENT_NAME
              value: unicorn-api-graphql
            - name: GH_UNICORN_WORKER_COUNT
              value: "10"
          resources:
            requests:
              cpu: 7
              memory: 16Gi
            limits:
              memory: 20Gi
