spec:
  replicas: 205
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "500m"
        sidecar.istio.io/proxyCPULimit: "4"
        sidecar.istio.io/proxyMemory: "256Mi"
        sidecar.istio.io/proxyMemoryLimit: "2Gi"
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: gpanel.githubapp.com/machine_type
                operator: In
                values:
                - general5.m.large
                - storage5.m.large
            weight: 1
      containers:
        - name: nginx
        - name: voltron
        - name: unicorn
          env:
            # Path to a 24-hour projected service account token for use with Azure AD
            # tenants that reject federated tokens with lifetime > 25 hours (AADSTS70023),
            # e.g. the Microsoft tenant. The webhook-injected AZURE_FEDERATED_TOKEN_FILE
            # uses 7 days for k8s control plane resilience and must not be changed.
            - name: AZURE_FEDERATED_TOKEN_FILE_SHORT
              value: /var/run/secrets/azure-msft/token
          volumeMounts:
            - name: azure-federated-token-msft
              mountPath: /var/run/secrets/azure-msft
              readOnly: true
          resources:
            requests:
              cpu: 6
              memory: "20Gi"
            limits:
              memory: "26Gi"
      volumes:
        - name: azure-federated-token-msft
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 86400
                  audience: api://AzureADTokenExchange
