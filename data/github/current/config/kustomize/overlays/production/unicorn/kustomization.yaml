apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/production/unicorn/
  - poddisruptionbudgets/unicorn.yaml


patches:
  - target:
      kind: Service
      name: unicorn
    patch: |-
        - op: add
          path: /metadata/annotations/moda.github.net~1canary-v2
          value: "true"
