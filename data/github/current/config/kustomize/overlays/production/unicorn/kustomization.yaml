apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/production/unicorn/
  - ../../../base/commonBase/unicorn/poddisruptionbudgets/
  - scaledobjects/unicorn.yaml

transformers:
  - ./transformers/remove-replicas.yaml

patches:
  - target:
      kind: Service
      name: unicorn
    patch: |-
        - op: add
          path: /metadata/annotations/moda.github.net~1canary-v2
          value: "true"

  - target:
      kind: Service
      name: unicorn
    patch: |-
        - op: replace
          path: /metadata/annotations/octomesh.github.com~1paused
          value: "false"
  - path: ./deployments/unicorn.yaml
