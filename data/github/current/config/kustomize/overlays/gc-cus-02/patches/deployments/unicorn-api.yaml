---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  annotations:
      moda.github.net/canary-label: role
      moda.github.net/canary-maxunavailable: "1"
      moda.github.net/canary-replicas: "2"
      moda.github.net/canary-v2: "true"
spec:
  replicas: 14
  template:
    spec:
      containers:
        - name: nginx
        - name: unicorn
          env:
            - name: TEST_KEY
              value: "unicorn-api"
