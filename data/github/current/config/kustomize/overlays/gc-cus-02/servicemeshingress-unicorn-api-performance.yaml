apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshIngress
metadata:
  name: unicorn-api-performance
spec:
  replicas: 2
  routeTraffic: true
  resources:
    limits:
      cpu: "8"
      memory: 2Gi
    requests:
      cpu: "1.5"
      memory: 1.5Gi
  services:
    - unicorn-api-performance
