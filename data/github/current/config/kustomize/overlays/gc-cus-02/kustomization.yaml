# you can use the patches here to apply those changes. Each patch file should contain the necessary patches
# to modify the respective deployment as needed. Avoid creating patches directly in this file to keep it clean.
patches:
  - target:
      kind: Namespace
      name: github-azure
    patch: |-
      - op: replace
        path: "/metadata/labels/github.com~1name"
        value: github-production
  - target:
      kind: ServiceMeshConfig
      name: config
    patch: |-
      - op: replace
        path: /spec/authorization/strictTLS
        value: true
  - target:
      kind: Deployment
      labelSelector: service=unicorn
    path: patches/deployments/unicorn.yaml
  - target:
      kind: Deployment
      name: unicorn
      labelSelector: service=unicorn
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      labelSelector: service=unicorn-api
    path: patches/deployments/unicorn-api.yaml
  - target:
      kind: Deployment
      name: unicorn-api
      labelSelector: service=unicorn-api
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      name: unicorn-internal-api
