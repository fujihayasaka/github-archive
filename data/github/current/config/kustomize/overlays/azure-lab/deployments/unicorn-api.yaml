apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  annotations:
    moda.github.net/allow-missing-ready-pods: null
    moda.github.net/canary-v2: null
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
  template:
    spec:
      containers:
        - name: unicorn
          env:
            - name: SMTP_HOST
              value: smtp.service.github.net
            - name: GH_HOSTNAME
              value: github.com
            - name: GITHUB_CONFIG_ROLE
              value: api
          resources:
            limits:
              memory: 20Gi
            requests:
              cpu: 7
              memory: 16Gi
