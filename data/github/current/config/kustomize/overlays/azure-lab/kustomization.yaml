apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: github-azure-lab

components:
  - ../../base/metric-attribution

images:
  - name: octofactory.service.private-us-east-1.github.net/moda-artifacts-docker/docker-nginx
    digest: sha256:d0ef7e93ea4b71d6e84acc0d9860e4d6dd4e219afdce99b2481bfa9506446cdc

configMapGenerator:
  - name: elasticsearch
    options:
      disableNameSuffixHash: true
      annotations:
        moda.github.net/canary-v2: "true"
    literals:
      - AUDITLOGSEARCH3_URL=https://auditlogsearch3-ssl.service.iad.github.net
      - COMMIT_SEARCH_1_URL=https://commit-search-1.service.iad.github.net
      - GENERAL_SEARCH_1_URL=https://general-search-1.service.iad.github.net
      - GITHUBSEARCH6_URL=https://githubsearch6-ssl.service.iad.github.net
  - name: observability-config
    options:
      disableNameSuffixHash: true
      annotations:
        moda.github.net/canary-v2: "true"
    literals:
      - GITHUB_TELEMETRY_LOGS_ENABLED="true"
      - GH_LOG_DESTINATION="stdout"
      - FAILBOT_HAYSTACK_URL_MESH=http://failbotg.failbotg-production.svc.cluster.local/api/needles
      - DOGSTATSD_SOCKET="/var/run/datadog/dsd.socket"
      - DOGSTATSD_SOCKET_ENABLED="1"

resources:
  - ../../base/production/unicorn-api/
  - ../../base/production/unicorn-api/configs/
  - ./namespaces/namespace.yaml

patches:
  - path: ./deployments/unicorn-api.yaml
  - path: ./services/unicorn-api.yaml
