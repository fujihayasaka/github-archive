apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: github-azure-lab

resources:
  - ../../base/azure

# If you need to override environment variables, resource limits, or other settings for specific deployments
# you can use the patches here to apply those changes. Each patch file should contain the necessary patches
# to modify the respective deployment as needed. Avoid creating patches directly in this file to keep it clean.
patches:
  - target:
      kind: Namespace
      name: github-azure
    patch: |-
      - op: replace
        path: "/metadata/labels/github.com~1name"
        value: github-azure-lab
  - target:
      kind: Deployment
      labelSelector: service=unicorn
    path: patches/deployments/unicorn.yaml
  - target:
      kind: Deployment
      labelSelector: service=unicorn-api
    path: patches/deployments/unicorn-api.yaml
  - target:
      kind: Deployment
      labelSelector: service=unicorn-api-lowprio
    path: patches/deployments/unicorn-api-lowprio.yaml
  - target:
      kind: Deployment
      labelSelector: service=unicorn-api-graphql
    path: patches/deployments/unicorn-api-graphql.yaml
  - target:
      kind: Deployment
      labelSelector: service=unicorn-lowprio
    path: patches/deployments/unicorn-lowprio.yaml
  - target:
      kind: Service
      labelSelector: service=unicorn
    path: patches/services/unicorn.yaml
