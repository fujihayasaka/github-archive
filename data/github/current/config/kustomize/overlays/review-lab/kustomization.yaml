resources:
- ../../base/review-lab

components:
  - ../../base/metric-attribution

images:
- name: failbotg
  newName: dxcrprod.azurecr.io/failbotg
  newTag: master

generatorOptions:
  disableNameSuffixHash: true


patches:
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VOLTRON_HMAC
          valueFrom:
            secretKeyRef:
              key: VOLTRON_HMAC
              name: vault-secrets
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: EXCEPTION_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: VOLTRON_EXCEPTION_ENDPOINT
              name: vault-secrets
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_TRACES_HEADERS
          valueFrom:
            secretKeyRef:
              key: OTEL_EXPORTER_OTLP_TRACES_HEADERS
              name: vault-secrets
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_SERVICE_NAME
          value: voltron
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CONDUIT_URL
          value: 'https://conduit-staging.service.iad.github.net/twirp'
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: MEMCACHED_SERVERS
          value: 'cache:11211'
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"
  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: AZURE_FEDERATED_TOKEN_FILE_SHORT
          value: /var/run/secrets/azure-msft/token
      - op: add
        path: /spec/template/spec/containers/2/volumeMounts/-
        value:
          name: azure-federated-token-msft
          mountPath: /var/run/secrets/azure-msft
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: azure-federated-token-msft
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 86400
                  audience: api://AzureADTokenExchange
  - target:
      kind: Deployment
      name: gitauth
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GOTAUTH_URL
          value: 'https://gotauth-production.service.iad.github.net'
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SCIENTIST_REGION
          valueFrom:
            configMapKeyRef:
                key: KUBE_REGION
                name: kube-cluster-metadata
