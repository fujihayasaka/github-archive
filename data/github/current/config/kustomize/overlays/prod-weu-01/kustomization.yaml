apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/proxima

replicas:
  - name: dependabot-alerts-alerting-progress-processor
    count: 2
  - name: dependabot-alerts-vulnerable-dependency-processor
    count: 2
  - name: unicorn-performance
    count: 3
  - name: memex-events-processor
    count: 2
  - name: memex-live-updates-processor
    count: 2

patches:
  # Override proxima ScaledObject replica counts for this environment
  - target:
      kind: ScaledObject
      name: unicorn
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 6
      - op: replace
        path: /spec/maxReplicaCount
        value: 6
  - target:
      kind: ScaledObject
      name: unicorn-api
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 22
      - op: replace
        path: /spec/maxReplicaCount
        value: 22
  - target:
      kind: ScaledObject
      name: unicorn-api-graphql
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 5
      - op: replace
        path: /spec/maxReplicaCount
        value: 5
  - target:
      kind: ScaledObject
      name: unicorn-internal-api
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 9
      - op: replace
        path: /spec/maxReplicaCount
        value: 9
  # Remove replicas from deployments managed by KEDA ScaledObjects
  - target:
      kind: Deployment
      name: unicorn-api
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      name: ^unicorn$
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: Deployment
      name: unicorn-internal-api
    patch: |-
      - op: remove
        path: /spec/replicas
  - target:
      kind: ServiceMeshConfig
      name: config
    patch: |-
      - op: replace
        path: /spec/authorization/strictTLS
        value: true
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 1200  # 20 minutes
  - target:
      kind: Namespace

      name: base-namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: github-prod-weu-01
      - op: replace
        path: "/metadata/labels/github.com~1name"
        value: github-prod-weu-01
  - target:
      kind: ResourceQuota

      name: pod-object-count
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: github-prod-weu-01
  # Override proxima ScaledObject replica counts for aqueduct workers
  - target:
      kind: ScaledObject
      name: sharedworker
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 12
      - op: replace
        path: /spec/maxReplicaCount
        value: 12
  - target:
      kind: ScaledObject
      name: hookworker
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 2
      - op: replace
        path: /spec/maxReplicaCount
        value: 2
