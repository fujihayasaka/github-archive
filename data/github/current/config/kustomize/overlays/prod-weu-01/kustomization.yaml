apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/proxima

replicas:
  - name: dependabot-alerts-alerting-progress-processor
    count: 2
  - name: dependabot-alerts-vulnerable-dependency-processor
    count: 2
  - name: unicorn
    count: 6
  - name: unicorn-performance
    count: 3
  - name: memex-events-processor
    count: 2
  - name: memex-live-updates-processor
    count: 2
  - name: sharedworker
    count: 12
  - name: unicorn-api
    count: 22
  - name: unicorn-api-graphql
    count: 5
  - name: unicorn-internal-api
    count: 9

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 1200  # 20 minutes
  - target:
      kind: Namespace

      name: base-namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: github-prod-weu-01
      - op: replace
        path: "/metadata/labels/github.com~1name"
        value: github-prod-weu-01
  - target:
      kind: ResourceQuota

      name: pod-object-count
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: github-prod-weu-01
