apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base-worker

replicas:
  - name: aqueduct-worker
    count: 15

labels:
  - pairs:
      service: reposworker
    includeSelectors: true

patches:
  # Name requires JSON patch (can't use strategic merge for this)
  - target:
      kind: Deployment
      name: aqueduct-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: reposworker
  # Worker-specific configuration via strategic merge patch
  - path: deployment-patches.yaml
