# Worker-specific patches for exportbatchworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  template:
    spec:
      serviceAccountName: default
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-exportbatchworker-kube.rb
          resources:
            requests:
              cpu: 4
              memory: 15Gi
            limits:
              cpu: 10
              memory: 20Gi
          env:
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "3072"
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:exportbatchworker"
            - name: GITHUB_CONFIG_ROLE
              value: "exportbatchworker"
            - name: OTEL_SERVICE_NAME
              value: "github-exportbatchworker-kube"
            - name: RESQUED_WORKER_POOL_SIZE
              value: "25"
