# Worker-specific patches for issueorchestrationworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  template:
    spec:
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-issueorchestrationworker-kube.rb
          resources:
            requests:
              cpu: 3
              memory: 15Gi
            limits:
              cpu: 10
              memory: 18Gi
          env:
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:issueorchestrationworker"
            - name: GITHUB_CONFIG_ROLE
              value: "issueorchestrationworker"
            - name: OTEL_SERVICE_NAME
              value: "github-issueorchestrationworker"
