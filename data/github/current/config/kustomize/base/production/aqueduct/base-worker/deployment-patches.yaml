# Production-specific patches for base worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
  annotations:
    moda.github.net/canary-v2: "true"
    moda.github.net/canary-label: "role"
spec:
  template:
    spec:
      containers:
        - name: aqueduct
          env:
            - name: GH_HOSTNAME
              value: github.com
            - name: SMTP_HOST
              value: smtp.service.github.net
            - name: SMTP_PORT
              value: '2525'
