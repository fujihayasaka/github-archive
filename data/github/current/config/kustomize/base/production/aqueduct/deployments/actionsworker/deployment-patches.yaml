# Worker-specific patches for actionsworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
  annotations:
    moda.github.net/allow-missing-ready-pods: "1"
spec:
  template:
    spec:
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-actionsworker-kube.rb
          resources:
            requests:
              cpu: 3
              memory: 14Gi
            limits:
              cpu: 10
              memory: 20Gi
          env:
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:actionsworker"
            - name: GITHUB_CONFIG_ROLE
              value: "actionsworker"
            - name: OTEL_SERVICE_NAME
              value: "github-actionsworker"
