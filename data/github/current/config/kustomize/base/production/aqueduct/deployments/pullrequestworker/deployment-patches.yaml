# Worker-specific patches for pullrequestworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    spec:
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-pullrequestworker-kube.rb
          resources:
            requests:
              cpu: 4
              memory: 17Gi
            limits:
              cpu: 10
              memory: 18Gi
          env:
            - name: RESQUED_WORKER_POOL_SIZE
              value: "12"
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:pullrequestworker"
            - name: GITHUB_CONFIG_ROLE
              value: "pullrequestworker"
            - name: OTEL_SERVICE_NAME
              value: "github-pullrequestworker"
