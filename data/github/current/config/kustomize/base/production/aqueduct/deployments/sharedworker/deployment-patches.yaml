# Worker-specific patches for sharedworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
  annotations:
    moda.github.net/allow-missing-ready-pods: "8"
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: default
      volumes:
        - name: geoip2
          emptyDir: {}
      initContainers:
        - name: geoip
          image: dxcrprod.azurecr.io/geoip2:master
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp /data/geoip2/* /shared-geoip2"]
          resources:
            requests:
              cpu: 50m
          volumeMounts:
            - name: geoip2
              mountPath: "/shared-geoip2"
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-sharedworker-kube.rb
          volumeMounts:
            - mountPath: /usr/share/GeoIP
              name: geoip2
          resources:
            requests:
              cpu: 4
              memory: 15Gi
            limits:
              cpu: 10
              memory: 20Gi
          env:
            - name: RESQUED_SHAREDWORKER_POOL_SIZE
              value: "10"
            - name: WORKER_POOL_STAMP_ENVIRONMENT
              value: "dotcom"
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "3584"
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:sharedworker"
            - name: GITHUB_CONFIG_ROLE
              value: "sharedworker"
            - name: RESQUED_METRICS_SERVER_ADDRESS
              value: "0.0.0.0:9988"
            - name: OTEL_SERVICE_NAME
              value: "github-sharedworker-kube"
            - name: OTEL_LOGGER_ENABLED
              value: "true"
