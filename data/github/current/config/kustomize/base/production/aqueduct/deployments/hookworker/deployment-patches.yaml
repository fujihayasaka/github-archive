# Worker-specific patches for hookworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
  annotations:
    moda.github.net/allow-missing-ready-pods: "17"
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 10%
  template:
    spec:
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-hookworker-kube.rb
          resources:
            requests:
              cpu: 3
              memory: 24Gi
            limits:
              cpu: 10
              memory: 30Gi
          env:
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "3072"
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:hookworker"
            - name: GITHUB_CONFIG_ROLE
              value: "hookworker"
            - name: OTEL_SERVICE_NAME
              value: "github-hookworker-kube"
