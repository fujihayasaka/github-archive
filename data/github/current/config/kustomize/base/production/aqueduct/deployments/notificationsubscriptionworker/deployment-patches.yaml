# Worker-specific patches for notificationsubscriptionworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
  annotations:
    moda.github.net/allow-missing-ready-pods: "1"
spec:
  template:
    metadata:
      annotations:
        observability.github.com/splunk_index: prod-notifications
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-notificationsubscriptionworker-kube.rb
          lifecycle:
            preStop:
              exec:
                command:
                  - "bin/resqued"
                  - "quit-and-wait"
                  - "/resqued-pidfile/resqued.pid"
                  - "--grace-period"
                  - "30"
          resources:
            requests:
              cpu: 2.4
              memory: 8Gi
            limits:
              cpu: 4
              memory: 12Gi
          env:
            - name: RESQUED_WORKER_POOL_SIZE
              value: "4"
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "3584"
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:notificationsubscriptionworker"
            - name: GITHUB_CONFIG_ROLE
              value: "notificationsubscriptionworker"
            - name: OTEL_SERVICE_NAME
              value: "github-notificationsubscriptionworker-kube"
