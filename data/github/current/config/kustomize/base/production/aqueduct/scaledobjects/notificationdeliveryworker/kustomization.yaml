apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../commonBase/aqueduct/base-scaledobject

labels:
  - pairs:
      service: notificationdeliveryworker

patches:
  - target:
      kind: ScaledObject
      name: aqueduct-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: notificationdeliveryworker
      - op: replace
        path: /spec/scaleTargetRef/name
        value: notificationdeliveryworker
      - op: replace
        path: /spec/triggers/1/metadata/query
        value: >-
          (avg:aqueduct.workers.count{kube_deployment:notificationdeliveryworker,kube_cluster:%cluster%}
          - avg:aqueduct.workers.idle.count{kube_deployment:notificationdeliveryworker,kube_cluster:%cluster%})
          * 100
          / avg:aqueduct.workers.count{kube_deployment:notificationdeliveryworker,kube_cluster:%cluster%}
      - op: replace
        path: /spec/minReplicaCount
        value: 22
      - op: replace
        path: /spec/maxReplicaCount
        value: 40
