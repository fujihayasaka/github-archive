apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../commonBase/aqueduct/base-scaledobject

labels:
  - pairs:
      service: reposworker

patches:
  - target:
      kind: ScaledObject
      name: aqueduct-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: reposworker
      - op: replace
        path: /spec/scaleTargetRef/name
        value: reposworker
      - op: replace
        path: /spec/triggers/1/metadata/query
        value: >-
          (avg:aqueduct.workers.count{kube_deployment:reposworker,kube_cluster:%cluster%}
          - avg:aqueduct.workers.idle.count{kube_deployment:reposworker,kube_cluster:%cluster%})
          * 100
          / avg:aqueduct.workers.count{kube_deployment:reposworker,kube_cluster:%cluster%}
      - op: replace
        path: /spec/minReplicaCount
        value: 38
      - op: replace
        path: /spec/maxReplicaCount
        value: 62
      - op: replace
        path: /spec/triggers/0/metadata/value
        value: "80"
      - op: replace
        path: /spec/triggers/1/metadata/queryValue
        value: "80"
