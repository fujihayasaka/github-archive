apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base-worker

replicas:
  - name: aqueduct-worker
    count: 101

labels:
  - pairs:
      service: sharedworker
    includeSelectors: true

patches:
  # Name and strategy removal require JSON patch
  - target:
      kind: Deployment
      name: aqueduct-worker
    patch: |-
      - op: replace
        path: /metadata/name
        value: sharedworker
      - op: remove
        path: /spec/strategy
  # Worker-specific configuration via strategic merge patch
  - path: deployment-patches.yaml
