apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Workers derived from base-worker template
  - deployments/accountsecurityworker
  - deployments/actionschecksworker
  - deployments/actionspushworker
  - deployments/actionsworker
  - deployments/exportbatchworker
  - deployments/flexworker
  - deployments/hookworker
  - deployments/indexworker
  - deployments/issueorchestrationworker
  - deployments/notificationdeliveryworker
  - deployments/notificationhighworker
  - deployments/notificationmaintenanceworker
  - deployments/notificationsubscriptionworker
  - deployments/pullrequestworker
  - deployments/pushworker
  - deployments/reposworker
  - deployments/sharedworker
  - deployments/stagingworker
  # KEDA ScaledObjects for aqueduct workers - scale based on CPU utilization and Datadog worker utilization
  - scaledobjects/accountsecurityworker
  - scaledobjects/actionschecksworker
  - scaledobjects/actionspushworker
  - scaledobjects/actionsworker
  - scaledobjects/exportbatchworker
  - scaledobjects/flexworker
  - scaledobjects/hookworker
  - scaledobjects/indexworker
  - scaledobjects/issueorchestrationworker
  - scaledobjects/notificationdeliveryworker
  - scaledobjects/notificationhighworker
  - scaledobjects/notificationmaintenanceworker
  - scaledobjects/notificationsubscriptionworker
  - scaledobjects/pullrequestworker
  - scaledobjects/pushworker
  - scaledobjects/reposworker
  - scaledobjects/sharedworker
  - scaledobjects/stagingworker

patches:
  - target:
      kind: Deployment
      name: (accountsecurityworker|actionschecksworker|actionspushworker|actionsworker|exportbatchworker|flexworker|hookworker|indexworker|issueorchestrationworker|notificationdeliveryworker|notificationhighworker|notificationmaintenanceworker|notificationsubscriptionworker|pullrequestworker|pushworker|reposworker|sharedworker|stagingworker)
    path: ./patches/patch-cluster-preferences.yaml
