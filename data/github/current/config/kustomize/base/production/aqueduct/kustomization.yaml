apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployments/pushworker.yaml
  - deployments/reposworker.yaml
  - deployments/actionsworker.yml
  - deployments/flexworker.yaml
  - deployments/hookworker.yaml
  - deployments/indexworker.yaml
  - deployments/issueorchestrationworker.yml
  - deployments/notificationworker.yaml
  - deployments/pullrequestworker.yaml
  - deployments/accountsecurityworker.yaml
  - deployments/yjittestworker.yaml
  - deployments/sharedworker.yaml
  - deployments/stagingworker.yaml
  - horizontalpodautoscaler/flexworker.yaml

patches:
  - target:
      kind: Deployment
      name: (accountsecurityworker|actionsworker|flexworker|hookworker|indexworker|issueorchestrationworker|notificationworker|pullrequestworker|pushworker|reposworker|yjittestworker|stagingworker)
    path: ./patches/patch-cluster-preferences.yaml
