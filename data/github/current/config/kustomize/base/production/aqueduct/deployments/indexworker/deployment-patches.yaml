# Worker-specific patches for indexworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
  annotations:
    moda.github.net/allow-missing-ready-pods: "2"
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 2
  template:
    spec:
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-indexworker-kube.rb
          resources:
            requests:
              cpu: 3
              memory: 14Gi
            limits:
              cpu: 10
              memory: 18Gi
          env:
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:indexworker"
            - name: GITHUB_CONFIG_ROLE
              value: "indexworker"
            - name: OTEL_SERVICE_NAME
              value: "github-indexworker"
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "3072"
