apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./resources/servicemeshconfigs/config.yaml

patches:
  - target:
      kind: Namespace
    path: ./patches/istio-io-rev-label.yaml
  # make sure all Deployments get the sidecar
  - target:
      kind: Deployment
    path: ./patches/istio-enable-sidecar.yaml

  - target:
      kind: Deployment
      name: unicorn
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "500m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "10"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "2Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "256Mi"
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          concurrency: 4

  - target:
      kind: Deployment
      name: unicorn-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "600m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "10"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "2Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "256Mi"
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          concurrency: 4

  - target:
      kind: Deployment
      name: unicorn-api-graphql
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "300m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "10"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "2Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "256Mi"
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          concurrency: 4

  - target:
      kind: Deployment
      name: unicorn-internal-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "300m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "10"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "2Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "256Mi"
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          concurrency: 4

  - target:
      kind: Deployment
      name: unicorn-gitauth-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPU
        value: "400m"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyCPULimit
        value: "10"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemoryLimit
        value: "2Gi"
      - op: add
        path: /spec/template/metadata/annotations/sidecar.istio.io~1proxyMemory
        value: "256Mi"
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          concurrency: 4

  - target:
      kind: Job
      name: transition-template-job
    patch: |-
      - op: add
        path: /spec/template/metadata/labels
        value: {}
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "false"
