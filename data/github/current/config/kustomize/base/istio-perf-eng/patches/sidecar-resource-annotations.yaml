apiVersion: apps/v1
kind: Deployment
metadata:
  name: UNUSED
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "1"
        sidecar.istio.io/proxyCPULimit: "10"
        sidecar.istio.io/proxyMemoryLimit: "2Gi"
        sidecar.istio.io/proxyMemory: "256Mi"
        proxy.istio.io/config: |
          concurrency: 4
