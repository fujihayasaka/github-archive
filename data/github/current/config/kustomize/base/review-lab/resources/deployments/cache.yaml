apiVersion: apps/v1
kind: Deployment
metadata:
    name: cache
spec:
    replicas: 1
    template:
        metadata:
            labels:
                service: cache
            annotations:
                fluentbit.io/parser: logfmt_sloppy
                observability.github.com/splunk_index: rails
        spec:
            restartPolicy: Always
            containers:
                - name: cache
                  image: dxcrprod.azurecr.io/memcached15:078aa4faf63c927a626c6778bfdde8a2dc95c36f
                  command: ["memcached", "-m", "64"]
                  resources:
                    limits:
                        cpu: 0.1
                        # memory is ^ memcached memory plus a 16Mi overhead
                        memory: "80Mi"
                    requests:
                        cpu: 0.001
                        memory: "80Mi"
                  ports:
                    - name: memcached
                      containerPort: 11211
                  readinessProbe:
                    tcpSocket:
                        port: 11211
    selector:
        matchLabels:
            service: cache
