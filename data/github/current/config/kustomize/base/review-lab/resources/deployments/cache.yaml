apiVersion: apps/v1
kind: Deployment
metadata:
    name: cache
spec:
    replicas: 1
    template:
        metadata:
            labels:
                service: cache
            annotations:
        spec:
            restartPolicy: Always
            containers:
                - name: cache
                  image: octofactory.service.private-us-east-1.github.net/kustomize-labs-docker-releases-local/github/ghe-memcached-container/memcached15:7f987c49a37c4ba415121e4a19aebe61b1298777
                  command: ["memcached", "-m", "64"]
                  resources:
                    limits:
                        cpu: 0.1
                        # memory is ^ memcached memory plus a 16Mi overhead
                        memory: "80Mi"
                    requests:
                        cpu: 0.001
                        memory: "80Mi"
                  ports:
                    - name: memcached
                      containerPort: 11211
                  readinessProbe:
                    tcpSocket:
                        port: 11211
    selector:
        matchLabels:
            service: cache
