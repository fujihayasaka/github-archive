apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: unicorn-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          terminationDrainDuration: 10s

  - target:
      kind: Deployment
      name: unicorn-api-graphql
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          terminationDrainDuration: 10s

  - target:
      kind: Deployment
      name: unicorn-internal-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          terminationDrainDuration: 10s

  - target:
      kind: Deployment
      name: unicorn-gitauth-api
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          terminationDrainDuration: 10s
