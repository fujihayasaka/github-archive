---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  annotations:
    moda.github.net/allow-missing-ready-pods: null
    moda.github.net/canary-v2: null
    moda.github.net/canary-maxunavailable: null
    moda.github.net/canary-label: null
    moda.github.net/canary-replicas: null
    moda.github.net/cluster-preferences: null
  labels:
    service: unicorn-api-graphql
spec:
  selector:
    matchLabels:
      service: unicorn-api-graphql
  template:
    metadata:
      labels:
        service: unicorn-api-graphql
      annotations:
        observability.github.com/splunk_index: rails
        traffic.sidecar.istio.io/excludeInboundPorts: "8081"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: nginx
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "25"
        - name: unicorn
          env:
            - name: KUBE_DEPLOYMENT_NAME
              value: unicorn-api-graphql
            - name: GH_UNICORN_WORKER_COUNT
              value: "10"
            - name: UNICORN_CHECK_CLIENT_CONNECTION_ENABLED
              value: "1"
            - name: USERS_CACHE_CONNECT_API
              value: "0"
            - name: REDIS_RATE_LIMITER_URLS
              value: "rediss://default:$(MANAGED_REDIS_API_RL_00_PRIMARY_PASSWORD)@amr-api-rl-00-gc-cus-02.centralus.redis.azure.net:10000;rediss://default:$(MANAGED_REDIS_API_RL_00_PRIMARY_PASSWORD)@amr-api-rl-00-gc-cus-02.centralus.redis.azure.net:10000,rediss://default:$(MANAGED_REDIS_API_RL_01_PRIMARY_PASSWORD)@amr-api-rl-01-gc-cus-02.centralus.redis.azure.net:10000;rediss://default:$(MANAGED_REDIS_API_RL_01_PRIMARY_PASSWORD)@amr-api-rl-01-gc-cus-02.centralus.redis.azure.net:10000,rediss://default:$(MANAGED_REDIS_API_RL_02_PRIMARY_PASSWORD)@amr-api-rl-02-gc-cus-02.centralus.redis.azure.net:10000;rediss://default:$(MANAGED_REDIS_API_RL_02_PRIMARY_PASSWORD)@amr-api-rl-02-gc-cus-02.centralus.redis.azure.net:10000,rediss://default:$(MANAGED_REDIS_API_RL_03_PRIMARY_PASSWORD)@amr-api-rl-03-gc-cus-02.centralus.redis.azure.net:10000;rediss://default:$(MANAGED_REDIS_API_RL_03_PRIMARY_PASSWORD)@amr-api-rl-03-gc-cus-02.centralus.redis.azure.net:10000,rediss://default:$(MANAGED_REDIS_API_RL_04_PRIMARY_PASSWORD)@amr-api-rl-04-gc-cus-02.centralus.redis.azure.net:10000;rediss://default:$(MANAGED_REDIS_API_RL_04_PRIMARY_PASSWORD)@amr-api-rl-04-gc-cus-02.centralus.redis.azure.net:10000"
            - name: MONOLITH_REDIS_RATE_LIMITER_URLS
              value: "rediss://default:$(MANAGED_REDIS_MONOLITH_RL_PRIMARY_PASSWORD)@amr-monolith-rl-gc-cus-02.centralus.redis.azure.net:10000;rediss://default:$(MANAGED_REDIS_MONOLITH_RL_PRIMARY_PASSWORD)@amr-monolith-rl-gc-cus-02.centralus.redis.azure.net:10000"
            - name: MYSQL_AUTHND_READER_HOST
              value: db-mysql-851f467.gc-cus-01-az1.github.net
            - name: MYSQL_COLLAB_READER_HOST
              value: db-mysql-00de7cd.gc-cus-01-az1.github.net
            - name: MYSQL_CONFIGURATIONS_READER_HOST
              value: db-mysql-06d079e.gc-cus-01-az1.github.net
            - name: MYSQL_IAM_ABILITIES_READER_HOST
              value: db-mysql-4a862ed.gc-cus-01-az1.github.net
            - name: MYSQL_MYSQL1_READER_HOST
              value: db-mysql-39aff46.gc-cus-01-az1.github.net
            - name: MYSQL_REPOSITORIES_READER_HOST
              value: db-mysql-f80b6fc.gc-cus-01-az1.github.net
            - name: MYSQL_SPOKES_READER_HOST
              value: db-mysql-45169e6.gc-cus-01-az1.github.net
            - name: AUTHND_SERVICE_URL
              value: http://authnd.authnd-production.svc.cluster.local:8080
            - name: AUTHND_WRITER_SERVICE_URL
              value: http://authnd-writer.authnd-production.svc.cluster.local:8080
            - name: AUTHZD_ENDPOINT
              value: https://authzd-production.service.gc-cus-02.github.net/twirp
            - name: AUTHZD_CONTROLACCESS_ENDPOINT
              value: https://authzd-controlaccess-production.service.gc-cus-02.github.net/twirp
            - name: AUTHZD_CONDITIONAL_ACCESS_ENDPOINT
              value: https://authzd-capevaluator-production.service.gc-cus-02.github.net/twirp
            - name: SPOKESD_URL
              value: https://spokesd-production.service.gc-cus-02.github.net:10013/twirp/
            - name: TURBOQUALITY_URL
              value: https://turboquality-production.service.gc-cus-02.github.net/twirp
            - name: TURBOSCAN_DISABLE_SERVICE_MESH
              value: "true"
          resources:
            requests:
              cpu: 7
              memory: 16Gi
            limits:
              memory: 20Gi
