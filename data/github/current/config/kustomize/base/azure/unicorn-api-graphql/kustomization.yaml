apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
    - ../../../base/production/unicorn-api/
    - ../../commonBase/unicorn-api-graphql/poddisruptionbudgets/
# If you're decreasing this value, make sure to also update the
# corresponding `acl site_dead` configuration in the kube-dotcom-ingress
# repo
# (https://github.com/github/kube-dotcom-ingress/blob/main/config/helm/production/haproxytech-ingress-dotcom-unicorn-api-graphql.yaml)
# and deploy that change first. Reach out to #service-mesh for guidance.
replicas:
    - name: unicorn-api
      count: 0
nameSuffix: -graphql
patches:
    - path: ./deployments/unicorn-api-graphql.yaml
    - path: ./services/unicorn-api-graphql.yaml
    - target:
        kind: Deployment
        name: unicorn-api
      patch: |-
        - op: add
          path: /spec/template/metadata/labels/sidecar.istio.io~1inject
          value: "true"
        - op: add
          path: /spec/template/metadata/labels/istio.io~1rev
          value: "stable"
        - op: replace
          path: /spec/template/spec/dnsPolicy
          value: "ClusterFirst"
    - target:
        kind: Service
        name: unicorn-api
      patch: |-
        - op: replace
          path: /metadata/labels/service
          value: unicorn-api-graphql
        - op: replace
          path: /spec/selector/service
          value: unicorn-api-graphql

