apiVersion: v1
kind: Service
metadata:
  name: unicorn-internal-api
  labels:
    service: unicorn-internal-api
  annotations:
    opaque.github.net/checks: null
    moda.github.net/domain-name: internal-api.service.%site%.github.net
spec:
  selector:
    service: unicorn-internal-api
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
      # Used to connect this service to GLB.
      nodePort: null
