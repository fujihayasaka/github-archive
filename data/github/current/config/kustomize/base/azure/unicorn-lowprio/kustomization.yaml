apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/production/unicorn/

replicas:
    - name: unicorn
      count: 0
nameSuffix: -lowprio

labels:
  - pairs:
      service: unicorn-lowprio
    includeSelectors: true

patches:
    - path: ./deployments/unicorn-lowprio.yaml
    - path: ./services/unicorn-lowprio.yaml
    - target:
        kind: Deployment
        name: unicorn
      patch: |-
        - op: add
          path: /spec/template/metadata/labels/sidecar.istio.io~1inject
          value: "true"
        - op: add
          path: /spec/template/metadata/labels/istio.io~1rev
          value: "stable"
        - op: replace
          path: /spec/template/spec/dnsPolicy
          value: "ClusterFirst"
