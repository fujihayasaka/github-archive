apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/production/unicorn-api/
  - ../../../base/production/unicorn-api/configs/

patches:
  - path: ./deployments/unicorn-api.yaml
  - path: ./services/unicorn-api.yaml
  - target:
      kind: Deployment
      name: unicorn-api
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "true"
      - op: add
        path: /spec/template/metadata/labels/istio.io~1rev
        value: "stable"
      - op: replace
        path: /spec/template/spec/dnsPolicy
        value: "ClusterFirst"
