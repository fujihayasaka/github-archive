apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-api
  annotations:
    moda.github.net/allow-missing-ready-pods: null
    moda.github.net/canary-v2: null
    moda.github.net/canary-maxunavailable: null
    moda.github.net/canary-label: null
    moda.github.net/canary-replicas: null
    moda.github.net/cluster-preferences: null
  labels:
    service: unicorn-api
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: "1%"
  template:
    metadata:
      annotations:
        observability.github.com/splunk_index: rails
    spec:
      containers:
        - name: unicorn
          env:
            - name: SMTP_HOST
              value: smtp.service.github.net
            - name: GH_HOSTNAME
              value: github.com
            - name: GITHUB_CONFIG_ROLE
              value: api
            - name: FEATURE_FLAG_DATA_URL
              value: https://feature-flag-data-dotcom.service.iad.github.net/twirp
            - name: REDIS_RATE_LIMITER_URLS
              value: "rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380;rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380"
            - name: MONOLITH_REDIS_RATE_LIMITER_URLS
              value: "rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380;rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380"
            - name: JOB_COORDINATION_REDIS_URL
              value: "rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380"
            - name: JOB_COORD_REDIS_URLS
              value: "rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380;rediss://default:$(REDIS_AZURE_MONOLITH_PRIMARY_PASSWORD)@db-redis-azure-monolith-gc-cus-02.redis.cache.windows.net:6380"
            - name: MYSQL_AUTHND_READER_HOST
              value: db-mysql-authnd-production-ro.service.gc-cus-01.github.net
            - name: MYSQL_AUTHND_WRITER_HOST
              value: db-mysql-authnd-production-rw.service.gc-cus-01.github.net
            - name: MYSQL_COLLAB_READER_HOST
              value: db-mysql-collab-ro.service.gc-cus-01.github.net
            - name: MYSQL_COLLAB_WRITER_HOST
              value: db-mysql-collab-rw.service.gc-cus-01.github.net
            - name: MYSQL_CONFIGURATIONS_READER_HOST
              value: db-mysql-configurations-ro.service.gc-cus-01.github.net
            - name: MYSQL_CONFIGURATIONS_WRITER_HOST
              value: db-mysql-configurations-rw.service.gc-cus-01.github.net
            - name: MYSQL_IAM_ABILITIES_READER_HOST
              value: db-mysql-iam-abilities-ro.service.gc-cus-01.github.net
            - name: MYSQL_IAM_ABILITIES_WRITER_HOST
              value: db-mysql-iam-abilities-rw.service.gc-cus-01.github.net
            - name: MYSQL_LODGE_NON_VTGATE_READER_HOST
              value: db-mysql-lodge-ro.service.gc-cus-01.github.net
            - name: MYSQL_LODGE_NON_VTGATE_WRITER_HOST
              value: db-mysql-lodge-rw.service.gc-cus-01.github.net
            - name: MYSQL_MYSQL1_READER_HOST
              value: db-mysql-github-ro.service.gc-cus-01.github.net
            - name: MYSQL_MYSQL1_WRITER_HOST
              value: db-mysql-github-rw.service.gc-cus-01.github.net
            - name: MYSQL_SPOKES_ANALYTICS_HOST
              value: db-mysql-spokes-ro.service.gc-cus-01.github.net
            - name: MYSQL_SPOKES_READER_HOST
              value: db-mysql-spokes-ro.service.gc-cus-01.github.net
            - name: MYSQL_SPOKES_WRITER_HOST
              value: db-mysql-spokes-rw.service.gc-cus-01.github.net
            - name: MYSQL_VITESS_PERMISSIONS_HOST
              value: vtgate-permissions.vitess-production.service.gc-cus-02.github.net
            - name: MYSQL_VITESS_REPOSITORIES_HOST
              value: vtgate-repositories.vitess-production.service.gc-cus-02.github.net
            - name: MYSQL_VITESS_REPOSITORIES_HOST_DOTCOM_CLUSTER
              value: vtgate-repositories.vitess-production.service.gc-cus-02.github.net
            - name: AUTHND_SERVICE_URL
              value: http://authnd.authnd-gc-cus-02.svc.cluster.local:8080
          resources:
            limits:
              memory: 20Gi
            requests:
              cpu: 4
              memory: 16Gi
