apiVersion: v1
kind: Service
metadata:
  name: unicorn-api
  labels:
    service: unicorn-api
  annotations:
    moda.github.net/cluster-preferences: null
    moda.github.net/canary-v2: true
    kubernetes.io/ingress.class: null
    haproxy.org/load-balance: null
    haproxy.org/check-interval: null
    haproxy.org/backend-config-snippet: null
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
      # Used to connect this service to GLB.
      nodePort: null
