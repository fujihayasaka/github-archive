---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: achievements-public-sponsor-processor
  annotations:
    heaven.githubapp.com/allow-cluster-preferences-configmap: "true"
    heaven.githubapp.com/image-placeholder: github
    heaven.githubapp.com/inject-heaven-env-vars-into-containers: achievements-public-sponsor-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      service: achievements-public-sponsor-processor
  template:
    metadata:
      annotations:
        fluentbit.io/parser: logfmt_sloppy
        observability.github.com/kafka_topic: rails
        observability.github.com/splunk_index: rails
      labels:
        service: achievements-public-sponsor-processor
    spec:
      restartPolicy: Always
      volumes:
        - name: github-metadata
          hostPath:
            path: /etc/github/metadata.json
        - name: ca-certificates
          hostPath:
            path: /etc/ssl/certs
        - name: syslog
          hostPath:
            path: /dev/log
      containers:
        - name: achievements-public-sponsor-processor
          image: github
          imagePullPolicy: IfNotPresent
          args: ['bin/achievements-public-sponsor-processor']
          resources:
            requests:
              cpu: 50m
              memory: '2G'
            limits:
              cpu: 1
              memory: '4G'
          volumeMounts:
            - name: github-metadata
              mountPath: /etc/github/metadata.json
              readOnly: true
            - name: ca-certificates
              mountPath: /etc/ssl/certs
              readOnly: true
          env:
            - name: RAILS_ENV
              value: production
            - name: FAILBOT_CONTEXT_KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FAILBOT_CONTEXT_KUBE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FAILBOT_CONTEXT_KUBE_CLUSTER
              valueFrom:
                configMapKeyRef:
                  key: kubernetes_cluster_name
                  name: kube-cluster-metadata
            - name: GH_HOSTNAME
              value: github.com
            - name: DOGSTATSD_HOST
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: observability-config
            - configMapRef:
                name: application-config
            - secretRef:
                name: vault-secrets
