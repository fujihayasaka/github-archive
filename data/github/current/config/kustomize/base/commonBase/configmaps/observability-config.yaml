apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
data:
  FAILBOT_HAYSTACK_URL_MESH: http://failbotg.failbotg-%stamp%.svc.cluster.local/api/needles
  GITHUB_TELEMETRY_LOGS_ENABLED: "true"
  GH_LOG_DESTINATION: "stdout"
  # The otel collector address is the same in all environments
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT_MESH: http://otelcol-mesh.otelcol-production.svc.cluster.local:14318/v1/traces
