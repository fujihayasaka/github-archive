resources:
  - ../base

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: feature-flag-update-processor
    patch: |-
      - op: replace
        path: /metadata/name
        value: feature-flag-update-processor-5
      - op: replace
        path: /spec/selector/matchLabels/service
        value: feature-flag-update-processor-5
      - op: replace
        path: /spec/template/metadata/labels/service
        value: feature-flag-update-processor-5
      - op: add
        path: /spec/template/spec/containers/0/env/0
        value:
          name: FEATURE_FLAG_UPDATE_PROCESSOR_INDEX
          value: "5"
