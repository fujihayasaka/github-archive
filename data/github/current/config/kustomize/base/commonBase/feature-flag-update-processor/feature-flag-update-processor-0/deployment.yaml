apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flag-update-processor
  annotations:
    heaven.githubapp.com/inject-heaven-env-vars-into-containers: feature-flag-update-processor-0
    moda.github.net/inject-otel-env-vars-into-containers: feature-flag-update-processor-0
spec:
    selector:
      matchLabels:
        service: feature-flag-update-processor-0
    template:
      metadata:
        labels:
          service: feature-flag-update-processor-0
      spec:
        containers:
          - name: feature-flag-update-processor
            env:
              - name: FEATURE_FLAG_UPDATE_PROCESSOR_INDEX
                value: "0"
