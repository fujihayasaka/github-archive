---
commonLabels:
  service: unicorn-gitauth-api

configMapGenerator:
  - name: unicorn-gitauth-api-nginx-conf
    options:
      disableNameSuffixHash: true
      labels:
        kustomizeOverlayName: base__commonBase__unicorn-gitauth-api
    files:
      - nginx.conf
      - gzip.conf
      - mime.types
      - proxy.conf
      - logging.conf
      - error_pages.conf
      - large_file_uploads.conf
      - github_prod.conf
      - fallback.conf
  - name: unicorn-gitauth-api-nginx-conf-mirror
    options:
      disableNameSuffixHash: true
      labels:
        kustomizeOverlayName: base__commonBase__unicorn-gitauth-api
    files:
      - nginx.conf=nginx.mirror.conf
      - gzip.conf
      - mime.types
      - proxy.conf
      - logging.conf
      - error_pages.conf
      - large_file_uploads.conf
      - github_prod.conf
      - fallback.conf
generatorOptions:
 annotations: {}
