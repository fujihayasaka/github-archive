apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: unicorn-api
spec:
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 1500
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  maxReplicaCount: 5
  minReplicaCount: 5
  scaleTargetRef:
    name: unicorn-api
    envSourceContainerName: unicorn
  triggers:
    - metadata:
        containerName: unicorn
        value: "70"
      metricType: Utilization
      type: cpu
    - type: datadog
      authenticationRef:
        kind: ClusterTriggerAuthentication
        name: keda-trigger-auth-datadog-secret
      metricType: Value
      metadata:
        age: "300"
        query: >-
          (avg:unicorn.workers{kube_deployment:unicorn-api,kube_cluster:%cluster%}
          - avg:unicorn.idle_workers{kube_deployment:unicorn-api,kube_cluster:%cluster%})
          * 100
          / avg:unicorn.workers{kube_deployment:unicorn-api,kube_cluster:%cluster%}
        queryValue: "66"
