---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../unicorn/
  - ./configmaps/degrader.yaml

nameSuffix: -performance

generatorOptions:
  annotations: {}

patches:
  - path: ./services/unicorn.yaml
  - path: ./deployments/unicorn.yaml
  - target:
        kind: Deployment
        name: unicorn
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/2/env/0
        value:
          name: KUBE_DEPLOYMENT_NAME
          value: unicorn-performance
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value:
          name: LUC_PERFORMANCE
          value: "1"
replicas:
  - name: unicorn
    count: 3
