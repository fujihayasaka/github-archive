# Proxima-specific patches for base worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: aqueduct
          env:
            - name: WORKER_POOL_STAMP_ENVIRONMENT
              value: "proxima"
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "1536"
            - name: FRENO_DISABLED
              value: "1"
            - name: FRENO_THROTTLE
              value: "0"
