# Proxima-specific patches for base worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  template:
    spec:
      dnsPolicy: ClusterFirst
      volumes:
        - name: ssh-known-hosts
          hostPath:
            path: /etc/ssh/ssh_known_hosts
      containers:
        - name: aqueduct
          volumeMounts:
            - name: ssh-known-hosts
              mountPath: /etc/ssh/ssh_known_hosts
              readOnly: true
          env:
            - name: WORKER_POOL_STAMP_ENVIRONMENT
              value: "proxima"
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "1536"
            - name: FRENO_DISABLED
              value: "1"
            - name: FRENO_THROTTLE
              value: "0"
            - name: TREELIGHTS_ENDPOINT
              value: "http://treelights.treelights-%stamp%.svc.cluster.local:8002"
