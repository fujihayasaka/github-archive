# Worker-specific patches for proxima hookworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: default
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-hookworker-kube.rb
          resources:
            requests:
              cpu: 3
              memory: 24Gi
              ephemeral-storage: 25Gi
            limits:
              cpu: 10
              memory: 30Gi
              ephemeral-storage: 50Gi
          env:
            - name: JOB_WORKER_GRACEFUL_MEMORY_LIMIT_IN_MB
              value: "3072"
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:hookworker"
            - name: GITHUB_CONFIG_ROLE
              value: "hookworker"
            - name: RESQUED_METRICS_SERVER_ADDRESS
              value: "0.0.0.0:9988"
            - name: OTEL_SERVICE_NAME
              value: "github-hookworker-kube"
