# Worker-specific patches for proxima sharedworker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqueduct-worker
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: default
      containers:
        - name: aqueduct
          args:
            - bin/resqued
            - --pidfile
            - /resqued-pidfile/resqued.pid
            - config/resqued/github-environment.rb
            - config/resqued/github-sharedworker-kube.rb
          resources:
            requests:
              cpu: 1
              memory: 10Gi
              ephemeral-storage: 25Gi
            limits:
              cpu: 5
              memory: 23G
              ephemeral-storage: 50Gi
          env:
            - name: DOGSTATSD_ADDITIONAL_TAGS
              value: "kube_deployment:worker"
            - name: GITHUB_CONFIG_ROLE
              value: "worker"
            - name: RESQUED_METRICS_SERVER_ADDRESS
              value: "0.0.0.0:9988"
            - name: OTEL_SERVICE_NAME
              value: "github-sharedworker"
