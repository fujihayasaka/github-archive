---
apiVersion: octomesh.github.com/v1alpha1
kind: ServiceMeshConfig
metadata:
  name: config
spec:
  authorization:
    strictTLS: false
    create: true
    inboundNamespaces:
      - "actions-results-lab"
      - "actions-results-production"
      - "clientappsfe-production"
      - "copilot-api-staging"
      - "copilot-api-staging-platform"
      - "copilot-api-production"
      - "copilot-token-service-production"
      - "copilot-token-service-staging"
      - "dependency-graph-api-production"
      - "github-production"
      - "graph-hopper-lab"
      - "graph-hopper-preprod"
      - "graph-hopper-production"
      - "launch-lab"
      - "launch-production"
      - "mcp-registry-production"
      - "mcp-registry-staging"
      - "models-gateway-production"
      - "pullsd-lab"
      - "pullsd-production"
      - "reposd-lab"
      - "reposd-production"
      - "token-scanning-service-production"
      - "token-scanning-service-shell"
      - "token-scanning-service-staging"
      - "ui-runtime-preview"
      - "ui-runtime-production"
      - "ui-runtime-staging"
  loadBalancing:
    useLocalityLoadBalancing: true
    retryOnReset: true
