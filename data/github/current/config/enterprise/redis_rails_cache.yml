# Redis configuration Memcache to Redis migration (M2R)
# This is used by GitHub::Cache::RedisClient
production: <% if ENV["ENTERPRISE_REDIS_URL"] %><%= ENV["ENTERPRISE_REDIS_URL"] %><% else %><%= ENV["ENTERPRISE_REDIS_SERVER"] || "localhost" %>:<%= ENV["ENTERPRISE_REDIS_PORT"] || 6379 %><% end %>
timeout: <%= (ENV["ENTERPRISE_REDIS_TIMEOUT"] || 5).to_f %>
