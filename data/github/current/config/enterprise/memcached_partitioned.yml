defaults: &defaults
  default_ttl: 0
  namespace: github
  retry_timeout: <%= ENV.fetch("GITHUB_MEMCACHED_RETRY_TIMEOUT", 60).to_i %>
  auto_eject_hosts: true
  connect_timeout: 0.1
  timeout: <%= ENV.fetch("GITHUB_MEMCACHED_TIMEOUT", 0.1).to_f %>
  cache_lookups: true
  server_failure_limit: <%= ENV.fetch("GITHUB_MEMCACHED_SERVER_FAILURE_LIMIT", 5).to_i %>
  buffer_requests: false
  no_block: false
  binary_protocol: false
  use_udp: false
  tcp_nodelay: false
  support_cas: false
  show_backtraces: false

  # we don't use the new exception retrying in memcached 0.19.5 yet
  exception_retry_limit: 0
  exceptions_to_retry: []

production:
  global:
    <<: *defaults
