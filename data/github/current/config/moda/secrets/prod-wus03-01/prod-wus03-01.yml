    owner: "@github/dependabot-updates"
    playbook:
    externally_usable:
    kind: latest_at_deployment_start
  DELTAFORCE_SERVICE_TOKEN:
    key: DELTAFORCE_SERVICE_TOKEN
    type: graphql_service_token
    owner: "@github/dependabot-updates"
