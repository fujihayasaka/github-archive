---
secrets:
  API_INTERNAL_BABELD_HMAC_KEYS:
    key: API_INTERNAL_BABELD_HMAC_KEYS
    type: HMAC
    owner: "@github/git-protocols"
    playbook:
    externally_usable:
    kind: latest_at_deployment_start
  API_INTERNAL_LFS_HMAC_KEYS:
    key: API_INTERNAL_LFS_HMAC_KEYS
    type: HMAC
    owner: "@github/git-systems"
    playbook:
    externally_usable:
    kind: latest_at_deployment_start
  API_INTERNAL_SPOKESD_HMAC_KEYS:
    key: API_INTERNAL_SPOKESD_HMAC_KEYS
    type: HMAC
    owner: "@github/git-systems"
    playbook:
    externally_usable:
    kind: latest_at_deployment_start
  API_INTERNAL_TWIRP_HMAC_KEYS_FOR_SPOKESD:
    key: API_INTERNAL_TWIRP_HMAC_KEYS_FOR_SPOKESD
    type: HMAC
    owner: "@github/git-systems"
    playbook:
    externally_usable: false
    kind: latest_at_deployment_start
  GITAUTH_TOKEN_HMAC_KEYS:
    key: GITAUTH_TOKEN_HMAC_KEYS
    type: HMAC
    owner: "@github/gitauth"
    playbook: https://github.com/github/ops/blob/master/docs/playbooks/github/gitauth.md#rotating-the-gitauth_token_hmac_keys
    externally_usable: true
    kind: latest_at_deployment_start
  INTERNAL_API_HOST_NAME:
    key: INTERNAL_API_HOST_NAME
    type:
    owner:
    playbook: ''
    externally_usable:
    kind: latest_at_deployment_start
  MYSQL_SPOKES_ANALYTICS_HOST:
    key: MYSQL_SPOKES_ANALYTICS_HOST
    type: credentials
    owner: "@github/database-infrastructure"
    playbook:
    externally_usable:
    kind: latest_at_deployment_start
  SPOKESD_URL:
    key: SPOKESD_URL
    type: config
    owner: "@github/git-storage"
    playbook:
    externally_usable: false
    kind: latest_at_deployment_start
  kittens:
    key: kittens
    type: kittens
    owner: ''
    playbook:
    externally_usable: false
    kind: latest_at_deployment_start
