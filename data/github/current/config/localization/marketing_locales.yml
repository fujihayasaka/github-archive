# Single source of truth for all marketing locale configuration.
# To add a new locale, add an entry here — all locale-aware code reads from this file.
#
# Fields:
#   accept_header      - Accept-Language header value (e.g. "en-US", "pt-BR").
#                        Used by Localization::Config#allowed_accept_language_headers
#                        and SeoHelper#normalize_locale for canonical URLs.
#
#   contentful_locale  - Locale code used in Contentful CMS queries (e.g. "en-US", "ja").
#                        Used by Site::Contentful::Helpers::LocalizationHelper#contentful_locale.
#
#   display_name       - Human-readable locale name shown in the locale selector dropdown.
#                        Used by app/views/site/_locale_selector.html.erb.
#
#   analytics_label    - Analytics tracking label (e.g. "locale:en-us").
#                        Used by app/views/site/_locale_selector.html.erb.
#
#   selector_locale    - Lowercase locale slug for URL/selector matching (e.g. "en-us", "ko-kr").
#                        Used by app/views/site/_locale_selector.html.erb.
#
#   ugct_enabled       - Whether UGC (user-generated content) translation is enabled for this locale.
#                        Must be explicitly set to true or false.
#                        Used by Localization::Config#ugct_languages.
#
#   feature_flag       - (Optional) Name of a feature flag that gates this locale.
#                        If set, the locale only appears in the selector and is only
#                        accepted by the controller when the flag is enabled for the user.
#                        Omit or leave absent for locales that are always enabled.
#                        Checked at runtime on every request (not cached).
#                        Used by MarketingLocales.locale_enabled? and enabled_selector_links.
#
# All fields except feature_flag are required. Omitting any required field will cause a boot-time error.

locales:
  en:
    accept_header: "en-US"
    contentful_locale: "en-US"
    display_name: "English"
    analytics_label: "locale:en-us"
    selector_locale: "en-us"
    ugct_enabled: true

  pt:
    accept_header: "pt-BR"
    contentful_locale: "pt-BR"
    display_name: "Português (Brasil)"
    analytics_label: "locale:pt-br"
    selector_locale: "pt-br"
    ugct_enabled: true

  es:
    accept_header: "es-419"
    contentful_locale: "es-419"
    display_name: "Español (América Latina)"
    analytics_label: "locale:es-419"
    selector_locale: "es-419"
    ugct_enabled: true

  ja:
    accept_header: "ja"
    contentful_locale: "ja"
    display_name: "日本語"
    analytics_label: "locale:ja"
    selector_locale: "ja"
    ugct_enabled: false

  ko:
    accept_header: "ko-KR"
    contentful_locale: "ko-KR"
    display_name: "한국어"
    analytics_label: "locale:ko-kr"
    selector_locale: "ko-kr"
    ugct_enabled: true

  fr:
    accept_header: "fr-FR"
    contentful_locale: "fr-FR"
    display_name: "Français"
    analytics_label: "locale:fr-fr"
    selector_locale: "fr-fr"
    ugct_enabled: false

  de:
    accept_header: "de-DE"
    contentful_locale: "de-DE"
    display_name: "Deutsch"
    analytics_label: "locale:de-de"
    selector_locale: "de-de"
    ugct_enabled: false
