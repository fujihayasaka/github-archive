##############################################
# THIS FILE IS NO LONGER USED AS THE SOURCE OF ENTITLEMENT INFORMATION
#
# Plan entitlements now come from the Meuse Entitlements API
# see: Billing::Api::ClientWrapper#get_entitlement_plans
#
# In situations where the Meuse API can't be reached (such as local development)
#   plan entitlement methods will failover to use values from this file

default_features: &DEFAULT_FEATURES
  attestations.public: true
  attestations.private: false
  codeowners: true
  pages: true
  private_pages: false
  protected_branches: true
  protected_tags: true
  repos: true
  wikis: true
  insights: true
  projectsv2_charts_basic.public: true
  projectsv2_charts_basic.private: false
  draft_prs.public: true
  draft_prs.private: false
  repo_access_export: false
  fine_grained_permissions: false
  custom_roles: false
  display_commenter_full_name.private: false
  display_commenter_full_name.public: false
  display_verified_domain_emails: false
  restrict_notification_delivery: false
  audit_log_api: false
  custom_key_links: false
  reminders: true
  team_review_requests: true
  allow_codespaces: false
  insights_self_service: false
  private_secrets_and_variables: true
  merge_queue.public: false
  merge_queue.private: false
  enterprise_rulesets: false

default_limits: &DEFAULT_LIMITS
  collaborators: 10000 # 9999+1: unlimited
  repos.private: 10000 # 9999+1: unlimited
  repos.public: 10000 # 9999+1: unlimited
  raw_blob_access_expires_in_seconds: 604800 # 1 week
  raw_blob_access_expires_in_seconds.private: 3600 # 1 hour
  media_blob_max_size: 2147483648 # 2 GiB
  issue_pr_assignees: 10
  manual_review_requests: 15
  projectsv2_auto_add_workflows: 1

plans:
  - name: free
    cost: 0
    orgs: true
    features: &FREE_FEATURES
      <<: *DEFAULT_FEATURES
      codeowners.private: false
      pages.private: false
      protected_branches.private: false
      environment_protection_rules.private: false
      environment_protection_secrets.private: false
      protected_tags.private: false
      wikis.private: false
      insights.private: false
      fine_grained_permissions: true
      custom_roles: false
      reminders.private: false
      team_review_requests.private: false
      private_secrets_and_variables: false
    org_features: &FREE_ORG_FEATURES
      merge_queue.public: true
    limits: &FREE_LIMITS
      <<: *DEFAULT_LIMITS
      raw_blob_access_expires_in_seconds.private: 60 # 1 minute
    github_actions:
      included_private_minutes: 2000
    package_registry:
      included_bandwidth_in_gigabytes: 1
    shared_storage:
      included_megabytes: 512
    codespaces:
      included_compute_minutes: 0
      included_storage_gigabyte_hours: 0
    copilot_for_biz: true
    org_limits: &FREE_ORG_LIMITS
      issue_pr_assignees.private: 1
      manual_review_requests.private: 1

  - name: free_with_addons
    cost: 0
    hidden: true
    orgs: true
