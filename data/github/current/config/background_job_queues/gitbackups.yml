---
# The gitbackups_maintenance queue is configured specifically for gitbackups-maintenance workers in
# config/resqued/github-gitbackups-maintenance-aqueduct.rb. We don't define it here because we never want it being
# processed by any generic workers.
gitbackups_perform:
  scheduling_hints:
    tier: 1
    should_start_within: 1h
  enterprise: low
  proxima:
    sharedworker:
      kube:
        pool_workers: true
  development: true
  staff: true
  dotcom:
    backupworker:
      vm:
        pool_workers: true
gitbackups_backfill:
  scheduling_hints:
    tier: 1
    should_start_within: 1h
  enterprise: false
  proxima:
    sharedworker:
      kube:
        pool_workers: true
  development: true
  staff: true
  dotcom:
    backupworker:
      vm:
        pool_workers: true # configured in ../resqued/github-gitbackups-maintenance-aqueduct.rb
gitbackups_sweeper:
  scheduling_hints:
    tier: 1
    should_start_within: 1h
  development: true
  staff: true
  dotcom:
    backupworker:
      vm:
        dedicated_workers: true # configured in ../resqued/github-gitbackups-maintenance-aqueduct.rb
  enterprise: false
  proxima: false
gitbackups_scheduler:
  scheduling_hints:
    tier: 1
    should_start_within: 10m
  development: false
  staff: false
  enterprise: false
  proxima: false
  dotcom:
    backupworker:
      vm:
        dedicated_workers: true # configured in ../resqued/github-gitbackups-maintenance-aqueduct.rb
gitbackups_encryption:
  scheduling_hints:
    tier: 1
    should_start_within: 1h
  development: false
  staff: false
  enterprise: false
  proxima: false
  dotcom:
    backupworker:
      vm:
        dedicated_workers: true # configured in ../resqued/github-gitbackups-maintenance-aqueduct.rb
gitbackups_delete:
  scheduling_hints:
    tier: 1
    should_start_within: 30s
  development: false
  staff: false
  dotcom:
    lowworker:
      vm:
        pool_workers: true
  enterprise: false
  proxima:
    sharedworker:
      kube:
        pool_workers: true
gitbackups_migration_scheduler:
  scheduling_hints:
    tier: 1
    should_start_within: 10m
  development: false
  staff: false
  enterprise: false
  proxima: false
  dotcom:
    backupworker:
      vm:
        dedicated_workers: true # configured in ../resqued/github-gitbackups-maintenance-aqueduct.rb
