organization_test_read_permission:
  # this permission is used in tests while there are no other suitable organization permissions
  # it is not displayed in any UIs or APIs, or assigned to any internal roles.
  target_type: Organization
  custom_role_enabled: false
  category: general
  description: "Organization Test Read Permission"
  programmatic_resource: "organization_administration"
  programmatic_action: "read"
  oauth_scopes:
  - "repo"
  - "admin:org"
