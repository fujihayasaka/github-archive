enterprise_test_read_permission:
  # this permission is used in tests while there are no other suitable enterprise permissions
  # it is not displayed in any UIs or APIs, or assigned to any internal roles.
  target_type: Business
  custom_role_enabled: false
  category: general
  description: "Enterprise Test Read Permission"
  programmatic_resource: "enterprise_administration"
  programmatic_action: "read"
  oauth_scopes:
  - "repo"
  - "admin:enterprise"
