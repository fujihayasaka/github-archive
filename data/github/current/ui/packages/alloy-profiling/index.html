<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta title="Alloy Profiling" />
    <script type="module" src="/alloy-profiling-client.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: 'Arial', sans-serif;
        padding: var(--spacing);
      }

      :root {
        --primary-color: #2da44e; /* GitHub green */
        --spacing: 1rem;
        --border-radius: 4px;
      }

      .container {
        padding: var(--spacing);
      }

      h1,
      h2 {
        margin-bottom: var(--spacing);
      }

      button {
        padding: 0.5rem 1rem;
      }

      button:disabled {
        cursor: wait;
      }

      #args {
        width: 100%;
        padding: var(--spacing);
        border-radius: var(--border-radius);
        font-family: monospace;
      }

      #output {
        padding: var(--spacing);
        border-radius: var(--border-radius);
        min-height: 200px;
        background: #f9fafb;
      }
    </style>
  </head>
  <body>
    <h1>Alloy Profiling</h1>
    <button id="reset" disabled>🔄 Reset</button>
    <button id="render" disabled>🎨 Render</button>
    <p>Reset Time: <span id="reset-time">N/A</span></p>
    <p>Render Time: <span id="render-time">N/A</span></p>
    <h2>Arguments</h2>
    <textarea id="args" rows="25" placeholder="Enter arguments here..."></textarea>
    <h2>Rendered Output</h2>
    <div id="output"></div>
  </body>
</html>
