query GetSuggestedNavigationDestinations($pageViews: [String!]) {
  suggestions: suggestedNavigationDestinations(pageViews: $pageViews, first: 100) {
    nodes {
      type: __typename
      ... on Repository {
        databaseId
        name: nameWithOwner
        path: resourcePath
      }
      ... on Team {
        avatarUrl(size: 56)
        databaseId
        name: combinedSlug
        path: resourcePath
      }
    }
  }
}
