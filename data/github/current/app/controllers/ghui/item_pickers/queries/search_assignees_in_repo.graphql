query SearchAssigneesInRepo(
  $owner: String!
  $name: String!
  $query: String
  $loginNames: String
  $first: Int!
  $capabilities: [RepositorySuggestedActorFilter!]!
) {
  repository(owner: $owner, name: $name) {
    suggestedActors(first: $first, query: $query, loginNames: $loginNames, capabilities: $capabilities) {
      nodes {
        __typename
        id
        login
        name
        profileResourcePath
        avatarUrl(size: 64)
        ... on User {
          databaseId
        }
        ... on Bot {
          databaseId
          isCopilot
          isAgent
          displayName
          needsAuthorization
        }
      }
      totalCount
    }
  }
}
