query SearchAssigneesInIssue(
  $owner: String!
  $name: String!
  $number: Int!
  $query: String!
  $first: Int!
) {
  repository(owner: $owner, name: $name) {
    issueOrPullRequest(number: $number) {
      ... on Assignable {
        suggestedActors(first: $first, query: $query) {
          nodes {
            __typename
            ... on User {
              id
              login
              name
              profileResourcePath
              avatarUrl(size: 64)
            }
            ... on Bot {
              id
              login
              name
              profileResourcePath
              avatarUrl(size: 64)
              isCopilot
              isAgent
              displayName
              needsAuthorization
            }
            ... on Mannequin {
              id
              login
              name: login
              profileResourcePath: url
              avatarUrl(size: 64)
            }
            ... on Organization {
              id
              login
              name
              profileResourcePath: url
              avatarUrl(size: 64)
            }
          }
          totalCount
        }
      }
    }
  }
}
