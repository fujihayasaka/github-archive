# This changeset was released in API version `2026-03-10`
# The name of the changeset. This should match the filename.
name: remove_singular_assignee_from_issues_and_pull_requests

# auto-generated timestamp of when the changeset was created
created_at: 20260220093850

# A human-readable description of the changeset for use in the public changelog.
#
# <Remove> foo property from bar response
# <Change> baz property type to bring global consistency
# <Deprecate> qux operation
description: Remove deprecated singular "assignee" field from Issue and Pull Request endpoints.

# To further elaborate on the details of the change or its effects.
notes: |
  The singular `assignee` field has been marked as "closing down" for years and
  duplicates information available in the `assignees` array. To migrate, update
  your integration to:

  - Use the `assignees` array parameter instead of the singular `assignee`
    parameter when creating or updating Issues.
  - Read assignee information from the `assignees` array instead of the singular
    `assignee` property in Issue and Pull Request responses.

  See https://docs.github.com/rest/issues/issues for updated documentation.

