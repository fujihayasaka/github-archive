# The name of the changeset. This should match the filename.
name: deprecate_code_search_fields

# auto-generated timestamp of when the changeset was created
created_at: 20260327171342

# A human-readable description of the changeset for use in the public changelog.
description: Deprecate `repository.description` on `GET /search/code`

# To further elaborate on the details of the change or its effects.
notes: |-
  `repository.description` returns `null` on Code Search Result Items.
  `repository.owner.type` and `repository.owner.node_id` will also return
  `null` once the backend migration is complete.
  Use the [Get a repository](https://docs.github.com/rest/repos/repos#get-a-repository)
  endpoint (`GET /repos/{owner}/{repo}`) to retrieve full repository metadata.

# List of affected endpoints.
affected_endpoints:
  - GET /search/code

# The date on or after which this changeset can be promoted into a fixed version.
