description: Remove "updated_at" property from Copilot seat details in the Copilot user management endpoint responses.

# To further elaborate on the details of the change or its effects.
notes: |-
  The `updated_at` property will no longer be included in the Copilot seat detail part of the response body from the following endpoints:

  * `GET /organization/{org}/billing/copilot/seats`
  * `GET /enterprises/{enterprise}/billing/copilot/seats`
  * `GET /organization/{org}/members/{username}/copilot`

