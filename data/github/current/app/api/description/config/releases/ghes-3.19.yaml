---
published: false
deprecated: false
variables:
  externalDocsUrl: https://docs.github.com/enterprise-server@3.19
  ghesVersion: '3.19'
  apiName: GitHub Enterprise Server
patch:
- op: add
  path: "/servers"
  value:
  - url: "{protocol}://{hostname}/api/v3"
    variables:
      hostname:
        description: Self-hosted Enterprise Server hostname
        default: HOSTNAME
      protocol:
        description: Self-hosted Enterprise Server protocol
        default: http
- op: add
  path: "/externalDocs"
  value:
    description: GitHub Enterprise Developer Docs
    url: https://docs.github.com/enterprise-server@3.19/rest/
- op: add
  path: "/tags/-"
  value:
    name: scim
    description: Provisioning of GitHub organization membership for SCIM-enabled providers.
    x-displayName: SCIM
- op: add
  path: "/info/x-github-plan"
  value: ghes
- op: add
  path: "/info/x-github-release"
  value: 3.19
- op: add
  path: "/info/x-github-api-versions"
  value:
  - '2022-11-28'
- op: add
  path: "/tags/-"
  value:
    name: enterprise-admin
    description: Enterprise Administration
    x-displayName: Enterprise Administration
- op: add
  path: "/tags/-"
  value:
    name: oauth-authorizations
    description: OAuth Authorizations API
    x-displayName: OAuth Authorizations
- op: add
  path: "/tags/-"
  value:
    name: security-advisories
    description: Security Advisories API
    x-displayName: Security Advisories
- op: add
  path: "/tags/-"
  value:
    name: code-security
    description: Endpoints to manage code security using the REST API.
    x-displayName: Code security
- op: add
  path: "/tags/-"
  value:
    name: private-registries
    description: Manage private registry configurations.
    x-displayName: Private Registries
- op: add
  path: "/tags/-"
  value:
    name: credentials
    description: Revoke compromised or leaked GitHub credentials.
    x-displayName: Revoke Credentials
- op: add
  path: "/tags/-"
  value:
    name: projects
    description: Interact with GitHub Projects.
    x-displayName: Projects
