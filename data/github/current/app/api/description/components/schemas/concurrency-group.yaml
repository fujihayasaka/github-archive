---
title: Concurrency Group
description: |-
  A concurrency group with the workflow runs and jobs that are either currently holding
  or waiting for the concurrency group lease.
type: object
required:
- group_name
- group_url
- total_count
- group_members
properties:
  group_name:
    type: string
    description: The name of the concurrency group.
  group_url:
    type: string
    format: uri
    description: API URL for this concurrency group.
  total_count:
    type: integer
  group_members:
    type: array
    items:
      type: object
      required:
      - run_id
      - run_name
      - run_url
      - run_html_url
      - status
      properties:
        run_id:
          type: integer
          description: The ID of the workflow run.
        run_name:
          type: string
          description: The name of the workflow run.
        run_url:
          type: string
          format: uri
          description: API URL for the workflow run.
          nullable: true
        run_html_url:
          type: string
          format: uri
          description: Web URL for the workflow run.
          nullable: true
        job_id:
          type: integer
          description: The ID of the job, when the item represents a job-level or reusable-workflow-level lease.
        job_name:
          type: string
          description: The display name of the job, when the item represents a job-level or reusable-workflow-level lease.
        job_url:
          type: string
          format: uri
          description: API URL for the job.
          nullable: true
        job_html_url:
          type: string
          format: uri
          description: Web URL for the job.
          nullable: true
        status:
          type: string
          enum:
          - in_progress
          - pending
