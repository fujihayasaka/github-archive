---
# This is used when issue types are referenced in ELM webhooks, meaning they
# don't need the GraphQL NodeID
title: Issue Type
description: The type of issue.
type: object
nullable: true
properties:
  id:
    type: integer
    description: The unique identifier of the issue type.
  name:
    type: string
    description: The name of the issue type.
  color:
    type: string
    description: The color of the issue type.
    enum:
      - gray
      - blue
      - green
      - yellow
      - orange
      - red
      - pink
      - purple
    nullable: true
required:
  - id
  - name
