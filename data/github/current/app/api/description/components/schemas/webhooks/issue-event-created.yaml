---
title: issue event created event
type: object
properties:
  action:
    type: string
    enum:
      - created
  event_name:
    type: string
    enum:
      # Exactly the same as `IssueEvent::VALID_EVENTS`
      - closed
      - reopened
      - merged
      - mentioned
      - subscribed
      - unsubscribed
      - referenced
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - milestoned
      - demilestoned
      - locked
      - unlocked
      - renamed
      - deployed
      - deployment_environment_changed
      - head_ref_deleted
      - head_ref_restored
      - base_ref_force_pushed
      - head_ref_force_pushed
      - base_ref_changed
      - base_ref_deleted
      - automatic_base_change_succeeded
      - automatic_base_change_failed
      - added_to_merge_queue
      - removed_from_merge_queue
      - ready_for_review
      - review_dismissed
      - review_requested
      - review_request_removed
      - convert_to_draft
      - added_to_project
      - moved_columns_in_project
      - removed_from_project
      - converted_note_to_issue
      - comment_deleted
      - marked_as_duplicate
      - unmarked_as_duplicate
      - transferred
      - pinned
      - unpinned
      - user_blocked
      - connected
      - disconnected
      - auto_merge_enabled
      - auto_rebase_enabled
      - auto_squash_enabled
      - auto_merge_disabled
      - converted_to_discussion
      - added_to_project_v2
      - converted_from_draft
      - removed_from_project_v2
      - project_v2_item_status_changed
      - blocked_by_added
      - blocked_by_removed
      - blocking_added
      - blocking_removed
      - issue_type_added
      - issue_type_removed
      - issue_type_changed
      - sub_issue_added
      - sub_issue_removed
      - parent_issue_added
      - parent_issue_removed
      - copilot_work_started
      - copilot_work_finished
      - copilot_work_finished_failure
  target:
    $ref: '../issue-event.yaml'
  actor_url:
    description: the URL identifying the actor that triggered the event
    type: string
    format: uri
  actor_html_url:
    description: the HTML URL identifying the actor that triggered the event
    type: string
    format: uri
  issue_url:
    description: the URL identifying the issue receiving the event
    type: string
    format: uri
  issue_html_url:
    description: the HTML URL identifying the issue receiving the event
    type: string
    format: uri
  pull_request_url:
    description: the URL identifying the pull request receiving the event, if the event targets a pull request
    type: string
    format: uri
    nullable: true
  pull_request_html_url:
    description: the HTML URL identifying the pull request receiving the event, if the event targets a pull request
    type: string
    format: uri
    nullable: true
  commit:
    description: the commit with which the event is associated, if specified
    type: string
    nullable: true
  commit_repository_url:
    description: the URL of the repository the commit is in, if not the same as the sender repository
    type: string
    format: uri
    nullable: true
  commit_repository_html_url:
    description: the HTML URL of the repository the commit is in, if not the same as the sender repository
    type: string
    format: uri
    nullable: true
  referencing_issue_url:
    description: the URL of the issue that is referencing this issue, if any
    type: string
    format: uri
    nullable: true
  referencing_issue_html_url:
    description: the HTML URL of the issue that is referencing this issue, if any
    type: string
    format: uri
    nullable: true
  event_html_url:
    description: the HTML URL of the event
    type: string
    format: uri
    nullable: true
  performed_by_integration_id:
    description: The ID of the integration that created the event, if any
    type: integer
    nullable: true
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'

required:
  - action
  - event_name
  - target
  - issue_url
  - issue_html_url
  - repository
  - sender
