---
title: page updated event
type: object
properties:
  action:
    type: string
    enum:
      - updated
  updated_at:
    type: string
    nullable: true
    format: date-time
  enterprise:
    $ref: '../enterprise-webhooks.yaml'
  installation:
    $ref: '../simple-installation.yaml'
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
  page:
    $ref: '../page.yaml'
  changes:
    type: object
    description: The changes made to the page, if any.
    properties:
      id:
        type: object
        properties:
          from:
            type: integer
            nullable: true
        required:
          - from
      repository_id:
        type: object
        properties:
          from:
            type: integer
            nullable: true
        required:
          - from
      build_type:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      built_revision:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      cname:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      custom_subdomain:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      deleted:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      deleted_at:
        type: object
        properties:
          from:
            type: string
            format: date-time
            nullable: true
        required:
          - from
      deleted_cname:
        type: object
        properties:
          from:
            type: string
            format: date-time
            nullable: true
        required:
          - from
      four_oh_four:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      status:
        type: object
        properties:
          from:
            type: string
            nullable: true
            enum:
              - built
              - building
              - errored
        required:
          - from
      has_public_search:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      https_redirect:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      hsts_max_age:
        type: object
        properties:
          from:
            type: integer
            nullable: true
        required:
          - from
      # source is excluded; it is legacy
      source_ref_name:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      source_subdir:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      hsts_include_subdomains:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      hsts_preload:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      public:
        type: object
        properties:
          from:
            type: boolean
            nullable: true
        required:
          - from
      subdomain:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      parent_domain:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from
      www_parent_domain:
        type: object
        properties:
          from:
            type: string
            nullable: true
        required:
          - from

required:
  - action
  - page
  - changes
