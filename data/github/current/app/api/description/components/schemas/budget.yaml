---
type: object
properties:
  id:
    type: string
    description: The unique identifier for the budget
    example: "2066deda-923f-43f9-88d2-62395a28c0cdd"
  budget_type:
    description: The type of pricing for the budget
    example: "SkuPricing"
    oneOf:
      - type: string
        enum:
          - SkuPricing
      - type: string
        enum:
          - ProductPricing
      - type: string
        enum:
          - BundlePricing
        x-unpublished: "Tracked by https://github.com/github/gitcoin/issues/24902"
  budget_amount:
    type: integer
    description: The budget amount limit in whole dollars. For license-based products, this represents the number of licenses.
  prevent_further_usage:
    type: boolean
    description: The type of limit enforcement for the budget
    example: true
  budget_scope:
    type: string
    description: The scope of the budget (enterprise, organization, repository, cost center)
    example: "enterprise"
  budget_entity_name:
    type: string
    description: The name of the entity for the budget (enterprise does not require a name).
    example: "octocat/hello-world"
  budget_product_sku:
    type: string
    description: A single product or sku to apply the budget to.
  budget_alerting:
    type: object
    properties:
      will_alert:
        type: boolean
        description: Whether alerts are enabled for this budget
        example: true
      alert_recipients:
        type: array
        items:
          type: string
        description: Array of user login names who will receive alerts
        example: ["mona", "lisa"]
    required:
      - will_alert
      - alert_recipients
  exclude_cost_center_usage:
    type: boolean
    description: Whether to exclude cost center usage from the budget (enterprise scope only)
    example: false
    x-unpublished: Feature is in development and not yet ready for public documentation
required:
  - id
  - budget_type
  - budget_product_sku
  - budget_scope
  - budget_amount
  - prevent_further_usage
  - budget_alerting
