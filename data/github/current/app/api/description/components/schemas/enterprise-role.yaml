---
title: Enterprise Role
description: Enterprise custom roles
type: object
properties:
  id:
    description: The unique identifier of the role.
    type: integer
    format: int64
  name:
    description: The name of the role.
    type: string
  description:
    description: A short description about who this role is for or what permissions it grants.
    type: string
    nullable: true
  source:
    type: string
    nullable: true
    description: Source answers the question, "where did this role come from?"
    enum:
      - Enterprise
      - Predefined
  permissions:
    description: A list of permissions included in this role.
    type: array
    items:
      type: string
  enterprise:
    $ref: 'enterprise.yaml'
    x-nullable-ref: true
  created_at:
    description: The date and time the role was created.
    type: string
    format: date-time
  updated_at:
    description: The date and time the role was last updated.
    type: string
    format: date-time
required:
  - id
  - name
  - permissions
  - enterprise
  - created_at
  - updated_at
