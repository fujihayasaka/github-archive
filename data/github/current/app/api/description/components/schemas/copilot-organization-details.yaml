---
title: Copilot Organization Details
description: Information about the seat breakdown and policies set for an organization with a Copilot Business or Copilot Enterprise subscription.
type: object
properties:
  seat_breakdown:
    $ref: './copilot-organization-seat-breakdown.yaml'
  public_code_suggestions:
    type: string
    description: The organization policy for allowing or blocking suggestions matching public code (duplication detection filter).
    enum:
      - allow
      - block
      - unconfigured
  ide_chat:
    type: string
    description: The organization policy for allowing or disallowing Copilot Chat in the IDE.
    enum:
      - enabled
      - disabled
      - unconfigured
  platform_chat:
    type: string
    description: The organization policy for allowing or disallowing Copilot features on GitHub.com.
    enum:
      - enabled
      - disabled
      - unconfigured
  cli:
    type: string
    description: The organization policy for allowing or disallowing Copilot in the CLI.
    enum:
      - enabled
      - disabled
      - unconfigured
  seat_management_setting:
    type: string
    description: The mode of assigning new seats.
    enum:
      - assign_all
      - assign_selected
      - disabled
      - unconfigured
  plan_type:
    type: string
    description: The Copilot plan of the organization, or the parent enterprise, when applicable.
    enum:
      - business
      - enterprise
required:
  - seat_breakdown
  - public_code_suggestions
  - seat_management_setting
# before features are publicly released we will want to be able to add them here (e.g. copilot_chat)
# so that customers in those feature flags can see them but we don't break the contract. Once we enable the feature for everyone
# we'll want to formally add it to the schema.
additionalProperties: true
