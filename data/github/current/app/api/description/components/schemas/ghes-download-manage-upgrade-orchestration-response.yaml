---
type: object
required:
  - message
  - download_id
  - max_parallel
  - total_nodes
properties:
  message:
    type: string
    example: download orchestration started
  download_id:
    type: string
    description: Gateway-generated download identifier for the orchestration.
    example: 7bba0103-31f4-48ea-9d4d-d7a2a700fe9f
  max_parallel:
    type: integer
    description: Effective maximum number of nodes that the gateway will download to at the same time.
    example: 2
  total_nodes:
    type: integer
    description: Number of targeted nodes in the orchestration.
    example: 5
