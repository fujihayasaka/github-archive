---
description: Configuration for code scanning default setup.
type: object
properties:
  state:
    description: The desired state of code scanning default setup.
    type: string
    enum:
      - configured
      - not-configured
  runner_type:
    description: Runner type to be used.
    type: string
    enum:
      - standard
      - labeled
  runner_label:
    nullable: true
    description: Runner label to be used if the runner type is labeled.
    type: string
    example: 'code-scanning'
  query_suite:
    description: CodeQL query suite to be used.
    type: string
    enum:
      - default
      - extended
  threat_model:
    description: Threat model to be used for code scanning analysis. Use `remote` to analyze only network sources and `remote_and_local` to include local sources like filesystem access, command-line arguments, database reads, environment variable and standard input.
    type: string
    enum:
      - remote
      - remote_and_local
  languages:
    description: "CodeQL languages to be analyzed."
    type: array
    items:
      type: string
      enum:
        - actions
        - c-cpp
        - csharp
        - go
        - java-kotlin
        - javascript-typescript
        - python
        - ruby
        - swift
additionalProperties: false
x-githubEnterpriseOverlays:
  '< 3.18':
    properties:
      threat_model:
  '< 3.16':
    properties:
      runner_type:
      runner_label:
  '< 3.12':
    required:
      - state
    additionalProperties: true
  '< 3.10':
    properties:
      languages:
  '3.10':
    properties:
      languages:
        description: "CodeQL languages to be analyzed."
        items:
          enum:
            - c-cpp
            - csharp
            - go
            - java-kotlin
            - javascript-typescript
            - python
            - ruby
