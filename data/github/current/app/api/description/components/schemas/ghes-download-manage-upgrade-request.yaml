---
type: object
properties:
  version:
    type: string
    description: Semantic version of the upgrade package to download. If omitted, the agent resolves the latest eligible version.
    example: '3.22.1'
  force:
    type: boolean
    description: Whether to remove an existing package file before starting a new download.
    default: false
  uuids:
    type: array
    description: Node UUIDs to target after gateway query filters are applied. Blank values are ignored; if all supplied values are blank, the request is rejected.
    items:
      type: string
    example:
      - uuid-1
      - uuid-2
  max_parallel:
    type: integer
    description: Selects gateway-side orchestration and limits the number of nodes downloading at the same time. Non-positive values use the gateway default, and values above the target node count are capped to that count.
    default: 2
    minimum: 0
    example: 2
  node_timeout:
    type: string
    description: Selects gateway-side orchestration and marks an in-flight node download as stuck after this Go duration. Defaults to 30m and must be at most 2h.
    default: 30m0s
    example: 1h
  max_attempts:
    type: integer
    description: Selects gateway-side orchestration and sets the maximum number of attempts per node. Non-positive values use the gateway default. The maximum accepted value is 5.
    default: 3
    minimum: 0
    maximum: 5
    example: 3
