---
title: Discussion Comment
description: A reply to a discussion.
type: object
properties:
  body:
    description: The main text of the comment.
    type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
    nullable: true
  html_url:
    description: The URL to view the discussion comment in a browser.
    type: string
    format: uri
  id:
    type: integer
  discussion_id:
    type: integer
  parent_id:
    description: Unique identifier for the discussion comment this comment is in reply to, if any.
    type: integer
    nullable: true
  child_comment_count:
    description: How many comments are replying to this comment.
    type: integer
  node_id:
    type: string
  user:
    title: User
    type: object
    nullable: true
    properties:
      avatar_url:
        type: string
        format: uri
      deleted:
        type: boolean
      email:
        type: string
        nullable: true
      events_url:
        type: string
        format: uri-template
      followers_url:
        type: string
        format: uri
      following_url:
        type: string
        format: uri-template
      gists_url:
        type: string
        format: uri-template
      gravatar_id:
        type: string
      html_url:
        type: string
        format: uri
      id:
        type: integer
        format: int64
      login:
        type: string
      name:
        type: string
      node_id:
        type: string
      organizations_url:
        type: string
        format: uri
      received_events_url:
        type: string
        format: uri
      repos_url:
        type: string
        format: uri
      site_admin:
        type: boolean
      starred_url:
        type: string
        format: uri-template
      subscriptions_url:
        type: string
        format: uri
      type:
        type: string
        enum:
          - Bot
          - User
          - Organization
      url:
        type: string
        format: uri
      user_view_type:
        type: string
    required:
      - login
      - id
  reactions:
    $ref: './reaction-rollup.yaml'
  author_association:
    title: AuthorAssociation
    description: How the author is associated with the repository.
    type: string
    enum:
      - COLLABORATOR
      - CONTRIBUTOR
      - FIRST_TIMER
      - FIRST_TIME_CONTRIBUTOR
      - MANNEQUIN
      - MEMBER
      - NONE
      - OWNER
  repository_url:
    type: string
required:
  - id
  - discussion_id
  - body
  - created_at
  - updated_at
  - html_url
  - node_id
  - author_association
  - user
  - repository_url
