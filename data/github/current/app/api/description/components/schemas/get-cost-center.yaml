---
type: object
properties:
  id:
    type: string
    description: ID of the cost center.
  name:
    type: string
    description: Name of the cost center.
  azure_subscription:
    type: string
    nullable: true
    description: Azure subscription ID associated with the cost center. Only present for cost centers linked to Azure subscriptions.
  state:
    type: string
    description: State of the cost center.
    enum:
      - active
      - deleted
  resources:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          description: Type of the resource.
        name:
          type: string
          description: Name of the resource.
      required:
        - type
        - name
required:
  - id
  - name
  - resources
