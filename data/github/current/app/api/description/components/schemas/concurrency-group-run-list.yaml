---
title: Concurrency Group Run List
description: A list of concurrency groups associated with a workflow run.
type: object
required:
- total_count
- concurrency_groups
properties:
  total_count:
    type: integer
    description: |-
      The total number of concurrency groups this workflow run participates in,
      derived from the run's configuration. This count is not filtered by
      whether the run currently holds or is waiting in each group, so it can
      include groups whose `group_members` array is empty (for example, when
      the run has already released its lease in that group).
  concurrency_groups:
    type: array
    items:
      type: object
      required:
      - group_name
      - group_url
      - group_members
      properties:
        group_name:
          type: string
          description: The name of the concurrency group.
        group_url:
          type: string
          format: uri
          description: |-
            API URL for this concurrency group. May return 404 if the group
            has no active items at the time it is requested, since the
            get-by-name endpoint reports the live repo-wide state of a group
            while this endpoint lists groups associated with a run by
            configuration.
        group_members:
          type: array
          description: |-
            Items belonging to this workflow run that are either currently holding or
            waiting for the concurrency group lease. May be empty if the run no
            longer has any active or queued items in this group.
          items:
            type: object
            required:
            - run_id
            - run_name
            - run_url
            - run_html_url
            - status
            - position
            - position_url
            properties:
              run_id:
                type: integer
                description: The ID of the workflow run.
              run_name:
                type: string
                description: The name of the workflow run.
              run_url:
                type: string
                format: uri
                description: API URL for the workflow run.
                nullable: true
              run_html_url:
                type: string
                format: uri
                description: Web URL for the workflow run.
                nullable: true
              position:
                type: integer
                description: Queue position. 0 means the item holds the concurrency lease (in_progress), 1 or higher means queued (pending).
              position_url:
                type: string
                format: uri
                description: API URL to get items ahead of this item in the concurrency group.
              job_id:
                type: integer
                description: The ID of the job, when the item represents a job-level or reusable-workflow-level lease.
                nullable: true
              job_name:
                type: string
                description: The display name of the job, when the item represents a job-level or reusable-workflow-level lease.
                nullable: true
              job_url:
                type: string
                format: uri
                description: API URL for the job.
                nullable: true
              job_html_url:
                type: string
                format: uri
                description: Web URL for the job.
                nullable: true
              status:
                type: string
                enum:
                - in_progress
                - pending
