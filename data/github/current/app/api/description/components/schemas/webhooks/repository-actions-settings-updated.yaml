---
title: repository actions settings updated event
type: object
properties:
  action:
    type: string
    description: The action that was performed. For this event, the only possible value is `updated`.
    enum:
      - updated
  created_at:
    type: string
    format: date-time
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
  updated_at:
    type: string
    format: date-time
  updated_settings:
    type: object
    description: The updated settings for GitHub Actions in the repository.
    properties:
      github_owned_allowed:
        type: boolean
        description: Whether GitHub-owned actions are allowed in the repository.
      verified_allowed:
        type: boolean
        description: Whether verified actions are allowed in the repository.
      sha_pinning_required:
        type: boolean
        description: Whether SHA pinning is required for actions in the repository.
      allowed_types:
        type: string
        description: The types of actions that are allowed in the repository.
      access_policy:
        type: string
        description: The access policy for actions in the repository.
      patterns:
        type: array
        description: The patterns of actions that are allowed in the repository.
        items:
          type: string

required:
  - repository
  - sender
  - updated_settings
