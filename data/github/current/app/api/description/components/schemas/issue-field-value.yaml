---
title: Issue Field Value
description: A value assigned to an issue field
type: object
properties:
  issue_field_id:
    description: 'Unique identifier for the issue field.'
    type: integer
    format: int64
    example: 1
  node_id:
    type: string
    example: IFT_GDKND
  data_type:
    description: The data type of the issue field
    type: string
    enum:
      - text
      - single_select
      - number
      - date
    example: text
  value:
    description: The value of the issue field
    anyOf:
      - type: string
        example: "Sample text"
      - type: number
        example: 42.5
      - type: integer
        example: 1
    nullable: true
  single_select_option:
    description: Details about the selected option (only present for single_select fields)
    type: object
    properties:
      id:
        description: 'Unique identifier for the option.'
        type: integer
        format: int64
        example: 1
      name:
        description: The name of the option
        type: string
        example: High
      color:
        description: The color of the option
        type: string
        example: red
    required:
      - id
      - name
      - color
    nullable: true
required:
  - issue_field_id
  - node_id
  - data_type
  - value
