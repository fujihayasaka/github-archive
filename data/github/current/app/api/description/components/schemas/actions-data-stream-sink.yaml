---
title: Actions data stream sink
description: A customer-configured destination for GitHub Actions event streaming.
type: object
properties:
  id:
    description: The unique identifier of the data stream sink.
    type: string
    example: sink-123
  owner_type:
    description: The type of owner that the sink belongs to.
    type: string
    enum:
    - enterprise
    - organization
  owner_id:
    description: The numeric identifier of the sink owner.
    type: integer
    format: int64
    example: 1
  name:
    description: The customer-defined name of the sink.
    type: string
    example: data-stream-events
  sink_type:
    description: The destination type for the sink.
    type: string
    enum:
    - s3
    - azure_blob
    - azure_kusto
    - aws_firehose
    - azure_event_hub
  status:
    description: The operational status of the sink.
    type: string
    enum:
    - active
    - paused
    - disabled
    - error
  config:
    description: Destination-specific configuration for the sink.
    type: object
    additionalProperties: true
  sink_health:
    $ref: './actions-data-stream-sink-health.yaml'
required:
- id
- owner_type
- owner_id
- name
- sink_type
- status
- config
