---
nullable: true
type: object
properties:
  advanced_security:
    description: |
      Enable or disable GitHub Advanced Security for the repository.

      For standalone Code Scanning or Secret Protection products, this parameter cannot be used.
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  code_security:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  dependabot_security_updates:
    description: 'Enable or disable Dependabot security updates for the repository.'
    type: object
    properties:
      status:
        description: 'The enablement status of Dependabot security updates for the repository.'
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_push_protection:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_non_provider_patterns:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_ai_detection:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_validity_checks:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_delegated_alert_dismissal:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_delegated_bypass:
    type: object
    properties:
      status:
        type: string
        enum:
          - enabled
          - disabled
  secret_scanning_delegated_bypass_options:
    type: object
    properties:
      reviewers:
        type: array
        description: The bypass reviewers for secret scanning delegated bypass
        items:
          type: object
          required:
            - reviewer_id
            - reviewer_type
          properties:
            reviewer_id:
              type: integer
              description: The ID of the team or role selected as a bypass reviewer
            reviewer_type:
              type: string
              description: The type of the bypass reviewer
              enum:
                - TEAM
                - ROLE
x-github-modify:
  api.github.com:
    properties:
      secret_scanning_validity_checks:
        type: object
        properties:
          status:
            type: string
            enum:
              - enabled
              - disabled
        x-unpublished: Only available on GHEC
x-githubEnterpriseOverlays:
  '*':
    properties:
      secret_scanning_validity_checks:
      secret_scanning_ai_detection:
  '<= 3.9':
    properties:
      dependabot_security_updates:
  '< 3.15':
    properties:
      secret_scanning_non_provider_patterns:
  '< 3.17':
    properties:
      code_security:
  '< 3.21':
    properties:
      secret_scanning_delegated_alert_dismissal:
      secret_scanning_delegated_bypass:
      secret_scanning_delegated_bypass_options:
