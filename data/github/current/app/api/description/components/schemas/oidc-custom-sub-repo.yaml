---
title: Actions OIDC subject customization for a repository
description: Actions OIDC subject customization for a repository
type: object
properties:
  use_default:
    description: Whether to use the default template or not. If `true`, the `include_claim_keys` field is ignored.
    type: boolean
  include_claim_keys:
    description: Array of unique strings. Each claim key can only contain alphanumeric characters and underscores.
    type: array
    items:
      type: string
  use_immutable_subject:
    description: Whether the repository has opted in to the immutable OIDC subject claim format. When `true`, OIDC tokens will use a stable, repository-ID-based `sub` claim. If not set at the repository level, falls back to the organization-level setting.
    type: boolean
  sub_claim_prefix:
    description: The current `sub` claim prefix for this repository.
    type: string
required:
  - use_default
x-githubEnterpriseOverlays:
  '*':
    properties:
      use_immutable_subject:
      sub_claim_prefix:
  '3.7':
    properties:
      include_claim_keys:
        description: Array of unique strings. Each claim key can only contain alphanumeric characters and underscores. This property will only appear in the response body if it was already set using the organization-level endpoint, "Set the customization template for an OIDC subject claim for an organization".
        type: array
        items:
          type: string
