---
# Comment Positioning for request input
title: Pull Request Comment Positioning
x-unpublished: true
description: Data describing the position of the comment within a Git diff.
type: object
properties:
  type:
    type: string
    description: The level at which the comment is targeted.
    enum:
    - FILE
    - LINE
    - MULTILINE
  path:
    type: string
    description: Path of the file where the comment is targeted. Required for FILE and LINE comments.
  commit_oid:
    type: string
    description: Commit OID of the file where the comment is targeted. Required for FILE and LINE comments.
  line:
    type: integer
    description: Line number of the file where the comment is targeted. Required for LINE comments.
  start_path:
    type: string
    description: Path of the file that begins the comment range. Required for MULTILINE comments.
  end_path:
    type: string
    description: Path of the file that ends the comment range. Required for MULTILINE comments.
  start_commit_oid:
    type: string
    description: Commit OID of the file that begins the comment range. Required for MULTILINE comments.
  end_commit_oid:
    type: string
    description: Commit OID of the file that ends the comment range. Required for MULTILINE comments.
  start_line:
    type: integer
    description: Line number of the file that begins the comment range. Required for MULTILINE comments.
  end_line:
    type: integer
    description: Line number of the file that ends the comment range. Required for MULTILINE comments.
required:
- type
