---
title: Repository Topic
description: A repository topic used in webhook payloads.
type: object
properties:
  name:
    type: string
    description: The name of the topic.
  actor_html_url:
    description: the HTML URL identifying the actor that triggered the event
    type: string
    format: uri
    nullable: true
  state:
    type: string
    description: The state of the repository topic
    nullable: true
    enum:
      - created
      - suggested
      - declined_not_relevant
      - declined_too_specific
      - declined_personal_preference
      - declined_too_general
  created_at:
    type: string
    format: date-time
    description: The time the topic was created.
  updated_at:
    type: string
    format: date-time
    description: The time the topic was last updated.
required:
  - name
  - created_at
  - updated_at
