---
title: Create Actions data stream sink request
description: Request body for creating an Actions data stream sink.
type: object
properties:
  name:
    description: The customer-defined name of the sink.
    type: string
    minLength: 1
  sink_type:
    description: The destination type for the sink.
    type: string
    enum:
    - s3
    - azure_blob
    - azure_kusto
    - aws_firehose
    - azure_event_hub
  config:
    description: Destination-specific configuration for the sink.
    type: object
    additionalProperties: true
required:
- name
- sink_type
- config
