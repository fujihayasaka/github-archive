---
title: Organization Custom Property Payload
description: Payload for creating or updating an organization custom property definition on an enterprise.
type: object
properties:
  value_type:
    type: string
    example: single_select
    x-graceful-enum: true # TODO: Remove once custom_properties_url_type FF is promoted
    enum:
    - string
    - single_select
    - multi_select
    - true_false
    # TODO: Add 'url' once custom_properties_url_type FF is promoted
    description: The type of the value for the property.
  required:
    type: boolean
    description: Whether the property is required.
  default_value:
    oneOf:
    - type: string
    - type: array
      items:
        type: string
    nullable: true
    description: Default value of the property.
  description:
    type: string
    nullable: true
    description: Short description of the property.
  allowed_values:
    type: array
    items:
      type: string
      maxLength: 75
    maxItems: 200
    nullable: true
    description: |-
      An ordered list of the allowed values of the property.
      The property can have up to 200 allowed values.
  values_editable_by:
    type: string
    nullable: true
    enum:
      - enterprise_actors
      - enterprise_and_org_actors
    example: enterprise_actors
    description: Who can edit the values of the property.
required:
- value_type
