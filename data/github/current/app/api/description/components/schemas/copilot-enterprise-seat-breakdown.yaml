---
title: Copilot Seat Breakdown
description: The breakdown of Copilot Business seats for the enterprise.
type: object
properties:
  total_seats_billed:
    type: integer
    description: The total number of seats currently being billed for the enterprise.  This may differ from total if users receive Copilot access through multiple organizations within the enterprise.
  added_this_cycle:
    type: integer
    description: Seats added during the current billing cycle.
  pending_cancellation:
    type: integer
    description: The number of seats that are pending cancellation at the end of the current billing cycle.
  pending_invitation:
    type: integer
    description: The number of users that have not yet accepted an invitation to a given organization within the enterprise and therefore have not received Copilot access yet.
  active_this_cycle:
    type: integer
    description: The number of seats that have used Copilot during the current billing cycle.
    x-unpublished: until querying for last_activity is faster
  inactive_this_cycle:
    type: integer
    description: The number of seats that have not used Copilot during the current billing cycle.
    x-unpublished: until querying for last_activity is faster
