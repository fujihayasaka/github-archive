---
title: Space
description: A GitHub Copilot Space represents an interactive AI workspace where users can ask questions and get assistance.
type: object
properties:
  id:
    type: integer
    format: int64
    description: The unique identifier of the space.
    example: 42
  number:
    type: integer
    description: The number that identifies the space within its owner.
    example: 1
  name:
    type: string
    description: The display name of the space.
    example: "My Development Space"
  description:
    type: string
    nullable: true
    description: A description of the space.
    example: "A space for discussing React development patterns"
  general_instructions:
    type: string
    nullable: true
    description: General instructions for the Copilot Space.
    example: "Help with React development patterns and best practices"
  public:
    type: boolean
    description: The space is publicly shared.
    example: false
  base_role:
    type: string
    enum: ["reader", "writer", "admin", "no_access"]
    description: |-
      The base role that determines default permissions.
      - `no_access`: No default access
      - `reader`: Default read permissions
      - `writer`: Default write permissions (organization spaces only)
      - `admin`: Default admin permissions (organization spaces only)
    example: "no_access"
  owner:
    anyOf:
    - $ref: simple-user.yaml
    - $ref: organization-simple.yaml
    description: The user or organization that owns this space.
  creator:
    $ref: simple-user.yaml
  created_at:
    type: string
    format: date-time
    description: The date and time the space was created.
    example: "2023-01-01T00:00:00Z"
  updated_at:
    type: string
    format: date-time
    description: The date and time the space was last updated.
    example: "2023-01-01T12:00:00Z"
  html_url:
    type: string
    format: uri
    description: The HTML URL of the space.
    example: "https://github.com/copilot/spaces/octodemo/5"
  api_url:
    type: string
    format: uri
    description: The API URL of the space.
    example: "https://api.github.com/organizations/octodemo/copilot-spaces/5"
  resources_attributes:
    type: array
    description: Resources attached to the space.
    items:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier of the resource.
        resource_type:
          type: string
          enum: ["repository", "github_file", "free_text", "github_issue", "github_pull_request", "media_content", "uploaded_text_file"]
          description: The type of resource.
        copilot_chat_attachment_id:
          type: integer
          format: int64
          nullable: true
          description: The unique identifier of the chat attachment for uploaded files or media content.
        metadata:
          type: object
          description: Metadata specific to the resource type.
          properties:
            repository_id:
              type: integer
              description: Repository ID for repository or file resources.
            file_path:
              type: string
              description: File path for file resources.
            text:
              type: string
              description: Text content for free text resources.
            name:
              type: string
              description: Name for the resource.
            number:
              type: integer
              description: Issue or PR number.
            copilot_chat_attachment_id:
              type: integer
              description: Chat attachment ID for uploaded files or media.
            media_type:
              type: string
              description: Media type for media content resources.
            url:
              type: string
              description: URL for media content resources.
            height:
              type: integer
              description: Height for media content resources.
            width:
              type: integer
              description: Width for media content resources.
required:
- id
- number
- name
- public
- base_role
- owner
- creator
- created_at
- updated_at
- html_url
- api_url
additionalProperties: false
x-github-releases:
- api.github.com
- ghec
