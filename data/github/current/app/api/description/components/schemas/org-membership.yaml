---
title: Org Membership
description: Org Membership
type: object
properties:
  url:
    type: string
    format: uri
    example: https://api.github.com/orgs/octocat/memberships/defunkt
  state:
    type: string
    description: The state of the member in the organization. The `pending` state indicates the user has not yet accepted an invitation.
    example: active
    enum:
      - active
      - pending
  role:
    type: string
    description: The user's membership type in the organization.
    example: admin
    enum:
      - admin
      - member
      - billing_manager
  direct_membership:
    type: boolean
    description: Whether the user has direct membership in the organization.
    example: true
  enterprise_teams_providing_indirect_membership:
    type: array
    description: |-
      The slugs of the enterprise teams providing the user with indirect membership in the organization.
      A limit of 100 enterprise team slugs is returned.
    maxItems: 100
    items:
      type: string
    example: ['ent:team-one', 'ent:team-two']
  organization_url:
    type: string
    format: uri
    example: https://api.github.com/orgs/octocat
  organization:
    $ref: './organization-simple.yaml'
  user:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  permissions:
    type: object
    properties:
      can_create_repository:
        type: boolean
    required:
      - can_create_repository
required:
  - state
  - role
  - organization_url
  - url
  - organization
  - user
