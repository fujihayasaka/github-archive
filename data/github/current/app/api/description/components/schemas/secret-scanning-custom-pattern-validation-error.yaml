---
title: Secret Scanning Custom Pattern Validation Error
description: A validation error for a custom pattern in a batch operation.
type: object
properties:
  code:
    type: string
    description: A machine-readable code describing the error.
    enum:
      - none
      - config_load
      - compile_db
      - start_delimiter
      - end_delimiter
      - display_name
      - must_match
      - must_not_match
      - custom_pattern_version_mismatch
      - db_size
      - db_size_calculation
  message:
    type: string
    description: A human-readable description of the error.
