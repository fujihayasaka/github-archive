---
title: Update Actions data stream sink request
description: Request body for updating an Actions data stream sink.
type: object
properties:
  name:
    description: The customer-defined name of the sink.
    type: string
    minLength: 1
  status:
    description: The operational status to assign to the sink.
    type: string
    enum:
    - active
    - paused
    - disabled
    - error
  config:
    description: Destination-specific configuration for the sink.
    type: object
    additionalProperties: true
anyOf:
- required:
  - name
- required:
  - status
- required:
  - config
