---
title: Copilot Business Seat Detail
description: Information about a Copilot Business seat assignment for a user, team, or organization.
type: object
properties:
  assignee:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  organization:
    $ref: './organization-simple.yaml'
    x-nullable-ref: true
  assigning_team:
    description: The team through which the assignee is granted access to GitHub Copilot, if applicable.
    oneOf:
      - $ref: './team.yaml'
      - $ref: './enterprise-team.yaml'
    nullable: true
  pending_cancellation_date:
    type: string
    format: date
    nullable: true
    description: The pending cancellation date for the seat, in `YYYY-MM-DD` format. This will be null unless the assignee's Copilot access has been canceled during the current billing cycle. If the seat has been cancelled, this corresponds to the start of the organization's next billing cycle.
  last_activity_at:
    type: string
    format: date-time
    nullable: true
    description: Timestamp of user's last GitHub Copilot activity, in ISO 8601 format.
  last_activity_editor:
    type: string
    nullable: true
    description: Last editor that was used by the user for a GitHub Copilot completion.
  created_at:
    type: string
    format: date-time
    description: Timestamp of when the assignee was last granted access to GitHub Copilot, in ISO 8601 format.
  updated_at:
    type: string
    format: date-time
    deprecated: true
    description: |-
      **Closing down notice:** This field is no longer relevant and is closing down. Use the `created_at` field to determine when the assignee was last granted access to GitHub Copilot. Timestamp of when the assignee's GitHub Copilot access was last updated, in ISO 8601 format.
  plan_type:
    type: string
    description: The Copilot plan of the organization, or the parent enterprise, when applicable.
    enum:
      - business
      - enterprise
      - unknown
required:
  - created_at
additionalProperties: false
x-github-breaking-changes:
  - changeset: remove_copilot_seat_detail_updated_at
    patch:
      properties:
        updated_at:
