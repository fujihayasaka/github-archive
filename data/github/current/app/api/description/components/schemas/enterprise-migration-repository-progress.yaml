---
title: Enterprise Migration Repository Progress
description: Migration progress details for a single repository.
type: object
properties:
  repositoryNwo:
    type: string
    description: The name with owner of the repository (e.g., "owner/repo")
    example: "org/repo-name"
  resourcesAdded:
    type: integer
    format: int64
    description: The number of resources added to the migration
    example: 150
  resourcesProcessed:
    type: integer
    format: int64
    description: The number of resources that have been processed
    example: 75
  allResourcesSent:
    type: boolean
    description: Whether all resources have been sent by the crawler
    example: false
  eventsAdded:
    type: integer
    format: int64
    description: The number of events added during the migration
    example: 50
  eventsProcessed:
    type: integer
    format: int64
    description: The number of events that have been processed
    example: 25
  backfillResourcesAcknowledged:
    type: integer
    format: int64
    description: The number of acknowledged backfill resources
    example: 10
  liveUpdateResourcesAcknowledged:
    type: integer
    format: int64
    description: The number of acknowledged live update resources
    example: 5
required:
- repositoryNwo
- resourcesAdded
- resourcesProcessed
- allResourcesSent
- eventsAdded
- eventsProcessed
