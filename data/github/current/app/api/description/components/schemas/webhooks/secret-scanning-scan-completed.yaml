---
title: secret_scanning_scan completed event
type: object
properties:
  action:
    type: string
    enum:
      - completed
  type:
    type: string
    description: What type of scan was completed
    enum:
      - backfill
      - custom-pattern-backfill
      - pattern-version-backfill
  source:
    type: string
    description: What type of content was scanned
    enum:
      - git
      - issues
      - pull-requests
      - discussions
      - wiki
  started_at:
    type: string
    format: date-time
    description: 'The time that the alert was resolved in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`.'
  completed_at:
    type: string
    format: date-time
    description: 'The time that the alert was resolved in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`.'
  secret_types:
    type: array
    description: 'List of patterns that were updated. This will be empty for normal backfill scans or custom pattern updates'
    items:
      type: string
    nullable: true
  custom_pattern_name:
    type: string
    description: 'If the scan was triggered by a custom pattern update, this will be the name of the pattern that was updated'
    nullable: true
  custom_pattern_scope:
    type: string
    description: 'If the scan was triggered by a custom pattern update, this will be the scope of the pattern that was updated'
    enum:
      - repository
      - organization
      - enterprise
    nullable: true
  repository:
    $ref: '../repository-webhooks.yaml'
  enterprise:
    $ref: '../enterprise-webhooks.yaml'
  installation:
    $ref: '../simple-installation.yaml'
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
required:
  - action
  - source
  - type
  - started_at
  - completed_at
