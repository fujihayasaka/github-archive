---
type: object
description: A potential duplicate issue match with similarity metrics.
properties:
  issue:
    $ref: './issue.yaml'
  score:
    type: number
    description: Similarity score between 0.0 and 1.0
    minimum: 0.0
    maximum: 1.0
  confidence:
    type: string
    enum: [high, medium, low]
    description: Confidence level of the duplicate match
  likely_duplicate:
    type: boolean
    description: Whether this is likely a duplicate based on the confidence threshold
required:
  - issue
  - score
  - confidence
  - likely_duplicate
