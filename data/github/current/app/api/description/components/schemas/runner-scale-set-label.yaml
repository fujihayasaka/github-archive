---
title: Runner Scale Set label
description: A label for a self hosted runner
type: object
properties:
  id:
    type: integer
    description: Unique identifier of the label.
  name:
    type: string
    description: Name of the label.
  type:
    type: string
    description: The type of label. Read-only labels are applied automatically when the scale set is configured.
    enum:
      - system
      - user
required:
  - name
