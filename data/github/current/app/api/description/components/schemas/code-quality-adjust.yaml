---
description: Adjust configuration for code quality managed analysis.
type: object
properties:
  languages:
    description: "Languages to be analyzed."
    type: array
    items:
      type: string
      enum:
        - csharp
        - go
        - java-kotlin
        - javascript-typescript
        - python
        - ruby
  workflow_run_id:
    description: "The run id of the workflow run making the call."
    type: integer
required:
  - languages
