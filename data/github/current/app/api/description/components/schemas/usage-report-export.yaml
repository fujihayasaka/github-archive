---
type: object
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier for the usage report export
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  report_type:
    type: string
    description: The type of usage report
    enum:
      - detailed
      - summarized
      - premium_request
      - ai_credit
    example: "detailed"
  start_date:
    type: string
    format: date
    description: The start date for the report
    example: "2024-01-01"
  end_date:
    type: string
    format: date
    description: The end date for the report
    example: "2024-01-31"
  status:
    type: string
    description: The current status of the report export
    enum:
      - processing
      - completed
      - failed
    example: "completed"
  download_urls:
    type: array
    items:
      type: string
    description: URLs to download the completed report. Only present when the report status is `completed`.
    example: ["https://github.com/enterprises/github/metered_exports/1234"]
  created_at:
    type: string
    format: date-time
    description: When the report export was created
    example: "2024-01-15T10:30:00Z"
  actor:
    type: string
    description: The login of the user who requested the export
    example: "monalisa"
required:
  - id
  - report_type
  - start_date
  - end_date
  - status
