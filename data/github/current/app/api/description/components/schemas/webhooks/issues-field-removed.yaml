---
title: issues field_removed event
type: object
properties:
  action:
    type: string
    enum:
      - field_removed
  enterprise:
    $ref: '../enterprise-webhooks.yaml'
  installation:
    $ref: '../simple-installation.yaml'
  issue:
    $ref: ../webhooks_issue.yaml
  issue_field:
    type: object
    description: The issue field whose value was cleared from the issue.
    properties:
      id:
        type: integer
        description: The unique identifier of the issue field.
      name:
        type: string
        description: The name of the issue field.
      field_type:
        type: string
        description: The data type of the issue field.
        enum:
          - text
          - date
          - single_select
          - multi_select
          - number
    required:
      - id
      - name
      - field_type
  issue_field_value:
    type: object
    description: The value that was cleared from the issue field.
    properties:
      id:
        type: integer
        description: The unique identifier of the issue field value.
      value:
        description: The value of the field. Present for text, date, and number field types.
        nullable: true
        anyOf:
          - type: string
          - type: number
          - type: integer
      value_id:
        type: integer
        description: The identifier of the selected option. Present for single_select field types.
      option:
        type: object
        description: The selected option details. Present for single_select field types.
        properties:
          id:
            type: integer
          name:
            type: string
          color:
            type: string
          description:
            type: string
            nullable: true
      value_ids:
        type: array
        items:
          type: integer
        description: The identifiers of the selected options. Present for multi_select field types.
      options:
        type: array
        description: The selected option details. Present for multi_select field types.
        items:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            color:
              type: string
            description:
              type: string
              nullable: true
    required:
      - id
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
required:
  - action
  - issue
  - issue_field
  - repository
  - sender
