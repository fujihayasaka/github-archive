    enum:
      - edited
  changes:
    type: object
    properties:
      vulnerability_alerts_enabled:
        type: object
        properties:
          to:
            type: boolean
        required:
          - to
      dependency_graph_enabled:
        type: object
        properties:
          to:
            type: boolean
        required:
          - to
  enterprise:
    $ref: '../enterprise-webhooks.yaml'
  installation:
    $ref: '../simple-installation.yaml'
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
required:
  - action
  - changes
  - repository
  - sender
