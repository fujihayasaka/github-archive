---
type: object
properties:
  credits:
    type: array
    items:
      type: object
      properties:
        description:
          type: string
          description: A description of the credit and product that it applies to.
          example: "Included Actions minutes"
        type:
          type: string
          description: The type of credit being applied.
          example: "included_usage"
        target_amount:
          type: number
          description: The total amount of credit granted in USD.
          example: 24.00
        current_amount:
          type: number
          description: The current amount of credit applied in USD.
          example: 8.00
        is_fully_applied:
          type: boolean
          description: Whether this credit has been fully applied.
          example: false
      required:
        - description
        - type
        - target_amount
        - current_amount
        - is_fully_applied
