---
title: Self hosted runners
description: A self hosted runner
type: object
properties:
  id:
    description: The ID of the runner.
    type: integer
    example: 5
  runnerGroupId:
    description: The ID of the runner group.
    type: integer
    example: 1
  scaleSetId:
    description: The ID of the scaleset this runner belongs to.
    type: integer
    example: 1
  name:
    description: The name of the runner.
    type: string
    example: iMac
  status:
    description: The status of the runner.
    type: string
    example: online
  ephemeral:
    type: boolean
