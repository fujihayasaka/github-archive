---
# Used in api.github.com: dependabot/list-alerts-for-org
type: object
description: A Dependabot alert.
properties:
  number:
    $ref: './alert-number.yaml'
  state:
    type: string
    description: The state of the Dependabot alert.
    readOnly: true
    enum:
      - auto_dismissed
      - dismissed
      - fixed
      - open
  dependency:
    type: object
    description: Details for the vulnerable dependency.
    readOnly: true
    properties:
      package:
        $ref: './dependabot-alert-package.yaml'
      manifest_path:
        type: string
        description: The full path to the dependency manifest file, relative to the root of the repository.
        readOnly: true
      scope:
        type: string
        description: The execution scope of the vulnerable dependency.
        readOnly: true
        nullable: true
        enum:
          - development
          - runtime
      relationship:
        type: string
        description: |
          The vulnerable dependency's relationship to your project.

          > [!NOTE]
          > We are rolling out support for dependency relationship across ecosystems. This value will be "unknown" for all dependencies in unsupported ecosystems.
        readOnly: true
        nullable: true
        enum:
          - unknown
          - direct
          - transitive
          - inconclusive
  security_advisory:
    $ref: './dependabot-alert-security-advisory.yaml'
  security_vulnerability:
    $ref: './dependabot-alert-security-vulnerability.yaml'
  url:
    $ref: './alert-url.yaml'
  html_url:
    $ref: './alert-html-url.yaml'
  created_at:
    $ref: './alert-created-at.yaml'
  updated_at:
    $ref: './alert-updated-at.yaml'
  dismissed_at:
    $ref: './alert-dismissed-at.yaml'
  dismissed_by:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  dismissed_reason:
    type: string
    description: The reason that the alert was dismissed.
    nullable: true
    enum:
      - fix_started
      - inaccurate
      - no_bandwidth
      - not_used
      - tolerable_risk
  dismissed_comment:
    type: string
    description: An optional comment associated with the alert's dismissal.
    nullable: true
    maxLength: 280
  fixed_at:
    $ref: './alert-fixed-at.yaml'
  auto_dismissed_at:
    $ref: './alert-auto-dismissed-at.yaml'
  dismissal_request:
    $ref: './dependabot-alert-dismissal-request-simple.yaml'
  assignees:
    type: array
    description: The users assigned to this alert.
    readOnly: true
    items:
      $ref: './simple-user.yaml'
  visibility_scope:
    type: string
    description: The visibility scope of the vulnerability that triggered the alert.
    readOnly: true
    x-unpublished: Unpublished until the innersource_alerting feature flag ships
    enum:
      - open_source
      - innersource
  external_id:
    type: string
    description: An external identifier for the vulnerability, used for innersource vulnerabilities synced from external systems.
    readOnly: true
    nullable: true
    x-unpublished: Unpublished until the innersource_alerting feature flag ships
  repository:
    $ref: './simple-repository.yaml'
required:
  - number
  - state
  - dependency
  - security_advisory
  - security_vulnerability
  - url
  - html_url
  - created_at
  - updated_at
  - dismissed_at
  - dismissed_by
  - dismissed_reason
  - dismissed_comment
  - fixed_at
  - repository
additionalProperties: false
# Dependency relationships will not be available via the API in GHES
# until Dependency Graph Platform ships to enterprise, which is not
# scheduled for now, so we always omit this field
x-githubEnterpriseOverlays:
  "*":
    properties:
      dependency:
        properties:
          relationship:
  '< 3.21':
    properties:
      assignees:
