---
title: Copilot Direct Data Access
description: Copilot usage report via direct data access for a given day.
type: object
properties:
  date:
    type: string
    format: date
    description: The date for which the user engagement is aggregated, in `YYYY-MM-DD` format.
  blob_uris:
    type: array
    description: The signed URI(s) to the blob(s) containing the Copilot data report.
    items:
      type: string
required:
  - date
  # there maybe instances where we don't have a blob_uri, i.e. report is not generated yet
additionalProperties: true
