---
description: Code quality finding
type: object
properties:
  number:
    description: The finding number.
    type: integer
  state:
    description: State of the code quality finding.
    type: string
    enum:
      - open
      - dismissed
  url:
    description: The REST API URL of the code quality finding resource.
    type: string
    format: uri
  rule:
    $ref: './code-quality-finding-rule.yaml'
  location:
    $ref: './code-quality-finding-location.yaml'
  message:
    $ref: './code-quality-finding-message.yaml'
  created_at:
    description: The time the code quality finding was created.
    type: string
    format: date-time
required:
  - number
  - state
  - url
  - rule
  - location
  - message
