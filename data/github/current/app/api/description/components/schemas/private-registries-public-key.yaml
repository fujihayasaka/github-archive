---
title: PrivateRegistriesPublicKey
description: The public key used for setting private registry secrets.
type: object
properties:
  key_id:
    description: The identifier for the key.
    example: '012345678912345678'
    type: string
  key:
    description: The Base64 encoded public key.
    example: '2Sg8iYjAxxmI2LvUXpJjkYrMxURPc8r+dB7TJyvv1234'
    type: string
required:
  - key
  - key_id
