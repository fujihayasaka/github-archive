---
title: Artifact Deployment Record
description: Artifact Metadata Deployment Record
type: object
properties:
  id:
    type: integer
  digest:
    type: string
  logical_environment:
    type: string
  physical_environment:
    type: string
  cluster:
    type: string
  deployment_name:
    type: string
  tags:
    type: object
    additionalProperties:
      type: string
  runtime_risks:
    type: array
    description: A list of runtime risks associated with the deployment.
    maxItems: 4
    uniqueItems: true
    items:
      type: string
      enum:
        - critical-resource
        - internet-exposed
        - lateral-movement
        - sensitive-data
  created_at:
    type: string
  updated_at:
    type: string
  attestation_id:
    type: integer
    description: The ID of the provenance attestation associated with the deployment record.
    nullable: true
