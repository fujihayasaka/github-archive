---
description: Configuration for code scanning default setup.
type: object
properties:
  state:
    description: Code scanning default setup has been configured or not.
    type: string
    enum:
      - configured
      - not-configured
  languages:
    description: Languages to be analyzed.
    type: array
    items:
      type: string
      enum:
        - actions
        - c-cpp
        - csharp
        - go
        - java-kotlin
        - javascript-typescript
        - javascript
        - python
        - ruby
        - typescript
        - swift
  runner_type:
    description: Runner type to be used.
    nullable: true
    type: string
    enum:
      - standard
      - labeled
  runner_label:
    description: Runner label to be used if the runner type is labeled.
    nullable: true
    type: string
    example: 'code-scanning'
  query_suite:
    description: CodeQL query suite to be used.
    type: string
    enum:
      - default
      - extended
  threat_model:
    description: Threat model to be used for code scanning analysis. Use `remote` to analyze only network sources and `remote_and_local` to include local sources like filesystem access, command-line arguments, database reads, environment variable and standard input.
    type: string
    enum:
      - remote
      - remote_and_local
  updated_at:
    description: Timestamp of latest configuration update.
    nullable: true
    type: string
    format: date-time
    example: '2023-12-06T14:20:20.000Z'
  schedule:
    description: The frequency of the periodic analysis.
    nullable: true
    type: string
    enum:
      - weekly
x-githubEnterpriseOverlays:
  '<3.18':
    properties:
      threat_model:
  '<3.11':
    properties:
      schedule:
  '<3.16':
    properties:
      runner_type:
      runner_label:
x-github-breaking-changes:
  - changeset: remove_single_js_ts
    patch:
      properties:
        languages:
          items:
            enum:
              - c-cpp
              - csharp
              - go
              - java-kotlin
              - javascript-typescript
              - python
              - ruby
              - swift
