---
title: Organization private registry
description: Private registry configuration for an organization
type: object
properties:
  name:
    description: The name of the private registry configuration.
    example: MAVEN_REPOSITORY_SECRET
    type: string
  registry_type:
    description: The registry type.
    enum:
    - maven_repository
    - nuget_feed
    - goproxy_server
    - npm_registry
    - rubygems_server
    - cargo_registry
    - composer_repository
    - docker_registry
    - git_source
    - helm_registry
    - hex_organization
    - hex_repository
    - pub_repository
    - python_index
    - terraform_registry
    type: string
  auth_type:
    description: The authentication type for the private registry.
    enum:
      - token
      - username_password
      - oidc_azure
      - oidc_aws
      - oidc_jfrog
      - oidc_cloudsmith
      - oidc_gcp
    type: string
  url:
    description: The URL of the private registry.
    type: string
    format: uri
  username:
    description: The username to use when authenticating with the private registry.
    example: monalisa
    type: string
  replaces_base:
    description: >-
      Whether this private registry replaces the base registry (e.g., npmjs.org for npm, rubygems.org for rubygems).
      When `true`, Dependabot will only use this registry and will not fall back to the public registry.
      When `false` (default), Dependabot will use this registry for scoped packages but may fall back to the public registry for other packages.
    type: boolean
    default: false
  visibility:
    description: >-
      Which type of organization repositories have access to the private registry.
      `selected` means only the repositories specified by `selected_repository_ids` can access the private registry.
    enum:
      - all
      - private
      - selected
    type: string
  selected_repository_ids:
    type: array
    description: >-
      An array of repository IDs that can access the organization private registry when `visibility` is set to `selected`.
    items:
      type: integer
  tenant_id:
    description: The tenant ID of the Azure AD application.
    type: string
  client_id:
    description: The client ID of the Azure AD application.
    type: string
  aws_region:
    description: The AWS region.
    type: string
  account_id:
    description: The AWS account ID.
    type: string
  role_name:
    description: The AWS IAM role name.
    type: string
  domain:
    description: The CodeArtifact domain.
    type: string
  domain_owner:
    description: The CodeArtifact domain owner.
    type: string
  jfrog_oidc_provider_name:
    description: The JFrog OIDC provider name.
    type: string
  audience:
    description: The OIDC audience.
    type: string
  identity_mapping_name:
    description: The JFrog identity mapping name.
    type: string
  namespace:
    description: The Cloudsmith organization namespace.
    type: string
  service_slug:
    description: The Cloudsmith service account slug.
    type: string
  api_host:
    description: The Cloudsmith API host.
    type: string
  workload_identity_provider:
    description: The full resource name of the GCP Workload Identity Provider (e.g. `projects/<NUM>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>`).
    type: string
  service_account:
    description: The GCP service account email to impersonate. If omitted, the federated token is used directly (direct WIF).
    type: string
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- name
- registry_type
- visibility
- created_at
- updated_at
