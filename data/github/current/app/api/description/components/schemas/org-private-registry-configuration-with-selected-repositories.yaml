---
title: Organization private registry
description: Private registry configuration for an organization
type: object
properties:
  name:
    description: The name of the private registry configuration.
    example: MAVEN_REPOSITORY_SECRET
    type: string
  registry_type:
    description: The registry type.
    enum:
    - maven_repository
    - nuget_feed
    - goproxy_server
    type: string
  username:
    description: The username to use when authenticating with the private registry.
    example: monalisa
    type: string
  visibility:
    description: >-
      Which type of organization repositories have access to the private registry.
      `selected` means only the repositories specified by `selected_repository_ids` can access the private registry.
    enum:
      - all
      - private
      - selected
    type: string
  selected_repository_ids:
    type: array
    description: >-
      An array of repository IDs that can access the organization private registry when `visibility` is set to `selected`.
    items:
      type: integer
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
required:
- name
- registry_type
- visibility
- created_at
- updated_at
