---
title: GitHub app
description: GitHub apps are a new way to extend GitHub. They can be installed directly
  on organizations and user accounts and granted access to specific repositories.
  They come with granular permissions and built-in webhooks. GitHub apps are first
  class actors within GitHub.
type: object
nullable: true
properties:
  id:
    description: Unique identifier of the GitHub app
    example: 37
    type: integer
  slug:
    description: The slug name of the GitHub app
    example: probot-owners
    type: string
  node_id:
    type: string
    example: MDExOkludGVncmF0aW9uMQ==
  client_id:
    type: string
    example: '"Iv1.25b5d1e65ffc4022"'
  owner:
    oneOf:
      - $ref: './simple-user.yaml'
      - $ref: './enterprise.yaml'
    x-nullable-ref: true
  name:
    description: The name of the GitHub app
    example: Probot Owners
    type: string
  description:
    type: string
    example: The description of the app.
    nullable: true
  external_url:
    type: string
    format: uri
    example: https://example.com
  html_url:
    type: string
    format: uri
    example: https://github.com/apps/super-ci
  created_at:
    type: string
    format: date-time
    example: '2017-07-08T16:18:44-04:00'
  updated_at:
    type: string
    format: date-time
    example: '2017-07-08T16:18:44-04:00'
  permissions:
    description: The set of permissions for the GitHub app
    type: object
    properties:
      issues:
        type: string
      checks:
        type: string
      metadata:
        type: string
      contents:
        type: string
      deployments:
        type: string
    additionalProperties:
      type: string
    example:
      issues: read
      deployments: write
  events:
    description: The list of events for the GitHub app. Note that the `installation_target`, `security_advisory`, and `meta` events are not included because they are global events and not specific to an installation.
    example:
      - label
      - deployment
    type: array
    items:
      type: string
  installations_count:
    description: The number of installations associated with the GitHub app. Only returned when the integration is requesting details about itself.
    example: 5
    type: integer
required:
  - id
  - node_id
  - owner
  - name
  - description
  - external_url
  - html_url
  - created_at
  - updated_at
  - permissions
  - events
x-githubEnterpriseOverlays:
  '< 3.15':
    properties:
      client_id:
