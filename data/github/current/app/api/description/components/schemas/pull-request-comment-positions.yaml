---
title: Pull Request Comment Positions
description: Data describing the positions of comments within a Git diff.
x-unpublished: true
anyOf:
  - type: object
    description: "The position of a comment targeting an entire file."
    properties:
      type:
        type: string
        enum: ["FILE"]
      path:
        type: string
        description: "Path of the file."
        example: "README.md"
      commit_oid:
        type: string
        description: "Commit OID of the file."
        example: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
  - type: object
    description: "The position of a comment targeting a single line."
    properties:
      type:
        type: string
        enum: ["LINE"]
      line:
        type: integer
        description: "Line number of the file."
        example: 5
      path:
        type: string
        description: "Path of the file."
        example: "README.md"
      commit_oid:
        type: string
        description: "Commit OID of the file."
        example: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
  - type: object
    description:
      The position of a comment targeting a span of lines. Multiple lines can cover additions and deletions of a diff and so the start and end can reference either side of a diff.
    properties:
      type:
        type: string
        enum: ["MULTILINE"]
      start_line:
        type: integer
        description: "Line number of the file that begins the comment range."
        example: 1
      end_line:
        type: integer
        description: "Line number of the file that ends the comment range."
        example: 5
      start_path:
        type: string
        description: "Path of the file that begins the comment range."
        example: "README.md"
      end_path:
        type: string
        description: "Path of the file that ends the comment range."
        example: "README.md"
      start_commit_oid:
        type: string
        description: "Commit OID of the file that begins the comment range."
        example: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
      end_commit_oid:
        type: string
        description: "Commit OID of the file that ends the comment range."
        example: "6dcb09b5b57875f334f61aebed695e2e4193db5e"
  - type: object
    description: "Position cannot be determined for the requested diff range or current git graph"
    properties:
      type:
        type: string
        enum: ["INDETERMINATE"]
      reason:
        type: string
        description: "The reason the position is indeterminate."
  - type: object
    description: "An unknown error occured determining the position."
    properties:
      type:
        type: string
        enum: ["ERRORED"]
