---
type: object
properties:
  message:
    type: string
    description: A message indicating the result of the update operation
  budget:
    type: object
    properties:
      id:
        type: string
        description: ID of the budget.
      budget_scope:
        type: string
        description: The type of scope for the budget
        example: "enterprise"
        enum:
          - enterprise
          - organization
          - repository
          - cost_center
      budget_entity_name:
        type: string
        description: The name of the entity to apply the budget to
        example: "example-repository-name"
      budget_amount:
        type: integer
        description: The budget amount in whole dollars. For license-based products, this represents the number of licenses.
        example: 100
        minimum: 0
      prevent_further_usage:
        type: boolean
        description: Whether to prevent additional spending once the budget is exceeded
        example: true
      budget_product_sku:
        type: string
        description: A single product or sku to apply the budget to.
        example: "actions_linux"
      budget_type:
        description: The type of pricing for the budget
        example: "ProductPricing"
        oneOf:
          - type: string
            enum:
              - ProductPricing
          - type: string
            enum:
              - SkuPricing
          - type: string
            enum:
              - BundlePricing
            x-unpublished: "Tracked by https://github.com/github/gitcoin/issues/24902"
      budget_alerting:
        type: object
        properties:
          will_alert:
            type: boolean
            description: Whether alerts are enabled for this budget
            example: true
          alert_recipients:
            type: array
            items:
              type: string
            description: Array of user login names who will receive alerts
            example: ["mona", "lisa"]
      exclude_cost_center_usage:
        type: boolean
        description: Whether to exclude cost center usage from the budget (enterprise scope only)
        example: false
        x-unpublished: Feature is in development and not yet ready for public documentation
required:
  - budget
  - message
