---
title: Copilot Enterprise Details
description: Information about the seat breakdown and policies set for an enterprise with a Copilot Business or Copilot Enterprise subscription.
type: object
properties:
  seat_breakdown:
    $ref: './copilot-enterprise-seat-breakdown.yaml'
  public_code_suggestions:
    type: string
    description: The enterprise policy for allowing or blocking suggestions matching public code (duplication detection filter).
    enum:
      - allow
      - block
      - unconfigured
      - no_policy
  ide_chat:
    type: string
    description: The enterprise policy for allowing or disallowing Copilot Chat in the IDE.
    enum:
      - enabled
      - disabled
      - unconfigured
      - no_policy
  platform_chat:
    type: string
    description: The enterprise policy for allowing or disallowing Copilot features on GitHub.com.
    enum:
      - enabled
      - disabled
      - unconfigured
      - no_policy
  cli:
    type: string
    description: The enterprise policy for allowing or disallowing Copilot CLI.
    enum:
      - enabled
      - disabled
      - unconfigured
      - no_policy
  copilot_enablement:
    description: Policy for allowing or disallowing Copilot for all or selected organizations, or for enabling or disabling Copilot for the enterprise on a Copilot Business only account.
    oneOf:
      - type: string
        enum:
          - all_organizations
        description: "Copilot is enabled for all organizations within the enterprise."
      - type: string
        enum:
          - selected_organizations
        description: "Copilot is enabled for selected organizations within the enterprise."
      - type: string
        enum:
          - disabled
        description: "Copilot is disabled for all organizations; or is disabled for the enterprise if the account is a Copilot Business only account"
      - type: string
        enum:
          - enabled
        description: "Copilot is enabled for the enterprise (only applies to Copilot Business only accounts)."
      - type: string
        enum:
          - unconfigured
        description: "Copilot has not been configured for the enterprise yet."
required:
  - seat_breakdown
  - public_code_suggestions
  - copilot_enablement
# before features are publicly released we will want to be able to add them here (e.g. copilot_chat)
# so that customers in those feature flags can see them but we don't break the contract. Once we enable the feature for everyone
# we'll want to formally add it to the schema.
additionalProperties: true
