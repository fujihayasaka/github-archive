---
title: Copilot Enterprise Details
description: Information about the seat breakdown and policies set for an enterprise with a Copilot Business or Copilot Enterprise subscription.
type: object
properties:
  seat_breakdown:
    $ref: './copilot-seat-breakdown.yaml'
  public_code_suggestions:
    type: string
    description: The enterprise policy for allowing or disallowing Copilot to make suggestions that match public code.
    enum:
      - allow
      - block
      - unconfigured
      - unknown
  ide_chat:
    type: string
    description: The enterprise policy for allowing or disallowing enterprise members to use Copilot Chat within their editor.
    enum:
      - enabled
      - disabled
      - unconfigured
  platform_chat:
    type: string
    description: The enterprise policy for allowing or disallowing enterprise members to use Copilot features within github.com.
    enum:
      - enabled
      - disabled
      - unconfigured
  cli:
    type: string
    description: The enterprise policy for allowing or disallowing enterprise members to use Copilot within their CLI.
    enum:
      - enabled
      - disabled
      - unconfigured
  copilot_enablement:
    description: Policy for allowing or disallowing Copilot for all or selected organizations, or for enabling or disabling Copilot for the enterprise on a Copilot Business only account.
    oneOf:
      - type: string
        enum:
          - allow_for_all
        description: "Copilot is allowed for all organizations within the enterprise."
      - type: string
        enum:
          - allow_for_selected
        description: "Copilot is allowed for selected organizations within the enterprise."
      - type: string
        enum:
          - disabled
        description: "Copilot is disabled for all organizations; or is disabled for the enterprise if the account is Copilot Business only"
      - type: string
        enum:
          - enabled
        description: "Copilot is enabled for the enterprise.  This only applies to Copilot Business only accounts"
  plan_type:
    type: string
    description: The Copilot plan of the organization, or the parent enterprise, when applicable.
    enum:
      - business
      - enterprise
      - unknown
required:
  - seat_breakdown
  - public_code_suggestions
  - copilot_enablement
# before features are publicly released we will want to be able to add them here (e.g. copilot_chat)
# so that customers in those feature flags can see them but we don't break the contract. Once we enable the feature for everyone
# we'll want to formally add it to the schema.
additionalProperties: true
