---
title: Actions data stream sink test result
description: The result of testing connectivity to a data stream sink destination.
type: object
properties:
  success:
    description: Whether the test connection succeeded.
    type: boolean
  error_message:
    description: Error detail if the test failed.
    type: string
  status_code:
    description: HTTP status code returned by the sink endpoint, or 0 if not applicable.
    type: integer
  latency_ms:
    description: Round-trip time for the delivery attempt in milliseconds.
    type: integer
    format: int64
required:
- success
