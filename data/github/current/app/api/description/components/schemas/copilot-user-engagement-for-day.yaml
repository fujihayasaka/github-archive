---
title: Copilot User Engagement
description: Copilot user engagement for a given day.
type: object
properties:
  date:
    type: string
    format: date
    description: The date for which the user engagement is aggregated, in `YYYY-MM-DD` format.
  blob_uri:
    type: string
    description: The signed URI to the blob containing the user engagement data report.
required:
  - date
  # there maybe instances where we don't have a blob_uri, i.e. report is not generated yet
additionalProperties: true
