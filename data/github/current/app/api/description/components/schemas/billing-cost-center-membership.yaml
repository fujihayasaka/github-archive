---
type: object
properties:
  resource:
    type: object
    properties:
      type:
        type: string
        enum:
        - user
        - organization
        - repository
        description: The type of resource.
      identifier:
        type: object
        oneOf:
        - properties:
            login:
              type: string
              description: The login name for a user.
          required:
          - login
          additionalProperties: false
        - properties:
            name:
              type: string
              description: The name for an organization.
          required:
          - name
          additionalProperties: false
        - properties:
            owner:
              type: string
              description: The owner of the repository.
            name:
              type: string
              description: The name of the repository.
          required:
          - owner
          - name
          additionalProperties: false
        description: The identifier for the resource.
    required:
    - type
    - identifier
  memberships:
    type: array
    items:
      type: object
      properties:
        cost_center:
          type: object
          properties:
            id:
              type: string
              description: The unique identifier of the cost center.
            name:
              type: string
              description: The name of the cost center.
          required:
          - id
          - name
    description: The list of cost center memberships for the resource.
required:
- resource
- memberships
