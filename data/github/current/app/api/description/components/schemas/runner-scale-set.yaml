---
title: Runner Scale Set
description: A Runner Scale Set
type: object
properties:
  id:
    description: The id of the Scale Set.
    type: integer
    example: 5
  name:
    description: The name of the Scale Set.
    type: string
    example: My Scale Set
  runnerGroupId:
    description: The ID of the runner group.
    type: integer
    example: 1
  runnerGroupName:
    description: The name of the runner group.
    type: integer
    example: My Group
  labels:
    type: array
    items:
      $ref: "./runner-scale-set-label.yaml"
  runnerSetting:
    $ref: "./runner-scale-set-runner-setting.yaml"
  createdAt:
    type: string
    format: date-time
required:
  - runnerGroupId
  - name
