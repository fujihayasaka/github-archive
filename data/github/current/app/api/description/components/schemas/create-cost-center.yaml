---
type: object
properties:
  name:
    type: string
    description: "The name of the cost center."
    example: "New Cost Center"
  id:
    type: string
    description: "The unique identifier of the cost center."
    example: "testUUID"
  azure_subscription:
    type: string
    nullable: true
    description: Azure subscription ID associated with the cost center. Only present for cost centers linked to Azure subscriptions.
  state:
    type: string
    description: State of the cost center.
    enum:
      - active
      - deleted
  resources:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          description: "The type of the resource."
          example: "user"
        id:
          type: string
          description: "The ID of the resource."
          example: "12345"
