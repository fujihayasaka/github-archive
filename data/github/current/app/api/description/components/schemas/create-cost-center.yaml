---
type: object
properties:
  name:
    type: string
    description: "The name of the cost center."
    example: "New Cost Center"
  id:
    type: string
    description: "The unique identifier of the cost center."
    example: "testUUID"
  resources:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
          description: "The type of the resource."
          example: "user"
        id:
          type: string
          description: "The ID of the resource."
          example: "12345"
