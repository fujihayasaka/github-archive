---
title: Issue Event Detail
description: Detailed attributes of the issue event
type: object
properties:
  label_url:
    type: string
    format: uri
    description: URL for the label
  label_name:
    type: string
    description: Name of the label
  label_color:
    type: string
    description: Color of the label
  label_text_color:
    type: string
    description: Text color of the label
  milestone_url:
    type: string
    format: uri
    description: URL for the milestone
  subject:
    type: object
    description: Subject of the event
    properties:
      id:
        type: integer
        description: ID of the subject
      type:
        type: string
        description: Type of the subject
    required:
      - id
      - type
  title_was:
    type: string
    description: Previous title
  title_is:
    type: string
    description: Current title
  deployment_id:
    type: integer
    description: ID of the deployment
  deployment_status_id:
    type: integer
    description: ID of the deployment status
  ref:
    type: string
    description: Git reference
  before_commit_oid:
    type: string
    description: Commit OID before the change
  after_commit_oid:
    type: string
    description: Commit OID after the change
  message:
    type: string
    description: Message associated with the event
  pull_request_review_url:
    type: string
    format: uri
    description: URL for the pull request review
  pull_request_review_state_was:
    type: string
    description: Previous state of the pull request review
  review_request:
    type: integer
    description: Review request ID
  column_name:
    type: string
    description: Name of the project column
  previous_column_name:
    type: string
    description: Previous name of the project column
  card_id:
    type: integer
    description: ID of the project card
  performed_by_project_workflow_action_id:
    type: integer
    description: ID of the project workflow action that performed this event
  lock_reason:
    type: string
    description: Reason for locking
  block_duration_days:
    type: integer
    description: Duration of the block in days
  state_reason:
    type: string
    description: Reason for the state change
  project_status:
    type: string
    description: Current project status
  project_previous_status:
    type: string
    description: Previous project status
  issue_type:
    $ref: './issue-type-webhook.yaml'
  prev_issue_type:
    $ref: './issue-type-webhook.yaml'
  trigger_source_url:
    type: string
    format: uri
    description: URL of the trigger source
  trigger_source_type:
    type: string
    description: Type of the trigger source
