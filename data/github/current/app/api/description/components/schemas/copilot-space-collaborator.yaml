---
title: Copilot Space Collaborator
description: A collaborator (user or team) of a Copilot Space
type: object
anyOf:
  - allOf:
      - $ref: './simple-user.yaml'
      - type: object
        properties:
          actor_type:
            type: string
            enum: [User]
            description: The collaborator actor type.
          role:
            type: string
            enum: [reader, writer, admin]
            description: The role granted to the collaborator
        required:
          - actor_type
          - role
  - type: object
    properties:
      actor_type:
        type: string
        enum: [Team]
        description: The collaborator actor type.
      role:
        type: string
        enum: [reader, writer, admin]
        description: The role granted to the collaborator
      id:
        type: integer
      node_id:
        type: string
      name:
        type: string
      slug:
        type: string
      type:
        type: string
        enum: [Team]
      description:
        type: string
        nullable: true
      privacy:
        type: string
      notification_setting:
        type: string
      url:
        type: string
        format: uri
      html_url:
        type: string
        format: uri
      members_url:
        type: string
      repositories_url:
        type: string
        format: uri
      organization_id:
        type: integer
      parent:
        nullable: true
    required:
      - actor_type
      - role
      - id
      - node_id
      - name
      - slug
      - type
