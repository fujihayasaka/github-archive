---
title: Copilot Space Collaborator
description: A collaborator (user or team) of a Copilot Space
type: object
anyOf:
  - allOf:
      - $ref: './simple-user.yaml'
      - type: object
        properties:
          role:
            type: string
            enum: [reader, writer, admin]
            description: The role granted to the collaborator
        required:
          - role
  - allOf:
      - $ref: './team.yaml'
      - type: object
        properties:
          role:
            type: string
            enum: [reader, writer, admin]
            description: The role granted to the collaborator
        required:
          - role
