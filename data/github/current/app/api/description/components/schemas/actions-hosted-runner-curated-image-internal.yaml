---
title: GitHub-hosted runner image details (Internal).
description: Provides details of a hosted runner image
type: object
properties:
  id:
    description: The ID of the image.
    type: integer
    example: 5
  name:
    description: The name of the image
    type: string
    example: Base Image for Ubuntu Server 20.04
  owner_id:
    description: The owner ID of the image.
    type: string
    example: "github"
  latest_version:
    description: The latest version of the image.
    type: string
    example: "1.0.0"
required:
  - id
  - name
  - owner_id
  - latest_version
