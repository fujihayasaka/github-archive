---
title: Enterprise Migration State Breakdown Entry
description: A breakdown entry for migration nodes grouped by state, kind, type, and origin.
type: object
properties:
  state:
    type: string
    description: Node state.
    example: "NODE_STATE_ACKNOWLEDGED"
  kind:
    type: string
    description: Node kind.
    example: "NODE_KIND_RESOURCE"
  type:
    type: string
    description: Node type.
    example: "issue"
  count:
    type: integer
    format: int64
    description: Number of nodes in this breakdown item.
    example: 10
  origin:
    type: string
    description: Node origin.
    example: "NODE_ORIGIN_BACKFILL"
