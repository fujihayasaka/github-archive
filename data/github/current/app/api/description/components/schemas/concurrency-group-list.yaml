---
title: Concurrency Group List
description: A list of active concurrency groups for a repository.
type: object
required:
- total_count
- concurrency_groups
properties:
  total_count:
    type: integer
  concurrency_groups:
    type: array
    items:
      type: object
      required:
      - group_name
      - group_url
      - last_acquired_at
      properties:
        group_name:
          type: string
          description: The name of the concurrency group.
        group_url:
          type: string
          format: uri
          description: API URL for this concurrency group.
        last_acquired_at:
          type: string
          format: date-time
          nullable: true
