---
title: Ruleset version
type: object
description: The historical version of a ruleset
required:
  - version_id
  - actor
  - updated_at
properties:
  version_id:
    type: integer
    description: The ID of the previous version of the ruleset
  actor:
    type: object
    description: The actor who updated the ruleset
    properties:
      id:
        type: integer
      type:
        type: string
  updated_at:
    type: string
    format: date-time
