---
type: object
properties:
  download_id:
    type: string
    description: The unique identifier for the download request.
  package_name:
    type: string
    description: The filename of the upgrade package.
  status:
    type: string
    description: 'Overall download status. One of: `not_started`, `downloading`, `completed`, `failed`.'
    enum:
      - not_started
      - downloading
      - completed
      - failed
  error_message:
    type: string
    description: An error message if the download failed.
  nodes:
    type: array
    description: Per-node download status details.
    items:
      type: object
      properties:
        hostname:
          type: string
          description: The hostname of the node.
        uuid:
          type: string
          description: The UUID of the node.
        download_id:
          type: string
          description: The download request identifier.
        package_name:
          type: string
          description: The upgrade package filename.
        status:
          type: string
          description: 'The per-node download status. One of: `not_started`, `downloading`, `completed`, `failed`.'
          enum:
            - not_started
            - downloading
            - completed
            - failed
        progress:
          type: string
          description: A progress indicator (e.g. `50%`).
        error:
          type: string
          description: An error message if the node download failed.
  orchestration:
    type: object
    description: Gateway-side orchestration status. Present while a throttled orchestration is active, or while a terminal orchestration snapshot is still retained.
    properties:
      phase:
        type: string
        description: 'Gateway orchestration phase. One of: `running`, `completed`, `failed`.'
        enum:
          - running
          - completed
          - failed
      error_message:
        type: string
        description: Error message for the orchestration when it failed.
      max_parallel:
        type: integer
        description: Effective maximum number of nodes downloading at the same time.
      queued:
        type: integer
        description: Number of targeted nodes waiting to start.
      in_flight:
        type: integer
        description: Number of targeted nodes currently downloading.
      completed:
        type: integer
        description: Number of targeted nodes that completed.
      failed:
        type: integer
        description: Number of targeted nodes that failed.
      total:
        type: integer
        description: Total number of targeted nodes.
