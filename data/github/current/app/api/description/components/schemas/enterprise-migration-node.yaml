---
title: Enterprise Migration Node
description: A migration node representing a resource, event, or git object being migrated.
type: object
properties:
  id:
    type: string
    description: The unique identifier for the node
    example: "node-123"
  kind:
    type: string
    description: The kind of node (e.g. resource, event, git)
    enum:
    - NODE_KIND_INVALID
    - NODE_KIND_RESOURCE
    - NODE_KIND_EVENT
    - NODE_KIND_GIT
    example: "NODE_KIND_RESOURCE"
  type:
    type: string
    description: The type of the node (e.g. repo, issue, issue_comment)
    example: "issue"
  origin:
    type: string
    description: The origin of the node (backfill, live_update, unknown). Nodes from live_update can still be of kind resource as they might be new resources created from live webhook events.
    enum:
    - NODE_ORIGIN_UNKNOWN
    - NODE_ORIGIN_BACKFILL
    - NODE_ORIGIN_LIVE_UPDATE
    example: "NODE_ORIGIN_BACKFILL"
  state:
    type: string
    description: The state of the node (e.g. pending, processed, failed)
    enum:
    - NODE_STATE_UNKNOWN
    - NODE_STATE_PENDING
    - NODE_STATE_ACKNOWLEDGED
    - NODE_STATE_PROCESSED
    - NODE_STATE_BLOCKED
    - NODE_STATE_FAILED
    example: "NODE_STATE_PENDING"
  error:
    type: string
    description: The error message if the node is in a failed state
    example: "Failed to process resource"
  created_at:
    type: string
    format: date-time
    description: Timestamp when the node was created
    example: "2024-01-01T00:00:00Z"
  updated_at:
    type: string
    format: date-time
    description: Timestamp when the node was last updated
    example: "2024-01-01T00:05:00Z"
required:
- id
- kind
- type
- origin
- state
- created_at
- updated_at
