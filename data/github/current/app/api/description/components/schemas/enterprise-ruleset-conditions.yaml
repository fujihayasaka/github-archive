---
title: Enterprise ruleset conditions
type: object
description: >-
  Conditions for an enterprise ruleset.

  The `conditions` object supports either of the following combinations:
  - `organization_id` and `repository_name`
  - `organization_id` and `repository_property`
  - `organization_name` and `repository_name`
  - `organization_name` and `repository_property`
  - `organization_property` and `repository_name`
  - `organization_property` and `repository_property`

  For branch and tag rulesets, the `conditions` object should also contain the `ref_name` property.
oneOf:
  - type: object
    title: organization_name_and_repository_name
    description: Conditions to target organizations by name and all repositories
    allOf:
    - $ref: 'enterprise-ruleset-conditions-organization-name-target.yaml'
    - $ref: 'repository-ruleset-conditions-repository-name-target.yaml'
    - $ref: 'repository-ruleset-conditions.yaml'
  - type: object
    title: organization_name_and_repository_property
    description: Conditions to target organizations by name and repositories by property
    allOf:
    - $ref: 'enterprise-ruleset-conditions-organization-name-target.yaml'
    - $ref: 'repository-ruleset-conditions-repository-property-target.yaml'
    - $ref: 'repository-ruleset-conditions.yaml'
  - type: object
    title: organization_id_and_repository_name
    description: Conditions to target organizations by id and all repositories
    allOf:
    - $ref: 'enterprise-ruleset-conditions-organization-id-target.yaml'
    - $ref: 'repository-ruleset-conditions-repository-name-target.yaml'
    - $ref: 'repository-ruleset-conditions.yaml'
  - type: object
    title: organization_id_and_repository_property
    description: Conditions to target organization by id and repositories by property
    allOf:
    - $ref: 'enterprise-ruleset-conditions-organization-id-target.yaml'
    - $ref: 'repository-ruleset-conditions-repository-property-target.yaml'
    - $ref: 'repository-ruleset-conditions.yaml'
  - type: object
    title: organization_property_and_repository_name
    description: Conditions to target organizations by property and all repositories
    allOf:
    - $ref: 'enterprise-ruleset-conditions-organization-property-target.yaml'
    - $ref: 'repository-ruleset-conditions-repository-name-target.yaml'
    - $ref: 'repository-ruleset-conditions.yaml'
  - type: object
    title: organization_property_and_repository_property
    description: Conditions to target organizations by property and repositories by property
    allOf:
    - $ref: 'enterprise-ruleset-conditions-organization-property-target.yaml'
    - $ref: 'repository-ruleset-conditions-repository-property-target.yaml'
    - $ref: 'repository-ruleset-conditions.yaml'
