---
type: object
# This is a modified version of secret-scanning-alert.yaml more suitable for webhooks.
# Doesn't contain properties: state, secret.
# resolution property has its own webhook version.
properties:
  number:
    $ref: './alert-number.yaml'
  created_at:
    $ref: './alert-created-at.yaml'
  updated_at:
    $ref: './alert-updated-at.yaml'
    x-nullable-ref: true
  url:
    $ref: './alert-url.yaml'
  html_url:
    $ref: './alert-html-url.yaml'
  locations_url:
    type: string
    format: uri
    description: 'The REST API URL of the code locations for this alert.'
  resolution:
    $ref: './secret-scanning-alert-resolution-webhook.yaml'
  resolved_at:
    type: string
    format: date-time
    description: 'The time that the alert was resolved in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`.'
    nullable: true
  resolved_by:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  resolution_comment:
    type: string
    description: 'An optional comment to resolve an alert.'
    nullable: true
  secret_type:
    type: string
    description: 'The type of secret that secret scanning detected.'
  secret_type_display_name:
    type: string
    description: |-
      User-friendly name for the detected secret, matching the `secret_type`.
      For a list of built-in patterns, see "[Supported secret scanning patterns](${externalDocsUrl}/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
  provider:
    type: string
    description: 'The provider of the secret that was detected.'
    nullable: true
  provider_slug:
    type: string
    description: 'The slug identifier for the provider of the secret that was detected.'
    nullable: true
  validity:
    type: string
    description: |-
      The token status as of the latest validity check.
    enum:
      - active
      - inactive
      - unknown
  push_protection_bypassed:
    type: boolean
    description: 'Whether push protection was bypassed for the detected secret.'
    nullable: true
  push_protection_bypassed_by:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  push_protection_bypassed_at:
    type: string
    format: date-time
    description: 'The time that push protection was bypassed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`.'
    nullable: true
  push_protection_bypass_request_reviewer:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  push_protection_bypass_request_reviewer_comment:
    type: string
    description: 'An optional comment when reviewing a push protection bypass.'
    nullable: true
  push_protection_bypass_request_comment:
    type: string
    description: 'An optional comment when requesting a push protection bypass.'
    nullable: true
  push_protection_bypass_request_html_url:
    type: string
    format: uri
    description: 'The URL to a push protection bypass request.'
    nullable: true
  publicly_leaked:
    type: boolean
    description: 'Whether the detected secret was publicly leaked.'
    nullable: true
  multi_repo:
    type: boolean
    description: 'Whether the detected secret was found in multiple repositories in the same organization or business.'
    nullable: true
  assigned_to:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  closure_request_comment:
    type: string
    description: 'An optional comment from the closure request author.'
    nullable: true
  closure_request_reviewer_comment:
    type: string
    description: 'An optional comment from the closure request reviewer.'
    nullable: true
  closure_request_reviewer:
    $ref: './simple-user.yaml'
    x-nullable-ref: true

x-githubEnterpriseOverlays:
  '< 3.6':
    properties:
      push_protection_bypassed:
      push_protection_bypassed_by:
      push_protection_bypassed_at:
  '< 3.8':
    properties:
      resolution_comment:
  '< 3.14':
    properties:
      secret_type_display_name:
  '< 3.16':
    properties:
      multi_repo:
      push_protection_bypass_request_reviewer:
      push_protection_bypass_request_reviewer_comment:
      push_protection_bypass_request_comment:
      push_protection_bypass_request_html_url:
  '< 3.19':
    properties:
      assigned_to:
  '< 3.22':
    properties:
      provider:
      provider_slug:
      closure_request_comment:
      closure_request_reviewer_comment:
      closure_request_reviewer:
  '*':
    properties:
      publicly_leaked:

x-github-overlays:
  - releases:
      - api.github.com
      - ghec
    patch:
      - op: add
        path: '/properties/metadata'
        value:
          $ref: './secret-scanning-alert-metadata.yaml'
