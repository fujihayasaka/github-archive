---
type: object
properties:
  number:
    $ref: './alert-number.yaml'
  created_at:
    $ref: './alert-created-at.yaml'
  updated_at:
    $ref: './alert-updated-at.yaml'
    x-nullable-ref: true
  url:
    $ref: './alert-url.yaml'
  html_url:
    $ref: './alert-html-url.yaml'
  locations_url:
    type: string
    format: uri
    description: 'The REST API URL of the code locations for this alert.'
  state:
    $ref: './secret-scanning-alert-state.yaml'
  resolution:
    $ref: './secret-scanning-alert-resolution.yaml'
  resolved_at:
    type: string
    format: date-time
    description: 'The time that the alert was resolved in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`.'
    nullable: true
  resolved_by:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  resolution_comment:
    type: string
    description: 'An optional comment to resolve an alert.'
    nullable: true
  secret_type:
    type: string
    description: 'The type of secret that secret scanning detected.'
  secret_type_display_name:
    type: string
    description: |-
      User-friendly name for the detected secret, matching the `secret_type`.
      For a list of built-in patterns, see "[Supported secret scanning patterns](${externalDocsUrl}/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
  secret:
    type: string
    description: 'The secret that was detected.'
  push_protection_bypassed:
    type: boolean
    description: 'Whether push protection was bypassed for the detected secret.'
    nullable: true
  push_protection_bypassed_by:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  push_protection_bypassed_at:
    type: string
    format: date-time
    description: 'The time that push protection was bypassed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`.'
    nullable: true
  push_protection_bypass_request_reviewer:
    $ref: './simple-user.yaml'
    x-nullable-ref: true
  push_protection_bypass_request_reviewer_comment:
    type: string
    description: 'An optional comment when reviewing a push protection bypass.'
    nullable: true
  push_protection_bypass_request_comment:
    type: string
    description: 'An optional comment when requesting a push protection bypass.'
    nullable: true
  push_protection_bypass_request_html_url:
    type: string
    format: uri
    description: 'The URL to a push protection bypass request.'
    nullable: true
  validity:
    type: string
    description: |-
      The token status as of the latest validity check.
    enum:
      - active
      - inactive
      - unknown
  publicly_leaked:
    type: boolean
    description: 'Whether the detected secret was publicly leaked.'
    nullable: true
  multi_repo:
    type: boolean
    description: 'Whether the detected secret was found in multiple repositories under the same organization or enterprise.'
    nullable: true
  is_base64_encoded:
    type: boolean
    description: 'A boolean value representing whether or not alert is base64 encoded'
    nullable: true
  first_location_detected:
    $ref: './secret-scanning-first-detected-location.yaml'
    x-nullable-ref: true
  has_more_locations:
    type: boolean
    description: 'A boolean value representing whether or not the token in the alert was detected in more than one location.'
  assigned_to:
    # TODO: Need to copy and inline the entire user hash for unpublishing to work.
    # When publishing, remove the copied inline schema and uncomment the $ref.
    # $ref: './simple-user.yaml'
    # x-nullable-ref: true
    x-unpublished: Feature flag :secret_scanning_alert_assignee
    type: object
    nullable: true
    properties:
      name:
        nullable: true
        type: string
      email:
        nullable: true
        type: string
      login:
        type: string
        example: octocat
      id:
        type: integer
        format: int64
        example: 1
      node_id:
        type: string
        example: MDQ6VXNlcjE=
      avatar_url:
        type: string
        format: uri
        example: https://github.com/images/error/octocat_happy.gif
      gravatar_id:
        type: string
        example: '41d064eb2195891e12d0413f63227ea7'
        nullable: true
      url:
        type: string
        format: uri
        example: https://api.github.com/users/octocat
      html_url:
        type: string
        format: uri
        example: https://github.com/octocat
      followers_url:
        type: string
        format: uri
        example: https://api.github.com/users/octocat/followers
      following_url:
        type: string
        example: https://api.github.com/users/octocat/following{/other_user}
      gists_url:
        type: string
        example: https://api.github.com/users/octocat/gists{/gist_id}
      starred_url:
        type: string
        example: https://api.github.com/users/octocat/starred{/owner}{/repo}
      subscriptions_url:
        type: string
        format: uri
        example: https://api.github.com/users/octocat/subscriptions
      organizations_url:
        type: string
        format: uri
        example: https://api.github.com/users/octocat/orgs
      repos_url:
        type: string
        format: uri
        example: https://api.github.com/users/octocat/repos
      events_url:
        type: string
        example: https://api.github.com/users/octocat/events{/privacy}
      received_events_url:
        type: string
        format: uri
        example: https://api.github.com/users/octocat/received_events
      type:
        type: string
        example: User
      site_admin:
        type: boolean
      starred_at:
        type: string
        example: '"2020-07-09T00:17:55Z"'
      user_view_type:
        type: string
        example: public
x-githubEnterpriseOverlays:
  '< 3.5':
    properties:
      secret_type_display_name:
  '< 3.6':
    properties:
      push_protection_bypassed:
      push_protection_bypassed_by:
      push_protection_bypassed_at:
  '< 3.8':
    properties:
      resolution_comment:
  '< 3.12':
    properties:
      validity:
  '< 3.16':
    properties:
      multi_repo:
      push_protection_bypass_request_reviewer:
      push_protection_bypass_request_reviewer_comment:
      push_protection_bypass_request_comment:
      push_protection_bypass_request_html_url:
  '< 3.17':
    properties:
      is_base64_encoded:
  '< 3.19':
    properties:
      first_location_detected:
      has_more_locations:
      assigned_to:
  '*':
    properties:
      publicly_leaked:
