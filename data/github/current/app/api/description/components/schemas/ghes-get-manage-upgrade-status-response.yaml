---
type: array
items:
  type: object
  properties:
    hostname:
      type: string
      description: The hostname of the node.
    uuid:
      type: string
      description: The UUID of the node.
    release_version:
      type: string
      description: The current release version on the node.
    release_sha:
      type: string
      description: The current release SHA on the node.
    status:
      type: string
      description: 'Overall upgrade status. One of: `not_started`, `in_progress`, `completed`, `failed`.'
      enum:
        - not_started
        - in_progress
        - completed
        - failed
    pre_upgrade_status:
      type: string
      description: 'Pre-upgrade phase status. One of: `not_started`, `in_progress`, `completed`, `failed`.'
      enum:
        - not_started
        - in_progress
        - completed
        - failed
    upgrade_last_completed_step:
      type: string
      description: The name of the last completed upgrade step.
    is_running:
      type: boolean
      description: Whether the upgrade process is currently running.
    failed:
      type: boolean
      description: Whether the upgrade has failed.
    steps:
      type: array
      description: Individual step details.
      items:
        type: object
        properties:
          phase:
            type: string
            description: 'The upgrade phase: `pre-upgrade` or `upgrade`.'
          step:
            type: string
            description: The step name.
          status:
            type: string
            description: 'The step status. One of: `not_started`, `in_progress`, `completed`, `failed`.'
          started_at:
            type: string
            format: date-time
            description: The time when the step started in ISO 8601 format.
          ended_at:
            type: string
            format: date-time
            description: The time when the step ended in ISO 8601 format.
          error:
            type: string
            description: An error message if the step failed.
    messages:
      type: array
      description: Service failure messages. Only included when the upgrade has failed or in verbose mode.
      items:
        type: string
    error:
      type: string
      description: An error message if the request failed.
