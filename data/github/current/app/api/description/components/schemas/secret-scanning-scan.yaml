---
description: Information on a single scan performed by secret scanning on the repository
type: object
properties:
  type:
    type: string
    description: 'The type of scan'
  status:
    type: string
    description: |-
      The state of the scan. Either "completed", "running", "pending", "failed", or "unknown".

      "failed": this scan type has hit its retry limit and has been marked permanently failed.
      This usually resolves on its own at the next scheduled scan attempt. If "failed" persists, contact Support.

      "unknown": the scan is in an unrecognized or currently unhandled state.
  completed_at:
    type: string
    format: date-time
    description: 'The time that the scan was completed. Empty if the scan is running'
    nullable: true
  started_at:
    type: string
    format: date-time
    description: 'The time that the scan was started. Empty if the scan is pending'
    nullable: true
# Todo: enforce enums on "type" and on "status"
x-githubEnterpriseOverlays:
  '< 3.22':
    properties:
      status:
        description: |-
          'The state of the scan. Either "completed", "running", or "pending"'
