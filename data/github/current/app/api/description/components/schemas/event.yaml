---
title: Event
description: Event
type: object
properties:
  id:
    type: string
  type:
    type: string
    nullable: true
  actor:
    $ref: './actor.yaml'
  repo:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      url:
        type: string
        format: uri
    required:
      - id
      - name
      - url
  org:
    $ref: './actor.yaml'
  payload:
    oneOf:
      - $ref: ./events/create-event.yaml
      - $ref: ./events/delete-event.yaml
      - $ref: ./events/discussion-event.yaml
      - $ref: ./events/issues-event.yaml
      - $ref: ./events/issue-comment-event.yaml
      - $ref: ./events/fork-event.yaml
      - $ref: ./events/gollum-event.yaml
      - $ref: ./events/member-event.yaml
      - $ref: ./events/public-event.yaml
      - $ref: ./events/push-event.yaml
      - $ref: ./events/pull-request-event.yaml
      - $ref: ./events/pull-request-review-comment-event.yaml
      - $ref: ./events/pull-request-review-event.yaml
      - $ref: ./events/commit-comment-event.yaml
      - $ref: ./events/release-event.yaml
      - $ref: ./events/watch-event.yaml
  public:
    type: boolean
  created_at:
    type: string
    format: date-time
    nullable: true
required:
  - id
  - type
  - actor
  - repo
  - payload
  - public
  - created_at
x-githubEnterpriseOverlays:
  '*':
    properties:
      payload:
        oneOf:
          - $ref: ./events/create-event.yaml
          - $ref: ./events/delete-event.yaml
          - $ref: ./events/issues-event.yaml
          - $ref: ./events/issue-comment-event.yaml
          - $ref: ./events/fork-event.yaml
          - $ref: ./events/gollum-event.yaml
          - $ref: ./events/member-event.yaml
          - $ref: ./events/public-event.yaml
          - $ref: ./events/push-event.yaml
          - $ref: ./events/pull-request-event.yaml
          - $ref: ./events/pull-request-review-comment-event.yaml
          - $ref: ./events/pull-request-review-event.yaml
          - $ref: ./events/commit-comment-event.yaml
          - $ref: ./events/release-event.yaml
          - $ref: ./events/watch-event.yaml
