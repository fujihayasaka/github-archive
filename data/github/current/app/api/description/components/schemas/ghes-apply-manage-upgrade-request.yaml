---
type: object
properties:
  upgrade_package_file:
    type: string
    description: |-
      Absolute path to the upgrade package file. Must be under `/var/lib/ghe-updates/` and the path must be canonical (no `..` or duplicate slashes).
  version:
    type: string
    description: |-
      Target upgrade version in semantic version format (e.g. `3.19.3`). The version is normalized to `major.minor.patch` format.
  target_partition:
    type: string
    description: |-
      Target block device partition for the upgrade.
  phase:
    type: string
    description: |-
      Upgrade phase to run. Valid values are `pre-upgrade` or `upgrade`. Omit for a full upgrade.
    enum:
      - pre-upgrade
      - upgrade
  skip_reboot:
    type: boolean
    description: |-
      Whether to skip the reboot after the upgrade completes. Default is `false`.
    default: false
  uuid:
    type: string
    description: |-
      The UUID of a specific node to upgrade. When omitted, the upgrade is applied to all nodes.
