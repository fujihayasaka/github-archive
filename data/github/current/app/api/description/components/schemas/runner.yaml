---
title: Self hosted runners
description: A self hosted runner
type: object
properties:
  id:
    description: The ID of the runner.
    type: integer
    example: 5
  runner_group_id:
    description: The ID of the runner group.
    type: integer
    example: 1
  name:
    description: The name of the runner.
    type: string
    example: iMac
  os:
    description: The Operating System of the runner.
    type: string
    example: macos
  status:
    description: The status of the runner.
    type: string
    example: online
  busy:
    type: boolean
  labels:
    type: array
    items:
      $ref: './runner-label.yaml'
  ephemeral:
    type: boolean
  runnerScaleSetId:
    type: integer
    x-unpublished: true
  runnerGroupId:
    type: integer
    x-unpublished: true
  createdOn:
    type: string
    format: date-time
    x-unpublished: true
  enabled:
    type: boolean
    x-unpublished: true
  isElastic:
    type: boolean
    x-unpublished: true
  version:
    type: string
    x-unpublished: true
required:
  - id
  - name
  - os
  - status
  - busy
  - labels
