---
type: object
properties:
  sessionId:
    type: string
    description: The ID of the session
  ownerName:
    type: string
    description: The name of the session owner
  runnerScaleSet:
    $ref: "./runner-scale-set.yaml"
  messageQueueAccessToken:
    type: string
    description: The access token for the message queue
  messageQueueUrl:
    type: string
    description: The URL of the message queue
  statistics:
    $ref: "./runner-scale-set-statistics.yaml"
required:
  - sessionId
  - ownerName
  - runnerScaleSet
  - messageQueueAccessToken
  - messageQueueUrl
