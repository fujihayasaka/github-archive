---
title: Secret Scanning Custom Pattern To Update
description: |-
  Fields to update on a custom pattern. At least one updatable field (`pattern`, `start_delimiter`, `end_delimiter`, `must_match`, or `must_not_match`) must also be provided. Only provided fields will be updated.
required:
  - custom_pattern_version
anyOf:
  - required:
    - pattern
  - required:
    - start_delimiter
  - required:
    - end_delimiter
  - required:
    - must_match
  - required:
    - must_not_match
properties:
  pattern:
    type: string
    description: The updated regular expression of the custom pattern.
  start_delimiter:
    type: string
    description: The updated start delimiter regex for the custom pattern.
  end_delimiter:
    type: string
    description: The updated end delimiter regex for the custom pattern.
  must_match:
    type: array
    description: Updated list of regexes that the secret must match.
    items:
      type: string
  must_not_match:
    type: array
    description: Updated list of regexes that the secret must not match.
    items:
      type: string
  custom_pattern_version:
    $ref: ./secret-scanning-row-version.yaml
