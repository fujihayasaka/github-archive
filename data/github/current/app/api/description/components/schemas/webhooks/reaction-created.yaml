---
title: reaction created event
type: object
properties:
  action:
    type: string
    enum:
      - created
  reaction_id:
    description: The unique identifier for the reaction.
    type: integer
  reacted_at:
    description: Time of the reaction
    type: string
    format: date-time
  subject_id:
    description: The unique identifier for the subject of the reaction.
    type: integer
  subject_type:
    description: The type of the subject (e.g., "Issue", "PullRequest").
    type: string
  subject_url:
    description: The API URL identifying the subject
    type: string
    format: uri
  subject_html_url:
    description: The HTML URL identifying the subject
    type: string
    format: uri
  content:
    description: The content of the reaction (e.g., "thumbs_up").
    type: string
  enterprise:
    $ref: '../enterprise-webhooks.yaml'
  installation:
    $ref: '../simple-installation.yaml'
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
required:
  - action
  - reaction_id
  - subject_id
  - subject_type
  - content
