---
title: Projects v2 Field Summary
description: A summary of a field inside a projects v2 project
type: object
properties:
  id:
    type: integer
    description: The unique identifier of the field.
  name:
    type: string
    description: The name of the field.
  data_type:
    type: string
    description: The field's data type.
    enum:
      - assignees
      - linked_pull_requests
      - reviewers
      - labels
      - milestone
      - repository
      - title
      - text
      - single_select
      - number
      - date
      - iteration
      - issue_type
      - parent_issue
      - sub_issues_progress
required:
  - id
  - name
  - data_type
