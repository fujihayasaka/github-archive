    properties:
      raw:
        type: string
      html:
        type: string
    required:
      - raw
      - html
  description:
    type: object
    description: The description of the option, in raw text and HTML formats.
    properties:
      raw:
        type: string
      html:
        type: string
    required:
      - raw
      - html
  color:
    type: string
    description: The color associated with the option.
required:
  - id
  - name
  - description
  - color
