---
title: Copilot Space Resource
description: A resource attached to a Copilot Space.
type: object
properties:
  id:
    type: integer
    description: The unique identifier of the resource.
  resource_type:
    type: string
    description: The type of the resource.
    enum:
    - repository
    - github_file
    - free_text
    - github_issue
    - github_pull_request
    - media_content
    - uploaded_text_file
  copilot_chat_attachment_id:
    type: integer
    nullable: true
    description: The ID of the associated chat attachment, if any.
  metadata:
    type: object
    description: Resource-specific metadata. The keys and values depend on the resource type.
    additionalProperties: true
  created_at:
    type: string
    format: date-time
    description: The date and time the resource was created.
  updated_at:
    type: string
    format: date-time
    description: The date and time the resource was last updated.
required:
- id
- resource_type
- metadata
- created_at
- updated_at
