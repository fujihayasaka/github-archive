---
title: Projects v2 Field
description: A field inside a projects v2 project
type: object
properties:
  id:
    type: integer
    description: The unique identifier of the field.
  node_id:
    type: string
    description: The node ID of the field.
  project_url:
    type: string
    description: The API URL of the project that contains the field.
    example: 'https://api.github.com/projects/1'
  name:
    type: string
    description: The name of the field.
  data_type:
    type: string
    description: The field's data type.
    enum:
      - assignees
      - linked_pull_requests
      - reviewers
      - labels
      - milestone
      - repository
      - title
      - text
      - single_select
      - number
      - date
      - iteration
      - issue_type
      - parent_issue
      - sub_issues_progress
  options:
    type: array
    description: The options available for single select fields.
    items:
      $ref: './projects-v2-single-select-options.yaml'
  configuration:
    type: object
    description: Configuration for iteration fields.
    properties:
      start_day:
        type: integer
        description: The day of the week when the iteration starts.
      duration:
        type: integer
        description: The duration of the iteration in days.
      iterations:
        type: array
        items:
          $ref: './projects-v2-iteration-settings.yaml'
  created_at:
    type: string
    format: date-time
    example: '2022-04-28T12:00:00Z'
    description: The time when the field was created.
  updated_at:
    type: string
    format: date-time
    example: '2022-04-28T12:00:00Z'
    description: The time when the field was last updated.
required:
  - id
  - name
  - data_type
  - created_at
  - updated_at
  - project_url
