---
type: object
properties:
  incremental_scans:
    type: array
    items:
      $ref: './secret-scanning-scan.yaml'
  pattern_update_scans:
    type: array
    items:
      $ref: './secret-scanning-scan.yaml'
  backfill_scans:
    type: array
    items:
      $ref: './secret-scanning-scan.yaml'
  custom_pattern_backfill_scans:
    type: array
    items:
      allOf:
        - $ref: './secret-scanning-scan.yaml'
        - type: object
          properties:
            pattern_name:
              type: string
              description: 'Name of the custom pattern for custom pattern scans'
            pattern_scope:
              type: string
              description: 'Level at which the custom pattern is defined, one of "repository", "organization", or "enterprise"'
