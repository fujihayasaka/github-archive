---
type: object
properties:
  name:
    description: Name of the issue field.
    type: string
  description:
    description: Description of the issue field.
    type: string
    nullable: true
  options:
    description: Options for single select fields. Only applicable when updating single_select fields.
    type: array
    items:
      type: object
      properties:
        name:
          description: Name of the option.
          type: string
        description:
          description: Description of the option.
          type: string
          nullable: true
        color:
          description: Color for the option.
          type: string
          enum:
            - gray
            - blue
            - green
            - yellow
            - orange
            - red
            - pink
            - purple
          nullable: true
        priority:
          description: Priority of the option for ordering.
          type: integer
          nullable: true
      required:
        - name
