---
title: close_issue_reference deleted event
type: object
properties:
  action:
    description: The action performed. Can be `deleted`.
    type: string
    enum:
      - deleted
  close_issue_reference_id:
    description: Unique identifier of the close issue reference.
    type: integer
  issue_id:
    description: Unique identifier of the issue that will be closed by the pull request.
    type: integer
  issue_url:
    description: API URL for the issue that will be closed by the pull request.
    type: string
    format: uri
  issue_html_url:
    description: HTML URL for the issue that will be closed by the pull request.
    type: string
    format: uri
  pull_request_id:
    description: Unique identifier of the pull request that will close the issue when merged.
    type: integer
  pull_request_url:
    description: API URL for the pull request that will close the issue when merged.
    type: string
    format: uri
  pull_request_html_url:
    description: HTML URL for the pull request that will close the issue when merged.
    type: string
    format: uri
  pull_request_author_id:
    description: Unique identifier of the user who authored the pull request.
    type: integer
  source:
    description: How the reference was created. Can be `xref` or `manual`.
    type: string
    enum:
      - xref
      - manual
  referenced_at:
    description: Timestamp indicating when the issue was referenced by the pull request. Will be `null` for the `deleted` action.
    type: string
    format: date-time
    nullable: true
  enterprise:
    $ref: '../enterprise-webhooks.yaml'
  installation:
    $ref: '../simple-installation.yaml'
  organization:
    $ref: '../organization-simple-webhooks.yaml'
  repository:
    $ref: '../repository-webhooks.yaml'
  sender:
    $ref: '../simple-user.yaml'
required:
  - action
  - close_issue_reference_id
  - issue_id
  - pull_request_id
