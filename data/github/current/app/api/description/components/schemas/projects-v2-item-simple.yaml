---
title: Projects v2 Item
description: An item belonging to a project
type: object
properties:
  id:
    type: number
    description: The unique identifier of the project item.
  node_id:
    type: string
    description: The node ID of the project item.
  content:
    oneOf:
      - $ref: './issue.yaml'
      - $ref: './pull-request-simple.yaml'
      - $ref: './projects-v2-draft-issue.yaml'
    description: The content represented by the item.
  content_type:
    $ref: './projects-v2-item-content-type.yaml'
  creator:
    $ref: './simple-user.yaml'
  created_at:
    type: string
    format: date-time
    example: '2022-04-28T12:00:00Z'
    description: The time when the item was created.
  updated_at:
    type: string
    format: date-time
    example: '2022-04-28T12:00:00Z'
    description: The time when the item was last updated.
  archived_at:
    type: string
    format: date-time
    example: '2022-04-28T12:00:00Z'
    nullable: true
    description: The time when the item was archived.
  project_url:
    type: string
    format: uri
    description: The URL of the project this item belongs to.
  item_url:
    type: string
    format: uri
    description: The URL of the item in the project.
required:
  - id
  - content_type
  - created_at
  - updated_at
  - archived_at
