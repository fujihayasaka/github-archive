---
title: Public Monitoring Alert Webhook
description: A public monitoring alert as delivered via webhook.
type: object
properties:
  id:
    type: integer
    description: The public monitoring alert ID.
  secret_type:
    type: string
    description: The type of secret that secret scanning detected.
  secret_type_display_name:
    type: string
    description: |-
      User-friendly name for the detected secret, matching the `secret_type`.
      For a list of built-in patterns, see "[Supported secret scanning patterns](${externalDocsUrl}/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)."
  created_at:
    type: string
    format: date-time
    description: The time that the alert was created in ISO 8601 format.
  repository:
    $ref: 'simple-repository.yaml'
  attribution:
    type: object
    description: Attribution information for the alert.
    properties:
      secret_author:
        $ref: 'simple-user.yaml'
      committer_email:
        type: string
        nullable: true
        description: The email address recorded in the git commit that introduced the secret.
      commit:
        $ref: 'secret-scanning-location-commit.yaml'
      wiki_commit:
        $ref: 'secret-scanning-location-wiki-commit.yaml'
      issue_title:
        $ref: 'secret-scanning-location-issue-title.yaml'
      issue_body:
        $ref: 'secret-scanning-location-issue-body.yaml'
      issue_comment:
        $ref: 'secret-scanning-location-issue-comment.yaml'
required:
  - id
  - secret_type
  - secret_type_display_name
  - created_at
  - repository
  - attribution
