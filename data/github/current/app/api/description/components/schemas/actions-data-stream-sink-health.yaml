---
title: Actions data stream sink health
description: Health information for an Actions data stream sink.
type: object
properties:
  health_status:
    description: The current health status of the data stream sink.
    type: string
    enum:
    - healthy
    - degraded
    - unhealthy
  last_success_at:
    description: The timestamp of the last successful delivery attempt.
    type: string
    format: date-time
  last_failure_at:
    description: The timestamp of the last failed delivery attempt.
    type: string
    format: date-time
  last_error:
    description: The last delivery error recorded for the sink.
    type: string
  consecutive_failures:
    description: The number of consecutive failed delivery attempts.
    type: integer
  checked_at:
    description: The timestamp when the sink health was last evaluated.
    type: string
    format: date-time
