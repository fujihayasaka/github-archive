---
title: AzureBlobConfig
description: Azure Blob Config for audit log streaming configuration.
type: object
properties:
  key_id:
    type: string
    description: Key ID obtained from the audit log stream key endpoint used to encrypt secrets.
  encrypted_sas_url:
    type: string
  container:
    type: string
    description: The name of the Azure Blob Storage container to which the audit logs will be sent.
required:
  - key_id
  - encrypted_sas_url
  - container
