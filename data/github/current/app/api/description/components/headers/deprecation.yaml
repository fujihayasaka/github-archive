description: |-
  Indicates the date when the API endpoint will be deprecated.
  Follows [RFC 7231](https://tools.ietf.org/html/rfc7231#section-7.1.1.1) HTTP date format.
  See [RFC 5322](https://tools.ietf.org/html/rfc5322#section-3.3) for details.
  Clients should use this header to prepare for migration to an alternative endpoint.
example: "Wed, 27 Nov 2019 14:34:29 GMT"
schema:
  type: string
