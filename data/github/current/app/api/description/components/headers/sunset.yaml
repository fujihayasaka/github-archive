---
description: |-
  Indicates the date when the API endpoint will be completely removed and no longer available.
  Follows [RFC 8594](https://tools.ietf.org/html/rfc8594) specification.
  The value is an HTTP-date as defined in [RFC 7231](https://tools.ietf.org/html/rfc7231#section-7.1.1.1).
  After this date, requesting this endpoint will result in a 410 Gone response.
example: "Fri, 27 Nov 2020 14:34:29 GMT"
schema:
  type: string
