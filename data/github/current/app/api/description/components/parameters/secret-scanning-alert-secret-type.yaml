---
name: secret_type
in: query
description: |-
  A comma-separated list of secret types to return. All default secret patterns are returned. To return generic patterns, pass the token name(s) in the parameter. See "[Supported secret scanning patterns](${externalDocsUrl}/enterprise-cloud@latest/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)" for a complete list of secret types.
required: false
schema:
  type: string
x-githubEnterpriseOverlays:
  '< 3.15':
    description: |-
      A comma-separated list of secret types to return. By default all secret types are returned. See "[Supported secret scanning patterns](${externalDocsUrl}/enterprise-cloud@latest/code-security/secret-scanning/introduction/supported-secret-scanning-patterns#supported-secrets)" for a complete list of secret types.
