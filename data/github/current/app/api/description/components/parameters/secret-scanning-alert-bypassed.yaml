---
name: is_bypassed
in: query
description: >-
  A boolean value (`true` or `false`) indicating whether to filter alerts by their push protection bypass status.
  When set to `true`, only alerts that were created because a push protection rule was bypassed will be returned.
  When set to `false`, only alerts that were not caused by a push protection bypass will be returned.
required: false
schema:
  type: boolean
