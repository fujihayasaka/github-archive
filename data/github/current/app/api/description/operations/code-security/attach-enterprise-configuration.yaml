---
summary: 'Attach an enterprise configuration to repositories'
description: |-
  Attaches an enterprise code security configuration to repositories. If the repositories specified are already attached to a configuration, they will be re-attached to the provided configuration.

  If insufficient GHAS licenses are available to attach the configuration to a repository, only free features will be enabled.

  The authenticated user must be an administrator for the enterprise to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - code-security
operationId: code-security/attach-enterprise-configuration

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-security/configurations#attach-an-enterprise-configuration-to-repositories'

x-github-internal:
  path: /enterprises/{enterprise}/code-security/configurations/{configuration_id}/attach
  http-method: post
  published: false
  owner: '@github/security-products-growth-reviewers'

x-github-releases:
- api.github.com
- ghec
- ghes: '>= 3.16'

parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/configuration-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        properties:
          scope:
            type: string
            description: "The type of repositories to attach the configuration to.
              `selected` means the configuration will be attached to only the repositories specified
              by `selected_repository_ids`"
            enum:
            - all
            - all_without_configurations
        required:
        - scope
      examples:
        default:
          summary: Example for attaching a configuration to some repositories
          value:
            scope: all

responses:
  '202':
    $ref: '../../components/responses/accepted.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '409':
    $ref: '../../components/responses/conflict.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: code-security
  subcategory: configurations
