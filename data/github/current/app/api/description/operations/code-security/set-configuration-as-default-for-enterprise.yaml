---
summary: 'Set a code security configuration as a default for an enterprise'
description: |-
  Sets a code security configuration as a default to be applied to new repositories in your enterprise.

  This configuration will be applied by default to the matching repository type when created, but only for organizations within the enterprise that do not already have a default code security configuration set.

  The authenticated user must be an administrator for the enterprise to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - code-security
operationId: code-security/set-configuration-as-default-for-enterprise

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-security/configurations#set-a-code-security-configuration-as-a-default-for-an-enterprise'

x-github-internal:
  path: /enterprises/{enterprise}/code-security/configurations/{configuration_id}/defaults
  http-method: put
  published: false
  owner: '@github/security-products-growth-reviewers'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'

parameters:
 - $ref: '../../components/parameters/enterprise.yaml'
 - $ref: '../../components/parameters/configuration-id.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          default_for_new_repos:
            type: string
            description: Specify which types of repository this security configuration should be applied to by default.
            enum:
            - all
            - none
            - private_and_internal
            - public
      examples:
        default:
          summary: Set this configuration to be enabled by default on all new repositories.
          value:
            default_for_new_repos: all

responses:
  '200':
    description: Default successfully changed.
    content:
      application/json:
        schema:
          type: object
          properties:
            default_for_new_repos:
              type: string
              description: Specifies which types of repository this security configuration is applied to by default.
              enum:
              - all
              - none
              - private_and_internal
              - public
            configuration:
              $ref: '../../components/schemas/code-security-configuration.yaml'
        examples:
          default:
            value:
              default_for_new_repos: all
              configuration:
                $ref: '../../components/examples/code-security-configuration.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: code-security
  subcategory: configurations
