---
summary: 'Get default code security configurations for an enterprise'
description: |-
  Lists the default code security configurations for an enterprise.

  The authenticated user must be an administrator of the enterprise in order to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `read:enterprise` scope to use this endpoint.
tags:
  - code-security
operationId: code-security/get-default-configurations-for-enterprise

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-security/configurations#get-default-code-security-configurations-for-an-enterprise'

x-github-internal:
  path: /enterprises/{enterprise}/code-security/configurations/defaults
  http-method: get
  published: true
  owner: '@github/security-products-enablement-reviewers'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'

parameters:
