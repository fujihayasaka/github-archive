---
summary: 'Update a custom code security configuration for an enterprise'
description: |-
  Updates a code security configuration in an enterprise.

  The authenticated user must be an administrator of the enterprise in order to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - code-security
operationId: code-security/update-enterprise-configuration

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-security/configurations#update-a-custom-code-security-configuration-for-an-enterprise'

x-github-internal:
  path: /enterprises/{enterprise}/code-security/configurations/{configuration_id}
  http-method: patch
  published: false
  owner: '@github/security-products-growth-reviewers'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'

parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/configuration-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
            description: The name of the code security configuration. Must be unique across the enterprise.
          description:
            type: string
            description: A description of the code security configuration
            maxLength: 255
          advanced_security:
            type: string
            description: The enablement status of GitHub Advanced Security. Must be set to enabled if you want to enable any GHAS settings.
            enum:
            - enabled
            - disabled
          dependency_graph:
            type: string
            description: The enablement status of Dependency Graph
            enum:
            - enabled
            - disabled
            - not_set
          dependency_graph_autosubmit_action:
            type: string
            description: The enablement status of Automatic dependency submission
            enum:
            - enabled
            - disabled
            - not_set
          dependency_graph_autosubmit_action_options:
            type: object
            description: Feature options for Automatic dependency submission
            properties:
              labeled_runners:
                type: boolean
                description: Whether to use runners labeled with 'dependency-submission' or standard GitHub runners.
          dependabot_alerts:
            type: string
            description: The enablement status of Dependabot alerts
            enum:
            - enabled
            - disabled
            - not_set
          dependabot_security_updates:
            type: string
            description: The enablement status of Dependabot security updates
            enum:
            - enabled
            - disabled
            - not_set
          code_scanning_default_setup:
            type: string
            description: The enablement status of code scanning default setup
            enum:
            - enabled
            - disabled
            - not_set
          code_scanning_default_setup_options:
            $ref: '../../components/schemas/code-scanning-default-setup-options.yaml'
          secret_scanning:
            type: string
            description: The enablement status of secret scanning
            enum:
            - enabled
            - disabled
            - not_set
          secret_scanning_push_protection:
            type: string
            description: The enablement status of secret scanning push protection
            enum:
            - enabled
            - disabled
            - not_set
          secret_scanning_delegated_bypass:
            type: string
            description: The enablement status of secret scanning delegated bypass
            enum:
            - enabled
            - disabled
            - not_set
            default: disabled
          secret_scanning_delegated_bypass_options:
            type: object
            description: Feature options for secret scanning delegated bypass
            properties:
              reviewers:
                type: array
                description: The bypass reviewers for secret scanning delegated bypass
                items:
                  type: object
                  required:
                    - reviewer_id
                    - reviewer_type
                  properties:
                    reviewer_id:
                      type: integer
                      description: The ID of the team or role selected as a bypass reviewer
                    reviewer_type:
                      type: string
                      description: The type of the bypass reviewer
                      enum:
                        - TEAM
                        - ROLE
          secret_scanning_validity_checks:
            type: string
            description: The enablement status of secret scanning validity checks
            enum:
            - enabled
            - disabled
            - not_set
          secret_scanning_non_provider_patterns:
            type: string
            description: The enablement status of secret scanning non-provider patterns
            enum:
            - enabled
            - disabled
            - not_set
          private_vulnerability_reporting:
            type: string
            description: The enablement status of private vulnerability reporting
            enum:
            - enabled
            - disabled
            - not_set
          enforcement:
            type: string
            description: The enforcement status for a security configuration
            enum:
            - enforced
            - unenforced
      examples:
        default:
          summary: Example for updating a code security configuration
          value:
            name: octo-enterprise recommended settings v2
            secret_scanning: disabled
            code_scanning_default_setup: enabled

responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/code-security-configuration.yaml'
        examples:
          default:
            $ref: '../../components/examples/enterprise-code-security-configuration.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '409':
    $ref: '../../components/responses/conflict.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: code-security
  subcategory: configurations

x-githubEnterpriseOverlays:
  '>= 3.16':
    description: |-
      Updates a code security configuration in an enterprise.

      The authenticated user must be an administrator of the enterprise in order to use this endpoint.

      OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.

      > [!NOTE]
      > The enablement status will only be returned for installed security products.
    requestBody:
      content:
        application/json:
          schema:
            properties:
              dependency_graph_autosubmit_action:
              dependency_graph_autosubmit_action_options:
              dependency_graph:
                description: The enablement status of Dependency Graph. Dependency Graph is not configurable in GitHub Enterprise Server.
