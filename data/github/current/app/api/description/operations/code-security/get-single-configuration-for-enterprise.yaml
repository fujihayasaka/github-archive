---
summary: 'Retrieve a code security configuration of an enterprise'
description: |-
  Gets a code security configuration available in an enterprise.

  The authenticated user must be an administrator of the enterprise in order to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `read:enterprise` scope to use this endpoint.
tags:
  - code-security
operationId: code-security/get-single-configuration-for-enterprise

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-security/configurations#retrieve-a-code-security-configuration-of-an-enterprise'

x-github-internal:
  path: /enterprises/{enterprise}/code-security/configurations/{configuration_id}
  http-method: get
  published: true
  owner: '@github/security-products-enablement-reviewers'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'

parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/configuration-id.yaml'

responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/code-security-configuration.yaml'
        examples:
          default:
            $ref: '../../components/examples/enterprise-code-security-configuration.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: code-security
  subcategory: configurations

x-githubEnterpriseOverlays:
  '>= 3.16':
    description: |-
      Gets a code security configuration available in an enterprise.

      The authenticated user must be an administrator of the enterprise in order to use this endpoint.

      OAuth app tokens and personal access tokens (classic) need the `read:enterprise` scope to use this endpoint.

      > [!NOTE]
      > Any security products that are not installed will report an `unset` status.
