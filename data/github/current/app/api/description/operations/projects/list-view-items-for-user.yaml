---
summary: List items for a user project view
description: >-
  List items in a user project with the saved view's filter applied.
tags:
  - projects
operationId: projects/list-view-items-for-user
externalDocs:
  description: API method documentation
  url: >-
    ${externalDocsUrl}/rest/projects/items#list-items-for-a-user-project-view
parameters:
  - $ref: '../../components/parameters/project-number.yaml'
  - $ref: '../../components/parameters/username.yaml'
  - $ref: '../../components/parameters/view-number.yaml'
  - name: fields
    description: |-
      Limit results to specific fields, by their IDs. If not specified, the
      title field will be returned.

      Example: `fields[]=123&fields[]=456&fields[]=789` or `fields=123,456,789`
    in: query
    required: false
    schema:
      oneOf:
        - type: string
        - type: array
          maxItems: 50
          items:
            type: string
  - $ref: '../../components/parameters/pagination-before.yaml'
  - $ref: '../../components/parameters/pagination-after.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/projects-v2-item-with-content.yaml'
        examples:
          default:
            $ref: '../../components/examples/projects-v2-item-with-content.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
  - ghec
  - ghes: '>= 3.20'
  - api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: projects
  subcategory: items
x-github-internal:
  path: '/users/{username}/projectsV2/{project_number}/views/{view_number}/items'
  http-method: get
  service-tier: 2
  owner: '@github/memex'
  published: true
