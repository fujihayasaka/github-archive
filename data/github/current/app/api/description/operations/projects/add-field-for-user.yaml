---
summary: Add field to user owned project
description: Add a field to a specified user owned project.
tags:
  - projects
operationId: projects/add-field-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/projects/fields#add-field-to-user-owned-project'
parameters:
  - $ref: '../../components/parameters/username.yaml'
  - $ref: '../../components/parameters/project-number.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        oneOf:
          - type: object
            properties:
              name:
                type: string
                description: The name of the field.
              data_type:
                type: string
                description: The field's data type.
                enum:
                  - text
                  - number
                  - date
            required:
              - name
              - data_type
            additionalProperties: false
          - type: object
            properties:
              name:
                type: string
                description: The name of the field.
              data_type:
                type: string
                description: The field's data type.
                enum:
                  - single_select
              single_select_options:
                type: array
                description: The options available for single select fields. At least one option must be provided when creating a single select field.
                items:
                  $ref: '../../components/schemas/projects-v2-field-single-select-option.yaml'
            required:
              - name
              - data_type
              - single_select_options
            additionalProperties: false
          - type: object
            properties:
              name:
                type: string
                description: The name of the field.
              data_type:
                type: string
                description: The field's data type.
                enum:
                  - iteration
              iteration_configuration:
                $ref: '../../components/schemas/projects-v2-field-iteration-configuration.yaml'
            required:
              - name
              - data_type
              - iteration_configuration
            additionalProperties: false
      examples:
        text_field:
          summary: Create a text field
          value:
            name: 'Team notes'
            data_type: 'text'
        number_field:
          summary: Create a number field
          value:
            name: 'Story points'
            data_type: 'number'
        date_field:
          summary: Create a date field
          value:
            name: 'Due date'
            data_type: 'date'
        single_select_field:
          $ref: '../../components/examples/projects-v2-field-single-select-request.yaml'
        iteration_field:
          $ref: '../../components/examples/projects-v2-field-iteration-request.yaml'
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/projects-v2-field.yaml'
        examples:
          text_field:
            $ref: '../../components/examples/projects-v2-field-text.yaml'
          number_field:
            $ref: '../../components/examples/projects-v2-field-number.yaml'
          date_field:
            $ref: '../../components/examples/projects-v2-field-date.yaml'
          single_select_field:
            $ref: '../../components/examples/projects-v2-field-single-select.yaml'
          iteration_field:
            $ref: '../../components/examples/projects-v2-field-iteration.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
  - ghec
  - ghes: '>= 3.20'
  - api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects
  subcategory: fields
x-github-internal:
  path: '/users/{username}/projectsV2/{project_number}/fields'
  http-method: post
  service-tier: 2
  owner: '@github/memex'
  published: true
