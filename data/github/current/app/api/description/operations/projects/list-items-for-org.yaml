---
summary: List items for an organization owned project
description: List all items for a specific organization-owned project accessible by the authenticated user.
tags:
- projects
operationId: projects/list-items-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/projects/items#list-items-for-an-organization-owned-project'
parameters:
- $ref: '../../components/parameters/project-number.yaml'
- $ref: '../../components/parameters/org.yaml'
- name: q
  description: Search query to filter items, see [Filtering projects](${externalDocsUrl}/issues/planning-and-tracking-with-projects/customizing-views-in-your-project/filtering-projects) for more information.
  in: query
  required: false
  schema:
    type: string
- name: fields
  description: Limit results to specific fields, by their IDs. If not specified, the title field will be returned.
  in: query
  required: false
  schema:
    type: array
    maxItems: 50
    items:
      type: string
    example: fields[]=123,fields[]=456,fields[]=789
- $ref: '../../components/parameters/pagination-before.yaml'
- $ref: '../../components/parameters/pagination-after.yaml'
- $ref: '../../components/parameters/per-page.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/projects-v2-item-with-content.yaml'
        examples:
          default:
            $ref: '../../components/examples/projects-v2-item-with-content.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
x-github-releases:
- ghec
- ghes: '>= 3.19'
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects
  subcategory: items
x-github-internal:
  path: '/orgs/{org}/projectsV2/{project_number}/items'
  http-method: get
  service-tier: 2
  owner: '@github/memex'
  published: true
