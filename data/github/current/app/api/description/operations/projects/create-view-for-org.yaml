---
summary: Create a view for an organization-owned project
description: >-
  Create a new view in an organization-owned project. Views allow you to
  customize how items in a project are displayed and filtered.
tags:
  - projects
operationId: projects/create-view-for-org
externalDocs:
  description: API method documentation
  url: >-
    ${externalDocsUrl}/rest/projects/views#create-a-view-for-an-organization-owned-project
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/project-number.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the view.
            example: 'Sprint Board'
          layout:
            type: string
            description: The layout of the view.
            enum:
              - table
              - board
              - roadmap
            example: 'board'
          filter:
            type: string
            description: >-
              The filter query for the view. See [Filtering projects](${externalDocsUrl}/issues/planning-and-tracking-with-projects/customizing-views-in-your-project/filtering-projects) for more information.
            example: 'is:issue is:open'
          visible_fields:
            type: array
            description: >-
              `visible_fields` is not applicable to `roadmap` layout views.

              For `table` and `board` layouts, this represents the field IDs that should be visible in the view. If not provided, the default visible fields will be used.
            items:
              type: integer
            example: [123, 456, 789]
        required:
          - name
          - layout
        additionalProperties: false
      examples:
        table_view:
          summary: Create a table view
          value:
            name: 'All Issues'
            layout: 'table'
            filter: 'is:issue'
            visible_fields: [123, 456, 789]
        board_view:
          summary: Create a board view with filter
          value:
            name: 'Sprint Board'
            layout: 'board'
            filter: 'is:issue is:open label:sprint'
            visible_fields: [123, 456, 789]
        roadmap_view:
          summary: Create a roadmap view
          value:
            name: 'Product Roadmap'
            layout: 'roadmap'

responses:
  '201':
    description: Response for creating a view in an organization-owned project.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/projects-v2-view.yaml'
        examples:
          table_view:
            summary: Response for creating a table view
            value:
              $ref: '../../components/examples/projects-v2-view.yaml'
          board_view:
            summary: Response for creating a board view with filter
            value:
              $ref: '../../components/examples/projects-v2-view.yaml'
          roadmap_view:
            summary: Response for creating a roadmap view
            value:
              $ref: '../../components/examples/projects-v2-view.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '503':
    description: Service unavailable
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
x-github-releases:
  - ghec
  - ghes: '>= 3.20'
  - api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects
  subcategory: views
x-github-internal:
  path: '/orgs/{org}/projectsV2/{project_number}/views'
  http-method: post
  service-tier: 2
  owner: '@github/memex'
  published: true
