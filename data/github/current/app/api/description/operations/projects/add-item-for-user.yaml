---
summary: Add item to user owned project
description: Add an issue or pull request item to the specified user owned project.
tags:
- projects
operationId: projects/add-item-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/projects/items#add-item-to-user-owned-project'
parameters:
- $ref: '../../components/parameters/user-id.yaml'
- $ref: '../../components/parameters/project-number.yaml'
requestBody:
  required: true
  description: Details of the item to add to the project.
  content:
    application/json:
      schema:
        type: object
        properties:
          type:
            type: string
            enum: [Issue, PullRequest]
            description: The type of item to add to the project. Must be either Issue or PullRequest.
          id:
            type: integer
            description: The numeric ID of the issue or pull request to add to the project.
        required:
          - type
          - id
      examples:
        issue:
          value:
            type: Issue
            id: 3
        pull_request:
          value:
            type: PullRequest
            id: 3
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/projects-v2-item-simple.yaml'
        examples:
          default:
            $ref: '../../components/examples/projects-v2-item-simple.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
x-github-releases:
- ghec
- ghes: '>= 3.19'
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects
  subcategory: items
x-github-internal:
  path: '/users/{user_id}/projectsV2/{project_number}/items'
  http-method: post
  service-tier: 2
  owner: '@github/memex'
  published: true
