---
summary: Update project item for organization
description: Update a specific item in an organization-owned project.
tags:
- projects
operationId: projects/update-item-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/projects/items#update-project-item-for-organization'
parameters:
- $ref: '../../components/parameters/project-number.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/item-id.yaml'
requestBody:
  required: true
  description: Field updates to apply to the project item. Only text, number, date, single select, and iteration fields are supported.
  content:
    application/json:
      schema:
        type: object
        properties:
          fields:
            type: array
            description: A list of field updates to apply.
            items:
              type: object
              properties:
                id:
                  type: integer
                  description: The ID of the project field to update.
                value:
                  description: |-
                    The new value for the field:
                    - For text, number, and date fields, provide the new value directly.
                    - For single select and iteration fields, provide the ID of the option or iteration.
                    - To clear the field, set this to null.
                  nullable: true
                  oneOf:
                    - type: string
                    - type: number
              required:
                - id
                - value
        required:
          - fields
      examples:
        text_field:
          summary: Update a text field
          value:
            fields:
              - id: 123
                value: 'Updated text value'
        number_field:
          summary: Update a number field
          value:
            fields:
              - id: 456
                value: 42.5
        date_field:
          summary: Update a date field
          value:
            fields:
              - id: 789
                value: '2023-10-05'
        single_select_field:
          summary: Update a single select field
          value:
            fields:
              - id: 789
                value: '47fc9ee4'
        iteration_field:
          summary: Update an iteration field
          value:
            fields:
              - id: 1011
                value: '866ee5b8'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/projects-v2-item-with-content.yaml'
        examples:
          default:
            $ref: '../../components/examples/projects-v2-item-with-content.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- ghec
- ghes: '>= 3.19'
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects
  subcategory: items
x-github-internal:
  path: '/orgs/{org}/projectsV2/{project_number}/items/{item_id}'
  http-method: patch
  service-tier: 2
  owner: '@github/memex'
  published: true
