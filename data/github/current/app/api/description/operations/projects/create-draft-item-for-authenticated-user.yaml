---
summary: 'Create draft item for user owned project'
description: |-
  Create draft issue item for the specified user owned project.
tags:
  - projects
operationId: projects/create-draft-item-for-authenticated-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/projects/drafts#create-draft-item-for-user-owned-project'
parameters:
  - $ref: '../../components/parameters/user-id.yaml'
  - $ref: '../../components/parameters/project-number.yaml'
requestBody:
  required: true
  description: Details of the draft item to create in the project.
  content:
    application/json:
      schema:
        type: object
        properties:
          title:
            type: string
            description: The title of the draft issue item to create in the project.
          body:
            type: string
            description: The body content of the draft issue item to create in the project.
        required:
          - title
      examples:
        title:
          summary: Example with Sample Draft Issue Title
          value:
            title: Sample Draft Issue Title
        body:
          summary: Example with Sample Draft Issue Title and Body
          value:
            title: Sample Draft Issue Title
            body: This is the body content of the draft issue.
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/projects-v2-item-simple.yaml'
        examples:
          draft_issue:
            $ref: '../../components/examples/projects-v2-item-simple.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
x-github-releases:
  - ghec
  - ghes: '>= 3.20'
  - api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects
  subcategory: drafts
x-github-internal:
  path: /user/{user_id}/projectsV2/{project_number}/drafts
  http-method: post
  owner: '@github/memex'
  published: true
