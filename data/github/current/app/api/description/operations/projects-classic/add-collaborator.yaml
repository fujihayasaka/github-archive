---
summary: Add project collaborator
description: Adds a collaborator to an organization project and sets their permission
  level. You must be an organization owner or a project `admin` to add a collaborator.
tags:
  - projects-classic
operationId: projects-classic/add-collaborator
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/projects-classic/collaborators#add-project-collaborator'
parameters:
  - $ref: '../../components/parameters/project-id.yaml'
  - $ref: '../../components/parameters/username.yaml'
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          permission:
            description: The permission to grant the collaborator.
            enum:
              - read
              - write
              - admin
            default: write
            example: write
            type: string
        nullable: true
      examples:
        default:
          summary: Applying write permissions for the new collaborator
          value:
            permission: write
responses:
  '204':
    description: Response
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
x-github-releases:
- ghec
- ghes: '>= 2.18'
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: projects-classic
  subcategory: collaborators
x-github-internal:
  path: '/projects/{project_id}/collaborators/{username}'
  http-method: put
  service-tier: 2
  owner: '@github/projects-classic'
  published: true
x-githubEnterpriseOverlays:
  '<= 3.2':
    x-github:
      previews:
      - $ref: '../../components/x-previews/inertia.yaml'
        required: true
x-github-overlays:
  - releases:
      - api.github.com
      - ghec
      - ghes: '>=3.15'
