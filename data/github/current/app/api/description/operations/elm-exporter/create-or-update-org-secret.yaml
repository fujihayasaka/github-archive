---
summary: Create or update an organization ELM exporter secret
description: |-
  Creates or updates an organization ELM exporter secret with an encrypted value. Encrypt your secret using
  [LibSodium](https://libsodium.gitbook.io/doc/bindings_for_other_languages).

  Only available on GitHub Enterprise Server when the ELM exporter application is enabled.
  Secret names are restricted to `SOURCE_PAT` and `TARGET_PAT`.

  The authenticated user must be an organization admin.
tags:
- elm-exporter
externalDocs:
  description: "API method documentation"
  url: "${externalDocsUrl}/rest/elm-exporter/secrets#create-or-update-an-organization-elm-exporter-secret"
operationId: elm-exporter/create-or-update-org-secret
parameters:
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/secret-name.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          encrypted_value:
            type: string
            description:
              Value for your secret, encrypted with [LibSodium](https://libsodium.gitbook.io/doc/bindings_for_other_languages)
              using the public key retrieved from the [Get an organization public
              key](${externalDocsUrl}/rest/elm-exporter/secrets#get-an-organization-public-key)
              endpoint.
            pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$'
          key_id:
            type: string
            description: ID of the key you used to encrypt the secret.
        required:
        - encrypted_value
        - key_id
      examples:
        default:
          value:
            encrypted_value: c2VjcmV0
            key_id: '012345678912345678'
responses:
  '201':
    description: Response when creating a secret
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/empty-object.yaml'
        examples:
          default:
            value:
  '204':
    description: Response when updating a secret
x-github-releases:
- ghes: ">= 3.17"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: elm-exporter
  subcategory: secrets
x-github-internal:
  path: '/orgs/{org}/elm-exporter/secrets/{secret_name}'
  http-method: put
  service-tier: 2
  owner: '@github/migrations-vnext'
  published: false
