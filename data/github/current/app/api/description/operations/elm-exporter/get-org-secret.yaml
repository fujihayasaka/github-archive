---
summary: Get an organization ELM exporter secret
description: |-
  Gets a single organization ELM exporter secret without revealing its encrypted value.

  Only available on GitHub Enterprise Server when the ELM exporter application is enabled.
  Secret names are restricted to `SOURCE_PAT` and `TARGET_PAT`.

  The authenticated user must be an organization admin.
tags:
- elm-exporter
externalDocs:
  description: "API method documentation"
  url: "${externalDocsUrl}/rest/elm-exporter/secrets#get-an-organization-elm-exporter-secret"
operationId: elm-exporter/get-org-secret
parameters:
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/secret-name.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/organization-elm-exporter-secret.yaml'
        examples:
          default:
            value:
              name: SOURCE_PAT
              created_at: '2019-08-10T14:59:22Z'
              updated_at: '2020-01-10T14:59:22Z'
x-github-releases:
- ghes: ">= 3.17"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: elm-exporter
  subcategory: secrets
x-github-internal:
  path: '/orgs/{org}/elm-exporter/secrets/{secret_name}'
  http-method: get
  service-tier: 2
  owner: '@github/migrations-vnext'
  published: false
