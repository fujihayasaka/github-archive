---
summary: Get an organization public key for ELM exporter secrets
description: |-
  Gets the public key needed to encrypt ELM exporter secrets. You need to
  encrypt a secret before you can create or update secrets.

  Only available on GitHub Enterprise Server when the ELM exporter application is enabled.

  The authenticated user must be an organization admin.
tags:
- elm-exporter
externalDocs:
  description: "API method documentation"
  url: "${externalDocsUrl}/rest/elm-exporter/secrets#get-an-organization-public-key-for-elm-exporter-secrets"
operationId: elm-exporter/get-org-public-key
parameters:
- $ref: '../../components/parameters/org.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/actions-public-key.yaml'
        examples:
          default:
            $ref: '../../components/examples/actions-public-key.yaml'
x-github-releases:
- ghes: ">= 3.17"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: elm-exporter
  subcategory: secrets
x-github-internal:
  path: '/orgs/{org}/elm-exporter/secrets/public-key'
  http-method: get
  service-tier: 2
