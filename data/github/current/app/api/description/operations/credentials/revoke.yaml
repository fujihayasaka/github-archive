---
summary: Revoke a list of credentials
description: 'Submit a list of credentials to be revoked. This endpoint is intended to revoke credentials the caller does not own and may have found outside of GitHub.com. Credential owners will be notified of the revocation. Currently supports classic and fine-grained personal access tokens.'
tags:
- credentials
- tokens
- revoke
- revocation
operationId: credentials/revoke
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/credentials/revoke#revoke-a-list-of-credentials'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: array
        minItems: 1
        maxItems: 1000
        description: The credentials to be revoked, up to 1000 per request.
        items:
          type: string
      examples:
        default:
          value: ["ghp_123abc", "github_pat_abc123"]
responses:
  '202':
    $ref: '../../components/responses/accepted.yaml'
  '422':
    $ref: '../../components/responses/validation_failed_simple.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
- ghes: '>= 3.17'
- api.github.com
x-githubEnterpriseOverlays:
  ">= 3.17":
    description: 'Submit a list of credentials to be revoked. This endpoint is intended to revoke credentials the caller does not own and may have found outside of the enterprise instance. Credential owners will be notified of the revocation. Currently supports classic and fine-grained personal access tokens.'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: credentials
  subcategory: revoke
x-github-internal:
  path: '/credentials/revoke'
  http-method: post
  service-tier: 2
  owner: '@github/authentication'
  published: false
