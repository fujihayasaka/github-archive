---
summary: Get pull request creation cap bypass list for a repository
description: |-
  Lists the users that are on the pull request creation cap bypass list for a
  repository. Users on this list can create pull requests regardless of any
  configured pull request creation cap.

  Only repository admins can view the bypass list.
tags:
- interactions
operationId: interactions/get-pull-request-bypass-list-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/interactions/repos#get-pull-request-creation-cap-bypass-list-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/simple-user.yaml'
        examples:
          default:
            $ref: '../../components/examples/pull-request-bypass-list-items.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
