---
summary: Add users to the pull request creation cap bypass list for a repository
description: |-
  Adds users to the pull request creation cap bypass list for a repository.
  Users on this list can create pull requests regardless of any configured
  pull request creation cap.

  Only repository admins can modify the bypass list.
  You can add a maximum of 100 users per request.
  The bypass list can only hold a maximum of 100 users.
tags:
- interactions
operationId: interactions/set-pull-request-bypass-list-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/interactions/repos#add-users-to-the-pull-request-creation-cap-bypass-list-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/interaction-limit-pull-request-bypass-list.yaml'
      examples:
        default:
          summary: Example request body
          value:
            users:
            - octocat
            - monalisa
responses:
  '204':
    description: Response
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: interactions
  subcategory: repos
x-github-internal:
