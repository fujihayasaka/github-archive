---
summary: 'Delete an OIDC custom property inclusion for an enterprise'
description: |-
  Removes a repository custom property from being included in the OIDC token for repository actions in an enterprise.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - oidc
operationId: oidc/delete-oidc-custom-property-inclusion-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/oidc#delete-an-oidc-custom-property-inclusion-for-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
  - name: custom_property_name
    in: path
    required: true
    schema:
      type: string
    description: The name of the custom property to remove from OIDC token inclusion
responses:
  '204':
    description: OIDC custom property inclusion deleted
  '400':
    description: Invalid input
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    description: Property inclusion not found
x-github:
  enabledForGitHubApps: true
  githubCloudOnly: false
  category: actions
  subcategory: oidc
x-github-internal:
  owner: '@github/c2c-actions'
  path: /enterprises/{enterprise}/actions/oidc/customization/properties/repo/{custom_property_name}
  http-method: delete
  published: true
  service-tier: 1
x-github-releases:
- api.github.com
- ghec
