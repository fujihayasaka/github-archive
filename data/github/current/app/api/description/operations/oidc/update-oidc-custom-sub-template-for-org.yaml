---
summary: 'Set the customization template for an OIDC subject claim for an organization'
description: |-
  Creates or updates the customization template for an OpenID Connect (OIDC) subject claim.

  OAuth app tokens and personal access tokens (classic) need the `write:org` scope to use this endpoint.
tags:
- oidc
operationId: oidc/update-oidc-custom-sub-template-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/oidc#set-the-customization-template-for-an-oidc-subject-claim-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
x-github-resource-owner: '@github/c2c-actions-nirvana'
x-github-internal:
  owner: '@github/external-identities'
  path: /orgs/{org}/actions/oidc/customization/sub
  http-method: put
  published: true
x-github-releases:
- api.github.com
- ghec
- ghes: '>= 3.7'
requestBody:
  required: true
  content:
    application/json:
      schema:
        title: Actions OIDC Subject customization
        description: Actions OIDC Subject customization
        type: object
        properties:
          include_claim_keys:
            description: Array of unique strings. Each claim key can only contain alphanumeric characters and underscores.
            type: array
            items:
              type: string
          use_immutable_subject:
            description: Whether to opt in to the immutable OIDC subject claim format for the organization. When `true`, new OIDC tokens will use a stable, repository-ID-based `sub` claim instead of the name-based format.
            type: boolean
      examples:
        default:
          $ref: '../../components/examples/oidc-custom-sub.yaml'
responses:
  '201':
    description: Empty response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/empty-object.yaml'
        examples:
          default:
            value: 
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
x-github:
  enabledForGitHubApps: true
  previews: []
  category: actions
  subcategory: oidc
x-githubEnterpriseOverlays:
  '*':
    requestBody:
      content:
        application/json:
          schema:
            properties:
              use_immutable_subject:
