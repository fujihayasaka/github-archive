---
summary: 'Create an OIDC custom property inclusion for an enterprise'
description: |-
  Adds a repository custom property to be included in the OIDC token for repository actions in an enterprise.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - oidc
operationId: oidc/create-oidc-custom-property-inclusion-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/oidc#create-an-oidc-custom-property-inclusion-for-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/oidc-custom-property-inclusion-input.yaml'
      examples:
        default:
          $ref: '../../components/examples/oidc-custom-property-inclusion.yaml'
responses:
  '201':
    description: OIDC custom property inclusion created
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/oidc-custom-property-inclusion.yaml'
        examples:
          default:
            $ref: '../../components/examples/oidc-custom-property-inclusion.yaml'
  '400':
    description: Invalid input
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    description: Property inclusion already exists
x-github:
  enabledForGitHubApps: true
