---
summary: 'List OIDC custom property inclusions for an organization'
description: |-
  Lists the repository custom properties that are included in the OIDC token for repository actions in an organization.

  OAuth app tokens and personal access tokens (classic) need the `read:org` scope to use this endpoint.
tags:
  - oidc
operationId: oidc/list-oidc-custom-property-inclusions-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/oidc#list-oidc-custom-property-inclusions-for-an-organization'
parameters:
  - $ref: '../../components/parameters/org.yaml'
responses:
  '200':
    description: A JSON array of OIDC custom property inclusions
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/oidc-custom-property-inclusion.yaml'
        examples:
          default:
            value:
              - property_name: "environment"
              - property_name: "team"
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
x-github:
  enabledForGitHubApps: true
  category: actions
  subcategory: oidc
x-github-internal:
  owner: '@github/c2c-actions'
  path: /orgs/{org}/actions/oidc/customization/properties/repo
  http-method: get
  published: true
  service-tier: 1
x-github-releases:
- api.github.com
- ghec
