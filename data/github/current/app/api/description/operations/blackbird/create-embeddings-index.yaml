---
summary: 'Create an embeddings index for a repository'
description: |-
  Creates a record in `copilot_indexed_repositories` and queues a job for blackbird to index the repository for semantic/embedding search.
tags:
  - blackbird
operationId: blackbird/create-embeddings-index

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/blackbird/blackbird#create-an-embeddings-index-for-a-repository'

x-github-internal:
  path: /internal/blackbird/repositories/{repository_id}/embeddings_index
  http-method: post
  published: false
  owner: '@github/blackbird'

x-github-releases:
  - api.github.com
  - ghec

parameters:
 - $ref: '../../components/parameters/repository-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          force:
            type: boolean
            description: Force creating the embedding index.
          actor_id:
            type: integer
            description: Identifies the actor that is requesting this action.
        required:
          - actor_id
      examples:
        force:
          value: false
        actor_id:
          value: 1234

responses:
  '200':
    description: The repository is already indexed for semantic/embedding search.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/blackbird-index-status.yaml'
        examples:
          default:
            $ref: '../../components/examples/blackbird-index-status.yaml'
  '201':
    description: A job has been queued to index this repository for semantic/embedding search.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/blackbird-index-status.yaml'
        examples:
          default:
            $ref: '../../components/examples/blackbird-index-status.yaml'
  '202':
    description: The repository is already being indexed for semantic/embedding search, but a new job has been queued to index.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/blackbird-index-status.yaml'
        examples:
          default:
            $ref: '../../components/examples/blackbird-index-status.yaml'
  '401':
    description: A valid copilot license is required to create an embeddings index.
  '404':
    description: The repo is not found or inaccessible to the actor.
  '429':
    description: The actor has exhausted their quota for creating embeddings indexes. Try again later.
  '503':
    description: Embeddings indexing for new repositories is not available right now. It is safe to try again later.

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: blackbird
  subcategory: blackbird
