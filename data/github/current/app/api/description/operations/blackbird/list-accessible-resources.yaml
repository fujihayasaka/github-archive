---
summary: List resources accessible to the access_token's session
description: |-
  A longer summary of this operation. Please reach out to our wonderful tech writers
  for a review and/or help.
tags:
- search
operationId: blackbird/list-accessible-resources
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/blackbird/blackbird#list-resources-accessible-to-the-access_tokens-session'
x-github-internal:
  path: '/internal/blackbird/accessible_resources'
  http-method: post
  published: false
  owner: '@github/blackbird'
x-github-releases:
- ghec
- api.github.com
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          actor_id:
            type: integer
            description: Identifies the actor and is either a User or Bot id
          key_prefix:
            type: string
            description: The Redis cache key prefix used to read / write accessible resource cache entries for the actor
          session_id:
            type: string
            description: The id of the session for which to retrieve authorized resources and is either the UserSession#id or the hashed secret token
          token:
            type: string
            description: The secret token used for authentication
          token_kind:
            type: string
            description: The kind of token being used for authentication and is either API or WEB
          request_user_ip:
            type: string
            description: IP address of the original user request
      examples:
        token:
          value: '<Signed Access Token>'
        request_user_ip:
          value: 192.168.1.1
responses:
  '200':
    description: Returns repository and organization resources accessible to this
      session
    content:
      application/json:
        schema:
          type: object
          properties:
            accessible_repository_ids:
              type: array
              description: Set of accessible repository ids
              items:
                type: integer
            authorized_organization_ids:
              type: array
              description: Set of organization ids currently authorized via CAP
              items:
                type: integer
            protected_organization_ids:
              type: array
              description: Set of organization ids not authorized due to CAP
              items:
                type: integer
            outside_collaborator_owner_ids:
              type: array
              description: Set of account ids where the user is an outside collaborator
              items:
                type: integer
            accessible_private_repo_ids:
              type: array
              description: Set of accessible private repository ids
              items:
                type: integer
            accessible_owner_ids:
              type: array
              description: Set of owner ids to which the actor is a member (can access repos). Note this includes the actor's id and any owner_ids from outside collaborator access.
              items:
                type: integer
        examples:
          accessible_repository_ids:
            value: [123, 456, 789]
          authorized_organization_ids:
            value: [123, 456, 789]
          protected_organization_ids:
            value: [123, 456, 789]
          outside_collaborator_owner_ids:
            value: [42]
  '202':
    description: Returns an empty response with confirmation the request was received but no other data is returnable
  '400':
    description: The JSON request body is missing one or more of the required properties listed above
  '401':
    description: The request failed authentication indicating the secret token is no longer valid
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: blackbird
  subcategory: blackbird
