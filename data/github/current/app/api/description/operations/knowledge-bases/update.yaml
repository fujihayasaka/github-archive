---
summary: 'Update a knowledge base'
description: |-
  Updates a knowledge base in the organization.
tags:
  - knowledge-bases
operationId: knowledge-bases/update
externalDocs:
  description: This documentation will be completed at a later date, before we publish the API.
  url: '${externalDocsUrl}/rest/copilot/knowledge-bases#update-a-knowledge-base'
x-github-internal:
  path: /orgs/{org}/knowledge-bases/{knowledge_base_id}
  http-method: put
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
  - api.github.com
  - ghec
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/knowledge-base-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: 'The name of the knowledge base.'
          description:
            type: string
            description: 'The description of the knowledge base.'
          repositories:
            type: array
            maxItems: 30
            description: 'Array of repositories to include in the knowledge base.'
            items:
              type: object
              properties:
                repository_id:
                  description: 'The ID of the repository to include in the knowledge base.'
                  type: integer
                file_path_filters:
                  nullable: true
                  description: 'An optional array of file paths to filter which repository files are included in the knowledge base.'
                  type: array
                  items:
                    type: string
              required:
                - repository_id
        required:
          - name
          - repositories
      examples:
        default:
          value:
            name: 'My knowledge base'
            description: 'This is a knowledge base for my team.'
            repositories:
              - repository_id: 1234
                file_paths:
                  - README.md
                  - other_file.md
              - repository_id: 1296280
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/knowledge-base.yaml'
        examples:
          default:
            $ref: '../../components/examples/knowledge-base.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: copilot
  subcategory: knowledge-bases
