---
summary: Toggle installation repository access between selected and all repositories
description: |-
  Toggle repository access for a GitHub App installation between all repositories and selected repositories. You must provide at least one repository when changing the access to 'selected'. If you change the access to 'all', the repositories list must not be provided.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/change-installation-repository-access-selection
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#toggle-installation-repository-access-between-selected-and-all-repositories'
x-github-internal:
  path: /enterprises/{enterprise}/apps/organizations/{org}/installations/{installation_id}/repositories
  http-method: patch
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/installation-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repository_selection:
            type: string
            description: One of either 'all' or 'selected'
            enum:
              - all
              - selected
          repositories:
            type: array
            description: The repository names to add to the installation. Only required when repository_selection is 'selected'
            items:
              type: string
            maxItems: 50
        required:
        - repository_selection
      examples:
        default:
          summary: Change the repositories accessible to a GitHub App from 'all repositories' to a specified subset.
          value:
            repository_selection: selected
            repositories:
            - hello-world
            - hello-world-2
responses:
  '200':
    description: The GitHub App installation that was updated.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/installation.yaml'
        examples:
          default:
            $ref: '../../components/examples/base-installation.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
