---
summary: Uninstall a GitHub App from an enterprise-owned organization
description: |-
  Uninstall a GitHub App from an organization. Any app installed on the organization can be removed.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/delete-installation
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#uninstall-a-github-app-from-an-enterprise-owned-organization'
x-github-internal:
  path: /enterprises/{enterprise}/apps/organizations/{org}/installations/{installation_id}
  http-method: delete
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/installation-id.yaml'
responses:
  '204':
    description: An empty response indicates that the installation was successfully removed.
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
