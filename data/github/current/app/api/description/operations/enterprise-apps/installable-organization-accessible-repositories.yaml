---
summary: Get repositories belonging to an enterprise-owned organization
description: |-
  List the repositories belonging to an enterprise-owned organization that can be made accessible to a GitHub App installed on that organization. This API provides a shallow list of repositories in the organization, allowing the caller to then add or remove those repositories to an installation in that organization.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/installable-organization-accessible-repositories
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#get-repositories-belonging-to-an-enterprise-owned-organization'
x-github-internal:
  path: /enterprises/{enterprise}/apps/installable_organizations/{org}/accessible_repositories
  http-method: get
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of repositories owned by the enterprise organization on which the authenticated GitHub App is installed.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/accessible-repository.yaml'
        examples:
          default:
            value:
            - id: 1
              name: Hello World
              full_name: octocat/Hello-World
            - id: 2
              login: Goodbye World
              full_name: octocat/Goodbye-World
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
