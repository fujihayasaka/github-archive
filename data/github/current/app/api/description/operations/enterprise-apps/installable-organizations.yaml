---
summary: Get enterprise-owned organizations that can have GitHub Apps installed
description: |-
  List the organizations owned by the enterprise, intended for use by GitHub Apps that are managing applications across the enterprise.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/installable-organizations
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#get-enterprise-owned-organizations-that-can-have-github-apps-installed'
x-github-internal:
  path: '/enterprises/{enterprise}/apps/installable_organizations'
  http-method: get
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of organizations owned by the enterprise on which the authenticated GitHub App is installed.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/installable-organization.yaml'
        examples:
          default:
            value:
            - id: 1
              login: github
            - id: 2
              login: microsoft
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
