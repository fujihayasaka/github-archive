---
summary: 'List GitHub Apps installed on an enterprise-owned organization'
description: |-
  Lists the GitHub App installations associated with the given enterprise-owned organization. This lists all GitHub Apps that have been installed on the organization, regardless of who owns the application.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/organization-installations
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#list-github-apps-installed-on-an-enterprise-owned-organization'
x-github-internal:
  path: /enterprises/{enterprise}/apps/organizations/{org}/installations
  http-method: get
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of GitHub App installations that have been granted access to the organization
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/enterprise-organization-installation.yaml'
        examples:
          default:
            value:
            - $ref: '../../components/examples/enterprise-organization-installation.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
