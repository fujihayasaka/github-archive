---
summary: Install a GitHub App on an enterprise-owned organization
description: |-
  Installs any valid GitHub App on the specified organization owned by the enterprise. If the app is already installed on the organization, and is suspended, it will be unsuspended.
  If the app has a pending installation request, they will all be approved.

  If the app is already installed and has a pending update request, it will be updated to the latest version. If the app is now requesting repository permissions, it will be given access to the repositories listed in the request or fail if no `repository_selection` is provided.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/create-installation
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#install-a-github-app-on-an-enterprise-owned-organization'
x-github-internal:
  path: '/enterprises/{enterprise}/apps/organizations/{org}/installations'
  http-method: post
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
responses:
  '200':
    description: A GitHub App installation that was installed previously.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/installation.yaml'
        examples:
          default:
            $ref: '../../components/examples/base-installation.yaml'
  '201':
    description: A GitHub App installation.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/installation.yaml'
        examples:
          default:
            $ref: '../../components/examples/base-installation.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          client_id:
            type: string
            description: The Client ID of the GitHub App to install.
          repository_selection:
            type: string
            description: |-
              The repository selection for the GitHub App. Must be one of:
              * `all` - the installation can access all repositories in the organization.
              * `selected` - the installation can access only the listed repositories.
              * `none` - no repository permissions are requested. Only use when the app does not request repository permissions.
            enum:
              - all
              - selected
              - none
          repositories:
            type: array
            description: The names of the repositories to which the installation will be granted access. This is the simple name of the repository, not the full name (e.g., `hello-world` not `octocat/hello-world`). This is only required when `repository_selection` is `selected`.
            items:
              type: string
            maxItems: 50
        required:
        - client_id
        - repository_selection
      examples:
        default:
          summary: Example of installing a GitHub App on an organization and granting access to all of its repositories.
          value:
            client_id: Iv2abc123aabbcc
            repository_selection: all
        repository_selection_selected:
          value:
            client_id: Iv2abc123aabbcc
            repository_selection: selected
            repositories:
            - hello-world
            - hello-world-2
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
