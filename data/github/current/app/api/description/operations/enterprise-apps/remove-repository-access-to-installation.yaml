---
summary: Remove repository access from an organization installation
description: |-
  Remove repository access from a GitHub App installed on an organization. You can remove up to 50 repositories at a time. You cannot remove repositories from an app installed on `all` repositories, nor can you remove the last repository for an app. If you attempt to do so, the API will return a 422 Unprocessable Entity error.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/remove-repository-access-to-installation
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#remove-repository-access-from-an-organization-installation'
x-github-internal:
  path: '/enterprises/{enterprise}/apps/organizations/{org}/installations/{installation_id}/repositories/remove'
  http-method: patch
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/installation-id.yaml'
responses:
  '200':
    description: A list of repositories which the authenticated GitHub App has lost access to.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/accessible-repository.yaml'
        examples:
          default:
            value:
            - id: 1
              name: Hello World
              full_name: octocat/Hello-World
            - id: 2
              login: Goodbye World
              full_name: octocat/Goodbye-World
  '422':
    description: The request was well-formed but was unable to be followed due to semantic errors. This can happen if you attempt to remove a repository from an installation that has access to `all` repositories, or if you attempt to remove the last repository from an installation.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          default:
            value:
            - message: Cannot remove the last repository from this installation. Uninstall this application instead.
            - documentation_url: https://docs.github.com/rest/enterprise-admin/organization-installations#remove-repository-access-to-an-organization-installation
            - status: 422
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repositories:
            type: array
            description: The repository names to remove from the installation.
            items:
              type: string
            maxItems: 50
        required:
        - repositories
      examples:
        repositories:
          value:
            repositories:
            - hello-world
            - hello-world-2
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
