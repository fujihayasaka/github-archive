---
summary: Grant repository access to an organization installation
description: |-
  Grant repository access to an organization installation. You can add up to 50 repositories at a time. If the installation already has access to the repository, it will not be added again.

  This API can only be called by a GitHub App installed on the enterprise that owns the organization.
tags:
- apps
operationId: enterprise-apps/grant-repository-access-to-installation
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/organization-installations#grant-repository-access-to-an-organization-installation'
x-github-internal:
  path: '/enterprises/{enterprise}/apps/organizations/{org}/installations/{installation_id}/repositories/add'
  http-method: patch
  published: true
  owner: '@github/ecosystem-apps'
x-github-releases:
- ghec
- ghes: '>= 3.19'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/installation-id.yaml'
responses:
  '200':
    description: A list of repositories which the authenticated GitHub App should be granted access to.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/accessible-repository.yaml'
        examples:
          default:
            value:
            - id: 1
              name: Hello World
              full_name: octocat/Hello-World
            - id: 2
              login: Goodbye World
              full_name: octocat/Goodbye-World
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repositories:
            type: array
            description: The repository names to add to the installation.
            items:
              type: string
            maxItems: 50
        required:
        - repositories
      examples:
        repositories:
          value:
            repositories:
            - hello-world
            - hello-world-2
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: organization-installations
