---
summary: 'Add users to the Copilot subscription for an enterprise'
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Purchases a GitHub Copilot seat for each user specified.
  The enterprise will be billed accordingly.

  Only enterprise owners can purchase Copilot seats for their enterprise members.

  The response contains the total number of new seats that were created and existing seats that were refreshed.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `admin:enterprise` scopes to use this endpoint.
tags:
- copilot
operationId: copilot/add-copilot-seats-for-enterprise-users
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-user-management#add-users-to-the-copilot-subscription-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/copilot/billing/selected_users
  http-method: post
  published: true
  owner: '@github/heart-services'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          selected_usernames:
            type: array
            description: The usernames of the enterprise members to be granted access to GitHub Copilot.
            items:
              type: string
            minItems: 1
        required:
        - selected_usernames
      examples:
        default:
          value:
            selected_usernames:
            - cooluser1
            - hacker2
            - octocat
  required: true
responses:
  '201':
    description: OK
    content:
      application/json:
        schema:
          type: object
          description: The total number of seats created for the specified user(s).
          properties:
            seats_created:
              type: integer
          required:
          - seats_created
        examples:
          default:
            value:
              seats_created: 5
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Copilot is not enabled for this enterprise, billing has not been set up for this enterprise, a public code suggestions policy has not been set for this enterprise, or the enterprise's Copilot access setting is set to enable Copilot for all users or is unconfigured.
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: copilot
  subcategory: copilot-user-management
