---
summary: 'Add users to the Copilot subscription for an organization'
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Purchases a GitHub Copilot seat for each user specified.
  The organization will be billed for each seat based on the organization's Copilot plan. For more information about Copilot pricing, see "[About billing for GitHub Copilot in your organization](${externalDocsUrl}/copilot/managing-copilot/managing-github-copilot-in-your-organization/managing-the-copilot-subscription-for-your-organization/about-billing-for-github-copilot-in-your-organization)."

  Only organization owners can add Copilot seats for their organization members.

  In order for an admin to use this endpoint, the organization must have a Copilot Business or Enterprise subscription and a configured suggestion matching policy.
  For more information about setting up a Copilot subscription, see "[Subscribing to Copilot for your organization](${externalDocsUrl}/copilot/managing-copilot/managing-github-copilot-in-your-organization/managing-the-copilot-subscription-for-your-organization/subscribing-to-copilot-for-your-organization)."
  For more information about setting a suggestion matching policy, see "[Managing policies for Copilot in your organization](${externalDocsUrl}/copilot/managing-copilot/managing-github-copilot-in-your-organization/setting-policies-for-copilot-in-your-organization/managing-policies-for-copilot-in-your-organization#policies-for-suggestion-matching)."

  The response will contain the total number of new seats that were created and existing seats that were refreshed.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `admin:org` scopes to use this endpoint.
tags:
- copilot
operationId: copilot/add-copilot-seats-for-users
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-user-management#add-users-to-the-copilot-subscription-for-an-organization'
x-github-internal:
  path: /orgs/{org}/copilot/billing/selected_users
  http-method: post
  published: true
  owner: '@github/heart-services'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          selected_usernames:
            type: array
            description: The usernames of the organization members to be granted access to GitHub Copilot.
            items:
              type: string
            minItems: 1
        required:
        - selected_usernames
      examples:
        default:
          value:
            selected_usernames:
            - cooluser1
            - hacker2
            - octocat
  required: true
responses:
  '201':
    description: OK
    content:
      application/json:
        schema:
          type: object
          description: The total number of seats created for the specified user(s).
          properties:
            seats_created:
              type: integer
          required:
          - seats_created
        examples:
          default:
            value:
              seats_created: 5
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Copilot Business or Enterprise is not enabled for this organization, billing has not been set up for this organization, a public code suggestions policy has not been set for this organization, or the organization's Copilot access setting is set to enable Copilot for all users or is unconfigured.
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-user-management
