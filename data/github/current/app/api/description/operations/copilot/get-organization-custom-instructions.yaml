---
summary: 'Get the Copilot custom instructions for an organization.'
description: |-
  Retrieves the Copilot custom instructions set for the specified organization.
  Pass the organization's login as the path parameter to fetch its custom
  instructions.

  See more documentation at: https://github.com/github/copilot-experiences/blob/main/docs/custom-instructions/organization-custom-instructions-api.md
tags:
  - copilot
operationId: copilot/get-organization-custom-instructions

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/custom-instructions#get-the-copilot-custom-instructions-for-an-organization'

x-github-internal:
  path: /copilot_internal/org_custom_instructions/{org_login}
  http-method: get
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'

x-github-releases:
  - ghec
  - api.github.com

parameters:
  - name: org_login
    description: The login of the organization to get custom instructions for. For example, `github`.
    in: path
    required: true
    schema:
      type: string

responses:
  '200':
    description: Returns the custom instructions for the organization
    content:
      application/json:
        schema:
          type: object
          properties:
            prompt:
              type: string
              nullable: true
              description: The custom instructions prompt set for the organization, or null if none is set
        examples:
          prompt:
            value: "The organization's custom instructions prompt here"
  '404':
    description: The specified organization was not found, the authenticated user does not have access to it, or Copilot is not enabled for the organization
  '401':
    description: The request failed authentication indicating the secret token is no longer valid

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: copilot
  subcategory: custom-instructions
