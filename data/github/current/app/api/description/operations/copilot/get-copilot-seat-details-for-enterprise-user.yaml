---
summary: Get Copilot seat assignment details for an enterprise user
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Gets the GitHub Copilot seat details for a member of an enterprise who currently has access to GitHub Copilot.

  The seat object contains information about the user's most recent Copilot activity. Users must have telemetry enabled in their IDE for Copilot in the IDE activity to be reflected in `last_activity_at`.

  Only enterprise owners can view Copilot seat assignment details for members of their enterprise.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `read:org` scopes to use this endpoint.
tags:
- copilot
operationId: copilot/get-copilot-seat-details-for-enterprise-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-user-management#get-copilot-seat-assignment-details-for-an-enterprise-user'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/username.yaml'
responses:
  '200':
    description: The user's GitHub Copilot seat details, including usage.
    content:
      application/json:
        schema:
          type: object
          properties:
            total_seats:
              type: integer
              description: The total number of Copilot seats the enterprise is being billed for. Users with access through enterprise, enterprise teams or multiple organizations are only counted once.
            seats:
              type: array
              items:
                $ref: '../../components/schemas/copilot-seat-details.yaml'
        examples:
          default:
            $ref: '../../components/examples/copilot-seats-list.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Copilot Business or Enterprise is not enabled for this enterprise.
