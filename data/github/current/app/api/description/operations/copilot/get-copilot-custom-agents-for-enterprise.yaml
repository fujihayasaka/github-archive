---
summary: Get custom agents for an enterprise
description: |-
  Gets the list of all custom agents defined in the /agents/*.md files in the .github-private repository for the enterprise.

  If no source repository has been configured, returns `null` for `custom_agents`.

  Enterprise owners with read access to AI Controls can use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
- copilot
operationId: copilot/get-copilot-custom-agents-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-custom-agents#get-custom-agents-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/copilot/custom-agents
  http-method: get
  published: true
  owner: '@github/agent-control-plane'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            custom_agents:
              type: array
              description: List of custom agents defined in the repository. Returns `null` if no source repository is configured.
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: The display name of the custom agent (derived from filename).
                  file_path:
                    type: string
                    description: The path to the agent definition file.
                  url:
                    type: string
                    description: The URL to view the agent definition file.
              nullable: true
        examples:
          with_agents:
            summary: Response with custom agents
            value:
              custom_agents:
                - name: Security Reviewer
                  file_path: agents/security_reviewer.md
                  url: https://github.com/my-org/.github-private/blob/main/agents/security_reviewer.md
                - name: Code Documenter
                  file_path: agents/code_documenter.md
                  url: https://github.com/my-org/.github-private/blob/main/agents/code_documenter.md
          no_source:
            summary: Response when no source repository configured
            value:
              custom_agents: null
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    description: Not found or source repository not found
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
        examples:
          repo_not_found:
            summary: Configured source repository not found
            value:
              message: Configured source repository not found
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-custom-agents
