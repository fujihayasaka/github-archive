---
summary: Set Copilot content exclusion rules for an enterprise
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Sets Copilot content exclusion path rules for an enterprise.
  To configure these settings, go to the enterprise's settings on GitHub.
  For more information, see "[Excluding content from GitHub Copilot](${externalDocsUrl}/copilot/managing-copilot/configuring-and-auditing-content-exclusion/excluding-content-from-github-copilot#configuring-content-exclusions-for-your-enterprise)."

  Enterprise owners can set Copilot content exclusion rules for the enterprise.

  OAuth app tokens and personal access tokens (classic) need either the `admin:enterprise` or `copilot` scopes to use this endpoint.

  > [!CAUTION]
  > * At this time, the API does not support comments. When using this endpoint, any existing comments in your rules will be deleted.
  > * At this time, the API does not support duplicate keys. If you submit content exclusions through the API with duplicate keys, only the last occurrence will be saved. Earlier entries with the same key will be overwritten.
tags:
- copilot
operationId: copilot/set-copilot-content-exclusion-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-content-exclusion-management#set-copilot-content-exclusion-rules-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/copilot/content_exclusion
  http-method: put
  published: true
  owner: '@github/copilot-controls-eng'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  description: The content exclusion rules to set
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties:
          type: array
          items:
            anyOf:
              - type: string
                description: The path to the file that will be excluded.
              - type: object
                properties:
                  ifAnyMatch:
                    type: array
                    items:
                      type: string
                required:
                  - ifAnyMatch
                additionalProperties: false
              - type: object
                properties:
                  ifNoneMatch:
                    type: array
                    items:
                      type: string
                required:
                  - ifNoneMatch
                additionalProperties: false
      examples:
        default:
          summary: Example of content exclusion paths
          value:
            git@github.com:*/copilot: ["/__tests__/**"]
            octo-org/octo-repo: ["/src/some-dir/kernel.rs"]
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
        examples:
          default:
            value:
              message: Content exclusion rules updated successfully.
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '413':
    $ref: '../../components/responses/too_large.yaml'
  '422':
    $ref: '../../components/responses/validation_failed_simple.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-content-exclusion-management
