---
summary: 'Remove enterprise teams from the Copilot subscription for an enterprise'
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Sets seats for all members of each enterprise team specified to "pending cancellation".
  This will cause the members of the specified enterprise team(s) to lose access to GitHub Copilot at the end of the current billing cycle unless they retain access through another enterprise team.

  Only enterprise owners can cancel Copilot seats for their enterprise members.

  The response contains the total number of seats set to "pending cancellation".

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `admin:enterprise` scopes to use this endpoint.
tags:
- copilot
operationId: copilot/cancel-copilot-seats-for-enterprise-teams
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-user-management#remove-enterprise-teams-from-the-copilot-subscription-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/copilot/billing/selected_enterprise_teams
  http-method: delete
  published: true
  owner: '@github/heart-services'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          selected_enterprise_teams:
            type: array
            description: List of enterprise team names within the enterprise to which to grant access to GitHub Copilot.
            items:
              type: string
            minItems: 1
        required:
        - selected_enterprise_teams
      examples:
        default:
          value:
            selected_enterprise_teams:
            - engteam1
            - engteam2
            - engteam3
  required: true
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          type: object
          description: The total number of seats set to "pending cancellation" for the members of the specified enterprise team(s).
          properties:
            seats_cancelled:
              type: integer
          required:
          - seats_cancelled
        examples:
          default:
            value:
              seats_cancelled: 5
  '202':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
        examples:
          response:
            value:
              message: Status for delete command
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Copilot Business is not enabled for this enterprise, billing has not been set up for this enterprise or a public code suggestions policy has not been set for this enterprise.
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-user-management
