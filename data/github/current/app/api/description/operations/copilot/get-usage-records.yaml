---
summary: 'Get Copilot usage records for an enterprise'
description: |-
  Returns Copilot usage records for an enterprise.

  Only enterprise owners can access this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `read:enterprise` scope to use this endpoint.
tags:
  - copilot
operationId: copilot/get-usage-records

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-usage#get-copilot-usage-records-for-an-enterprise'

x-github-internal:
  path: /enterprises/{enterprise}/copilot/usage-records
  http-method: get
  published: false
  owner: '@github/agent-control-plane'

x-github-releases:
  - ghec

parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- name: phrase
  description: 'A search phrase to filter usage records. Supported qualifiers: `type` (request/response), `user_id`, `client_provided_request_id`, `created`.'
  in: query
  required: false
  schema:
    type: string
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/audit-log-after.yaml'
- $ref: '../../components/parameters/audit-log-before.yaml'
- $ref: '../../components/parameters/audit-log-order.yaml'

responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type:
                type: string
                description: 'The record type (request or response).'
              user_id:
                type: integer
                description: 'The ID of the user who made the request.'
              enterprise_id:
                type: integer
                description: 'The ID of the enterprise.'
              client_provided_request_id:
                type: string
                description: 'The client-provided request ID.'
              endpoint:
                type: string
                description: 'The API endpoint called.'
              body:
                type: string
                description: 'The request or response body.'
        examples:
          default:
            $ref: '../../components/examples/copilot-usage-records.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'

x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-usage
