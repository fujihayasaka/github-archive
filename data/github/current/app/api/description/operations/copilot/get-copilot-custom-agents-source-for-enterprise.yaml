---
summary: Get the source organization for custom agents in an enterprise
description: |
  Gets the organization and repository configured as the source for custom agent definitions and Copilot CLI client settings in an enterprise.

  Custom agents are enterprise-defined AI agents stored as markdown files in a special repository.
  An enterprise admin configures one organization as the "source" for custom agents and
  Copilot CLI client settings, and that org must have a repo named `.github-private` containing agent
  definitions in `/agents/*.md`, or enterprise-managed AI standards in `copilot/managed-settings.json` (with fallback to `.github/copilot/settings.json`). [Learn more about configuring enterprise-managed AI standards for Copilot clients](${externalDocsUrl}/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-agents/configure-enterprise-plugin-standards).

  Enterprise owners with read access to AI Controls can use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - copilot
operationId: copilot/get-copilot-custom-agents-source-for-enterprise
externalDocs:
  description: API method documentation
  url: ${externalDocsUrl}/rest/copilot/copilot-custom-agents#get-the-source-organization-for-custom-agents-in-an-enterprise
x-github-internal:
  path: /enterprises/{enterprise}/copilot/custom-agents/source
  http-method: get
  published: true
  owner: '@github/agent-control-plane'
x-github-releases:
  - ghec
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
            - organization
            - repository
          properties:
            organization:
              nullable: true
              type: object
              required:
                - id
                - login
              properties:
                id:
                  type: integer
                  description: Unique identifier of the organization
                login:
                  type: string
                  description: Login of the organization
            repository:
              nullable: true
              type: object
              required:
                - id
                - name
                - full_name
              properties:
                id:
                  type: integer
                  description: Unique identifier of the repository
                name:
                  type: string
                  description: Name of the repository
                full_name:
                  type: string
                  description: Full name of the repository including owner
        examples:
          default:
            value:
              organization:
                id: 1
                login: octocat-org
              repository:
                id: 123
                name: .github-private
                full_name: octocat-org/.github-private
  '403':
