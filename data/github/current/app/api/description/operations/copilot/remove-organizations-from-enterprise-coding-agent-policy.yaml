---
summary: Remove organizations from the enterprise coding agent policy
description: |-
  Disables Copilot cloud agent for the specified organizations within the enterprise.

  The enterprise's coding agent policy must be set to `enabled_for_selected_orgs` before
  using this endpoint. Organizations can be specified by login or matched via custom properties.

  Only organizations that have Copilot enabled and belong to the enterprise will be affected.

  Only enterprise owners can remove organizations from the coding agent policy.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `admin:enterprise` scopes to use this endpoint.
tags:
- copilot
operationId: copilot/remove-organizations-from-enterprise-coding-agent-policy
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-coding-agent-management#remove-organizations-from-the-enterprise-coding-agent-policy'
x-github-internal:
  path: /enterprises/{enterprise}/copilot/policies/coding_agent/organizations
  http-method: delete
  published: true
  owner: '@github/agent-control-plane'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  description: The organizations to disable Copilot cloud agent for
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          organizations:
            type: array
            description: List of organization logins within the enterprise to disable Copilot cloud agent for.
            items:
              type: string
          custom_properties:
            type: array
            description: List of custom property filters to match organizations. Organizations matching any of the specified property name/value pairs will be included. This is a one-time operation, setting the property on an organization in the future will not automatically update its coding agent policy.
            items:
              type: object
              properties:
                property_name:
                  type: string
                  description: The name of the custom property to filter by.
                values:
                  type: array
                  description: The values of the custom property to match.
                  items:
                    type: string
              required:
              - property_name
              - values
      examples:
        default:
          summary: Remove organizations that match a login or have a custom property
          value:
            organizations:
            - my-org-1
            - my-org-2
            custom_properties:
            - property_name: department
              values:
              - engineering
              - security
responses:
  '204':
    $ref: '../../components/responses/no_content.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
x-github:
  enabledForGitHubApps: false
  category: copilot
  subcategory: copilot-coding-agent-management
