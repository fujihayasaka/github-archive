---
summary: Set selected repositories for Copilot cloud agent in an organization
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Replaces the list of selected repositories that are enabled for Copilot cloud
  agent in an organization. This method can only be called when the cloud agent
  repository policy is set to `selected`.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
- copilot
operationId: copilot/set-copilot-coding-agent-selected-repositories-for-organization
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-coding-agent-management#set-selected-repositories-for-copilot-cloud-agent-in-an-organization'
x-github-internal:
  path: /orgs/{org}/copilot/coding-agent/permissions/repositories
  http-method: put
  published: true
  owner: '@github/copilot-coding-agent-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          selected_repository_ids:
            description: List of repository IDs to enable for Copilot cloud agent.
            type: array
            items:
              type: integer
              description: Unique identifier of the repository.
        required:
        - selected_repository_ids
      examples:
        default:
          value:
            selected_repository_ids:
            - 32
            - 42
responses:
