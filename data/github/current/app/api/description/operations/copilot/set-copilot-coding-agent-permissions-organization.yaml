---
summary: Set Copilot coding agent permissions for an organization
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Sets the policy for which repositories in an organization can use Copilot coding agent.

  Organization owners can configure whether Copilot coding agent is enabled for
  all repositories, selected repositories, or no repositories owned by the organization.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
- copilot
operationId: copilot/set-copilot-coding-agent-permissions-organization
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-coding-agent-management#set-copilot-coding-agent-permissions-for-an-organization'
x-github-internal:
  path: /orgs/{org}/copilot/coding-agent/permissions
  http-method: put
  published: true
  owner: '@github/copilot-coding-agent-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          enabled_repositories:
            type: string
            description: The policy for which repositories can use Copilot coding agent. Can be one of `all`, `selected`, or `none`.
            enum:
            - all
            - selected
            - none
        required:
        - enabled_repositories
      examples:
        default:
          value:
            enabled_repositories: selected
responses:
  '204':
    description: No Content
  '500':
