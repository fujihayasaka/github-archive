---
summary: Get Copilot cloud agent permissions for an organization
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Gets information about which repositories in an organization have been enabled
  or disabled for the Copilot cloud agent.

  Organization owners can configure whether Copilot cloud agent is enabled for
  all repositories, selected repositories, or no repositories owned by organization.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
- copilot
operationId: copilot/get-copilot-coding-agent-permissions-organization
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-coding-agent-management#get-copilot-cloud-agent-permissions-for-an-organization'
x-github-internal:
  path: /orgs/{org}/copilot/coding-agent/permissions
  http-method: get
  published: true
  owner: '@github/copilot-coding-agent-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            enabled_repositories:
              type: string
              description: The policy for which repositories can use Copilot cloud agent. Can be one of `all`, `selected`, or `none`.
              enum:
              - all
              - selected
              - none
            selected_repositories_url:
              type: string
              description: The URL for the selected repositories endpoint. Only present when `enabled_repositories` is `selected`.
          required:
          - enabled_repositories
        examples:
          all_enabled:
            summary: All repositories enabled
            value:
              enabled_repositories: all
          selected_enabled:
            summary: Selected repositories enabled
            value:
              enabled_repositories: selected
              selected_repositories_url: https://api.github.com/orgs/my-org/copilot/coding-agent/permissions/repositories
          none_enabled:
            summary: No repositories enabled
            value:
              enabled_repositories: none
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-coding-agent-management
