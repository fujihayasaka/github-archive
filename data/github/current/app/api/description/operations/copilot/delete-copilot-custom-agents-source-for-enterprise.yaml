---
summary: Delete the custom agents source for an enterprise
description: |-
  Removes the custom agents source configuration for the enterprise.
  This effectively disables custom agents for the enterprise by removing
  the reference to the source organization's `.github-private` repository.

  Note: This does not delete the `.github-private` repository or any agent
  definition files. It only removes the association between the enterprise
  and the source repository.

  Enterprise owners with write access to AI Controls can use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
- copilot
operationId: copilot/delete-copilot-custom-agents-source-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-custom-agents#delete-the-custom-agents-source-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/copilot/custom-agents/source
  http-method: delete
  published: true
  owner: '@github/agent-control-plane'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-custom-agents
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
responses:
  '204':
    description: No Content - The custom agents source was successfully removed.
  '404':
    description: Not found - Enterprise not found, feature not enabled, or no custom agents source is configured.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
  '403':
    description: Forbidden - The user does not have enterprise admin access.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
