---
summary: 'Get Copilot metrics for an enterprise team'
description: |-
  > [!NOTE]
  > This endpoint is only applicable to dedicated enterprise accounts for Copilot Business. See "[About enterprise accounts for Copilot Business](${externalDocsUrl}/admin/copilot-business-only/about-enterprise-accounts-for-copilot-business)."

  Use this endpoint to see a breakdown of aggregated metrics for various GitHub Copilot features. See the response schema tab for detailed metrics definitions.

  The response contains metrics for up to 28 days prior. Metrics are processed once per day for the previous day,
  and the response will only include data up until yesterday. In order for an end user to be counted towards these metrics,
  they must have telemetry enabled in their IDE.

  > [!NOTE]
  > This endpoint will only return results for a given day if the enterprise team had **five or more members with active Copilot licenses** on that day, as evaluated at the end of that day.

  To access this endpoint, the Copilot Metrics API access policy must be enabled or set to "no policy" for the enterprise within GitHub settings.
  Only owners and billing managers for the enterprise that contains the enterprise team can view Copilot metrics for the enterprise team.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `read:enterprise` scopes to use this endpoint.
tags:
- copilot
operationId: copilot/copilot-metrics-for-enterprise-team
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-metrics#get-copilot-metrics-for-an-enterprise-team'

x-github-internal:
  path: /enterprises/{enterprise}/team/{team_slug}/copilot/metrics
  http-method: get
  published: true
  owner: '@github/copilot-metrics-reviewers'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- $ref: '../../components/parameters/enterprise-team-slug.yaml'
- name: since
  description: 'Show usage metrics since this date. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DDTHH:MM:SSZ`). Maximum value is 28 days ago.'
  in: query
  required: false
  schema:
    type: string
- name: until
  description: 'Show usage metrics until this date. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DDTHH:MM:SSZ`) and should not preceed the `since` date if it is passed.'
  in: query
  required: false
  schema:
    type: string
- $ref: '../../components/parameters/page.yaml'
- name: per_page
  description: The number of days of metrics to display per page (max 28). For more information, see "[Using pagination in the REST API](${externalDocsUrl}/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
  in: query
  schema:
    type: integer
    default: 28
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/copilot-usage-metrics-day.yaml'
        examples:
          default:
            $ref: '../../components/examples/copilot-usage-metrics-for-day.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/usage_metrics_api_disabled.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: copilot
  subcategory: copilot-metrics
