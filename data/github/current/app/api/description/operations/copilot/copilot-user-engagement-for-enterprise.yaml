---
summary: 'Get Copilot user engagement data for an enterprise'
description: |-
  Use this endpoint to retrieve a breakdown of user engagement for GitHub Copilot by feature. See the public docs page <placeholder, link coming> for detailed response definitions.

  The response contains user engagement reports for up to 28 days in the past. User engagement reports are processed once per day for the previous day, and the response will only include data up until yesterday. In order for an end user to be counted towards these engagement metrics, they must have telemetry enabled in their IDE.

  To access this endpoint, the Copilot Metrics API access policy must be enabled or set to “no policy” for the enterprise within GitHub settings. Only enterprise owners and billing managers can view Copilot user engagement for the enterprise.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `read:enterprise` scopes to use this endpoint.
tags:
  - copilot
operationId: copilot/copilot-user-engagement-for-enterprise

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/user-engagement#get-copilot-user-engagement-data-for-an-enterprise'

# Describe how this operation is accessible
# This is essential for us to generate the final OpenAPI description
