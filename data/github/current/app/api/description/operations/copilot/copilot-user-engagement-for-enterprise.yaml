# might receive. Check out existing parameter definitions
# in `app/api/description/components/parameters`
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- name: since
  description: 'Get Copilot user engagement since a given date. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DDTHH:MM:SSZ`). Maximum value is 28 days ago.'
  in: query
  required: false
  schema:
    type: string
- name: until
  description: 'Get Copilot user engagement until a given date. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DDTHH:MM:SSZ`) and should not precede the `since` date if `since` is also provided.'
  in: query
  required: false
  schema:
    type: string

