  # The format if the operation does not have a subcategory:
  # url: '${externalDocsUrl}/rest/copilot#get-copilot-usage-for-enterprise-via-direct-data-access'
  url: '${externalDocsUrl}/rest/copilot/direct-data#get-copilot-usage-for-enterprise-via-direct-data-access'

