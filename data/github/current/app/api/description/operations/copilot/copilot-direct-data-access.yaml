- name: since
  description: 'Get Copilot usage data since a given date. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DDTHH:MM:SSZ`). Maximum value is 28 days ago.'
  in: query
  required: false
  schema:
    type: string
- name: until
  description: 'Get Copilot usage data until a given date. This is a timestamp in [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format (`YYYY-MM-DDTHH:MM:SSZ`) and should not precede the `since` date if `since` is also provided.'
  in: query
