---
summary: 'Get Copilot usage for enterprise via direct data access'
description: |-
  Use this endpoint to retrieve a report of GitHub Copilot usage events, via Parquet files. New data will load on a go-forward basis, and will be retained for up to one year. New data is processed once per day for the previous day, and the response will only include data up until yesterday. Requests for data may include up to two weeks of data, per request. A Copilot user must have telemetry enabled in their IDE to be represented within the dataset.

  To access this endpoint, the Copilot Metrics API access policy must be enabled or set to “no policy” for the enterprise within GitHub settings. Only enterprise owners and billing managers can view Copilot usage data for the enterprise.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `read:enterprise` scopes to use this endpoint.
tags:
  - copilot
operationId: copilot/copilot-direct-data-access

externalDocs:
  description: API method documentation
  # You must fill out the URL.
  # The format if the operation has a subcategory:
