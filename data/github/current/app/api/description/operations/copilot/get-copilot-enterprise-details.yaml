---
summary: 'Get Copilot seat and policies information for an enterprise'
description: |-
  Gets information about an enterprise's Copilot subscription, including seat breakdown
  and feature policies. To configure policies, go to your enterprise's settings on GitHub.com.

  For more information about policies, see "[Managing policies for Copilot in your enterprise](${externalDocsUrl}/enterprise-cloud@latest/copilot/managing-copilot/managing-copilot-for-your-enterprise/managing-policies-and-features-for-copilot-in-your-enterprise)."

  Only enterprise owners can view details about the enterprise's Copilot Business or Copilot Enterprise subscription.

  OAuth app tokens and personal access tokens (classic) need either the `manage_billing:copilot` or `read:enterprise` scopes to use this endpoint.
tags:
  - copilot
operationId: copilot/get-copilot-enterprise-details

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot/copilot-user-management#get-copilot-seat-and-policies-information-for-an-enterprise'

