---
summary: 'List private registries for an organization'
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Lists all private registry configurations available at the organization-level without revealing their encrypted
  values.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
  - private-registries
operationId: private-registries/list-org-private-registries
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/private-registries/organization-configurations#list-private-registries-for-an-organization'
x-github-internal:
  path: /orgs/{org}/private-registries
  http-method: get
  published: true
  owner: '@github/advisory-database'
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
  - $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
            - total_count
            - configurations
          properties:
            total_count:
              type: integer
            configurations:
              type: array
              items:
                $ref: '../../components/schemas/org-private-registry-configuration.yaml'
        examples:
          default:
            $ref: '../../components/examples/org-private-registry-configurations-paginated.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: private-registries
