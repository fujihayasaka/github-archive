---
summary: Update a private registry for an organization

description: |-

  Updates a private registry configuration with an encrypted value for an organization. Encrypt your secret using [LibSodium](https://libsodium.gitbook.io/doc/bindings_for_other_languages). For more information, see "[Encrypting secrets for the REST API](${externalDocsUrl}/rest/guides/encrypting-secrets-for-the-rest-api)."

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.

tags:
- private-registries

operationId: private-registries/update-org-private-registry

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/private-registries/organization-configurations#update-a-private-registry-for-an-organization'

parameters:
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/secret-name.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          registry_type:
            description: The registry type.
            type: string
            enum:
            - maven_repository
            - nuget_feed
            - goproxy_server
            - npm_registry
            - rubygems_server
            - cargo_registry
            - composer_repository
            - docker_registry
            - git_source
            - helm_registry
            - hex_organization
            - hex_repository
            - pub_repository
            - python_index
            - terraform_registry
          url:
            description: The URL of the private registry.
            type: string
            format: uri
          username:
            description: >-
              The username to use when authenticating with the private registry.
              This field should be omitted if the private registry does not require a username for authentication.
            type: string
            nullable: true
          encrypted_value:
            description: >-
              The value for your secret, encrypted with
              [LibSodium](https://libsodium.gitbook.io/doc/bindings_for_other_languages)
              using the public key retrieved from the
              [Get private registries public key for an organization](${externalDocsUrl}/rest/private-registries/organization-configurations#get-private-registries-public-key-for-an-organization)
              endpoint.
            type: string
            pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4})$'
          key_id:
            description: The ID of the key you used to encrypt the secret.
            type: string
          visibility:
            description: >-
              Which type of organization repositories have access to the private registry.
              `selected` means only the repositories specified by `selected_repository_ids` can access the private registry.
            type: string
            enum:
            - all
            - private
            - selected
          selected_repository_ids:
            description: >-
              An array of repository IDs that can access the organization private registry.
              You can only provide a list of repository IDs when `visibility` is set to `selected`.
              This field should be omitted if `visibility` is set to `all` or `private`.
            type: array
            items:
              type: integer
      examples:
        default:
          value:
            username: monalisa
            encrypted_value: c2VjcmV0
            key_id: '012345678912345678'

responses:
  '204':
    description: Response
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'

x-github-releases:
- api.github.com
- ghec
- ghes: '>= 3.16'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: private-registries
  subcategory: organization-configurations

x-github-internal:
  path: /orgs/{org}/private-registries/{secret_name}
  http-method: patch
  owner: '@github/advisory-database'
  published: true
