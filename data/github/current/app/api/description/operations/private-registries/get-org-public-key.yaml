---
summary: 'Get private registries public key for an organization'
description: |-

  Gets the org public key, which is needed to encrypt private registry secrets. You need to encrypt a secret before you can create or update secrets.

  OAuth tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
  - private-registries
operationId: private-registries/get-org-public-key
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/private-registries/organization-configurations#get-private-registries-public-key-for-an-organization'
x-github-internal:
  path: /orgs/{org}/private-registries/public-key
  http-method: get
  published: true
  owner: '@github/advisory-database'
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'
parameters:
  - $ref: '../../components/parameters/org.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
            - key_id
            - key
          properties:
            key_id:
              description: The identifier for the key.
              example: '012345678912345678'
              type: string
            key:
              description: The Base64 encoded public key.
              example: '2Sg8iYjAxxmI2LvUXpJjkYrMxURPc8r+dB7TJyvv1234'
              type: string
        examples:
          default:
            $ref: '../../components/examples/private-registries-public-key.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: private-registries
  subcategory: organization-configurations
