---
summary: 'Get a private registry for an organization'
description: |-

  Get the configuration of a single private registry defined for an organization, omitting its encrypted value.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
  - private-registries
operationId: private-registries/get-org-private-registry

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/private-registries/organization-configurations#get-a-private-registry-for-an-organization'

x-github-internal:
  path: /orgs/{org}/private-registries/{secret_name}
  http-method: get
  published: true
  owner: '@github/advisory-database'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'

parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/secret-name.yaml'

responses:
  '200':
    description: The specified private registry configuration for the organization
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/org-private-registry-configuration.yaml'
        examples:
          default:
            $ref: '../../components/examples/org-private-registry-configuration.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'


x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  # category and subcategory affect where the operation appears in https://docs.github.com/rest
  category: private-registries
  subcategory: organization-configurations
