---
summary: Create a hosted compute network configuration for an enterprise
description: Creates a hosted compute network configuration for an enterprise.
tags:
- enterprise-admin
- hosted-compute
operationId: hosted-compute/create-network-configuration-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/network-configurations#create-a-hosted-compute-network-configuration-for-an-enterprise'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            description: Name of the network configuration. Must be between 1 and 100 characters and may only contain upper and lowercase letters a-z, numbers 0-9, `.`, `-`, and `_`.
            type: string
          compute_service:
            description: The hosted compute service to use for the network configuration.
            type: string
            enum:
            - none
            - actions
          network_settings_ids:
            type: array
            minItems: 1
            maxItems: 1
            description: A list of identifiers of the network settings resources to use for the network configuration. Exactly one resource identifier must be specified in the list.
            items:
              type: string
          failover_network_settings_ids:
            x-unpublished: Unpublished until 'actions_runner_private_network_failover_enabled' feature flag is removed
            type: array
            minItems: 0
            maxItems: 1
            description: A list of identifiers of the failover network settings resources to use for the network configuration. Exactly one resource identifier must be specified in the list.
            items:
              type: string
          failover_network_enabled:
            x-unpublished: Unpublished until 'actions_runner_private_network_failover_enabled' feature flag is removed
            type: boolean
            description: Indicates whether the failover network resource is enabled.
        required:
        - name
        - network_settings_ids
      examples:
        default:
          value:
            name: my-network-configuration
            network_settings_ids:
            - 23456789ABDCEF1
            compute_service: actions
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/network-configuration.yaml'
        examples:
          default:
            $ref: '../../components/examples/network-configuration.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: network-configurations
x-github-internal:
  path: '/enterprises/{enterprise}/network-configurations'
  http-method: post
  service-tier: 1
  owner: '@github/hosted-runners'
  published: true
