---
summary: List campaigns for an organization
description: |-
  Lists campaigns in an organization.

  The authenticated user must be an owner or security manager for the organization to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
- campaigns
operationId: campaigns/list-org-campaigns
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/campaigns/campaigns#list-campaigns-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/page.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/direction.yaml'
- name: state
  description: If specified, only campaigns with this state will be returned.
  in: query
  required: false
  schema:
    $ref: '../../components/schemas/campaign-state.yaml'
- name: sort
  description: The property by which to sort the results.
  in: query
  required: false
  schema:
    type: string
    enum:
    - created
    - updated
    - ends_at
    - published
    default: created
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/campaign-summary.yaml'
        examples:
          default:
            $ref: '../../components/examples/campaign-org-items.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-internal:
  path: /orgs/{org}/campaigns
  http-method: get
  service-tier: 2
  owner: '@github/code-scanning-experiences'
  published: true
