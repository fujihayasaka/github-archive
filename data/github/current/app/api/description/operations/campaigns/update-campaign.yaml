---
summary: Update a campaign
description: |-
  Updates a campaign in an organization.

  The authenticated user must be an owner or security manager for the organization to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
- campaigns
operationId: campaigns/update-campaign
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/campaigns/campaigns#update-a-campaign'
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: campaign_number
  description: The campaign number.
  in: path
  required: true
  schema:
    type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        properties:
          name:
            description: The name of the campaign
            type: string
            minLength: 1
            maxLength: 50
          description:
            description: A description for the campaign
            type: string
            minLength: 1
            maxLength: 255
          managers:
            description: The logins of the users to set as the campaign managers. At this time, only a single manager can be supplied.
            type: array
            minItems: 1
            maxItems: 1
            items:
              type: string
          ends_at:
            description: The end date and time of the campaign, in ISO 8601 format':' YYYY-MM-DDTHH:MM:SSZ.
            type: string
            format: date-time
          state:
            $ref: '../../components/schemas/campaign-state.yaml'
      examples:
        default:
          value:
            name: Critical CodeQL alerts
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/campaign-summary.yaml'
        examples:
          default:
            $ref: '../../components/examples/campaign-summary.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Unprocessable Entity
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-internal:
  path: /orgs/{org}/campaigns/{campaign_number}
  http-method: patch
  service-tier: 2
  owner: '@github/code-scanning-experiences'
  published: false
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: campaigns
  subcategory: campaigns
