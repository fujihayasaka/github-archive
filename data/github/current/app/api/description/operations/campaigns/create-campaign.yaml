---
summary: Create a campaign for an organization
description: |-
  Create a campaign for an organization

  The authenticated user must be an owner or security manager for the organization to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `security_events` scope to use this endpoint.

  Fine-grained tokens must have the "Code scanning alerts" repository permissions (read) on all repositories included
  in the campaign.
tags:
- campaigns
operationId: campaigns/create-campaign
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/campaigns/campaigns#create-a-campaign-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        properties:
          name:
            description: 'The name of the campaign'
            type: string
            minLength: 1
            maxLength: 50
          description:
            description: 'A description for the campaign'
            type: string
            minLength: 1
            maxLength: 255
          managers:
            description: 'The logins of the users to set as the campaign managers. At this time, only a single manager can be supplied.'
            type: array
            minItems: 1
            maxItems: 1
            items:
              description: 'The login of each manager'
              type: string
          ends_at:
            description: 'The end date and time of the campaign. The date must be in the future.'
            type: string
            format: date-time
          code_scanning_alerts:
            description: 'The code scanning alerts to include in this campaign'
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              properties:
                repository_id:
                  type: integer
                  description: 'The repository id'
                alert_numbers:
                  type: array
                  description: 'The alert numbers'
                  minItems: 1
                  items:
                    type: integer
              required:
                - repository_id
                - alert_numbers
        required:
        - name
        - description
        - managers
        - ends_at
        - code_scanning_alerts
      examples:
        default:
          value:
            name: Critical CodeQL alerts
            description: Address critical alerts before they are exploited to prevent breaches, protect sensitive data, and mitigate financial and reputational damage.
            managers:
              - octocat
            ends_at: '2024-03-14T00:00:00Z'
            code_scanning_alerts:
              - repository_id: 1296269
                alert_numbers:
                  - 1
                  - 2
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/campaign-summary.yaml'
        examples:
          default:
            $ref: '../../components/examples/campaign-summary.yaml'
  '400':
    description: Bad Request
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Unprocessable Entity
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
  '429':
    description: Too Many Requests
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-internal:
  path: /orgs/{org}/campaigns
  http-method: post
  service-tier: 2
  owner: '@github/code-scanning-experiences'
  published: false
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: campaigns
  subcategory: campaigns
