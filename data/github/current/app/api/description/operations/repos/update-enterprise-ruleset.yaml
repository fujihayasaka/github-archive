---
summary: 'Update an enterprise repository ruleset'
description: |-
  Update a ruleset for an enterprise.
tags:
- repos
operationId: repos/update-enterprise-ruleset
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/rules#update-an-enterprise-repository-ruleset'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
- name: ruleset_id
  description: The ID of the ruleset.
  in: path
  required: true
  schema:
    type: integer
requestBody:
  description: 'Request body'
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "The name of the ruleset."
          target:
            type: string
            description: The target of the ruleset
            enum:
            - branch
            - tag
            - push
            - repository
          enforcement:
            $ref: '../../components/schemas/repository-rule-enforcement.yaml'
          bypass_actors:
            type: array
            description: The actors that can bypass the rules in this ruleset
            items:
              $ref: '../../components/schemas/repository-ruleset-bypass-actor.yaml'
          conditions:
            $ref: '../../components/schemas/enterprise-ruleset-conditions.yaml'
          rules:
            description: An array of rules within the ruleset.
            type: array
            items:
              $ref: '../../components/schemas/repository-rule.yaml'
      examples:
        default:
          value:
            name: super cool ruleset
            target: repository
            enforcement: active
            bypass_actors:
            - actor_id: 234
              actor_type: Team
              bypass_mode: always
            conditions:
              org_name:
                include:
                - important_org
                exclude:
                - unimportant_org
            rules:
            - type: repository_delete
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/repository-ruleset.yaml'
        examples:
          default:
            $ref: '../../components/examples/enterprise-ruleset.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-internal:
  path: /enterprises/{enterprise}/rulesets/{ruleset_id}
  http-method: put
  published: false
  owner: '@github/branch-protections'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: rules
