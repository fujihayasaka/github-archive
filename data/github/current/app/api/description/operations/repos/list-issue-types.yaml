---
summary: List issue types for a repository
description: 'Lists issue types available for a repository (inherited from its organization
  owner, with any per-repository overrides applied).

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use
  this endpoint.

  Fine-grained access tokens require the "Metadata" repository permission (read).'
tags:
- repos
operationId: repos/list-issue-types
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/repos/issue-types#list-issue-types-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/issue-type.yaml'
        examples:
          default:
            $ref: '../../components/examples/issue-type-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
