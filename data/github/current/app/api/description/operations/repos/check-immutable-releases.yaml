---
summary: 'Check if immutable releases are enabled for a repository'
description: |-
  Shows whether immutable releases are enabled or disabled. Also identifies whether immutability is being
  enforced by the repository owner.  The authenticated user must have admin read access to the repository.
tags:
  - repos
operationId: repos/check-immutable-releases
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/repos/repos#check-if-immutable-releases-are-enabled-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/immutable-releases
  http-method: get
  published: false
  owner: '@github/package-security'
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.19'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
responses:
  '200':
    description: Response if immutable releases are enabled
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/check-immutable-releases.yaml'
        examples:
          default:
            value:
              enabled: true
              enforced_by_owner: false
  '404':
    description: Not Found if immutable releases are not enabled for the repository
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: repos
  subcategory: repos
