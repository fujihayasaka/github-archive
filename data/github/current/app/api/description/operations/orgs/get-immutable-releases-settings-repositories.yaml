---
summary: 'List selected repositories for immutable releases enforcement'
description: |-
  List all of the repositories that have been selected for immutable releases enforcement in an organization.

  OAuth tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
  - orgs
operationId: orgs/get-immutable-releases-settings-repositories

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/orgs#list-selected-repositories-for-immutable-releases-enforcement'

x-github-internal:
  path: /orgs/{org}/settings/immutable-releases/repositories
  http-method: get
  published: false
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.19'

parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/page.yaml'
  - $ref: '../../components/parameters/per-page.yaml'

responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
            - total_count
            - repositories
          properties:
            total_count:
              type: integer
            repositories:
              type: array
              items:
                $ref: '../../components/schemas/minimal-repository.yaml'
        examples:
          default:
            $ref: '../../components/examples/public-repository-paginated.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: orgs
