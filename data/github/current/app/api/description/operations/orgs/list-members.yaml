---
summary: List organization members
description: List all users who are members of an organization. If the authenticated
  user is also a member of this organization then both concealed and public members
  will be returned.
tags:
- orgs
operationId: orgs/list-members
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/members#list-organization-members'
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: filter
  description: "Filter members returned in the list. `2fa_disabled` means that only members without [two-factor authentication](https://github.com/blog/1614-two-factor-authentication)
    enabled will be returned. `2fa_insecure` means that only members with [insecure 2FA methods](${externalDocsUrl}/organizations/keeping-your-organization-secure/managing-two-factor-authentication-for-your-organization/requiring-two-factor-authentication-in-your-organization#requiring-secure-methods-of-two-factor-authentication-in-your-organization) will be returned. These options are only available for organization owners."
  in: query
  required: false
  schema:
    type: string
    enum:
    - 2fa_disabled
    - 2fa_insecure
    - all
    default: all
- name: role
  description: "Filter members returned by their role."
  in: query
  required: false
  schema:
    type: string
    enum:
    - all
    - admin
    - member
    default: all
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/simple-user.yaml'
        examples:
          default:
            $ref: '../../components/examples/simple-user-items.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- ghec
- ghes: '>= 2.18'
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: members
x-github-internal:
  path: '/orgs/{org}/members'
  http-method: get
  service-tier: 2
  owner: '@github/meao'
  published: true
