---
summary: Create or update external property values for organization repositories
description: |-
  Create new or update existing external property values for repositories in a batch that belong to an organization.
  Each target repository will have its external property values updated to match the values provided in the request.

  A maximum of 30 repositories can be updated in a single request.

  Using a value of `null` for an external property will remove or 'unset' the property value from the repository.

  To use this endpoint, the authenticated GitHub App must have the `organization_external_properties_for_repos:write` permission.
tags:
- orgs
operationId: orgs/external-properties-for-repos-create-or-update-organization-values
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/custom-properties#create-or-update-external-property-values-for-organization-repositories'
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repository_names:
            type: array
            description: The names of repositories that the external property values will be applied to.
            items:
              type: string
            minItems: 1
            maxItems: 30
          properties:
            type: array
            description: List of external property names and associated values to apply to the repositories.
            items:
              $ref: '../../components/schemas/custom-property-value.yaml'
        required:
        - repository_names
        - properties
      examples:
        default:
          $ref: '../../components/examples/org-repo-update-custom-property-values.yaml'
responses:
  '204':
    description: No Content when external property values are successfully created or updated
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: custom-properties
x-github-internal:
  path: '/orgs/{org}/properties/external/values'
  http-method: patch
  service-tier: 2
  owner: '@github/repos-application'
  published: false
