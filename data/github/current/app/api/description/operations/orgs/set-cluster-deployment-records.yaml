---
summary: 'Set cluster deployment records'
description: |-
    Set deployment records for a given cluster.
    If proposed records in the 'deployments' field have identical 'cluster', 'logical_environment',
    'physical_environment', and 'deployment_name' values as existing records, the existing records will be updated.
    If no existing records match, new records will be created.
    Note: Artifacts are uniquely identified by the combination of their repository and digest fields. If two entries in the deployments
    array resolve to the same repository and have identical digest fields but differing name and version fields, the endpoint will use
    the artifact name and version from the record processed first, since a single artifact (identified by repository and digest) can
    only have one name and version.
tags:
  - orgs
operationId: orgs/set-cluster-deployment-records

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/artifact-metadata#set-cluster-deployment-records'

x-github-internal:
  path: /orgs/{org}/artifacts/metadata/deployment-record/cluster/{cluster}
  http-method: post
  published: true
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: '../../components/parameters/org.yaml'
  - name: cluster
    in: path
    description: The cluster name.
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-zA-Z0-9._-]+$'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          logical_environment:
            type: string
            description: The stage of the deployment.
            minLength: 1
            maxLength: 128
          physical_environment:
            type: string
            description: The physical region of the deployment.
            maxLength: 128
          deployments:
            type: array
            description: The list of deployments to record.
            maxItems: 1000
            items:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the artifact.
                  minLength: 1
                  maxLength: 256
                digest:
                  type: string
                  description: The hex encoded digest of the artifact.
                  minLength: 71
                  maxLength: 71
                  pattern: '^sha256:[a-f0-9]{64}$'
                version:
                  type: string
                  description: The artifact version.
                  maxLength: 100
                  x-multi-segment: true
                  example: 1.2.3
                status:
                  type: string
                  description: The deployment status of the artifact.
                  default: deployed
                  enum:
                    - deployed
                    - decommissioned
                deployment_name:
                  type: string
                  description: |
                    The unique identifier for the deployment represented by the new record. To accommodate differing
                    containers and namespaces within a record set, the following format is recommended:
                    {namespaceName}-{deploymentName}-{containerName}.
                    The deployment_name must be unique across all entries in the deployments array.
                  minLength: 1
                  maxLength: 256
                github_repository:
                  type: string
                  description: |-
                    The name of the GitHub repository associated with the artifact. This should be used
                    when there are no provenance attestations available for the artifact. The repository
                    must belong to the organization specified in the path parameter.

                    If a provenance attestation is available for the artifact, the API will use
                    the repository information from the attestation instead of this parameter.
                  maxLength: 100
                  pattern: '^[A-Za-z0-9.\-_]+$'
                  example: my-github-repo
                tags:
                  type: object
                  description: Key-value pairs to tag the deployment record.
                  additionalProperties:
                    type: string
                runtime_risks:
                  type: array
                  description: A list of runtime risks associated with the deployment.
                  maxItems: 4
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - critical-resource
                      - internet-exposed
                      - lateral-movement
                      - sensitive-data
              required:
                - name
                - deployment_name
                - digest
          return_records:
            type: boolean
            default: true
            description: |
              If true, the endpoint will return the set records in the response body
        required:
          - logical_environment
          - deployments
      examples:
        default:
          value:
            logical_environment: prod
            physical_environment: pacific-east
            deployments:
              - name: awesome-image
                digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
                version: 2.1.0
                status: deployed
                deployment_name: deployment-pod
                tags:
                  owning-team: platform
                runtime_risks:
                  - sensitive-data

responses:
  '200':
    description: |
      Deployment records created or updated successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            total_count:
              description: The number of deployment records created
              type: integer
            deployment_records:
              type: array
              items:
                $ref: '../../components/schemas/artifact-deployment-record.yaml'
          required:
            - total_count
        examples:
          default:
            $ref: '../../components/examples/artifact-deployment-record-list.yaml'
  '403':
    description: Forbidden
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          insufficient_repo_permissions:
            value:
              message:
                cause: 'artifact metadata write permission required on one or more repositories'
                repositories: [123, 345]
  '404':
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          not_found:
            value:
              message:
                cause: 'One or more repositories do not exist'
                repositories: ["repoA", "repoB"]

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: artifact-metadata
