---
summary: 'Create artifactory storage record'
description: |-
  Create metadata storage record for an artifact stored on Artifactory.

tags:
- orgs
operationId: orgs/create-artifactory-storage-record
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/orgs#create-artifactory-storage-record'
x-github-internal:
  path: /orgs/{org}/artifacts/storage-record/artifactory
  http-method: post
  published: false
  owner: '@github/package-security'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          artifact_name:
            type: string
            description: The name of the artifact.
            example: libfoo-1.2.3
            minLength: 1
          sha256:
            type: string
            description: The SHA256 hex encoded digest of the artifact.
            example: 0ecbaa601dba202129058746c7d8e3f282d0efb5fff0...
            minLength: 64
            maxLength: 64
            pattern: '^[a-f0-9]{64}$'
          path:
            type: string
            format: uri
            description: The path of the artifact.
            example: com/google/bar/libfoo-1.2.3
          artifact_url:
            type: string
            format: uri
            pattern: '^https://'
            description: The base URL of the artifact registry.
            example: https://reg.example.com/artifactory/bar/com/google/libfoo-1.2.3
            minLength: 1
          repo_key:
            type: string
            description: The repository name within the registry.
            example: bar
        required:
          - artifact_name
          - sha256
          - artifact_url
      examples:
        default:
          value:
            artifact_name: libfoo-1.2.3
            sha256: 1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
            artifact_url: https://reg.example.com/artifactory/bar/com/google/libfoo-1.2.3
            repoKey: bar
            path: com/google/bar/libfoo-1.2.3

responses:
  '200':
    description: Artifact metadata storage record stored successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            total_count:
              type: integer
              example: 1
            storage_records:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  digest:
                    type: string
                  artifact_url:
                    type: string
                  registry_url:
                    type: string
                  repository:
                    type: string
                  status:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        examples:
          default:
            value:
              total_count: 1
              storage_records:
                - name: libfoo-1.2.3
                  digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
                  artifact_url: https://reg.example.com/artifactory/bar/libfoo-1.2.3
                  registry_url: https://reg.example.com/artifactory/
                  repository: bar
                  status: active
                  created_at: '2023-10-01T12:00:00Z'
                  updated_at: '2023-10-01T12:00:00Z'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: orgs
