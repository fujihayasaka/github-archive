---
summary: 'Create artifact metadata storage record'
description: |-
  Create metadata storage records for artifacts associated with an organization.
  This endpoint will create a new artifact storage record on behalf of any artifact matching the provided digest and
  associated with a repository owned by the organization.

tags:
- orgs
operationId: orgs/create-artifact-storage-record
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/artifact-metadata#create-artifact-metadata-storage-record'
x-github-internal:
  path: /orgs/{org}/artifacts/metadata/storage-record
  http-method: post
  published: true
  owner: '@github/package-security'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the artifact.
            example: libfoo-1.2.3
            minLength: 1
          digest:
            type: string
            description: The digest of the artifact (algorithm:hex-encoded-digest).
            example: sha256:0ecbaa601dba202129058746c7d8e3f282d0efb5fff0...
            minLength: 71
            maxLength: 71
            pattern: '^sha256:[a-f0-9]{64}$'
          artifact_url:
            type: string
            format: uri
            pattern: '^https://'
            description: The URL where the artifact is stored.
            example: https://reg.example.com/artifactory/bar/libfoo-1.2.3
          path:
            type: string
            format: uri
            description: The path of the artifact.
            example: com/github/bar/libfoo-1.2.3
          registry_url:
            type: string
            format: uri
            pattern: '^https://'
            description: The base URL of the artifact registry.
            example: https://reg.example.com/artifactory/
            minLength: 1
          repository:
            type: string
            description: The repository name within the registry.
            example: bar
          status:
            type: string
            description: The status of the artifact (e.g., active, inactive).
            example: active
            enum:
              - active
              - eol
              - deleted
            default: active
        required:
          - name
          - digest
          - registry_url
      examples:
        default:
          value:
            name: libfoo-1.2.3
            digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
            artifact_url: https://reg.example.com/artifactory/bar/libfoo-1.2.3
            registry_url: https://reg.example.com/artifactory/
            repository: bar
            status: active

responses:
  '200':
    description: Artifact metadata storage record stored successfully.
    content:
      application/json:
        schema:
            type: object
            properties:
              total_count:
                type: integer
                example: 1
              storage_records:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    digest:
                      type: string
                    artifact_url:
                      type: string
                      nullable: true
                    registry_url:
                      type: string
                    repository:
                      type: string
                      nullable: true
                    status:
                      type: string
                    created_at:
                      type: string
                    updated_at:
                      type: string
        examples:
          default:
            value:
              total_count: 1
              storage_records:
                - name: libfoo-1.2.3
                  digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
                  artifact_url: https://reg.example.com/artifactory/bar/libfoo-1.2.3
                  registry_url: https://reg.example.com/artifactory/
                  repository: bar
                  status: active
                  created_at: '2023-10-01T12:00:00Z'
                  updated_at: '2023-10-01T12:00:00Z'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: artifact-metadata
