---
summary: 'Set immutable releases settings for an organization'
description: |-
  Sets the immutable releases policy for repositories in an organization.

  OAuth tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
  - orgs
operationId: orgs/set-immutable-releases-settings

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/orgs#set-immutable-releases-settings-for-an-organization'

x-github-internal:
  path: /orgs/{org}/settings/immutable-releases
  http-method: put
  published: false
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.19'

parameters:
  - $ref: '../../components/parameters/org.yaml'

responses:
  '204':
    description: Response

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          enforced_repositories:
            type: string
            description: The policy that controls how immutable releases are enforced in the organization.
            enum:
              - all
              - none
              - selected
            example: all
          selected_repository_ids:
            type: array
            description: An array of repository ids for which immutable releases enforcement should be applied.
              You can only provide a list of repository ids when the `enforced_repositories` is set to `selected`.
              You can add and remove individual repositories using the
              [Enable a selected repository for immutable releases in an organization](${externalDocsUrl}/rest/orgs/orgs#enable-a-selected-repository-for-immutable-releases-in-an-organization)
              and
              [Disable a selected repository for immutable releases in an organization](${externalDocsUrl}/rest/orgs/orgs#disable-a-selected-repository-for-immutable-releases-in-an-organization)
              endpoints.
            items:
              type: integer
        required:
          - enforced_repositories
      examples:
        default:
          value:
            enforced_repositories: all

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: orgs
