---
summary: 'Get cluster deployment records job status'
description: |-
    Get the status and results of a previously created cluster deployment records job.
tags:
  - orgs
operationId: orgs/get-cluster-deployment-records-job

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/artifact-metadata#get-cluster-deployment-records-job-status'

x-github-internal:
  path: /orgs/{org}/artifacts/metadata/deployment-record/cluster/{cluster}/jobs/{job_id}
  http-method: get
  published: false
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: '../../components/parameters/org.yaml'
  - name: cluster
    in: path
    description: The cluster name.
    required: true
    schema:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[a-zA-Z0-9._-]+$'
  - name: job_id
    in: path
    description: The ID of the job.
    required: true
    schema:
      type: integer

responses:
  '200':
    description: |
      Job status retrieved successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            job_id:
              description: The ID of the job.
              type: integer
            status:
              description: The current status of the job.
              type: string
              enum:
                - pending
                - processing
                - completed
                - failed
            started_at:
              description: When the job started processing (only present when processing, completed, or failed).
              type: string
              format: date-time
            total_count:
              description: The number of records successfully mutated (only present when completed).
              type: integer
            errors:
              description: Processing errors (only present when completed or failed).
              type: array
              items:
                type: object
          required:
            - job_id
            - status
        examples:
          default:
            value:
              job_id: 123
              status: completed
              started_at: '2026-06-10T12:00:00Z'
              total_count: 5
  '404':
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: artifact-metadata
