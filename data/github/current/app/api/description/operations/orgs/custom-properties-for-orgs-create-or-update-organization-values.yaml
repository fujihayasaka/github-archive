---
summary: Create or update custom property values for an organization
description: |-
  Create new or update existing custom property values for an organization.
  To remove a custom property value from an organization, set the property value to `null`.

  The organization must belong to an enterprise.

  Access requirements:
  - Organization admins
  - OAuth tokens and personal access tokens (classic) with the `admin:org` scope
  - Actors with the organization-level "edit custom properties for an organization" fine-grained permission
tags:
- orgs
operationId: orgs/custom-properties-for-orgs-create-or-update-organization-values
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/custom-properties-for-orgs#create-or-update-custom-property-values-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          properties:
            type: array
            description: A list of custom property names and associated values to apply to the organization.
            items:
              $ref: '../../components/schemas/custom-property-value.yaml'
        required:
        - properties
      examples:
        default:
          $ref: '../../components/examples/create-or-update-custom-properties-values.yaml'
responses:
  '204':
    description: No Content when custom property values are successfully created or updated
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: custom-properties-for-orgs
x-github-internal:
  path: '/organizations/{org}/org-properties/values'
  http-method: patch
  service-tier: 2
  owner: '@github/repos'
  published: false
