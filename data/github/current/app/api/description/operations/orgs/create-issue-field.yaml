---
summary: Create issue field for an organization
description: |-
  Creates a new issue field for an organization.

  You can find out more about issue fields in [Managing issue fields in an organization](${externalDocsUrl}/issues/TODO).

  To use this endpoint, the authenticated user must be an administrator for the organization. OAuth app tokens and
  personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
- orgs
operationId: orgs/create-issue-field
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/issue-fields#create-issue-field-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/organization-create-issue-field.yaml'
      examples:
        default:
          value:
            name: 'Priority'
            description: Level of importance for the issue
            data_type: 'single_select'
            options:
              - name: 'High'
                description: High priority
                color: 'red'
              - name: 'Medium'
                description: Medium priority
                color: 'yellow'
              - name: 'Low'
                description: Low priority
                color: 'green'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/issue-field.yaml'
        examples:
          default:
            $ref: '../../components/examples/issue-field.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed_simple.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: issue-fields
x-github-internal:
  path: '/orgs/{org}/issue-fields'
  http-method: post
  service-tier: 1
  owner: '@github/issues'
  published: false
