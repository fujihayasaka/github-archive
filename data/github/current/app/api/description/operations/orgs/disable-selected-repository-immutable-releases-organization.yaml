---
summary: Disable a selected repository for immutable releases in an organization
description: |-
  Removes a repository from the list of selected repositories that are enforced for immutable releases in an organization. To use this endpoint, the organization immutable releases policy for `enforced_repositories` must be configured to `selected`.

  OAuth tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
operationId: orgs/disable-selected-repository-immutable-releases-organization
tags:
  - orgs

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/orgs#disable-a-selected-repository-for-immutable-releases-in-an-organization'

x-github-internal:
  path: '/orgs/{org}/settings/immutable-releases/repositories/{repository_id}'
  http-method: delete
  published: false
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.19'

parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/repository-id.yaml'

responses:
  '204':
    description: Response

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: orgs
