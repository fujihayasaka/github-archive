---
summary: 'List artifact deployment records'
description: |-
    List deployment records for an artifact metadata associated with an organization.
tags:
  - orgs
operationId: orgs/list-artifact-deployment-records

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/artifact-metadata#list-artifact-deployment-records'

x-github-internal:
  path: /orgs/{org}/artifacts/{subject_digest}/metadata/deployment-records
  http-method: get
  published: false
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec

parameters:
 - $ref: '../../components/parameters/org.yaml'
 - $ref: '../../components/parameters/subject-digest.yaml'

responses:
  '200':
    description: Successful response
    content:
      application/json:
        schema:
          type: object
          properties:
            total_count:
              description: The number of deployment records for this digest and organization
              example: 3
              type: integer
            deployment_records:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  digest:
                    type: string
                  logical_environment:
                    type: string
                  physical_environment:
                    type: string
                  cluster:
                    type: string
                  deployment_name:
                    type: string
                  tags:
                    type: object
                    additionalProperties:
                      type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
        examples:
          default:
            value:
              total_count: 1
              deployment_records:
                id: 123
                digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
                logical_environment: prod
                physical_environment: pacific-east
                cluster: moda-1
                deployment_name: prod-deployment
                tags:
                  data: sensitive
                created: '2011-01-26T19:14:43Z'
                updated_at: '2011-01-26T19:14:43Z'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: artifact-metadata
