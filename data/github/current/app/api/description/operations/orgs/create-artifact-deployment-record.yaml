---
summary: 'Create an artifact deployment record'
description: |-
    Create or update deployment records for an artifact associated
    with an organization.
    This endpoint allows you to record information about a specific
    artifact, such as its name, digest, environments, cluster, and
    deployment.
    The deployment name has to be uniqe within a cluster (i.e a
    combination of logical, physical environment and cluster) as it
    identifies unique deployment.
    Multiple requests for the same combination of logical, physical
    environment, cluster and deployment name will only create one
    record, successive request will update the existing record.
    This allows for a stable tracking of a deployment where the actual
    deployed artifact can change over time.

tags:
  - orgs
operationId: orgs/create-artifact-deployment-record

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/artifact-metadata#create-an-artifact-deployment-record'

x-github-internal:
  path: /orgs/{org}/artifacts/metadata/deployment-record
  http-method: post
  published: true
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: '../../components/parameters/org.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the artifact.
            minLength: 1
            maxLength: 256
            example: libfoo
          digest:
            type: string
            description: The hex encoded digest of the artifact.
            minLength: 71
            maxLength: 71
            pattern: '^sha256:[a-f0-9]{64}$'
          version:
            type: string
            description: The artifact version.
            minLength: 1
            maxLength: 100
            x-multi-segment: true
            example: 1.2.3
          status:
            type: string
            description: The status of the artifact. Can be either deployed or decommissioned.
            enum:
              - deployed
              - decommissioned
          logical_environment:
            type: string
            description: The stage of the deployment.
            minLength: 1
            maxLength: 128
          physical_environment:
            type: string
            description: The physical region of the deployment.
            maxLength: 128
          cluster:
            type: string
            description: The deployment cluster.
            maxLength: 128
          deployment_name:
            type: string
            description: |
              The unique identifier for the deployment represented by the new record. To accommodate differing
              containers and namespaces within a cluster, the following format is recommended:
              {namespaceName}-{deploymentName}-{containerName}.
            maxLength: 256
          tags:
            type: object
            description: The tags associated with the deployment.
            additionalProperties:
              type: string
            maxProperties: 5
          runtime_risks:
            type: array
            description: A list of runtime risks associated with the deployment.
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              enum:
                - critical-resource
                - internet-exposed
                - lateral-movement
                - sensitive-data
          github_repository:
            type: string
            description: |-
              The name of the GitHub repository associated with the artifact. This should be used
              when there are no provenance attestations available for the artifact. The repository
              must belong to the organization specified in the path parameter.

              If a provenance attestation is available for the artifact, the API will use
              the repository information from the attestation instead of this parameter.
            minLength: 1
            maxLength: 100
            pattern: '^[A-Za-z0-9.\-_]+$'
            example: my-github-repo
          return_records:
            type: boolean
            default: true
            description: |
              If true, the endpoint will return the created or updated record in the response body.
        required:
            - name
            - digest
            - status
            - logical_environment
            - deployment_name
      examples:
        default:
          value:
            name: awesome-image
            digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
            status: deployed
            logical_environment: prod
            physical_environment: pacific-east
            cluster: moda-1
            deployment_name: deployment-pod
            tags:
              data-access: sensitive

responses:
  '200':
    description: Artifact deployment record stored successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            total_count:
              description: The number of deployment records created
              type: integer
            deployment_records:
              type: array
              items:
                $ref: '../../components/schemas/artifact-deployment-record.yaml'
          required:
            - total_count
        examples:
          default:
            $ref: '../../components/examples/artifact-deployment-record-list.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: artifact-metadata
