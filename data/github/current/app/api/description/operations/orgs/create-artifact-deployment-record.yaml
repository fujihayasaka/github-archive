---
summary: 'Create an artifact deployment record'
description: |-
    Create or update deployment records for an artifact associated with an organization.
    This endpoint allows you to record information about a specific artifact, such as its name, digest, environments, cluster, and deployment.
tags:
  - orgs
operationId: orgs/create-artifact-deployment-record

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/artifact-metadata#create-an-artifact-deployment-record'

x-github-internal:
  path: /orgs/{org}/artifacts/metadata/deployment-record
  http-method: post
  published: true
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: '../../components/parameters/org.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the artifact.
            minLength: 1
            example: libfoo
          digest:
            type: string
            description: The hex encoded digest of the artifact.
            minLength: 71
            maxLength: 71
            pattern: '^sha256:[a-f0-9]{64}$'
          version:
            type: string
            description: The artifact version.
            minLength: 1
            maxLength: 100
            x-multi-segment: true
            example: 1.2.3
          status:
            type: string
            description: The status of the artifact. Can be either deployed or decommissioned.
            enum:
              - deployed
              - decommissioned
          logical_environment:
            type: string
            description: The stage of the deployment.
          physical_environment:
            type: string
            description: The physical region of the deployment.
          cluster:
            type: string
            description: The deployment cluster.
          deployment_name:
            type: string
            description: The name of the deployment.
          tags:
            type: object
            description: The tags associated with the deployment.
            additionalProperties:
              type: string
            maxProperties: 5
          runtime_risks:
            type: array
            description: A list of runtime risks associated with the deployment.
            maxItems: 4
            uniqueItems: true
            items:
              type: string
              enum:
                - critical-resource
                - internet-exposed
                - lateral-movement
                - sensitive-data
          github_repository:
            type: string
            description: |-
              The name of the GitHub repository associated with the artifact. This should be used
              when there are no provenance attestations available for the artifact. The repository
              must belong to the organization specified in the path parameter.

              If a provenance attestation is available for the artifact, the API will use
              the repository information from the attestation instead of this parameter.
            minLength: 1
            maxLength: 100
            pattern: '^[A-Za-z0-9.\-_]+$'
            example: my-github-repo
        required:
            - name
            - digest
            - status
            - logical_environment
            - deployment_name
      examples:
        default:
          value:
            name: awesome-image
            digest: sha256:1bb1e949e55dcefc6353e7b36c8897d2a107d8e8dca49d4e3c0ea8493fc0bc72
            status: deployed
            logical_environment: prod
            physical_environment: pacific-east
            cluster: moda-1
            deployment_name: deployment-pod
            tags:
              data-access: sensitive

responses:
  '200':
    description: Artifact deployment record stored successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            total_count:
              description: The number of deployment records created
              type: integer
            deployment_records:
              type: array
              items:
                $ref: '../../components/schemas/artifact-deployment-record.yaml'
        examples:
          default:
            $ref: '../../components/examples/artifact-deployment-record-list.yaml'

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: artifact-metadata
