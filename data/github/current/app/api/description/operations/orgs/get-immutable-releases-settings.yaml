---
summary: 'Get immutable releases settings for an organization'
description: |-
  Gets the immutable releases policy for repositories in an organization.

  OAuth tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint.
tags:
  - orgs
operationId: orgs/get-immutable-releases-settings

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/orgs#get-immutable-releases-settings-for-an-organization'

x-github-internal:
  path: /orgs/{org}/settings/immutable-releases
  http-method: get
  published: false
  owner: '@github/package-security'

x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.19'

parameters:
  - $ref: '../../components/parameters/org.yaml'

responses:
  '200':
    description: Immutable releases settings response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/immutable-releases-organization-settings.yaml'
        examples:
          default:
            value:
              enforced_repositories: all

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: orgs
