---
summary: Get all custom property values for an organization
description: |-
  Gets all custom property values that are set for an organization.

  The organization must belong to an enterprise.

  Access requirements:
  - Organization admins
  - OAuth tokens and personal access tokens (classic) with the `read:org` scope
  - Actors with the organization-level "read custom properties for an organization" fine-grained permission or above
tags:
- orgs
operationId: orgs/custom-properties-for-orgs-get-organization-values
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/orgs/custom-properties-for-orgs#get-all-custom-property-values-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/custom-property-value.yaml'
        examples:
          default:
            $ref: '../../components/examples/custom-property-values.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: orgs
  subcategory: custom-properties-for-orgs
x-github-internal:
  path: '/organizations/{org}/org-properties/values'
  http-method: get
  service-tier: 2
  owner: '@github/repos'
  published: false
