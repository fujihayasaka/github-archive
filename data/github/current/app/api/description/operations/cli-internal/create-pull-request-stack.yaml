---
summary: 'Create a pull request stack'
description: |-
  Creates a stack from an ordered list of pull request numbers. The pull requests
  must form a base-to-head chain where each PR's base ref matches the previous
  PR's head ref.

  > [!NOTE]
  > This endpoint is restricted to the GitHub CLI and is not available to other clients.
operationId: cli-internal/create-pull-request-stack
tags:
- pull-request-stacks
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/cli-internal/create-pull-request-stack#create-a-pull-request-stack'
x-github-resource-owner: '@github/pull-requests'
x-github-releases:
- api.github.com
- ghec
x-github-internal:
  path: /repositories/{repository_id}/cli_internal/pulls/stacks
  http-method: post
  published: false
  owner: '@github/pull-requests'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - pull_request_numbers
        properties:
          pull_request_numbers:
            type: array
            description: An ordered list of pull request numbers forming the stack from bottom to top.
            items:
              type: integer
            minItems: 2
      examples:
        default:
          value:
            pull_request_numbers:
            - 1
            - 2
            - 3
responses:
  '201':
    description: Stack created
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: The ID of the newly created stack.
        examples:
          default:
            value:
              id: 12345
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: cli-internal
  subcategory: create-pull-request-stack
