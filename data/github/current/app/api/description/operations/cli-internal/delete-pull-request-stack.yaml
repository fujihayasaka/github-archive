---
summary: 'Delete a pull request stack'
description: |-
  Deletes a stack and all of its entries. The pull requests themselves are not
  affected.

  > [!NOTE]
  > This endpoint is restricted to the GitHub CLI and is not available to other clients.
operationId: cli-internal/delete-pull-request-stack
tags:
- pull-request-stacks
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/cli-internal/delete-pull-request-stack#delete-a-pull-request-stack'
x-github-resource-owner: '@github/pull-requests'
x-github-releases:
- api.github.com
- ghec
x-github-internal:
  path: /repositories/{repository_id}/cli_internal/pulls/stacks/{stack_id}
  http-method: delete
  published: false
  owner: '@github/pull-requests'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
- name: stack_id
  in: path
  required: true
  description: The unique identifier of the stack.
  schema:
    type: integer
responses:
  '204':
    description: Stack deleted
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '409':
    description: Conflict - the stack is currently being modified by another request
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: cli-internal
  subcategory: delete-pull-request-stack
