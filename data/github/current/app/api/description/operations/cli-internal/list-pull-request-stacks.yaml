---
summary: 'List pull request stacks'
description: |-
  Lists all pull request stacks in a repository. Each stack includes its
  database ID and an ordered list of pull request numbers.

  > [!NOTE]
  > This endpoint is restricted to the GitHub CLI and is not available to other clients.
operationId: cli-internal/list-pull-request-stacks
tags:
- pull-request-stacks
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/cli-internal/list-pull-request-stacks#list-pull-request-stacks'
x-github-resource-owner: '@github/pull-requests'
x-github-releases:
- api.github.com
- ghec
x-github-internal:
  path: /repositories/{repository_id}/cli_internal/pulls/stacks
  http-method: get
  published: false
  owner: '@github/pull-requests'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
responses:
  '200':
    description: List of stacks
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: The ID of the stack.
              pull_requests:
                type: array
                description: Ordered list of pull request numbers in the stack from bottom to top.
                items:
                  type: integer
        examples:
          default:
            value:
            - id: 12345
              pull_requests:
              - 10
              - 11
              - 12
            - id: 12346
              pull_requests:
              - 13
              - 14
              - 15
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: cli-internal
  subcategory: list-pull-request-stacks
