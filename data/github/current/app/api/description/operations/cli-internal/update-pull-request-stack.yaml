---
summary: 'Update a pull request stack'
description: |-
  Updates a stack with an ordered list of pull request numbers. Callers must
  send the full list of pull request numbers, including existing entries. New
  entries can only be added at the end of the stack, and must continue the
  chain where each PR's base branch is the head branch of the previous entry in
  the stack.

  > [!NOTE]
  > This endpoint is restricted to the GitHub CLI and is not available to other clients.
operationId: cli-internal/update-pull-request-stack
tags:
- pull-request-stacks
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/cli-internal/update-pull-request-stack#update-a-pull-request-stack'
x-github-resource-owner: '@github/pull-requests'
x-github-releases:
- api.github.com
- ghec
x-github-internal:
  path: /repositories/{repository_id}/cli_internal/pulls/stacks/{stack_id}
  http-method: put
  published: false
  owner: '@github/pull-requests'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
- name: stack_id
  in: path
  required: true
  description: The unique identifier of the stack.
  schema:
    type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - pull_request_numbers
        properties:
          pull_request_numbers:
            type: array
            description: The full ordered list of pull request numbers forming the stack from bottom to top, including existing entries.
            items:
              type: integer
            minItems: 2
      examples:
        default:
          value:
            pull_request_numbers:
            - 1
            - 2
            - 3
responses:
  '200':
    description: Stack updated
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: integer
              description: The ID of the updated stack.
        examples:
          default:
            value:
              id: 12345
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '409':
    description: Conflict - the stack has been modified since the client last fetched it
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: cli-internal
  subcategory: update-pull-request-stack
