---
summary: List dismissal requests for code scanning alerts for an organization
description: |-
  Lists dismissal requests for code scanning alerts for all repositories in an organization.

  The user must be authorized to review dismissal requests for the organization.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - code-scanning
operationId: code-scanning/list-org-dismissal-requests
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-scanning/alert-dismissal-requests#list-dismissal-requests-for-code-scanning-alerts-for-an-organization'
x-github-internal:
  path: /orgs/{org}/dismissal-requests/code-scanning
  http-method: get
  published: true
  owner: '@github/code-scanning-experiences'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: code-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.19'
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/alert-dismissal-reviewer-name.yaml'
  - $ref: '../../components/parameters/alert-dismissal-requester-name.yaml'
  - $ref: '../../components/parameters/alert-dismissal-time-period.yaml'
  - $ref: '../../components/parameters/alert-dismissal-request-status.yaml'
  - $ref: '../../components/parameters/repository-name-in-query.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
  - $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of alert dismissal requests.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/code-scanning-alert-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/code-scanning-alert-dismissal-request-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
