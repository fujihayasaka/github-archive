---
summary: Get a dismissal request for a code scanning alert for a repository
description: |-
  Gets a dismissal request to dismiss a code scanning alert in a repository.

  Delegated alert dismissal must be enabled on the repository.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - code-scanning
operationId: code-scanning/get-dismissal-request-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-scanning/alert-dismissal-requests#get-a-dismissal-request-for-a-code-scanning-alert-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/code-scanning/{dismissal_request_number}
  http-method: get
  published: false
  owner: '@github/code-scanning-experiences'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: code-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: dismissal_request_number
   in: path
   required: true
   description: The number that identifies the dismissal request in a repository.
   schema:
     type: integer
responses:
  '200':
    description: A single dismissal request.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/code-scanning-alert-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/code-scanning-alert-dismissal-request-item.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
