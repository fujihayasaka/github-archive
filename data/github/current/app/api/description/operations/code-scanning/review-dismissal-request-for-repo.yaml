---
summary: Review a dismissal request for a code scanning alert for a repository
description: |-
  Approve or deny a dismissal request to dismiss a code scanning alert in a repository.

  Delegated alert dismissal must be enabled on the repository and the user must be a dismissal reviewer to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - code-scanning
operationId: code-scanning/review-dismissal-request-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-scanning/alert-dismissal-requests#review-a-dismissal-request-for-a-code-scanning-alert-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/code-scanning/dismissal-requests/{dismissal_request_number}
  http-method: patch
  published: false
  owner: '@github/code-scanning-experiences'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: code-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: dismissal_request_number
   in: path
   required: true
   description: The number that identifies the dismissal request in a repository.
   schema:
     type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: string
            description: The review action to perform on the bypass request.
            enum:
              - approve
              - reject
          message:
            type: string
            description: A message to include with the review. Has a maximum character length of 2048.
        required:
          - status
          - message
      examples:
        default:
          value:
            status: "approve"
            message: Used in tests.
responses:
  '204':
    description: Successful update
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
