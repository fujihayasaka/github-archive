---
summary: Update a cost center name
description: Updates an existing cost center name.
tags:
  - billing
operationId: billing/update-cost-center
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/billing#update-a-cost-center-name'
parameters:
  - name: enterprise
    in: path
    required: true
    schema:
      type: string
    description: The slug version of the enterprise name
  - name: cost_center_id
    in: path
    required: true
    schema:
      type: string
    description: The unique identifier of the cost center
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: The new name for the cost center
      examples:
        update-cost-center:
          summary: Update cost center name example
          value:
            name: "New Cost Center Name"
responses:
  '200':
    $ref: '../../components/responses/cost_center.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '409':
    $ref: '../../components/responses/conflict.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-releases:
  - ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: billing
x-github-internal:
  path: '/enterprises/{enterprise}/settings/billing/cost-centers/{cost_center_id}'
  http-method: patch
  published: false
  owner: '@github/metered-billing-reviewers'
