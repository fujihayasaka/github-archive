---
summary: Create a budget for an organization
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Creates a new budget for an organization. The authenticated user must be an
  organization admin or billing manager.
tags:
  - billing
operationId: billing/create-organization-budget
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/billing/budgets#create-a-budget-for-an-organization'
parameters:
  - $ref: '../../components/parameters/org.yaml'
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          budget_amount:
            type: integer
            description: The budget amount in whole dollars. For license-based products, this represents the number of licenses.
          prevent_further_usage:
            type: boolean
            description: >-
              Whether to prevent additional spending once the budget is exceeded
          budget_alerting:
            type: object
            properties:
              will_alert:
                type: boolean
                description: Whether alerts are enabled for this budget
              alert_recipients:
                type: array
                items:
                  type: string
                description: Array of user login names who will receive alerts
          budget_scope:
            type: string
            description: >-
              The scope of the budget for this organization.
              Use 'organization' for org-level budgets or 'repository' for
              repo-specific budgets within the organization.
            enum:
              - organization
              - repository
          budget_entity_name:
            type: string
            description: The name of the entity to apply the budget to
            default: ""
          budget_type:
            description: The type of pricing for the budget
            oneOf:
              - type: string
                enum:
                  - ProductPricing
              - type: string
                enum:
                  - SkuPricing
              - type: string
                enum:
                  - BundlePricing
                x-unpublished: "Tracked by https://github.com/github/gitcoin/issues/24902"
          budget_product_sku:
            type: string
            description: >-
              A single product or SKU that will be covered in the budget
      examples:
        create-organization-budget:
          summary: Create organization budget example
          value:
            budget_amount: 500
            prevent_further_usage: true
            budget_scope: organization
            budget_entity_name: ""
            budget_type: ProductPricing
            budget_product_sku: actions
            budget_alerting:
              will_alert: false
              alert_recipients: []
responses:
  '200':
    description: Budget created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: "Budget successfully created."
            budget:
              type: object
              properties:
                id:
                   type: string
                   description: ID of the budget.
                budget_amount:
                  type: number
                  format: float
                  description: The budget amount in whole dollars. For license-based products, this represents the number of licenses.
                prevent_further_usage:
                  type: boolean
                  description: Whether to prevent additional spending once the budget is exceeded
                budget_alerting:
                  type: object
                  required:
                    - will_alert
                    - alert_recipients
                  properties:
                    will_alert:
                      type: boolean
                      description: Whether alerts are enabled for this budget
                    alert_recipients:
                      type: array
                      items:
                        type: string
                      description: Array of user login names who will receive alerts
                budget_scope:
                  type: string
                  description: The scope of the budget
                  enum:
                    - enterprise
                    - organization
                    - repository
                    - cost_center
                budget_entity_name:
                  type: string
                  description: The name of the entity to apply the budget to
                  default: ""
                budget_type:
                  description: The type of pricing for the budget
                  oneOf:
                    - type: string
                      enum:
                        - ProductPricing
                    - type: string
                      enum:
                        - SkuPricing
                    - type: string
                      enum:
                        - BundlePricing
                      x-unpublished: "Tracked by https://github.com/github/gitcoin/issues/24902"
                budget_product_sku:
                  type: string
                  description: A single product or SKU that will be covered in the budget
        examples:
          create-organization-budget:
            value:
              message: "Budget successfully created."
              budget:
                $ref: '../../components/responses/budget.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    description: Insufficient permissions
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          insufficient-permissions:
            value:
              message: "Insufficient permissions to create a budget."
              documentation_url: "https://docs.github.com/rest/billing/budgets#create-a-budget-for-an-organization"
  '404':
    description: Feature not enabled or organization not found
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          feature-not-enabled:
            value:
              message: "Not Found"
              documentation_url: >-
                https://docs.github.com/rest/billing/budgets#create-a-budget-for-an-organization
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          server-error:
            value:
              message: "Unable to create budget."
              documentation_url: >-
                https://docs.github.com/rest/billing/budgets#create-a-budget-for-an-organization
x-github-releases:
  - api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: billing
  subcategory: budgets
x-github-internal:
  path: '/organizations/{org}/settings/billing/budgets'
  http-method: post
  published: false
  owner: '@github/metered-billing-reviewers'
