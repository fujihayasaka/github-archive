---
summary: 'Create a new cost center'
description: |-
  Creates a new cost center for an enterprise. The authenticated user must be an enterprise admin.
tags:
  - billing
operationId: billing/create-cost-center
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/billing#create-a-new-cost-center'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: The name of the cost center (max length 255 characters)
      examples:
        example-1:
          summary: Example request to create a cost center
          value:
            name: "Engineering Team"
responses:
  '200':
    description: Cost center created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for the cost center
            name:
              type: string
              description: Name of the cost center
            azure_subscription:
              type: string
              nullable: true
              description: Azure subscription ID associated with the cost center. Only present for cost centers linked to Azure subscriptions.
            state:
              type: string
              description: State of the cost center.
              enum:
                - active
                - deleted
            resources:
              type: array
              description: List of resources assigned to this cost center
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Type of resource (User, Org, or Repo)
                  name:
                    type: string
                    description: Name/login of the resource
        examples:
          example-1:
            summary: Example response for a created cost center
            value:
              id: "abc123"
              name: "Engineering Team"
              resources: []
  '400':
    description: Bad request
    content:
      application/json:
        examples:
          missing-name:
            summary: Missing name
            value:
              message: "Bad request: name is required."
          limit-reached:
            summary: Cost center limit reached
            value:
              message: "This enterprise is already at the cost center limit of 1000 active cost centers."
  '409':
    description: Conflict
    content:
      application/json:
        examples:
          duplicate-name:
            summary: Duplicate name
            value:
              message: "There's already a cost center created with that name."
  '500':
    description: Internal server error
    content:
      application/json:
        examples:
          internal-error:
            summary: Internal error
            value:
              message: "An internal server error occurred. Please try again later."
x-github-releases:
  - ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: billing
x-github-internal:
  path: '/enterprises/{enterprise}/settings/billing/cost-centers'
  http-method: post
  published: true
  owner: '@github/metered-billing-reviewers'
