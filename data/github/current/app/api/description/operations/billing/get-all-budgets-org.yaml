---
summary: 'Get all budgets for an organization'
description: |-
  Gets all budgets for an organization. The authenticated user must be an organization admin or billing manager.
  Each page returns up to 100 budgets.
tags:
- billing
operationId: billing/get-all-budgets-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/billing/budgets#get-all-budgets-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: page
  description: The page number of the results to fetch.
  in: query
  schema:
    type: integer
    default: 1
- name: per_page
  description: The number of results per page (max 100).
  in: query
  schema:
    type: integer
    default: 10
- name: scope
  description: Filter budgets by scope type.
  in: query
  schema:
    type: string
    enum:
      - enterprise
      - organization
      - repository
      - cost_center
      - multi_user_customer
      - user
- name: exclude_scope
  description: Exclude budgets by scope type.
  in: query
  x-unpublished: Parameter is in development and not yet ready for public documentation
  schema:
    type: string
    enum:
      - enterprise
      - organization
      - repository
      - cost_center
      - multi_user_customer
      - user
- name: user
  description: Filter consumed amount details for budgets by the specified user login.
  in: query
  schema:
    type: string
responses:
  '200':
   $ref: '../../components/responses/get_all_budgets.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
  - api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: billing
  subcategory: budgets
x-github-internal:
  path: '/organizations/{org}/settings/billing/budgets'
  http-method: get
  published: true
  owner: '@github/metered-billing-reviewers'
