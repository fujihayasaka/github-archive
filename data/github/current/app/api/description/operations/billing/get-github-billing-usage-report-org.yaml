---
summary: Get billing usage report for an organization
description: |-
  Gets a report of the total usage for an organization. To use this endpoint, you must be an administrator of an organization within an enterprise or an organization account.

  **Note:** This endpoint is only available to organizations with access to the enhanced billing platform. For more information, see "[About the enhanced billing platform](${externalDocsUrl}/billing/using-the-new-billing-platform)."

tags:
  - billing
operationId: billing/get-github-billing-usage-report-org

