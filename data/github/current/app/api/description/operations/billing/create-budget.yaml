---
summary: Create a budget
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Creates a new budget for an enterprise. The authenticated user must be an enterprise admin, organization admin, or billing manager of the enterprise.
tags:
- billing
operationId: billing/create-budget
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/billing/budgets#create-a-budget'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - budget_amount
          - prevent_further_usage
          - budget_alerting
          - budget_scope
          - budget_type
        properties:
          budget_amount:
            type: integer
            description: The budget amount in whole dollars. For license-based products, this represents the number of licenses.
          prevent_further_usage:
            type: boolean
            description: Whether to prevent additional spending once the budget is exceeded
          budget_alerting:
            type: object
            required:
              - will_alert
              - alert_recipients
            properties:
              will_alert:
                type: boolean
                description: Whether alerts are enabled for this budget
              alert_recipients:
                type: array
                items:
                  type: string
                description: Array of user login names who will receive alerts
          budget_scope:
            type: string
            description: The scope of the budget
            enum:
              - enterprise
              - organization
              - repository
              - cost_center
          budget_entity_name:
            type: string
            description: The name of the entity to apply the budget to
            default: ""
          budget_type:
            description: The type of pricing for the budget
            oneOf:
              - type: string
                enum:
                  - ProductPricing
              - type: string
                enum:
                  - SkuPricing
              - type: string
                enum:
                  - BundlePricing
                x-unpublished: "Tracked by https://github.com/github/gitcoin/issues/24902"
          budget_product_sku:
            type: string
            description: A single product or SKU that will be covered in the budget
      examples:
        create-budget:
          summary: Create budget example
          value:
            budget_amount: 200
            prevent_further_usage: true
            budget_scope: enterprise
            budget_entity_name: ""
            budget_type: ProductPricing
            budget_product_sku: actions
            budget_alerting:
              will_alert: false
              alert_recipients: []
responses:
  '200':
    description: Budget created successfully
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/create-budget.yaml'
        examples:
          create-budget:
            $ref: '../../components/examples/create-budget.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    description: Feature not enabled
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          feature-not-enabled:
            value:
              message: "Not Found"
              documentation_url: "https://docs.github.com/rest/billing/budgets#create-a-budget"
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          server-error:
            value:
              message: "Unable to create budget."
              documentation_url: "https://docs.github.com/rest/billing/budgets#create-a-budget"
x-github-releases:
  - ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: billing
  subcategory: budgets
x-github-internal:
  path: '/enterprises/{enterprise}/settings/billing/budgets'
  http-method: post
  published: true
  owner: '@github/metered-billing-reviewers'
