---
summary: List Enterprise Live Migrations
description: 'List Enterprise Live Migrations (ELM) for the current GHES appliance.'
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/live-migrations#list-enterprise-live-migrations'
tags:
- enterprise-admin
operationId: enterprise-admin/live-migration-list
parameters:
- name: page_size
  in: query
  description: Number of results per page.
  required: false
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100
- name: after
  in: query
  description: Cursor for pagination. Use the value from `next_cursor` of a previous response.
  required: false
  schema:
    type: string
- name: status
  in: query
  description: Optional filter by migration status.
  required: false
  schema:
    type: string
    enum:
    - created
    - queued
    - in_progress
    - paused
    - completed
    - failed
    - terminated
    - all
responses:
  '200':
    description: 'Response'
    content:
      application/json:
        schema:
          type: object
          properties:
            migrations:
              type: array
              items:
                type: object
                properties:
                  migration_id:
                    type: string
                  status:
                    type: string
                    nullable: true
                  source_organization_login:
                    type: string
                  target_organization_login:
                    type: string
                  source_repository_name:
                    type: string
                  target_repository_name:
                    type: string
                  target_visibility:
                    type: string
                    nullable: true
                  target_api_endpoint:
                    type: string
                  target_migration_id:
                    type: integer
                    format: int64
                  created_at:
                    type: string
                    format: date-time
                    nullable: true
                  started_at:
                    type: string
                    format: date-time
                    nullable: true
                  completed_at:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  repositories:
                    type: array
                    items:
                      type: object
                      properties:
                        source_repository_url:
                          type: string
                        target_repository_url:
                          type: string
                        status:
                          type: string
                          nullable: true
                      required:
                      - source_repository_url
                      - target_repository_url
                      - status
                required:
                - migration_id
                - status
                - source_organization_login
                - target_organization_login
                - source_repository_name
                - target_repository_name
                - target_visibility
                - target_api_endpoint
                - target_migration_id
                - created_at
                - started_at
                - completed_at
                - expires_at
                - repositories
            total_count:
              type: integer
            next_cursor:
              type: string
          required:
          - migrations
          - total_count
  '400':
    "$ref": '../../components/responses/bad_request.yaml'
  '401':
    "$ref": '../../components/responses/requires_authentication.yaml'
  '403':
    "$ref": '../../components/responses/forbidden.yaml'
  '404':
    "$ref": '../../components/responses/not_found.yaml'
  '500':
    "$ref": '../../components/responses/internal_error.yaml'
  '501':
    description: 'Not implemented.'
x-github-releases:
- ghes: '>= 3.17'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: live-migrations
x-github-internal:
  path: '/enterprise/live-migrations'
  http-method: get
  # Customer API stub — published flag flipped to true when 11.B lands and the endpoint serves real data.
  published: false
  owner: '@github/migrations-vnext'
