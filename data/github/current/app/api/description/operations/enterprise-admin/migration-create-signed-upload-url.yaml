---
summary: Enterprise Migration Create Signed Upload URL
description: 'Enterprise endpoint to get a signed upload URL for an asset and its asset blob path.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-create-signed-upload-url'
operationId: enterprise-admin/migration-create-signed-upload-url
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          resource_id:
            type: string
            description: ID of the attachment we are generate the upload URL for.
          content_type:
            type: string
            description: Content type of the attachment we are generating the upload URL for.
          source_url:
            type: string
            description: source url
          asset_kind:
            type: integer
            description: The kind of asset we are generating the upload URL for.
        required:
          - resource_id
          - content_type
          - asset_kind
          - source_url
      examples:
        default:
          value:
            resource_id: https://example.com/user/test/assets/00000000-0000-0000-0000-000000000000
            content_type: image/png
            asset_kind: 1
            source_url: https://example.com
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            attachment_upload_url:
              type: string
              description: Deprecated Signed Upload URL to be used to upload the asset.
            asset_upload_url:
              type: string
              description: Signed Upload URL to be used to upload the asset.
            asset_blob_path:
              type: string
              description: Blob path for the asset to be uploaded.
        examples:
          default:
            $ref: '../../components/examples/enterprise-migration-create-signed-upload-url-response.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/create-signed-upload-url'
  http-method: post
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
