---
summary: Get self-hosted runners permissions for an enterprise
description: |-
  Gets the settings for whether organizations in the enterprise are allowed to manage self-hosted runners at the repository level.
operationId: enterprise-admin/get-self-hosted-runners-permissions
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/permissions#get-self-hosted-runners-permissions-for-an-enterprise'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            disable_self_hosted_runners_for_all_orgs:
              type: boolean
              description: When true, repository-level runners will be disabled across all organizations in the enterprise
          required:
            - disable_self_hosted_runners_for_all_orgs
        examples:
          default:
            value:
              disable_self_hosted_runners_for_all_orgs: false
  '404':
    $ref: '../../components/responses/not_found.yaml'
