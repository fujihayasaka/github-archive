---
summary: "Create a Runner Scale Set for an enterprise"
description: |-
  Creates a new Runner Scale Set for an enterprise.

  OAuth app tokens and personal access tokens (classic) need the `manage_runners:enterprise` scope to use this endpoint.
tags:
  - actions
operationId: enterprise-admin/create-runner-scale-set-for-enterprise

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#create-a-runner-scale-set-for-an-enterprise"

# Describe how this operation is accessible
x-github-internal:
  path: /enterprises/{enterprise}/actions/runners/scalesets
  http-method: post
  published: false
  owner: "@github/c2c-actions"

# Define in which versions your operation is available
x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/enterprise.yaml"

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: The name of the new runner scale set.
          runnerGroupId:
            oneOf:
              - type: integer
              - type: string
            description: The ID of the runner group to assign this runner scale set to.
      examples:
        default:
          value:
            name: "Enterprise Scale Set"
            runnerGroupId: 1

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "409":
    $ref: "../../components/responses/service_unavailable.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

# Additional metadata
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
