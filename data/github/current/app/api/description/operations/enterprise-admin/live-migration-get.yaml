---
summary: Get an Enterprise Live Migration
description: 'Retrieve combined status, progress, cutover readiness, expiration, and timing for an Enterprise Live Migration (ELM) on the current GHES appliance.'
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/live-migrations#get-an-enterprise-live-migration'
tags:
- enterprise-admin
operationId: enterprise-admin/live-migration-get
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: string
responses:
  '200':
    description: 'Response'
    content:
      application/json:
        schema:
          type: object
          properties:
            migration:
              type: object
              nullable: true
              properties:
                migration_id:
                  type: string
                status:
                  type: string
                  nullable: true
                source_organization_login:
                  type: string
                target_organization_login:
                  type: string
                source_repository_name:
                  type: string
                target_repository_name:
                  type: string
                target_visibility:
                  type: string
                  nullable: true
                target_api_endpoint:
                  type: string
                target_migration_id:
                  type: integer
                  format: int64
                created_at:
                  type: string
                  format: date-time
                  nullable: true
                started_at:
                  type: string
                  format: date-time
                  nullable: true
                completed_at:
                  type: string
                  format: date-time
                  nullable: true
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                repositories:
                  type: array
                  items:
                    type: object
                    properties:
                      source_repository_url:
                        type: string
                      target_repository_url:
                        type: string
                      status:
                        type: string
                        nullable: true
                    required:
                    - source_repository_url
                    - target_repository_url
                    - status
              required:
              - migration_id
              - status
              - source_organization_login
              - target_organization_login
              - source_repository_name
              - target_repository_name
              - target_visibility
              - target_api_endpoint
              - target_migration_id
              - created_at
              - started_at
              - completed_at
              - expires_at
              - repositories
            target_state:
              type: object
              nullable: true
              description: 'State of the migration on the destination (ELM backend). Aggregate counts only; per-node detail is not included.'
              properties:
                status:
                  type: string
                  nullable: true
                last_updated:
                  type: string
                  format: date-time
                  nullable: true
                target_unavailable:
                  type: boolean
                  description: 'True when the destination was unreachable during this query. The combined status is reported as `degraded` in that case.'
                repository_summaries:
                  type: array
                  items:
                    type: object
                    properties:
                      namespace:
                        type: string
                      repository:
                        type: string
                      total:
                        type: integer
                        format: int64
                      total_backfill:
                        type: integer
                        format: int64
                      total_live_update:
                        type: integer
                        format: int64
                      total_processed:
                        type: integer
                        format: int64
                      total_failed:
                        type: integer
                        format: int64
                      total_pending:
                        type: integer
                        format: int64
                      total_eligible:
                        type: integer
                        format: int64
                      total_acknowledged:
                        type: integer
                        format: int64
                      initial_git_push_complete:
                        type: boolean
                      backfill:
                        type: object
                        nullable: true
                        properties:
                          total:
                            type: integer
                            format: int64
                          total_pending:
                            type: integer
                            format: int64
                          total_processed:
                            type: integer
                            format: int64
                          total_failed:
                            type: integer
                            format: int64
                          total_eligible:
                            type: integer
                            format: int64
                          total_acknowledged:
                            type: integer
                            format: int64
                          breakdown:
                            type: array
                            items:
                              type: object
                              properties:
                                state:
                                  type: string
                                kind:
                                  type: string
                                type:
                                  type: string
                                count:
                                  type: integer
                                  format: int64
                              required:
                              - state
                              - kind
                              - type
                              - count
                        required:
                        - total
                        - total_pending
                        - total_processed
                        - total_failed
                        - total_eligible
                        - total_acknowledged
                        - breakdown
                      live_update:
                        type: object
                        nullable: true
                        properties:
                          total:
                            type: integer
                            format: int64
                          total_pending:
                            type: integer
                            format: int64
                          total_processed:
                            type: integer
                            format: int64
                          total_failed:
                            type: integer
                            format: int64
                          total_eligible:
                            type: integer
                            format: int64
                          total_acknowledged:
                            type: integer
                            format: int64
                          breakdown:
                            type: array
                            items:
                              type: object
                              properties:
                                state:
                                  type: string
                                kind:
                                  type: string
                                type:
                                  type: string
                                count:
                                  type: integer
                                  format: int64
                              required:
                              - state
                              - kind
                              - type
                              - count
                        required:
                        - total
                        - total_pending
                        - total_processed
                        - total_failed
                        - total_eligible
                        - total_acknowledged
                        - breakdown
                    required:
                    - namespace
                    - repository
                    - total
                    - total_backfill
                    - total_live_update
                    - total_processed
                    - total_failed
                    - total_pending
                    - total_eligible
                    - total_acknowledged
                    - initial_git_push_complete
                    - backfill
                    - live_update
                repository_progress:
                  type: array
                  items:
                    type: object
                    properties:
                      repository_nwo:
                        type: string
                      backfill_resources_added:
                        type: integer
                        format: int64
                      backfill_resources_processed:
                        type: integer
                        format: int64
                      backfill_resources_failed:
                        type: integer
                        format: int64
                      backfill_resources_eligible:
                        type: integer
                        format: int64
                      backfill_resources_acknowledged:
                        type: integer
                        format: int64
                      live_update_resources_added:
                        type: integer
                        format: int64
                      live_update_resources_processed:
                        type: integer
                        format: int64
                      live_update_resources_eligible:
                        type: integer
                        format: int64
                      live_update_resources_acknowledged:
                        type: integer
                        format: int64
                      live_update_resources_failed:
                        type: integer
                        format: int64
                      all_resources_sent:
                        type: boolean
                      initial_git_push_complete:
                        type: boolean
                      repository_locked:
                        type: boolean
                    required:
                    - repository_nwo
                    - backfill_resources_added
                    - backfill_resources_processed
                    - backfill_resources_failed
                    - backfill_resources_eligible
                    - backfill_resources_acknowledged
                    - live_update_resources_added
                    - live_update_resources_processed
                    - live_update_resources_eligible
                    - live_update_resources_acknowledged
                    - live_update_resources_failed
                    - all_resources_sent
                    - initial_git_push_complete
                    - repository_locked
              required:
              - status
              - last_updated
              - target_unavailable
              - repository_summaries
              - repository_progress
            combined_state:
              type: object
              nullable: true
              description: 'Derived, user-facing status reconciled from the exporter and destination states, including cutover readiness.'
              properties:
                status:
                  type: string
                  nullable: true
                display_message:
                  type: string
                ready_for_cutover:
                  type: boolean
                cutover_blockers:
                  type: array
                  items:
                    type: string
                repositories:
                  type: array
                  items:
                    type: object
                    properties:
                      repository_nwo:
                        type: string
                      phase:
                        type: string
                        nullable: true
                      display_status:
                        type: string
                    required:
                    - repository_nwo
                    - phase
                    - display_status
              required:
              - status
              - display_message
              - ready_for_cutover
              - cutover_blockers
              - repositories
            messages:
              type: array
              description: 'Informational and error messages associated with the migration (for example, preflight results).'
              items:
                type: object
                properties:
                  message_type:
                    type: string
                  message:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                    nullable: true
                required:
                - message_type
                - message
                - created_at
          required:
          - migration
          - target_state
          - combined_state
          - messages
  '400':
    "$ref": '../../components/responses/bad_request.yaml'
  '401':
    "$ref": '../../components/responses/requires_authentication.yaml'
  '403':
    "$ref": '../../components/responses/forbidden.yaml'
  '404':
    "$ref": '../../components/responses/not_found.yaml'
  '422':
    description: 'The migration service is missing the source or target credentials required to service this request. An organization administrator must configure the required secrets before retrying.'
  '500':
    "$ref": '../../components/responses/internal_error.yaml'
x-github-releases:
- ghes: '>= 3.17'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: live-migrations
x-github-internal:
  path: '/enterprise/live-migrations/{migration_id}'
  http-method: get
  # Pre-GA: the endpoint is implemented and serves real data, but the contract is
  # still provisional (flag default-off) — kept unpublished until GA. Flip to true
  # when the ELM customer API GAs alongside the other endpoints.
  published: false
  owner: '@github/migrations-vnext'
