---
summary: Get the upgrade status
description: |-
  Gets the upgrade status from all configured nodes of a GitHub Enterprise Server instance. Returns information about the current upgrade phase, completion status, and individual step details when `is_verbose` mode is enabled.
operationId: enterprise-admin/get-manage-upgrade-status
tags:
  - enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/manage-ghes#get-the-upgrade-status'
parameters:
- name: uuid
  description: The UUID which identifies a node.
  in: query
  required: false
  schema:
    type: string
- name: is_verbose
  description: Whether to include detailed step information.
  in: query
  required: false
  schema:
    type: boolean
servers:
- url: '{protocol}://{hostname}'
  variables:
    hostname:
      default: 'HOSTNAME'
      description: Self-hosted Enterprise Server hostname
    protocol:
      default: https
      enum:
        - https
        - http
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ghes-get-manage-upgrade-status-response.yaml'
        examples:
          default:
            $ref: '../../components/examples/ghes-get-manage-upgrade-status-response.yaml'
  '400':
    description: Bad request
  '401':
    description: Unauthorized
  '500':
    description: Internal error
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: manage-ghes
x-github-internal:
  path: '/manage/v1/upgrade/status'
  http-method: get
  service-tier: 1
  published: false
x-github-releases:
- ghes: '>= 3.22'
