---
summary: 'Assign an enterprise role to an enterprise user'
description: |-
  Assigns an enterprise role to a user in an enterprise.

  To use this endpoint, the authenticated user must be one of:

    - An administrator for the enterprise.
    - A user, or a user on a team, with the fine-grained permission `write_enterprise_custom_enterprise_role` in the enterprise.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - enterprise-admin
operationId: enterprise-admin/assign-enterprise-role-to-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/enterprise-roles#assign-an-enterprise-role-to-an-enterprise-user'
x-github-internal:
