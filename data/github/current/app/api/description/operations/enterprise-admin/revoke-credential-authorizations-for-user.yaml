---
summary: Revoke credential authorizations for a user in an enterprise
description: |-
  Revokes all credential authorizations for a single user within the enterprise.
  This includes any credential authorizations the user has across all organizations
  in the enterprise.

  For Enterprise Managed User (EMU) enterprises, you can optionally also destroy all
  credentials (PATs v1, PATs v2, and SSH keys) owned by the user by setting
  the `revoke_credentials` parameter to `true`.

  This operation is performed asynchronously. A background job will be queued to process
  the revocations.

  > [!WARNING]
  > If you use a personal access token to call this endpoint and target yourself, that
  > token may also be revoked or destroyed as part of this operation.

  The authenticated user must be an enterprise owner or have the `write_enterprise_credentials` permission to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
  - enterprise-admin
operationId: enterprise-admin/revoke-credential-authorizations-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/credential-authorizations#revoke-credential-authorizations-for-a-user-in-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/credential-authorizations/{username}/revoke
  http-method: post
  published: false
  owner: '@github/external-identities'
  service-tier: 2
x-github-releases:
  - ghec
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
  - $ref: '../../components/parameters/username.yaml'
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          revoke_credentials:
            type: boolean
            description: |-
              Whether to also destroy the actual credentials (PATs and SSH keys) owned by
              the user. This option is only available for Enterprise Managed User (EMU)
              enterprises. When set to `true`, all PATs (v1 and v2) and SSH keys owned
              by the user will be destroyed in addition to the credential authorizations.
            default: false
      examples:
        default:
          value:
            revoke_credentials: false
        emu_with_credential_revocation:
          summary: EMU enterprise with credential revocation
          value:
            revoke_credentials: true
responses:
  '202':
    description: Accepted - The revocation request has been queued
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              description: A message indicating the revocation has been queued
            warning:
              type: string
              description: A warning message if the token used for this request may be revoked
        examples:
          default:
            value:
              message: "Credential authorization revocation for user 'octocat' has been queued"
          with_warning:
            value:
              message: "Credential authorization revocation for user 'octocat' has been queued"
              warning: "The token used for this request may also be revoked or destroyed as part of this operation"
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Validation error - The `revoke_credentials` option is only available for EMU enterprises
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
        examples:
          non_emu_enterprise:
            value:
              message: "The `revoke_credentials` option is only available for Enterprise Managed User (EMU) enterprises"
              documentation_url: "https://docs.github.com/rest/enterprise-admin/credential-authorizations#revoke-credential-authorizations-for-a-user-in-an-enterprise"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: credential-authorizations
