---
summary: Remove a user from an enterprise
description: |-
  Allows an unaffiliated user to remove themselves from an enterprise account.

  Only users who are not members of any organizations within the enterprise (unaffiliated users) can use this endpoint. Users can only remove themselves.

  This endpoint is only available for classic GitHub Enterprise Cloud (GHEC) accounts, not for Enterprise Managed Users (EMU) or Proxima enterprises.
operationId: enterprise-admin/remove-membership-for-user
tags:
- enterprise-admin
