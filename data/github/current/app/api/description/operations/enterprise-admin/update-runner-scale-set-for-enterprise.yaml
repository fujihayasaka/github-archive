---
summary: "Update an existing Runner Scale Set for an enterprise"
description: |-
  Updates the configuration of an existing Runner Scale Set for an enterprise.

  OAuth app tokens and personal access tokens (classic) need the `manage_runners:enterprise` scope to use this endpoint.
tags:
  - actions
operationId: enterprise-admin/update-runner-scale-set-for-enterprise

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#update-an-existing-runner-scale-set-for-an-enterprise"

# Describe how this operation is accessible
x-github-internal:
  path: /enterprises/{enterprise}/actions/runners/scalesets/{runner_scale_set_id}
  http-method: patch
  published: false
  owner: "@github/c2c-actions"

# Define in which versions your operation is available
x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/enterprise.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The new name for the runner scale set.
          runnerGroupId:
            type: integer
            description: The new ID of the runner group for the scale set.
          runnerSetting:
            type: object
            properties:
              ephemeral:
                type: boolean
                description: If runners are created as ephemeral by default.
              disable_update:
                type: boolean
                description: If runners have auto-update disabled by default.
          labels:
            type: array
            items:
              $ref: "../../components/schemas/runner-scale-set-label.yaml"
      examples:
        default:
          value:
            name: "Updated Enterprise Scale Set"
            runnerGroupId: 2

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "409":
    $ref: "../../components/responses/service_unavailable.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

# Additional metadata
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
