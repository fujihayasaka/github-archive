---
summary: Enterprise Migration Update Repository State
description: 'Enterprise endpoint to update the state of a repository in a migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-update-repository-state'
operationId: enterprise-admin/migration-update-repository-state
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: integer
    format: int64
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repository_nwo:
            type: string
            description: The name with owner of the repository (e.g., "owner/repo")
            example: "org/repo-name"
          state:
            type: string
            description: The new state to set for the repository
            example: "completed"
        required:
        - repository_nwo
        - state
      examples:
        default:
          summary: Update repository state request
          value:
            repository_nwo: "org/repo-name"
            state: "resources_sent"
        with_destination:
          summary: Update state with destination for completed migrations
          value:
            repository_nwo: "org/repo-name"
            state: "complete"
            destination_nwo: "dest-org/dest-repo"
responses:
  '204':
    description: Repository state updated successfully
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/{migration_id}/update-repository-state'
  http-method: post
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
