---
summary: Get a list of Visual Studio subscriptions for the enterprise
description: |-
  Retrieves a list of Visual Studio subscriptions for the specified enterprise.
operationId: enterprise-admin/list-vss
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/license#get-a-list-of-visual-studio-subscriptions-for-the-enterprise'
parameters:
- name: enterprise
  in: path
  required: true
  schema:
    type: string
  description: The slug version of the enterprise name
- name: is_unmatched_only
  in: query
  required: false
  schema:
    type: boolean
  description: When true, only returns Visual Studio subscriptions that are not matched to a GitHub user.
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
          - total_count
          - visual_studio_subscriptions
          properties:
            total_count:
              type: integer
            visual_studio_subscriptions:
              type: array
              items:
                $ref: '../../components/schemas/visual-studio-subscription-assignment.yaml'
        examples:
          default:
            $ref: '../../components/examples/visual-studio-subscription-assignment-paginated.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: license
x-github-internal:
  path: '/enterprises/{enterprise}/visual-studio-subscriptions'
  http-method: get
  service-tier: 2
  published: false
  owner: "@github/licensing"
