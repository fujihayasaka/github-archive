---
summary: Set self-hosted runners permissions for an enterprise
description: |-
  Sets the settings for whether organizations in the enterprise are allowed to manage self-hosted runners at the repository level.
operationId: enterprise-admin/set-self-hosted-runners-permissions
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/permissions#set-self-hosted-runners-permissions-for-an-enterprise'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
responses:
  '204':
    description: Response
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          disable_self_hosted_runners_for_all_orgs:
            type: boolean
            description: When true, repository-level runners will be disabled across all organizations in the enterprise
        required:
          - disable_self_hosted_runners_for_all_orgs
      examples:
        default:
          summary: Disable repository-level runners across all organizations
          value:
            disable_self_hosted_runners_for_all_orgs: true
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: actions
  subcategory: permissions
x-github-internal:
  path: '/enterprises/{enterprise}/actions/permissions/self-hosted-runners'
  published: true
  http-method: put
  owner: '@github/actions-dispatch'
x-github-releases:
- ghec
- ghes: ">= 3.19"
