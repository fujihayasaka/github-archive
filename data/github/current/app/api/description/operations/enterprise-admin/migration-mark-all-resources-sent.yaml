---
summary: Enterprise Migration Mark All Resources Sent
description: 'Enterprise endpoint to mark that all resources have been sent for a repository in a migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-mark-all-resources-sent'
operationId: enterprise-admin/migration-mark-all-resources-sent
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repository_nwo:
            type: string
            description: The name with owner of the repository (e.g., "owner/repo")
            example: "octocat/Hello-World"
        required:
          - repository_nwo
      examples:
        default:
          value:
            repository_nwo: "octocat/Hello-World"
responses:
  '204':
    description: Resources marked as sent successfully
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/{migration_id}/mark-all-resources-sent'
  http-method: post
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
