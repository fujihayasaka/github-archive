---
summary: Add or update a Visual Studio subscription user match
description: |-
  Updates a manual match between a user and a Visual Studio subscription.
operationId: enterprise-admin/update-vss-manual-match
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/license#add-or-update-a-visual-studio-subscription-user-match'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          user_identifier:
            description: The handle for the GitHub user account or a verified email associated with their account.
            type: string
      examples:
        default:
          value:
            user_identifier: monalisa
parameters:
- name: visual_studio_subscription_id
  description: 'The ID of the Visual Studio subscription to add or update the match for. This is a GUID that comes from the Visual Studio management portal.'
  in: path
  required: true
  schema:
    type: string
- name: enterprise
  in: path
  required: true
  schema:
    type: string
  description: The slug version of the enterprise name
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/visual-studio-subscription-assignment.yaml'
        examples:
          default:
            $ref: '../../components/examples/visual-studio-subscription-assignment.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: license
x-github-internal:
  path: '/enterprises/{enterprise}/visual-studio-subscriptions/{visual_studio_subscription_id}'
  http-method: put
  service-tier: 2
  published: false
  owner: "@github/licensing"
