---
summary: 'Create or update custom property values for organizations in an enterprise'
description: |-
  Create or update custom property values for organizations in an enterprise.

  To remove a custom property value from an organization, set the property value to `null`.

  Access requirements:
  - Enterprise admins
  - OAuth tokens and personal access tokens (classic) with the `admin:enterprise` scope
  - Actors with the enterprise-level "edit enterprise custom properties for organizations" fine-grained permission or above
tags:
  - enterprise-admin
operationId: enterprise-admin/custom-properties-for-orgs-create-or-update-enterprise-values
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties-for-orgs#create-or-update-custom-property-values-for-organizations-in-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          organization_logins:
            type: array
            description: The names of organizations that the custom property values will be applied to.
            items:
              type: string
            minItems: 1
            maxItems: 30
          properties:
            type: array
            description: List of custom property names and associated values to apply to the organizations.
            items:
              $ref: '../../components/schemas/custom-property-value.yaml'
        required:
        - organization_logins
        - properties
      examples:
        default:
          $ref: '../../components/examples/custom-properties-for-orgs-patch-enterprise-property-values.yaml'
responses:
  '204':
    description: No Content when custom property values are successfully created or updated
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
  - ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties-for-orgs
x-github-internal:
  path: /enterprises/{enterprise}/org-properties/values
  http-method: patch
  published: false
  owner: '@github/repos'
