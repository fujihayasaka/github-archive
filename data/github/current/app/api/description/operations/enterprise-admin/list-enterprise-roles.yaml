---
summary: 'Get all enterprise roles for an enterprise'
description: |-
  Lists the enterprise roles available in this enterprise.

  To use this endpoint, the authenticated user must be one of:

    - An administrator for the enterprise.
    - A user, or a user on a team, with the fine-grained permission `read_enterprise_custom_enterprise_role` in the enterprise.

  OAuth app tokens and personal access tokens (classic) require the `read:enterprise` scope to access this endpoint.
tags:
  - enterprise-admin
operationId: enterprise-admin/list-enterprise-roles
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/enterprise-roles#get-all-enterprise-roles-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/enterprise-roles
  http-method: get
  published: false
  owner: '@github/authorization-platform'
x-github-releases:
  - ghec
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
responses:
  '200':
    description: Response - list of enterprise roles
    content:
      application/json:
        schema:
          type: object
          properties:
            total_count:
              type: integer
              description: The total number of enterprise roles available to the enterprise.
            roles:
              type: array
              description: The list of enterprise roles available to the enterprise.
              items:
                $ref: '../../components/schemas/enterprise-role.yaml'
        examples:
          default:
            $ref: '../../components/examples/enterprise-role-list.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: enterprise-roles
