---
summary: Enterprise Migration Report Git Sync
description: 'Enterprise endpoint to report a git sync iteration for a repository during a migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-report-git-sync'
operationId: enterprise-admin/migration-report-git-sync
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repository_nwo:
            type: string
            description: The name with owner of the repository (e.g., "owner/repo")
            example: "octocat/Hello-World"
          iteration_start_time:
            type: integer
            description: Unix timestamp when the git sync iteration started
            example: 1705315200
          iteration_end_time:
            type: integer
            description: Unix timestamp when the git sync iteration ended
            example: 1705317000
          git_source:
            type: integer
            description: Specifies whether this is for repository or wiki git data (1 = repository, 2 = wiki)
            example: 1
          success:
            type: boolean
            description: Indicates whether the sync iteration completed successfully
            example: true
          error_message:
            type: string
            description: Error message if the sync failed (optional). Deprecated in favor of error_messages.
            deprecated: true
            example: ""
          error_messages:
            type: array
            items:
              type: string
            description: List of error messages if the sync failed (optional)
            example: []
          additional_errors:
            type: boolean
            description: Indicates whether there are additional errors beyond those in error_messages (optional)
            example: false
        required:
          - repository_nwo
          - iteration_start_time
          - iteration_end_time
          - git_source
          - success
      examples:
        success:
          value:
            repository_nwo: "octocat/Hello-World"
            iteration_start_time: 1705315200
            iteration_end_time: 1705317000
            git_source: 1
            success: true
            error_message: ""
        failure:
          value:
            repository_nwo: "octocat/Hello-World"
            iteration_start_time: 1705315200
            iteration_end_time: 1705315260
            git_source: 1
            success: false
            error_message: "Failed to push refs: connection timeout"
        failure_with_multiple_errors:
          value:
            repository_nwo: "octocat/Hello-World"
            iteration_start_time: 1705315200
            iteration_end_time: 1705315260
            git_source: 1
            success: false
            error_message: "Failed to push refs: connection timeout"
            error_messages:
              - "Failed to push refs: connection timeout"
              - "Failed to fetch objects: network error"
            additional_errors: true
responses:
  '204':
    description: Git sync iteration reported successfully
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/{migration_id}/report-git-sync'
  http-method: post
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
