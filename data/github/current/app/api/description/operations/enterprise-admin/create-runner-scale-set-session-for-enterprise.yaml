---
summary: "Create a Runner Scale Set session for an enterprise"
description: |-
  Creates a new Runner Scale Set session for an enterprise. A session is used when a runner connects to the scale set.

  OAuth app tokens and personal access tokens (classic) need the `manage_runners:enterprise` scope to use this endpoint.
tags:
  - actions
operationId: enterprise-admin/create-runner-scale-set-session-for-enterprise

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#create-a-runner-scale-set-session-for-an-enterprise"

# Describe how this operation is accessible
x-github-internal:
  path: /enterprises/{enterprise}/actions/runners/scalesets/{runner_scale_set_id}/sessions
  http-method: post
  published: false
  owner: "@github/c2c-actions"

# Define in which versions your operation is available
x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/enterprise.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - ownerName
        properties:
          ownerName:
            type: string
            description: The name of the owner of the session.
      examples:
        default:
          value:
            ownerName: "Scale Set Session Owner"

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set_session.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "409":
    $ref: "../../components/responses/service_unavailable.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

# Additional metadata
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
