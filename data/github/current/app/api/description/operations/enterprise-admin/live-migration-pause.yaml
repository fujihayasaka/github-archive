---
summary: Pause an Enterprise Live Migration
description: 'Pause source-load work for an active Enterprise Live Migration (ELM). Backfill and Git synchronization are paused while live event collection and delivery continue. The operation is idempotent for a migration that is already paused. No content is returned; query the migration status to observe the durable state.'
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/live-migrations#pause-an-enterprise-live-migration'
tags:
- enterprise-admin
operationId: enterprise-admin/live-migration-pause
parameters:
- name: migration_id
  in: path
  description: The unique identifier of the Enterprise Live Migration.
  required: true
  schema:
    type: string
responses:
  '204':
    description: 'The migration was paused. No content is returned; query the migration status to confirm its current state.'
  '400':
    "$ref": '../../components/responses/bad_request.yaml'
  '401':
    "$ref": '../../components/responses/requires_authentication.yaml'
  '403':
    "$ref": '../../components/responses/forbidden.yaml'
  '404':
    "$ref": '../../components/responses/not_found.yaml'
  '409':
    description: 'Conflict. The migration is not in a state that can be paused, such as when it has not been started or has already completed.'
  '422':
    description: 'The pause request was accepted by the migration service, but the migration did not complete the transition to paused. Query the migration status and retry.'
  '500':
    "$ref": '../../components/responses/internal_error.yaml'
x-github-releases:
- ghes: '>= 3.17'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: live-migrations
x-github-internal:
  path: '/enterprise/live-migrations/{migration_id}/pause'
  http-method: post
  # Pre-GA: the endpoint is implemented and serves real data, but the contract is
  # still provisional (flag default-off). Keep unpublished until the ELM customer
  # API is ready for GA.
  published: false
  owner: '@github/migrations-vnext'
