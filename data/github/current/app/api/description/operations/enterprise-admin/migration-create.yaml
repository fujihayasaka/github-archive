---
summary: Enterprise Migration Create Migration
description: 'Enterprise endpoint to create a migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-create-migration'
operationId: enterprise-admin/migration-create
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          source_url:
            type: string
            description: The source URL for the migration
            example: "https://example.com/repo"
          description:
            type: string
            description: A description of the migration
            example: "Migration of example repository"
          repositories:
            type: array
            description: List of repositories to include in the migration
            items:
              type: string
              example: "org/repo-name"
        required:
        - source_url
      examples:
        default:
          summary: Create migration example
          value:
            source_url: "https://example.com/repo"
            description: "Migration of example repository"
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            migrationId:
              type: string
              description: The unique identifier for the created migration
              example: "12345"
            expiresAt:
              type: string
              format: date-time
              description: The expiration time of the migration
              example: "2024-01-01T00:00:00Z"
          required:
          - migrationId
          - expiresAt
        examples:
          default:
            summary: Created migration response
            value:
              migrationId: "12345"
              expiresAt: "2024-01-01T00:00:00Z"
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/create'
  http-method: post
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
