---
summary: Enterprise Migration List Migration Nodes
description: 'Enterprise endpoint to query migration nodes for a specific migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-list-migration-nodes'
operationId: enterprise-admin/migration-list-migration-nodes
parameters:
- name: migration_id
  in: path
  description: ID of the migration to query nodes for.
  required: true
  schema:
    type: string
- name: repository_nwo
  in: query
  description: Full name of the repository to query nodes for.
  required: true
  schema:
    type: string
- name: state
  in: query
  description: State of the migration nodes to filter by.
  required: false
  schema:
    type: string
    enum:
    - NODE_STATE_UNKNOWN
    - NODE_STATE_PENDING
    - NODE_STATE_ACKNOWLEDGED
    - NODE_STATE_PROCESSED
    - NODE_STATE_BLOCKED
    - NODE_STATE_FAILED
    example: "NODE_STATE_PENDING"
- name: origin
  in: query
  description: Origin of the migration nodes to filter by.
  required: true
  schema:
    type: string
    enum:
    - NODE_ORIGIN_UNKNOWN
    - NODE_ORIGIN_LIVE_UPDATE
    - NODE_ORIGIN_BACKFILL
    example: "NODE_ORIGIN_BACKFILL"
- name: page_size
  in: query
  description: Page size for pagination.
  required: false
  schema:
    type: integer
- name: after
  in: query
  description: Cursor for pagination.
  required: false
  schema:
    type: string
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            nodes:
              type: array
              description: List of migration nodes
              items:
                $ref: '../../components/schemas/enterprise-migration-node.yaml'
            after:
              type: string
              description: Cursor for pagination to fetch the next page of results
              example: "cursor-next-page"
          required:
          - nodes
        examples:
          default:
            $ref: '../../components/examples/enterprise-migration-list-migration-nodes-response.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/{migration_id}/nodes'
  http-method: get
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
