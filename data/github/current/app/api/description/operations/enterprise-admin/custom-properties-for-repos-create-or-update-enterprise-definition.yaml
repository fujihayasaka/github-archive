---
summary: Create or update a custom property for an enterprise
description: |-
  Creates a new or updates an existing custom property that is defined for an enterprise.

  To use this endpoint, the authenticated user must be an administrator for the enterprise.
tags:
  - enterprise-admin
operationId: enterprise-admin/custom-properties-for-repos-create-or-update-enterprise-definition
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties#create-or-update-a-custom-property-for-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
  - $ref: '../../components/parameters/custom-property-name.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/custom-property-set-payload.yaml'
      examples:
        default:
          value:
            value_type: single_select
            required: true
            default_value: production
            description: 'Prod or dev environment'
            allowed_values:
            - production
            - development
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/custom-property.yaml'
        examples:
          default:
            $ref: '../../components/examples/custom-property.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
  - ghec
  - ghes: '>= 3.18'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties
x-github-internal:
  path: '/enterprises/{enterprise}/properties/schema/{custom_property_name}'
  http-method: put
  service-tier: 2
  owner: '@github/repos'
  published: true
