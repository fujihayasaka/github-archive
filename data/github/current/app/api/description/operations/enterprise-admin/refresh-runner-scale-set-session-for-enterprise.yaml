---
summary: "Refresh a Runner Scale Set session for an enterprise"
description: |-
  Refreshes a Runner Scale Set session for an enterprise, extending its validity period.

  OAuth app tokens and personal access tokens (classic) need the `manage_runners:enterprise` scope to use this endpoint.
tags:
  - actions
operationId: enterprise-admin/refresh-runner-scale-set-session-for-enterprise

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#refresh-a-runner-scale-set-session-for-an-enterprise"

# Describe how this operation is accessible
x-github-internal:
  path: /enterprises/{enterprise}/actions/runners/scalesets/{runner_scale_set_id}/sessions/{session_id}
  http-method: patch
  published: false
  owner: "@github/c2c-actions"

# Define in which versions your operation is available
x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/enterprise.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"
  - name: session_id
    in: path
    required: true
    schema:
      type: string
    description: The ID of the session to refresh.

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set_session.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "409":
    $ref: "../../components/responses/service_unavailable.yaml"

# Additional metadata
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
