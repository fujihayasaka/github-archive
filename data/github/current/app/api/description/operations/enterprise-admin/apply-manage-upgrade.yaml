---
summary: Apply an upgrade
description: |-
  Applies an upgrade package on a GitHub Enterprise Server node. You can run a full upgrade (pre-upgrade + upgrade), or a specific phase. Either `upgrade_package_file` or `version` is required. When `phase` is omitted, both pre-upgrade and upgrade phases run sequentially.
operationId: enterprise-admin/apply-manage-upgrade
tags:
  - enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/manage-ghes#apply-an-upgrade'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/ghes-apply-manage-upgrade-request.yaml'
      examples:
        default:
          $ref: '../../components/examples/ghes-apply-manage-upgrade-request-default.yaml'
        pre-upgrade-only:
          $ref: '../../components/examples/ghes-apply-manage-upgrade-request-pre-upgrade-only.yaml'
        with-package-file:
          $ref: '../../components/examples/ghes-apply-manage-upgrade-request-with-package-file.yaml'
servers:
- url: '{protocol}://{hostname}'
  variables:
    hostname:
      default: 'HOSTNAME'
      description: Self-hosted Enterprise Server hostname
    protocol:
      default: https
      enum:
        - https
        - http
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ghes-apply-manage-upgrade-response.yaml'
        examples:
          default:
            $ref: '../../components/examples/ghes-apply-manage-upgrade-response.yaml'
  '400':
    description: Bad request
  '401':
    description: Unauthorized
  '404':
    description: Not found
  '500':
    description: Internal error
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: manage-ghes
x-github-internal:
  path: '/manage/v1/upgrade/apply'
  http-method: post
  service-tier: 1
  published: false
x-github-releases:
- ghes: '>= 3.22'
