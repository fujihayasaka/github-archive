---
summary: Get organization custom properties schema for an enterprise
description: |-
  Gets all organization custom property definitions that are defined on an enterprise.

  Access requirements:
  - Enterprise admins
  - OAuth tokens and personal access tokens (classic) with the `read:enterprise` scope
  - Actors with the enterprise-level "read enterprise custom properties for organizations" fine-grained permission or above
tags:
  - enterprise-admin
operationId: enterprise-admin/custom-properties-for-orgs-get-enterprise-definitions
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties-for-orgs#get-organization-custom-properties-schema-for-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/organization-custom-property.yaml'
        examples:
          default:
            $ref: '../../components/examples/organization-custom-properties.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties-for-orgs
x-github-internal:
