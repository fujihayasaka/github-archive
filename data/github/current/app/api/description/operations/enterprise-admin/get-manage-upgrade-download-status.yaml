---
summary: Get the upgrade package download status
description: |-
  Returns the aggregate and per-node status for GitHub Enterprise Server upgrade
  package downloads.

  While a gateway-side throttled orchestration is running, the response includes
  an `orchestration` object with queue-level counts and the status is scoped to
  the gateway-filtered node set. When no orchestration is active, the gateway
  fans out to the targeted agents and aggregates their per-node download status.

  Use `uuid`, `hostname`, or `cluster_role` query filters to inspect a subset of
  nodes.
operationId: enterprise-admin/get-manage-upgrade-download-status
tags:
  - enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/manage-ghes#get-the-upgrade-package-download-status'
parameters:
- name: uuid
  description: The UUID which identifies a node.
  in: query
  required: false
  schema:
    type: string
servers:
- url: '{protocol}://{hostname}'
  variables:
    hostname:
      default: 'HOSTNAME'
      description: Self-hosted Enterprise Server hostname
    protocol:
      default: https
      enum:
        - https
        - http
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ghes-get-manage-upgrade-download-status-response.yaml'
        examples:
          default:
            $ref: '../../components/examples/ghes-get-manage-upgrade-download-status-response.yaml'
          orchestration-status:
            $ref: '../../components/examples/ghes-get-manage-upgrade-download-status-orchestration-response.yaml'
  '400':
    description: Bad request
  '401':
    description: Unauthorized
  '500':
    description: Internal error
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: manage-ghes
x-github-internal:
  path: '/manage/v1/upgrade/download/status'
  http-method: get
  service-tier: 1
  published: false
x-github-releases:
- ghes: '>= 3.22'
