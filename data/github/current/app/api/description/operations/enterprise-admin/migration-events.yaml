---
summary: Enterprise Migration Events
description: |-
  Enterprise endpoint for migrating events.

  **Terminal State Handling**

  If the migration has reached a terminal state, the endpoint returns a 422 status code with custom headers:
  - `X-Migration-Terminated: true` - indicates the migration cannot accept more data
  - `X-Migration-Status` - the current migration status

  Terminal states include:
  - `aborted` - the migration was cancelled by the user
  - `completed` - the migration finished successfully
  - `failed` - the migration encountered an error

  Clients should check these headers to determine whether to stop sending data.
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-events'
operationId: enterprise-admin/migration-events
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          source_url:
            type: string
            description: source url
          events:
            type: array
            items:
              type: object
              additionalProperties: true
        required:
          - source_url
      examples:
        default:
          value:
            source_url: https://example.com
responses:
  '202':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            count:
              type: number
              description: Number of items migrating or migrated.
        examples:
          default:
            $ref: '../../components/examples/enterprise-migration-response.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '422':
    description: |-
      The migration has reached a terminal state and cannot accept additional events.
      Check the response headers for migration status information.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/basic-error.yaml'
    headers:
      X-Migration-Terminated:
        description: Indicates the migration has reached a terminal state
        schema:
          type: string
          example: "true"
      X-Migration-Status:
        description: The current status of the migration (e.g., aborted, completed, failed)
        schema:
          type: string
          example: "aborted"
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/events'
  http-method: post
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
