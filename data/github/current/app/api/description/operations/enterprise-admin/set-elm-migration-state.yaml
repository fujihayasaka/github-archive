---
summary: Set ELM migration banner state on a source repository
description: >
  GHES admin endpoint called by elm-exporter to store the current ELM migration
  phase on the source repository. This drives the phase-appropriate banner shown
  to users browsing the source repo during an Enterprise Live Migration.
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#set-elm-migration-banner-state-on-a-source-repository'
operationId: enterprise-admin/set-elm-migration-state
parameters:
- name: owner
  in: path
  description: The account owner of the repository.
  required: true
  schema:
    type: string
- name: repo
  in: path
  description: The name of the repository.
  required: true
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          state:
            type: string
            description: The current ELM migration phase.
            enum:
              - started
              - resources_sent
              - locked
              - live_updates_sent
              - complete
            example: "started"
          destination_url:
            type: string
            description: >
              Full URL of the destination repository on GitHub.com. Required
              when state is "complete"; omit for earlier phases.
            example: "https://github.com/dest-org/dest-repo"
        required:
        - state
      examples:
        started:
          summary: Migration started
          value:
            state: "started"
        locked:
          summary: Cutover in progress
          value:
            state: "locked"
        complete:
          summary: Migration complete with destination link
          value:
            state: "complete"
            destination_url: "https://github.com/dest-org/dest-repo"
responses:
  '204':
    description: Migration state updated successfully.
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
- ghes: '>= 3.17'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/admin/repos/{owner}/{repo}/elm-migration-state'
  http-method: post
  published: false
  owner: '@github/migrations-vnext'
