---
summary: Create or update organization custom property definitions on an enterprise
description: |-
  Creates new or updates existing organization custom properties defined on an enterprise in a batch.

  If the property already exists, the existing property will be replaced with the new values.
  Missing optional values will fall back to default values, previous values will be overwritten.

  Access requirements:
  - Enterprise admins
  - OAuth tokens and personal access tokens (classic) with the `admin:enterprise` scope
  - Actors with the enterprise-level "manage enterprise custom properties for organizations" fine-grained permission
tags:
- enterprise-admin
operationId: enterprise-admin/custom-properties-for-orgs-create-or-update-enterprise-definitions
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties-for-orgs#create-or-update-organization-custom-property-definitions-on-an-enterprise'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          properties:
            type: array
            description: The array of organization custom properties to create or update.
            items:
              $ref: '../../components/schemas/organization-custom-property.yaml'
            minItems: 1
            maxItems: 100
        required:
        - properties
      examples:
        default:
          $ref: '../../components/examples/organization-custom-properties.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/organization-custom-property.yaml'
        examples:
          default:
            $ref: '../../components/examples/organization-custom-properties.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed_simple.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties-for-orgs
x-github-internal:
  path: '/enterprises/{enterprise}/org-properties/schema'
  http-method: patch
  service-tier: 2
  owner: '@github/repos'
  published: false
