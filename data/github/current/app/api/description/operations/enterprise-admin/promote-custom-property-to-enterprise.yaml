---
summary: Promote a custom property to an enterprise
description: |-
  Promotes an existing organization custom property to an enterprise.

  To use this endpoint, the authenticated user must be an administrator for the enterprise.
tags:
  - enterprise-admin
operationId: enterprise-admin/promote-custom-property-to-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties#promote-a-custom-property-to-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/custom-property-name.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/custom-property.yaml'
        examples:
          default:
            $ref: '../../components/examples/custom-property.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
  - ghec
  - ghes: '>= 3.18'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties
x-github-internal:
  path: '/enterprises/{enterprise}/properties/schema/organizations/{org}/{custom_property_name}/promote'
  http-method: put
  service-tier: 2
  owner: '@github/repos'
  published: true
