---
summary: Enterprise Migration Quota
description: 'Returns the current active migration count and configured per-enterprise cap. Clients can use this to check headroom before calling Create Migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-quota'
operationId: enterprise-admin/migration-quota
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            active:
              type: integer
              format: int32
              description: Count of migrations currently counting against the total per-enterprise cap.
              example: 5
            backfilling:
              type: integer
              format: int32
              description: Count of migrations currently in the backfill phase. Omitted when the backfill cap is not enforced.
              example: 3
            maxActive:
              type: integer
              format: int32
              description: Configured maximum number of concurrent migrations per enterprise.
              example: 20
            maxBackfilling:
              type: integer
              format: int32
              description: Configured maximum number of concurrent backfilling migrations per enterprise. Omitted when the backfill cap is not enforced.
              example: 10
          required:
            - active
            - maxActive
        examples:
          default:
            summary: Migration quota response
            value:
              active: 5
              backfilling: 3
              maxActive: 20
              maxBackfilling: 10
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/quota'
  http-method: get
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
