---
summary: Cutover an Enterprise Live Migration
description: 'Initiate cutover for an Enterprise Live Migration (ELM), archiving the source repository and draining remaining changes. Cutover is asynchronous; the migration transitions through cutover_pending and cutover_finalizing to completed. No content is returned — query the migration status to observe progress.'
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/live-migrations#cutover-an-enterprise-live-migration'
tags:
- enterprise-admin
operationId: enterprise-admin/live-migration-cutover
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: string
requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          force:
            type: boolean
            default: false
            description: 'Bypass the cutover readiness checks and initiate cutover even when the migration is not reported as ready. Defaults to `false`.'
        additionalProperties: false
responses:
  '204':
    description: 'Cutover was initiated. No content is returned; query the migration status to observe the cutover progress.'
  '400':
    "$ref": '../../components/responses/bad_request.yaml'
  '401':
    "$ref": '../../components/responses/requires_authentication.yaml'
  '403':
    "$ref": '../../components/responses/forbidden.yaml'
  '404':
    "$ref": '../../components/responses/not_found.yaml'
  '409':
    description: 'Conflict. The migration is not ready for cutover (for example, backfill is still in progress, or the migration has already completed, been cancelled, or failed).'
  '500':
    "$ref": '../../components/responses/internal_error.yaml'
x-github-releases:
- ghes: '>= 3.17'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: live-migrations
x-github-internal:
  path: '/enterprise/live-migrations/{migration_id}/cutover'
  http-method: post
  # Pre-GA: the endpoint is implemented and serves real data, but the contract is
  # still provisional (flag default-off) — kept unpublished until GA. Flip to true
  # when the ELM customer API GAs alongside the other endpoints.
  published: false
  owner: '@github/migrations-vnext'
