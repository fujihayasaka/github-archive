---
summary: "Get a Runner Scale Set for an enterprise"
description: |-
  Gets a specific Runner Scale Set for an enterprise using the scale set ID.

  OAuth app tokens and personal access tokens (classic) need the `manage_runners:enterprise` scope to use this endpoint.
tags:
  - actions
operationId: enterprise-admin/get-runner-scale-set-for-enterprise

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#get-a-runner-scale-set-for-an-enterprise"

# Describe how this operation is accessible
x-github-internal:
  path: /enterprises/{enterprise}/actions/runners/scalesets/{runner_scale_set_id}
  http-method: get
  published: false
  owner: "@github/c2c-actions"

# Define in which versions your operation is available
x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/enterprise.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"

responses:
