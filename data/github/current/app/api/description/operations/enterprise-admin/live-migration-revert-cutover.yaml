---
summary: Revert cutover for an Enterprise Live Migration
description: 'Revert cutover for an Enterprise Live Migration (ELM). This unarchives the source repository and terminates any cutover or migration still in progress so the source repository can be migrated again.'
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/live-migrations#revert-cutover-for-an-enterprise-live-migration'
tags:
- enterprise-admin
operationId: enterprise-admin/live-migration-revert-cutover
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: string
responses:
  '200':
    description: The cutover was reverted.
    content:
      application/json:
        schema:
          type: object
          required:
          - success
          - unarchived_source_repository
          - in_progress_cutover_terminated
          - in_progress_migration_terminated
          properties:
            success:
              type: boolean
              description: Whether the cutover was successfully reverted.
            unarchived_source_repository:
              type: boolean
              description: Whether the source repository was unarchived.
            in_progress_cutover_terminated:
              type: boolean
              description: Whether an in-progress cutover was terminated.
            in_progress_migration_terminated:
              type: boolean
              description: Whether an in-progress migration was terminated.
  '400':
    "$ref": '../../components/responses/bad_request.yaml'
  '401':
    "$ref": '../../components/responses/requires_authentication.yaml'
  '403':
    "$ref": '../../components/responses/forbidden.yaml'
  '404':
    "$ref": '../../components/responses/not_found.yaml'
  '409':
    description: Conflict. The migration is not in a state where cutover can be reverted.
  '500':
    "$ref": '../../components/responses/internal_error.yaml'
  '503':
    "$ref": '../../components/responses/service_unavailable.yaml'
x-github-releases:
- ghes: '>= 3.17'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-admin
  subcategory: live-migrations
x-github-internal:
  path: '/enterprise/live-migrations/{migration_id}/revert-cutover'
  http-method: post
  service-tier: 2
  published: false
  owner: '@github/migrations-vnext'
