---
summary: Create or update an organization custom property definition on an enterprise
description: |-
  Creates a new or updates an existing organization custom property definition that is defined on an enterprise.

  Access requirements:
  - Enterprise admins
  - OAuth tokens and personal access tokens (classic) with the `admin:enterprise` scope
  - Actors with the enterprise-level "manage enterprise custom properties for organizations" fine-grained permission
tags:
  - enterprise-admin
operationId: enterprise-admin/custom-properties-for-orgs-create-or-update-enterprise-definition
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties-for-orgs#create-or-update-an-organization-custom-property-definition-on-an-enterprise'
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
  - $ref: '../../components/parameters/custom-property-name.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/organization-custom-property-payload.yaml'
      examples:
        default:
          value:
            value_type: single_select
            required: true
            default_value: production
            description: 'Prod or dev environment'
            allowed_values:
            - production
            - development
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/organization-custom-property.yaml'
        examples:
          default:
            $ref: '../../components/examples/organization-custom-property.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed_simple.yaml'
x-github-releases:
  - ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties-for-orgs
x-github-internal:
  path: '/enterprises/{enterprise}/org-properties/schema/{custom_property_name}'
  http-method: put
  service-tier: 2
  owner: '@github/repos'
  published: false
