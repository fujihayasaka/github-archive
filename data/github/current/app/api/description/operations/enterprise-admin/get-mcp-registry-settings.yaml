---
summary: Get MCP registry settings for an enterprise
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Gets the current MCP (Model Context Protocol) registry settings for an enterprise.

  Enterprise owners and users with the `read_enterprise_ai_controls` permission can use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `read:enterprise` scope to use this endpoint.
tags:
- enterprise-admin
operationId: enterprise-admin/get-mcp-registry-settings
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/ai-controls#get-mcp-registry-settings-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/ai-controls/mcp
  http-method: get
  published: false
  owner: '@github/copilot-controls-eng'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether MCP is currently enabled for the enterprise. Only true when policy is 'enabled'.
            policy:
              type: string
              enum:
                - enabled
                - disabled
                - organizations_decide
                - unconfigured
              description: |
                The current MCP policy state:
                - `enabled` - MCP is enabled everywhere, registry settings can be configured
                - `disabled` - MCP is disabled for the enterprise
                - `organizations_decide` - Each organization can decide their own MCP settings
                - `unconfigured` - No policy has been set (initial state)
            registry_access:
              type: string
              nullable: true
              enum:
                - allow_all
                - registry_only
              description: The registry access mode. Can only be set when policy is 'enabled'.
            registry_url:
              type: string
              nullable: true
              description: The allowed MCP registry URL (when registry_access is registry_only). Can only be set when policy is 'enabled'.
            created_at:
              type: string
              nullable: true
              format: date-time
              description: When the MCP registry settings were created
            updated_at:
              type: string
              nullable: true
              format: date-time
              description: When the MCP registry settings were last updated
            updated_by:
              type: object
              nullable: true
              description: The user who last updated the settings
              properties:
                login:
                  type: string
                  description: The user's login
                id:
                  type: integer
                  description: The user's ID
                avatar_url:
                  type: string
                  description: The user's avatar URL
                type:
                  type: string
                  description: The type of the account (e.g., User)
          required:
            - enabled
            - policy
        examples:
          default:
            value:
              enabled: true
              policy: enabled
              registry_access: registry_only
              registry_url: "https://mcp-registry.example.com"
              created_at: "2024-01-15T10:30:00Z"
              updated_at: "2024-01-15T10:30:00Z"
              updated_by:
                login: "admin"
                id: 123
  '500':
    $ref: '../../components/responses/internal_error.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: ai-controls
