---
summary: Update MCP registry settings for an enterprise
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Updates the MCP (Model Context Protocol) registry settings for an enterprise.

  Enterprise owners and users with the `write_enterprise_ai_controls` permission can use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:enterprise` scope to use this endpoint.
tags:
- enterprise-admin
operationId: enterprise-admin/update-mcp-registry-settings
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/ai-controls#update-mcp-registry-settings-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/ai-controls/mcp
  http-method: patch
  published: false
  owner: '@github/copilot-controls-eng'
x-github-releases:
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  description: The MCP registry settings to update
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          policy:
            type: string
            enum:
              - enabled
              - disabled
              - organizations_decide
            description: |
              The MCP policy for the enterprise:
              - `enabled` - Enable MCP everywhere, allows configuring registry settings
              - `disabled` - Disable MCP for the enterprise
              - `organizations_decide` - Let each organization decide their own MCP settings
          registry_access:
            type: string
            enum:
              - allow_all
              - registry_only
            description: The registry access mode. Can only be set when policy is 'enabled'.
          registry_url:
            type: string
            nullable: true
            description: The allowed MCP registry URL. Can only be set when policy is 'enabled'. Required when registry_access is 'registry_only'.
      examples:
        enable_with_registry:
          summary: Enable MCP with registry-only access
          value:
            policy: enabled
            registry_access: registry_only
            registry_url: "https://mcp-registry.example.com"
        enable_allow_all:
          summary: Enable MCP with allow all access
          value:
            policy: enabled
            registry_access: allow_all
        disable:
          summary: Disable MCP
          value:
            policy: disabled
        organizations_decide:
          summary: Let organizations decide
          value:
            policy: organizations_decide
responses:
  '200':
    description: OK
    content:
      application/json:
        schema:
          type: object
          properties:
            enabled:
              type: boolean
              description: Whether MCP is currently enabled for the enterprise. Only true when policy is 'enabled'.
            policy:
              type: string
              enum:
                - enabled
                - disabled
                - organizations_decide
                - unconfigured
              description: The current MCP policy state
            registry_access:
              type: string
              nullable: true
              enum:
                - allow_all
                - registry_only
              description: The registry access mode
            registry_url:
              type: string
              nullable: true
              description: The allowed MCP registry URL (when registry_access is registry_only)
            created_at:
              type: string
              nullable: true
              format: date-time
              description: When the MCP registry settings were created
            updated_at:
              type: string
              nullable: true
              format: date-time
              description: When the MCP registry settings were last updated
            updated_by:
              type: object
              nullable: true
              description: The user who last updated the settings
              properties:
                login:
                  type: string
                  description: The user's login
                id:
                  type: integer
                  description: The user's ID
                avatar_url:
                  type: string
                  description: The user's avatar URL
                type:
                  type: string
                  description: The type of the account (e.g., User)
          required:
            - enabled
            - policy
        examples:
          default:
            value:
              enabled: true
              policy: enabled
              registry_access: registry_only
              registry_url: "https://mcp-registry.example.com"
              created_at: "2024-01-15T10:30:00Z"
              updated_at: "2024-01-15T10:30:00Z"
              updated_by:
                login: "admin"
                id: 123
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: ai-controls
