---
summary: Enterprise Migration Status
description: 'Enterprise endpoint to show the status of a migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-status'
operationId: enterprise-admin/migration-status
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: integer
    format: int64
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            migration:
              type: object
              properties:
                migrationId:
                  type: string
                  description: The unique identifier for the migration
                  example: "12345"
                status:
                  type: string
                  description: Current status of the migration
                  enum:
                  - STATUS_TYPE_INVALID
                  - STATUS_TYPE_IN_PROGRESS
                  - STATUS_TYPE_COMPLETE
                  - STATUS_TYPE_FAILED
                  - STATUS_TYPE_ABORTED
                  - STATUS_TYPE_EXPIRED
                  - STATUS_TYPE_PAUSED
                  example: "STATUS_TYPE_IN_PROGRESS"
                expiresAt:
                  type: string
                  format: date-time
                  description: Timestamp when the migration expires
                  example: "2024-01-01T00:00:00Z"
                description:
                  type: string
                  description: Optional description of the migration
                  example: "Migration of example repository"
                repositories:
                  type: array
                  description: List of repositories included in the migration
                  items:
                    type: string
                    example: "org/repo-name"
                repositoryProgress:
                  type: array
                  description: Migration progress for each repository
                  items:
                    type: object
                    properties:
                      repositoryNwo:
                        type: string
                        description: The name with owner of the repository (e.g., "owner/repo")
                        example: "org/repo-name"
                      resourcesAdded:
                        type: integer
                        format: int64
                        description: The number of resources added to the migration
                        example: 150
                      resourcesProcessed:
                        type: integer
                        format: int64
                        description: The number of resources that have been processed
                        example: 75
                      allResourcesSent:
                        type: boolean
                        description: Whether all resources have been sent by the crawler
                        example: false
                      eventsAdded:
                        type: integer
                        format: int64
                        description: The number of events added during the migration
                        example: 50
                      eventsProcessed:
                        type: integer
                        format: int64
                        description: The number of events that have been processed
                        example: 25
                    required:
                    - repositoryNwo
                    - resourcesAdded
                    - resourcesProcessed
                    - allResourcesSent
                    - eventsAdded
                    - eventsProcessed
              required:
              - migrationId
              - status
              - expiresAt
          required:
          - migration
        examples:
          default:
            summary: Migration status response
            value:
              migration:
                migrationId: "12345"
                status: "STATUS_TYPE_IN_PROGRESS"
                expiresAt: "2024-01-01T00:00:00Z"
                description: "Migration of example repository"
                repositories:
                - "org/repo-name"
                repositoryProgress:
                - repositoryNwo: "org/repo-name"
                  resourcesAdded: 150
                  resourcesProcessed: 75
                  allResourcesSent: false
                  eventsAdded: 50
                  eventsProcessed: 25
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/{migration_id}/status'
  http-method: get
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
