---
summary: Enterprise Migration Status
description: 'Enterprise endpoint to show the status of a migration.'
tags:
- enterprise-admin
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/migrations#enterprise-migration-status'
operationId: enterprise-admin/migration-status
parameters:
- name: migration_id
  in: path
  description: The ID of the migration.
  required: true
  schema:
    type: integer
    format: int64
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            migration:
              type: object
              properties:
                migrationId:
                  type: string
                  description: The unique identifier for the migration
                  example: "12345"
                status:
                  type: string
                  description: Current status of the migration
                  enum:
                  - STATUS_TYPE_INVALID
                  - STATUS_TYPE_IN_PROGRESS
                  - STATUS_TYPE_COMPLETE
                  - STATUS_TYPE_FAILED
                  - STATUS_TYPE_ABORTED
                  - STATUS_TYPE_EXPIRED
                  - STATUS_TYPE_PAUSED
                  example: "STATUS_TYPE_IN_PROGRESS"
                expiresAt:
                  type: string
                  format: date-time
                  description: Timestamp when the migration expires
                  example: "2024-01-01T00:00:00Z"
                description:
                  type: string
                  description: Optional description of the migration
                  example: "Migration of example repository"
                repositories:
                  type: array
                  description: List of repositories included in the migration
                  items:
                    type: string
                    example: "org/repo-name"
                repositoryProgress:
                  type: array
                  description: Migration progress for each repository
                  items:
                    $ref: '../../components/schemas/enterprise-migration-repository-progress.yaml'
                repositoryStateSummaries:
                  type: array
                  description: State summaries for each repository including acknowledged totals and breakdown.
                  items:
                    $ref: '../../components/schemas/enterprise-migration-repository-state-summary.yaml'
              required:
              - migrationId
              - status
              - expiresAt
          required:
          - migration
        examples:
          default:
            summary: Migration status response
            value:
              migration:
                migrationId: "12345"
                status: "STATUS_TYPE_IN_PROGRESS"
                expiresAt: "2024-01-01T00:00:00Z"
                description: "Migration of example repository"
                repositories:
                - "org/repo-name"
                repositoryProgress:
                - repositoryNwo: "org/repo-name"
                  resourcesAdded: 150
                  resourcesProcessed: 75
                  allResourcesSent: false
                  eventsAdded: 50
                  eventsProcessed: 25
                  backfillResourcesAcknowledged: 10
                  liveUpdateResourcesAcknowledged: 5
                repositoryStateSummaries:
                - namespace: "org"
                  repository: "repo-name"
                  totalAcknowledged: 15
                  backfill:
                    totalAcknowledged: 10
                    breakdown:
                    - state: "NODE_STATE_ACKNOWLEDGED"
                      kind: "NODE_KIND_RESOURCE"
                      type: "issue"
                      count: 10
                      origin: "NODE_ORIGIN_BACKFILL"
                  liveUpdate:
                    totalAcknowledged: 5
                    breakdown:
                    - state: "NODE_STATE_ACKNOWLEDGED"
                      kind: "NODE_KIND_EVENT"
                      type: "issue_comment"
                      count: 5
                      origin: "NODE_ORIGIN_LIVE_UPDATE"
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: migrations
x-github-internal:
  path: '/enterprise/migration/{migration_id}/status'
  http-method: get
  # this endpoint is only meant to be used in multi-tenant environments. It should not be published.
  published: false
  owner: '@github/migrations-vnext'
