---
summary: Create or update custom properties for an enterprise
description: |-
  > [!NOTE]
  > This endpoint is in public preview and is subject to change.

  Creates new or updates existing custom properties defined for an enterprise in a batch.

  If the property already exists, the existing property will be replaced with the new values.
  Missing optional values will fall back to default values, previous values will be overwritten.
  E.g. if a property exists with `values_editable_by: org_and_repo_actors` and it's updated without specifying `values_editable_by`, it will be updated to default value `org_actors`.

  To use this endpoint, the authenticated user must be an administrator for the enterprise.
tags:
- enterprise-admin
operationId: enterprise-admin/create-or-update-enterprise-custom-properties
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-admin/custom-properties#create-or-update-custom-properties-for-an-enterprise'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          properties:
            type: array
            description: The array of custom properties to create or update.
            items:
              $ref: '../../components/schemas/custom-property.yaml'
            minItems: 1
            maxItems: 100
        required:
        - properties
      examples:
        default:
          value:
            properties:
            - property_name: environment
              value_type: single_select
              required: true
              default_value: production
              description: 'Prod or dev environment'
              allowed_values:
              - production
              - development
              values_editable_by: org_actors
            - property_name: service
              value_type: string
            - property_name: team
              value_type: string
              description: 'Team owning the repository'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/custom-property.yaml'
        examples:
          default:
            $ref: '../../components/examples/custom-properties.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: enterprise-admin
  subcategory: custom-properties
x-github-internal:
  path: '/enterprises/{enterprise}/properties/schema'
  http-method: patch
  service-tier: 2
  owner: '@github/repos'
  published: true
