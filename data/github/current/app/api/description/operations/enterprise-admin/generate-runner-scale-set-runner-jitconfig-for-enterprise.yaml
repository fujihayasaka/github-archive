---
summary: "Generate a Runner JIT Config for a Scale Set in an enterprise"
description: |-
  Generates a just-in-time (JIT) configuration for a runner in a Scale Set for an enterprise. This is used to register a new runner with the scale set.

  OAuth app tokens and personal access tokens (classic) need the `manage_runners:enterprise` scope to use this endpoint.
tags:
  - actions
operationId: enterprise-admin/generate-runner-scale-set-runner-jitconfig-for-enterprise

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#generate-a-runner-jit-config-for-a-scale-set-in-an-enterprise"

# Describe how this operation is accessible
x-github-internal:
  path: /enterprises/{enterprise}/actions/runners/scalesets/{runner_scale_set_id}/generate-jitconfig
  http-method: post
  published: false
  owner: "@github/c2c-actions"

# Define in which versions your operation is available
x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/enterprise.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"

requestBody:
  required: false
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the runner.
          workFolder:
            type: string
            description: The working directory for the runner.
      examples:
        default:
          value:
            name: "enterprise-scale-set-runner"
            workFolder: "/home/runners/work"

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set_runner_jitconfig.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "409":
    $ref: "../../components/responses/service_unavailable.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

# Additional metadata
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
