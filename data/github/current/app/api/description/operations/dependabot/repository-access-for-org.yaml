---
summary: Lists the repositories Dependabot can access in an organization
description: |-
  Lists repositories that organization admins have allowed Dependabot to access when updating dependencies.
  > [!NOTE]
  >    This operation supports both server-to-server and user-to-server access.
  Unauthorized users will not see the existence of this endpoint.
tags:
- dependabot
operationId: dependabot/repository-access-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/repository-access#lists-the-repositories-dependabot-can-access-in-an-organization'
x-github-internal:
  path: /organizations/{org}/dependabot/repository-access
  http-method: get
  published: true
  owner: '@github/dependabot-updates'
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.18'
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - name: page
    in: query
    description: The page number of results to fetch.
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: per_page
    in: query
    description: Number of results per page.
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/dependabot-repository-access-details.yaml'
        examples:
          default:
            $ref: '../../components/examples/dependabot-repository-access-details.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: dependabot
  subcategory: repository-access
