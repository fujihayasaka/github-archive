---
summary: Review a dismissal request for a Dependabot alert for a repository
description: |-
  Approve or deny a dismissal request to dismiss a Dependabot alert in a repository.

  Delegated alert dismissal must be enabled on the repository and the user must be a dismissal reviewer to access this endpoint.
  OAuth app tokens and personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - dependabot
operationId: dependabot/review-dismissal-request-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/alert-dismissal-requests#review-a-dismissal-request-for-a-dependabot-alert-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/dependabot/{alert_number}
  http-method: patch
  published: true
  owner: '@github/dependabot-updates'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: dependabot
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.19'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: alert_number
   in: path
   required: true
   description: The number that identifies the Dependabot alert.
   schema:
     type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: string
            description: The review action to perform on the dismissal request.
            enum:
              - approve
              - deny
          message:
            type: string
            description: A message to include with the review. Has a maximum character length of 2048.
        required:
          - status
          - message
      examples:
        default:
          value:
            status: "approve"
            message: Used in tests.
responses:
  '200':
    description: The review of the dismissal request.
    content:
      application/json:
        schema:
          type: object
          properties:
            dismissal_review_id:
              type: integer
              description: ID of the dismissal review.
        examples:
          default:
            value:
              dismissal_review_id: 1
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
