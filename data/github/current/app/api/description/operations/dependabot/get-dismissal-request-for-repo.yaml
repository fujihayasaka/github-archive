---
summary: Get a dismissal request for a Dependabot alert for a repository
description: |-
  Gets a dismissal request to dismiss a Dependabot alert in a repository.

  Delegated alert dismissal must be enabled on the repository.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - dependabot
operationId: dependabot/get-dismissal-request-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/alert-dismissal-requests#get-a-dismissal-request-for-a-dependabot-alert-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/dependabot/{alert_number}
  http-method: get
  published: true
  owner: '@github/dependabot-updates'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: dependabot
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.19'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
  - name: alert_number
    in: path
    required: true
    description: The number that identifies the Dependabot alert.
    schema:
      type: integer
responses:
  '200':
    description: A single dismissal request.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/dependabot-alert-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/dependabot-alert-dismissal-request-item.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
