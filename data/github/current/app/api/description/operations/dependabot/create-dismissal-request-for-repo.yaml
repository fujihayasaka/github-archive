---
summary: Create a dismissal request for a Dependabot alert for a repository
description: |-
  Creates a new dismissal request to dismiss a Dependabot alert in a repository.

  Delegated alert dismissal must be enabled on the repository and the user must have permission to view Dependabot alerts to access this endpoint.
  OAuth app tokens and personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - dependabot
operationId: dependabot/create-dismissal-request-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/alert-dismissal-requests#create-a-dismissal-request-for-a-dependabot-alert-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/dependabot/{alert_number}
  http-method: post
  published: true
  owner: '@github/dependabot-updates'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: dependabot
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.20'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: alert_number
   in: path
   required: true
   description: The number that identifies the Dependabot alert.
   schema:
     type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          dismissed_reason:
            type: string
            description: The reason for dismissing the alert.
            enum:
              - fix_started
              - no_bandwidth
              - tolerable_risk
              - inaccurate
              - not_used
          dismissed_comment:
            type: string
            description: An optional comment explaining the dismissal.
        required:
          - dismissed_reason
      examples:
        default:
          value:
            dismissed_reason: "tolerable_risk"
            dismissed_comment: "Risk is acceptable for this project."
responses:
  '201':
    description: The created dismissal request.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/dependabot-alert-dismissal-request.yaml'
        examples:
          default:
            value:
              id: 1
              number: 1
              repository:
                id: 1
                name: "hello-world"
                full_name: "octocat/hello-world"
              organization:
                id: 1
                name: "octocat"
              requester:
                actor_id: 1
                actor_name: "octocat"
              request_type: "dependabot_alert_closure"
              data:
                - reason: "tolerable_risk"
                  alert_number: "42"
                  alert_title: "lodash vulnerability"
              resource_identifier: "42"
              status: "pending"
              requester_comment: "Risk is acceptable for this project."
              expires_at: "2024-01-15T00:00:00Z"
              created_at: "2024-01-08T00:00:00Z"
              responses: null
              url: "https://github.com/octocat/hello-world/security/dependabot/42"
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
