---
summary: Updates repositories to the list of repositories that organization admins have allowed
    Dependabot to access when updating dependencies.
description: |-
  > [!NOTE]
  >    This operation supports both server-to-server and user-to-server access.
  Unauthorized users will not see the existence of this endpoint.

  **Example request body:**
  ```json
  {
    "repository_ids_to_add": [123, 456],
    "repository_ids_to_remove": [789]
  }
  ```

tags:
- dependabot
operationId: dependabot/update-repository-access-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/repository-access#updates-repositories-to-the-list-of-repositories-that-organization-admins-have-allowed-dependabot-to-access-when-updating-dependencies'
x-github-internal:
  path: /organizations/{org}/dependabot/repository-access
  http-method: patch
  published: true
  owner: '@github/dependabot-updates'
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.18'
parameters:
  - $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          repository_ids_to_add:
            type: array
            items:
              type: integer
            description: List of repository IDs to add.
          repository_ids_to_remove:
            type: array
            items:
              type: integer
            description: List of repository IDs to remove.
        example:
          repository_ids_to_add: [123, 456]
          repository_ids_to_remove: [789]
      examples:
        '204':
          summary: Example with a 'succeeded' status.
        add-example:
          summary: Add repositories
          value:
            repository_ids_to_add: [123, 456]
        remove-example:
          summary: Remove repositories
          value:
            repository_ids_to_remove: [789]
responses:
  '204':
    description: Response
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: dependabot
  subcategory: repository-access
