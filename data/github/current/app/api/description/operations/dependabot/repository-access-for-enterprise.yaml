---
summary: Lists the repositories Dependabot can access in an enterprise
description: |-
  Lists repositories that enterprise admins have allowed Dependabot to access when updating dependencies across organizations in the enterprise.

  The authenticated user must be an enterprise owner to use this endpoint.
tags:
- dependabot
operationId: dependabot/repository-access-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/repository-access#lists-the-repositories-dependabot-can-access-in-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/dependabot/repository-access
  http-method: get
  published: true
  owner: '@github/dependabot-updates'
x-github-releases:
  - ghec
  - api.github.com
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
  - name: page
    in: query
    description: The page number of results to fetch.
    required: false
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: per_page
    in: query
    description: Number of results per page.
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 30
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/dependabot-repository-access-details.yaml'
        examples:
          default:
            $ref: '../../components/examples/dependabot-repository-access-details.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: dependabot
  subcategory: repository-access
