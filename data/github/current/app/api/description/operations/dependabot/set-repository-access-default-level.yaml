---
summary: Set the default repository access level for Dependabot
description: |-
  > [!NOTE]
  >    This operation supports both server-to-server and user-to-server access.
  Sets the default level of repository access Dependabot will have while performing an update.  Available values are:
  - 'public' - Dependabot will only have access to public repositories, unless access is explicitly granted to non-public repositories.
  - 'internal' - Dependabot will only have access to public and internal repositories, unless access is explicitly granted to private repositories.

  Unauthorized users will not see the existence of this endpoint.

tags:
- dependabot
operationId: dependabot/set-repository-access-default-level
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/repository-access#set-the-default-repository-access-level-for-dependabot'
x-github-internal:
  path: /organizations/{org}/dependabot/repository-access/default-level
  http-method: put
  published: true
  owner: '@github/dependabot-updates'
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.18'
parameters:
  - $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          default_level:
            type: string
            description: The default repository access level for Dependabot updates.
            enum:
              - public
              - internal
            example: internal
        required:
          - default_level
      examples:
        '204':
          summary: Example with a 'succeeded' status.
          value:
            default_level: public
responses:
  '204':
    description: Response
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: dependabot
  subcategory: repository-access
