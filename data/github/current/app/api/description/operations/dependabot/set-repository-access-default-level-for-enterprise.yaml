---
summary: Set the default repository access level for Dependabot in an enterprise
description: |-
  Sets the default level of repository access Dependabot will have while performing an update across organizations in the enterprise. Available values are:
  - 'public' - Dependabot will only have access to public repositories, unless access is explicitly granted to non-public repositories.
  - 'internal' - Dependabot will only have access to public and internal repositories, unless access is explicitly granted to private repositories.

  The authenticated user must be an enterprise owner to use this endpoint.
tags:
- dependabot
operationId: dependabot/set-repository-access-default-level-for-enterprise
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/repository-access#set-the-default-repository-access-level-for-dependabot-in-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/dependabot/repository-access/default-level
  http-method: put
  published: true
  owner: '@github/dependabot-updates'
x-github-releases:
  - ghec
  - api.github.com
parameters:
  - $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          default_level:
            type: string
            description: The default repository access level for Dependabot updates.
            enum:
              - public
              - internal
            example: internal
        required:
          - default_level
      examples:
        '204':
          summary: Example with a 'succeeded' status.
          value:
            default_level: public
responses:
  '204':
    description: Response
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: dependabot
  subcategory: repository-access
