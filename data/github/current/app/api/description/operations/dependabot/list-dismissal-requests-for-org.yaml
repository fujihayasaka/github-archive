---
summary: List dismissal requests for Dependabot alerts for an organization
description: |-
  Lists dismissal requests for Dependabot alerts in an organization.

  Delegated alert dismissal must be enabled on repositories in the org and the user must be an org admin, security manager,
  or have the appropriate permission to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - dependabot
operationId: dependabot/list-dismissal-requests-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/alert-dismissal-requests#list-dismissal-requests-for-dependabot-alerts-for-an-organization'
x-github-internal:
  path: /orgs/{org}/dismissal-requests/dependabot
  http-method: get
  published: true
  owner: '@github/dependabot-updates'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: dependabot
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.19'
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/repository-name-in-query.yaml'
  - $ref: '../../components/parameters/bypass-reviewer-name.yaml'
  - $ref: '../../components/parameters/bypass-requester-name.yaml'
  - $ref: '../../components/parameters/time-period.yaml'
  - $ref: '../../components/parameters/dismissal-request-status.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
  - $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of alert dismissal requests.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/dependabot-alert-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/dependabot-alert-dismissal-request-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
