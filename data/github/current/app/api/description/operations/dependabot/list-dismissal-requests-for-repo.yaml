---
summary: List dismissal requests for Dependabot alerts for a repository
description: |-
  Lists dismissal requests for Dependabot alerts for a repository.

  Delegated alert dismissal must be enabled on the repository.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - dependabot
operationId: dependabot/list-dismissal-requests-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/alert-dismissal-requests#list-dismissal-requests-for-dependabot-alerts-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/dependabot
  http-method: get
  published: true
  owner: '@github/dependabot-updates'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: dependabot
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.19'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
  - $ref: '../../components/parameters/alert-dismissal-reviewer-name.yaml'
  - $ref: '../../components/parameters/alert-dismissal-requester-name.yaml'
  - $ref: '../../components/parameters/alert-dismissal-time-period.yaml'
  - $ref: '../../components/parameters/alert-dismissal-request-status.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
  - $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of alert dismissal requests.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/dependabot-alert-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/dependabot-alert-dismissal-request-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
