---
summary: Cancel a dismissal request for a Dependabot alert for a repository
description: |-
  Cancels a pending dismissal request for a Dependabot alert in a repository.

  The authenticated user must be the requester of the dismissal request or have reviewer permissions (security manager or organization owner).
  Delegated alert dismissal must be enabled on the repository.
  OAuth app tokens and personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - dependabot
operationId: dependabot/cancel-dismissal-request-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/dependabot/alert-dismissal-requests#cancel-a-dismissal-request-for-a-dependabot-alert-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/dependabot/{alert_number}
  http-method: delete
  published: true
  owner: '@github/dependabot-updates'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: dependabot
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.20'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
  - name: alert_number
    in: path
    required: true
    description: The number that identifies the Dependabot alert.
    schema:
      type: integer
responses:
  '204':
    description: Dismissal request cancelled successfully.
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
