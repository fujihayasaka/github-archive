---
summary: List code quality findings for a repository
description: |-
  Lists code quality findings for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint with private or public repositories, or the `public_repo` scope to use this endpoint with only public repositories.
tags:
- code-quality
operationId: code-quality/list-findings-for-repo
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/code-quality/code-quality#list-code-quality-findings-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/direction.yaml'
- $ref: '../../components/parameters/pagination-before.yaml'
- $ref: '../../components/parameters/pagination-after.yaml'
- name: state
  description: If specified, only code quality findings with this state will be returned.
  in: query
  required: false
  schema:
    type: string
    enum:
    - open
    - dismissed
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/code-quality-finding.yaml'
        examples:
          default:
            $ref: '../../components/examples/code-quality-finding-items.yaml'
  '403':
    $ref: '../../components/responses/code_quality_forbidden_read.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-releases:
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: code-quality
  subcategory: code-quality
x-github-internal:
  path: '/repos/{owner}/{repo}/code-quality/findings'
  http-method: get
  service-tier: 2
  owner: '@github/code-scanning-experiences'
  published: false
  deprecatedFields: false
