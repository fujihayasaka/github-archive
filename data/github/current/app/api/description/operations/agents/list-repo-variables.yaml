---
summary: List repository variables
description: |-
  Lists all repository variables.

  Authenticated users must have collaborator access to a repository to create, update, or read variables.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
- agents
operationId: agents/list-repo-variables
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/agents/variables#list-repository-variables'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
- $ref: '../../components/parameters/variables-per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
          - total_count
          - variables
          properties:
            total_count:
              type: integer
            variables:
              type: array
              items:
                $ref: '../../components/schemas/actions-variable.yaml'
        examples:
          default:
            $ref: '../../components/examples/actions-variables-paginated.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: agents
  subcategory: variables
x-github-internal:
  path: '/repos/{owner}/{repo}/agents/variables'
  http-method: get
  service-tier: 1
  owner: '@github/copilot-coding-agent-reviewers'
  published: true
