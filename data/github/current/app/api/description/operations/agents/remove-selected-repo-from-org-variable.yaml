---
summary: Remove selected repository from an organization variable
description: |-
  Removes a repository from an organization agent variable that is
  available to selected repositories. Organization variables that are available to
  selected repositories have their `visibility` field set to `selected`.

  Authenticated users must have collaborator access to a repository to create, update, or read variables.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint. If the repository is private, the `repo` scope is also required.
tags:
- agents
operationId: agents/remove-selected-repo-from-org-variable
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/agents/variables#remove-selected-repository-from-an-organization-variable'
parameters:
- $ref: '../../components/parameters/org.yaml'
- $ref: '../../components/parameters/variable-name.yaml'
- name: repository_id
  in: path
  required: true
  schema:
    type: integer
responses:
  '204':
    description: Response
  '409':
    description: Response when the visibility of the variable is not set to `selected`
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: agents
  subcategory: variables
x-github-internal:
  path: '/orgs/{org}/agents/variables/{name}/repositories/{repository_id}'
  http-method: delete
  service-tier: 1
  owner: '@github/copilot-coding-agent-reviewers'
  published: true
