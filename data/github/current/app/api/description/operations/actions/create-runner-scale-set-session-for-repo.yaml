---
summary: "Create a Runner Scale Set Session for a repository"
description: |-
  Creates a session for a runner scale set in a repository.

  Authenticated users must have admin access to the repository to use this endpoint.

  OAuth tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
  - actions
operationId: actions/create-runner-scale-set-session-for-repo

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#create-a-runner-scale-set-session-for-a-repository"

x-github-internal:
  path: /repos/{owner}/{repo}/actions/runners/scalesets/{runner_scale_set_id}/sessions
  http-method: post
  published: false
  owner: "@github/c2c-actions"

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/owner.yaml"
  - $ref: "../../components/parameters/repo.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"

requestBody:
  description: The session details
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          ownerName:
            type: string
            description: The name of the runner scale set session owner.
      examples:
        default:
          value:
            ownerName: My Session Owner
responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set_session.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
