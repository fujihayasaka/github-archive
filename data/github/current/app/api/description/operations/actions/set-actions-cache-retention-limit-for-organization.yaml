---
summary: Set GitHub Actions cache retention limit for an organization
description: |-
  Sets GitHub Actions cache retention limit for an organization. All repositories under this
  organization may not set a higher cache retention limit.

  OAuth tokens and personal access tokens (classic) need the `admin:organization` scope to use this endpoint.
tags:
- actions
operationId: actions/set-actions-cache-retention-limit-for-organization
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/cache#set-github-actions-cache-retention-limit-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/actions-cache-retention-limit-for-organization.yaml'
      examples:
        selected_actions:
          $ref: '../../components/examples/actions-cache-retention-limit.yaml'
responses:
  '204':
    description: Response
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
