---
summary: Set private repo fork PR workflow settings for a repository
description: |-
  Sets the settings for whether workflows from fork pull requests can run on a private repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
operationId: actions/set-private-repo-fork-pr-workflows-settings-repository
tags:
- actions
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/permissions#set-private-repo-fork-pr-workflow-settings-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/actions-fork-pr-workflows-private-repos-request.yaml'
      examples:
        default:
          $ref: '../../components/examples/actions-fork-pr-workflows-private-repos.yaml'
responses:
  '204':
    description: Empty response for successful settings update
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
