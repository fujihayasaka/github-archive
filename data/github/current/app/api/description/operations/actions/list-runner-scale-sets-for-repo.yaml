---
summary: "List Runner Scale Sets for a repository"
description: |-
  Lists all runner scale sets configured in an a repository.

  Authenticated users must have admin access to the repository to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
  - actions
operationId: actions/list-runner-scale-sets-for-repo

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#list-runner-scale-sets-for-a-repository"

x-github-internal:
  path: /repos/{owner}/{repo}/actions/runners/scalesets
  http-method: get
  published: false
  owner: "@github/c2c-actions"

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/owner.yaml"
  - $ref: "../../components/parameters/repo.yaml"
  - $ref: "../../components/parameters/per-page.yaml"
  - $ref: "../../components/parameters/page.yaml"
  - $ref: "../../components/parameters/runner-scale-set-name.yaml"
  - $ref: "../../components/parameters/runner-scale-set-group-id.yaml"

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set_list.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
