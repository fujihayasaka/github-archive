---
summary: 'Run an Actions workflow dynamically'
description: |-
    Trigger an Actions workflow run with the passed in workflow.
    https://thehub.github.com/epd/engineering/products-and-services/actions/dynamic-workflows/
tags:
  - actions
operationId: actions/run-dynamic-workflow-internal

externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/workflows#run-an-actions-workflow-dynamically'

x-github-internal:
  path: /internal/repos/{owner}/{repo}/actions/dynamic
  http-method: post
  published: false
  owner: '@github/actions-launch'

x-github-releases:
  - ghec
  - api.github.com

parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          workflow:
            type: string
            description: The actions workflow to run
          ref:
            type: string
            description: The git reference to run the workflow against.
          inputs:
            type: object
            description: Input keys and values configured in the workflow file. The
              maximum number of properties is 10. Any default properties configured
              in the workflow file will be used when `inputs` are omitted.
            additionalProperties:
              type: string
            maxProperties: 10
        required:
        - ref
      examples:
        default:
          value:
            workflow: "on: dynamic\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n    - run: echo Hello"
            ref: 'main'
            inputs:
              some: value
              another: value

responses:
  '201':
    description: The Actions dynamic workflow run details
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/actions-dynamic-workflow-run.yaml'
        examples:
          default:
            $ref: '../../components/examples/actions-dynamic-workflow-run.yaml'

x-github:
  # If the operation is only in GitHub Enterprise Cloud, set this to true
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: workflows
