---
summary: Set GitHub Actions cache retention limit for a repository
description: |-
  Sets GitHub Actions cache retention limit for a repository. This determines how long caches will be retained for, if
  not manually removed or evicted due to size constraints.

  OAuth tokens and personal access tokens (classic) need the `admin:repository` scope to use this endpoint.
tags:
- actions
operationId: actions/set-actions-cache-retention-limit-for-repository
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/cache#set-github-actions-cache-retention-limit-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/actions-cache-retention-limit-for-repository.yaml'
      examples:
        selected_actions:
          $ref: '../../components/examples/actions-cache-retention-limit.yaml'
responses:
  '204':
    description: Response
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: cache
x-github-internal:
  path: '/repos/{owner}/{repo}/actions/cache/retention-limit'
  http-method: put
  service-tier: 1
  owner: '@github/actions-results-team'
  published: false
