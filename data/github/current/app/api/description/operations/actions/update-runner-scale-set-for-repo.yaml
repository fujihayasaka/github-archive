---
summary: "Update an existing Runner Scale Set for a repository"
description: |-
  Updates the `name` and `runner_setting` of a runner scale set for a repository.

  Authenticated users must have admin access to the repository to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
  - actions
operationId: actions/update-runner-scale-set-for-repo

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#update-an-existing-runner-scale-set-for-a-repository"

x-github-internal:
  path: /repos/{owner}/{repo}/actions/runners/scalesets/{runner_scale_set_id}
  http-method: patch
  published: false
  owner: "@github/c2c-actions"

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/owner.yaml"
  - $ref: "../../components/parameters/repo.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The new name for the runner scale set.
            maxLength: 64
          runner_setting:
            type: object
            properties:
              ephemeral:
                type: boolean
                description: If runners are created as ephemeral by default.
              disable_update:
                type: boolean
                description: If runners have auto-update disabled by default.
          labels:
            type: array
            items:
              $ref: "../../components/schemas/runner-scale-set-label.yaml"
      examples:
        default:
          value:
            name: My Scale Set
responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
