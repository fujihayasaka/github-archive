---
summary: Get runner version end-of-life schedule for an organization
description: |-
  Gets the end-of-life schedule for a specific runner version in an organization. Returns the runner version
  and the dates when registration and runtime support will end.

  Authenticated users must have admin access to the organization to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `admin:org` scope to use this endpoint. If the repository is private, the `repo` scope is also required.
tags:
- actions
operationId: actions/get-runner-version-deprecation-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/self-hosted-runners#get-runner-version-end-of-life-schedule-for-an-organization'
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: version
  description: The runner version to look up.
  in: path
  required: true
  schema:
    type: string
  example: "2.300.0"
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
          - runner_version
          properties:
            runner_version:
              type: string
              description: The runner version string.
              example: "2.300.0"
            registration_deprecates_at:
              type: string
              format: date-time
              nullable: true
              description: The date after which this runner version can no longer register. Null if no schedule is set.
              example: "2026-08-01T00:00:00Z"
            runtime_deprecates_at:
              type: string
              format: date-time
              nullable: true
              description: The date after which jobs will no longer be dispatched to runners on this version.
              example: "2026-09-01T00:00:00Z"
        examples:
          default:
            value:
              runner_version: "2.300.0"
              registration_deprecates_at: "2026-08-01T00:00:00Z"
              runtime_deprecates_at: "2026-09-01T00:00:00Z"
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: actions
  subcategory: self-hosted-runners
x-github-internal:
  path: '/orgs/{org}/actions/runners/deprecations/{version}'
  http-method: get
  service-tier: 1
  owner: '@github/c2c-actions'
  published: false
