---
summary: "Refresh a Runner Scale Set Session for a repository"
description: |-
  Refreshes a session for a runner scale set in a repository.

  Authenticated users must have admin access to the repository to use this endpoint.

  OAuth tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
  - actions
operationId: actions/refresh-runner-scale-set-session-for-repo

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#refresh-a-runner-scale-set-session-for-a-repository"

x-github-internal:
  path: /repos/{owner}/{repo}/actions/runners/scalesets/{runner_scale_set_id}/sessions/{runner_scale_set_session_id}
  http-method: patch
  published: false
  owner: "@github/c2c-actions"

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/owner.yaml"
  - $ref: "../../components/parameters/repo.yaml"
  - $ref: "../../components/parameters/runner-scale-set-id.yaml"
  - $ref: "../../components/parameters/runner-scale-set-session-id.yaml"

responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set_session.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
