---
summary: "Create a Runner Scale Set for a repository"
description: |-
  Creates a runner scale set for a repository.

  Authenticated users must have admin access to the repository to use this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
  - actions
operationId: actions/create-runner-scale-set-for-repo

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#create-a-runner-scale-set-for-a-repository"

x-github-internal:
  path: /repos/{owner}/{repo}/actions/runners/scalesets
  http-method: post
  published: false
  owner: "@github/c2c-actions"

x-github-releases:
  - api.github.com
  - ghec

parameters:
  - $ref: "../../components/parameters/owner.yaml"
  - $ref: "../../components/parameters/repo.yaml"

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: The name of the new Runner Scale Set.
            maxLength: 64
          runnerSetting:
            type: object
            properties:
              ephemeral:
                type: boolean
                description: If runners are created as ephemeral by default.
              disableUpdate:
                type: boolean
                description: If runners have auto-update disabled by default.
      examples:
        default:
          value:
            name: My Scale Set
responses:
  "200":
    $ref: "../../components/responses/actions_runner_scale_set.yaml"
  "404":
    $ref: "../../components/responses/not_found.yaml"
  "422":
    $ref: "../../components/responses/validation_failed_simple.yaml"

x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: actions
  subcategory: runner-scale-sets
