parameters:
  - $ref: "../../components/parameters/org.yaml"

requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - runnerGroupId
        properties:
          name:
            type: string
            description: The name of the new runner scale set.
          runner_group_id:
            type: integer
            description: The ID of the runner group to register the runner scale set to.
          runner_setting:
            type: object
            properties:
              ephemeral:
                type: boolean
                description: If runners are created as ephemeral by default.
              disable_update:
                type: boolean
                description: If runners have auto-update disabled by default.
      examples:
        default:
          value:
            name: My Scale Set
            runner_group_id: 1
