summary: "Create a Runner Scale Set for an organization"
description: |-
  A longer summary of this operation. Please ask #docs-apis-and-events
  for a review and/or help, and check out https://thehub.github.com/epd/engineering/products-and-services/public-apis/rest/openapi/styleguide/#rest-api-style.
tags:
  - actions
operationId: actions/create-runner-scale-set-for-org

externalDocs:
  description: API method documentation
  url: "${externalDocsUrl}/rest/actions/runner-scale-sets#create-a-runner-scale-set-for-an-organization"

# Describe how this operation is accessible
# This is essential for us to generate the final OpenAPI description
x-github-internal:
  path: /orgs/{org}/actions/runners/scalesets
  http-method: post
  published: false
  owner: "@github/c2c-actions"

