---
summary: Get artifact and log retention settings for a repository
description: |-
  Gets artifact and log retention settings for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
operationId: actions/get-artifact-and-log-retention-settings-repository
tags:
- actions
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/permissions#get-artifact-and-log-retention-settings-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/actions-artifact-and-log-retention-response.yaml'
        examples:
          default:
            value:
              days: 90
              maximum_allowed_days: 365
  '404':
    $ref: '../../components/responses/not_found.yaml'
