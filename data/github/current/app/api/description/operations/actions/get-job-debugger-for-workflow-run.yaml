---
summary: Get the debugger URL for a workflow run job
description: |-
  Gets the debugger websocket URL for a specific job in a workflow run.
  The job must have been re-run with the debugger enabled, and only the
  user who triggered the re-run can access this endpoint.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
- actions
operationId: actions/get-job-debugger-for-workflow-run
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/workflow-runs#get-the-debugger-url-for-a-workflow-run-job'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
- $ref: '../../components/parameters/job-id.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            debugger_url:
              type: string
              description: The websocket URL to connect a DAP client to the job's debugger.
          required:
          - debugger_url
        examples:
          default:
            value:
              debugger_url: 'wss://use2-tunnel.devtunnels.ms/abc123'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
- ghec
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: actions
  subcategory: workflow-runs
x-github-internal:
  path: '/repos/{owner}/{repo}/actions/jobs/{job_id}/debugger'
  http-method: get
  service-tier: 2
  owner: '@github/actions-runtime'
  published: false
