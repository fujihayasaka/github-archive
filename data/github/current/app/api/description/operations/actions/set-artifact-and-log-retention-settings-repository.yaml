---
summary: Set artifact and log retention settings for a repository
description: |-
  Sets artifact and log retention settings for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
operationId: actions/set-artifact-and-log-retention-settings-repository
tags:
- actions
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/actions/permissions#set-artifact-and-log-retention-settings-for-a-repository'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
responses:
  '204':
    description: Empty response for successful settings update
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/actions-artifact-and-log-retention.yaml'
      examples:
        default:
          summary: Set retention days
          value:
            days: 90
x-github:
  enabledForGitHubApps: true
  category: actions
  subcategory: permissions
x-github-internal:
  path: '/repos/{owner}/{repo}/actions/permissions/artifact-and-log-retention'
  published: true
  http-method: put
  owner: '@github/actions-persistence'
