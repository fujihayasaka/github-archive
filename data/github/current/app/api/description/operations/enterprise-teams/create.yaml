---
summary: 'Create an enterprise team'
description: |-
    To create an enterprise team, the authenticated user must be an owner of the enterprise.
tags:
- enterprise-teams
operationId: enterprise-teams/create
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/enterprise-teams/enterprise-teams#create-an-enterprise-team'
x-github-internal:
  path: /enterprises/{enterprise}/teams
  http-method: post
  published: true
  owner: '@github/identity-tnt'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "The name of the team."
          description:
            nullable: true
            type: string
            description: "A description of the team."
          sync_to_organizations:
            type: string
            description: |
              Retired: this field is no longer supported.
              Whether the enterprise team should be reflected in each organization.
              This value cannot be set.
            enum:
            - all
            - disabled
            default: disabled
          organization_selection_type:
            type: string
            description: |
              Specifies which organizations in the enterprise should have access to this team. Can be one of `disabled`, `selected`, or `all`.
              `disabled`: The team is not assigned to any organizations. This is the default when you create a new team.
              `selected`: The team is assigned to specific organizations. You can then use the [add organization assignments API](${externalDocsUrl}/rest/enterprise-teams/enterprise-team-organizations#add-organization-assignments) endpoint.
              `all`: The team is assigned to all current and future organizations in the enterprise.
            enum:
            - disabled
            - selected
            - all
            default: disabled
            x-unpublished: Behind the enterprise_teams_org_assignment feature flag.
          group_id:
            nullable: true
            type: string
            description: "The ID of the IdP group to assign team membership with. You can get this value from the [REST API endpoints for SCIM](${externalDocsUrl}/rest/scim#list-provisioned-scim-groups-for-an-enterprise)."
        required:
        - name
      examples:
        default:
          value:
            name: Justice League
            description: A great team.
            group_id: "62ab9291-fae2-468e-974b-7e45096d5021"
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/enterprise-team.yaml'
        examples:
          default:
            $ref: '../../components/examples/enterprise-teams-items.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: enterprise-teams
  subcategory: enterprise-teams
