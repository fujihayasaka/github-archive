---
summary: 'Delete attestations in bulk'
description: |-
  Delete artifact attestations in bulk by either subject digests or unique ID.
tags:
- users
operationId: users/delete-attestations-bulk
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/users/attestations#delete-attestations-in-bulk'
x-github-internal:
  path: /users/{username}/attestations/delete-request
  http-method: post
  published: true
  owner: '@github/package-security'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        oneOf:
          - properties:
              subject_digests:
                type: array
                items:
                  type: string
                description: |-
                  List of subject digests associated with the artifact attestations to delete.
                minItems: 1
                maxItems: 1024
            required:
              - subject_digests
          - properties:
              attestation_ids:
                type: array
                items:
                  type: integer
                description: |-
                  List of unique IDs associated with the artifact attestations to delete.
                minItems: 1
                maxItems: 1024
            required:
              - attestation_ids
        description: |-
          The request body must include either `subject_digests` or `attestation_ids`, but not both.
      examples:
        by-subject-digests:
          summary: Delete by subject digests
          value:
            subject_digests:
              - "sha256:abc123"
              - "sha512:def456"
        by-attestation-ids:
          summary: Delete by attestation IDs
          value:
            subject_digests:
              - 111
              - 222
responses:
  '200':
    description: Response
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: users
  subcategory: attestations
