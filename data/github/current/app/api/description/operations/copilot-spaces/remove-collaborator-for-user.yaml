---
summary: 'Remove a collaborator from a Copilot Space for a user'
description: |-
  Removes a collaborator from a specific Copilot Space owned by a user. The authenticated user must be the owner of the space or have admin access to the space.

  OAuth app tokens and personal access tokens (classic) need the `user` scope to use this endpoint.
tags:
- copilot-spaces
operationId: copilot-spaces/remove-collaborator-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/collaborators#remove-a-collaborator-from-a-copilot-space-for-a-user'
x-github-internal:
  path: /users/{username}/copilot-spaces/{space_number}/collaborators/{actor_type}/{actor_identifier}
  http-method: delete
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
- name: space_number
  description: The unique identifier of the Copilot Space.
  in: path
  required: true
  schema:
    type: integer
- name: actor_type
  description: The type of actor (must be `User` for user-owned spaces; `Team` will be rejected).
  in: path
  required: true
  schema:
    type: string
    enum: [User, Team]
- name: actor_identifier
  description: The username of the collaborator. The numeric user ID is also accepted.
  in: path
  required: true
  schema:
    type: string
responses:
  '204':
    description: Response
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  enabledForGitHubApps: false
  category: copilot-spaces
  subcategory: collaborators
