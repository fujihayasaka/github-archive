---
summary: 'Remove a collaborator from a user Copilot Space'
description: |-
  Removes a collaborator from a specific Copilot Space owned by a user. The authenticated user must be the owner of the space or have admin access to the space.

  OAuth app tokens and personal access tokens (classic) need the `user` scope to use this endpoint.
tags:
- spaces
operationId: copilot-spaces/remove-collaborator-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/collaborators#remove-a-collaborator-from-a-user-copilot-space'
x-github-internal:
  path: /users/{username}/copilot-spaces/{space_number}/collaborators/{actor_type}/{actor_identifier}
  http-method: delete
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
- name: space_number
  description: The unique identifier of the copilot space.
  in: path
  required: true
  schema:
    type: integer
- name: actor_type
  description: The type of actor (must be 'users' for user-owned spaces; 'teams' will be rejected).
  in: path
  required: true
  schema:
    type: string
    enum: [users, teams]
- name: actor_identifier
  description: The username or user ID of the collaborator.
  in: path
  required: true
  schema:
