---
summary: 'Remove a collaborator from an organization Copilot Space'
description: |-
  Removes a collaborator from a specific Copilot Space owned by an organization. The authenticated user must have appropriate permissions to manage collaborators.

  OAuth app tokens and personal access tokens (classic) need the `write:org` scope to use this endpoint.

  Fine-grained tokens and GitHub App user access tokens must have been granted access to the organization that owns the space. They must also have been granted access to every repository referenced by resources in the space.
tags:
- copilot-spaces
operationId: copilot-spaces/remove-collaborator-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/collaborators#remove-a-collaborator-from-an-organization-copilot-space'
x-github-internal:
  path: /orgs/{org}/copilot-spaces/{space_number}/collaborators/{actor_type}/{actor_identifier}
  http-method: delete
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: space_number
  description: The unique identifier of the Copilot Space.
  in: path
  required: true
  schema:
    type: integer
- name: actor_type
  description: The type of actor (user or team).
  in: path
  required: true
  schema:
    type: string
    enum: [User, Team]
- name: actor_identifier
  description: The username (for users) or team slug (for teams). The numeric ID of a user or team is also accepted.
  in: path
  required: true
  schema:
    type: string
responses:
