---
summary: 'Create an organization Copilot Space'
description: |-
  Creates a new Copilot Space owned by an organization. The authenticated user must have permissions to create spaces in the organization.

  Organization members with appropriate permissions can create Copilot Spaces to be shared within their organization.

  OAuth app tokens and personal access tokens (classic) need the `read:org` scope to use this endpoint.
tags:
- spaces
operationId: copilot-spaces/create-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/copilot-spaces#create-an-organization-copilot-space'
x-github-internal:
  path: /orgs/{org}/copilot-spaces
  http-method: post
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the Copilot Space.
            example: "Team Planning Space"
          description:
            type: string
            description: A description of the Copilot Space.
            example: "Organization space for team planning and coordination"
          general_instructions:
            type: string
            description: General instructions for the Copilot Space.
            example: "Help the team with planning and coordination tasks"
          icon_type:
            type: string
            description: The icon type for the space.
            example: "DependabotIcon"
          icon_color:
            type: string
            description: The icon color for the space.
            example: "blue"
          visibility:
            type: string
            enum: ["private", "org_public"]
            description: The visibility of the space.
            default: "private"
          base_role:
            type: string
            enum: ["reader", "writer", "admin", "no_access"]
            description: |-
              The base role that determines default permissions for organization members.
              - `no_access`: No default access (default)
              - `reader`: Organization members can read the space
              - `writer`: Organization members can read and edit the space
              - `admin`: Organization members have full admin access to the space
            default: "no_access"
          resources_attributes:
            type: array
            description: Resources to attach to the space.
            items:
              type: object
              properties:
                resource_type:
                  type: string
                  enum: ["repository", "github_file", "free_text", "github_issue", "github_pull_request", "media_content", "uploaded_text_file"]
                  description: The type of resource.
                metadata:
                  type: object
                  description: Metadata specific to the resource type.
                  properties:
                    repository_id:
                      type: integer
                      description: Repository ID for repository or file resources.
                    file_path:
                      type: string
                      description: File path for file resources.
                    text:
                      type: string
                      description: Text content for free text resources.
                    name:
                      type: string
                      description: Name for the resource.
                    number:
                      type: integer
                      description: Issue or PR number.
        required:
        - name
      examples:
        default:
          value:
            name: "Team Planning Space"
            description: "Organization space for team planning and coordination"
            general_instructions: "Help the team with planning and coordination tasks"
            icon_type: "DependabotIcon"
            icon_color: "blue"
            visibility: "org_public"
            resources_attributes:
              - resource_type: "github_file"
                metadata:
                  repository_id: 123456
                  file_path: "docs/planning.md"
              - resource_type: "free_text"
                metadata:
                  name: "Team Guidelines"
                  text: "Our team follows agile methodology and holds daily standups"
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space.yaml'
        examples:
          default:
            $ref: '../../components/examples/copilot-space-organization.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  enabledForGitHubApps: true
  category: copilot-spaces
  subcategory: copilot-spaces
