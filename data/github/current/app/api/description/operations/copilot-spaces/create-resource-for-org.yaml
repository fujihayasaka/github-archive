---
summary: 'Create a resource for an organization Copilot Space'
description: |-
  Creates a new resource in a specific Copilot Space owned by an organization.
  The authenticated user must have write permissions on the space.

  The following resource types are supported: `repository`, `github_file`, `free_text`, `github_issue`, `github_pull_request`.
  The `uploaded_text_file` and `media_content` types are not supported via this endpoint.

  For `github_file` resources, if a resource with the same repository, file path, and SHA already exists, the existing resource is returned with a `200` status.

  OAuth app tokens and personal access tokens (classic) need the `write:org` scope to use this endpoint.

  Fine-grained tokens and GitHub App user access tokens must have been granted access to the organization that owns the space. They must also have been granted access to every repository referenced by resources in the space, including the resource being created.
tags:
- copilot-spaces
operationId: copilot-spaces/create-resource-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/resources#create-a-resource-for-an-organization-copilot-space'
x-github-internal:
  path: /orgs/{org}/copilot-spaces/{space_number}/resources
  http-method: post
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: space_number
  description: The unique identifier of the Copilot Space.
  in: path
  required: true
  schema:
    type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - resource_type
        - metadata
        properties:
          resource_type:
            type: string
            enum:
            - repository
            - github_file
            - free_text
            - github_issue
            - github_pull_request
            description: The type of resource to create.
          metadata:
            type: object
            description: Resource-specific metadata.
            additionalProperties: true
      examples:
        free_text:
          value:
            resource_type: "free_text"
            metadata:
              name: "notes.txt"
              text: "Some helpful notes"
        repository:
          value:
            resource_type: "repository"
            metadata:
              repository_id: 42
        github_file:
          value:
            resource_type: "github_file"
            metadata:
              repository_id: 42
              file_path: "README.md"
              sha: "abc123"
responses:
  '201':
    description: Resource created
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space-resource.yaml'
        examples:
          default:
            value:
              id: 1
              resource_type: "free_text"
              copilot_chat_attachment_id: null
              metadata:
                name: "notes.txt"
                text: "Some helpful notes"
              created_at: "2025-01-01T00:00:00Z"
              updated_at: "2025-01-01T00:00:00Z"
  '200':
    description: Duplicate github_file resource already exists
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space-resource.yaml'
        examples:
          default:
            value:
              id: 1
              resource_type: "github_file"
              copilot_chat_attachment_id: null
              metadata:
                repository_id: 42
                file_path: "README.md"
                sha: "abc123"
              created_at: "2025-01-01T00:00:00Z"
              updated_at: "2025-01-01T00:00:00Z"
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  enabledForGitHubApps: true
  category: copilot-spaces
  subcategory: resources
