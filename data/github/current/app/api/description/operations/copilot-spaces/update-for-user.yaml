---
summary: 'Update a user Copilot Space'
description: |-
  Updates an existing Copilot Space owned by a user. Only the authenticated user can update spaces for their own account.

  Users can update their personal Copilot Spaces.

  OAuth app tokens and personal access tokens (classic) need the `read:user` scope to use this endpoint.
tags:
- spaces
operationId: copilot-spaces/update-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/copilot-spaces#update-a-user-copilot-space'
x-github-internal:
  path: /users/{username}/copilot-spaces/{space_number}
  http-method: put
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
- name: space_number
  description: The unique identifier of the copilot space.
  in: path
  required: true
  schema:
    type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the Copilot Space.
            example: "Updated Development Space"
          description:
            type: string
            description: A description of the Copilot Space.
            example: "Updated personal space for development assistance"
          general_instructions:
            type: string
            description: General instructions for the Copilot Space.
            example: "Updated instructions to help me with React development patterns and best practices"
          icon_type:
            type: string
            description: The icon type for the space.
            example: "DependabotIcon"
          icon_color:
            type: string
            description: The icon color for the space.
            example: "red"
          visibility:
            type: string
            enum: ["private", "public"]
            description: The visibility of the space.
            default: "private"
          base_role:
            type: string
            enum: ["reader", "no_access"]
            description: |-
              The base role that determines default permissions for the space. Changing this field requires admin permissions.
              - `no_access`: No default access (default)
              - `reader`: Makes the space publicly readable
              Note: User spaces do not support writer or admin base roles.
          resources_attributes:
            type: array
            description: Resources to attach to the space.
            items:
              type: object
              properties:
                resource_type:
                  type: string
                  enum: ["repository", "github_file", "free_text", "github_issue", "github_pull_request", "media_content", "uploaded_text_file"]
                  description: The type of resource.
                metadata:
                  type: object
                  description: Metadata specific to the resource type.
                  properties:
                    repository_id:
                      type: integer
                      description: Repository ID for repository or file resources.
                    file_path:
                      type: string
                      description: File path for file resources.
                    text:
                      type: string
                      description: Text content for free text resources.
                    name:
                      type: string
                      description: Name for the resource.
                    number:
                      type: integer
                      description: Issue or PR number.
      examples:
        default:
          value:
            name: "Updated Development Space"
            description: "Updated personal space for development assistance"
            general_instructions: "Updated instructions to help me with React development patterns and best practices"
            icon_type: "DependabotIcon"
            icon_color: "green"
            visibility: "private"
            resources_attributes:
              - resource_type: "github_file"
                metadata:
                  repository_id: 789012
                  file_path: "src/components/UpdatedApp.js"
              - id: 123
                _destroy: true
              - id: 456
                resource_type: "free_text"
                metadata:
                  name: "Updated Development Notes"
                  text: "Updated focus on clean code principles and modern React patterns"
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space.yaml'
        examples:
          default:
            $ref: '../../components/examples/copilot-space-user.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  enabledForGitHubApps: true
  category: copilot-spaces
  subcategory: copilot-spaces
