---
summary: 'Get a Copilot Space for a user'
description: |-
  Gets details about a specific Copilot Space owned by a user. The authenticated user must have read access to the Space.

  Private user spaces require the authenticated user to be the owner of the space.
  Public user spaces are accessible to any authenticated user.

  OAuth app tokens and personal access tokens (classic) need the `repo` scope to use this endpoint.
tags:
- copilot-spaces
operationId: copilot-spaces/get-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/copilot-spaces#get-a-copilot-space-for-a-user'
x-github-internal:
  path: /users/{username}/copilot-spaces/{space_number}
  http-method: get
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
