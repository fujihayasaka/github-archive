---
summary: 'Update a collaborator for an organization Copilot Space'
description: |-
  Updates the role of a collaborator for a specific Copilot Space owned by an organization. The authenticated user must have appropriate permissions to manage collaborators.

  OAuth app tokens and personal access tokens (classic) need the `write:org` scope to use this endpoint.
tags:
- spaces
operationId: copilot-spaces/update-collaborator-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/collaborators#update-a-collaborator-for-an-organization-copilot-space'
x-github-internal:
  path: /orgs/{org}/copilot-spaces/{space_number}/collaborators/{actor_type}/{actor_identifier}
  http-method: put
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: space_number
  description: The unique identifier of the copilot space.
  in: path
  required: true
  schema:
    type: integer
- name: actor_type
  description: The type of actor (user or team).
  in: path
  required: true
  schema:
    type: string
    enum: [users, teams]
- name: actor_identifier
  description: The username/user ID (for users) or team slug/team ID (for teams).
  in: path
  required: true
  schema:
    oneOf:
    - type: string
    - type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - role_name
        properties:
          role_name:
            type: string
            enum: [reader, writer, admin]
            description: The new role to grant to the collaborator
      examples:
        default:
          value:
            role_name: "admin"
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space-collaborator.yaml'
