---
summary: 'Create a Copilot Space for a user'
description: |-
  Creates a new Copilot Space owned by a user. Only the authenticated user can create spaces for their own account.

  Users can create personal Copilot Spaces for their individual use.

  OAuth app tokens and personal access tokens (classic) need the `read:user` scope to use this endpoint.
tags:
- copilot-spaces
operationId: copilot-spaces/create-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/copilot-spaces#create-a-copilot-space-for-a-user'
x-github-internal:
  path: /users/{username}/copilot-spaces
  http-method: post
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The name of the Copilot Space.
            example: "My Development Space"
          description:
            type: string
            description: A description of the Copilot Space.
            example: "Personal space for development assistance"
          general_instructions:
            type: string
            maxLength: 4000
            description: General instructions for the Copilot Space.
            example: "Help me with React development patterns and best practices"
          base_role:
            type: string
            enum: ["reader", "no_access"]
            description: |-
              The base role that determines default permissions for the space.
              - `no_access`: No default access (default)
              - `reader`: Makes the space publicly readable
              Note: User spaces do not support writer or admin base roles.
            default: "no_access"
          resources_attributes:
            type: array
            description: Resources to attach to the space.
            items:
              type: object
              properties:
                resource_type:
                  type: string
                  enum: ["repository", "github_file", "free_text", "github_issue", "github_pull_request", "media_content", "uploaded_text_file"]
                  description: The type of resource.
                metadata:
                  type: object
                  description: Metadata specific to the resource type.
                  properties:
                    repository_id:
                      type: integer
                      description: Repository ID for repository or file resources.
                    file_path:
                      type: string
                      description: File path for file resources.
                    text:
                      type: string
                      description: Text content for free text resources.
                    name:
                      type: string
                      description: Name for the resource.
                    number:
                      type: integer
                      description: Issue or PR number.
        required:
        - name
      examples:
        default:
          value:
            name: "My Development Space"
            description: "Personal space for development assistance"
            general_instructions: "Help me with React development patterns and best practices"
            resources_attributes:
              - resource_type: "github_file"
                metadata:
                  repository_id: 789012
                  file_path: "src/components/App.js"
              - resource_type: "free_text"
                metadata:
                  name: "Development Notes"
                  text: "Focus on clean code principles and modern React patterns"
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space.yaml'
        examples:
          default:
            $ref: '../../components/examples/copilot-space-user.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  enabledForGitHubApps: false
  category: copilot-spaces
  subcategory: copilot-spaces
