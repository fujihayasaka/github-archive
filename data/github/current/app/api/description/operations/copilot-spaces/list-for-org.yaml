---
summary: 'List organization Copilot Spaces'
description: |-
  Lists Copilot Spaces owned by an organization. The authenticated user must have read access to the organization's Copilot Spaces.

  Only Spaces that are readable by the authenticated user are returned. This includes public Spaces and internal Spaces if the user is a member of the organization.

  OAuth app tokens and personal access tokens (classic) need the `read:org` scope to use this endpoint.

  Fine-grained tokens and GitHub App user access tokens must have been granted access to the organization that owns the space. They must also have been granted access to every repository referenced by resources in a space; spaces with inaccessible resources are omitted from the response.
tags:
- copilot-spaces
operationId: copilot-spaces/list-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/copilot-spaces#list-organization-copilot-spaces'
x-github-internal:
  path: /orgs/{org}/copilot-spaces
  http-method: get
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: per_page
  description: The number of results per page (max 100).
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 30
- name: before
  description: A cursor, as given in the [Link header](${externalDocsUrl}/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results before this cursor.
  in: query
  schema:
    type: string
- name: after
  description: A cursor, as given in the [Link header](${externalDocsUrl}/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results after this cursor.
  in: query
  schema:
    type: string
responses:
