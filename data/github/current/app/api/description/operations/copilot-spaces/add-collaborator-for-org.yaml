---
summary: 'Add a collaborator to an organization Copilot Space'
description: |-
  Adds a collaborator (user or team) to a specific Copilot Space owned by an organization. The authenticated user must have appropriate permissions to manage collaborators.

  **Note:** When adding users as collaborators, they must already be members of the organization.
  When adding teams as collaborators, they must be defined in the organization.

  OAuth app tokens and personal access tokens (classic) need the `write:org` scope to use this endpoint.
tags:
- spaces
operationId: copilot-spaces/add-collaborator-for-org
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/collaborators#add-a-collaborator-to-an-organization-copilot-space'
x-github-internal:
  path: /orgs/{org}/copilot-spaces/{space_number}/collaborators
  http-method: post
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/org.yaml'
- name: space_number
  description: The unique identifier of the copilot space.
  in: path
  required: true
  schema:
    type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
        - actor_type
        - actor_identifier
        - role_name
        properties:
          actor_type:
            type: string
            enum: [users, teams]
            description: The type of actor (user or team)
          actor_identifier:
            oneOf:
            - type: string
            - type: integer
            description: The username/user ID (for users) or team slug/team ID (for teams)
          role_name:
            type: string
            enum: [reader, writer, admin]
            description: The role to grant to the collaborator
      examples:
        user:
          value:
            actor_type: "users"
            actor_identifier: "octocat"
            role_name: "writer"
        team:
          value:
            actor_type: "teams"
            actor_identifier: "developers"
            role_name: "reader"
responses:
