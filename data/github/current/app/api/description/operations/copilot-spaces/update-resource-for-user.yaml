---
summary: 'Set a resource for a Copilot Space for a user'
description: |-
  Updates the metadata of a resource in a specific Copilot Space owned by a user.
  The authenticated user must have write permissions on the space.

  OAuth app tokens and personal access tokens (classic) need the `write:user` scope to use this endpoint.
tags:
- copilot-spaces
operationId: copilot-spaces/update-resource-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/resources#set-a-resource-for-a-copilot-space-for-a-user'
x-github-internal:
  path: /users/{username}/copilot-spaces/{space_number}/resources/{space_resource_id}
  http-method: put
  published: true
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
- name: space_number
  description: The unique identifier of the Copilot Space.
  in: path
  required: true
  schema:
    type: integer
- name: space_resource_id
  description: The unique identifier of the resource.
  in: path
  required: true
  schema:
    type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          metadata:
            type: object
            description: Updated resource-specific metadata.
            additionalProperties: true
      examples:
        default:
          value:
            metadata:
              name: "updated-notes.txt"
              text: "Updated content"
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/copilot-space-resource.yaml'
        examples:
          default:
            value:
              id: 1
              resource_type: "free_text"
              copilot_chat_attachment_id: null
              metadata:
                name: "updated-notes.txt"
                text: "Updated content"
              created_at: "2025-01-01T00:00:00Z"
              updated_at: "2025-01-01T12:00:00Z"
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  enabledForGitHubApps: false
  category: copilot-spaces
  subcategory: resources
