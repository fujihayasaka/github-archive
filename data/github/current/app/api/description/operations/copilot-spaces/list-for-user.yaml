---
summary: 'List user Copilot Spaces'
description: |-
  Lists Copilot Spaces owned by a user. The authenticated user must have read access to the user's Copilot Spaces.

  Only Spaces that are readable by the authenticated user are returned. This includes the user's own spaces, and public user spaces when accessing another user's spaces.

  OAuth app tokens and personal access tokens (classic) need the `read:user` scope to use this endpoint.
tags:
- spaces
operationId: copilot-spaces/list-for-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/copilot-spaces/copilot-spaces#list-user-copilot-spaces'
x-github-internal:
  path: /users/{username}/copilot-spaces
  http-method: get
  published: false
  owner: '@github/copilot-for-knowledge-bases-reviewers'
x-github-releases:
- api.github.com
- ghec
parameters:
- $ref: '../../components/parameters/username.yaml'
- name: per_page
  description: The number of results per page (max 100).
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 30
- name: before
  description: A cursor, as given in the [Link header](${externalDocsUrl}/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results before this cursor.
  in: query
  schema:
    type: string
- name: after
  description: A cursor, as given in the [Link header](${externalDocsUrl}/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results after this cursor.
  in: query
  schema:
    type: string
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            spaces:
              type: array
              items:
                $ref: '../../components/schemas/copilot-space.yaml'
            cursors:
              type: object
              properties:
                before:
                  type: string
                  nullable: true
                  description: Cursor pointing to the start of the page of results
                after:
                  type: string
                  nullable: true
                  description: Cursor pointing to the end of the page of results
                first:
                  type: string
                  nullable: true
                  description: Cursor pointing to the first item in the entire result set
                last:
                  type: string
                  nullable: true
                  description: Cursor pointing to the last item in the entire result set
        examples:
          default:
            $ref: '../../components/examples/copilot-spaces-user-list.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github:
  enabledForGitHubApps: false
  category: copilot-spaces
  subcategory: copilot-spaces
