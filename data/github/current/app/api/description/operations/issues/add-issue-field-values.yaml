---
summary: Add issue field values to an issue
description: |-
  Add custom field values to an issue. You can set values for organization-level issue fields that have been defined for the repository's organization.
  Adding an empty array will clear all existing field values for the issue.

  This endpoint supports the following field data types:
  - **`text`**: String values for text fields
  - **`single_select`**: Option names for single-select fields (must match an existing option name)
  - **`number`**: Numeric values for number fields
  - **`date`**: ISO 8601 date strings for date fields

  Only users with push access to the repository can add issue field values. If you don't have the proper permissions, you'll receive a `403 Forbidden` response.

  This endpoint triggers [notifications](${externalDocsUrl}/github/managing-subscriptions-and-notifications-on-github/about-notifications). Creating content too quickly using this endpoint may result in secondary rate limiting. For more information, see "[Rate limits for the API](${externalDocsUrl}/rest/using-the-rest-api/rate-limits-for-the-rest-api#about-secondary-rate-limits)"
  and "[Best practices for using the REST API](${externalDocsUrl}/rest/guides/best-practices-for-using-the-rest-api)."

tags:
- issues
operationId: issues/add-issue-field-values
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issue-field-values#add-issue-field-values-to-an-issue'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
- $ref: '../../components/parameters/issue-number.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          issue_field_values:
            type: array
            description: An array of issue field values to add to this issue. Each field value must include the field ID and the value to set.
            items:
              type: object
              properties:
                field_id:
                  type: integer
                  description: The ID of the issue field to set
                  example: 123
                value:
                  oneOf:
                    - type: string
                      description: The value to set for text, single_select, or date fields
                    - type: number
                      description: The value to set for number fields
                  description: |-
                    The value to set for the field. The type depends on the field's data type:
                    - For text fields: provide a string value
                    - For single_select fields: provide the option name as a string (must match an existing option)
                    - For number fields: provide a numeric value
                    - For date fields: provide an ISO 8601 date string
                  example: "Critical"
              required:
                - field_id
                - value
              additionalProperties: false
            maxItems: 25
      examples:
        default:
          summary: Add multiple field values
          value:
            issue_field_values:
              - field_id: 123
                value: "Critical"
              - field_id: 456
                value: 5
              - field_id: 789
                value: "2024-12-31"
        single-field:
          summary: Add a single field value
          value:
            issue_field_values:
              - field_id: 123
                value: "High Priority"
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          description: The current issue field values for this issue after adding the new values
          items:
            $ref: '../../components/schemas/issue-field-value.yaml'
        examples:
          default:
            $ref: '../../components/examples/issue-field-value-items.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
  triggersNotification: true
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issue-field-values
x-github-internal:
  path: '/repositories/{repository_id}/issues/{issue_number}/issue-field-values'
  http-method: post
  service-tier: 1
  owner: '@github/issues'
  published: false
