---
summary: 'Search semantically similar issues'
description: 'Search for issues that are semantically similar to a given issue.'
tags:
  - issues
operationId: issues/search-semantically-similar
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
- $ref: '../../components/parameters/issue-number.yaml'
- name: page
  description: 'Page number of the results to fetch. For more information, see "[Using pagination in the REST API](${externalDocsUrl}/rest/using-the-rest-api/using-pagination-in-the-rest-api)."'
  in: query
  schema:
    type: integer
    default: 1
- name: per_page
  description: 'The number of results per page. For more information, see "[Using pagination in the REST API](${externalDocsUrl}/rest/using-the-rest-api/using-pagination-in-the-rest-api)."'
  in: query
  schema:
    type: integer
    default: 3
- name: threshold
  description: 'The relevance score threshold for an issue to be considered similar.'
  in: query
  schema:
    type: string
    pattern: '^[0-9]+(\.[0-9]+)?$'
    default: "0.8"
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issues#search-semantically-similar-issues'
x-github-releases:
  # `published: false` excludes it from documentation and our open source OpenAPI
  - api.github.com
  - ghec
x-github-internal:
  path: /repos/{owner}/{repo}/issues/{issue_number}/semantically_similar
  http-method: get
  published: false
  owner: '@github/issues'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/issue.yaml'
        examples:
          default:
            $ref: '../../components/examples/issue-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '410':
    $ref: '../../components/responses/gone.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issues
