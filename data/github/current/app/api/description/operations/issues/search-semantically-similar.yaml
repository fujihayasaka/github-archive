---
summary: 'Search semantically similar issues and pull requests'
description: 'Search for issues and/or pull requests that are semantically similar to a given issue. Results are returned as issue resources; pull request matches are PR-backed issues that include a `pull_request` key. Use the `target_type` parameter to control whether to search for issues, pull requests, or both.'
tags:
  - issues
operationId: issues/search-semantically-similar
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
- $ref: '../../components/parameters/issue-number.yaml'
- name: page
  description: 'Page number of the results to fetch. For more information, see "[Using pagination in the REST API](${externalDocsUrl}/rest/using-the-rest-api/using-pagination-in-the-rest-api)."'
  in: query
  schema:
    type: integer
    default: 1
- name: per_page
  description: 'The number of results per page. For more information, see "[Using pagination in the REST API](${externalDocsUrl}/rest/using-the-rest-api/using-pagination-in-the-rest-api)."'
  in: query
  schema:
    type: integer
    default: 3
- name: threshold
  description: 'The relevance score threshold for an issue to be considered similar.'
  in: query
  schema:
    type: string
    pattern: '^[0-9]+(\.[0-9]+)?$'
    default: "0.8"
- name: target_types
  description: 'Filter the type of results to return. `issue` returns only issues, `pull-request` returns only pull requests (as PR-backed issues with a `pull_request` key), and `issue,pull-request` (or `pull-request,issue`) returns issues and pull requests. Default: `issue`.'
  in: query
  schema:
    type: string
    enum:
      - issue
      - pull-request
      - issue,pull-request
      - pull-request,issue
    default: "issue"
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issues#search-semantically-similar-issues-and-pull-requests'
x-github-releases:
  # `published: false` excludes it from documentation and our open source OpenAPI
  - api.github.com
  - ghec
x-github-internal:
  path: /repos/{owner}/{repo}/issues/{issue_number}/semantically_similar
  http-method: get
  published: false
  owner: '@github/issues'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/issue.yaml'
        examples:
          default:
            $ref: '../../components/examples/issue-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '410':
    $ref: '../../components/responses/gone.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issues
