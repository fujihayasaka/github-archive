  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issue-field-values
x-github-internal:
  path: '/repositories/{repository_id}/issues/{issue_number}/issue-field-values/{issue_field_id}'
  http-method: delete
  service-tier: 1
  owner: '@github/issues'
  published: false
