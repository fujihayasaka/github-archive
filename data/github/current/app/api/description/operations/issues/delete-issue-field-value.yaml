---
summary: Delete an issue field value from an issue
description: |-
  Remove a specific custom field value from an issue.

  Only users with push access to the repository can delete issue field values. If you don't have the proper permissions, you'll receive a `403 Forbidden` response.

  If the specified field does not have a value set on the issue, this operation will return a `404` error.

  This endpoint triggers [notifications](${externalDocsUrl}/github/managing-subscriptions-and-notifications-on-github/about-notifications). Creating content too quickly using this endpoint may result in secondary rate limiting. For more information, see "[Rate limits for the API](${externalDocsUrl}/rest/using-the-rest-api/rate-limits-for-the-rest-api#about-secondary-rate-limits)"
  and "[Best practices for using the REST API](${externalDocsUrl}/rest/guides/best-practices-for-using-the-rest-api)."

tags:
- issues
operationId: issues/delete-issue-field-value
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issue-field-values#delete-an-issue-field-value-from-an-issue'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
- $ref: '../../components/parameters/issue-number.yaml'
- $ref: '../../components/parameters/issue-field-id.yaml'
responses:
  '204':
    description: Issue field value deleted successfully
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
x-github-releases:
- ghec
- api.github.com
x-github:
