---
summary: Triage an issue
description: |-
  Creates triage suggestions on an issue, namely a triage rationale comment and optional labels, type, and single-select fields updates.

  The triage agent feature must be enabled for the repository. This endpoint only supports issues, not pull requests.

  Only users and integrations with the `triage_issue` permission on the repository can use this endpoint.
tags:
- issues
operationId: issues/triage
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issues#triage-an-issue'
parameters:
- $ref: '../../components/parameters/owner.yaml'
- $ref: '../../components/parameters/repo.yaml'
- $ref: '../../components/parameters/issue-number.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          triage_rationale:
            type: string
            description: The rationale for the triage decision. This will be added as a comment on the issue.
          labels:
            type: array
            description: An optional array of label names to apply to the issue.
            items:
              type: string
          type:
            type: string
            description: An optional issue type name to set on the issue.
          fields:
            type: array
            description: An optional array of field values to set on the issue.
            items:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the issue single-select field.
                value:
                  oneOf:
                    - type: string
                    - type: integer
                    - type: number
                  description: The value to set for the field.
              required:
              - name
              - value
        required:
        - triage_rationale
      examples:
        default:
          value:
            triage_rationale: This issue is a bug report related to authentication.
            labels:
            - bug
            - authentication
            type: Bug
            fields:
            - name: Priority
              value: High
responses:
  '201':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            comment:
              type: object
              nullable: true
              description: The triage rationale comment that was created. Null when add-comment is disabled in the allowlist.
              properties:
                id:
                  type: integer
                node_id:
                  type: string
                html_url:
                  type: string
                body:
                  type: string
                user:
                  type: object
                  properties:
                    login:
                      type: string
                    id:
                      type: integer
                    type:
                      type: string
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
            labels:
              type: array
              description: The current labels on the issue.
              items:
                type: string
            type:
              type: string
              nullable: true
              description: The current issue type name, or null if not set.
            fields:
              type: array
              description: The current field values on the issue.
              items:
                type: object
                properties:
                  name:
                    type: string
                  value:
                    oneOf:
                      - type: string
                      - type: integer
                      - type: number
                    nullable: true
        examples:
          default:
            value:
              comment:
                id: 1
                node_id: MDEyOklzc3VlQ29tbWVudDE=
                html_url: https://github.com/octocat/Hello-World/issues/1347#issuecomment-1
                body: This issue is a bug report related to authentication.
                user:
                  login: copilot-swe-agent[bot]
                  id: 1
                  type: Bot
                created_at: '2011-04-14T16:00:49Z'
                updated_at: '2011-04-14T16:00:49Z'
              labels:
              - bug
              - authentication
              type: Bug
              fields:
              - name: Priority
                value: High
  '400':
    description: Bad Request - the issue is a pull request
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
x-github-releases:
  - api.github.com
  - ghec
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issues
x-github-internal:
  path: '/repos/{owner}/{repo}/issues/{issue_number}/triage'
  http-method: post
  published: false
  owner: '@github/issues'
