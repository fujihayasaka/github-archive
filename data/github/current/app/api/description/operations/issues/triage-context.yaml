---
summary: Get triage context for a repository
description: |-
  Returns the triage context for a repository, including available labels, issue types, and issue fields.

  This endpoint provides structured metadata that agents can use to understand the repository's triage taxonomy
  before triaging issues. The `issues_triage_agent_context` feature flag must be enabled for the repository.

  Only authenticated users with read access to the repository can use this endpoint.
tags:
- issues
operationId: issues/triage-context
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issues#get-triage-context-for-a-repository'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          properties:
            repo_nwo:
              type: string
              description: The repository name with owner (e.g., "owner/repo").
            labels:
              type: array
              description: Labels available in the repository.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: The database ID of the label.
                  node_id:
                    type: string
                    description: The GraphQL node ID of the label.
                  name:
                    type: string
                    description: The label name.
                  description:
                    type: string
                    description: The label description.
            types:
              type: array
              description: Issue types available at the organization level.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: The database ID of the issue type.
                  node_id:
                    type: string
                    description: The GraphQL node ID of the issue type.
                  name:
                    type: string
                    description: The issue type name.
                  description:
                    type: string
                    description: The issue type description.
            issue_fields:
              type: array
              description: Single-select issue fields available at the organization level.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: The database ID of the field.
                  node_id:
                    type: string
                    description: The GraphQL node ID of the field.
                  name:
                    type: string
                    description: The field name.
                  data_type:
                    type: string
                    description: The field data type.
                  description:
                    type: string
                    description: The field description.
                  options:
                    type: array
                    description: Available options for single-select fields.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: The database ID of the option.
                        node_id:
                          type: string
                          description: The GraphQL node ID of the option.
                        name:
                          type: string
                          description: The option name.
                        description:
                          type: string
                          description: The option description.
        examples:
          default:
            value:
              repo_nwo: "octocat/Hello-World"
              labels:
              - id: 1
                node_id: "MDU6TGFiZWwx"
                name: "bug"
                description: "Something isn't working"
              - id: 2
                node_id: "MDU6TGFiZWwy"
                name: "enhancement"
                description: "New feature or request"
              types:
              - id: 1
                node_id: "IT_kgDOAA"
                name: "Bug"
                description: "A bug report"
              - id: 2
                node_id: "IT_kgDOAB"
                name: "Feature"
                description: "A feature request"
              issue_fields:
              - id: 1
                node_id: "IFSS_kgDOAA"
                name: "Priority"
                data_type: "single_select"
                description: "Issue priority level"
                options:
                - id: 1
                  node_id: "IFSSO_kgDOAA"
                  name: "High"
                  description: "Urgent issues"
                - id: 2
                  node_id: "IFSSO_kgDOAB"
                  name: "Low"
                  description: ""
  '404':
    $ref: '../../components/responses/not_found.yaml'
x-github-releases:
  - api.github.com
  - ghec
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issues
x-github-internal:
  path: '/repositories/{repository_id}/triage_context'
  http-method: get
  published: false
  owner: '@github/issues'
