---
summary: List potential duplicate issues
description: |-
  **Note:** This endpoint is for internal use only and is subject to change without notice.

  Searches for potential duplicate issues in a repository based on semantic similarity of title and body.
  Returns a list of existing issues that may be duplicates of the provided issue content, ranked by similarity score.

  Only users and integrations with read access to issues in the repository can use this endpoint.
tags:
- issues
operationId: issues/list-duplicates
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/issues/issues#list-potential-duplicate-issues'
parameters:
- $ref: '../../components/parameters/repository-id.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          title:
            type: string
            description: The title of the issue to check for duplicates.
          body:
            type: string
            description: The body content of the issue to check for duplicates.
            nullable: true
          confidence_threshold:
            type: number
            description: 'Minimum confidence threshold for duplicate detection (0.0-1.0). Higher values require stronger similarity. Defaults to 0.92 (high precision) when not provided.'
            default: 0.92
            minimum: 0.0
            maximum: 1.0
            nullable: true
          per_page:
            type: integer
            description: 'The number of results per page (max 100).'
            default: 30
            minimum: 1
            maximum: 100
          page:
            type: integer
            description: 'The page number of the results to fetch.'
            default: 1
            minimum: 1
        required:
        - title
      examples:
        default:
          value:
            title: "API performance issue"
            body: "The API is really slow when making requests"
            per_page: 30
            page: 1
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          type: object
          required:
          - duplicates
          - total_count
          - repository
          properties:
            duplicates:
              type: array
              description: List of potential duplicate issues
              items:
                $ref: '../../components/schemas/semantic-duplicate-detection-result-item.yaml'
            total_count:
              type: integer
              description: Total number of potential duplicates found
            repository:
              type: string
              description: The repository name with owner (e.g., "owner/repo")
        examples:
          default:
            $ref: '../../components/examples/semantic-duplicate-detection-result.yaml'
  '401':
    $ref: '../../components/responses/requires_authentication.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
x-github-releases:
- api.github.com
x-github-internal:
  path: '/repositories/{repository_id}/duplicate/issues'
  http-method: post
  service-tier: 1
  owner: '@github/issues'
  published: false
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: issues
  subcategory: issues
