---
summary: 'Get secret scanning scan history for a repository'
description: |-
  Lists the latest incremental and backfill scans by type for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` or `security_events` scope to use this endpoint. If this endpoint is only used with public repositories, the token can use the `public_repo` scope instead.
tags:
  - secret-scanning
operationId: secret-scanning/get-scan-history
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/secret-scanning#get-secret-scanning-scan-history-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/secret-scanning/scan-history
  http-method: get
  published: true
  owner: '@github/secret-scanning'
  service-tier: 2
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.16'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
responses:
  '404':
    description: Repository does not have GitHub Advanced Security or secret scanning enabled
  '503':
    $ref: '../../components/responses/service_unavailable.yaml'
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/secret-scanning-scan-history.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-scan-history.yaml'
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: secret-scanning
