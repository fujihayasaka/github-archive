---
summary: Dismiss a response on an alert dismissal request for secret scanning
description: |-
  Dismiss a response given to a request to dismiss a secret scanning alert in a repository.
  Delegated alert dismissal must be enabled on the repository and the user must be an org admin, security manager,
  or have the "Review and manage secret scanning alert dismissal requests" permission to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/dismiss-dismissal-response
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/alert-dismissal-requests#dismiss-a-response-on-an-alert-dismissal-request-for-secret-scanning'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-responses/secret-scanning/{dismissal_response_id}
  http-method: delete
  published: false
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.18'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: dismissal_response_id
   in: path
   required: true
   description: ID of the dismissal response.
   schema:
     type: integer
responses:
  '204':
    description: Review was successfully dismissed.
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
