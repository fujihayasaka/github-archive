---
summary: Get a bypass request for secret scanning
description: |-
  Gets a specific request to bypass secret scanning push protection in a repository.

  Delegated bypass must be enabled on the repository and the user must be a bypass reviewer to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/get-bypass-request
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/delegated-bypass#get-a-bypass-request-for-secret-scanning'
x-github-internal:
  path: /repos/{owner}/{repo}/bypass-requests/secret-scanning/{bypass_request_number}
  http-method: get
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: delegated-bypass
x-github-releases:
  - ghec
  - ghes: '>= 3.17'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: bypass_request_number
   in: path
   required: true
   description: The number that identifies the bypass request in a repository.
   schema:
     type: integer
responses:
  '200':
    description: A single bypass request.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/secret-scanning-bypass-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-bypass-request-item.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
