---
summary: List public monitoring alerts for an enterprise
description: |-
  Lists public monitoring alerts for an enterprise, from newest to oldest.

  GitHub monitors secrets leaked across GitHub in real time. These findings may be associated with your enterprise.

  The authenticated user must be an enterprise owner or enterprise security manager.

  OAuth app tokens and personal access tokens (classic) must have the `security_events` scope to use this endpoint.
