---
summary: List repository custom patterns
description: |-
  Lists secret scanning custom patterns for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` or `security_events` scope to use this endpoint. If this endpoint is only used with public repositories, the token can use the `public_repo` scope instead.
tags:
  - secret-scanning
operationId: secret-scanning/list-repo-custom-patterns
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/custom-patterns#list-repository-custom-patterns'
x-github-internal:
  path: /repos/{owner}/{repo}/secret-scanning/custom-patterns
  http-method: get
  published: false
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: custom-patterns
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.23'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
  - $ref: '../../components/parameters/secret-scanning-custom-pattern-state.yaml'
  - $ref: '../../components/parameters/secret-scanning-custom-pattern-push-protection.yaml'
  - $ref: '../../components/parameters/secret-scanning-custom-pattern-sort.yaml'
  - $ref: '../../components/parameters/direction.yaml'
  - $ref: '../../components/parameters/page.yaml'
