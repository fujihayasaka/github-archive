---
summary: Review an alert dismissal request for secret scanning
description: |-
  Approve or deny a request to dismiss a secret scanning alert in a repository.

  Delegated alert dismissal must be enabled on the repository and the user must be an org admin, security manager,
  or have the "Review and manage secret scanning alert dismissal requests" permission to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/review-dismissal-request
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/alert-dismissal-requests#review-an-alert-dismissal-request-for-secret-scanning'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/secret-scanning/{alert_number}
  http-method: patch
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.18'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: alert_number
   in: path
   required: true
   description: The number that identifies the secret scanning alert in a repository.
   schema:
     type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: string
            description: The review action to perform on the dismissal request.
            enum:
              - approve
              - deny
          message:
            type: string
            description: A message to include with the review. Has a maximum character length of 2048.
        required:
          - status
          - message
      examples:
        default:
          value:
            status: "deny"
            message: This secret has not been revoked.
responses:
  '200':
    description: The review of the dismissal request.
    content:
      application/json:
        schema:
          type: object
          properties:
            dismissal_review_id:
              type: integer
              description: ID of the dismissal review.
        examples:
          default:
            value:
              dismissal_review_id: 1
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
