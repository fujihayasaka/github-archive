---
summary: List bypass requests for secret scanning for a repository
description: |-
  Lists requests to bypass secret scanning push protection in a repository.

  Delegated bypass must be enabled on the repository and the user must be a bypass reviewer to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/list-repo-bypass-requests
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/delegated-bypass#list-bypass-requests-for-secret-scanning-for-a-repository'
x-github-internal:
  path: /repos/{owner}/{repo}/bypass-requests/secret-scanning
  http-method: get
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: delegated-bypass
x-github-releases:
  - ghec
  - ghes: '>= 3.17'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
  - $ref: '../../components/parameters/bypass-reviewer-name.yaml'
  - $ref: '../../components/parameters/bypass-requester-name.yaml'
  - $ref: '../../components/parameters/time-period.yaml'
  - $ref: '../../components/parameters/bypass-request-status.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
  - $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of the bypass requests.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/secret-scanning-bypass-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-bypass-request-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
