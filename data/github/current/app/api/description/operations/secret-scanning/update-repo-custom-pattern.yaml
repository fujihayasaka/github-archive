---
summary: Update a repository custom pattern
description: |-
  Updates a secret scanning custom pattern for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` or `security_events` scope to use this endpoint. If this endpoint is only used with public repositories, the token can use the `public_repo` scope instead.
tags:
  - secret-scanning
operationId: secret-scanning/update-repo-custom-pattern
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/custom-patterns#update-a-repository-custom-pattern'
x-github-internal:
  path: /repos/{owner}/{repo}/secret-scanning/custom-patterns/{pattern_id}
  http-method: patch
  published: false
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: custom-patterns
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.23'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
  - name: pattern_id
    in: path
    required: true
    schema:
      type: integer
    description: The ID of the custom pattern.
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/secret-scanning-custom-pattern-to-update.yaml'
      examples:
        default:
          $ref: '../../components/examples/secret-scanning-custom-pattern-update-request.yaml'
responses:
  '200':
    description: Pattern updated successfully.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/secret-scanning-custom-pattern.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-custom-pattern.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '412':
    $ref: '../../components/responses/precondition_failed.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
