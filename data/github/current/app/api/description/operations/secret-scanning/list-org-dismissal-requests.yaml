---
summary: List alert dismissal requests for secret scanning for an org
description: |-
  Lists requests to dismiss secret scanning alerts in an org.

  Delegated alert dismissal must be enabled on repositories in the org and the user must be an org admin, security manager,
  or have the "Review and manage secret scanning alert dismissal requests" permission to access this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/list-org-dismissal-requests
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/alert-dismissal-requests#list-alert-dismissal-requests-for-secret-scanning-for-an-org'
x-github-internal:
  path: /orgs/{org}/dismissal-requests/secret-scanning
  http-method: get
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.18'
parameters:
  - $ref: '../../components/parameters/org.yaml'
  - $ref: '../../components/parameters/repository-name-in-query.yaml'
  - $ref: '../../components/parameters/bypass-reviewer-name.yaml'
  - $ref: '../../components/parameters/bypass-requester-name.yaml'
  - $ref: '../../components/parameters/time-period.yaml'
  - $ref: '../../components/parameters/dismissal-request-status.yaml'
  - $ref: '../../components/parameters/per-page.yaml'
  - $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: A list of the alert dismissal requests.
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/secret-scanning-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-dismissal-request-items.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
