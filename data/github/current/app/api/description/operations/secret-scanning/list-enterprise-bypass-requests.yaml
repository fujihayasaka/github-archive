---
summary: List bypass requests for secret scanning for an enterprise
description: |-
  List requests to bypass secret scanning push protection in an enterprise.

  Delegated bypass must be enabled on repositories in the enterprise and the user must be a bypass reviewer to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/list-enterprise-bypass-requests
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/delegated-bypass#list-bypass-requests-for-secret-scanning-for-an-enterprise'
x-github-internal:
  path: /enterprises/{enterprise}/bypass-requests/secret-scanning
  http-method: get
  published: true
  owner: "@github/secret-scanning"
x-github:
