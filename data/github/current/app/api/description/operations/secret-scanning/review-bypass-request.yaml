---
summary: Review a bypass request for secret scanning
description: |-
  Approve or deny a request to bypass secret scanning push protection in a repository.

  Delegated bypass must be enabled on the repository and the user must be a bypass reviewer to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/review-bypass-request
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/delegated-bypass#review-a-bypass-request-for-secret-scanning'
x-github-internal:
  path: /repos/{owner}/{repo}/bypass-requests/secret-scanning/{bypass_request_number}
  http-method: patch
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: delegated-bypass
x-github-releases:
  - ghec
  - ghes: '>= 3.17'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: bypass_request_number
   in: path
   required: true
   description: The number that identifies the bypass request in a repository.
   schema:
     type: integer
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: string
            description: The review action to perform on the bypass request.
            enum:
              - approve
              - reject
          message:
            type: string
            description: A message to include with the review. Has a maximum character length of 2048.
        required:
          - status
          - message
      examples:
        default:
          value:
            status: "reject"
            message: This secret has not been revoked.
responses:
  '200':
    description: The review of the bypass request.
    content:
      application/json:
        schema:
          type: object
          properties:
            bypass_review_id:
              type: integer
              description: ID of the bypass review.
        examples:
          default:
            value:
              bypass_review_id: 1
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
