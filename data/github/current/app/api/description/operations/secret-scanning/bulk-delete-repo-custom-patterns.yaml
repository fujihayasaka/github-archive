---
summary: Bulk delete repository custom patterns
description: |-
  Bulk deletes secret scanning custom patterns for a repository.

  OAuth app tokens and personal access tokens (classic) need the `repo` or `security_events` scope to use this endpoint. If this endpoint is only used with public repositories, the token can use the `public_repo` scope instead.
tags:
  - secret-scanning
operationId: secret-scanning/bulk-delete-repo-custom-patterns
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/custom-patterns#bulk-delete-repository-custom-patterns'
x-github-internal:
  path: /repos/{owner}/{repo}/secret-scanning/custom-patterns
  http-method: delete
  published: false
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: custom-patterns
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.23'
parameters:
  - $ref: '../../components/parameters/owner.yaml'
  - $ref: '../../components/parameters/repo.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - patterns
        properties:
          patterns:
            type: array
            description: The list of custom patterns to delete.
            maxItems: 500
            items:
              $ref: '../../components/schemas/secret-scanning-custom-pattern-to-delete.yaml'
          post_delete_action:
            type: string
            description: |-
              What to do with alerts associated with the deleted patterns.
              `delete_alerts` permanently removes the alerts.
              `resolve_alerts` resolves the alerts as "pattern deleted".
              Defaults to `delete_alerts` when not specified.
            enum:
              - delete_alerts
              - resolve_alerts
            default: delete_alerts
      examples:
        default:
          $ref: '../../components/examples/secret-scanning-custom-pattern-bulk-delete-request.yaml'
responses:
  '204':
    description: All patterns deleted successfully.
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '412':
    $ref: '../../components/responses/precondition_failed.yaml'
