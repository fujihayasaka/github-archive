---
summary: Dismiss a response on a bypass request for secret scanning
description: |-
  Dissmiss a response given to a bypass request for secret scanning push protection in a repository.

  Delegated bypass must be enabled on the repository and the user must be a bypass reviewer to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/dismiss-bypass-response
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/delegated-bypass#dismiss-a-response-on-a-bypass-request-for-secret-scanning'
x-github-internal:
  path: /repos/{owner}/{repo}/bypass-responses/secret-scanning/{bypass_response_id}
  http-method: delete
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: delegated-bypass
x-github-releases:
  - ghec
  - ghes: '>= 3.17'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: bypass_response_id
   in: path
   required: true
   description: ID of the bypass response.
   schema:
     type: integer
responses:
  '204':
    description: Review was successfully dismissed.
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '422':
    $ref: '../../components/responses/validation_failed.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
