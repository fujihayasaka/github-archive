---
summary: Get an alert dismissal request for secret scanning
description: |-
  Gets a specific request to dismiss a secret scanning alert in a repository.

  Delegated alert dismissal must be enabled on the repository and the user must be an org admin, security manager,
  or have the "Review and manage secret scanning alert dismissal requests" permission to access this endpoint.
  Personal access tokens (classic) need the `security_events` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/get-dismissal-request
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/alert-dismissal-requests#get-an-alert-dismissal-request-for-secret-scanning'
x-github-internal:
  path: /repos/{owner}/{repo}/dismissal-requests/secret-scanning/{alert_number}
  http-method: get
  published: true
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: alert-dismissal-requests
x-github-releases:
  - ghec
  - ghes: '>= 3.18'
parameters:
 - $ref: '../../components/parameters/owner.yaml'
 - $ref: '../../components/parameters/repo.yaml'
 - name: alert_number
   in: path
   required: true
   description: The number that identifies the secret scanning alert in a repository.
   schema:
     type: integer
responses:
  '200':
    description: A single dismissal request.
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/secret-scanning-dismissal-request.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-dismissal-request-item.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '500':
    $ref: '../../components/responses/internal_error.yaml'
