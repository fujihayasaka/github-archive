---
summary: Bulk create organization custom patterns
description: |-
  Bulk creates secret scanning custom patterns for an organization.

  Personal access tokens (classic) need the `write:org` scope to use this endpoint.
tags:
  - secret-scanning
operationId: secret-scanning/bulk-create-org-custom-patterns
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/secret-scanning/custom-patterns#bulk-create-organization-custom-patterns'
x-github-internal:
  path: /orgs/{org}/secret-scanning/custom-patterns
  http-method: post
  published: false
  owner: "@github/secret-scanning"
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: true
  category: secret-scanning
  subcategory: custom-patterns
x-github-releases:
  - api.github.com
  - ghec
  - ghes: '>= 3.23'
parameters:
  - $ref: '../../components/parameters/org.yaml'
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - patterns
        properties:
          patterns:
            type: array
            description: The list of custom patterns to create.
            items:
              $ref: '../../components/schemas/secret-scanning-custom-pattern-to-create.yaml'
      examples:
        default:
          $ref: '../../components/examples/secret-scanning-custom-pattern-bulk-create-request.yaml'
responses:
  '201':
    description: All patterns created successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            created_patterns:
              type: array
              description: The list of successfully created custom patterns.
              items:
                $ref: '../../components/schemas/secret-scanning-custom-pattern.yaml'
        examples:
          default:
            $ref: '../../components/examples/secret-scanning-custom-pattern-bulk-create-response.yaml'
  '400':
    $ref: '../../components/responses/bad_request.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '422':
    description: Validation failed for one or more patterns.
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              description: A summary message describing the error.
            validation_errors:
              type: object
              description: A map of validation errors keyed by the zero-based index of the pattern that failed.
              additionalProperties:
                type: object
                properties:
                  errors:
                    type: array
                    description: List of validation errors for this pattern.
                    items:
                      $ref: '../../components/schemas/secret-scanning-custom-pattern-validation-error.yaml'
