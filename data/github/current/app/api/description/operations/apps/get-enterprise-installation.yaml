---
summary: Get an enterprise installation for the authenticated app
description: |-
  Enables an authenticated GitHub App to find its installation on a particular enterprise.

  You must use a [JWT](${externalDocsUrl}/apps/building-github-apps/authenticating-with-github-apps/#authenticating-as-a-github-app) to access this endpoint.
tags:
- apps
operationId: apps/get-enterprise-installation
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/apps/apps#get-an-enterprise-installation-for-the-authenticated-app'
parameters:
- $ref: '../../components/parameters/enterprise.yaml'
responses:
  '200':
    description: Response
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/installation.yaml'
        examples:
          default:
            $ref: '../../components/examples/installation.yaml'
x-github-releases:
- ghec
- ghes: '>= 3.21'
x-github:
  githubCloudOnly: true
  enabledForGitHubApps: false
  category: apps
  subcategory: apps
x-github-internal:
  path: '/enterprises/{enterprise}/installation'
  http-method: get
  service-tier: 2
  owner: '@github/ecosystem-apps'
  published: true
