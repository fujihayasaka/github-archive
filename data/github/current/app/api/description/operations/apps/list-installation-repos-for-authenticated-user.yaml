---
summary: List repositories accessible to the user access token
description: |-
  List repositories that the authenticated user has explicit permission (`:read`, `:write`, or `:admin`) to access for an installation.

  The authenticated user has explicit permission to access repositories they own, repositories where they are a collaborator, and repositories that they can access through an organization membership.

  The access the user has to each repository is included in the hash under the `permissions` key.
tags:
- apps
operationId: apps/list-installation-repos-for-authenticated-user
externalDocs:
  description: API method documentation
  url: '${externalDocsUrl}/rest/apps/installations#list-repositories-accessible-to-the-user-access-token'
parameters:
- $ref: '../../components/parameters/installation-id.yaml'
- $ref: '../../components/parameters/per-page.yaml'
- $ref: '../../components/parameters/page.yaml'
responses:
  '200':
    description: The access the user has to each repository is included in the hash
      under the `permissions` key.
    content:
      application/json:
        schema:
          type: object
          required:
          - total_count
          - repositories
          properties:
            total_count:
              type: integer
            repository_selection:
              type: string
            repositories:
              type: array
              items:
                allOf:
                  - $ref: '../../components/schemas/repository.yaml'
                  - type: object
                    properties:
                      custom_properties:
                        type: object
                        description: The custom properties that were defined for the repository. The keys are the custom property names, and the values are the corresponding custom property values. Present for org repos only.
                        additionalProperties: true
                    x-unpublished: Unpublished until the integration_installation_api_with_custom_properties feature flag ships. Custom Properties has to be added to the example when removing the feature flag.
        examples:
          default:
            $ref: '../../components/examples/repository-paginated.yaml'
    headers:
      Link:
        $ref: '../../components/headers/link.yaml'
  '404':
    $ref: '../../components/responses/not_found.yaml'
  '403':
    $ref: '../../components/responses/forbidden.yaml'
  '304':
    $ref: '../../components/responses/not_modified.yaml'
x-github-releases:
- ghec
- ghes: '>= 2.18'
- api.github.com
x-github:
  githubCloudOnly: false
  enabledForGitHubApps: false
  category: apps
  subcategory: installations
x-github-internal:
  path: '/user/installations/{installation_id}/repositories'
  http-method: get
  service-tier: 2
  owner: '@github/ecosystem-apps'
  published: true
x-githubEnterpriseOverlays:
  3.0 || 3.1 || 3.2:
    x-github:
      previews:
      - $ref: '../../components/x-previews/mercy.yaml'
        required: false
  '< 3.20':
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                repositories:
                  items:
                    allOf:
                      - $ref: '../../components/schemas/repository.yaml'
