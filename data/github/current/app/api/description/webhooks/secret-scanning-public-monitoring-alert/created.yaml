---
summary: |-
  This event occurs when secret scanning public monitoring alert is created. GitHub monitors secrets leaked across GitHub in real time. These findings may be associated with your enterprise.

  The authenticated user must be an enterprise owner or enterprise security manager.

  For activity relating to secret scanning alerts within your repositories, use the `secret_scanning_alert` event.
description: A secret attributed to a member of your enterprise was detected in a public repository outside the enterprise.
operationId: secret-scanning-public-monitoring-alert/created
externalDocs:
  url: "${externalDocsUrl}/webhooks/webhook-events-and-payloads#secret_scanning_public_monitoring_alert"
parameters:
- name: User-Agent
  in: header
  example: GitHub-Hookshot/123abc
  schema:
    type: string
- name: X-Github-Hook-Id
  in: header
  example: 12312312
  schema:
    type: string
- name: X-Github-Event
  in: header
  example: secret_scanning_public_monitoring_alert
  schema:
    type: string
- name: X-Github-Hook-Installation-Target-Id
  in: header
  example: 123123
  schema:
    type: string
- name: X-Github-Hook-Installation-Target-Type
  in: header
  example: business
  schema:
    type: string
- name: X-GitHub-Delivery
  in: header
  example: 0b989ba4-242f-11e5-81e1-c7b6966d2516
  schema:
    type: string
- name: X-Hub-Signature-256
  in: header
  example: sha256=6dcb09b5b57875f334f61aebed695e2e4193db5e
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/webhooks/secret-scanning-public-monitoring-alert-created.yaml'
responses:
  '200':
    description: Return a 200 status to indicate that the data was received successfully
