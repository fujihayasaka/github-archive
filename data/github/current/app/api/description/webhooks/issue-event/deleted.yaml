---
summary: |-
  This Webhook event occurs as a secondary effect of changes to the set of events associated with an issue. It is related to, but not identical to, the `issue` events themselves, in that it contains more information about the event than the `Issue` event does.

  It is intended for internal use as part of a live export process, not for customer processing.

  The deletion event occurs when the `IssueEvent` is deleted, it is not associated with the deletion of an issue.
description: |-
  An issue or pull request event has been deleted.
operationId: issue-event/deleted
externalDocs:
  url: '${externalDocsUrl}/webhooks/webhook-events-and-payloads#issue_event'
parameters:
  - name: User-Agent
    in: header
    example: GitHub-Hookshot/123abc
    schema:
      type: string
  - name: X-Github-Hook-Id
    in: header
    example: 12312312
    schema:
      type: string
  - name: X-Github-Event
    in: header
    example: issues
    schema:
      type: string
  - name: X-Github-Hook-Installation-Target-Id
    in: header
    example: 123123
    schema:
      type: string
  - name: X-Github-Hook-Installation-Target-Type
    in: header
    example: repository
    schema:
      type: string
  - name: X-GitHub-Delivery
    in: header
    example: 0b989ba4-242f-11e5-81e1-c7b6966d2516
    schema:
      type: string
  - name: X-Hub-Signature-256
    in: header
    example: sha256=6dcb09b5b57875f334f61aebed695e2e4193db5e
    schema:
      type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/webhooks/issue-event-deleted.yaml'
responses:
  '200':
    description: Return a 200 status to indicate that the data was received successfully
x-github-releases:
  - api.github.com
  - ghec
  - ghes:
      - '>=3.17'
x-github:
  githubCloudOnly: false
  category: webhooks
  subcategory: issue_event
  supported-webhook-types:
    - repository
    - organization
    - app
x-github-internal:
  http-method: post
  webhook-name: issue-event-deleted
  owner: '@github/migration-tools-reviewers'
  published: false
