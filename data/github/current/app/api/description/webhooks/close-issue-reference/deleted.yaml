---
summary: |-
  This event occurs when a close issue reference is created or removed. A close issue reference links a pull request to an issue so that merging the pull request will close the issue.

  For more information, see "[Linking a pull request to an issue](${externalDocsUrl}/issues/tracking-your-work-with-issues/linking-a-pull-request-to-an-issue)".

  To subscribe to this event, a GitHub App must have at least read-level access for the "Contents" repository permission.
description: |-
  The reference between an issue and a pull request was removed, so merging the pull request will no longer close the issue.
operationId: close-issue-reference/deleted
externalDocs:
  url: "${externalDocsUrl}/webhooks/webhook-events-and-payloads#close_issue_reference"
parameters:
- name: User-Agent
  in: header
  example: GitHub-Hookshot/123abc
  schema:
    type: string
- name: X-Github-Hook-Id
  in: header
  example: 12312312
  schema:
    type: string
- name: X-Github-Event
  in: header
  example: issues
  schema:
    type: string
- name: X-Github-Hook-Installation-Target-Id
  in: header
  example: 123123
  schema:
    type: string
- name: X-Github-Hook-Installation-Target-Type
  in: header
  example: repository
  schema:
    type: string
- name: X-GitHub-Delivery
  in: header
  example: 0b989ba4-242f-11e5-81e1-c7b6966d2516
  schema:
    type: string
- name: X-Hub-Signature-256
  in: header
  example: sha256=6dcb09b5b57875f334f61aebed695e2e4193db5e
  schema:
    type: string
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/webhooks/close-issue-reference-deleted.yaml'
responses:
  '200':
    description: Return a 200 status to indicate that the data was received successfully
x-github-releases:
- api.github.com
- ghec
- ghes:
  - ">=3.17"
x-github:
  githubCloudOnly: false
  category: webhooks
  subcategory: close_issue_reference
  supported-webhook-types:
  - repository
  - organization
  - app
x-github-internal:
  http-method: post
  webhook-name: close-issue-reference-deleted
  owner: "@github/migration-tools-reviewers"
  published: false
