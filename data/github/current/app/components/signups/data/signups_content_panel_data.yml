pages:
  - url_param: 'copilot-business'
    title: "Let's get you started with Copilot Business"
    page_content: |
      Copilot Business is available for organizations and enterprises that want control over Copilot policies, including which members can use Copilot. To begin using it, you'll need two things:

      - A personal user account
        Every person who uses GitHub signs in to a user account, which will be your identity on GitHub.
      - An organization or enterprise account
        Organizations are shared accounts where a large number of people can collaborate across many projects at once. Enterprises allow administrators to centrally manage policy and billing for multiple organizations.

      We'll hope you get started with both. Let's start by creating your personal user account.
